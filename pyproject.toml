[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atdd"
version = "3.82.2"
description = "ATDD Platform - Acceptance Test Driven Development toolkit"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "pyyaml",
    "pytest>=7.0",
    "pytest-xdist",
    "pytest-github-actions-annotate-failures",
    "jsonschema",
    "pytest-html",
    "radon>=5.0",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/afokapu/atdd"
Repository = "https://github.com/afokapu/atdd"
Issues = "https://github.com/afokapu/atdd/issues"
Changelog = "https://github.com/afokapu/atdd/releases"

[project.optional-dependencies]
dev = []
viz = ["streamlit", "st-link-analysis"]

[project.scripts]
atdd = "atdd.cli:cli"
# Pre-send classifier shim over `cmux send` — rejects raw `claude ...`
# launches that bypass `atdd spawn` (issue #662).
atdd-cmux-send = "atdd.coach.wrappers.atdd_cmux_send:console_main"
# Pty-owning persona shim — wraps the adapter command, tees output to
# output.log, drains cli-return.jsonl, and forwards stdin (#841).
atdd-shim = "atdd.coach.shim.__main__:main"

# Substrate pytest plugin (spec v12 §7.2, §9.3 — issues #411, #415).
# Auto-loaded by pytest whenever atdd is importable; the plugin itself
# early-returns when `.atdd/config.yaml::repo.substrate.enabled` is unset
# (toolkit mode), so non-substrate consumers see no behavior change.
[project.entry-points.pytest11]
atdd_substrate = "atdd.tester.substrate.plugin"

[tool.setuptools.packages.find]
where = ["src"]
# Validator fixture trees are SHIPPED AS DATA via package-data below.
# Excluding them here prevents setuptools from treating fixture sub-dirs
# (which sometimes carry __init__.py for test-import purposes) as
# importable packages, which in turn stops pip's compile-on-install from
# generating __pycache__/*.pyc beside the fixture sources.
exclude = ["atdd.*.validators.fixtures*"]

[tool.setuptools.package-data]
"atdd.coach.templates" = ["*.md"]
"atdd.coach.templates.hooks" = ["pre-commit"]
"atdd.coach.templates.harness" = ["*.mjs"]
"atdd.coach.templates.workflows" = ["*.yml"]
"atdd.coach.schemas" = ["*.json"]
"atdd.coach.prompts" = ["**/*.yaml"]
"atdd.coach.conventions" = ["*.yaml"]
"atdd.coach.overlays" = ["*.md"]
"atdd.planner.conventions" = ["*.yaml"]
"atdd.planner.schemas" = ["*.json"]
"atdd.tester.conventions" = ["*.yaml"]
"atdd.tester.schemas" = ["*.json"]
"atdd.coder.conventions" = ["*.yaml"]
"atdd.coder.schemas" = ["*.json"]
"atdd" = ["**/validators/fixtures/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/atdd", "tests"]
markers = [
    "tester: marks tests as tester validators",
    "platform: marks tests as platform validators",
    "github_api: marks tests that require live GitHub API access",
    "security: marks tests as security validators",
    "locale: marks tests as localization validators (Localization Manifest Spec v1)",
    "coder: marks tests as coder phase validators",
    "smoke: marks SMOKE-phase tests that verify against real infrastructure",
]
