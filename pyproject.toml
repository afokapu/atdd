[build-system]
requires = ["setuptools>=61.0"]
# #1172: in-tree build backend that resolves `version` from the State Store
# (local-first, with a `0.0.0+local` fallback when no store exists). It wraps
# setuptools.build_meta and adds nothing but the dynamic version.
build-backend = "atdd_version_backend"
backend-path = ["build_meta_shim"]

[project]
name = "atdd"
# #1172: version is sourced from the State Store at build time (see
# [tool.setuptools.dynamic] below) — no hand-edited `version =` line to conflict
# on across parallel PRs, and no GH006 direct-push bump.
dynamic = ["version"]
description = "ATDD Platform - Acceptance Test Driven Development toolkit"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "pyyaml",
    "pytest>=7.0",
    "pytest-xdist",
    "pytest-github-actions-annotate-failures",
    "jsonschema",
    "pytest-html",
    "radon>=5.0",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/afokapu/atdd"
Repository = "https://github.com/afokapu/atdd"
Issues = "https://github.com/afokapu/atdd/issues"
Changelog = "https://github.com/afokapu/atdd/releases"

[project.optional-dependencies]
# #1474: the packaging acceptances (E062, C008, C009) build a REAL wheel into a REAL
# venv — `_wheel_harness` shells out to `sys.executable -m build`. That makes `build`
# a test-time dependency of the toolkit's own validator suite, and an undeclared one
# is how it stays invisible: nothing imports it, so no import-discipline check sees
# it, and `atdd validate --local` just dies with an opaque CalledProcessError.
#
# These are NOT runtime dependencies. The acceptances that need them are
# `platform`-marked, so a consumer's `atdd validate <phase>` deselects them and never
# builds anything. Putting `build` in `dependencies` would make every consumer install
# a build backend for a test they never run.
dev = ["build>=1.0", "setuptools>=61.0", "wheel"]
viz = ["streamlit", "st-link-analysis"]

[project.scripts]
atdd = "atdd.cli:cli"
# Pre-send classifier shim over `cmux send` — rejects raw `claude ...`
# launches that bypass `atdd spawn` (issue #662).
atdd-cmux-send = "atdd.coach.wrappers.atdd_cmux_send:console_main"

# Substrate pytest plugin (spec v12 §7.2, §9.3 — issues #411, #415).
# Auto-loaded by pytest whenever atdd is importable; the plugin itself
# early-returns when `.atdd/config.yaml::repo.substrate.enabled` is unset
# (toolkit mode), so non-substrate consumers see no behavior change.
[project.entry-points.pytest11]
atdd_substrate = "atdd.tester.substrate.plugin"

# #1172: dynamic version resolved by the in-tree build backend (build_meta_shim).
# `atdd_version_backend.VERSION` is computed at build time from the State Store,
# falling back to `0.0.0+local` when no store is present.
[tool.setuptools.dynamic]
version = {attr = "atdd_version_backend.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
# Validator fixture trees are SHIPPED AS DATA via package-data below.
# Excluding them here prevents setuptools from treating fixture sub-dirs
# (which sometimes carry __init__.py for test-import purposes) as
# importable packages, which in turn stops pip's compile-on-install from
# generating __pycache__/*.pyc beside the fixture sources.
exclude = ["atdd.*.validators.fixtures*"]

# #1474: BROAD-SHIP + EXPLICIT-EXCLUDE. Ship every file under the package, and
# name only what must NOT ship.
#
# This block used to enumerate one glob per directory, and enumeration is what
# broke. A non-.py directory shipped only if someone remembered to add a glob for
# it, and when the conventions were atomised into `nodes/` nobody did:
# `atdd.coach.conventions` and `atdd.planner.conventions` gained `nodes/*.yaml`;
# `atdd.coder.conventions` and `atdd.tester.conventions` did not. So 78 rule-node
# YAMLs that `bind_rule()` reads AT IMPORT never shipped, and a consumer's
# `atdd validate coder` aborted at pytest collection (#1369). Same shape for
# `coach/schemas/*.md` (#663) and `coach/templates/bin/` (#952) — 174 of the 610
# non-.py files were absent from the wheel.
#
# Inverting the default makes the failure mode LOUD instead of silent: a new data
# directory ships by construction, and omitting one now takes a deliberate,
# reviewable entry in the deny-list below. `test_wheel_completeness` is the gate
# that holds this honest; the `validate-consumer` CI job is the oracle that proves
# it against a real install.
[tool.setuptools.package-data]
"atdd" = ["**/*"]

# The deny-list: build/OS cruft, and NOTHING ELSE. The invariant is deliberately
# blunt — **the wheel is the source tree minus cruft**.
#
# It is tempting to also exclude `**/*.py` here, on the reasoning that setuptools
# already installs .py as MODULES so the data copy is redundant. That is wrong, and
# it silently drops 21 files: the `.py` under `**/validators/fixtures/**` are not
# modules at all. `[tool.setuptools.packages.find] exclude` deliberately keeps those
# directories from being importable packages, so nothing installs them as code —
# they are DATA (fixture sources that validators read and parse), and a `**/*.py`
# deny-list is the one thing that would remove them. Excluding nothing but cruft
# sidesteps the whole "is this .py a module or data?" question, which is a question
# the packaging config has no business having to answer correctly.
#
# The `"*"` key is load-bearing — it means EVERY package. setuptools resolves
# exclusions PER PACKAGE, so a `"atdd"` key alone under-applies to files collected
# under a subpackage (e.g. `atdd.coach.validators`) and lets byte-code through.
[tool.setuptools.exclude-package-data]
"*" = [
    "**/*.pyc",
    "**/*.pyo",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/.DS_Store",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/atdd", "tests"]
markers = [
    "tester: marks tests as tester validators",
    "platform: marks tests as platform validators",
    "github_api: marks tests that require live GitHub API access",
    "security: marks tests as security validators",
    "locale: marks tests as localization validators (Localization Manifest Spec v1)",
    "coder: marks tests as coder phase validators",
    "smoke: marks SMOKE-phase tests that verify against real infrastructure",
    "parity: marks the lifecycle parity gate (required-CI; docs/coach-decomposition.md §10.1)",
]
