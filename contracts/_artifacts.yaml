artifacts:
- id: commons:coach:canonical-surface-name
  urn: contract:commons:coach:canonical-surface-name
  version: 1.0.0
  title: CommonsCoachCanonicalSurfaceName
  description: 'The role-aware canonical name shape for a coach-managed multiplexer
    surface or workspace (issue #865). Format `<REPO><N>[-phaseN]-<role>-<slug>`,
    role in {worker, coach-daemon, observer}, reusing the #470 naming primitive. Produced
    by the enforce-surface-conformance feature; consumed by the bound naming-drift
    validator and the dispatch conformance pass to detect and re-apply non-canonical
    names.'
  path: contracts/commons/coach/canonical-surface-name.schema.json
  producer: wagon:consolidate-coach-workspace
  consumers:
  - wagon:consolidate-coach-workspace
- id: commons:compliance:gate
  urn: contract:commons:compliance:gate
  version: 1.0.0
  title: CommonsComplianceGate
  description: ATDD gate verification output — confirms agent loaded rules correctly
  path: contracts/commons/compliance/gate.schema.json
  producer: wagon:govern-lifecycle
  consumers: []
- id: commons:compliance:inventory
  urn: contract:commons:compliance:inventory
  version: 1.0.0
  title: CommonsComplianceInventory
  description: Repository inventory output — catalogs all ATDD artifacts
  path: contracts/commons/compliance/inventory.schema.json
  producer: wagon:govern-lifecycle
  consumers: []
- id: commons:decision:escalation
  urn: contract:commons:decision:escalation
  version: 1.0.0
  title: CommonsDecisionEscalation
  description: An external signal that a worker decision cannot be safely auto-mediated
    and needs a human. Produced by the mediate-decision feature whenever the safety
    gate fires or the coach cannot be parsed/answers too slowly.
  path: contracts/commons/decision/escalation.schema.json
  producer: wagon:mediate-worker-decisions
  consumers: []
- id: commons:decision:record
  urn: contract:commons:decision:record
  version: 1.0.0
  title: CommonsDecisionRecord
  description: 'The durable, externally-observable audit record of a mediated decision:
    what was asked, what was decided (or that it was escalated), and what happened
    when it was applied. Produced by the apply-decision feature; consumed by the observer/ledger.'
  path: contracts/commons/decision/record.schema.json
  producer: wagon:mediate-worker-decisions
  consumers:
  - wagon:observe-and-correct
- id: commons:decision:request
  urn: contract:commons:decision:request
  version: 1.0.0
  title: CommonsDecisionRequest
  description: A blocked worker's decision prompt, normalized from a cmux notification
    (or the emit CLI), ready for coach mediation. Flows from the sense-decision feature
    to the mediate-decision feature.
  path: contracts/commons/decision/request.schema.json
  producer: wagon:mediate-worker-decisions
  consumers:
  - wagon:mediate-worker-decisions
- id: commons:decision:verdict
  urn: contract:commons:decision:verdict
  version: 1.0.0
  title: CommonsDecisionVerdict
  description: 'The mediated outcome of a decision request. disposition encodes the
    safety guarantee in the contract itself: a human_required verdict carries no selected
    option and MUST NOT be auto-applied. Flows from the mediate-decision feature to
    the apply-decision feature.'
  path: contracts/commons/decision/verdict.schema.json
  producer: wagon:mediate-worker-decisions
  consumers:
  - wagon:mediate-worker-decisions
- id: commons:error:response
  urn: contract:commons:error:response
  version: 1.0.0
  title: CommonsErrorResponse
  description: Structured error response contract for all HTTP endpoints. All error
    responses MUST conform to this shape for consistent client-side handling.
  path: contracts/commons/error/response.schema.json
  producer: wagon:verify-contracts
  consumers:
  - wagon:implement-code
- id: commons:feed:blocked-item
  urn: contract:commons:feed:blocked-item
  version: 1.0.0
  title: CommonsFeedBlockedItem
  description: 'One pending blocked-decision entry as it appears in ''cmux rpc feed.list''
    for a spawned worker. This is the boundary contract of the daemon''s journey:
    the surface-worker-decisions feature (producer) guarantees a worker''s escalation-worthy
    decision is published in this shape, and bridge-cmux-feed''s CmuxFeedSource (consumer)
    reads exactly these fields into its frozen FeedItem. Mirrors src/atdd/mediate_worker_decisions/bridge_cmux_feed/src/domain/feed_item.py.
    Only kinds question | permission | exitPlan are blocked decisions; toolUse/telemetry
    entries are not.'
  path: contracts/commons/feed/blocked-item.schema.json
  producer: wagon:mediate-worker-decisions
  consumers:
  - wagon:mediate-worker-decisions
- id: frontend:train:render-metadata
  urn: contract:frontend:train:render-metadata
  version: 1.0.0
  title: FrontendTrainRenderMetadata
  description: Optional render-content expectations attached to a train manifest.
    Consumed by tester validator test_train_renders_content.py to verify that mounting
    the train produces non-empty, non-stub DOM output. SPEC-CODER-TRAIN-0003.
  path: contracts/frontend/train/render-metadata.schema.json
  producer: wagon:govern-lifecycle
  consumers:
  - wagon:govern-lifecycle
