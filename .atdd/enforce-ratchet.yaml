# Enforcement ratchet baseline (#1428 E003) — a DEBT REGISTER, not an exemption.
#
# Each entry records the violation count a rule carried when the enforce job was
# made BLOCKING (#1428 E001). A rule at or below its count is held FLAT; a rule
# ABOVE it FAILS; a rule absent from this register is held to ZERO.
#
# The ratchet may only ever be TIGHTENED. To pay debt down, fix violations and
# re-record:  atdd enforce --paths <scope> --record-ratchet .atdd/enforce-ratchet.yaml
# NEVER raise a count to make a red build green — that is what the gate is for.

version: 1
# The scan scope these counts were recorded over (CI uses the same).
scope:
  - src/atdd

rules:
  coder.dead-code.reachability:                                   54
  coder.dead-code.reachability-typescript:                        16
  coder.design.orphan-ui:                                         5
  coder.design.primitives:                                        5
  coder.error-response.code-format:                               1
  coder.logging.coach-silent-swallow:                             230
  coder.logging.structured:                                       15
  coder.refactor.complexity-cognitive:                            120
  coder.refactor.complexity-cyclomatic:                           139
  coder.refactor.complexity-length:                               66
  coder.refactor.complexity-nesting:                              162
  coder.refactor.composition-consumer:                            3
  coder.refactor.composition-root:                                1
  coder.refactor.quality-comments:                                12
  coder.refactor.quality-duplication:                             48
  coder.refactor.quality-file-length:                             37
  coder.refactor.quality-mi:                                      11
  coder.refactor.quality-naming:                                  1
  coder.security.sql-injection:                                   1
  tester.acceptance-violation.live-smoke-acceptance-must-execute: 1
  tester.acceptance-violation.metric-implementation-must-exist:   1
