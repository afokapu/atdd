# Observer rule 05 — Missed heartbeat (spec §8.3 row 05 / §10
# observer.process_silence_seconds)
#
# Fires when no `heartbeat.json` has been written for longer than the
# configured threshold. Heartbeat-based liveness complements token-based
# liveness (rule 02) — the agent's process is alive but stuck.
#
# Authored as part of issue #506 (L2 basic-protocol observer rules).

rule_id: "coach.observer.missed-heartbeat"

trigger:
  type: heartbeat_stale
  threshold_seconds: 300  # 5 minutes; spec §10 default for process_silence_seconds

correction_text: |
  No heartbeat for {age_seconds}s (threshold: 300s).
  Call `atdd agent heartbeat` after each significant action.

injection_method: cli-return
severity: 3
disposition: documentation-only
