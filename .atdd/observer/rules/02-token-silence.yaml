# Observer rule 02 — Token silence (spec §8.3 row 02 / §10
# observer.activity_silence_seconds default 90s)
#
# Fires when no tokens have been observed for longer than the configured
# silence threshold. Detects stuck agents in observer-time rather than
# waiting for human notice.
#
# Authored as part of issue #506 (L2 basic-protocol observer rules).

rule_id: "coach.observer.token-silence"

trigger:
  type: token_silence
  threshold_seconds: 90  # spec §10 default

correction_text: |
  No tokens observed for {duration_seconds}s (threshold: 90s).
  If you are blocked, escalate via `atdd agent escalate`.

injection_method: cli-return
severity: 3
disposition: advisory
