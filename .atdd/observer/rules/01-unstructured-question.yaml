# Observer rule 01 — Unstructured question (spec §8.3 row 01)
#
# Fires when an agent emits a free-form question outside the
# structured `atdd agent ask --type ...` invocation surface.
# Routed through the structured CLI is a precondition for downstream
# judge / escalation routing per the v9 spec.
#
# Authored as part of issue #506 (L2 basic-protocol observer rules).

rule_id: "coach.observer.unstructured-question"

trigger:
  type: log_regex
  # A line that looks like a free-form question:
  #   - ends with a question mark, OR
  #   - opens with a wh- / aux interrogative word followed by content.
  pattern: '(\?\s*$)|(^\s*(what|why|how|when|where|who|should|can|could|would|do|does|is|are)\b.+)'
  # Don't fire if the same window contains a structured ask invocation.
  exclude_pattern: 'atdd agent ask'

correction_text: |
  Free-form question detected. Reformulate via `atdd agent ask --type ...`
  so the structured-protocol routing can deliver it to the right surface.

injection_method: cli-return
severity: 3
disposition: advisory
