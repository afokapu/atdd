# Surface -> worker registry for wagon:mediate-worker-decisions (MVP).
#
# DEPRECATED since 3.88.0 — superseded by the bridge-cmux-feed Feed integration
# (atdd.mediate_worker_decisions.bridge_cmux_feed). This registry feeds the
# screen-scrape path (CmuxSurfaceReader / CmuxCoachClient); the Feed path is the
# channel now. Slated for removal in 3.90.0.
#
# Maps each cmux surface that runs a worker agent to that worker, and names the
# coach surface that answers decisions. A later follow-up derives this from live
# .atdd/runtime state instead of a hand-maintained file (see issue #955 scope).

# cmux surface refs are workspace-scoped, so the bridge needs the workspace ref
# to read/write surfaces. MVP assumes coach + workers share one workspace.
workspace_id: "workspace:1"

coach:
  surface_id: "surface:1"
  role: coach

workers:
  feature_validator_discovery:
    surface_id: "surface:2"
    run_id: ""
    agent_handle_ref: ""
  feature_validator_execution:
    surface_id: "surface:3"
    run_id: ""
    agent_handle_ref: ""
  glue:
    surface_id: "surface:4"
    run_id: ""
    agent_handle_ref: ""

policy:
  # Dangerous actions are never auto-applied — the safety gate escalates them.
  # (Enforced in code by mediate_decision.safety_classifier; listed here for operators.)
  require_human_for:
    - "git push"
    - "git merge"
    - "gh pr merge"
    - "rm -rf"
    - "destructive migration"
