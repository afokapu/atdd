# Declared core-rule retirements (#1714 E004) — a LEDGER OF SANCTIONED DELETIONS,
# not an exemption list.
#
# A core rule that leaves core on purpose, its obligation carried onward by an
# extension node, leaves that node's source.legacy_rule_id naming a rule that is no
# longer there. So does a STALE MIRROR whose core rule was merely renamed. The two
# are identical in the data, so the difference cannot be read off the node — it is
# declared here, keyed on the retired core rule_id.
#
# Rules:
#   * an entry MUST name the issue that retired the rule (`retired_in`). A
#     retirement with no evidence it was sanctioned cannot be told from one
#     invented to silence a red gate.
#   * `superseded_by` MUST be present. List the rule(s) now carrying the
#     obligation, or [] to say the rule was withdrawn outright — omitting it
#     cannot be told from forgetting it.
#   * an ABSENT ledger retires nothing. Deleting this file does not green a gate.
#   * never add an entry to quiet a finding you have not traced to a deliberate
#     deletion. That is the silent drop the whole mechanism exists to prevent.
#
# Read by atdd.enforce.retirements; consumed by mirror coherence today and by the
# succession guard once #1993 lands (its twinless branch needs this same fact).

