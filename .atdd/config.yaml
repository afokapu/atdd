version: '1.0'
train:
  runner: jsonl
  concurrency:
    max_parallel_issues: 4
  resume:
    auto_resume_on_start: false
  conventions:
    snapshot_on_run_start: true
release:
  version_file: pyproject.toml
  tag_prefix: v
code:
  toolkit: src/atdd
themes:
  '0': commons
  '1': plan
  '2': test
  '3': code
  '4': coach
sync:
  agents:
  - claude
init:
  skip_workflows: true
coverage:
  exceptions:
    features_without_implementation:
    - feature:self-compliance-migration:bootstrap-compliance
no_stub_presentation:
  scan_dirs: []
  allowlist: []
route_train_wagon_coverage:
  router_patterns:
  - web/src/**/router.ts
  - web/src/**/router.tsx
  - web/src/**/routes.ts
  - web/src/**/routes.tsx
  - web/src/**/*-routes.ts
  - web/src/**/*-routes.tsx
  - web/src/**/App.tsx
  allowlist: []
toolkit:
  last_version: 4.39.0
github:
  repo: afokapu/atdd
coach:
  token_alert_threshold: 400000
gate:
  transitions:
    PLANNED->RED: true
    SMOKE->REFACTOR: true
validators:
  conventions_authoritative: true
interlocking_layout:
  python_runtime:
  - src/atdd/runtime/interlocking/*.py
  station_master:
  - src/atdd/runtime/interlocking/station_master.py
