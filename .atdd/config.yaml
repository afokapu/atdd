version: '1.0'
# TrainRunner backend selection (docs/coach-decomposition.md §7.4, Child 8 #895).
# Only `jsonl` is implemented; `temporal`/`langgraph` are reserved names that
# raise NotImplementedError until §7.2/§7.3 land.
train:
  runner: jsonl                   # jsonl | temporal | langgraph
  concurrency:
    max_parallel_issues: 4
  resume:
    auto_resume_on_start: false   # if true, atdd coach <N> resumes existing run for N
  conventions:
    snapshot_on_run_start: true   # always true; here for visibility
release:
  version_file: pyproject.toml
  tag_prefix: v
code:
  # Only the toolkit's own implementation root is declared. The game-template
  # defaults (python/supabase/web) live in DEFAULT_CODE_ROOTS and are merged by
  # get_code_roots() for read-side coverage validators; they are intentionally
  # NOT declared here so the registry build does not stub python//supabase/
  # mirror dirs into this repo (#984, sibling of #970).
  toolkit: src/atdd
sync:
  agents:
  - claude
init:
  skip_workflows: true
coverage:
  exceptions:
    features_without_implementation:
    - feature:self-compliance-migration:bootstrap-compliance
no_stub_presentation:
  scan_dirs: []
  allowlist: []
route_train_wagon_coverage:
  router_patterns:
  - web/src/**/router.ts
  - web/src/**/router.tsx
  - web/src/**/routes.ts
  - web/src/**/routes.tsx
  - web/src/**/*-routes.ts
  - web/src/**/*-routes.tsx
  - web/src/**/App.tsx
  allowlist: []
toolkit:
  last_version: 3.83.4
github:
  repo: afokapu/atdd
  project_number: 1
  project_id: PVT_kwHOAIbyOM4BPpKf
  field_schema: atdd/coach/schemas/project_fields.schema.json
babysit:
  token_alert_threshold: 400000
