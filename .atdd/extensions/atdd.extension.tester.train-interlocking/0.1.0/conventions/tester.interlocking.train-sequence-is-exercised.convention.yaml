schema_version: 1.1.0
rule_id: tester.interlocking.train-sequence-is-exercised
kind: rule
# DRAFT, and the word is load-bearing. The obligation is authored and its validator
# exists and is tested, but it is realized by `scan_execution()` which the gated
# `scan_root()` deliberately does not call. Shipping it `active` would claim an
# enforcement that never runs — a rule that says it checks and does not. It becomes
# `active` in the same change that wires the check into the gate.
status: draft
name: Some test exercises the wagon sequence each declared train actually runs
statement: >-
  Every train reachable from a declared interlocking route MUST have a test that asserts the wagon
  SEQUENCE it executes — the ordered steps, not merely which train was selected. Route resolution
  and trace binding both prove WHICH train was chosen; neither proves WHAT it ran. Without this a
  train definition can be reordered, shortened or emptied and the suite stays green.
terms:
- term_id: wagon_sequence
  text: >-
    the ordered `sequence:` of a train definition, and the ordered steps a TrainRunner reports
    having executed. The obligation is that a test compares the two, in order.
- term_id: selection_is_not_execution
  text: >-
    `route-coverage` proves an admissible route is exercised; `trace-binds-declared-route` proves
    the run is attributable to its declared route. Both are statements about SELECTION. A train
    whose sequence is wrong is selected correctly and runs the wrong thing.
- term_id: disposition_rationale
  text: >-
    advisory because no consumer or fixture satisfies it yet, and because the check is staged
    rather than gated. The measurement below was TAKEN, not recalled.
  values:
    measured_2026_09_07: >-
      On a data-driven consumer whose TrainRunner genuinely reads the train definition, replacing
      a train's entire wagon sequence in the plan left the consumer's own e2e suite at 4 passed.
      The runtime obeyed the new plan; no test looked.
    measurement_target: the consumer repo built for the interlocking end-to-end experiment
    escalate_when: >-
      Consumer suites assert executed sequences and the check has been wired into
      gates/interlocking-coverage.gate.yaml. Enabling it is a GATE change; the detector is staged.
content:
  summary: >-
    The tester half of `coder.train.runtime-executes-the-declaration`. That rule makes the runtime
    READ the plan. This one makes the suite prove it OBEYS it — the two are worth nothing apart.
  normative_text: |
    THE PAIRING IS THE POINT. A runtime that reads the plan but is never tested against it can
    still drift: the plan is edited, the runtime dutifully executes the new sequence, and no test
    notices because none ever asserted what ran. A suite that asserts a sequence against a runtime
    that hardcodes it proves only that the hardcoding is self-consistent. Both halves are needed
    before "the train YAML is the source of truth" is a checkable claim rather than a slogan.

    Demonstrated rather than argued: on a consumer whose TrainRunner genuinely loads the train
    definition, replacing a train's whole `sequence:` in the plan left its suite green. The
    runtime had changed behaviour completely; the tests were looking somewhere else.
  fix_hint: |
    Assert the executed order against the declaration, in order:

      def test_standard_train_runs_its_declared_sequence():
          trace = TrainRunner(path).execute(train_id, {})
          declared = [s["wagon"] for s in yaml.safe_load(Path(path).read_text())["sequence"]]
          assert trace["steps"] == declared

    Reading the expected order FROM the plan rather than restating it as literals is what makes
    the test track the declaration instead of a copy of it.
  exceptions:
  - A consumer that declares no interlocking route space carries no obligation.
  - A train reachable by no declared route is out of scope; this rule follows the route space.
metadata:
  aliases:
  - TESTER-TRAIN-SEQUENCE-001
  severity: 2
  disposition: advisory
  introduced_in: 0.1.0
  core_design_refs:
