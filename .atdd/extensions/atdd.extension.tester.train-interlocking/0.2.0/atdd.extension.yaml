schema_version: "1.0.0"

# Official ATDD train-interlocking tester extension.
#
# PERSONA SPLIT (afokapu/atdd#1531). This package is the tester-lane half of the
# former `atdd.extension.train-interlocking-enforcement`, which declared
# `role: coder` yet co-hosted these four `tester.interlocking.*` conventions — a
# persona-lie the four-segment grammar (afokapu/atdd#1343) exists to prevent.
# The coder source-surface rules now live in the sibling
# `atdd.extension.coder.train-interlocking`. This package owns the TEST-surface
# (tester) rules: interlocking route coverage, production-runner usage, Station
# Master smoke coverage, and trace-binds-declared-route.
#
# Boundary model (CONTRIBUTING.md "The Four Layers" + boundary spec §6.2):
#   - This EXTENSION owns the rules (conventions) + implementation (validator).
#   - The WORKSPACE PROVIDER (atdd.workspace.python-pytest) owns the reusable
#     runtime; it is referenced by id + contract range, never bundled here.
#   - The implementation declares the provider it targets + a contract_version.
#   - core<->extension references (the train-interlocking core design) are declared
#     NARRATIVELY here + in README, never as relationship-graph edges (§6.2).
#   - The one cross-persona relationship to the coder package's
#     `coder.train.interlocking-bilateral-binding` (its trace_to_declaration
#     direction relates to `trace-binds-declared-route`) is declared NARRATIVELY
#     in README, never as a graph edge — cross-extension edges are forbidden (§6.2).
#
# Core design this extension enforces (already merged to atdd core main):
#   afokapu/atdd#1246 — parent: train interlocking route-control model
#   afokapu/atdd#1248 — planner artifact: interlocking YAML + projections (CLOSED)
#   afokapu/atdd#1251 — runtime: InterlockingRunner called by Station Master,
#                       delegates to TrainRunner (the production path the coverage
#                       validator proves is exercised by real e2e tests)
#   afokapu/atdd-extensions#23 — extension enforcement parent
extension_id: atdd.extension.tester.train-interlocking
version: "0.2.0"
kind: extension

# This package's headline deliverable is proving the consumer-repo TEST surface
# actually exercises every admissible interlocking route through the production
# runners — a test-surface (tester) concern. Every convention it owns is a
# `tester.interlocking.*` rule, so the persona segment is honest.
role: tester
flow_wagon: validate-test-surface
feature: train-interlocking-enforcement

owns:
  conventions:
    - conventions/tester.interlocking.production-runner-used.convention.yaml
    - conventions/tester.interlocking.route-coverage.convention.yaml
    - conventions/tester.interlocking.smoke-coverage-for-station-master.convention.yaml
    - conventions/tester.interlocking.trace-binds-declared-route.convention.yaml
    - conventions/tester.interlocking.train-sequence-is-exercised.convention.yaml
  relationships:
    - relationships.yaml
  implementations:
    - implementations/interlocking-coverage
  schemas: []
  gates:
    - gates/interlocking-coverage.gate.yaml
  scopes:
    - scopes/interlocking-targets.scope.yaml

depends_on:
  # `core: []` — the five `atdd.core.*` ids previously listed here do not exist.
  # The 231 real core nodes are namespaced coder.* / tester.* / coach.*, and
  # admission never validates this field, so the declaration pointed at nothing.
  # An empty list is what `atdd author extension init` scaffolds. (Carried over
  # from main's 9ccb9a3, which dropped these dead deps after this branch forked;
  # the coder lane picked it up through a rebase conflict, this lane did not.)
  core: []
  # The reusable runtime the coverage validator targets. It scans e2e/ production
  # tests inside the python-pytest provider. Referenced by id + contract range;
  # never copied in.
  workspaces:
    - id: atdd.workspace.python-pytest
      contract: "^1.0.0"

removal_policy:
  allowed_if_no_external_dependents: true
