schema_version: "1.0.0"

# Extension-LOCAL relationship graph for atdd.extension.coder.train-interlocking.
#
# PERSONA SPLIT (afokapu/atdd#1531): this graph is the coder-lane half of the
# former `atdd.extension.train-interlocking-enforcement` graph. The four
# `tester.interlocking.*` nodes and their edges moved to the sibling
# `atdd.extension.tester.train-interlocking` graph.
#
# IMPORTANT (boundary spec §6.2): core<->extension edges are NOT authored here.
# The core train-interlocking design nodes these conventions realize
# (afokapu/atdd#1246/#1248/#1249/#1251) are declared NARRATIVELY — in
# atdd.extension.yaml's header + depends_on, in this package's README mapping
# table, and in each convention node's body — never as relationship-graph edges.
# Likewise implementation -> workspace-provider-contract is declared in each
# implementations/<name>/atdd.implementation.yaml (targets_workspace + contract_version),
# not as a graph edge. Only extension-INTERNAL edges live here.
#
# CROSS-PERSONA RELATIONSHIP DEMOTED TO NARRATIVE (§6.2, afokapu/atdd#1531):
# before the split, `coder.train.interlocking-bilateral-binding` carried a
# `relates-to` edge to `tester.interlocking.trace-binds-declared-route` (its
# trace_to_declaration direction). That node now lives in a SEPARATE extension,
# and cross-extension edges are forbidden. The relationship is preserved as prose
# in README ("Cross-persona relationship") — bilateral-binding's
# trace_to_declaration direction proves the asserted interlocking_id/route_id
# VALUES resolve back to a declared route, complementing the tester package's
# trace-binds-declared-route (which proves a trace asserts every required field).
graph_id: atdd.extension.coder.train-interlocking.relationships

# Coverage matrix (afokapu/atdd-extensions#24) — every convention is linked,
# machine-readably, to: convention -> implementation (realized-by), convention ->
# scope (scoped-by), convention -> gate (gated-by). implementation -> workspace
# contract and convention -> core design reference are NARRATIVE per §6.2.
nodes:
  - coder.train.runtime-executes-the-declaration
  # --- #25 five granular coder runtime-infrastructure conventions ---
  - coder.train.interlocking-runner-exists
  - coder.train.interlocking-resolution-model-exists
  - coder.train.station-master-interlocking-routing
  - coder.train.interlocking-delegates-to-trainrunner
  - coder.train.interlocking-does-not-carry-cargo
  # --- #27 bilateral declaration<->runtime<->station<->trace binding (systemic closure) ---
  - coder.train.interlocking-bilateral-binding
  # --- runtime-machinery definition anchors (kind: family, advisory) ---
  # Coder-layer semantic anchors for the runtime concepts the enforcing rules above
  # operationalize. Each connects via `type: relates-to` to the existing enforcer(s)
  # that make its meaning enforceable (the extension graph has no directional
  # `requires` semantics — that vocabulary is the core planner graph's, not this one).
  - coder.train.train-runner.definition
  - coder.train.interlocking-runner.definition
  - coder.train.cargo.definition
  - coder.train.station-master.definition
  - coder.train.executional-machinery.definition


edges:
  - source_ref: coder.train.interlocking-runner-exists
    target_ref: implementations/interlocking-infrastructure
    type: realized-by
    reason: 'The detector flags a missing InterlockingRunner class / resolve_train under this rule_id.'
  - source_ref: coder.train.interlocking-runner-exists
    target_ref: scopes/interlocking-targets.scope.yaml
    type: scoped-by
    reason: 'Bound to the python_runtime selector (python/trains/**/*.py) the detector inspects.'
  - source_ref: coder.train.interlocking-runner-exists
    target_ref: gates/interlocking-infrastructure.gate.yaml
    type: gated-by
    reason: 'A missing route-control layer is a hard CI/strict defect.'
  - source_ref: coder.train.interlocking-resolution-model-exists
    target_ref: implementations/interlocking-infrastructure
    type: realized-by
    reason: 'The detector flags a bare-train_id resolution (no InterlockingResolution model) under this rule_id.'
  - source_ref: coder.train.interlocking-resolution-model-exists
    target_ref: scopes/interlocking-targets.scope.yaml
    type: scoped-by
    reason: 'Bound to the python_runtime selector where InterlockingResolution is defined.'
  - source_ref: coder.train.interlocking-resolution-model-exists
    target_ref: gates/interlocking-infrastructure.gate.yaml
    type: gated-by
    reason: 'Unstructured route resolution is a hard CI/strict defect.'
  - source_ref: coder.train.station-master-interlocking-routing
    target_ref: implementations/interlocking-infrastructure
    type: realized-by
    reason: 'The detector flags an unlinked / non-delegating Station Master under this rule_id.'
  - source_ref: coder.train.station-master-interlocking-routing
    target_ref: scopes/interlocking-targets.scope.yaml
    type: scoped-by
    reason: 'Bound to the station_master selector (python/app.py) the detector inspects.'
  - source_ref: coder.train.station-master-interlocking-routing
    target_ref: gates/interlocking-infrastructure.gate.yaml
    type: gated-by
    reason: 'A Station Master not routing through InterlockingRunner -> TrainRunner is a hard CI/strict defect.'
  - source_ref: coder.train.interlocking-delegates-to-trainrunner
    target_ref: implementations/interlocking-infrastructure
    type: realized-by
    reason: 'The detector flags direct wagon execution from the interlocking layer under this rule_id.'
  - source_ref: coder.train.interlocking-delegates-to-trainrunner
    target_ref: scopes/interlocking-targets.scope.yaml
    type: scoped-by
    reason: 'Bound to the python_runtime selector where the InterlockingRunner module lives.'
  - source_ref: coder.train.interlocking-delegates-to-trainrunner
    target_ref: gates/interlocking-infrastructure.gate.yaml
    type: gated-by
    reason: 'An interlocking that executes wagons / duplicates TrainRunner is a hard CI/strict defect.'
  - source_ref: coder.train.interlocking-does-not-carry-cargo
    target_ref: implementations/interlocking-infrastructure
    type: realized-by
    reason: 'The detector flags Cargo bleed and wagons importing interlocking code under this rule_id.'
  - source_ref: coder.train.interlocking-does-not-carry-cargo
    target_ref: scopes/interlocking-targets.scope.yaml
    type: scoped-by
    reason: 'Bound to the python_runtime selector (InterlockingRunner module + wagon modules).'
  - source_ref: coder.train.interlocking-does-not-carry-cargo
    target_ref: gates/interlocking-infrastructure.gate.yaml
    type: gated-by
    reason: 'Cargo escaping TrainRunner execution is a hard CI/strict defect.'
  - source_ref: coder.train.interlocking-bilateral-binding
    target_ref: implementations/interlocking-binding
    type: realized-by
    reason: 'The python-pytest detector (implementation_id coder.train.interlocking-bilateral-binding.impl) walks the consumer tree''s interlocking YAML route space, Station Master JOURNEY_MAP, InterlockingRunner runtime, and e2e trace tests and emits RAW v1.1 violations under this rule_id for any broken binding direction. The impl manifest carries the reciprocal realizes_convention + targets_workspace/contract_version.'
  - source_ref: coder.train.interlocking-bilateral-binding
    target_ref: scopes/interlocking-targets.scope.yaml
    type: scoped-by
    reason: 'Bound to ALL interlocking selectors — interlocking_yaml + train_yaml (declaration, core afokapu/atdd#1248), station_master + python_runtime (Station Master JOURNEY_MAP + InterlockingRunner, core afokapu/atdd#1251), and e2e_tests (the trace tests) — because bilateral binding is a closure across every interlocking surface.'
  - source_ref: coder.train.interlocking-bilateral-binding
    target_ref: gates/interlocking-binding.gate.yaml
    type: gated-by
    reason: 'Runs at mode: strict on CI; a broken binding direction (unresolvable declared route, hidden runtime route, dangling Station Master mapping, unreachable exposed interlocking, or a trace that does not resolve to its declaration) is a blocking silent-drift defect.'
  - source_ref: coder.train.interlocking-bilateral-binding
    target_ref: coder.train.station-master-interlocking-routing
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'station-master-interlocking-routing proves the Station Master is WIRED for interlocking; bilateral-binding additionally proves the wiring CLOSES — the exposed interlocking is reachable via a declared entrypoint.action and the mapping resolves to a real YAML. Complementary, not narrowing.'
  - source_ref: coder.train.train-runner.definition
    target_ref: coder.train.interlocking-delegates-to-trainrunner
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'interlocking-delegates-to-trainrunner is the enforcer that asserts TrainRunner''s defining role in this extension — "TrainRunner remains the only wagon-step executor" and delegation via `TrainRunner.execute(selected_train_id, ...)`. The advisory train-runner anchor is made enforceable through it. (Dedicated TrainRunner existence/step-order enforcers are core-only, declared narratively per boundary spec §6.2, not as a graph edge.)'
  - source_ref: coder.train.train-runner.definition
    target_ref: coder.train.interlocking-does-not-carry-cargo
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'does-not-carry-cargo asserts "Cargo is the artifact data plane carried by TrainRunner between wagons inside a selected train" — the TrainRunner-carries-Cargo half of the anchor''s meaning.'
  - source_ref: coder.train.interlocking-runner.definition
    target_ref: coder.train.interlocking-runner-exists
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'runner-exists is the enforcer that the InterlockingRunner route-control layer exists with a `resolve_train(...)` entry point — the anchor''s core existence clause.'
  - source_ref: coder.train.interlocking-runner.definition
    target_ref: coder.train.interlocking-resolution-model-exists
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'resolution-model-exists enforces the structured resolution model through which the runner resolves exactly one admissible train — the anchor''s "structured resolution" clause.'
  - source_ref: coder.train.interlocking-runner.definition
    target_ref: coder.train.interlocking-delegates-to-trainrunner
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'delegates-to-trainrunner enforces that the runner delegates execution to TrainRunner and never executes wagons itself — the anchor''s "delegates, executes no wagons" clause.'
  - source_ref: coder.train.interlocking-runner.definition
    target_ref: coder.train.interlocking-does-not-carry-cargo
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'does-not-carry-cargo enforces that "An InterlockingRunner MUST NOT reference or mutate Cargo" — the anchor''s "carries no Cargo" clause.'
  - source_ref: coder.train.interlocking-runner.definition
    target_ref: coder.train.interlocking-bilateral-binding
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'bilateral-binding enforces the declaration<->runtime<->station<->trace closure the InterlockingRunner participates in — the anchor''s route-control integrity in the wider surface.'
  - source_ref: coder.train.cargo.definition
    target_ref: coder.train.interlocking-does-not-carry-cargo
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'does-not-carry-cargo is the extension''s Cargo-boundary enforcer: it defines "Cargo is the artifact data plane carried by TrainRunner between wagons inside a selected train" and forbids the InterlockingRunner from touching it. (The core wagons-communicate-via-cargo enforcer is core-only, declared narratively per boundary spec §6.2, not as a graph edge.)'
  - source_ref: coder.train.station-master.definition
    target_ref: coder.train.station-master-interlocking-routing
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'station-master-interlocking-routing is the enforcer that the Station Master routes both direct and interlocking journeys and delegates to TrainRunner (call model Station Master -> InterlockingRunner.resolve_train(...) -> TrainRunner.execute(...)) — the whole of what this anchor asserts. (Child-train fan-out / suspend-resume are core-only and intentionally not asserted here.)'
  - source_ref: coder.train.executional-machinery.definition
    target_ref: coder.train.train-runner.definition
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'The umbrella composes the TrainRunner component anchor; enforcement is decomposed into the leaf rules that anchor relates to.'
  - source_ref: coder.train.executional-machinery.definition
    target_ref: coder.train.interlocking-runner.definition
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'The umbrella composes the InterlockingRunner component anchor; enforcement is decomposed into the leaf rules that anchor relates to.'
  - source_ref: coder.train.executional-machinery.definition
    target_ref: coder.train.cargo.definition
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'The umbrella composes the Cargo component anchor; enforcement is decomposed into the leaf rule that anchor relates to.'
  - source_ref: coder.train.executional-machinery.definition
    target_ref: coder.train.station-master.definition
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'The umbrella composes the Station Master component anchor; enforcement is decomposed into the leaf rule that anchor relates to.'
  - source_ref: coder.train.runtime-executes-the-declaration
    target_ref: coder.train.interlocking-bilateral-binding
    type: requires
    foundation: finish_to_start
    constraint: mandatory
    control: internal
    strength: critical
    confidence: 1.0
    reason: 'Bilateral binding closes a TEXT-level correspondence — literals in the runtime also appear in the plan. This rule asks the harder question underneath it: whether the runtime ever READS the plan. A consumer satisfying binding while transcribing the declaration is exactly what the pair exists to separate.'
