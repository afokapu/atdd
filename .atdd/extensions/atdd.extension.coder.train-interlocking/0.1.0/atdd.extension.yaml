schema_version: "1.0.0"

# Official ATDD train-interlocking coder extension.
#
# PERSONA SPLIT (afokapu/atdd#1531). This package is the coder-lane half of the
# former `atdd.extension.train-interlocking-enforcement`, which declared
# `role: coder` yet co-hosted four `tester.interlocking.*` conventions — a
# persona-lie the four-segment grammar (afokapu/atdd#1343) exists to prevent.
# The tester surface now lives in the sibling `atdd.extension.tester.train-interlocking`.
# This package owns the SOURCE-surface (coder) rules: the InterlockingRunner
# runtime-infrastructure conventions, the systemic bilateral-binding closure,
# and the runtime-machinery definition anchors.
#
# Boundary model (CONTRIBUTING.md "The Four Layers" + boundary spec §6.2):
#   - This EXTENSION owns the rules (conventions) + implementations (validators).
#   - The WORKSPACE PROVIDER (atdd.workspace.python-pytest) owns the reusable
#     runtime; it is referenced by id + contract range, never bundled here.
#   - Each implementation declares the provider it targets + a contract_version.
#   - core<->extension references (the train-interlocking core design) are declared
#     NARRATIVELY here + in README, never as relationship-graph edges (§6.2).
#   - The one cross-persona edge to the tester package's
#     `tester.interlocking.trace-binds-declared-route` is declared NARRATIVELY in
#     README (bilateral-binding's trace_to_declaration direction), never as a
#     graph edge — cross-extension edges are forbidden (§6.2).
#
# Core design this extension enforces (already merged to atdd core main):
#   afokapu/atdd#1246 — parent: train interlocking route-control model
#   afokapu/atdd#1248 — planner artifact: interlocking YAML + projections (CLOSED)
#   afokapu/atdd#1249 — planner validators + Confirm gate (CLOSED)
#   afokapu/atdd#1251 — runtime: InterlockingRunner called by Station Master,
#                       delegates to TrainRunner
#   afokapu/atdd-extensions#23 — extension enforcement parent
extension_id: atdd.extension.coder.train-interlocking
version: "0.1.0"
kind: extension

# This package's headline deliverable is proving the consumer-repo RUNTIME
# infrastructure (InterlockingRunner) exists and is wired into the Station Master
# -> TrainRunner path — a source-surface (coder) concern. Every convention it
# owns is a `coder.train.*` rule, so the persona segment is honest.
role: coder
flow_wagon: validate-source-surface
feature: train-interlocking-enforcement

owns:
  conventions:
    - conventions/coder.train.runtime-executes-the-declaration.convention.yaml
    # Five granular runtime-infrastructure rules (#25).
    - conventions/coder.train.interlocking-runner-exists.convention.yaml
    - conventions/coder.train.interlocking-resolution-model-exists.convention.yaml
    - conventions/coder.train.station-master-interlocking-routing.convention.yaml
    - conventions/coder.train.interlocking-delegates-to-trainrunner.convention.yaml
    - conventions/coder.train.interlocking-does-not-carry-cargo.convention.yaml
    # #27 bilateral declaration<->runtime<->station<->trace binding (the systemic-closure convention)
    - conventions/coder.train.interlocking-bilateral-binding.convention.yaml
    # runtime-machinery definition anchors (kind: family, advisory) — coder-layer
    # semantic anchors for the runtime concepts the enforcing rules above operationalize.
    - conventions/coder.train.train-runner.definition.convention.yaml
    - conventions/coder.train.interlocking-runner.definition.convention.yaml
    - conventions/coder.train.cargo.definition.convention.yaml
    - conventions/coder.train.station-master.definition.convention.yaml
    - conventions/coder.train.executional-machinery.definition.convention.yaml
  relationships:
    - relationships.yaml
  implementations:
    - implementations/interlocking-infrastructure
    - implementations/interlocking-binding
  schemas: []
  gates:
    - gates/interlocking-infrastructure.gate.yaml
    - gates/interlocking-binding.gate.yaml
  scopes:
    - scopes/interlocking-targets.scope.yaml

depends_on:
  # `core: []` — the five `atdd.core.*` ids previously listed here do not exist.
  # The 231 real core nodes are namespaced coder.* / tester.* / coach.*, and
  # admission never validates this field, so the declaration pointed at nothing.
  # An empty list is what `atdd author extension init` scaffolds. (Carried over
  # from main's 9ccb9a3, which dropped these dead deps after this branch forked.)
  core: []
  # The reusable runtime both implementations target. The infrastructure
  # validator (scans python/ runtime code) and the bilateral-binding validator
  # (#27; scans the declaration<->runtime<->station<->trace closure) both run
  # inside the python-pytest provider. Referenced by id + contract range; never
  # copied in.
  workspaces:
    - id: atdd.workspace.python-pytest
      contract: "^1.0.0"

removal_policy:
  allowed_if_no_external_dependents: true
