# Tag + Publish after ATDD Validate succeeds on main
# Triggered automatically via workflow_run (no GITHUB_TOKEN cross-workflow issue).
# Version bump is done by the agent on the PR branch BEFORE merging.
# "Require branches to be up to date" in branch protection serializes merges.
name: Publish

on:
  workflow_run:
    workflows: ["ATDD Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:            # manual fallback

jobs:
  tag-release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: write
      id-token: write           # required for PyPI Trusted Publishing
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Version is now owned by the State Store (#1172): the in-tree build
      # backend resolver is the single projection of the release version. In CI
      # (no committed store) it returns the `0.0.0+local` fallback — which is NOT
      # a publishable version, so we skip tag/build/publish rather than push a
      # bogus tag. Automated CI publication is pending the GitHub release-worker
      # that drains core's neutral `version_decided` outbox (#1172 step 5
      # follow-up); until then the operator coordinates the release.
      - name: Resolve release version from State Store (#1172)
        id: resolve
        run: |
          set -euo pipefail
          PREFIX=$(python3 -c "import yaml; print(yaml.safe_load(open('.atdd/config.yaml'))['release'].get('tag_prefix','v'))" 2>/dev/null || echo "v")
          VERSION=$(PYTHONPATH=build_meta_shim python3 -c \
            "from _release_version import resolve_version; print(resolve_version())" \
            2>/dev/null || echo "0.0.0+local")
          echo "Resolved release version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0+local" ]; then
            echo "::warning title=publish skipped::No State Store release version resolvable in CI (got '${VERSION}'). Tag + PyPI publish skipped — pending the GitHub release-worker that drains core's neutral version_decided outbox (#1172 step 5). The operator must publish this release."
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${PREFIX}${VERSION}" >> "$GITHUB_ENV"
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag (idempotent)
        if: steps.resolve.outputs.publishable == 'true'
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            echo "CREATED=false" >> "$GITHUB_ENV"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
            echo "CREATED=true" >> "$GITHUB_ENV"
          fi

      - name: Build package
        if: steps.resolve.outputs.publishable == 'true'
        run: |
          python -m pip install -U build
          python -m build

      - name: Publish to PyPI
        if: steps.resolve.outputs.publishable == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Verify PyPI publication
        id: pypi_verify
        if: steps.resolve.outputs.publishable == 'true'
        run: |
          VERSION="${TAG#v}"
          echo "Waiting for atdd==$VERSION to appear on PyPI..."
          for i in 1 2 3 4 5 6; do
            if pip install --dry-run --no-deps "atdd==$VERSION" --index-url https://pypi.org/simple/ 2>&1 | grep -q "Would install"; then
              echo "Verified: atdd==$VERSION is available on PyPI"
              echo "pypi_status=published" >> "$GITHUB_OUTPUT"
              echo "pypi_version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i: not yet available, waiting 10s..."
            sleep 10
          done
          echo "::warning::atdd==$VERSION not found on PyPI after 60s — may still be propagating"
          echo "pypi_status=pending" >> "$GITHUB_OUTPUT"
          echo "pypi_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compose release metadata
        id: release_meta
        if: env.CREATED == 'true'
        run: |
          COMMIT_SUBJECT=$(git log -1 --format='%s')
          if [ "$PYPI_STATUS" = "published" ]; then
            PYPI_LINE="Published to PyPI: atdd==$PYPI_VERSION"
          else
            PYPI_LINE="PyPI publication pending (may still be propagating)"
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body' 2>/dev/null || echo "")
          else
            NOTES=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq '.body' 2>/dev/null || echo "")
          fi
          {
            echo "title=$TAG — $COMMIT_SUBJECT"
            echo "pypi_line=$PYPI_LINE"
            echo "body<<RELEASE_BODY_EOF"
            printf '%s\n\n---\n%s\n' "$NOTES" "$PYPI_LINE"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_STATUS: ${{ steps.pypi_verify.outputs.pypi_status }}
          PYPI_VERSION: ${{ steps.pypi_verify.outputs.pypi_version }}

      - name: Create GitHub Release
        if: env.CREATED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ steps.release_meta.outputs.title }}
          body: ${{ steps.release_meta.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
