# Post-Merge Lifecycle: complete the ATDD issue lifecycle after PR merge.
# Closes WMBT sub-issues, swaps labels to atdd:COMPLETE, updates Project v2.
name: Post-Merge Lifecycle

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  post-merge-lifecycle:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write   # bump-on-merge step pushes a follow-up commit to main
    steps:
      - name: Extract linked issue number
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Extract issue number from "Closes #N" in PR body
          ISSUE=$(echo "$PR_BODY" | grep -oiP '(?:closes|fixes|resolves)\s+#\K\d+' | head -1)
          if [ -z "$ISSUE" ]; then
            echo "::notice::No linked issue found in PR #${PR_NUMBER} body. Skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Linked issue: #$ISSUE"

      - name: Close WMBT sub-issues
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.extract.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching sub-issues for #${ISSUE}..."
          SUB_ISSUES=$(gh api "repos/${REPO}/issues/${ISSUE}/sub_issues" \
            --paginate --jq '.[] | select(.state == "open") | .number' 2>/dev/null || true)

          if [ -z "$SUB_ISSUES" ]; then
            echo "No open sub-issues found."
          else
            for SUB in $SUB_ISSUES; do
              echo "Closing sub-issue #${SUB}..."
              gh issue close "$SUB" --repo "$REPO" \
                --comment "Closed by merge of PR #${{ github.event.pull_request.number }}."
            done
            echo "Closed $(echo "$SUB_ISSUES" | wc -w | tr -d ' ') sub-issue(s)."
          fi

      - name: Swap labels to atdd:COMPLETE
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.extract.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          # Get current labels on the issue
          LABELS=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '.labels[].name')

          # Remove any atdd phase labels
          for PHASE in INIT PLANNED RED GREEN SMOKE REFACTOR BLOCKED; do
            if echo "$LABELS" | grep -qx "atdd:${PHASE}"; then
              echo "Removing label atdd:${PHASE}..."
              gh issue edit "$ISSUE" --repo "$REPO" --remove-label "atdd:${PHASE}"
            fi
          done

          # Add atdd:COMPLETE
          echo "Adding label atdd:COMPLETE..."
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "atdd:COMPLETE"

      - name: Update Project v2 ATDD Status
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.extract.outputs.issue }}
          REPO: ${{ github.repository }}
          PROJECT_ID: PVT_kwHOAIbyOM4BPpKf
        run: |
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"

          # Get issue node ID
          ISSUE_NODE_ID=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) { id }
              }
            }' -f owner="$OWNER" -f name="$NAME" -F number="$ISSUE" \
            --jq '.data.repository.issue.id' 2>/dev/null) || true

          if [ -z "$ISSUE_NODE_ID" ]; then
            echo "::warning::Could not fetch issue node ID. Skipping project update."
            exit 0
          fi

          # Find the project item ID for this issue
          ITEM_ID=$(gh api graphql -f query='
            query($nodeId: ID!) {
              node(id: $nodeId) {
                ... on Issue {
                  projectItems(first: 10) {
                    nodes { id project { id } }
                  }
                }
              }
            }' -f nodeId="$ISSUE_NODE_ID" \
            --jq ".data.node.projectItems.nodes[] | select(.project.id == \"${PROJECT_ID}\") | .id" 2>/dev/null) || true

          if [ -z "$ITEM_ID" ]; then
            echo "::notice::Issue #${ISSUE} not in project. Skipping project field update."
            exit 0
          fi

          # Get the "ATDD Status" field ID and COMPLETE option ID
          FIELD_DATA=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 30) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" 2>/dev/null) || true

          if [ -z "$FIELD_DATA" ]; then
            echo "::warning::Could not fetch project fields. Skipping project update."
            exit 0
          fi

          FIELD_ID=$(echo "$FIELD_DATA" | jq -r '
            .data.node.fields.nodes[]
            | select(.name == "ATDD Status")
            | .id' 2>/dev/null) || true
          OPTION_ID=$(echo "$FIELD_DATA" | jq -r '
            .data.node.fields.nodes[]
            | select(.name == "ATDD Status")
            | .options[]
            | select(.name == "COMPLETE")
            | .id' 2>/dev/null) || true

          if [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "::warning::ATDD Status field or COMPLETE option not found. Skipping."
            exit 0
          fi

          # Update the field
          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
               -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID"

          echo "Updated ATDD Status to COMPLETE for issue #${ISSUE}."

      # ─── Bump-on-merge (issue #462 phase 2) ──────────────────────────────
      # Replaces the pre-merge `version-bump` PR check. Branch prefix → semver
      # class:
      #   feat/                                  → MINOR
      #   fix/, chore/, docs/, refactor/, devops/ → PATCH
      #   PR title contains "BREAKING CHANGE" or matches "<type>!:" → MAJOR
      # Skip path: if the merged PR already touched pyproject.toml::version
      # (legacy/manual bump), do nothing.
      # Push uses PROJECT_TOKEN (PAT) — GITHUB_TOKEN-pushed commits don't fire
      # the workflow_run cascade that the Publish workflow depends on.
      - name: Detect legacy version-bump in PR diff
        if: github.event.pull_request.merged == true
        id: legacy_bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PATCH=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate \
            --jq '.[] | select(.filename == "pyproject.toml") | .patch' 2>/dev/null || true)
          if echo "$PATCH" | grep -qE '^[+-]version[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"'; then
            echo "::warning title=bump-on-merge skipped::PR #${PR_NUMBER} already modified pyproject.toml::version (legacy/manual bump). Auto-bump skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify PROJECT_TOKEN is configured
        if: github.event.pull_request.merged == true && steps.legacy_bump.outputs.skip == 'false'
        env:
          PT: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "${PT:-}" ]; then
            cat >&2 <<'MSG'
          ::error title=PROJECT_TOKEN required for bump-on-merge::PROJECT_TOKEN secret is unset. Bump-on-merge needs a PAT (or App token) with contents:write to push the bump commit so it triggers the Publish workflow on main; commits pushed with GITHUB_TOKEN do NOT fire workflow_run cascades. Configure PROJECT_TOKEN in repo Settings → Secrets and variables → Actions.
          MSG
            exit 1
          fi

      - name: Checkout main for bump-on-merge
        if: github.event.pull_request.merged == true && steps.legacy_bump.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROJECT_TOKEN }}

      - name: Bump version on main (atomic with retries)
        if: github.event.pull_request.merged == true && steps.legacy_bump.outputs.skip == 'false'
        env:
          BRANCH_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Compute next version inline; re-runs each attempt against the
          # latest origin/main so we never push a stale version.
          cat > /tmp/compute_next_version.py <<'PYEOF'
          import os, re, sys
          branch = os.environ["BRANCH_REF"]
          title = os.environ["PR_TITLE"]
          text = open("pyproject.toml").read()
          m = re.search(r'^version\s*=\s*"([0-9]+)\.([0-9]+)\.([0-9]+)"', text, re.M)
          if not m:
              print("Could not parse version from pyproject.toml", file=sys.stderr)
              sys.exit(1)
          maj, mnr, pat = (int(g) for g in m.groups())
          breaking = (
              "BREAKING CHANGE" in title
              or bool(re.match(r'^[a-z]+(\([^)]+\))?!:', title))
          )
          if breaking:
              cls, nv = "major", f"{maj+1}.0.0"
          elif branch.startswith("feat/"):
              cls, nv = "minor", f"{maj}.{mnr+1}.0"
          else:
              # fix/, chore/, docs/, refactor/, devops/, and any other prefix
              cls, nv = "patch", f"{maj}.{mnr}.{pat+1}"
          old = f"{maj}.{mnr}.{pat}"
          new_text = re.sub(
              r'^(version\s*=\s*")' + re.escape(old) + r'(")',
              rf'\g<1>{nv}\g<2>', text, count=1, flags=re.M)
          open("pyproject.toml", "w").write(new_text)
          print(f"old={old} new={nv} class={cls} branch={branch}", file=sys.stderr)
          print(nv)
          PYEOF

          for attempt in 1 2 3; do
            echo "::group::bump-on-merge attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main

            if ! NEW=$(python3 /tmp/compute_next_version.py); then
              echo "::error::Failed to compute next version on attempt ${attempt}"
              echo "::endgroup::"
              exit 1
            fi

            git add pyproject.toml
            git commit -m "chore(release): bump version to ${NEW} [auto]"

            if git push origin HEAD:main; then
              echo "::notice title=bump-on-merge succeeded::Bumped to ${NEW} on attempt ${attempt} (pr=${PR_NUMBER}, branch=${BRANCH_REF})"
              echo "::endgroup::"
              exit 0
            fi

            echo "::warning::Push rejected on attempt ${attempt} (likely fast-forward race) — re-fetching"
            sleep 2
            echo "::endgroup::"
          done

          echo "::error title=bump-on-merge failed::pr=${PR_NUMBER} branch=${BRANCH_REF} attempts=3 — manual bump required on next PR. Publish tag-push is idempotent, so a missed bump is recoverable on the next merge."
          exit 1

      - name: Read version from pyproject.toml
        if: steps.extract.outputs.found == 'true'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(gh api "repos/${REPO}/contents/pyproject.toml" --jq '.content' \
            | base64 -d \
            | grep -oP '(?<=version = ")[^"]+' \
            | head -1) || VERSION="unknown"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Add closing comment
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.extract.outputs.issue }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BODY=$(printf 'ATDD lifecycle complete. Merged via PR #%s (%s) at %s.\nPublishing to PyPI: atdd==%s' "$PR_NUMBER" "$PR_TITLE" "$TIMESTAMP" "$VERSION")
          gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY"
