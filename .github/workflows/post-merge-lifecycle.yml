# Post-Merge Lifecycle: complete the ATDD issue lifecycle after PR merge.
# Closes WMBT sub-issues and updates Project v2.
#
# This workflow MUST NOT write an `atdd:<PHASE>` label (#1452). The phase label is
# a PROJECTION of `objects.state`, emitted by IssueManager.update and by nothing
# else; the phase advance on merge belongs to atdd-auto-phase.yml.
name: Post-Merge Lifecycle

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  post-merge-lifecycle:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write   # bump-on-merge step pushes a follow-up commit to main
    steps:
      - name: Extract linked issue number
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Extract issue number from "Closes #N" in PR body
          ISSUE=$(echo "$PR_BODY" | grep -oiP '(?:closes|fixes|resolves)\s+#\K\d+' | head -1)
          if [ -z "$ISSUE" ]; then
            echo "::notice::No linked issue found in PR #${PR_NUMBER} body. Skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Linked issue: #$ISSUE"

      - name: Close WMBT sub-issues
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.extract.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching sub-issues for #${ISSUE}..."
          SUB_ISSUES=$(gh api "repos/${REPO}/issues/${ISSUE}/sub_issues" \
            --paginate --jq '.[] | select(.state == "open") | .number' 2>/dev/null || true)

          if [ -z "$SUB_ISSUES" ]; then
            echo "No open sub-issues found."
          else
            for SUB in $SUB_ISSUES; do
              echo "Closing sub-issue #${SUB}..."
              gh issue close "$SUB" --repo "$REPO" \
                --comment "Closed by merge of PR #${{ github.event.pull_request.number }}."
            done
            echo "Closed $(echo "$SUB_ISSUES" | wc -w | tr -d ' ') sub-issue(s)."
          fi

      # #1452: the "Swap labels to atdd:COMPLETE" step USED TO LIVE HERE and was
      # deleted. It shelled out to `gh issue edit --remove-label/--add-label` and
      # stamped atdd:COMPLETE directly, which bypassed IssueManager.update — and
      # with it the phase machine (COMPLETE is not reachable from SMOKE), the
      # train gate, the COMPLETE gates and the store-first write. The label moved
      # and `objects.state` did not: 236 of 421 issues (56%) drifted, 217 of them
      # carrying the single `label=COMPLETE / store=<last earned phase>` signature.
      #
      # It also won a deterministic race: this workflow has no checkout and no
      # Python, so it edited labels ~1s in, while atdd-auto-phase.yml needs
      # checkout + setup-python + `pip install -e .` and does not run for ~11s.
      # auto-phase then read the *label*, found COMPLETE already there, and
      # correctly no-opped green — so the desync was silent.
      #
      # The phase advance is owned by .github/workflows/atdd-auto-phase.yml →
      # `atdd coach transition` → IssueManager.update, which writes the store
      # FIRST and projects the atdd:<PHASE> label from it. Nothing else may write
      # an `atdd:*` label. Re-adding a raw label write here is a build failure —
      # see coach.issue.phase-label-projection-only
      # (src/atdd/coach/validators/test_phase_label_projection_only.py).

      - name: Update Project v2 ATDD Status
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.extract.outputs.issue }}
          REPO: ${{ github.repository }}
          PROJECT_ID: PVT_kwHOAIbyOM4BPpKf
        run: |
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"

          # Get issue node ID
          ISSUE_NODE_ID=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) { id }
              }
            }' -f owner="$OWNER" -f name="$NAME" -F number="$ISSUE" \
            --jq '.data.repository.issue.id' 2>/dev/null) || true

          if [ -z "$ISSUE_NODE_ID" ]; then
            echo "::warning::Could not fetch issue node ID. Skipping project update."
            exit 0
          fi

          # Find the project item ID for this issue
          ITEM_ID=$(gh api graphql -f query='
            query($nodeId: ID!) {
              node(id: $nodeId) {
                ... on Issue {
                  projectItems(first: 10) {
                    nodes { id project { id } }
                  }
                }
              }
            }' -f nodeId="$ISSUE_NODE_ID" \
            --jq ".data.node.projectItems.nodes[] | select(.project.id == \"${PROJECT_ID}\") | .id" 2>/dev/null) || true

          if [ -z "$ITEM_ID" ]; then
            echo "::notice::Issue #${ISSUE} not in project. Skipping project field update."
            exit 0
          fi

          # Get the "ATDD Status" field ID and COMPLETE option ID
          FIELD_DATA=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 30) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" 2>/dev/null) || true

          if [ -z "$FIELD_DATA" ]; then
            echo "::warning::Could not fetch project fields. Skipping project update."
            exit 0
          fi

          FIELD_ID=$(echo "$FIELD_DATA" | jq -r '
            .data.node.fields.nodes[]
            | select(.name == "ATDD Status")
            | .id' 2>/dev/null) || true
          OPTION_ID=$(echo "$FIELD_DATA" | jq -r '
            .data.node.fields.nodes[]
            | select(.name == "ATDD Status")
            | .options[]
            | select(.name == "COMPLETE")
            | .id' 2>/dev/null) || true

          if [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "::warning::ATDD Status field or COMPLETE option not found. Skipping."
            exit 0
          fi

          # Update the field
          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
               -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID"

          echo "Updated ATDD Status to COMPLETE for issue #${ISSUE}."

      # ─── Version bump: now owned by the State Store (#1172) ──────────────
      # The former "Bump version on main (atomic with retries)" step pushed a
      # `chore(release): bump version … [auto]` commit directly to protected
      # `main`. That push is rejected by branch protection (GH006) and has NEVER
      # successfully bumped — see #1172. It is removed here.
      #
      # Versioning is now a State Store concern: the singleton `release` object
      # owns the value (migration v2), `atdd state version bump --class …`
      # advances it, and the in-tree build backend projects it at build time
      # (`pyproject` is `dynamic = ["version"]`, no `version =` line to push or
      # conflict on). The version *decision* is made in core: `atdd state version
      # bump` writes the `release` object and emits a PROVIDER-NEUTRAL
      # `version_decided` outbox message (`{version, change_class}`) — core names
      # no tag/publish/PyPI. Publication (git tag + PyPI) is PERFORMED by the
      # GitHub release extension that drains that neutral outbox message.
      #
      # TODO(#1172 step 5 — follow-up): wire the GitHub release-worker to drain
      # the `version_decided` outbox so tagging/publishing is automated end to
      # end in CI. Until then the Publish workflow only acts when a State Store
      # release version is resolvable (it skips the `0.0.0+local` fallback), and
      # the operator coordinates the release. Do NOT re-introduce the GH006
      # direct-push bump.

      - name: Resolve release version from State Store (#1172)
        if: steps.extract.outputs.found == 'true'
        id: version
        run: |
          set -euo pipefail
          # The in-tree build backend resolver is the same projection the package
          # build uses; in CI (no committed store) it returns the 0.0.0+local
          # fallback, which downstream steps treat as "no version to announce".
          VERSION=$(PYTHONPATH=build_meta_shim python3 -c \
            "from _release_version import resolve_version; print(resolve_version())" \
            2>/dev/null || echo "0.0.0+local")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $VERSION"

      - name: Add closing comment
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.extract.outputs.issue }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0+local" ]; then
            # No State Store release version resolvable in CI (#1172): publication
            # is pending the GitHub release-worker draining core's neutral
            # version_decided outbox / operator coordination. Do not announce a PyPI version.
            RELEASE_LINE="Release version is owned by the State Store (#1172); publication is handled by the release extension."
          else
            RELEASE_LINE=$(printf 'Publishing to PyPI: atdd==%s' "$VERSION")
          fi
          BODY=$(printf 'ATDD lifecycle complete. Merged via PR #%s (%s) at %s.\n%s' "$PR_NUMBER" "$PR_TITLE" "$TIMESTAMP" "$RELEASE_LINE")
          gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY"
