# ATDD Validation Workflow (toolkit repo)
# This workflow is for the atdd toolkit repo itself.
# Consumer repos get a generated version via `atdd init`.
name: ATDD Validate

on:
  push:
    branches: [main, "feat/*", "fix/*", "refactor/*", "chore/*", "docs/*", "devops/*"]
  pull_request:
    branches: [main]

jobs:
  validate-planner:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run planner validators
        run: PYTHONPATH=src python3 -m pytest src/atdd/planner/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-tester:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run tester validators
        run: PYTHONPATH=src python3 -m pytest src/atdd/tester/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-coder:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run coder validators
        run: PYTHONPATH=src python3 -m pytest src/atdd/coder/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-coach:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run coach validators
        run: PYTHONPATH=src python3 -m pytest src/atdd/coach/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Convention validator family/template/variant layer (#1204/#1206/#1212) — the
  # real-graph engine. Gates so the convention layer actually enforces in CI; a
  # prerequisite for retiring any legacy persona validator (no silent coverage loss).
  #
  # #1418/#1417: the suite is partitioned by mutation class and runs as TWO jobs, because
  # xdist workers share ONE checkout — a test that rewrites a plan or convention YAML would
  # corrupt every other worker's view of the tree. So the non-mutating majority runs here
  # under `-n auto`, the writers run serially in `validate-conventions-serial`, and BOTH fan
  # into validate-gate. The classification is enforced at runtime by the audit-hook guard in
  # conventions/_support/mutation_guard.py, and the two subsets are asserted to collect
  # exactly the un-split suite (E036) — a marker filter must never be able to drop coverage.
  validate-conventions:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # pytest-xdist is a declared dependency in pyproject.toml, but this job installs a
      # bare list rather than the package, so `-n auto` would be an unknown option without it.
      - name: Install dependencies
        run: pip3 install pytest pytest-xdist jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run convention validators (non-mutating subset, parallel)
        run: >-
          PYTHONPATH=src python3 -m pytest src/atdd/validators/conventions/
          -m "not convention_filesystem_mutation" -n auto --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The other half of the partition above: every convention test that writes the checkout (or
  # drives a subprocess over it). These share one working tree by construction, so they run in
  # one process, serially, and never under -n.
  validate-conventions-serial:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run convention validators (filesystem-mutating subset, serial)
        run: >-
          PYTHONPATH=src python3 -m pytest src/atdd/validators/conventions/
          -m "convention_filesystem_mutation" -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SMOKE phase: opt-in via SMOKE_BASE_URL repo secret (issue #293).
  # When unset, the job ends with `success` via the early-skip step and the
  # validate-gate fan-in accepts it. When set, Playwright runs the e2e smoke
  # specs against that URL and the gate fails on any failure.
  # The toolkit-self repo has no web/ — secret stays unset; job is a no-op.
  validate-smoke:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
    steps:
      - name: Skip when SMOKE_BASE_URL is unset
        if: env.SMOKE_BASE_URL == ''
        run: |
          echo "SMOKE_BASE_URL not configured — skipping Playwright smoke run."
          echo "(Set the SMOKE_BASE_URL repo secret to enable runtime smoke verification.)"

      - uses: actions/checkout@v4
        if: env.SMOKE_BASE_URL != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.SMOKE_BASE_URL != ''
        with:
          node-version: "20"

      - name: Install Playwright
        if: env.SMOKE_BASE_URL != ''
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm init -y
            npm install --save-dev @playwright/test
          fi
          npx playwright install --with-deps chromium

      - name: Run e2e smoke specs
        if: env.SMOKE_BASE_URL != ''
        run: npx playwright test "e2e/**/*smoke*.spec.ts"

  # --- Coach decomposition gates (docs/coach-decomposition.md §10, §12.3) ---
  # These two tests are required-CI from #889 onward and gate EVERY PR in the
  # migration. The import-discipline test enforces the §3.3 layer dependency
  # rules; the lifecycle parity test proves INIT→COMPLETE behavior with all
  # externals mocked. Failing either blocks merge via the validate-gate fan-in.
  import-discipline-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest pyyaml

      - name: Run import-discipline test (§10.2)
        run: PYTHONPATH=src python3 -m pytest tests/architecture/test_layer_imports.py -v --tb=short

  parity-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest pyyaml

      - name: Run lifecycle parity test (§10.1)
        run: PYTHONPATH=src python3 -m pytest tests/lifecycle/test_full_issue_parity.py -v --tb=short

  # Incident-defense suite (docs/coach-decomposition.md §9, §12.1 item 7).
  # Each migration child that touches a layer adds explicit tests under
  # tests/incident_defenses/ proving the defenses it preserves. Child 5 (#892)
  # ships the worktree defenses (I-1 bare dispatch, I-2 protected main, I-9
  # core.bare=false). Failing blocks merge via the validate-gate fan-in.
  incident-defense-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        # jsonschema is required by atdd.coach.commands.durability, which the
        # I-8 decision-durability incident test imports (#897).
        run: pip3 install pytest pyyaml jsonschema

      - name: Configure git identity (real-git worktree tests)
        run: |
          git config --global user.email "atdd-ci@example.com"
          git config --global user.name "ATDD CI"

      - name: Run incident-defense suite (§9)
        run: PYTHONPATH=src python3 -m pytest tests/incident_defenses/ -v --tb=short

  # Extension-convention enforcement (#1359). Runs `atdd enforce` over the
  # vendored, committed substrate (.atdd/{extensions,workspaces} + binding.lock).
  # The convention VERDICT is ADVISORY (non-blocking) — a deliberate ratchet
  # STAGE: the toolkit does not yet pass 13/25 of its own extension rules (active
  # core debt, not legacy), so the verdict is surfaced but does not fail the
  # build. The flip to a BLOCKING gate is a tracked follow-up (decommission #1207
  # + extract the subagent-orchestration surface out of core). Substrate digest
  # coherence and the gate wiring ARE blocking (real invariants). train-interlocking
  # is deferred to #1361 (blocked on #1292/#1345).
  enforce-extensions:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      # Blocking: the committed vendored substrate must be digest-coherent.
      # PYTHONDONTWRITEBYTECODE keeps the tree clean — compute_digest hashes .pyc,
      # so a compiled provider would otherwise drift the digest.
      - name: Verify extension substrate (blocking)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: PYTHONPATH=src python3 -m atdd enforce --verify-substrate --repo-root .

      # Advisory (non-blocking) ratchet stage — surfaces the real PASS/FAIL verdict
      # without failing the build. Do NOT make this blocking until the toolkit's
      # self-debt is paid (decommission #1207 + orchestration-out-of-core).
      - name: Enforce extension conventions (ADVISORY — ratchet stage, #1359)
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          echo "::notice::ADVISORY extension enforcement (#1359 ratchet stage) — verdict is non-blocking until the toolkit passes its own rules."
          # Scope to the toolkit's product code (config `code.toolkit: src/atdd`);
          # avoids scanning the vendored substrate's own intentional-dirty fixtures.
          PYTHONPATH=src python3 -m atdd enforce --repo-root . --paths src/atdd || true

      # Blocking: the gate wiring + substrate guards must hold (regression guard).
      - name: Assert enforce gate wiring
        run: PYTHONPATH=src python3 -m pytest tests/enforce/ -v --tb=short

  # Note: the pre-merge `version-bump` PR check was removed in #462 phase 2.
  # Version is now bumped automatically on main by the bump-on-merge step in
  # `.github/workflows/post-merge-lifecycle.yml` (branch-prefix → semver
  # class). Branch protection's `Version bump check` required-check must be
  # removed by an admin BEFORE this PR merges, otherwise PRs will hang on a
  # check that no longer reports.

  validate-gate:
    needs: [validate-planner, validate-tester, validate-coder, validate-coach, validate-conventions, validate-conventions-serial, validate-smoke, import-discipline-test, parity-test, incident-defense-test, enforce-extensions]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
    steps:
      - name: Check results
        run: |
          for result in "planner:${{ needs.validate-planner.result }}" \
                        "tester:${{ needs.validate-tester.result }}" \
                        "coder:${{ needs.validate-coder.result }}" \
                        "coach:${{ needs.validate-coach.result }}" \
                        "conventions:${{ needs.validate-conventions.result }}" \
                        "conventions-serial:${{ needs.validate-conventions-serial.result }}" \
                        "smoke:${{ needs.validate-smoke.result }}" \
                        "import-discipline:${{ needs.import-discipline-test.result }}" \
                        "parity:${{ needs.parity-test.result }}" \
                        "incident-defense:${{ needs.incident-defense-test.result }}" \
                        "enforce-extensions:${{ needs.enforce-extensions.result }}"; do
            phase="${result%%:*}"
            status="${result##*:}"
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]; then
              echo "::error::$phase failed ($status)"
              exit 1
            fi
          done
          echo "All phases passed or were skipped"

      - name: Post comment
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const failed = Object.entries(needs)
              .filter(([, v]) => v.result !== 'success' && v.result !== 'skipped')
              .map(([k]) => k);
            const emoji = failed.length === 0 ? '✅' : '❌';
            const status = failed.length === 0 ? 'success' : 'failure';
            const detail = failed.length > 0
              ? '\nFailed: ' + failed.join(', ')
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} ATDD validation: **${status}**${detail}`
            });
