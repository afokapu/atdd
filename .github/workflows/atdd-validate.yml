# ATDD Validation Workflow (toolkit repo)
# This workflow is for the atdd toolkit repo itself.
# Consumer repos get a generated version via `atdd init`.
name: ATDD Validate

on:
  push:
    branches: [main, "feat/*", "fix/*", "refactor/*", "chore/*", "docs/*", "devops/*"]
  pull_request:
    branches: [main]

jobs:
  validate-planner:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run planner validators
        run: PYTHONPATH=src python3 -m pytest src/atdd/planner/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-tester:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run tester validators
        run: PYTHONPATH=src python3 -m pytest src/atdd/tester/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-coder:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run coder validators
        run: PYTHONPATH=src python3 -m pytest src/atdd/coder/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-coach:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `build`/`setuptools`/`wheel` are needed by the #1474 packaging acceptances
      # (E062-SMOKE-001, E062-UNIT-001, C009-SMOKE-001), which live under
      # coach/validators/tests/ and build a real wheel into a real clean venv.
      # They are the executable form of what `validate-consumer` does in shell.
      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript build setuptools wheel

      - name: Run coach validators
        run: PYTHONPATH=src python3 -m pytest src/atdd/coach/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Convention validator family/template/variant layer (#1204/#1206/#1212) — the
  # real-graph engine. Gates so the convention layer actually enforces in CI; a
  # prerequisite for retiring any legacy persona validator (no silent coverage loss).
  #
  # #1418/#1417: the suite is partitioned by mutation class and runs as TWO jobs, because
  # xdist workers share ONE checkout — a test that rewrites a plan or convention YAML would
  # corrupt every other worker's view of the tree. So the non-mutating majority runs here
  # under `-n auto`, the writers run serially in `validate-conventions-serial`, and BOTH fan
  # into validate-gate. The classification is enforced at runtime by the audit-hook guard in
  # conventions/_support/mutation_guard.py, and the two subsets are asserted to collect
  # exactly the un-split suite (E036) — a marker filter must never be able to drop coverage.
  validate-conventions:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # pytest-xdist is a declared dependency in pyproject.toml, but this job installs a
      # bare list rather than the package, so `-n auto` would be an unknown option without it.
      - name: Install dependencies
        run: pip3 install pytest pytest-xdist jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run convention validators (non-mutating subset, parallel)
        run: >-
          PYTHONPATH=src python3 -m pytest src/atdd/validators/conventions/
          -m "not convention_filesystem_mutation" -n auto --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The other half of the partition above: every convention test that writes the checkout (or
  # drives a subprocess over it). These share one working tree by construction, so they run in
  # one process, serially, and never under -n.
  validate-conventions-serial:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      - name: Run convention validators (filesystem-mutating subset, serial)
        run: >-
          PYTHONPATH=src python3 -m pytest src/atdd/validators/conventions/
          -m "convention_filesystem_mutation" -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The consumer oracle (#1474). Every other job runs `PYTHONPATH=src pytest
  # src/atdd/<phase>/validators/`, which puts the working tree on the import path —
  # so `atdd.__file__` resolves into the checkout, every data file exists by
  # definition, and `[tool.setuptools.package-data]` is never consulted. The wheel
  # was built only at publish time, AFTER merge. No PR could go red for a packaging
  # defect, which is how #663 sat open from 3.47.0 until a downstream user hit it,
  # and how #952/#1369 and the packaging half of #1341 all shipped.
  #
  # This job is the missing oracle: build the wheel, install it into a clean venv,
  # and exercise the shipped validators from a synthetic consumer repo that has no
  # `src/atdd/`. It gates on the two signals a packaging defect actually produces
  # there:
  #
  #   * wheel-completeness — every non-.py source file is present in the package.
  #   * a fully GREEN consumer sweep — every shipped validator across all four
  #     phases must PASS when run from a consumer that has no `src/atdd/`. A
  #     missing data file surfaces at IMPORT (`bind_rule()` runs at module scope,
  #     so an absent rule node raises RuleNotInRegistryError while pytest is still
  #     collecting and the whole sweep aborts — pre-fix that is 15 errors in tester
  #     and 15 in coder); a stack-path hardcode or a leaked toolkit self-test
  #     surfaces at RUN. Collection alone cannot see the second class.
  #
  # HISTORY (#1489): this gate first shipped (#1474) running `--collect-only`. That
  # made it structurally blind to every RUNTIME consumer failure — #689 stack-path
  # hardcodes and the #1341 toolkit-self-test residue shipped straight past it,
  # because collection exits 0 while the sweep, actually run, is red. A gate that
  # cannot fail is a stub; `test_wheel_completeness` was one for months. So the
  # verdict now comes from a REAL run (collection stays only as a fast pre-check).
  #
  # This job is EXPECTED to be RED on arrival, and that is deliberate — there are
  # genuine consumer failures on `main` today (#689's surviving stack hardcode, the
  # 2 remaining #1341 self-test leaks, `coder.dead-code.reachability`'s strict
  # false-positive). They are separately owned. Do NOT green this job by adding
  # `continue-on-error`, marker-excluding the failures, or narrowing the sweep —
  # that recreates the exact bug #1489 exists to kill. Fix the failures behind the
  # gate, or let the operator sequence them; never weaken the gate to hide them.
  validate-consumer:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install build tooling
        run: pip3 install build setuptools wheel

      # `rm -rf build/` is not superstition: setuptools does not clean `build/lib`
      # between runs and bdist_wheel packs it wholesale, so a file left there by an
      # earlier build survives into every later wheel regardless of config. A fresh
      # CI checkout has no `build/`, but the guard costs nothing and keeps this job
      # honest if it ever runs after something that populated one.
      - name: Build the wheel
        run: |
          rm -rf build/ dist/
          python3 -m build --wheel --outdir dist/

      # A clean venv: the wheel and its declared dependencies, nothing else. This is
      # the step every other job is missing — `pip install` consults package-data,
      # `PYTHONPATH=src` never does.
      - name: Install the wheel into a clean venv
        run: |
          python3 -m venv /tmp/consumer-venv
          /tmp/consumer-venv/bin/pip install --quiet pytest dist/*.whl
          /tmp/consumer-venv/bin/python -c "import atdd, pathlib; print('installed:', pathlib.Path(atdd.__file__).parent)"

      # No src/atdd/ here, so a data file that did not ship is genuinely absent
      # rather than shadowed by the checkout.
      - name: Create a synthetic consumer repo
        run: |
          mkdir -p /tmp/consumer-repo
          cd /tmp/consumer-repo
          git init -q .
          test ! -e src/atdd || (echo "::error::consumer repo has a toolkit source tree" && exit 1)

      # FAST PRE-CHECK (not the verdict). A missing data file surfaces at IMPORT —
      # `bind_rule()` runs at module scope, so an absent rule node raises
      # RuleNotInRegistryError while pytest is still collecting and the sweep dies
      # before running a test. Pre-fix: 15 collection errors in tester, 15 in coder.
      # Collection is cheap and localises a packaging defect precisely, so we run it
      # first — but it is NOT the gate. Collection exits 0 on a repo whose sweep is
      # red (that blindness is the #1489 defect), so its verdict cannot stand alone.
      - name: Consumer sweep — collection pre-check (all four phases must COLLECT)
        run: |
          PKG=$(/tmp/consumer-venv/bin/python -c "import atdd, pathlib; print(pathlib.Path(atdd.__file__).resolve().parent)")
          cd /tmp/consumer-repo
          failed=0
          for phase in planner tester coder coach; do
            echo "::group::collect $phase"
            if ! /tmp/consumer-venv/bin/python -m pytest "$PKG/$phase/validators" \
                 -q -p no:cacheprovider --collect-only -m "not platform"; then
              echo "::error::$phase does not COLLECT off the installed wheel — a file its validators read at import did not ship"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # THE GATE (#1489). Run the shipped validators for real from the consumer
      # repo; the job's verdict is the sweep's exit code, not collection's. This is
      # the only step that can see a RUNTIME consumer failure — a stack-path
      # hardcode (#689) or a leaked toolkit self-test (#1341) passes collection and
      # fails here. Every phase runs even after an earlier one fails, so the log
      # reports the FULL failure set in one pass rather than stopping at the first.
      # `-m "not platform"` matches how a consumer actually invokes `atdd validate`
      # (platform-marked toolkit self-tests are not part of a consumer's surface);
      # it is the consumer's real filter, NOT a device to deselect failures.
      #
      # This is EXPECTED to be red while #689 / #1341 residue / dead-code.reachability
      # are open. Do not add `continue-on-error`, `|| true`, or narrow the sweep to
      # green it — see the job header. Fix the failures, do not hide them.
      - name: Consumer sweep — all four phases must PASS (real run, exit 0)
        run: |
          PKG=$(/tmp/consumer-venv/bin/python -c "import atdd, pathlib; print(pathlib.Path(atdd.__file__).resolve().parent)")
          cd /tmp/consumer-repo
          failed=0
          for phase in planner tester coder coach; do
            echo "::group::run $phase"
            if ! /tmp/consumer-venv/bin/python -m pytest "$PKG/$phase/validators" \
                 -q -p no:cacheprovider -rf -m "not platform"; then
              echo "::error::$phase FAILS when run off the installed wheel — a shipped validator does not pass in a consumer repo"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # The #451 gate, run the only way it has ever been able to run: package
      # imported from the venv's site-packages, cwd at the toolkit checkout.
      - name: Wheel-completeness gate against the installed package
        run: |
          PKG=$(/tmp/consumer-venv/bin/python -c "import atdd, pathlib; print(pathlib.Path(atdd.__file__).resolve().parent)")
          /tmp/consumer-venv/bin/python -m pytest "$PKG/coach/validators/test_wheel_completeness.py" \
            -v -rs -p no:cacheprovider --tb=short

  # SMOKE phase: opt-in via SMOKE_BASE_URL repo secret (issue #293).
  # When unset, the job ends with `success` via the early-skip step and the
  # validate-gate fan-in accepts it. When set, Playwright runs the e2e smoke
  # specs against that URL and the gate fails on any failure.
  # The toolkit-self repo has no web/ — secret stays unset; job is a no-op.
  validate-smoke:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
    steps:
      - name: Skip when SMOKE_BASE_URL is unset
        if: env.SMOKE_BASE_URL == ''
        run: |
          echo "SMOKE_BASE_URL not configured — skipping Playwright smoke run."
          echo "(Set the SMOKE_BASE_URL repo secret to enable runtime smoke verification.)"

      - uses: actions/checkout@v4
        if: env.SMOKE_BASE_URL != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.SMOKE_BASE_URL != ''
        with:
          node-version: "20"

      - name: Install Playwright
        if: env.SMOKE_BASE_URL != ''
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm init -y
            npm install --save-dev @playwright/test
          fi
          npx playwright install --with-deps chromium

      - name: Run e2e smoke specs
        if: env.SMOKE_BASE_URL != ''
        run: npx playwright test "e2e/**/*smoke*.spec.ts"

  # --- Coach decomposition gates (docs/coach-decomposition.md §10, §12.3) ---
  # These two tests are required-CI from #889 onward and gate EVERY PR in the
  # migration. The import-discipline test enforces the §3.3 layer dependency
  # rules; the lifecycle parity test proves INIT→COMPLETE behavior with all
  # externals mocked. Failing either blocks merge via the validate-gate fan-in.
  import-discipline-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest pyyaml

      - name: Run import-discipline test (§10.2)
        run: PYTHONPATH=src python3 -m pytest tests/architecture/test_layer_imports.py -v --tb=short

  parity-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest pyyaml

      - name: Run lifecycle parity test (§10.1)
        run: PYTHONPATH=src python3 -m pytest tests/lifecycle/test_full_issue_parity.py -v --tb=short

  # Incident-defense suite (docs/coach-decomposition.md §9, §12.1 item 7).
  # Each migration child that touches a layer adds explicit tests under
  # tests/incident_defenses/ proving the defenses it preserves. Child 5 (#892)
  # ships the worktree defenses (I-1 bare dispatch, I-2 protected main, I-9
  # core.bare=false). Failing blocks merge via the validate-gate fan-in.
  incident-defense-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        # jsonschema is required by atdd.coach.commands.durability, which the
        # I-8 decision-durability incident test imports (#897).
        run: pip3 install pytest pyyaml jsonschema

      - name: Configure git identity (real-git worktree tests)
        run: |
          git config --global user.email "atdd-ci@example.com"
          git config --global user.name "ATDD CI"

      - name: Run incident-defense suite (§9)
        run: PYTHONPATH=src python3 -m pytest tests/incident_defenses/ -v --tb=short

  # Extension-convention enforcement (#1359 wired it; #1428 made it REQUIRED).
  # Runs `atdd enforce` over the vendored, committed substrate
  # (.atdd/{extensions,workspaces} + binding.lock).
  #
  # The convention VERDICT is now BLOCKING — this job's failure fails the
  # validate-gate fan-in and blocks the merge. That is the point of train 0007:
  # enforcement nobody is accountable to is not enforcement.
  #
  # It is blocking BUT BASELINED. The toolkit does not pass its own rules today
  # (23 of 51 enforced rules carry violations), so the verdict is judged against
  # `.atdd/enforce-ratchet.yaml` — a per-rule violation-count DEBT REGISTER
  # (#1428 E003). A rule at or below its recorded count is held FLAT; a rule ABOVE
  # it, or a clean rule that starts failing, FAILS the build. The register can only
  # ever be TIGHTENED — to pay debt down, fix violations and re-record with
  # `atdd enforce --paths src/atdd --record-ratchet .atdd/enforce-ratchet.yaml`.
  # NEVER raise a count to green a red build: that is precisely what this gate exists
  # to catch.
  #
  # Substrate digest coherence and the gate wiring are likewise blocking (real
  # invariants). train-interlocking is no longer deferred: the #1426 fan-out
  # composes its list-valued realizes_convention and the extension ships enabled,
  # so its rules bind, verify, and enforce here like any other.
  enforce-extensions:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install dependencies
        run: pip3 install pytest jsonschema pyyaml tree-sitter tree-sitter-typescript

      # Blocking: the committed vendored substrate must be digest-coherent.
      # PYTHONDONTWRITEBYTECODE keeps the tree clean — compute_digest hashes .pyc,
      # so a compiled provider would otherwise drift the digest.
      - name: Verify extension substrate (blocking)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: PYTHONPATH=src python3 -m atdd enforce --verify-substrate --repo-root .

      # BLOCKING (#1428 E001). No `continue-on-error`, no `|| true`: a strict
      # convention FAIL exits non-zero, fails this job, and blocks the merge via the
      # validate-gate fan-in.
      #
      # `--ratchet` is what makes that safe on day one (#1428 E003): the repository's
      # pre-existing violations are held FLAT against the recorded baseline, so this
      # goes green on the known debt — while any rule climbing ABOVE its baseline, or
      # any clean rule that starts failing, reds the build.
      - name: Enforce extension conventions (BLOCKING — ratcheted, #1428)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Scope to the toolkit's product code (config `code.toolkit: src/atdd`);
          # avoids scanning the vendored substrate's own intentional-dirty fixtures.
          # The baseline was recorded over this exact scope — they must not diverge.
          PYTHONPATH=src python3 -m atdd enforce --repo-root . --paths src/atdd \
            --ratchet .atdd/enforce-ratchet.yaml

      # Blocking: the gate wiring + substrate guards must hold (regression guard).
      - name: Assert enforce gate wiring
        run: PYTHONPATH=src python3 -m pytest tests/enforce/ -v --tb=short

  # Note: the pre-merge `version-bump` PR check was removed in #462 phase 2.
  # Version is now bumped automatically on main by the bump-on-merge step in
  # `.github/workflows/post-merge-lifecycle.yml` (branch-prefix → semver
  # class). Branch protection's `Version bump check` required-check must be
  # removed by an admin BEFORE this PR merges, otherwise PRs will hang on a
  # check that no longer reports.

  validate-gate:
    needs: [validate-planner, validate-tester, validate-coder, validate-coach, validate-conventions, validate-conventions-serial, validate-consumer, validate-smoke, import-discipline-test, parity-test, incident-defense-test, enforce-extensions]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
    steps:
      - name: Check results
        run: |
          for result in "planner:${{ needs.validate-planner.result }}" \
                        "tester:${{ needs.validate-tester.result }}" \
                        "coder:${{ needs.validate-coder.result }}" \
                        "coach:${{ needs.validate-coach.result }}" \
                        "conventions:${{ needs.validate-conventions.result }}" \
                        "conventions-serial:${{ needs.validate-conventions-serial.result }}" \
                        "validate-consumer:${{ needs.validate-consumer.result }}" \
                        "smoke:${{ needs.validate-smoke.result }}" \
                        "import-discipline:${{ needs.import-discipline-test.result }}" \
                        "parity:${{ needs.parity-test.result }}" \
                        "incident-defense:${{ needs.incident-defense-test.result }}" \
                        "enforce-extensions:${{ needs.enforce-extensions.result }}"; do
            phase="${result%%:*}"
            status="${result##*:}"
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]; then
              echo "::error::$phase failed ($status)"
              exit 1
            fi
          done
          echo "All phases passed or were skipped"

      - name: Post comment
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const failed = Object.entries(needs)
              .filter(([, v]) => v.result !== 'success' && v.result !== 'skipped')
              .map(([k]) => k);
            const emoji = failed.length === 0 ? '✅' : '❌';
            const status = failed.length === 0 ? 'success' : 'failure';
            const detail = failed.length > 0
              ? '\nFailed: ' + failed.join(', ')
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} ATDD validation: **${status}**${detail}`
            });
