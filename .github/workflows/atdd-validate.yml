# ATDD Validation Workflow (toolkit repo)
# This workflow is for the atdd toolkit repo itself.
# Consumer repos get a generated version via `atdd init`.
name: ATDD Validate

on:
  push:
    branches: [main, "feat/*", "fix/*", "refactor/*", "chore/*", "docs/*", "devops/*"]
  pull_request:
    branches: [main]

# =============================================================================
# THE INSTALLED PATH (#1604) — why every pytest step below says `pip3 install -e .`
# and none of them says `PYTHONPATH=src`.
#
# The substrate pytest plugin is auto-loaded from the `pytest11` entry point in
# `pyproject.toml`, and the #1602 smoke-execution attestation attaches to that
# plugin. pytest reads entry points ONCE, at startup, from INSTALLED distribution
# metadata — a `*.dist-info` on `sys.path`. `PYTHONPATH=src` makes `import atdd`
# work and declares no metadata at all, so under it the plugin never loads, no
# attestation is ever written, and the run reports `passed` either way. A consumer
# who ran `pip install atdd` was always fine; the toolkit was testing the one
# configuration in which its own hook is inert.
#
# #1604 shipped `attestation-hook-install` first — one job that proves the hook
# needs the install. That left the half the issue's title actually promised: the
# jobs that run the repository's tests were still uninstalled. Measured on main at
# 33e6aed8: 13 workflow steps ran pytest over this checkout and 12 of them set
# `PYTHONPATH=src`, `attestation-hook-install` being the only one that did not.
# #1664's census (docs/smoke-audit.md) put the consequence in one number —
# `ci-can-record: 0`. Not one acceptance in this repository could be attested by
# CI, so declaring `execution_kind: live_smoke` on any of them would have left
# `SMOKE->REFACTOR` reachable only through `--force`: the rubber stamp E069 names
# and #1602's opt-in design exists to prevent.
#
# So the invariant is now flat across the file: a job that runs this repository's
# tests installs the distribution first. `PYTHONPATH=src` is not an equivalent
# spelling of it and is not a tidier one — it is the defect.
#
# `pyproject.toml` already sets `pythonpath = ["src"]` for pytest and the install
# is editable, so dropping the variable changes which `atdd` is imported not at
# all: it changes only whether the metadata that loads the hook is there.
#
# GUARDED, not merely intended: `tests/ci_install/` reads this file back and fails
# if any pytest step here runs uninstalled or re-adds `PYTHONPATH`. Reverting a job
# reds the suite rather than quietly re-opening #1604.
# =============================================================================

jobs:
  validate-planner:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      - name: Install the package and dependencies
        run: pip3 install -e . tree-sitter tree-sitter-typescript

      - name: Run planner validators
        run: python3 -m pytest src/atdd/planner/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-tester:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      - name: Install the package and dependencies
        run: pip3 install -e . tree-sitter tree-sitter-typescript

      - name: Run tester validators
        run: python3 -m pytest src/atdd/tester/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-coder:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      - name: Install the package and dependencies
        run: pip3 install -e . tree-sitter tree-sitter-typescript ruff pyright

      - name: Run coder validators
        run: python3 -m pytest src/atdd/coder/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-coach:
    runs-on: ubuntu-latest
    # The repo default is `default_workflow_permissions: read`, which grants the
    # workflow token contents/packages/metadata only — NOT pull-requests. Several
    # coach validators read open PRs through `gh`; without this scope the listing
    # comes back empty and they pass vacuously rather than failing. Measured on
    # PR #1692: coach.pr.merge-blocks-on-pre-smoke-close (disposition=strict)
    # blocked locally and passed in CI on the same commit (#1671 investigation).
    #
    # `administration: read` is the same lesson for branch protection (#1896).
    # Reading `repos/{owner}/{repo}/branches/main/protection` needs it; without
    # it the API answers 403, the client reports DEGRADED, and the four
    # test_branch_protection validators reached no verdict. That used to
    # `pytest.skip`, which is green — so CI reported branch protection verified
    # while it had never looked. Now the fixture refuses instead, which is what
    # made the missing scope visible. The fix is to grant what the check needs,
    # not to deselect the check.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      administration: read
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `build`/`setuptools`/`wheel` are needed by the #1474 packaging acceptances
      # (E062-SMOKE-001, E062-UNIT-001, C009-SMOKE-001), which live under
      # coach/validators/tests/ and build a real wheel into a real clean venv.
      # They are the executable form of what `validate-consumer` does in shell.
      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      - name: Install the package and dependencies
        run: pip3 install -e . tree-sitter tree-sitter-typescript build setuptools wheel

      - name: Run coach validators
        run: python3 -m pytest src/atdd/coach/validators/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Convention validator family/template/variant layer (#1204/#1206/#1212) — the
  # real-graph engine. Gates so the convention layer actually enforces in CI; a
  # prerequisite for retiring any legacy persona validator (no silent coverage loss).
  #
  # #1418/#1417: the suite is partitioned by mutation class and runs as TWO jobs, because
  # xdist workers share ONE checkout — a test that rewrites a plan or convention YAML would
  # corrupt every other worker's view of the tree. So the non-mutating majority runs here
  # under `-n auto`, the writers run serially in `validate-conventions-serial`, and BOTH fan
  # into validate-gate. The classification is enforced at runtime by the audit-hook guard in
  # conventions/_support/mutation_guard.py, and the two subsets are asserted to collect
  # exactly the un-split suite (E036) — a marker filter must never be able to drop coverage.
  validate-conventions:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      # pytest-xdist is a declared dependency in pyproject.toml, so `-n auto` below comes
      # with the package now; it no longer needs naming separately.
      - name: Install the package and dependencies
        run: pip3 install -e . tree-sitter tree-sitter-typescript

      - name: Run convention validators (non-mutating subset, parallel)
        run: >-
          python3 -m pytest src/atdd/validators/conventions/
          -m "not convention_filesystem_mutation" -n auto --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The other half of the partition above: every convention test that writes the checkout (or
  # drives a subprocess over it). These share one working tree by construction, so they run in
  # one process, serially, and never under -n.
  validate-conventions-serial:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      - name: Install the package and dependencies
        run: pip3 install -e . tree-sitter tree-sitter-typescript

      - name: Run convention validators (filesystem-mutating subset, serial)
        run: >-
          python3 -m pytest src/atdd/validators/conventions/
          -m "convention_filesystem_mutation" -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The consumer oracle (#1474). Every other job runs pytest over the checkout, so
  # `atdd.__file__` resolves into it, every data file exists by definition, and
  # `[tool.setuptools.package-data]` is never consulted. That stayed true when
  # #1604 made those jobs install the package: `pip install -e .` is EDITABLE, so
  # the import still resolves to `src/atdd` and package-data is still not consulted
  # — the install buys entry-point metadata, not packaging coverage. The wheel was
  # built only at publish time, AFTER merge. No PR could go red for a packaging
  # defect, which is how #663 sat open from 3.47.0 until a downstream user hit it,
  # and how #952/#1369 and the packaging half of #1341 all shipped.
  #
  # This job is the missing oracle: build the wheel, install it into a clean venv,
  # and exercise the shipped validators from a synthetic consumer repo that has no
  # `src/atdd/`. It gates on the two signals a packaging defect actually produces
  # there:
  #
  #   * wheel-completeness — every non-.py source file is present in the package.
  #   * a fully GREEN consumer sweep — every shipped validator across all four
  #     phases must PASS when run from a consumer that has no `src/atdd/`. A
  #     missing data file surfaces at IMPORT (`bind_rule()` runs at module scope,
  #     so an absent rule node raises RuleNotInRegistryError while pytest is still
  #     collecting and the whole sweep aborts — pre-fix that is 15 errors in tester
  #     and 15 in coder); a stack-path hardcode or a leaked toolkit self-test
  #     surfaces at RUN. Collection alone cannot see the second class.
  #
  # HISTORY (#1489): this gate first shipped (#1474) running `--collect-only`. That
  # made it structurally blind to every RUNTIME consumer failure — #689 stack-path
  # hardcodes and the #1341 toolkit-self-test residue shipped straight past it,
  # because collection exits 0 while the sweep, actually run, is red. A gate that
  # cannot fail is a stub; `test_wheel_completeness` was one for months. So the
  # verdict now comes from a REAL run (collection stays only as a fast pre-check).
  #
  # This job is EXPECTED to be RED on arrival, and that is deliberate — there are
  # genuine consumer failures on `main` today (#689's surviving stack hardcode, the
  # 2 remaining #1341 self-test leaks, `coder.dead-code.reachability`'s strict
  # false-positive). They are separately owned. Do NOT green this job by adding
  # `continue-on-error`, marker-excluding the failures, or narrowing the sweep —
  # that recreates the exact bug #1489 exists to kill. Fix the failures behind the
  # gate, or let the operator sequence them; never weaken the gate to hide them.
  validate-consumer:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      - name: Install build tooling
        run: pip3 install build setuptools wheel

      # `rm -rf build/` is not superstition: setuptools does not clean `build/lib`
      # between runs and bdist_wheel packs it wholesale, so a file left there by an
      # earlier build survives into every later wheel regardless of config. A fresh
      # CI checkout has no `build/`, but the guard costs nothing and keeps this job
      # honest if it ever runs after something that populated one.
      - name: Build the wheel
        run: |
          rm -rf build/ dist/
          python3 -m build --wheel --outdir dist/

      # A clean venv: the wheel and its declared dependencies, nothing else. This is
      # the step every other job is missing — `pip install` consults package-data,
      # `PYTHONPATH=src` never does.
      - name: Install the wheel into a clean venv
        run: |
          python3 -m venv /tmp/consumer-venv
          /tmp/consumer-venv/bin/pip install --quiet pytest dist/*.whl
          /tmp/consumer-venv/bin/python -c "import atdd, pathlib; print('installed:', pathlib.Path(atdd.__file__).parent)"

      # No src/atdd/ here, so a data file that did not ship is genuinely absent
      # rather than shadowed by the checkout.
      - name: Create a synthetic consumer repo
        run: |
          mkdir -p /tmp/consumer-repo
          cd /tmp/consumer-repo
          git init -q .
          test ! -e src/atdd || (echo "::error::consumer repo has a toolkit source tree" && exit 1)

      # FAST PRE-CHECK (not the verdict). A missing data file surfaces at IMPORT —
      # `bind_rule()` runs at module scope, so an absent rule node raises
      # RuleNotInRegistryError while pytest is still collecting and the sweep dies
      # before running a test. Pre-fix: 15 collection errors in tester, 15 in coder.
      # Collection is cheap and localises a packaging defect precisely, so we run it
      # first — but it is NOT the gate. Collection exits 0 on a repo whose sweep is
      # red (that blindness is the #1489 defect), so its verdict cannot stand alone.
      - name: Consumer sweep — collection pre-check (all four phases must COLLECT)
        run: |
          PKG=$(/tmp/consumer-venv/bin/python -c "import atdd, pathlib; print(pathlib.Path(atdd.__file__).resolve().parent)")
          cd /tmp/consumer-repo
          failed=0
          for phase in planner tester coder coach; do
            echo "::group::collect $phase"
            if ! /tmp/consumer-venv/bin/python -m pytest "$PKG/$phase/validators" \
                 -q -p no:cacheprovider --collect-only -m "not platform"; then
              echo "::error::$phase does not COLLECT off the installed wheel — a file its validators read at import did not ship"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # THE GATE (#1489). Run the shipped validators for real from the consumer
      # repo; the job's verdict is the sweep's exit code, not collection's. This is
      # the only step that can see a RUNTIME consumer failure — a stack-path
      # hardcode (#689) or a leaked toolkit self-test (#1341) passes collection and
      # fails here. Every phase runs even after an earlier one fails, so the log
      # reports the FULL failure set in one pass rather than stopping at the first.
      # `-m "not platform"` matches how a consumer actually invokes `atdd validate`
      # (platform-marked toolkit self-tests are not part of a consumer's surface);
      # it is the consumer's real filter, NOT a device to deselect failures.
      #
      # This is EXPECTED to be red while #689 / #1341 residue / dead-code.reachability
      # are open. Do not add `continue-on-error`, `|| true`, or narrow the sweep to
      # green it — see the job header. Fix the failures, do not hide them.
      - name: Consumer sweep — all four phases must PASS (real run, exit 0)
        run: |
          PKG=$(/tmp/consumer-venv/bin/python -c "import atdd, pathlib; print(pathlib.Path(atdd.__file__).resolve().parent)")
          cd /tmp/consumer-repo
          failed=0
          for phase in planner tester coder coach; do
            echo "::group::run $phase"
            if ! /tmp/consumer-venv/bin/python -m pytest "$PKG/$phase/validators" \
                 -q -p no:cacheprovider -rf -m "not platform"; then
              echo "::error::$phase FAILS when run off the installed wheel — a shipped validator does not pass in a consumer repo"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # The #451 gate, run the only way it has ever been able to run: package
      # imported from the venv's site-packages, cwd at the toolkit checkout.
      - name: Wheel-completeness gate against the installed package
        run: |
          PKG=$(/tmp/consumer-venv/bin/python -c "import atdd, pathlib; print(pathlib.Path(atdd.__file__).resolve().parent)")
          /tmp/consumer-venv/bin/python -m pytest "$PKG/coach/validators/test_wheel_completeness.py" \
            -v -rs -p no:cacheprovider --tb=short

  # SMOKE phase: opt-in via SMOKE_BASE_URL repo secret (issue #293).
  # When unset, the job ends with `success` via the early-skip step and the
  # validate-gate fan-in accepts it. When set, Playwright runs the e2e smoke
  # specs against that URL and the gate fails on any failure.
  # The toolkit-self repo has no web/ — secret stays unset; job is a no-op.
  # HONEST REPORTING (#1643, for #1670). This job's green does NOT mean smoke
  # verification passed. In THIS repository it means nothing ran, and it has never
  # meant anything else: `SMOKE_BASE_URL` is not among the repo's secrets, there is
  # no `package.json`, and `find . -name '*.spec.ts'` returns zero files. Every step
  # below is gated on the secret, so all of them skip and GitHub records the JOB as
  # `success` — indistinguishable, in the fan-in, from a job that ran and passed.
  #
  # That is exactly the failure mode #1670 exists to eliminate: it makes the approval
  # token prove that gates PASSED rather than attest that a human pressed a key, and a
  # token is only as honest as the green it reads. It is the same family as #1632
  # (a validator deselected by a marker expression reports green without running) —
  # different mechanism, identical consequence: a check that certifies nothing.
  #
  # The opt-in contract itself is deliberate and stays: `smoke.convention.yaml`
  # (ci_integration.trigger_rules.when_secret_unset) specifies that an unconfigured
  # consumer repo exits success and the gate stays green. So this does NOT fail the
  # build. What it does is stop the state being INVISIBLE — the job now publishes
  # `status` as an output, and validate-gate prints NOT APPLICABLE for it instead of
  # silently counting it among the passes. Changing the green-when-unset contract
  # is a convention change and belongs to the planner, not to this workflow edit.
  validate-smoke:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
    outputs:
      # "not-applicable" = nothing ran. "executed" = the specs actually ran.
      # validate-gate reads this so a receipt can tell the two apart.
      status: ${{ steps.smoke-status.outputs.status }}
    steps:
      - name: Skip when SMOKE_BASE_URL is unset
        id: smoke-status
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "status=not-applicable" >> "$GITHUB_OUTPUT"
            echo "::notice title=SMOKE not applicable::SMOKE_BASE_URL is not configured — no smoke specs were executed. This job's success attests NOTHING about runtime behaviour."
            echo "SMOKE_BASE_URL not configured — skipping Playwright smoke run."
            echo "(Set the SMOKE_BASE_URL repo secret to enable runtime smoke verification.)"
          else
            echo "status=executed" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: env.SMOKE_BASE_URL != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.SMOKE_BASE_URL != ''
        with:
          node-version: "20"

      - name: Install Playwright
        if: env.SMOKE_BASE_URL != ''
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm init -y
            npm install --save-dev @playwright/test
          fi
          npx playwright install --with-deps chromium

      - name: Run e2e smoke specs
        if: env.SMOKE_BASE_URL != ''
        run: npx playwright test "e2e/**/*smoke*.spec.ts"

  # The CAUSAL PROOF for #1604 (see THE INSTALLED PATH at the top of this file).
  #
  # Every other python job now installs the package too, so this job is no longer
  # the only installed path — and that is exactly why it must stay. The other jobs
  # DEPEND ON the claim that installing is what loads the hook; this one MEASURES
  # it, by running the same source twice through one venv (installed, then reachable
  # only by PYTHONPATH) and showing the plugin loads in the first arm and not the
  # second. Delete it and the invariant everywhere else becomes a habit nobody
  # checks.
  #
  # `tests/ci_install/` also reads this workflow back and asserts the wiring —
  # here AND in every other pytest job — so reverting any of them reds the suite.
  #
  # Do NOT add `PYTHONPATH=src` here to make it look like its neighbours. Its
  # neighbours no longer set it either, and the suite below fails if you do.
  attestation-hook-install:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    env:
      # Read by tests/ci_install/: in THIS job "the substrate plugin is loaded" is
      # a hard requirement rather than a consistency check, so an install that
      # silently stops taking effect fails the job instead of passing quietly.
      ATDD_HOOK_MUST_BE_INSTALLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # THE POINT OF THIS JOB. Not a convenience, not a faster import path: this
      # is what writes the `atdd` dist-info that pytest's entry-point discovery
      # reads at startup. Removing it does not slow the job down — it silently
      # unloads the hook.
      - name: Install the package (this is what makes the hook loadable)
        run: pip3 install -e .

      # Deliberately NO `PYTHONPATH=src`. The install above already puts `atdd` on
      # the path; adding PYTHONPATH would only make this job resemble the ones
      # that cannot load the plugin, and the suite below rejects it.
      - name: Prove the hook fires when the package is installed
        run: python3 -m pytest tests/ci_install/ -v --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Coach decomposition gates (docs/coach-decomposition.md §10, §12.3) ---
  # These two tests are required-CI from #889 onward and gate EVERY PR in the
  # migration. The import-discipline test enforces the §3.3 layer dependency
  # rules; the lifecycle parity test proves INIT→COMPLETE behavior with all
  # externals mocked. Failing either blocks merge via the validate-gate fan-in.
  import-discipline-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      - name: Install the package and dependencies
        run: pip3 install -e .

      - name: Run import-discipline test (§10.2)
        run: python3 -m pytest tests/architecture/test_layer_imports.py -v --tb=short

  parity-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      - name: Install the package and dependencies
        run: pip3 install -e .

      - name: Run lifecycle parity test (§10.1)
        run: python3 -m pytest tests/lifecycle/test_full_issue_parity.py -v --tb=short

  # Incident-defense suite (docs/coach-decomposition.md §9, §12.1 item 7).
  # Each migration child that touches a layer adds explicit tests under
  # tests/incident_defenses/ proving the defenses it preserves. Child 5 (#892)
  # ships the worktree defenses (I-1 bare dispatch, I-2 protected main, I-9
  # core.bare=false). Failing blocks merge via the validate-gate fan-in.
  incident-defense-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      # jsonschema is required by atdd.coach.commands.durability, which the
      # I-8 decision-durability incident test imports (#897); it is a declared
      # dependency, so the install below carries it.
      - name: Install the package and dependencies
        run: pip3 install -e .

      - name: Configure git identity (real-git worktree tests)
        run: |
          git config --global user.email "atdd-ci@example.com"
          git config --global user.name "ATDD CI"

      - name: Run incident-defense suite (§9)
        run: python3 -m pytest tests/incident_defenses/ -v --tb=short

  # Extension-convention enforcement (#1359 wired it; #1428 made it REQUIRED).
  # Runs `atdd enforce` over the vendored, committed substrate
  # (.atdd/{extensions,workspaces} + binding.lock).
  #
  # The convention VERDICT is now BLOCKING — this job's failure fails the
  # validate-gate fan-in and blocks the merge. That is the point of train 0007:
  # enforcement nobody is accountable to is not enforcement.
  #
  # It is blocking BUT BASELINED. The toolkit does not pass its own rules today
  # (23 of 51 enforced rules carry violations), so the verdict is judged against
  # `.atdd/enforce-ratchet.yaml` — a per-rule violation-count DEBT REGISTER
  # (#1428 E003). A rule at or below its recorded count is held FLAT; a rule ABOVE
  # it, or a clean rule that starts failing, FAILS the build. The register can only
  # ever be TIGHTENED — to pay debt down, fix violations and re-record with
  # `atdd enforce --paths src/atdd --record-ratchet .atdd/enforce-ratchet.yaml`.
  # NEVER raise a count to green a red build: that is precisely what this gate exists
  # to catch.
  #
  # Substrate digest coherence and the gate wiring are likewise blocking (real
  # invariants). train-interlocking is no longer deferred: the #1426 fan-out
  # composes its list-valued realizes_convention and the extension ships enabled,
  # so its rules bind, verify, and enforce here like any other.
  enforce-extensions:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      - name: Install the package and dependencies
        run: pip3 install -e . tree-sitter tree-sitter-typescript

      # Blocking: the committed vendored substrate must be digest-coherent.
      # PYTHONDONTWRITEBYTECODE keeps the tree clean — compute_digest hashes .pyc,
      # so a compiled provider would otherwise drift the digest.
      - name: Verify extension substrate (blocking)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m atdd enforce --verify-substrate --repo-root .

      # BLOCKING (#1428 E001). No `continue-on-error`, no `|| true`: a strict
      # convention FAIL exits non-zero, fails this job, and blocks the merge via the
      # validate-gate fan-in.
      #
      # `--ratchet` is what makes that safe on day one (#1428 E003): the repository's
      # pre-existing violations are held FLAT against the recorded baseline, so this
      # goes green on the known debt — while any rule climbing ABOVE its baseline, or
      # any clean rule that starts failing, reds the build.
      - name: Enforce extension conventions (BLOCKING — ratcheted, #1428)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Scope to the toolkit's product code (config `code.toolkit: src/atdd`);
          # avoids scanning the vendored substrate's own intentional-dirty fixtures.
          # The baseline was recorded over this exact scope — they must not diverge.
          python3 -m atdd enforce --repo-root . --paths src/atdd \
            --ratchet .atdd/enforce-ratchet.yaml

      # Blocking: the gate wiring + substrate guards must hold (regression guard).
      - name: Assert enforce gate wiring
        run: python3 -m pytest tests/enforce/ -v --tb=short

  # Non-validator regression protection (#1643). Every other python job above runs
  # a VALIDATOR path (or a named guard under tests/). That left the bulk of the
  # tree — the command, state, substrate and runtime suites — outside CI entirely:
  # 1328 `test_*.py` files exist under src/ and tests/, and before this job only
  # 434 of them were reachable by any workflow. A regression in the other 894 could
  # merge green and nobody would learn until someone ran the directory by hand.
  #
  # This is not hypothetical. #1671's fix (atdd upgrade executes pip on a pipx
  # install) introduced EIGHT real regressions — its worker measured 44 failures
  # before, 52 with the fix, 44 after repairing them. Every one of those eight was
  # in a directory no job ran, so they would have merged green. That is the same
  # family as #1632 and #1672: a gate that reports green without checking. The
  # eight landed in `src/atdd/tests/` and `src/atdd/coach/commands/tests/`; the
  # first is covered below as of this change, the second is red and sequenced.
  #
  # SCOPE — this job covers the uncovered suites that are GREEN TODAY, and only
  # those. It is deliberately NOT the whole 894. The remaining uncovered suites
  # are red or too slow right now and are sequenced separately:
  #
  #   src/atdd/coach/commands/tests        41 failed + 1 error   (#1643 follow-up)
  #   src/atdd/coach/templates/hooks/tests 11 failed                    "
  #   src/atdd/tester/substrate            11 failed                    "
  #   tests/coach tests/integration        11 failed                    "
  #   src/atdd/planner/commands/tests       9 failed                    "
  #   src/atdd/enforce/tests                8 failed                    "
  #   src/atdd/planner/migration            1 failed                    "
  #   tests/integrations/github             2 COLLECTION errors          "
  #   src/atdd/enforce_binding_plan         green but 11 min            "
  #
  # Adding the red ones here today would red main. They need their dead tests
  # retired FIRST — a ratchet recorded over them would be baselining corpses, not
  # debt. Do NOT add them to this job to "finish the coverage"; add them once they
  # are green or once a ratchet records real debt.
  #
  # `enforce_binding_plan` is excluded for COST, not correctness. Measured: 15
  # passed, 2 skipped in 659.73s. Each smoke test shells out to a full `atdd
  # enforce` sweep over the checkout at 64-82s a call, so this one directory would
  # more than triple the job below and become its critical path. It needs its own
  # job or a cheaper fixture, not exclusion by silence — hence the follow-up.
  #
  # Do NOT green a future failure here with `-m "not platform"`. 169 of the 249
  # files in coach/commands/tests carry a module-level `pytestmark =
  # [pytest.mark.platform]`, so that expression deselects 751 of 1086 tests and
  # drops the failure count from 41 to 12 while running under a third of the
  # directory. That is the #1632 false-green mechanism, and the consumer-oracle
  # job above already says it plainly: the filter is a consumer's real filter,
  # NOT a device to deselect failures.
  regression-suite-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'atdd-issue') ||
      contains(github.event.issue.labels.*.name, 'atdd-wmbt')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd-toolkit

      # `-e .`, never `PYTHONPATH=src` — see THE INSTALLED PATH at the top of this file (#1604).
      # These suites import only pytest, jsonschema and yaml beyond the stdlib —
      # no tree-sitter, no network client (verified by sweeping every import in
      # the covered paths, #1643 audit) — and all three are declared dependencies,
      # so the install below is a superset of the list it replaces.
      - name: Install the package and dependencies
        run: pip3 install -e .

      # Several of these suites drive real git over a temporary worktree, which
      # refuses to commit without an identity — the same reason incident-defense-test
      # configures one.
      - name: Configure git identity (real-git worktree tests)
        run: |
          git config --global user.email "atdd-ci@example.com"
          git config --global user.name "ATDD CI"

      # No `-m` expression. These paths run WHOLE — that is the point of the job.
      # The five FILES at the end are named by path rather than by directory,
      # because their directories cannot go in whole: measured 2026-09-07,
      # `src/atdd/coach/commands/tests` has 45 pre-existing failures and 1 error out
      # of 1129, and `src/atdd/tester/substrate` has 11. Retiring those is #1701's
      # subject; naming a file keeps it covered without importing the debt.
      #
      # C014 (#1632) came first. C016, E008 and E071 joined in #1814: #1664's census
      # classified all three `can-attest-today` — anchored by a real smoke test —
      # while no job ran them, so the only three smoke acceptances in this repository
      # that both CAN attest and DO pass were invisible to every PR. All three are
      # green (1, 1 and 3 tests).
      #
      # Y004-SMOKE-001 was deliberately NOT added alongside them, though the same
      # census scored it identically. It is `5 skipped, 0 passed`: its module gates
      # on `ATDD_RUN_SMOKE`, which no workflow sets. Adding it would buy a green
      # check that runs nothing — the #1632/#1670 shape this job exists to end.
      # Whether that variable should be set here, or those 16 acceptances should stop
      # self-skipping, is a convention question (#1151), not a CI-wiring one.
      - name: Run non-validator regression suites
        run: |
          python3 -m pytest \
            src/atdd/tests \
            src/atdd/state/tests \
            src/atdd/substrate \
            src/atdd/runners \
            src/atdd/runtime \
            src/atdd/train \
            src/atdd/journey \
            src/atdd/author_atdd_substrate \
            src/atdd/coach/utils \
            src/atdd/coach/runtime \
            src/atdd/coach/gate \
            src/atdd/coach/handlers \
            src/atdd/coach/plugins \
            src/atdd/coach/tests \
            src/atdd/coach/templates/bin/tests \
            src/atdd/coder/utils \
            src/atdd/planner/interlocking \
            src/atdd/coach/commands/tests/test_c014_unit_003_baseline_carries_the_count.py \
            src/atdd/coach/commands/tests/test_c014_smoke_001_real_runner_reports_deselection.py \
            src/atdd/coach/commands/tests/test_c016_smoke_001_real_cli_admits_the_commit_on_a_divergent_branch.py \
            src/atdd/coach/commands/tests/test_e008_smoke_001_registration_visible_cross_worktree.py \
            src/atdd/tester/substrate/tests/test_e071_smoke_001_audit_classifies_both_directions.py \
            -q --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Separate invocation, NOT an exclusion. `src/atdd/coder/conventions/` has no
      # `__init__.py`, so pytest walks up only as far as `conventions/` when naming
      # these modules and calls them `tests.test_*`. Run alongside the paths above,
      # that name resolves to the repo-root `tests/` package (which IS a package and
      # is on the path) and collection dies with ModuleNotFoundError on all five
      # files. Alone, pytest puts `conventions/` on sys.path and they import fine.
      # Running them in their own process is the fix that touches no source; adding
      # the missing `__init__.py` is the real repair and belongs with the follow-up.
      - name: Run coder convention-recipe suite (own process — see comment)
        run: python3 -m pytest src/atdd/coder/conventions/tests -q --tb=short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Note: the pre-merge `version-bump` PR check was removed in #462 phase 2.
  # Version is now bumped automatically on main by the bump-on-merge step in
  # `.github/workflows/post-merge-lifecycle.yml` (branch-prefix → semver
  # class). Branch protection's `Version bump check` required-check must be
  # removed by an admin BEFORE this PR merges, otherwise PRs will hang on a
  # check that no longer reports.

  validate-gate:
    needs: [validate-planner, validate-tester, validate-coder, validate-coach, validate-conventions, validate-conventions-serial, validate-consumer, validate-smoke, attestation-hook-install, import-discipline-test, parity-test, incident-defense-test, enforce-extensions, regression-suite-test]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
    steps:
      - name: Check results
        run: |
          # #1643 (for #1670): a job that ran nothing must not be reported as a
          # pass. validate-smoke exits success when SMOKE_BASE_URL is unset — the
          # opt-in contract in smoke.convention.yaml — so its `success` below is
          # NOT evidence of runtime verification. Name that state explicitly, so a
          # reader (or a conditional mint) can tell "gate passed" from "gate was
          # never configured to run". This does not change the verdict.
          #
          # Reported BEFORE the verdict loop, deliberately. What did and did not
          # execute is a fact about the run, not a reward for passing; if this sat
          # after the loop it would be unreachable on every red run — exactly when
          # a reader most needs to know which checks were real.
          if [ "${{ needs.validate-smoke.outputs.status }}" = "not-applicable" ]; then
            echo "::warning title=Gate reported NOT APPLICABLE::smoke: NOT APPLICABLE — SMOKE_BASE_URL unset, no specs executed. Its green is not a pass."
            echo "smoke: NOT APPLICABLE (no specs executed — not a pass)"
          fi

          for result in "planner:${{ needs.validate-planner.result }}" \
                        "tester:${{ needs.validate-tester.result }}" \
                        "coder:${{ needs.validate-coder.result }}" \
                        "coach:${{ needs.validate-coach.result }}" \
                        "conventions:${{ needs.validate-conventions.result }}" \
                        "conventions-serial:${{ needs.validate-conventions-serial.result }}" \
                        "validate-consumer:${{ needs.validate-consumer.result }}" \
                        "smoke:${{ needs.validate-smoke.result }}" \
                        "attestation-hook-install:${{ needs.attestation-hook-install.result }}" \
                        "import-discipline:${{ needs.import-discipline-test.result }}" \
                        "parity:${{ needs.parity-test.result }}" \
                        "incident-defense:${{ needs.incident-defense-test.result }}" \
                        "enforce-extensions:${{ needs.enforce-extensions.result }}" \
                        "regression-suite:${{ needs.regression-suite-test.result }}"; do
            phase="${result%%:*}"
            status="${result##*:}"
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]; then
              echo "::error::$phase failed ($status)"
              exit 1
            fi
          done

          echo "All phases passed or were skipped"

      - name: Post comment
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const failed = Object.entries(needs)
              .filter(([, v]) => v.result !== 'success' && v.result !== 'skipped')
              .map(([k]) => k);
            const emoji = failed.length === 0 ? '✅' : '❌';
            const status = failed.length === 0 ? 'success' : 'failure';
            const detail = failed.length > 0
              ? '\nFailed: ' + failed.join(', ')
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} ATDD validation: **${status}**${detail}`
            });
