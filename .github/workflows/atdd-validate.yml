# ATDD Validation Workflow
# Generated by `atdd init` — safe to overwrite on re-run
name: ATDD Validate

on:
  push:
    branches: [main, "feat/*", "fix/*", "refactor/*", "chore/*", "docs/*", "devops/*"]
  pull_request:
    branches: [main]
  issues:
    types: [opened, edited, closed, labeled, unlabeled]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'issues'
    outputs:
      planner: ${{ steps.filter.outputs.planner }}
      tester: ${{ steps.filter.outputs.tester }}
      coder: ${{ steps.filter.outputs.coder }}
      coach: ${{ steps.filter.outputs.coach }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            planner:
              - 'plan/**'
            tester:
              - 'contracts/**'
              - 'telemetry/**'
            coder:
              - 'web/**'
              - 'python/**'
              - 'packages/**'
              - 'supabase/**'
              - 'src/**'
            coach:
              - '.atdd/**'
              - '.github/**'

  validate-planner:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: >-
      always() && (
        (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'atdd-issue') || contains(github.event.issue.labels.*.name, 'atdd-wmbt'))) ||
        (github.event_name != 'issues' && needs.detect-changes.outputs.planner == 'true')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd

      - name: Install ATDD toolkit
        run: pip3 install atdd

      - name: Run planner validators
        run: atdd validate planner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-tester:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: >-
      always() && (
        (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'atdd-issue') || contains(github.event.issue.labels.*.name, 'atdd-wmbt'))) ||
        (github.event_name != 'issues' && needs.detect-changes.outputs.tester == 'true')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd

      - name: Install ATDD toolkit
        run: pip3 install atdd

      - name: Run tester validators
        run: atdd validate tester
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-coder:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: >-
      always() && (
        (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'atdd-issue') || contains(github.event.issue.labels.*.name, 'atdd-wmbt'))) ||
        (github.event_name != 'issues' && needs.detect-changes.outputs.coder == 'true')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd

      - name: Install ATDD toolkit
        run: pip3 install atdd

      - name: Run coder validators
        run: atdd validate coder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-coach:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: >-
      always() && (
        (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'atdd-issue') || contains(github.event.issue.labels.*.name, 'atdd-wmbt'))) ||
        (github.event_name != 'issues' && needs.detect-changes.outputs.coach == 'true')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd

      - name: Install ATDD toolkit
        run: pip3 install atdd

      - name: Run coach validators
        run: atdd validate coach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-gate:
    needs: [validate-planner, validate-tester, validate-coder, validate-coach]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
    steps:
      - name: Check results
        run: |
          for result in "planner:${{ needs.validate-planner.result }}" \
                        "tester:${{ needs.validate-tester.result }}" \
                        "coder:${{ needs.validate-coder.result }}" \
                        "coach:${{ needs.validate-coach.result }}"; do
            phase="${result%%:*}"
            status="${result##*:}"
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]; then
              echo "::error::$phase failed ($status)"
              exit 1
            fi
          done
          echo "All phases passed or were skipped"

      - name: Post comment
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const failed = Object.entries(needs)
              .filter(([, v]) => v.result !== 'success' && v.result !== 'skipped')
              .map(([k]) => k);
            const emoji = failed.length === 0 ? '✅' : '❌';
            const status = failed.length === 0 ? 'success' : 'failure';
            const detail = failed.length > 0
              ? '\nFailed: ' + failed.join(', ')
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} ATDD validation: **${status}**${detail}`
            });
