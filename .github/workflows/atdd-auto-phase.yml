# Auto-transition the parent atdd-issue's phase when its PR merges.
# Issue #355: hands-free single-step phase advance per state machine
# (RED→GREEN, GREEN→SMOKE, SMOKE→REFACTOR, REFACTOR→COMPLETE).
name: ATDD Auto Phase

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  auto-phase:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
      projects: write   # Issue #384: required for ProjectV2 sync.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install atdd toolkit
        run: pip3 install -e .

      - name: Run atdd auto-phase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PYTHONPATH=src python3 -m atdd.cli auto-phase "$PR_NUMBER"
