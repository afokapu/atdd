# Shadow-mode projection CI (#1400 CORE-032, M001).
#
# Recomputes project(store) on every push and reports its drift against the committed projection.
#
# It used to claim a second comparison, against the manifest-derived projection. That input was
# deleted by `decommission-manifest`, so the comparison could only ever report a skip; it was
# removed in #2023.
#
# THIS JOB IS NON-BLOCKING, AND THAT IS THE POINT. It exits 0 even when it finds drift, and it is
# deliberately absent from the required-status-check list in `.github/atdd-merge-authority-policy.yaml`.
# A shadow check that could fail a build is a blocking check with a misleading name: it would demand
# the trust that the shadow window exists to EARN. Flip the gate on day one and the first unnoticed
# drift stops every merge in the repo; leave it off entirely and the drift accumulates unseen until
# the day you do flip it, when every branch is red at once and nobody knows which one broke it.
#
# `atdd state canonicality` (atdd-projection-canonicality.yml) is the check that BLOCKS. When the
# drift reported here has been zero for long enough that the team believes it, that gate becomes
# required — see `.atdd/policy/migration-rollout.yaml`, step `blocking-mode` — and this job's job
# is done.
#
# It needs no GitHub API and no provider: it reads the store and the projection.

name: ATDD Projection Shadow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shadow-projection:
    name: shadow projection drift (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install atdd
        run: python -m pip install --quiet -e .

      - name: Report projection drift
        id: shadow
        env:
          CI: "true"
        run: |
          # Exits 0 by design, drift or no drift (M001). The report is the deliverable — so
          # capture stderr too. Without `pipefail` this step's status is `tee`'s, and a tool that
          # died would otherwise be laundered into a green job with an empty report (#2023).
          set -o pipefail
          atdd state shadow --root . 2>&1 | tee shadow-report.txt

      - name: Publish the drift report to the job summary
        if: always()
        run: |
          {
            echo '## Shadow projection drift'
            echo
            echo 'Non-blocking by design — this job reports, it does not gate.'
            echo
            echo '```'
            if [ -s shadow-report.txt ]; then
              cat shadow-report.txt
            else
              # An empty report is NOT a clean one. `cat` on an empty-but-present file succeeds,
              # so the old `|| echo` fallback never fired and a crash rendered as zero drift.
              echo '(no report produced — the shadow command wrote nothing; treat as FAILED TO RUN)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
