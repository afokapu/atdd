# Auto-transition the parent atdd-issue's phase when its PR merges.
# Issue #355: hands-free single-step phase advance per state machine
# (RED→GREEN, GREEN→SMOKE, SMOKE→REFACTOR, REFACTOR→COMPLETE).
#
# Generated by `atdd init` — safe to overwrite on re-run.
name: ATDD Auto Phase

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  auto-phase:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
      projects: write   # Issue #384: required for ProjectV2 sync.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-atdd

      - name: Install ATDD toolkit
        run: pip3 install atdd

      - name: Run atdd auto-phase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: atdd auto-phase "$PR_NUMBER"
