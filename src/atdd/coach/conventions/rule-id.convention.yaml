schema_version: "1.0.0"
convention_id: "coach.rule-id"
name: "Rule-ID Convention"
description: "Machine-readable schema, DOMAIN registry, and migration playbook for the rule-ID grammar defined in src/atdd/coach/specs/rule-id.spec.md."

# =============================================================================
# Source-of-truth pointer
# =============================================================================
spec:
  human_readable: "src/atdd/coach/specs/rule-id.spec.md"
  ids:
    - "SPEC-COACH-RULEID-0001"   # grammar (namespaced)
    - "SPEC-COACH-RULEID-0002"   # DOMAIN registry is closed (legacy archive)
    - "SPEC-COACH-RULEID-0003"   # severity scale 1..5
    - "SPEC-COACH-RULEID-0004"   # stability + superseded_by
    - "SPEC-COACH-RULEID-0005"   # recipe linkage
    - "SPEC-COACH-RULEID-0006"   # per-rule YAML shape (gains validator/fix_hint/aliases)
    - "SPEC-COACH-RULEID-0007"   # bidirectional binding contract

# =============================================================================
# Grammar (machine-readable mirror of SPEC-COACH-RULEID-0001)
# =============================================================================
grammar:
  pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*\\.[a-z][a-z0-9]*(-[a-z0-9]+)*\\.[a-z][a-z0-9]*(-[a-z0-9]+)*$"
  description: |
    <archetype>.<convention_short_name>.<rule_name>
    archetype ∈ {coder, coach, tester, planner, repo}
    convention_short_name = filename without .convention.yaml
    rule_name = hyphenated human-readable
  separator: "."
  segments:
    - archetype
    - convention_short_name
    - rule_name

# =============================================================================
# Legacy grammar (issue #389 Phase 1)
# =============================================================================
# Pre-#340 rule IDs whose shape predates the canonical
# `<DOMAIN>-<TOPIC>-<NNN>` grammar. Acceptance is gated on the declaring
# convention being listed under `migration.completed:` — legacy IDs in
# unmigrated files are still ignored exactly as before.
#
# Decision #8: `AP-DS-NN` and `COACH-BABYSIT-NNN` are NOT legacy — they
# already match the canonical regex (two-or-more-hyphen IDs are canonical),
# so adding them here would create double-grammar uniqueness edge cases.
#
# New rules MUST use the canonical grammar. This block exists to preserve
# history without forcing flag-day renames across every reference site.
legacy_grammar:
  - pattern: "^[A-Z][A-Z0-9]*(-[A-Z0-9]+){2,4}$"
    rationale: "Pre-#399 flat grammar (DOMAIN-TOPIC-NNN) — retained as aliases on canonical rules."
  - pattern: "^DS-\\d{2}$"
    rationale: "Design-system principles (e.g., DS-01) — predate DESIGN-* canonical IDs."
  - pattern: "^ERR-\\d{2}$"
    rationale: "Error-response rules (e.g., ERR-01) — predate ERROR-* canonical IDs."
  - pattern: "^GP-\\d{2}$"
    rationale: "Green-phase rules (e.g., GP-01) — predate GREEN-* canonical IDs."
  - pattern: "^COACH-PRGATE-\\d{4}$"
    rationale: "PR-phase gate rules (e.g., COACH-PRGATE-0003) — predate canonical 3-digit grammar; published in issue #293."

# =============================================================================
# DOMAIN registry (closed set — SPEC-COACH-RULEID-0002)
# =============================================================================
# Adding a value here is a SPEC edit. The rule-id-uniqueness validator
# reads this list as the authoritative DOMAIN set.
domains:
  # ATDD lifecycle phases
  - GREEN
  - RED
  - SMOKE
  - REFACTOR
  # Agent areas
  - COACH
  - PLANNER
  - TESTER
  # Convention areas (mirror of file names in src/atdd/coder/conventions/)
  - BOUNDARIES
  - DESIGN
  - SECURITY
  - LOGGING
  - DTO
  - ERROR
  - PRESENTATION
  - DUPLICATION
  - DEAD-CODE
  - COMPLEXITY

# =============================================================================
# Severity scale (machine-readable mirror of SPEC-COACH-RULEID-0003)
# =============================================================================
severity_scale:
  type: integer
  minimum: 1
  maximum: 5
  levels:
    1: { name: "advisory",        examples: ["style nits", "ordering preferences"] }
    2: { name: "maintainability", examples: ["naming", "file-header completeness"] }
    3: { name: "architectural",   examples: ["URN markers", "layer boundaries"] }
    4: { name: "correctness",     examples: ["error handling", "DTO validation"] }
    5: { name: "security",        examples: ["XSS", "unsafe deserialization"] }

# =============================================================================
# Per-rule YAML shape (SPEC-COACH-RULEID-0006)
# =============================================================================
rule_schema:
  required: [id, severity, description, disposition]
  optional: [recipe, introduced_in, superseded_by, suppression_deadline, validator, fix_hint, aliases]
  conditional:
    - rule: "validator REQUIRED when disposition ∈ {strict, suppress-and-clean, advisory}"
    - rule: "validator MUST be absent when disposition == documentation-only"
  fields:
    id:
      type: string
      pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*\\.[a-z][a-z0-9]*(-[a-z0-9]+)*\\.[a-z][a-z0-9]*(-[a-z0-9]+)*$"
      description: "Stable namespaced rule ID matching the canonical grammar."
    severity:
      type: integer
      minimum: 1
      maximum: 5
    description:
      type: string
      description: "One-line human-readable rule statement."
    disposition:
      type: string
      enum: [strict, suppress-and-clean, advisory, documentation-only]
      description: |
        Per-rule policy that decides CI behavior on violations
        (issue #395, replaces RatchetBaseline):
          - strict             — any violation fails CI.
          - suppress-and-clean — pre-existing violations carry inline
              ``# atdd:suppress(<id>) [UNTIL=<YYYY-MM-DD>]`` markers;
              new (unsuppressed) violations fail CI.
          - advisory           — emits warnings, never fails CI.
          - documentation-only — explicitly carries no validator; declared
              for documentation/principle purposes (issue #399). Reverse
              coherence (test_rule_validator_binding.py) skips these rules.
    suppression_deadline:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: |
        Optional default UNTIL= deadline for suppress-and-clean rules,
        used when stamping new suppression markers. Per-site UNTIL=
        overrides this default. Decision #4: optional in v1.
    recipe:
      type: string
      description: "Name of a peer *.recipe.yaml file (without the .recipe.yaml suffix)."
    introduced_in:
      type: string
      description: "Toolkit version that first published this rule."
    superseded_by:
      type: string
      description: "Newer rule ID that replaces this one (deprecation window)."
    validator:
      type: string
      pattern: "^[a-z][a-z0-9_]*::[a-z][a-z0-9_]*$"
      description: |
        Bidirectional back-reference to the validator that emits this rule.
        Form: ``<module_basename>::<function_name>`` where ``module_basename``
        is the validator filename without the ``.py`` suffix (e.g.
        ``test_dead_code_python::test_no_unreachable_definitions``). The
        dotted-import path is INFERRED at resolve time from the rule's
        archetype: ``atdd.<archetype>.validators.<module_basename>``.
        REQUIRED when disposition ∈ {strict, suppress-and-clean, advisory};
        MUST be absent when disposition == documentation-only. (issue #399)
    fix_hint:
      type: string
      description: |
        Canonical remediation guidance for this rule. Replaces ad-hoc
        per-Violation ``fix_hint_ref`` (Violation can still override).
        (issue #399)

        ── Completeness contract (issue #467) ────────────────────────────
        Every fix_hint — whether declared in a convention YAML or printed
        from a CLI command (``Fix: …``) — MUST satisfy ALL FOUR clauses:

          C1 — Placeholder resolution.
            Every ``<placeholder>`` token in the hint MUST have a sibling
            resolver line within the same hint block, of the form:
              (see <file>::<path>)        — point at a definition site
              (run <command>)             — name a CLI to enumerate values
              (e.g. "<concrete-example>") — show one literal value
            A bare ``<placeholder>`` with no resolver fails C1: the reader
            has no way to discover what to substitute (e.g. issue #466's
            train-required hint at commands/issue.py:1682-1684 — bare
            ``<train_id>`` token, no resolver line).

          C2 — No deprecation contradiction.
            A hint MUST NOT recommend a CLI form flagged deprecated by any
            ``Deprecated:`` warning the same toolkit emits. The validator
            builds a deprecation registry from
            ``_deprecation_warning(old, new)`` callsites in
            ``src/atdd/cli.py`` and cross-references the first
            atdd-subcommand referenced inside each Fix: hint.

          C3 — Prerequisite disclosure.
            When the hint's command requires an operational prerequisite
            (worktree-cd, file existence, env-var) that produces a
            *different* error if absent, that prerequisite MUST be
            disclosed as step 1 of a numbered fix sequence. Heuristic:
            hint contains a ``1.`` step marker when a known prereq pattern
            applies.

          C4 — Runnable as printed.
            A copy-paste of the hint's command (or, for numbered hints,
            the steps as written) MUST succeed without further
            investigation, given the C3 prerequisite is met. Sandbox-smoke
            verification is OPTIONAL (Phase 3 deliverable of #467); the
            structural clauses C1-C3 are mandatory.

        See the ``# === Fix-hint completeness contract ===`` exemplars
        block below for positive + negative samples. The
        ``coach.rule-id.fix-hint-completeness`` rule under ``rules:``
        enforces this contract.
      completeness_contract:
        # Machine-readable form of the C1-C4 narrative above. Consumed by
        # ``test_fix_hint_completeness::test_every_fix_hint_satisfies_completeness_contract``.
        introduced_in: "3.8.0"
        clauses:
          - id: C1
            name: "placeholder-resolution"
            check: "every <placeholder> token has a sibling resolver line"
            resolver_patterns:
              - "(see <file>::<path>)"
              - "(run <command>)"
              - 'e.g. "<concrete-example>"'
          - id: C2
            name: "no-deprecation-contradiction"
            check: "hint MUST NOT recommend a CLI form deprecated by a same-toolkit Deprecated: warning"
            registry_source: "src/atdd/cli.py (_deprecation_warning callsites)"
          - id: C3
            name: "prerequisite-disclosure"
            check: "when the hint's command requires a prereq, it MUST be step 1 of a numbered sequence"
            heuristic: "hint contains a numbered '1.' step marker when a known prereq pattern applies"
          - id: C4
            name: "runnable-as-printed"
            check: "copy-paste runs without investigation"
            phase: "optional (sandbox smoke; deferred to follow-up of #467)"
    aliases:
      type: array
      items:
        type: string
      description: |
        Legacy rule IDs (typically pre-#399 flat-grammar form) the canonical
        rule supersedes. Resolved by ``bind_rule()`` and the suppression
        scanner — old ``# atdd:suppress(<flat_id>)`` markers continue to
        resolve via this list. (issue #399)

# =============================================================================
# Rules declared by this convention (issue #388)
# =============================================================================
# Top-level `rules:` block — parallel to `domains:`, `severity_scale:`,
# `rule_schema:`. Do NOT nest these under `migration.steps` (the example
# `rules:` snippet there is illustrative, not a runtime declaration).
rules:
  - id: "coach.rule-id.no-hardcoded-rule-severity"
    severity: 2
    description: "Migrated validators must not redeclare rule severity as a module constant"
    disposition: strict
    introduced_in: "1.66.0"
    aliases: ["COACH-RULEID-BIND-001"]
    validator: "test_no_hardcoded_rule_severity::test_no_hardcoded_rule_severity_in_migrated_validators"
    fix_hint: "Remove the module-level RULE_SEVERITY/RULE_DESCRIPTION constants and call bind_rule(<id>) at import time instead."
  - id: "coach.rule-id.disposition-required"
    severity: 2
    description: "Every declared rule must carry a disposition (strict | suppress-and-clean | advisory | documentation-only)"
    disposition: strict
    introduced_in: "2.0.0"
    aliases: ["COACH-RULEID-DISPOSITION-001"]
    validator: "test_rule_disposition_required::test_rule_disposition_required"
    fix_hint: "Add `disposition: <strict|suppress-and-clean|advisory|documentation-only>` to the rule body."
  - id: "coach.rule-id.stale-suppression"
    severity: 3
    description: "Inline ``# atdd:suppress(<id>) UNTIL=<date>`` markers must not have a past UNTIL date"
    disposition: strict
    introduced_in: "2.0.0"
    aliases: ["COACH-RULEID-STALE-SUPPRESSION-001"]
    validator: "test_no_stale_suppressions::test_no_stale_suppressions"
    fix_hint: "Either fix the underlying violation or extend UNTIL= past today."
  - id: "coach.rule-id.validator-binding-violation"
    severity: 3
    description: "Every enforced rule (strict|suppress-and-clean|advisory) must name a validator that calls bind_rule(<id>)"
    disposition: strict
    introduced_in: "3.0.0"
    validator: "test_rule_validator_binding::test_every_enforced_rule_has_real_validator"
    fix_hint: "Either set validator: '<module>::<func>' on the rule and have that function call bind_rule(<id>), or change disposition to documentation-only."
  - id: "coach.initializer.template-cli-drift"
    severity: 2
    description: "Every `run: atdd ...` literal the initializer writes into consumer workflow templates must parse cleanly under the live atdd argparse"
    disposition: strict
    introduced_in: "3.11.0"
    aliases: []
    validator: "test_workflow_template_command_drift::test_every_run_line_parses_under_live_cli"
    fix_hint: |
      The named `run: atdd ...` line in src/atdd/coach/commands/initializer.py
      emits a flag the live `atdd` argparse no longer accepts. Reproducer
      case: the 3.10.0 release dropped `-m FLAG` from `atdd validate` while
      the workflow templates still emitted `-m "not github_api"` (issue
      #473). Repair as follows:

        1. Read the validator output — the Violation cites the file:line
           and the offending tokens (run: pytest src/atdd/coach/validators/test_workflow_template_command_drift.py -v).
        2. Substitute the dead flag with the supported equivalent — for
           the marker family the canonical mapping is:
             -m "not github_api"  →  --skip-api
             -m github_api        →  --api-only
           (see src/atdd/cli.py::validate_parser for the live flag set;
            run `atdd validate --help` to enumerate.)
        3. Re-emit by re-running the unit test
           src/atdd/coach/commands/tests/test_initializer_workflow_emission.py
           which feeds every emitted run-line through the live argparse.
  - id: "coach.workflow-template.command-must-parse"
    severity: 2
    description: "Every `run: atdd ...` line (any subcommand) the initializer writes into consumer workflow templates must resolve to a subcommand the live atdd top-level argparse declares"
    disposition: strict
    introduced_in: "3.53.6"
    aliases: []
    validator: "test_workflow_template_command_drift::test_every_run_line_parses_under_live_cli"
    fix_hint: |
      An emitted `run: atdd ...` line names a subcommand the live `atdd`
      CLI does not declare (argparse `invalid choice`, e.g. the stranded
      `atdd baseline update` emit), or a flag the subparser rejects
      (`unrecognized arguments`). This widens #473's flag-only drift guard
      (coach.initializer.template-cli-drift) to subcommand-level drift
      across EVERY emitted `run: atdd ...` line, not just `atdd validate
      ...` (issue #481 — the `baseline update` emit failed silently on
      every push to main). Repair:
        1. Run the validator to see the offending workflow file +
           invocation (run: pytest
           src/atdd/coach/validators/test_workflow_template_command_drift.py -v).
        2. Either correct the emit in
           src/atdd/coach/commands/initializer.py to a real subcommand,
           or remove the emit if the job is retired.
        3. Enumerate valid subcommands with `atdd --help`.
  - id: "coach.pr.base-must-be-default-branch"
    severity: 3
    description: "Every PR (open or being created via `atdd pr`) must target the repo's default branch unless --force is set"
    disposition: strict
    introduced_in: "3.12.0"
    aliases: []
    validator: "test_pr_base_branch::test_every_open_pr_targets_default_branch"
    fix_hint: |
      The named PR targets a non-default base branch. Repair as follows
      (run gh repo view --json defaultBranchRef --jq .defaultBranchRef.name
       to inspect the canonical default; for atdd it is "main" and is
       also recorded at .atdd/config.yaml::github.default_branch):

        1. Read the violation — it cites "PR#<N>" where N is the PR number
           and the message names the offending baseRefName.
           e.g. "PR#475 ... targets base 'fix/473-init-template-fix'".
        2. Re-target the offending PR via the GitHub UI or via
           "gh pr edit <N> --base <default>", substituting:
             - <N>       = the PR number from step 1, e.g. "475"
             - <default> = the default branch name, e.g. "main"
        3. If the non-default base is intentional (release-train
           branches, stacked PRs), close the PR and re-open via
           "atdd pr <issue> --base <base> --force", substituting:
             - <issue> = the linked atdd issue number, e.g. "477"
             - <base>  = the explicit non-default base, e.g. "release/v3"
        4. Re-run the validator to confirm clean
           (run pytest src/atdd/coach/validators/test_pr_base_branch.py -v).

      Source contract: this rule prevents the orphan-merge incident
      from #475 where a PR merged onto a sibling-PR's branch (which
      was deleted post-merge), orphaning the v3.11.0 work. See
      issue #477 and src/atdd/coach/commands/pr.py for the CLI guard
      that catches the same class of mistake at PR-creation time.
  - id: "coach.pr.mass-delete-guard"
    severity: 4
    description: "PRs that delete >100 files or >10,000 lines must carry a decommission escape hatch: title prefix chore(decom, refactor(remove, or chore(archive), OR any commit body containing [mass-delete-approved]"
    disposition: strict
    introduced_in: "3.43.0"
    aliases: []
    validator: "test_pr_mass_delete_guard::test_no_open_pr_exceeds_mass_delete_thresholds"
    fix_hint: |
      A PR exceeded the mass-delete safety thresholds (>100 deleted files or
      >10,000 deleted lines) without an approved escape hatch. This guard was
      added after the Wave 12 contamination incident (PRs #625/#627 deleted
      1,277 files / 220,000 lines by accident).

      To resolve, choose one of:

        A. If the deletion is intentional (decommission / archive):
           Edit the PR title to begin with one of:
             chore(decom): ...
             refactor(remove): ...
             chore(archive): ...
           This signals to reviewers and CI that the mass delete is deliberate.

        B. If the deletion is intentional but the title cannot be changed:
           Add a commit to the PR branch whose body contains the exact token:
             [mass-delete-approved]
           Example: git commit --allow-empty -m "approve mass delete" -m "[mass-delete-approved]"

        C. If the deletion is accidental (the Wave 12 class of incident):
           Audit the diff for contamination from a worktree with core.bare=true.
           Recovery steps:
             1. git diff origin/main..HEAD --stat | tail -5   # confirm blast radius
             2. git reset --soft origin/main                  # un-stage all commits
             3. git checkout -- .                             # discard working-tree deletes
             4. Re-apply only the intended changes
             5. Push the corrected branch

      Source: #629 Layer 3 (CI guard), backed by #630 Layer 1 (pre-push) and
      #630 Layer 2 (commit-msg). See plan/integration_hardening/C004.yaml.
  - id: "coach.rule-id.fix-hint-completeness"
    severity: 2
    description: "Every fix_hint (convention-declared or CLI-printed) must satisfy the completeness contract C1-C4 in rule_schema.fields.fix_hint.description"
    disposition: strict
    introduced_in: "3.8.0"
    aliases: []
    validator: "test_fix_hint_completeness::test_every_fix_hint_satisfies_completeness_contract"
    fix_hint: |
      The named fix_hint fails one or more contract clauses (C1-C4). Repair as follows:
        1. Re-run the validator to read which clause failed
           (run: pytest src/atdd/coach/validators/test_fix_hint_completeness.py -v).
           The Violation message names the clause + the offending token,
           command, or structural shape.
        2. Resolve per the failed clause:
             - C1 placeholder resolution: for each bare ``<token>``, append
               a resolver line in the same hint block. Patterns
               (e.g. "(see plan/_trains.yaml::trains.id)" / "(run atdd list trains)" /
                'e.g. "0001-self-compliance-validate"').
             - C2 deprecation contradiction: substitute the deprecated CLI
               form with the canonical one
               (see src/atdd/cli.py::_deprecation_warning) — same toolkit
               that emits the warning prints the canonical replacement.
             - C3 prerequisite disclosure: convert the hint to a numbered
               sequence; step 1 = the prerequisite
               (e.g. "1. cd into the feature worktree (run: atdd branch <N>)").
             - C4 runnable-as-printed: copy-paste the hint into a fresh
               shell with the C3 prereq met; if it fails, simplify until it
               succeeds. Sandbox-smoke is optional in 3.8.x.
        3. Re-run step 1 to confirm clean.
      Source contract: see src/atdd/coach/conventions/rule-id.convention.yaml
      §rule_schema.fields.fix_hint.description (clauses C1-C4) and the
      adjacent "# === Fix-hint completeness contract ===" exemplars block.

# =============================================================================
# === Fix-hint completeness contract ===
# =============================================================================
# Positive + negative exemplars for the C1-C4 contract declared in
# rule_schema.fields.fix_hint.description. Validator
# test_fix_hint_completeness consumes the contract; this block documents
# canonical good/bad shapes so authors have a quick visual reference.
fix_hint_exemplars:
  positive:
    - source: "src/atdd/tester/conventions/acceptance-violation.convention.yaml:15-100"
      why_pass: |
        Multi-line hints with valid-value enumerations, anchored
        ``recipe:`` pointers, and §-references. Placeholders are bound by
        adjacent valid-value lists (C1) or by the recipe link.
      clauses_covered: [C1, C2, C3]
    - source: "src/atdd/coach/commands/issue.py (the COMPLETE-walkthrough hint)"
      observed: "2026-05-07"
      why_pass: |
        Numbered Fix: steps with a sibling ``Bypass:`` line documenting the
        escape hatch. Disclosed prerequisite (rebase / artifacts / release
        gate) appears as the leading step. Runnable as printed.
      clauses_covered: [C1, C3, C4]
  negative:
    - source: "src/atdd/coach/commands/issue.py:1682-1684"
      owner_issue: 466
      why_fail: |
        Single-line ``Fix: atdd update {issue_id} --status {status} --train <train_id>``
        — bare ``<train_id>`` placeholder with no resolver line (C1 fail)
        AND recommends the deprecated ``atdd update`` CLI form whose
        deprecation warning is registered at src/atdd/cli.py:1783 / 1792
        (C2 fail). After issue #466 lands the surgical fix, this site is
        expected to comply; until then the validator surfaces it as a
        known-defective fixture.
      clauses_failed: [C1, C2]

# =============================================================================
# Migration playbook
# =============================================================================
# Step-by-step retrofit guide for the ~15 conventions that don't yet declare
# `rules:` blocks. Worked example: green.convention.yaml (this issue).
migration:
  worked_example:
    convention: "src/atdd/coder/conventions/green.convention.yaml"
    validator: "src/atdd/coder/validators/test_frontend_security_patterns.py"
    summary: |
      green.convention.yaml is the proof migration for issue #340. It declares
      rule IDs under `green_phase.urn_naming.rules` and
      `green_phase.file_header_requirements.rules`. The frontend security
      validator emits `Violation` records keyed off those IDs.

  steps:
    - step: 1
      name: "Pick the DOMAIN"
      action: |
        Choose the DOMAIN value from `domains:` above that matches your
        convention's area. If none fits, this is a SPEC edit — open a separate
        issue to extend SPEC-COACH-RULEID-0002 first.

    - step: 2
      name: "Inventory existing rules in the convention"
      action: |
        Read the convention text and list every distinct testable expectation.
        One rule = one row in the eventual `rules:` array. Don't merge two
        expectations under one ID; don't split one expectation across two IDs.

    - step: 3
      name: "Assign sequential IDs"
      action: |
        For DOMAIN=GREEN, TOPIC=URN, the first three rules become
        GREEN-URN-001, GREEN-URN-002, GREEN-URN-003. Skip numbers freely if
        you anticipate future related rules; gaps are fine. NEVER reuse a
        number that was previously published — see SPEC-COACH-RULEID-0004.

    - step: 4
      name: "Assign severities"
      action: |
        Use the severity scale above. When in doubt, prefer the lower
        severity — escalation is cheap, demotion churns the risk score.

    - step: 5
      name: "Place the `rules:` array next to the rule text"
      action: |
        Hang `rules:` off the smallest concept block that contains all the
        rule's text. For example, urn_naming.rules (not green_phase.rules).
        This keeps IDs greppable from the rule statement.

    - step: 6
      name: "Migrate the validator to emit Violations"
      action: |
        Replace `pytest.fail(prose)` with a list of `Violation` records:

          from atdd.coach.validators._violation import Violation

          violations.append(Violation(
              rule_id="GREEN-URN-001",
              severity=3,
              location=f"{rel_path}:{lineno}",
              detail="missing URN marker",
              fix_hint_ref="recipe:adapter#step-1",  # if a recipe exists
          ))

        Then pass the list through the disposition gate:

          from atdd.coach.utils.disposition_gate import assert_disposition_satisfied

          assert_disposition_satisfied(
              validator_id="...",
              violations=violations,
          )

    - step: 7
      name: "Run the coach uniqueness validator"
      action: |
        `pytest src/atdd/coach/validators/test_rule_id_uniqueness.py -v`
        confirms the new IDs match the grammar and don't collide with any
        existing ID across all conventions.

    - step: 8
      name: "Opt the convention into strict validation"
      action: |
        Add the migrated convention path under `migration.completed:` below.

        This is the gate that flips the convention from "exempt" to "strict":
        `test_rule_id_uniqueness.py::test_rule_id_grammar_and_required_fields`
        only enforces grammar/severity/description on files listed under
        `completed:`. Files NOT in the list are skipped.

        Uniqueness and superseded_by checks (the other two coach tests) run
        on every file unconditionally — but only consider IDs that already
        match the new grammar. Legacy IDs (LOG-001, COVERAGE-CODE-4.1, etc.)
        are ignored until their convention migrates.

        This staged opt-in means a single PR can migrate one convention
        without forcing all 15+ to migrate at once.

    - step: 9
      name: "Bump version and document"
      action: |
        Bump `introduced_in:` on every new rule entry to the toolkit version
        that ships the migration. This lets downstream consumers tell which
        toolkit version first published the ID.

  disposition_compatibility:
    rule: |
      As of issue #395, ratchet baselines are gone. Pass/fail is decided
      per-rule via ``disposition: {strict | suppress-and-clean | advisory}``
      declared in the rule body. Pre-existing violations carry inline
      ``# atdd:suppress(<rule_id>) [UNTIL=<YYYY-MM-DD>]`` markers; new
      violations of strict / suppress-and-clean rules fail CI.
    why: |
      Count-based ratchets were opaque (no rule_id), masked feature
      removal as improvement, and lacked deadlines. Per-rule disposition
      makes CI behavior auditable per site and bounds debt with markers.

  deprecation:
    rule: |
      To replace a published rule ID, keep the old entry with
      `superseded_by: <new-id>` for one toolkit release, then remove it in
      the next release. Coach validation warns on `superseded_by` so the
      window is visible.
    example: |
      rules:
        - id: "coder.green.component-urn-marker-is"
          aliases: ["GREEN-URN-001"]
          severity: 3
          superseded_by: GREEN-URN-LAYER-002
          description: "Component URN required as first non-empty line"
        - id: GREEN-URN-LAYER-002
          severity: 3
          description: "Component URN required, with layer segment, as first non-empty line"

