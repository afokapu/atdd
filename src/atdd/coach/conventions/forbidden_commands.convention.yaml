version: "2.0"
name: "Forbidden Commands Registry"
description: |
  Advisory registry of upstream commands that have historically bypassed
  atdd-native wrappers, each paired with the incident that motivated it and
  the atdd-native alternative.

  THIS REGISTRY ENFORCES NOTHING.

  It carries no enforcement role, binds to no validator, and is read by no
  interception mechanism. It is documentation: a durable record of what went
  wrong and what to run instead. Enforcement, where it exists, lives in
  mechanisms that name no agent and are bound by their own conventions
  (see: path_shim_gh.convention.yaml, path_shim_git.convention.yaml).

  History: this file previously backed a per-agent command-interception hook
  (#668). That mechanism was decommissioned in #1556 because interception can
  only be implemented per-agent — N agents means N couplings — and core must
  name no agent. The machine-readable match specs and the fail-open behavior
  declaration were removed with it; retaining them would assert an enforcement
  contract that no longer exists. The incident record below is retained
  because its value is independent of any enforcement mechanism.

  Provider-neutral by construction: no entry names an agent, and no consumer
  is implied.

commands:
  - id: ATDD-FORBID-GH-ISSUE-CREATE
    command: "gh issue create"
    description: "bypasses atdd manifest registration and WMBT sub-issue generation"
    incident: >
      gh issue create bypasses atdd manifest registration, WMBT sub-issue
      generation, and Project v2 field setup. Any issue created this way will
      be missing from .atdd/manifest.yaml and flagged by atdd validate coach.
      Incident: #659 was filed with gh issue create and lacked a manifest entry.
    alternative: "atdd author issue --title <title> --slug <slug>"

  - id: ATDD-FORBID-GH-PR-CREATE
    command: "gh pr create"
    description: "bypasses --base validation against the repo default branch"
    incident: >
      gh pr create bypasses --base validation against the repo default branch.
      Incident: PR #475 was opened with a sibling branch as base; when the
      sibling merged and auto-deleted, the squash-merge commit landed on a
      phantom ref invisible to git log main, orphaning the v3.11.0 deliverable.
      The atdd pr <N> command validates --base before creating the PR.
    alternative: "atdd pr <N>"

  - id: ATDD-FORBID-CMUX-SEND-CLAUDE
    command: "cmux send (with an agent payload)"
    description: "bypasses worktree cwd enforcement"
    incident: >
      raw cmux send bypasses worktree cwd enforcement. The launched agent
      process inherits the caller's cwd rather than the target worktree,
      causing it to operate on the wrong branch. Incident: surface:355
      launched in wrong-cwd during the 2026-05-13 session.
    alternative: "atdd spawn --worktree <wt>"

  - id: ATDD-FORBID-GIT-CONFIG-BARE-UNSCOPED
    command: "git config core.bare / core.worktree (without --worktree)"
    description: "contaminates the shared .git/config across all worktrees"
    incident: >
      git config core.bare (or core.worktree) without --worktree writes to
      the SHARED .git/config, contaminating all worktrees. Incident
      2026-05-12: an agent ran git config core.bare=true inside a worktree,
      which leaked to main and sibling worktrees, causing PRs #625/#627 to
      each push 220k-line deletions. The pre-push hook now blocks such
      pushes (Wave 12 / #629), but the local mess persists until manually
      repaired. Use --worktree so the flag stays scoped to the current
      worktree's .git/worktrees/<name>/config.
    alternative: "git config --worktree core.bare <value>"

  - id: ATDD-LOOP-GH-PR-POLL
    command: "gh pr view / gh pr list / gh pr checks (in a loop)"
    description: "loop-polling exhausts GitHub API rate limits"
    incident: >
      Polling gh pr in a loop exhausts GitHub API rate limits. Incident
      2026-05-13: hit the GraphQL rate limit during PR monitoring; ATDD665
      detected exhaustion only AFTER the quota was spent. One-off reads
      are unproblematic; repeated polling is what exhausts the quota.
    alternative: "atdd observer status  OR  atdd agent wait-ci"
