version: "1.0"
name: "Forbidden Commands Registry"
description: |
  YAML-backed registry of commands blocked or rate-limited by the
  claude-pre-tool-use hook (issue #668, L1 enforcement).

  match_type values:
    hard_block  — always blocked, exits 2 with educational error
    loop_block  — allowed once; blocked when the command string is itself
                  a loop construct (contains while/until/for) OR when
                  the same rule_id has been triggered more than
                  loop_detection.threshold times within loop_detection.ttl_seconds

  match spec fields (within each pattern's "match:" key):
    argv           — list of argv tokens that must appear as a CONSECUTIVE run
                     in the shlex-tokenized command. Matches an *invocation*,
                     not a mention: `grep -rn "gh issue create"` collapses the
                     quoted string into ONE token, so it cannot match the
                     three-token run [gh, issue, create] and is correctly
                     allowed. Prefer this for any prohibition on a plain
                     command — the substring forms below FALSE-POSITIVE on
                     greps, commit messages, and docs that merely quote the
                     command.
                     When the command cannot be tokenized (unbalanced quote),
                     an argv rule DEGRADES to a substring test on the joined
                     tokens — block on doubt. Allowing outright would make
                     `gh issue create --title "unclosed` a one-character bypass
                     of the prohibition. This is distinct from the classifier
                     CRASH path, which still fails OPEN (see fail_behavior).
    contains       — substring that must appear in the command
    contains_all   — list of substrings that must ALL appear
    contains_any   — list of substrings where ANY one is sufficient
    regex          — Python re.search pattern applied to the command

  The substring forms are retained for the rules below whose targets are not
  clean argv runs (a cmux payload, a git flag combination, a polling verb set).
  They still match mentions as well as invocations — see issue #1454.

  Classifier decision 6 (issue #668): on registry load failure the classifier
  fails OPEN — every tool call is allowed and a warning is printed to stderr.

# Classifier behavior on registry load failure
fail_behavior: fail_open

patterns:
  - id: ATDD-FORBID-GH-ISSUE-CREATE
    match_type: hard_block
    description: "gh issue create bypasses atdd manifest registration and WMBT sub-issue generation"
    match:
      argv: ["gh", "issue", "create"]
    reason: >
      gh issue create bypasses atdd manifest registration, WMBT sub-issue
      generation, and Project v2 field setup. Any issue created this way will
      be missing from .atdd/manifest.yaml and flagged by atdd validate coach.
      Incident: #659 was filed with gh issue create and lacked manifest entry.
    alternative: "atdd author issue --title <title> --slug <slug>"

  - id: ATDD-FORBID-GH-PR-CREATE
    match_type: hard_block
    description: "gh pr create bypasses --base validation against the repo default branch"
    match:
      argv: ["gh", "pr", "create"]
    reason: >
      gh pr create bypasses --base validation against the repo default branch.
      Incident: PR #475 was opened with a sibling branch as base; when the
      sibling merged and auto-deleted, the squash-merge commit landed on a
      phantom ref invisible to git log main, orphaning the v3.11.0 deliverable.
      The atdd pr <N> command validates --base before creating the PR.
    alternative: "atdd pr <N>"

  - id: ATDD-FORBID-CMUX-SEND-CLAUDE
    match_type: hard_block
    description: "raw cmux send with a claude payload bypasses worktree cwd enforcement"
    match:
      contains_all:
        - "cmux send"
        - "claude "
    reason: >
      raw cmux send bypasses worktree cwd enforcement. The launched Claude
      process inherits the caller's cwd rather than the target worktree,
      causing it to operate on the wrong branch. Incident: surface:355
      launched in wrong-cwd during the 2026-05-13 session.
    alternative: "atdd spawn --worktree <wt>"

  - id: ATDD-FORBID-GIT-CONFIG-BARE-UNSCOPED
    match_type: hard_block
    description: "git config core.bare or core.worktree without --worktree contaminates shared .git/config"
    match:
      regex: "git\\b.*\\bconfig(?!.*--worktree).*(core\\.bare|core\\.worktree)"
    reason: >
      git config core.bare (or core.worktree) without --worktree writes to
      the SHARED .git/config, contaminating all worktrees. Incident
      2026-05-12: an agent ran git config core.bare=true inside a worktree,
      which leaked to main and sibling worktrees, causing PRs #625/#627 to
      each push 220k-line deletions. The pre-push hook now blocks such
      pushes (Wave 12 / #629), but the local mess persists until manually
      repaired. Use --worktree so the flag stays scoped to the current
      worktree's .git/worktrees/<name>/config.
    alternative: "git config --worktree core.bare <value>"

  - id: ATDD-LOOP-GH-PR-POLL
    match_type: loop_block
    description: "gh pr view/list/checks in a loop exhausts GitHub API rate limits"
    match:
      contains_any:
        - "gh pr view"
        - "gh pr list"
        - "gh pr checks"
    reason: >
      Polling gh pr in a loop exhausts GitHub API rate limits. Incident
      2026-05-13: hit GraphQL rate limit during PR monitoring; ATDD665
      detected exhaustion only AFTER the quota was spent. One-off reads
      are allowed; repeated polling (loop construct or threshold exceeded)
      is blocked.
    alternative: "atdd observer status  OR  atdd agent wait-ci"
    loop_detection:
      threshold: 1
      ttl_seconds: 60
