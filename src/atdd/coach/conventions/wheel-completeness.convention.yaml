schema_version: "1.0.0"
convention_id: "coach.wheel-completeness"
name: "Wheel Completeness Convention"
description: |
  Declares the build-time guard that every file present in the toolkit's
  source tree (``src/atdd/**``), minus build/OS cruft, must also ship in the
  installed wheel under ``Path(atdd.__file__).parent``.

  Source-tree inverse scan (NOT code-AST): walk the data files in the
  source tree, compute the expected install-path for each, assert each
  exists. False-negative-resistant by construction — there is no code
  parsing involved.

  Scope broadened in #1474. It was ``**/validators/fixtures/**``, which
  could not see any of the directories that actually failed to ship —
  ``coach/schemas/*.md`` (#663), ``coder/`` + ``tester/``
  ``conventions/nodes/`` (#1369), ``coach/templates/bin/`` (#952).

rationale: |
  Pre-#449 incident (verified live on 2026-05-06): v3.7.0 shipped with
  ``[tool.setuptools.package-data]`` declaring only ``coder/validators/
  fixtures/**``; the tester / coach / planner phase fixture trees were
  silently dropped from the wheel. Five test failures on consumer repos
  (all of them resolving to ``FileNotFoundError`` against
  ``train_renders_content/<bucket>/harness_output.json``) were
  indistinguishable from genuine consumer-side bugs until #449's
  ``toolkit_packaging_issues`` diagnostics field made the cause legible.

  This convention promotes the pattern from "category of past bugs" to
  "automated guard against future occurrences".

  #1474 — the rule shipped ``advisory`` for the 3.7.x line, with a promise
  to flip to ``strict`` in 3.8.0. That never happened; it was still
  ``advisory`` on 4.x, and ``advisory`` logs a warning and passes. Worse,
  the validator had never executed a single assertion in ANY environment:
  it skipped on editable install (which is how CI runs it), and its
  ``__file__``-only source discovery skipped again from an installed wheel.
  So the exact bug class it was built for — 174 files silently absent from
  the wheel — shipped anyway, four times over. It is now ``strict``, its
  discovery falls back to the working directory so it runs against a real
  wheel, and the ``validate-consumer`` CI job creates that topology on
  every PR.

scan_scope:
  COACH-WHEEL-COMPLETENESS-001:
    include:
      - "src/atdd/**"
    note: |
      Walk EVERY file under the package. The deny-list mirrors
      ``[tool.setuptools.exclude-package-data]`` in ``pyproject.toml`` and
      names build/OS cruft only (``__pycache__/``, ``*.pyc``, ``*.pyo``,
      ``.pytest_cache/``, ``.DS_Store``) — those must not ship at all, so
      asserting they DID ship would fail the gate on files that are correctly
      absent.

      ``.py`` is deliberately IN scope, and deny-listing it would be a bug.
      The obvious-looking argument for excluding it — setuptools installs
      ``.py`` as a MODULE, so asserting on it as package data is a category
      error — does not hold for the ``.py`` under
      ``**/validators/fixtures/**``. Those are NOT modules:
      ``[tool.setuptools.packages.find]``'s ``exclude`` deliberately keeps
      those directories from being importable packages, so nothing installs
      them as code. They are DATA — fixture sources the validators read and
      parse — and they ship as package data or not at all. Excluding ``.py``
      here drops 21 of them and blinds the gate to the loss. Scanning every
      file sidesteps the module-or-data question entirely, which is a question
      the gate has no business having to answer correctly.
    exempt:
      - "Editable install — when ``Path(atdd.__file__).resolve()`` is the
        repo's own ``src/atdd/__init__.py`` the source tree IS the wheel
        root, so every assertion compares a file to itself. ``pytest.skip``
        keeps local-dev runs honest; the ``validate-consumer`` CI job
        exercises the wheel-built path."
      - "Consumer repo with no toolkit source tree reachable — there is
        nothing to compare the installed package against."


enforcement:
  validator: "src/atdd/coach/validators/test_wheel_completeness.py"
  specs:
    - id: "SPEC-COACH-WHEEL-COMPLETENESS-0001"
      description: "Source-tree inverse scan asserts every non-cruft source file ships in the wheel"
      validates: "COACH-WHEEL-COMPLETENESS-001"
    - id: "SPEC-COACH-WHEEL-COMPLETENESS-0002"
      description: "Editable install short-circuits the scan via pytest.skip"
      validates: "COACH-WHEEL-COMPLETENESS-001"
    - id: "SPEC-COACH-WHEEL-COMPLETENESS-0003"
      description: "Cache-cruft (__pycache__, *.pyc, .DS_Store) is excluded from the scan"
      validates: "COACH-WHEEL-COMPLETENESS-001"
