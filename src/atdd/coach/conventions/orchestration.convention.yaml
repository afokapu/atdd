version: "1.0"
name: "Orchestration Convention"
description: "Rules for parallel ATDD agent sessions launched via atdd orchestrate"

# =============================================================================
# Core principle: one issue → one worktree → one multiplexer workspace → one
# independent agent session. No sub-agent delegation, no shared workspaces.
# =============================================================================

rules:
  worktree_per_issue:
    rule: "Every orchestrated issue MUST have its own git worktree"
    anti_pattern: "Reusing a worktree across issues causes merge conflicts"
    enforced_by: "atdd orchestrate (two-phase commit: create all worktrees before launch)"

  one_agent_per_session_unit:
    rule: "Exactly one agent session per multiplexer session unit (workspace OR surface)"
    anti_pattern: "Sub-agent delegation that shares context within one agent's session"
    enforced_by: "atdd orchestrate launches one claude process per session unit, regardless of mode"
    sub_rules:
      workspace:
        applies_when: "atdd orchestrate --multiplexer-mode workspace (default)"
        rule: "One agent session per multiplexer workspace"
        layout: "Each issue spawns a new cmux workspace via cmux new-workspace"
        recommended_for: "Repos that want full isolation between concurrent issues, including independent scrollback per workspace"
      pane:
        applies_when: "atdd orchestrate --multiplexer-mode pane (cmux only)"
        rule: "One agent session per multiplexer surface inside a shared workspace"
        layout: "Each issue spawns a surface inside the current cmux workspace via cmux new-pane + cmux new-surface"
        recommended_for: "Repos that follow CLAUDE.md git.branching.layout (project/main + project/feat-* siblings); mirrors the worktree-sibling layout in cmux"
        babysit_caveat: |
          Pane mode shares WorkspaceState across surfaces in one workspace. Babysit reads
          at workspace scope; auto-approvals and escalations fire on the focused surface's
          screen, not per-surface. Surface-isolated state is a follow-on if shared state
          becomes too noisy.

  one_agent_per_workspace:
    deprecated: true
    renamed_to: "one_agent_per_session_unit"
    see: "one_agent_per_session_unit"
    note: "Generalized to cover pane mode (cmux surfaces). Anti-pattern unchanged."

  wave_ordering:
    rule: "Issues are grouped into waves via topological sort on their dependency DAG"
    dependency_source: "Issue body → ## Scope → ### Dependencies section (first #NNN per line wins)"
    fallback: "Closes/Fixes/Resolves #NNN references in body"
    algorithm: "topological sort; wave N contains issues whose deps all resolve to waves < N"

  dependency_wait:
    rule: "A session in wave N MUST block until all wave N-1 PRs are merged"
    mechanism: "Launch script includes a grep-based merge-check loop"
    anti_pattern: "Polling gh pr list without merge-detection guard causes premature starts"

  babysitter_required:
    rule: "Every orchestrate run must have a babysitter (atdd babysit) monitoring the workspaces"
    reason: "--dangerously-skip-permissions is ignored in cmux; prompts must be approved externally"
    interval_default_seconds: 60
    stale_warn_minutes: 15
    stale_escalate_minutes: 30
    pane_mode_caveat: |
      In pane mode, multiple surfaces share a single workspace and therefore a single
      WorkspaceState entry. Babysit observes the focused surface; cross-surface
      auto-approval bookkeeping is shared, not isolated. Per-surface isolated state is
      out of scope for #343 — file a follow-on if shared state causes drift in practice.

      Bash pattern auto-approvals (see ``babysit.bash_auto_approve_patterns``) follow
      the same focused-surface rule: the classifier matches against the focused
      surface's screen capture, not per-surface state machines. This is consistent
      with the existing pane-mode caveat; per-surface classifier state is a follow-on.

  micro_commit:
    rule: "Orchestrated sessions inherit micro-commit discipline (see CLAUDE.md)"
    max_unstaged_files: 5
    frequency: "Commit after every completed sub-task"

  stop_before_refactor:
    rule: "Sessions stop before REFACTOR phase unless --autonomous flag is set"
    reason: "REFACTOR decisions need human review; autonomous mode must be opted in per orchestrate invocation"
    override: "atdd orchestrate --autonomous"

  worker_checkpoint:
    rule: "Workers SHOULD write `.atdd/worker-state-<issue>.json` after each phase transition"
    reason: |
      Long-running waves can exhaust an agent's context window; without a
      checkpoint, a /clear+reload cycle requires manual re-briefing that
      takes several minutes per worker. The checkpoint captures phase,
      last-commit, summary, and open files so the launch prompt can be
      regenerated by `atdd session-template <N> --from-checkpoint`.
      See issue #378.
    location: ".atdd/worker-state-{issue}.json (gitignored)"
    schema: "src/atdd/coach/schemas/worker-state.schema.json"
    writer: "atdd checkpoint <N> --phase X --summary '...' --open-files a.py,b.py"
    reader: "atdd session-template <N> --from-checkpoint"
    advisory_compact: |
      Workers SHOULD run `/compact` after each phase transition to keep token
      usage well below the babysit alert threshold (default 400_000 of the
      typical 600k effective cap). Advisory in v1; not enforced by validator.

  token_alert_threshold:
    rule: "Babysit alerts when a workspace's token count crosses the configured threshold"
    default: 400000
    config_key: "babysit.token_alert_threshold (.atdd/config.yaml)"
    source: |
      Token count is read from `claude --print-context-status` JSON. When the
      binary or output is unavailable, the count is None (rendered as `—` in
      the dashboard) and no alert fires.
    response: "Worker SHOULD run `/compact` and optionally `/clear` followed by `atdd session-template <N> --from-checkpoint` to resume from the last checkpoint."

# =============================================================================
# Prompt approval policy (babysit)
# =============================================================================

prompt_approval:
  approach: "Literal string match on tool name — no regex"
  known_safe:
    - "Read"
    - "Grep"
    - "Glob"
    - "Edit"
    - "git status"
    - "git diff"
    - "git log"
  always_escalate:
    - "Write"
    - "rm"
    - "git push --force"
  rationale: |
    Conservative literal-string list for non-Bash tools. Bash classification is
    handled by ``babysit.bash_auto_approve_patterns`` and ``bash_deny_patterns``
    below; the literal ``"Bash"`` entry was removed from ``always_escalate`` when
    COACH-BABYSIT-* rules shipped (issue #366). Any mutation beyond Edit (for
    non-Bash tools) still requires human judgement.

# =============================================================================
# Babysit pattern-based Bash classifier (issue #366)
# =============================================================================
# Bash commands are extracted from the babysit screen capture and matched
# against deny patterns first, then allow patterns. Unmatched commands escalate.
# Each rule declares a stable rule_id under DOMAIN=COACH, TOPIC=BABYSIT per the
# rule-ID grammar (SPEC-COACH-RULEID-0001).

babysit:
  bash_auto_approve_patterns:
    description: |
      Regex patterns (anchored at the start of the command) for Bash invocations
      the babysitter auto-approves. Seeded from concrete log evidence in
      ``.atdd/orchestration-log.jsonl`` for May 2026 sessions: every routine
      diagnostic that escalated as ``matched=Bash`` is covered here.

      Numeric suffix range: 010-049. Reserve 050+ for deny rules.
    rules:
      - id: "coach.orchestration.read-only-git-diagnostics"
        aliases: ["COACH-BABYSIT-010"]
        severity: 2
        disposition: strict
        description: "Read-only git diagnostics"
        regex: '^git (status|log|diff|show|branch|remote|fetch|rev-parse|reflog|stash list)\b'
      - id: "coach.orchestration.test-runner-invocations"
        aliases: ["COACH-BABYSIT-011"]
        severity: 2
        disposition: strict
        description: "Test runner invocations"
        regex: '^pytest\b'
      - id: "coach.orchestration.read-only-file-inspection"
        aliases: ["COACH-BABYSIT-012"]
        severity: 2
        disposition: strict
        description: "Read-only file inspection"
        regex: '^(ls|cat|head|tail|grep|find|wc)\b'
      - id: "coach.orchestration.stdout-only-output"
        aliases: ["COACH-BABYSIT-013"]
        severity: 1
        disposition: strict
        description: "Stdout-only output"
        regex: '^echo\b'
      - id: "coach.orchestration.print-working-directory"
        aliases: ["COACH-BABYSIT-014"]
        severity: 1
        disposition: strict
        description: "Print working directory"
        regex: '^pwd\s*$'
      - id: "coach.orchestration.worker-self-checkpoint-issue"
        aliases: ["COACH-BABYSIT-015"]
        severity: 1
        disposition: strict
        description: "Worker self-checkpoint (issue #378)"
        regex: '^atdd checkpoint\b'

  dashboard:
    description: |
      Aggregate dashboard mode for `atdd babysit --dashboard` (issue #377).
      Renders one row per monitored surface each `--interval` cycle:
      surface ref, issue number, ATDD phase label, time since last screen
      change (`LastTool`), pending-prompt indicator, and a status column
      (`ACTIVE` | `STALLED` | `escalated` | `violation`).

      Stalled is the existing `stale_warn_minutes` threshold — the dashboard
      surfaces it as a column rather than introducing a new threshold.
      Aggregate approval is opt-in via the separate `--approve-all-safe`
      one-shot command (Decision #3).
    enabled_default: false
    phase_cache_seconds: 60   # GitHub phase-label cache lifetime; must be >= --interval
    stalled_label: "STALLED"
    time_format: "h:mm:ss"

  bash_deny_patterns:
    description: |
      Regex patterns that always escalate, even if a permissive allow pattern
      would also match. Deny is checked *before* allow so the safety boundary
      cannot be widened by accident.

      Numeric suffix range: 050+.
    rules:
      - id: "coach.orchestration.network-egress-escalate-even"
        aliases: ["COACH-BABYSIT-050"]
        severity: 5
        disposition: strict
        description: "Network egress — escalate even if otherwise safe"
        regex: '^(curl|wget)\b'
      - id: "coach.orchestration.mutates-python-environment"
        aliases: ["COACH-BABYSIT-051"]
        severity: 4
        disposition: strict
        description: "Mutates Python environment"
        regex: '^pip (install|uninstall)\b'
      - id: "coach.orchestration.destructive-file-ops-always"
        aliases: ["COACH-BABYSIT-052"]
        severity: 5
        disposition: strict
        description: "Destructive file ops — always escalate"
        regex: '^(rm|mv)\b'
      - id: "coach.orchestration.destructive-or-remote-mutating"
        aliases: ["COACH-BABYSIT-053"]
        severity: 4
        disposition: strict
        description: "Destructive or remote-mutating git ops"
        regex: '^git (push|reset --hard|clean -f|branch -D|checkout --)\b'

# =============================================================================
# Policy violation patterns the babysitter watches for
# =============================================================================

violations:
  atdd_hand_edit:
    pattern: "Edit tool targeting .atdd/ paths"
    action: "escalate — .atdd/ files are managed by atdd CLI, not hand-edited"
  smoke_skip:
    pattern: "Transition from GREEN directly to REFACTOR without SMOKE"
    action: "escalate — SMOKE verification against real infra is mandatory"
  hallucinated_state:
    pattern: "Agent claims phase complete while grep gates still fail"
    action: "escalate — agent is confused; require manual reset"

# =============================================================================
# Merge cascade policy
# =============================================================================

merge_cascade:
  poll_interval_seconds: 30
  per_pr_timeout_seconds: 1800  # 30 minutes
  loop: "for each PR in wave order: update-branch → wait CI → merge"
  on_conflict: "halt and report which PR needs manual resolution"
  ci_check_command: "gh pr checks <pr> --required"

# =============================================================================
# Telemetry
# =============================================================================

telemetry:
  log_file: ".atdd/orchestration-log.jsonl"
  format: "JSON Lines, append-only, one line per event"
  event_types:
    - "screen_read"
    - "auto_approve"
    - "escalate"
    - "violation"
    - "session_launch"
    - "session_stale"
    - "session_complete"

# =============================================================================
# Multiplexer preference
# =============================================================================

multiplexer:
  preferred: "cmux"
  alternates: ["zellij", "tmux"]
  detection: "cmux --version first, then zellij --version, then tmux -V"
  rationale: |
    cmux workspace model matches ATDD's one-session-per-worktree pattern.
    zellij is preferred over tmux as a fallback because it supports detached
    session creation (`zellij attach --create-background`) and per-session
    targeting (via the ZELLIJ_SESSION_NAME env var), both of which align
    with the headless orchestration model. tmux remains as the ubiquitous
    last-resort fallback.

# =============================================================================
# Validator self-rules (issue #394)
# =============================================================================
# Rule_ids emitted by validators that police THIS convention's pattern
# definitions and PR-phase orchestration. Registered here so the coherence
# validator (test_rule_id_registry_coherence) can resolve them.
babysit_validator_rules:
  description: "Rules emitted by test_babysit_allowlist_consistency to police babysit pattern definitions"
  rules:
    - id: "coach.orchestration.babysit-rule-id-matches"
      aliases: ["COACH-BABYSIT-001"]
      severity: 3
      disposition: strict
      description: "Babysit rule_id matches grammar <DOMAIN>-<TOPIC>-<NNN>"
      introduced_in: "1.67.0"
    - id: "coach.orchestration.babysit-rule-id-uses"
      aliases: ["COACH-BABYSIT-002"]
      severity: 3
      disposition: strict
      description: "Babysit rule_id uses DOMAIN=COACH, TOPIC=BABYSIT"
      introduced_in: "1.67.0"
    - id: "coach.orchestration.babysit-rule-severity-is"
      aliases: ["COACH-BABYSIT-003"]
      severity: 3
      disposition: strict
      description: "Babysit rule severity is integer in [1, 5]"
      introduced_in: "1.67.0"
    - id: "coach.orchestration.babysit-rule-has-non"
      aliases: ["COACH-BABYSIT-004"]
      severity: 2
      disposition: strict
      description: "Babysit rule has non-empty description"
      introduced_in: "1.67.0"
    - id: "coach.orchestration.babysit-rule-regex-is"
      aliases: ["COACH-BABYSIT-005"]
      severity: 4
      disposition: strict
      description: "Babysit rule regex is non-empty and compiles"
      introduced_in: "1.67.0"
    - id: "coach.orchestration.babysit-allow-deny-patterns"
      aliases: ["COACH-BABYSIT-006"]
      severity: 3
      disposition: strict
      description: "Babysit allow/deny patterns do not overlap on test corpus"
      introduced_in: "1.67.0"

pr_phase_alignment_rules:
  description: "Rule emitted by test_pr_phase_alignment to gate GREEN-phase PRs that ship code without SMOKE evidence"
  rules:
    - id: "coach.orchestration.prgate"
      aliases: ["COACH-PRGATE-0003"]
      severity: 4
      disposition: strict
      description: "GREEN-phase PR ships code files without SMOKE evidence (issue #293)"
      introduced_in: "1.67.0"
