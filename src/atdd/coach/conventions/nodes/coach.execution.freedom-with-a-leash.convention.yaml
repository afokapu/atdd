schema_version: 1.1.0
rule_id: coach.execution.freedom-with-a-leash
kind: principle
status: active
name: Freedom with a leash
statement: An agent works unattended for a curated safe freedom set (read/test tools auto-run); destructive
  or outward-facing actions must surface and be corrected (or in extremis respawned) — they must never
  auto-execute.
source:
