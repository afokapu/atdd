parity:
  source_fragments_preserved: true
  examples_preserved: false
  implementation_preserved: false
  fix_hint_preserved: false
  reviewed_at: '2026-06-17'
terms:
- term_id: freedom_set
  text: a tightly-scoped safe allowlist (Bash(<cmd>:*), read/test tools) that auto-runs without a modal.
- term_id: leash
  text: destructive/outward actions are flagged and corrected via the structured channel — never auto-executed.
