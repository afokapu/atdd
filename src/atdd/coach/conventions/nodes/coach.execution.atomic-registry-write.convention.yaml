schema_version: 1.1.0
rule_id: coach.execution.atomic-registry-write
kind: rule
status: active
name: Registry writes are atomic with the verb
statement: Any verb mutating the delivery-unit registry (the State Store) must persist that write
  atomically with the verb, refuse on the protected mainline unless explicitly allowed, and fail loud
  on a genuine registration error. (#1270 Slice G retired the `.atdd/manifest.yaml` mirror this
  principle was first extracted from; the State Store is now the sole registry it governs.)
source:
