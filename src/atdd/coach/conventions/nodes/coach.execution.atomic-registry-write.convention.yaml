schema_version: 1.1.0
rule_id: coach.execution.atomic-registry-write
kind: rule
status: active
name: Registry writes are atomic with the verb
statement: Any verb mutating the delivery-unit registry must commit that write atomically with the verb
  (path-scoped, never bundling unrelated changes), refuse on the protected mainline unless explicitly
  allowed, and fail loud on a genuine registration error.
