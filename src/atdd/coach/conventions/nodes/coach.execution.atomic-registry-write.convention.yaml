  legacy_section: manifest_write_discipline
  legacy_sha: 3ea36724cfb944f6
  extraction_mode: high_fidelity
  # NOTE: the `manifest_write_discipline` legacy section was retired in #1270
  # Slice G (the manifest mirror was deleted). This provenance is historical; the
  # node's statement above is reframed onto the State Store registry.
metadata:
  severity: 3
  disposition: documentation-only
  introduced_in: 2.1.0
parity:
  source_fragments_preserved: true
  examples_preserved: false
  implementation_preserved: false
  fix_hint_preserved: false
  reviewed_at: '2026-06-17'
terms:
- term_id: atomic_registration
  text: registry mutation and its commit are one operation; issue registration fails loud rather than
    reporting silent success.
