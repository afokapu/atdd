schema_version: 1.1.0
rule_id: coach.source-layout.no-bare-version-detection
kind: rule
status: active
name: No bare version detection
statement: version("atdd") / pkg_version("atdd") must only be called inside the canonical try/except PackageNotFoundError
  wrapper in src/atdd/__init__.py; the bare call raises from source without a wheel (CI's setup).
implementation:
  type: validator
  ref: test_toolkit_source_layout_assumptions::test_no_bare_version_detection
source:
  legacy_path: src/atdd/coach/conventions/source-layout.convention.yaml
  legacy_section: rules
  legacy_sha: 9f9363a2305c91b2
  extraction_mode: high_fidelity
  legacy_rule_id: coach.source-layout.no-bare-version-detection
content:
  exceptions:
  - src/atdd/__init__.py — the canonical try/except wrapper
  - Test files (test_*.py, *_test.py, */tests/, */test/)
  - Fixture directories (*/fixtures/*)
  - 'Inline suppression: # atdd:suppress(COACH-PKG-LAYOUT-002) on the offending line'
  operational_guidance: "bad:\nfrom importlib.metadata import version\nAPP_VERSION = version(\"atdd\"\
    )  # raises PackageNotFoundError from source\n\ngood:\nfrom atdd import __version__\nAPP_VERSION =\
    \ __version__\n\npackage_init_only:\n# src/atdd/__init__.py — the *one* legitimate try/except wrapper\n\
    from importlib.metadata import PackageNotFoundError, version\ntry:\n    __version__ = version(\"atdd\"\
    )\nexcept PackageNotFoundError:\n    __version__ = \"0.0.0\""
metadata:
  aliases:
  - COACH-PKG-LAYOUT-002
  severity: 4
  disposition: documentation-only
  introduced_in: 3.85.0
  core_surface: toolkit_self
  not_generalized_to_workspace: true
parity:
  source_fragments_preserved: true
  examples_preserved: false
  implementation_preserved: true
  fix_hint_preserved: false
  reviewed_at: '2026-06-17'
terms:
- term_id: canonical_wrapper
  text: the one legitimate try/except in src/atdd/__init__.py that defaults __version__ to '0.0.0' from
    source.
notes: 'Incident refs: #352'
