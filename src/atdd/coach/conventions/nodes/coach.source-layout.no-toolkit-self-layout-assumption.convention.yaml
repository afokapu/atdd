name: No toolkit-self layout assumption
statement: Toolkit code must resolve ATDD package resources package-relatively (Path(atdd.__file__).parent/...),
  never by concatenating 'src/atdd/' onto find_repo_root(); the latter raises FileNotFoundError in pip-installed
  consumers.
