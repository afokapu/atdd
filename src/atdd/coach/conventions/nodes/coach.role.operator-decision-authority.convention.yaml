schema_version: 1.1.0
rule_id: coach.role.operator-decision-authority
kind: principle
status: active
name: Dangerous decisions require operator authority
statement: A dangerous (deny-pattern) decision must not be auto-resolved; it defaults to escalation to
  the operator, who holds decision authority. A fully-unattended operator may opt into a more permissive
  policy.
