schema_version: 1.1.0
rule_id: coach.code-roots.no-source-depth-walk
kind: rule
status: active
name: No source-depth walk
statement: 'Core must not derive a root by chaining Path(__file__).parent three or more levels: the
  chain encodes the depth of the source tree, and the package sits at a different depth once
  installed, so the walk lands somewhere else entirely. Anchor package resources package-relatively
  or resolve the repo root with find_repo_root().'
implementation:
  type: validator
  ref: test_code_roots_agnosticity::test_no_source_depth_walk
source:
  legacy_path: src/atdd/coach/conventions/code-roots.convention.yaml
  legacy_section: resolver_contract
  extraction_mode: activation
content:
  fix_hint: 'Replace `Path(__file__).resolve().parent.parent.parent...` with the resolution that does
    not count directories: `Path(atdd.__file__).resolve().parent` for anything inside the atdd
    package, or `find_repo_root()` for the consumer repository root. One level of .parent (the
    package directory) and two levels (module -> package) are legitimate and are not flagged.'
  exceptions:
  - 'tests/ and fixtures/ directories — synthetic trees, not shipped resolution paths.'
  - 'Chains shorter than three levels — package-relative resolution, the CORRECT pattern.'
  - 'Inline suppression: # atdd:suppress(coach.code-roots.no-source-depth-walk) on the offending line.'
metadata:
  severity: 4
  disposition: suppress-and-clean
  introduced_in: 4.7.0
  core_surface: toolkit_self
  not_generalized_to_workspace: true
  ratchet: 'Landed suppress-and-clean in #1499 with the pre-existing violations suppressed at their
    sites. DESTINATION IS `disposition: strict` AT ZERO. Suppressions may only be removed, never
    added to green a build.'
terms:
- term_id: depth_threshold
  text: three or more chained .parent links from a __file__ anchor; below that the expression is
    package-relative and correct.
notes: 'Activation of the code-roots convention (#1499). The rule requires a __file__ anchor so it
  fires on source-tree depth walks, not on arbitrary path arithmetic over a path the caller was
  handed.'
