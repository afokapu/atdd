terms:
- term_id: transition_freedom_set
  text: 'the transitions a phase''s own persona may submit unattended — the transition-axis counterpart of
    coach.execution.freedom-with-a-leash''s freedom_set. Declared as `autonomy: agent`; currently RED->GREEN,
    GREEN->SMOKE and SMOKE->REFACTOR, each gated on machine-checkable evidence rather than human judgement.'
- term_id: transition_leash
  text: 'the transitions reserved for the operator — the counterpart of that node''s leash. Declared as `autonomy:
    operator`; currently INIT->PLANNED (the decomposition no downstream gate can re-derive), PLANNED->RED
    (the sole member of DEFAULT_GATED_TRANSITIONS, approval-token gated since #1017), REFACTOR->COMPLETE
    (merge authority; auto-phase cannot verify a modified artifact post-merge, #1611), and every exit from
    BLOCKED.'
- term_id: escape_invariant
  text: 'no transition INTO BLOCKED or OBSOLETE is ever autonomous, whatever the submitting phase declares.
    The per-phase scalar governs the forward edge only, so the escapes are covered by this invariant rather
    than by the data; BLOCKED itself declares `autonomy: operator`, making an escape symmetric — an operator
    decision to enter, an operator decision to leave.'
- term_id: legality_stays_with_atdd
  text: 'autonomy governs who may SUBMIT, never what is LEGAL. transitions_to and the gate registry remain
    the sole authority on whether a submitted transition is accepted, which bounds the risk of a permissive
    declaration to a rejected command.'
