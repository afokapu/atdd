schema_version: 1.1.0
rule_id: coach.lifecycle.transition-autonomy
kind: principle
status: active
name: Lifecycle transition autonomy
statement: 'Each phase declares who may SUBMIT the transition out of it: `autonomy: operator` reserves the
  forward edge for a human sign-off, `autonomy: agent` lets the phase''s own persona submit it unattended,
  and null marks a phase with no forward transition. Entering an escape (BLOCKED, OBSOLETE) is never autonomous,
  and leaving BLOCKED is likewise operator-submitted. This is the transition-axis twin of coach.execution.freedom-with-a-leash,
  which governs which TOOLS run unattended; together they describe one model on two axes — a curated freedom
  set that proceeds without asking, and a leash of decisions that must surface. ATDD retains sole authority
  over transition LEGALITY (transitions_to) and over the gates in atdd.coach.gate, so a permissive declaration
  can at worst submit a command ATDD then rejects.'
rationale: 'Before this axis the phase machine said who DRIVES a phase, which targets are LEGAL, and what
  must pass before commit — but nothing said who may submit the transition, so every worker stopped on the
  operator at every phase regardless of whether a human judgement was actually required. Declaring the axis
  separates the stops an operator wants from the stops that are merely undeclared. It is deliberately declarative
  first: nothing reads the key yet, which is what makes the bounded blast radius above true rather than aspirational.'
notes: 'PROVENANCE: unlike its sibling, this node was authored ALONGSIDE the data it describes rather than
  extracted from pre-existing prose — the `source` block below records where the axis lives, not a passage
  it was lifted from. INERTNESS: train/persistence.py::_phase_machine_from_data builds PhaseSpec from named
  keys and _normalized_snapshot derives the conventions snapshot hash from PhaseSpec, so `autonomy` reaches
  no field and moves no hash; no in-flight run resuming from a frozen conventions.snapshot.yaml is invalidated.
  Projecting the axis onto PhaseSpec — which any mechanical submitter check will need — WILL move that hash,
  and is a separate concern (see #1626, #1619).'
source:
  legacy_path: src/atdd/coach/conventions/phase_machine.convention.yaml
