  severity: 3
  # documentation-only (#1626): declarative first. The axis is declared and reviewable;
  # mechanical enforcement of who may submit is a later, separate concern, so this node
  # has no bound validator and needs no bind_rule callsite.
  disposition: documentation-only
  introduced_in: 4.27.0
