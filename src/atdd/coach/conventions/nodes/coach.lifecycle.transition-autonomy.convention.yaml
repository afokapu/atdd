  # system. Advisory rather than strict/block: C027's guard is a toolkit-self acceptance
  # that reports the divergence, not a registry-bound rule that refuses a transition, and
  # mechanical enforcement of who may SUBMIT is still a separate concern (#1626, #1619).
  disposition: advisory
  introduced_in: 4.27.0
