schema_version: 1.1.0
rule_id: coach.execution.one-agent-per-delivery-unit
kind: principle
status: active
name: One delivery unit, one isolated context, one agent
statement: Each delivery unit maps to exactly one isolated execution context driving exactly one agent
  session; no shared contexts and no sub-agent delegation that shares an agent's context.
