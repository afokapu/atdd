schema_version: 1.1.0
rule_id: coach.execution.decisions-mediated-not-auto-executed
kind: principle
status: active
name: Worker decisions are mediated, not auto-executed
statement: Consequential or ambiguous worker decisions (e.g. unscoped Bash, AskUserQuestion, ExitPlanMode)
  must surface for mediation rather than auto-execute; the coach resolves each against the loaded convention
  and replies, escalating the unresolvable.
