schema_version: 1.0.0
rule_id: coach.extension.realization-mapping
kind: principle
status: active
name: Cross-package linkage is declared through realizes
statement: An extension declares cross-package linkage to core via realizes mappings
  (extension node to shipped core node), validated at admission; cross-package edges
  are not authored as raw relationship edges, and depends_on.targets.coach_nodes is
  derived from realizes.
rationale: The substrate composes packages against core by resolving each realizes.core_node
  to a shipped core node. This documents the mechanism extensions must use; the planner
  substrate's validate_realizes enforces well-formedness, and the strict rule
  coach.substrate.transport-realizes-mediation forces a transport provider to realize
  the dispatch-verifies-channel-live obligation. Documentation-only here because the
  enforcement lives in the planner substrate, not a coach validator.
terms:
- term_id: realizes
  text: an extension-manifest mapping {extension_node, core_node} asserting the extension
    node satisfies a shipped core node; the sole cross-package linkage
metadata:
  severity: 3
  disposition: documentation-only
  introduced_in: 4.0.0
