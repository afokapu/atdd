kind: pattern
status: active
name: Convention rule-migration playbook
statement: 'Retrofitting a convention to structured rules follows the staged playbook (pick DOMAIN, inventory
  rules, assign IDs/severities, place the rules: array, migrate the validator to emit Violations, opt
  into strict via migration.completed); per-rule disposition replaces ratchet baselines and superseded_by
  gives a one-release deprecation window.'
