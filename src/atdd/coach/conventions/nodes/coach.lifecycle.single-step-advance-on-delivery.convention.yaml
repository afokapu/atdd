rule_id: coach.lifecycle.single-step-advance-on-delivery
kind: rule
status: active
name: Single-step advance on delivery
statement: On a delivery event the unit advances exactly one step per the state machine (RED→GREEN→SMOKE→REFACTOR→COMPLETE);
  pre-implementation and terminal phases are no-ops requiring manual review.
