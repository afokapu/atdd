version: "1.0"
name: "PR Convention"
description: "Rules that govern PR creation, merge gating, and ATDD lifecycle alignment at the PR boundary"

# =============================================================================
# Purpose
# =============================================================================
# This convention houses PR-scoped rules that enforce ATDD substrate
# guarantees at the PR boundary — the last point where a human-or-agent
# decision crosses into shared history. Sibling PR rules also live in
# rule-id.convention.yaml (coach.pr.base-must-be-default-branch,
# coach.pr.mass-delete-guard); this file is the canonical home for rules
# whose only concern is PR/issue lifecycle interlocks. New PR-scoped rules
# SHOULD be declared here unless they semantically belong elsewhere.

# =============================================================================
# Structured rules
# =============================================================================
rules:
  # Emitted at runtime by test_pr_phase_alignment.py (Violation rule_id
  # COACH-PRGATE-0003); documentation-only so the coherence validator does
  # not require a static validator pointer.
  - id: "coach.pr.green-ships-code-without-smoke"
    aliases: ["COACH-PRGATE-0003"]
    severity: 4
    disposition: documentation-only
    description: "GREEN-phase PR ships code files without SMOKE evidence (issue #293)"
    introduced_in: "1.67.0"

  - id: "coach.pr.merge-blocks-on-pre-smoke-close"
    severity: 4
    description: "Open PRs that auto-close an ATDD issue (via `Closes #N` / `Fixes #N` / `Resolves #N` or the GitHub `closingIssuesReferences` API field) must reference an issue whose phase label is atdd:REFACTOR or atdd:COMPLETE. Every other phase is blocked. atdd:INIT, atdd:PLANNED, atdd:RED and atdd:GREEN because the work is not done (the 2026-05-13 substrate-asymmetry incident). atdd:SMOKE because REFACTOR carries the operator sign-off and the terminal hop to COMPLETE, so closing at SMOKE skips it — the same incident one phase along (#1710). The escapes atdd:BLOCKED and atdd:OBSOLETE because retiring an issue is an operator transition, not something a merge may perform. The set is read from phase_labels.merge_allowed in this file and its complement is computed, so a phase added to the machine later blocks until it is admitted on purpose. Strict disposition: bypass is forbidden; no inline suppress."
    disposition: strict
    introduced_in: "3.50.0"
    aliases: []
    validator: "test_pr_merge_blocks_pre_smoke_close::test_no_open_pr_closes_an_issue_in_pre_smoke_phase"
    fix_hint: |
      The named open PR references an ATDD issue whose phase sits outside
      the merge-eligible set via an auto-closing keyword, so a merge would
      fire GitHub's auto-close before the lifecycle is satisfied.
      A merge may auto-close only an issue at atdd:REFACTOR or atdd:COMPLETE
      — read from phase_labels.merge_allowed in this file, not restated.
      Repair as follows (run `gh pr view <N>` to inspect the PR body and
      `gh issue view <issue> --json labels` to inspect labels; for atdd
      the phase labels live under .atdd/labels.yaml):

        1. Read the violation — it cites "PR#<N>" and names the linked
           issue number and current phase label
           (e.g. "PR#1673 → issue #1622 (phase=atdd:SMOKE)").
        2. Drive the issue forward through the state machine until it
           reaches REFACTOR — substitute <issue> with the issue number
           from step 1 (e.g. "1622"):
             atdd coach transition <issue> SMOKE
             atdd coach transition <issue> REFACTOR
           Stopping at SMOKE is not enough: REFACTOR carries
           `autonomy: operator` and the terminal hop to COMPLETE
           (phase_machine.convention.yaml, #1611), and that sign-off is
           what this rule protects (#1710).
        3. Re-run the validator on the same PR
           (run pytest src/atdd/coach/validators/test_pr_merge_blocks_pre_smoke_close.py -v).
        4. If the PR genuinely should NOT close the linked issue (the PR
           is a partial step, the issue should stay open), edit the PR
           body and remove the auto-closing keyword
           (run `gh pr edit <N> --body "<new-body>"`):
             - <N> = the PR number from step 1, e.g. "1673"
             Replace "Closes #<issue>" with "Refs #<issue>" so GitHub's
             auto-close does not fire on merge.

      This rule is strict by design — bypass is forbidden. The 2026-05-13
      incident shipped 8 PRs whose `Closes #N` fired at atdd:GREEN,
      skipping SMOKE+REFACTOR; #1710 is the same failure at atdd:SMOKE,
      skipping REFACTOR alone. See issues #681 and #1710, and
      src/atdd/tester/conventions/smoke.convention.yaml::TESTER-SMOKE-PRES-001
      for the template pattern this rule mirrors.

  - id: "coach.pr.runtime-artifacts-blocked"
    severity: 4
    description: "No PR diff may add or modify paths under .atdd/runtime/**. .atdd/runtime/ is ephemeral per-run state (coach session files, decisions.jsonl, validation logs, agent events). When agents use git add -A or git commit, these files ride into the PR diff silently — PR #749 shipped .atdd/runtime/coach/358/planner-358-e7620840.session.json and 2 appended lines in decisions.jsonl from an unrelated zombie issue (#358). Green CI gave false confidence because no check inspected the diff file set. Strict disposition: bypass is forbidden; runtime artifacts in PRs is never intentional."
    disposition: strict
    introduced_in: "3.57.0"
    aliases: []
    validator: "test_e009_runtime_artifacts_blocked::test_real_validate_coach_passes_on_clean_branch"
    fix_hint: |
      The PR diff contains one or more paths under .atdd/runtime/. These are
      ephemeral per-run artifacts that must never be committed. Repair:

        1. Add .atdd/runtime/ to .gitignore (the full directory, not sub-paths).
        2. Untrack any currently-tracked files:
             git ls-files .atdd/runtime/ | xargs git rm --cached
        3. Commit the .gitignore change and the rm --cached deletions.
        4. Verify no .atdd/runtime/ files remain tracked:
             git ls-files .atdd/runtime/
           (should print nothing)
        5. Re-run atdd validate coach to confirm the violation is cleared.

      If decisions.jsonl or other files were committed as intentional state:
      that content belongs outside .atdd/runtime/ (which is by definition
      ephemeral). Relocate it to a non-runtime path and re-commit.

  - id: "coach.pr.closes-keyword-discipline"
    severity: 4
    description: "Auto-close intent on a PR must be declared exclusively and unambiguously in the PR BODY, and must match exactly what GitHub will actually auto-close (`closingIssuesReferences` from the GraphQL API). Two divergences are forbidden, because GitHub's closing-keyword parser is silently buggy in both: (1) NEGATED/QUALIFIED body keyword — a body phrase like `Does NOT close #N` still fires auto-close, because the parser ignores negation; use `Refs #N` instead. (2) COMMIT-INJECTED close not declared in the body — an issue appears in `closingIssuesReferences` (so it WILL auto-close on merge) but the PR body carries no affirmative `Closes #N`; the close is being injected by an immutable commit message (e.g. commit body `Closes #919 Sections B and C` while the PR body uses `Refs #919` — the #927 incident) outside the editable PR-body control point. This bit ATDD's multi-section umbrella deliveries repeatedly (#920, #927). Strict disposition: bypass is forbidden; the PR body is the single source of truth for auto-close intent."
    disposition: strict
    introduced_in: "3.87.0"
    aliases: []
    validator: "test_pr_closes_keyword_discipline::test_no_unintended_closes_keyword_in_open_prs"
    fix_hint: |
      A PR's effective auto-close set (GitHub `closingIssuesReferences`)
      diverges from what its BODY affirmatively declares, OR the body
      contains a negated/qualified closing keyword the GitHub parser
      ignores. The PR body is the single, editable source of truth for
      auto-close intent — repair so the two agree:

        1. Read the violation — it cites "PR#<N>" (e.g. "927") and the issue
           number, and says which divergence fired. Throughout this hint <N>
           is that PR number and #N is that issue number:

           (a) COMMIT-INJECTED — GitHub will auto-close #N but the body has
               no affirmative `Closes #N`. The keyword lives in a commit
               message (the violation names the offending commit sha).
                 • If this PR genuinely fully closes #N: add `Closes #N` to
                   the PR body (`gh pr edit <N> --body "<new-body>"`) AND
                   advance the issue label first
                   (`atdd coach transition <N> SMOKE` → `atdd coach transition <N> REFACTOR`),
                   per coach.pr.merge-blocks-on-pre-smoke-close.
                 • If this PR is a PARTIAL/umbrella step (the issue stays
                   open): amend the commit message to use `Refs #N` instead
                   of `Closes #N` so GitHub's auto-close does not fire:
                     git rebase -i origin/main   # reword the named commit
                   (in this environment, edit the commit body so it reads
                   `Refs #N`, then force-push the branch).

           (b) NEGATED-BODY — the body contains `Closes #N` (or fix/resolve)
               inside a negation like "Does NOT close #N". GitHub ignores
               the negation and closes #N anyway. Replace the whole phrase
               with `Refs #N`:
                 gh pr edit <N> --body "<body with Refs #N>"

        2. Re-run the validator on the same PR:
             pytest src/atdd/coach/validators/test_pr_closes_keyword_discipline.py -v

      Rule of thumb (also in CONDUCTOR.md / memory): use `Closes #N` ONLY
      in the PR body and ONLY when you mean a full close; everywhere else
      (commit messages, partial deliveries, negated mentions) use `Refs #N`.
      This rule is strict by design — bypass is forbidden. See issue #928
      Gap 3 and the #927 incident.

# =============================================================================
# Lifecycle phases relevant to this convention
# =============================================================================
# Phase labels live on GitHub issues as `atdd:<PHASE>` and are managed by
# `atdd coach transition <N> <PHASE>`.
#
# ONE list, and it is the ALLOWED one (issue #1710). This block used to carry
# `merge_blocked` and `out_of_scope` alongside it — two hand-written complements
# of `merge_allowed` — and the validator mirrored `merge_blocked` a third time as
# a Python frozenset. Every phase the machine grew had to be remembered in all
# three, `atdd:SMOKE` was not, and the strict gate permitted exactly what this
# file's own rule description forbade. PR #1691 auto-closed #1689 and PR #1648
# auto-closed #1635 through that gap, both at `atdd:SMOKE`.
#
# So blocked is now COMPUTED as the complement, by
# `src/atdd/coach/utils/pr_merge_eligibility.py`, which the validator reads
# instead of restating. There is no list left to forget to extend, and a phase
# added to the machine later BLOCKS until it is admitted here on purpose.
#
# Merge-eligible — a merge may fire GitHub's auto-close from these:
#
#   atdd:REFACTOR    — clean-architecture pass; `autonomy: operator` and the
#                      terminal hop to COMPLETE (phase_machine.convention.yaml,
#                      #1611). This is the sign-off the rule exists to protect.
#   atdd:COMPLETE    — already shipped (auto-close is a no-op here)
#
# Everything else is merge-INELIGIBLE, and these three are the deliberate calls:
#
#   atdd:SMOKE       — real-infra verification in flight, REFACTOR not yet
#                      entered. Closing here skips the operator sign-off — the
#                      2026-05-13 substrate-asymmetry incident, one phase along.
#   atdd:BLOCKED     — an escape entered by operator decision from any rung;
#                      the lifecycle is suspended SHORT OF REFACTOR, so a merge
#                      that closes it skips the same sign-off.
#   atdd:OBSOLETE    — terminal, and reached by an operator transition. A merge
#                      may not perform the retirement; that would be a one-label
#                      bypass of a rule whose disposition is `strict`.
phase_labels:
  merge_allowed: ["REFACTOR", "COMPLETE"]

# =============================================================================
# Auto-close keyword set
# =============================================================================
# GitHub's auto-close keywords (case-insensitive). The validator considers
# any of these in the PR body — or the `closingIssuesReferences` GraphQL
# field — as evidence that merging the PR would close the linked issue.
auto_close_keywords:
  - "close"
  - "closes"
  - "closed"
  - "fix"
  - "fixes"
  - "fixed"
  - "resolve"
  - "resolves"
  - "resolved"

# =============================================================================
# Cross-references
# =============================================================================
references:
  template_pattern: "src/atdd/tester/conventions/smoke.convention.yaml::TESTER-SMOKE-PRES-001"
  sibling_pr_rules:
    - "coach.pr.base-must-be-default-branch (rule-id.convention.yaml)"
    - "coach.pr.mass-delete-guard (rule-id.convention.yaml)"
  disposition_gate: "src/atdd/coach/utils/disposition_gate.py::assert_disposition_satisfied"
  pr_manager: "src/atdd/coach/commands/pr.py::PRManager.resolve_linked_issue"
