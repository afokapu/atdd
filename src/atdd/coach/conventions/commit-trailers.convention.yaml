schema_version: "1.0.0"
convention_id: "coach.commit-trailers"
name: "Commit Trailers Convention"
description: |
  Required RFC-822-style trailers on every commit produced by an
  ATDD-orchestrated agent. Trailers are mechanically enforced at the
  producer side by the pre-commit hook (already shipped) and mirrored at
  the runtime side by the coach v9 git watcher (issue #517 / wagon
  ``dispatch-validators`` / WMBT M001), which emits violations under
  this rule family when a commit lands on a coach-watched worktree
  without one of the required trailers.

  Defense-in-depth: producer-side enforcement and runtime-side
  observation share rule-IDs so spawn-feedback templates (spec §7.6)
  stay coherent across both contexts.

rationale: |
  Spec §7.3 (commit trailers — mechanically enforced) requires every
  commit to carry Phase, WMBT-Urn, Agent-Id, and Issue trailers so
  downstream tier-1 dispatch (#M3 selection, #M4 suppression, #M5 risk
  score) can resolve a per-phase, per-scope routing decision without
  polling. Without parsed trailers in the runtime layer, there is no
  deterministic input for the validator selection resolver.

  Real incident (cf. spec §1): an earlier monitor polled a screen hash
  to infer commit transitions — slow, lossy, fragile. M1 makes the first
  link of the tier-1 chain event-driven; this convention is the
  rule-family the watcher emits when the producer contract is violated.

required_trailers:
  - "Phase"
  - "WMBT-Urn"
  - "Agent-Id"
  - "Issue"

rules:
  - id: "coach.commit-trailers.phase-required"
    name: "phase-required"
    description: |
      Every commit on a coach-watched worktree MUST carry a ``Phase: <PHASE>``
      trailer where ``<PHASE>`` is one of the ATDD lifecycle phases
      (INIT, PLANNED, RED, GREEN, SMOKE, REFACTOR).
    severity: 4
    disposition: strict
    validator: "test_commit_trailers_binding::test_commit_trailers_rule_family_emits_each_required_trailer_id"
    detection: |
      Coach v9 git watcher runs ``git interpret-trailers --parse`` on the
      message of every observed commit and emits this rule when the
      ``Phase`` token is absent or empty.
    rationale: |
      Without ``Phase`` the per-phase validator selection resolver (#M3)
      has no input to dispatch on, breaking the tier-1 chain.

  - id: "coach.commit-trailers.wmbt-urn-required"
    name: "wmbt-urn-required"
    description: |
      Every commit on a coach-watched worktree MUST carry a
      ``WMBT-Urn: <urn>`` trailer where ``<urn>`` matches the wagon
      WMBT URN grammar ``wmbt:<wagon>:<id>``.
    severity: 4
    disposition: strict
    validator: "test_commit_trailers_binding::test_commit_trailers_rule_family_emits_each_required_trailer_id"
    detection: |
      Coach v9 git watcher emits this rule when the ``WMBT-Urn`` trailer
      is absent or empty.
    rationale: |
      WMBT-Urn anchors the commit to a specific WMBT in the wagon plan,
      enabling traceability between commits and acceptance criteria.

  - id: "coach.commit-trailers.agent-id-required"
    name: "agent-id-required"
    description: |
      Every commit on a coach-watched worktree MUST carry an
      ``Agent-Id: <id>`` trailer naming the agent that produced it.
    severity: 4
    disposition: strict
    validator: "test_commit_trailers_binding::test_commit_trailers_rule_family_emits_each_required_trailer_id"
    detection: |
      Coach v9 git watcher emits this rule when the ``Agent-Id`` trailer
      is absent or empty.
    rationale: |
      Agent-Id ties the commit to a specific runtime agent so coach can
      route validation feedback (correction injection per #500) back to
      the right session.

  - id: "coach.commit-trailers.issue-required"
    name: "issue-required"
    description: |
      Every commit on a coach-watched worktree MUST carry an
      ``Issue: <number>`` trailer naming the GitHub issue it advances.
    severity: 4
    disposition: strict
    validator: "test_commit_trailers_binding::test_commit_trailers_rule_family_emits_each_required_trailer_id"
    detection: |
      Coach v9 git watcher emits this rule when the ``Issue`` trailer is
      absent or empty.
    rationale: |
      Issue resolves the cross-wagon journey context (which parent
      issue, which train) and drives review-aggregate keying
      (``.atdd/runtime/issue-reviews/<issue-N>/``).
