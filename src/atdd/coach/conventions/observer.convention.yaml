version: "1.0"
name: "Observer Convention"
description: |
  Canonical rule_ids for the coach observer's default detection rules per
  spec §8.3. The basic-protocol set (01–05, 08, 09) ships in #L2;
  token-threshold (06) in #L3; the drift/classifier rules (13–16) in #L4;
  substrate-aware (10, 11, 12, 17) in #L5.

  Each rule_id resolves via ``bind_rule()`` at observer rule load time
  per ``src/atdd/coach/commands/observer.py::ObserverRule``. The
  YAML rule files at ``.atdd/observer/rules/<NN>-<slug>.yaml`` reference
  these canonical ids via their ``rule_id:`` field.

# =============================================================================
# Basic protocol observer rules (#L2 — issue #506)
# =============================================================================
basic_protocol_observer_rules:
  description: |
    Seven rules from spec §8.3 that catch structural violations
    independent of substrate-rule-id machinery. Authored as YAML at
    ``.atdd/observer/rules/`` and unit-tested against synthetic agent
    outputs. Disposition is ``documentation-only`` because the rules
    are dispatched by the observer runtime (``Observer.scan_once``)
    rather than by a pytest validator — the back-reference machinery
    in ``test_rule_validator_binding`` only resolves validator
    callables, not runtime emitters. Corrections still surface to the
    agent via the standard injection paths; the disposition only
    governs CI's reaction (which is "none" for runtime advisories).
  rules:
    - id: "coach.observer.unstructured-question"
      severity: 3
      disposition: documentation-only
      description: "Agent asked a free-form question outside `atdd agent ask`"
      fix_hint: "Reformulate via `atdd agent ask --type ...`."
      introduced_in: "3.21.0"
    - id: "coach.observer.token-silence"
      severity: 3
      disposition: documentation-only
      description: "Agent emitted no tokens for longer than the configured silence threshold"
      fix_hint: "If blocked, escalate via `atdd agent escalate`."
      introduced_in: "3.21.0"
    - id: "coach.observer.completion-claim-without-commit"
      severity: 3
      disposition: documentation-only
      description: "Agent claimed completion but no `commit_observed` event was recorded"
      fix_hint: "Commit your work before claiming completion, or revise the claim."
      introduced_in: "3.21.0"
    - id: "coach.observer.out-of-scope-edit"
      severity: 4
      disposition: documentation-only
      description: "Agent modified a file outside the WMBT target paths or under `.atdd/` outside the allowlist"
      fix_hint: "Revert the out-of-scope change or escalate to widen scope."
      introduced_in: "3.21.0"
    - id: "coach.observer.missed-heartbeat"
      severity: 3
      disposition: documentation-only
      description: "Agent's `heartbeat.json` mtime is older than the configured staleness threshold"
      fix_hint: "Call `atdd agent heartbeat` after each significant action."
      introduced_in: "3.21.0"
    - id: "coach.observer.reviewer-edit-attempt"
      severity: 4
      disposition: documentation-only
      description: "Reviewer-persona agent's output mentions edits or commits — violates the reviewer no-write contract"
      fix_hint: "You are a Reviewer. You may not edit or commit."
      introduced_in: "3.21.0"
    - id: "coach.observer.validator-failure-ignored"
      severity: 4
      disposition: documentation-only
      description: "Agent committed again without addressing tier-1 violations cited on the prior commit"
      fix_hint: "Address the unaddressed rule_ids before re-committing."
      introduced_in: "3.21.0"

# =============================================================================
# Drift + classifier observer rules (#L4 — issue #513)
# =============================================================================
# Disposition is ``documentation-only`` because these rules are dispatched by
# the observer runtime (``Observer.scan_once``) — the runtime correctors live
# in ``src/atdd/coach/observer_rules/`` (detectors.py + the rule modules) and
# carry their own ``disposition`` (advisory/strict) in code. The static
# coherence validator only resolves validator callables, not runtime emitters;
# direct unit coverage for the detectors lives in
# ``src/atdd/coach/observer_rules/tests/``.
drift_classifier_observer_rules:
  description: |
    Four runtime rules from spec §8.3: a Bash-prompt classifier and three
    drift detectors/correctors. The runtime function bodies live in
    ``observer_rules/detectors.py``; rules 14 and 15 log the
    ``coach.session.*`` rule IDs (session.convention.yaml).
  rules:
    - id: "coach.observer.bash-auto-approve"
      severity: 3
      disposition: documentation-only
      description: "Auto-approve known-safe bash prompts; escalate deny-pattern prompts"
      introduced_in: "3.21.0"
      fix_hint: |
        Inspect the bash command against observer.convention.yaml::bash_classifier.auto_approve_patterns
        and deny_patterns. Auto-approve matches send "1\n" via the multiplexer; deny matches
        escalate to the operator.

    - id: "coach.observer.canonical-naming-drift"
      severity: 3
      disposition: documentation-only
      description: "Detect multiplexer surface name drift from canonical and re-apply via correct_naming_drift"
      introduced_in: "3.21.0"
      fix_hint: |
        Re-apply the canonical name to the drifted surface. See
        session.convention.yaml::session_naming.format and the
        coach.session.canonical-session-name rule for the canonical regex.

    - id: "coach.observer.layout-drift"
      severity: 2
      disposition: documentation-only
      description: "Detect surface count or arrangement drift from target_grid_label and re-apply via correct_layout_drift"
      introduced_in: "3.21.0"
      fix_hint: |
        Re-apply the canonical layout. See session.convention.yaml::layout_placement.policy
        and the coach.session.layout-conformance rule.

    - id: "coach.observer.smoke-skip"
      severity: 4
      disposition: documentation-only
      description: "Flag a phase transition from GREEN to REFACTOR without an intervening SMOKE"
      introduced_in: "3.21.0"
      fix_hint: |
        Run SMOKE phase tests against real infrastructure before transitioning to REFACTOR.
        See atdd-coach-spec-v9.md §6.4 (phase-ordering contract).

# =============================================================================
# Token-threshold observer rule (#L3 — issue #507)
# =============================================================================
# Relocated from the decommissioned orchestration.convention.yaml. Enforced at
# *runtime* by the observer evaluation loop (the runtime correction record at
# ``.atdd/observer/rules/06-token-threshold.yaml`` carries disposition:
# advisory); documentation-only here so the static coherence validator does not
# require a validator pointer.
token_threshold_observer_rule:
  rules:
    - id: "coach.observer.token-threshold"
      aliases: ["06-token-threshold"]
      severity: 3
      disposition: documentation-only
      description: "Token-count alert (rule 06): fires when the agent approaches its context window limit (default 400k per coach.token_alert_threshold)"
      introduced_in: "3.21.0"

# =============================================================================
# Bash-prompt classifier patterns (issue #366)
# =============================================================================
# Relocated from the decommissioned orchestration.convention.yaml. The Bash
# command is extracted from the observer screen capture and matched against
# deny patterns first, then allow patterns; unmatched commands escalate. Loaded
# at runtime by ``observer_rules/detectors.py::_load_bash_patterns``.
bash_classifier:
  auto_approve_patterns:
    description: |
      Regex patterns (anchored at the start of the command) for Bash invocations
      the observer auto-approves. Numeric suffix range reserved for allow rules;
      deny rules live under deny_patterns.
    rules:
      - id: "coach.observer.bash-read-only-git-diagnostics"
        severity: 2
        disposition: documentation-only
        description: "Read-only git diagnostics"
        regex: '^git (status|log|diff|show|branch|remote|fetch|rev-parse|reflog|stash list)\b'
      - id: "coach.observer.bash-test-runner-invocations"
        severity: 2
        disposition: documentation-only
        description: "Test runner invocations"
        regex: '^pytest\b'
      - id: "coach.observer.bash-read-only-file-inspection"
        severity: 2
        disposition: documentation-only
        description: "Read-only file inspection"
        regex: '^(ls|cat|head|tail|grep|find|wc)\b'
      - id: "coach.observer.bash-stdout-only-output"
        severity: 1
        disposition: documentation-only
        description: "Stdout-only output"
        regex: '^echo\b'
      - id: "coach.observer.bash-print-working-directory"
        severity: 1
        disposition: documentation-only
        description: "Print working directory"
        regex: '^pwd\s*$'
      - id: "coach.observer.bash-worker-self-checkpoint-issue"
        severity: 1
        disposition: documentation-only
        description: "Worker self-checkpoint (issue #378)"
        regex: '^atdd checkpoint\b'

  deny_patterns:
    description: |
      Regex patterns that always escalate, even if a permissive allow pattern
      would also match. Deny is checked *before* allow so the safety boundary
      cannot be widened by accident.
    rules:
      - id: "coach.observer.bash-network-egress-escalate-even"
        severity: 5
        disposition: documentation-only
        description: "Network egress — escalate even if otherwise safe"
        regex: '^(curl|wget)\b'
      - id: "coach.observer.bash-mutates-python-environment"
        severity: 4
        disposition: documentation-only
        description: "Mutates Python environment"
        regex: '^pip (install|uninstall)\b'
      - id: "coach.observer.bash-destructive-file-ops-always"
        severity: 5
        disposition: documentation-only
        description: "Destructive file ops — always escalate"
        regex: '^(rm|mv)\b'
      - id: "coach.observer.bash-destructive-or-remote-mutating"
        severity: 4
        disposition: documentation-only
        description: "Destructive or remote-mutating git ops"
        regex: '^git (push|reset --hard|clean -f|branch -D|checkout --)\b'
