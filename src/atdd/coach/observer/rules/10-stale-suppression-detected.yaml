# Observer rule 10 — stale-suppression-detected (issue #514, spec §8.3).
#
# Tier-2 bridge: fires at commit-time when a changed file in the worktree
# carries `# atdd:suppress(<toolkit-rule-id>) [UNTIL=<past>]`. Markers
# naming `repo.*` rule_ids are intentionally ignored — substrate v12 §2
# declares repo rules unsuppressible, so a stale repo.* marker is a
# distraction (the rule it would suppress fires anyway via the substrate
# walker). The tier-1 substrate validator catches the underlying
# violation; this rule is the fast loop.

rule_id: "coach.observer.stale-suppression-detected"
trigger:
  type: stale_suppression
severity: 3
disposition: advisory
injection_method: cli-return
correction_text: |
  Stale suppression marker for {rule_id} found at {location} (UNTIL={date}, expired). Either fix the underlying violation or extend the deadline.
