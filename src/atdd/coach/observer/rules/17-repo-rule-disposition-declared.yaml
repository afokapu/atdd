# Observer rule 17 — repo-rule-disposition-declared (issue #514, spec §8.3).
#
# Tier-2 bridge: fires when a changed plan/ YAML (acceptance, abuse_case,
# train acceptance) declares a `disposition:` field. Substrate v12 §4.4
# disallows this — repo rules are strict-by-construction; the walker
# sets `disposition: strict` per §4.4. The substrate's
# rule_binding._find_disposition_anywhere catches the same condition at
# validate-time; this rule is the fast loop at commit-time.

rule_id: "coach.observer.repo-rule-disposition-declared"
trigger:
  type: repo_rule_disposition_declared
severity: 4
disposition: advisory
injection_method: cli-return
correction_text: |
  Repo contract rules cannot declare disposition (substrate v12 §4.4). Disposition is set by the walker to strict. Remove the field. (offending file: {location})
