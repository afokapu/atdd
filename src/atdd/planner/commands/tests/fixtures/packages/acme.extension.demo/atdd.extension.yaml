schema_version: "1.0.0"
# Fixture extension for the composition smoke (#1130). Structurally faithful to
# official/atdd.extension.github but minimal. Uses a non-reserved publisher.
extension_id: acme.extension.demo
kind: extension
version: "0.1.0"

owns:
  conventions:
    - conventions/demo.area.sample-rule.convention.yaml

# realizes (#1133): the ONLY cross-package relation. An owned extension node realizes a
# shipped core node. N:M is allowed — here one demo node realizes two core nodes.
# depends_on.targets is DERIVED from this (must be a subset; the gate enforces it).
realizes:
  - extension_node: demo.area.sample-rule
    core_node: coach.lifecycle.phase-machine
  - extension_node: demo.area.sample-rule
    core_node: coach.execution.atomic-registry-write

depends_on:
  core:
    - atdd.core.convention-node-schema
  # targets.coach_nodes are DERIVED from realizes (every realized core_node). The
  # composition gate fails if a target is not realized.
  targets:
    coach_nodes:
      - coach.lifecycle.phase-machine
      - coach.execution.atomic-registry-write
  # design_candidates are NOT shipped core nodes — kept out of targets so depends_on
  # stays strictly resolvable. Loaded as non-normative references only.
  design_candidates:
    coach_nodes:
      - coach.execution.work-provenance
  workspaces:
    - id: acme.workspace.demo
      contract: "^1.0.0"
