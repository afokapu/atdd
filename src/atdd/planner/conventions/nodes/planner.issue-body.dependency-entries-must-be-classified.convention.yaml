schema_version: 1.0.0
rule_id: planner.issue-body.dependency-entries-must-be-classified
kind: rule
status: active
statement: 'Every #N entry in an issue body''s Dependencies section must carry a classification
  tag: prereq, merged, sibling, or parallel.'
rationale: Classifying each dependency prevents the session-template merge-wait loop
  from hanging on sibling or parallel work.
terms:
- term_id: dependency_entry
  text: a '#N' reference in the Dependencies section of an issue body
- term_id: classification_tag
  text: a trailing prereq/merged/sibling/parallel marker on the entry
implementation:
  type: validator
  ref: test_issue_deps_have_classification_tags::test_issue_deps_have_classification_tags
metadata:
  severity: 2
  disposition: advisory
  introduced_in: 3.81.0
  suppression_deadline: "2026-12-31"
