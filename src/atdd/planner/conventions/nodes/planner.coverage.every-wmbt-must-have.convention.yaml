schema_version: 1.1.0
rule_id: planner.coverage.every-wmbt-must-have
kind: rule
status: active
name: 'Coverage: Every Wmbt Must Have'
statement: Every WMBT must have at least one acceptance criterion, except WMBTs with
  status draft.
implementation:
  type: validator
  ref: test_hierarchy_coverage::test_all_wmbts_have_acceptances
source:
  legacy_path: src/atdd/planner/conventions/coverage.convention.yaml
  legacy_sha: sha256:27e800378c584902
  extraction_mode: high_fidelity
  legacy_rule_id: planner.coverage.every-wmbt-must-have
  legacy_section: rules
content:
  summary: A WMBT with no acceptance is unfalsifiable; requiring at least one keeps
    every truth verifiable. Draft WMBTs are exempt because they are work-in-progress
    and not yet ready for full coverage. This is the WMBT-to-Acceptance edge of the
    coverage graph and is enforced strictly.
  normative_text: Every WMBT must have at least one acceptance criterion
  examples:
  - every non-draft WMBT has at least one acceptance criterion
  counter_examples:
  - 'a non-draft WMBT has acceptances: [] and is not allow-listed'
  exceptions:
  - WMBTs with status draft are exempt from the acceptance requirement because draft
    artifacts are work-in-progress and not yet ready for full coverage.
  - WMBT URNs that are allowed to exist without acceptance criteria. Used for draft
    WMBTs or placeholder definitions.
metadata:
  aliases:
  - COVERAGE-PLAN-2.4
  severity: 3
  disposition: strict
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: true
  fix_hint_preserved: true
  reviewed_at: '2026-06-16'
terms:
- term_id: wmbt
  text: a What-Must-Be-True entry in a wagon decomposition
- term_id: acceptance_criterion
  text: a Given/When/Then check that proves the WMBT
- term_id: wmbt_to_acceptance
  label: Requirement WMBT -> acceptance
  text: Every WMBT must have at least one acceptance. Enforced by test_hierarchy_coverage::test_all_wmbts_have_acceptances.
- term_id: draft_status_exemption
  label: Draft artifacts exempt
  text: WMBTs with status draft are exempt from the acceptance requirement because
    draft artifacts are work-in-progress and not yet ready for full coverage.
  values:
    exempted_status: draft
    exempted_from: COVERAGE-PLAN-2.4
- term_id: wmbts_without_acceptance_exception
  label: Allow-listed WMBTs without acceptance
  text: WMBT URNs that are allowed to exist without acceptance criteria. Used for
    draft WMBTs or placeholder definitions.
  values:
    name: wmbts_without_acceptance
    config_path: coverage.exceptions.wmbts_without_acceptance
    use_case: Draft WMBTs or placeholder definitions
