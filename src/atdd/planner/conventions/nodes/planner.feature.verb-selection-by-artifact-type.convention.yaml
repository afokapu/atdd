schema_version: 1.1.0
rule_id: planner.feature.verb-selection-by-artifact-type
kind: family
status: active
name: Verb selection by artifact type
statement: The artifact type (event, state, data, config) determines the appropriate
  verbs for the feature name.
terms:
- term_id: verbs_by_type
  label: Verbs by artifact type
  text: artifact type -> verbs.
  values:
    events:
    - publish
    - emit
    - start
    - close
    - trigger
    - notify
    states:
    - track
    - monitor
    - maintain
    - update
    - manage
    data:
    - create
    - manage
    - process
    - handle
    - make
    - generate
    configs:
    - configure
    - setup
    - initialize
    - define
    - establish
  examples:
    positive:
    - match:started -> start-match
    - session:active -> maintain-session
    - player:profile -> manage-profile
    - match:config -> configure-match
- term_id: additional_verbs
  label: Verb-object enforcement allowlist
  text: "The explicit allowlist of leading verbs a planner artifact slug may use,\
    \ beyond the by_artifact_type suggestion verbs. planner.feature.name-is-verb-object\
    \ and planner.wagon.name-is-verb-object accept a slug iff its leading token is\
    \ in the union of this allowlist and verbs_by_type. The suggestion table alone\
    \ is insufficient as an enforcement basis \u2014 it rejects even the convention's\
    \ own examples (#1276)."
