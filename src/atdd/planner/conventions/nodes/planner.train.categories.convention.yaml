schema_version: 1.1.0
rule_id: planner.train.categories
kind: family
status: active
name: Train test categories
statement: "The category FIELD classifies a train as nominal, error, alternate, or exception. It is
  metadata on the train, never a digit in its identity (issues #1421, #1440), so reclassifying a train
  changes a field and not its name."
source:
  legacy_path: src/atdd/planner/conventions/train.convention.yaml
  legacy_section: numbering.categories
  legacy_sha: 825602729f11a3a4
  extraction_mode: high_fidelity
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: false
  fix_hint_preserved: false
  reviewed_at: '2026-06-16'
terms:
- term_id: category
  label: Test categories
  text: name -> description. The four values of the train's `category` field.
  values:
    nominal: Happy path - perfect conditions, standard flows
    error: Unexpected system failures - crashes, unavailability, infrastructure issues
    alternate: Valid alternative flows - different inputs, modes, configurations
    exception: Expected failures handled gracefully - validation errors, business rule violations
