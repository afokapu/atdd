terms:
- term_id: category
  label: Test categories
  text: name -> description. The four values of the train's `category` field.
  values:
    nominal: The intended journey - the domain runs to completion and returns the outcome the job exists to produce
    error: Failure originating outside the modelled domain - the domain never ran, so no verdict exists and no domain postcondition holds; the identical request may succeed once the fault clears (crashes, collaborator unavailability, infrastructure faults)
    alternate: A different in-domain route to a successful outcome - another input mode, channel, configuration or persona; still a success, not a failure
    exception: An in-domain refusal - the domain ran, evaluated the request and rendered a negative verdict, so the refusal is the business rule working; the identical request is refused identically on retry (validation failures, business rule violations, policy denials)
