schema_version: 1.1.0
rule_id: planner.train.dependencies-acyclic
kind: constraint
status: active
name: 'Train: Dependencies Acyclic'
statement: Train dependencies reference prerequisite trains as train:{train_id} matching
  ^train:[0-9]{2}-[a-z][a-z0-9-]*$, must reference valid train_ids, and circular dependencies
  are not allowed.
implementation:
  type: none
source:
  legacy_path: src/atdd/planner/conventions/train.convention.yaml
  legacy_sha: sha256:825602729f11a3a4
  extraction_mode: high_fidelity
  legacy_section: dependencies-acyclic
content:
  summary: Dependencies let a train declare the prerequisite trains that must run
    first — foundation trains (commons) before consumers, and producers before the
    trains that consume their artifacts. Forbidding cycles keeps the prerequisite
    graph a runnable ordering rather than an unsatisfiable loop.
  examples:
  - train:00-auth-session required before train:30-match-solo
  counter_examples:
  - A depends on B and B depends on A (circular)
  - A dependency referencing a train_id that does not exist
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: true
  fix_hint_preserved: true
  reviewed_at: '2026-06-16'
terms:
- term_id: dependency_format
  label: Dependency reference form
  text: A dependency references a prerequisite train that must run first, written
    as train:{train_id}, matching ^train:[0-9]{2}-[a-z][a-z0-9-]*$. Dependencies must
    reference valid train_ids.
  values:
    format: train:{train_id}
    pattern: ^train:[0-9]{2}-[a-z][a-z0-9-]*$
- term_id: acyclic
  label: No circular dependencies
  text: Circular dependencies are not allowed. The dependency graph must remain acyclic.
  values:
    circular: Circular dependencies are not allowed
- term_id: dependency_patterns
  label: Foundation-first and data-flow patterns
  text: Two common patterns — foundation_first (commons trains 00-09 often precede
    others) and data_flow (trains consuming artifacts depend on the trains producing
    them).
  values:
    foundation_first:
      description: Commons trains (00-09) often precede others
      examples:
      - train:00-auth-session required before train:30-match-solo
      - train:01-account-registration required before train:00-auth-session
    data_flow:
      description: Trains consuming artifacts depend on producing trains
      examples:
      - train:30-match-solo depends on train:21-scenario-curation for fragments
      - train:21-scenario-curation depends on train:20-story-to-scenario for graphs
