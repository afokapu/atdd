schema_version: 1.0.0
rule_id: planner.issue-body.graph-context-required
kind: rule
status: active
statement: Every parent issue body must carry a populated Graph Context section, neither
  missing nor left as the injection placeholder.
rationale: A populated Graph Context section forces each issue to state where it sits
  in the dependency graph before work starts.
terms:
- term_id: parent_issue_body
  text: the body of an atdd parent issue
- term_id: graph_context_section
  text: the populated Graph Context subsection of the issue body
implementation:
  type: validator
  ref: test_issue_body_has_graph_context::test_issue_body_has_graph_context
metadata:
  severity: 3
  disposition: suppress-and-clean
  introduced_in: 3.50.0
  suppression_deadline: "2026-12-31"
