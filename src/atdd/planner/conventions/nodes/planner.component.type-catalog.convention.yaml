schema_version: 1.1.0
rule_id: planner.component.type-catalog
kind: pattern
status: active
name: 'Component: Type Catalog'
statement: The canonical component type catalog enumerates every component type by
  side (backend|frontend), layer, file suffix per language, description, and complexity
  weight, derived from the coder backend/frontend conventions.
implementation:
  type: none
source:
  legacy_path: src/atdd/planner/conventions/component.convention.yaml
  legacy_sha: sha256:8bfb25fd6c2bdb6e
  extraction_mode: high_fidelity
  legacy_section: type-catalog
content:
  summary: A single canonical catalog of component types, their file suffixes, and
    complexity weights lets the planner derive components and estimate effort consistently
    with the coder conventions, instead of inventing types or weights ad hoc.
  operational_guidance: Derived from .claude/conventions/coder/{backend,frontend}.convention.yaml.
    Side and layer values for component URNs are defined by this catalog's structure.
  examples:
  - backend.integration.engines → *_engine.py, weight 3 (highest complexity)
  - backend.presentation.routes → *_routes.py, weight 0
  - frontend.presentation.controllers → *_bloc.dart / *-store.ts, weight 2
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: true
  fix_hint_preserved: true
  reviewed_at: '2026-06-16'
terms:
- term_id: backend_catalog
  label: Backend component types
  text: All backend component types keyed by layer (presentation, application, domain,
    integration), each with per-language file suffix, description, and complexity
    weight.
  values:
    presentation:
      controllers:
        suffix:
          python: '*_controller.py'
          typescript: '*-controller.ts'
        description: Request/response handlers for external interfaces
        weight: 1
      routes:
        suffix:
          python: '*_routes.py'
          typescript: '*-routes.ts'
        description: Routing configuration and endpoint definitions
        weight: 0
      serializers:
        suffix:
          python: '*_serializer.py'
          typescript: '*-serializer.ts'
        description: Input/output data serialization and formatting
        weight: 0.5
      validators:
        suffix:
          python: '*_validator.py'
          typescript: '*-validator.ts'
        description: Input validation at the edge
        weight: 0.5
      middleware:
        suffix:
          python: '*_middleware.py'
          typescript: '*-middleware.ts'
        description: Cross-cutting request/response processing
        weight: 1
      guards:
        suffix:
          python: '*_guard.py'
          typescript: '*-guard.ts'
        description: Authentication and authorization at transport layer
        weight: 1
      views:
        suffix:
          python: '*_view.py'
          typescript: '*-view.ts'
        description: Server-side rendered templates and UI components
        weight: 1
    application:
      use_cases:
        suffix:
          python: '*_use_case.py'
          typescript: '*-use-case.ts'
        description: Application-specific business workflows
        weight: 2
      handlers:
        suffix:
          python: '*_handler.py'
          typescript: '*-handler.ts'
        description: Command, query, and event processing
        weight: 1
      ports:
        suffix:
          python: protocols.py, *_port.py
          typescript: '*-port.ts'
        description: Interfaces and protocols for integration layer
        weight: 0
      dtos:
        suffix:
          python: '*_dto.py'
          typescript: '*-dto.ts'
        description: Data transfer objects between layers
        weight: 0
      policies:
        suffix:
          python: '*_policy.py'
          typescript: '*-policy.ts'
        description: Application-level business policies and rules
        weight: 1
      workflows:
        suffix:
          python: '*_workflow.py, *_saga.py'
          typescript: '*-workflow.ts'
        description: Long-running processes and orchestrations
        weight: 2
    domain:
      entities:
        suffix:
          python: '*.py'
          typescript: '*.ts'
        description: Core business objects with identity and lifecycle
        weight: 1
      value_objects:
        suffix:
          python: '*_vo.py, *.py'
          typescript: '*-vo.ts'
        description: Immutable types with equality-by-value semantics
        weight: 0.5
      aggregates:
        suffix:
          python: '*_aggregate.py'
          typescript: '*-aggregate.ts'
        description: Transactional consistency boundaries
        weight: 2
      services:
        suffix:
          python: '*_service.py'
          typescript: '*-service.ts'
        description: Domain services for cross-entity business logic
        weight: 1
      specifications:
        suffix:
          python: '*_spec.py'
          typescript: '*-spec.ts'
        description: Composable business rules and predicates
        weight: 0.5
      events:
        suffix:
          python: '*_event.py'
          typescript: '*-event.ts'
        description: Domain events representing facts that happened
        weight: 0
      exceptions:
        suffix:
          python: '*_exception.py'
          typescript: '*-exception.ts'
        description: Domain-specific errors and invariant violations
        weight: 0
    integration:
      repositories:
        suffix:
          python: '*_repository.py'
          typescript: '*-repository.ts'
        description: Data persistence and retrieval adapters
        weight: 2
      clients:
        suffix:
          python: '*_client.py'
          typescript: '*-client.ts'
        description: External API and service clients
        weight: 1
      caches:
        suffix:
          python: '*_cache.py'
          typescript: '*-cache.ts'
        description: Caching implementations
        weight: 0.5
      engines:
        suffix:
          python: '*_engine.py'
          typescript: '*-engine.ts'
        description: Computational and processing engines (ML, graph, optimization)
        weight: 3
      formatters:
        suffix:
          python: '*_formatter.py'
          typescript: '*-formatter.ts'
        description: Output formatting and rendering services
        weight: 1
      notifiers:
        suffix:
          python: '*_notifier.py'
          typescript: '*-notifier.ts'
        description: Communication and notification services
        weight: 1
      queues:
        suffix:
          python: '*_queue.py'
          typescript: '*-queue.ts'
        description: Message queue and event streaming clients
        weight: 2
      stores:
        suffix:
          python: '*_store.py'
          typescript: '*-store.ts'
        description: File and object storage adapters
        weight: 1
      mappers:
        suffix:
          python: '*_mapper.py'
          typescript: '*-mapper.ts'
        description: Data transformation and mapping between layers
        weight: 0.5
      schedulers:
        suffix:
          python: '*_scheduler.py'
          typescript: '*-scheduler.ts'
        description: Background tasks and scheduled jobs
        weight: 2
      monitors:
        suffix:
          python: '*_monitor.py'
          typescript: '*-monitor.ts'
        description: Observability and infrastructure monitoring
        weight: 1
- term_id: frontend_catalog
  label: Frontend component types
  text: All frontend component types keyed by layer (presentation, application, domain,
    integration), each with per-language file suffix, description, and complexity
    weight.
  values:
    presentation:
      views:
        suffix:
          dart: '*_page.dart'
          typescript: '*-page.tsx'
        description: Full-screen views and pages
        weight: 1
      components:
        suffix:
          dart: '*_widget.dart'
          typescript: '*.tsx'
        description: Reusable UI components
        weight: 0.5
      containers:
        suffix:
          typescript: '*-container.tsx'
        description: Smart components connected to state
        weight: 1
      controllers:
        suffix:
          dart: '*_bloc.dart'
          typescript: '*-store.ts'
        description: UI state management and business logic
        weight: 2
      routes:
        suffix:
          dart: '*_router.dart'
          typescript: '*-routes.ts'
        description: Navigation and routing configuration
        weight: 0
      layouts:
        suffix:
          dart: '*_layout.dart'
          typescript: '*-layout.tsx'
        description: Page structure and composition templates
        weight: 1
      styles:
        suffix:
          dart: '*_theme.dart'
          typescript: '*.css'
        description: Design tokens, themes, and styling
        weight: 0
      animations:
        suffix:
          dart: '*_animation.dart'
          typescript: '*-animation.ts'
        description: UI animations and transitions
        weight: 0.5
      forms:
        suffix:
          dart: '*_form.dart'
          typescript: '*-form.ts'
