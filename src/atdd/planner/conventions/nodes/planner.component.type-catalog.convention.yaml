        weight: 1
      dtos:
        suffix:
          dart: '*_dto.dart'
          typescript: '*-dto.ts'
        description: Application-internal data structures
        weight: 0
    domain:
      entities:
        suffix:
          dart: '*.dart'
          typescript: '*.ts'
        description: Domain models used on the client
        weight: 1
      value_objects:
        suffix:
          dart: '*_vo.dart'
          typescript: '*-vo.ts'
        description: Immutable typed values
        weight: 0.5
      services:
        suffix:
          dart: '*_service.dart'
          typescript: '*-service.ts'
        description: Pure domain logic services
        weight: 1
      specifications:
        suffix:
          dart: '*_spec.dart'
          typescript: '*-spec.ts'
        description: Composable rules and predicates
        weight: 0.5
      exceptions:
        suffix:
          dart: '*_exception.dart'
          typescript: '*-exception.ts'
        description: Domain-level errors
        weight: 0
    integration:
      repositories:
        suffix:
          dart: '*_repository.dart'
          typescript: '*-repository.ts'
        description: Data access implementations
        weight: 2
      clients:
        suffix:
          dart: '*_client.dart'
