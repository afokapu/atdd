schema_version: 1.1.0
rule_id: planner.coverage.bidirectional-coverage-between-wagons
kind: rule
status: active
name: 'Coverage: Bidirectional Coverage Between Wagons'
statement: A wagon and its features must reference each other bidirectionally - every
  feature file is referenced by its wagon manifest, and every features[] entry resolves
  to a real feature YAML file - leaving no orphan on either side.
implementation:
  type: advisory
source:
  legacy_path: src/atdd/planner/conventions/coverage.convention.yaml
  legacy_sha: sha256:27e800378c584902
  extraction_mode: high_fidelity
  legacy_rule_id: planner.coverage.bidirectional-coverage-between-wagons
  legacy_section: rules
content:
  summary: Bidirectional wagon-feature references prevent orphaned features that no
    wagon owns and dangling features[] entries that point at YAML files which do not
    exist. This is the Wagon-to-Feature edge of the coverage graph.
  normative_text: Bidirectional coverage between wagons and features
  examples:
  - every feature YAML is listed in some wagon's features[], and every features[]
    entry has a YAML file
  counter_examples:
  - a feature YAML file exists but no wagon manifest references it (and it is not
    allow-listed)
  - a wagon's features[] lists a URN with no corresponding feature YAML file
  exceptions:
  - Feature URNs that are allowed to exist without a wagon manifest reference. Used
    for deprecated features being phased out, or experimental features.
metadata:
  aliases:
  - COVERAGE-PLAN-2.2
  disposition: documentation-only
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: true
  fix_hint_preserved: true
  reviewed_at: '2026-06-16'
terms:
- term_id: wagon
  text: a unit of work that owns features via its features[] list and owns WMBTs
- term_id: feature
  text: a capability slice registered under a wagon, backed by a feature YAML file
- term_id: feature_to_wagon
  label: Direction feature -> wagon
  text: Every feature file must be referenced by its wagon manifest. Enforced by test_all_features_in_wagon_manifest.
- term_id: wagon_to_feature
  label: Direction wagon -> feature
  text: Every features[] entry in a wagon manifest must have a corresponding feature
    YAML file. Enforced by test_all_wagon_feature_refs_exist.
- term_id: features_orphaned_exception
  label: Allow-listed features without wagon reference
  text: Feature URNs that are allowed to exist without a wagon manifest reference.
    Used for deprecated features being phased out, or experimental features.
  values:
    name: features_orphaned
    config_path: coverage.exceptions.features_orphaned
    use_case: Deprecated features being phased out, or experimental features
