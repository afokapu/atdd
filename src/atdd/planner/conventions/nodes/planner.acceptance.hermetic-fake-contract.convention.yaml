schema_version: 1.1.0
rule_id: planner.acceptance.hermetic-fake-contract
kind: constraint
status: active
name: Hermetic fake-contract declaration
statement: "When execution_kind is hermetic_integration AND permitted_fakes is non-empty,\
  \ the acceptance MUST declare the hermetic fake-contract block \u2014 the declaration\
  \ IS the contract."
terms:
- term_id: fake_contract
  text: 'the declared fidelity contract for each permitted fake: name, fidelity, and
    required known_gaps.'
implementation:
  type: validator
  ref: test_hermetic_integration_contract::test_no_undeclared_hermetic_fakes
source:
  legacy_path: src/atdd/planner/conventions/acceptance.convention.yaml
  legacy_section: hermetic
  legacy_sha: 027e2d86ff127550
  extraction_mode: high_fidelity
content:
  normative_text: Required when execution_kind == hermetic_integration AND permitted_fakes
    is non-empty.
  constraints:
  - "exercised_boundaries: list[boundary_kind] \u2014 controlled-vocab surfaces exercised\
    \ (required)."
  - "permitted_fakes: list[str] \u2014 named fakes/cassettes substituted for live\
    \ infra (may be empty; when empty the fidelity rule does not apply)."
  - "fake_contract_fidelity: list of {name, fidelity, known_gaps:list[str] required}\
    \ \u2014 one per permitted fake (required when permitted_fakes non-empty)."
  - "live_smoke_required: bool \u2014 true when a paired execution_kind: live_smoke\
    \ sibling must exist under the same WMBT (required)."
  - "live_smoke_reason: str \u2014 optional rationale when live_smoke_required is\
    \ true."
parity:
  source_fragments_preserved: true
  examples_preserved: false
  implementation_preserved: true
  fix_hint_preserved: false
  reviewed_at: '2026-06-16'
