schema_version: 1.0.0
rule_id: planner.train.interlocking-guard-grammar
kind: rule
status: active
name: Interlocking guard grammar
statement: Interlocking guards are declarative, deterministic, side-effect-free expressions;
  raw Python eval is forbidden.
terms:
- term_id: guard_grammar
  text: allowed inputs are action/request inputs, explicit state snapshot, completed
    TrainResult only at declared route boundaries; allowed operators are == != < <=
    > >= and or not exists(field) in
implementation:
  type: validator
  ref: test_sequence_diagram_sanity::test_interlocking_guard_grammar_is_safe
metadata:
  severity: 3
  disposition: strict
validation:
  family: grammar
  template: identifier_grammar_conformance
  variant: planner_train_interlocking_guard_grammar
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: interlocking
  failure_evidence:
  - interlocking_id
  - guard_id
  - expression
  - invalid_token
  - reason
