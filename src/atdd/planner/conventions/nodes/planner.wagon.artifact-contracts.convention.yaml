schema_version: 1.0.0
rule_id: planner.wagon.artifact-contracts
kind: rule
status: active
source:
  legacy_path: src/atdd/planner/conventions/wagon.convention.yaml
  legacy_sha: sha256:ee0a3e1d5af414c9
  extraction_mode: high_fidelity
statement: A wagon's produced and consumed artifacts reference contract and telemetry
  URNs of the form contract:{theme}(:{category})*:{aspect}(.{variant})? and telemetry:{theme}(:{category})*:{aspect}(.{variant})?.
rationale: Contract and telemetry URNs give every artifact a stable, theme-rooted
  address so that producers and consumers agree on shape and observability without
  duplicating the contract bodies, which live in the planner artifact convention.
terms:
- term_id: contract_urn_format
  label: contract URN grammar
  text: A contract URN follows contract:{theme}(:{category})*:{aspect}(.{variant})?,
    rooting the contract under its theme with optional category segments and an optional
    variant suffix.
  values:
    contract_urn: contract:{theme}(:{category})*:{aspect}(.{variant})?
  examples:
    positive:
    - contract:commons:ux:foundations:color
    - contract:mechanic:decision.choice
    - contract:sensory:gesture.raw
    negative:
    - 'contract:Commons:UX  # segments must be lowercase kebab/snake under theme'
- term_id: telemetry_urn_format
  label: telemetry URN grammar
  text: A telemetry URN follows telemetry:{theme}(:{category})*:{aspect}(.{variant})?,
    mirroring the contract URN grammar for observability and analytics signals.
  values:
    telemetry_urn: telemetry:{theme}(:{category})*:{aspect}(.{variant})?
  examples:
    positive:
    - telemetry:commons:ux:foundations
    - telemetry:mechanic:decision.choice
    negative:
    - 'telemetry:  # theme segment is required'
- term_id: artifact_contracts_ref
  label: Full contracts delegated
  text: The full artifact contract conventions, including artifact_contracts and artifact_transformation,
    are defined in the planner artifact convention; this node only fixes the URN formats
    and the produce/consume field specs.
  values:
    artifact_contracts: $ref conventions:planner:artifact#/artifact_contracts
    artifact_transformation: $ref conventions:planner:artifact#/artifact_transformation
examples:
  positive:
  - contract:commons:ux:foundations + telemetry:commons:ux:foundations on a produced
    artifact
  negative:
  - referencing an inline contract body instead of a contract URN
