schema_version: 1.0.0
rule_id: planner.feature.grouping-strategy
kind: pattern
status: active
source:
  legacy_path: src/atdd/planner/conventions/feature.convention.yaml
  legacy_sha: sha256:4a95544261fb9541
  extraction_mode: high_fidelity
statement: WMBTs are grouped into features by a chosen strategy (by step, dimension,
  object, or coherence), guided by cohesion heuristics, with each group capped at
  10 WMBTs and no miscellaneous buckets.
rationale: Cohesive grouping keeps every feature a user-facing, coherent slice rather
  than an arbitrary bag of outcomes, and the per-group cap plus shared-object/metric/plane
  heuristics make decomposition repeatable and bounded.
terms:
- term_id: grouping_strategies
  label: The four grouping strategies
  text: Group WMBTs by_step (same JTBD step), by_dimension (same measured dimension),
    by_object (same controlled object), or by_coherence (a coherent user story). Each
    strategy caps a group at 10 WMBTs.
  values:
    by_step:
      description: Group WMBTs that share the same JTBD step
      max_per_group: 10
    by_dimension:
      description: Group WMBTs that measure the same dimension
      max_per_group: 10
    by_object:
      description: Group WMBTs that control the same object
      max_per_group: 10
    by_coherence:
      description: Group WMBTs that form a coherent user story
      max_per_group: 10
- term_id: grouping_heuristics
  label: Cohesion heuristics
  text: Prefer grouping by a shared object of control, a shared metric kind, a shared
    plane/domain, or the same user story or flow. Avoid miscellaneous buckets — every
    feature must be user-facing and cohesive.
  values:
    heuristics:
    - Shared object of control (e.g., timebank, ability, score)
    - Shared metric kind (latency, likelihood, effort)
    - Shared plane/domain (ui, be, nw, etc.)
    - Same user story or flow
    avoid: Miscellaneous buckets — every feature must be user-facing and cohesive
- term_id: feature_naming_pattern
  label: Feature naming pattern
  text: A grouped feature is named with the {verb}-{object} pattern in kebab-case.
  values:
    pattern: '{verb}-{object}'
  examples:
    positive:
    - manage-inventory
    - track-performance
    - optimize-workflow
- term_id: estimation_signals
  label: Estimating footprint from WMBTs and interfaces
  text: WMBT verbs and component layers hint at footprint — display/animation implies
    a screen/view, apply/validate an endpoint, reconcile/persist a table/migration,
    notify/retry/queue an async job; new_events imply event count, external consumes/produces
    imply integration points, be_repository implies a table/migration, fe_presentation
    implies number of screens.
  values:
    from_wmbts:
      display_animation: likely screen/view
      apply_validate: endpoint
      reconcile_persist: table/migration
      notify_retry_queue: async
    from_interfaces:
      new_events: event count
      external_consumes_produces: integration points
    from_component_layers:
      be_repository: table/migration
      fe_presentation: number of screens
