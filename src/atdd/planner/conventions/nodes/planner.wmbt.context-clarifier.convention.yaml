schema_version: 1.0.0
rule_id: planner.wmbt.context-clarifier
kind: rule
status: active
source:
  legacy_path: src/atdd/planner/conventions/wmbt.convention.yaml
  legacy_sha: sha256:040256ed5588a6c7
  extraction_mode: high_fidelity
statement: A WMBT carries a required context clarifier — a single-line situational
  phrase extracted from the requirement that specifies when, where, or how the truth
  applies.
rationale: A context clarifier pins a WMBT to its applicable situation, preventing
  an over-broad truth from being read as universal. Requiring it forces the planner
  to state the conditions under which the optimization holds.
notes: The clarifier is appended to the statement after the object-of-control when
  present (see planner.wmbt.statement-template). It is marked required in the legacy
  generator.
terms:
- term_id: context_clarifier_form
  label: How the context clarifier is extracted
  text: From the requirement description, extract any contextual clarifier that specifies
    when/where/how this applies, as a detailed situational phrase of at most one line.
  values:
    generator_prompt: From '${inputs.description}', extract any contextual clarifier
      that specifies when/where/how this applies
    pattern: detailed situational phrase, one line maximum
    required: true
  examples:
    positive:
    - during peak onboarding weeks
    - when the form is submitted offline
    negative:
    - a multi-paragraph explanation (exceeds one-line maximum)
examples:
  positive:
  - minimize Time of dilemma-resolution during high-load incidents (clarifier present)
  negative:
  - A WMBT statement with no clarifier specifying when/where/how it applies
