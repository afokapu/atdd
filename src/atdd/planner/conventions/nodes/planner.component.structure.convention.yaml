schema_version: 1.0.0
rule_id: planner.component.structure
kind: rule
status: active
source:
  legacy_path: src/atdd/planner/conventions/component.convention.yaml
  legacy_sha: sha256:8bfb25fd6c2bdb6e
  extraction_mode: high_fidelity
statement: A generated component carries a complete structure — URN, required parent
  feature, templated description, consumed/produced events (max 3 each), and dependencies.
rationale: Pinning down the full required shape of a generated component — parent
  feature, description, bounded events, and dependencies — ensures every component
  the planner emits is complete and consistently structured for downstream phases.
terms:
- term_id: structure_urn
  label: Structure URN pattern
  text: 'Component structure URN pattern: component:{wagon}.{feature}.{business_capability}.{side}.{layer}.
    Uses {side} instead of {tier} for clarity.'
  values:
    pattern: component:{wagon}.{feature}.{business_capability}.{side}.{layer}
    example: component:resolve-dilemmas:choose-option.option-validator.backend.domain
    note: Pattern updated to use {side} instead of {tier} for clarity
- term_id: parent_feature
  label: Parent feature
  text: The parent feature is sourced from the feature URN in input and is required.
  values:
    source: feature URN from input
    required: true
- term_id: description
  label: Description template
  text: 'Component description follows a template: Handles {business_capability} for
    {feature} using {layer} patterns.'
  values:
    template: Handles {business_capability} for {feature} using {layer} patterns
    example: Handles validation for choose-option using domain patterns
- term_id: structure_events
  label: Consumed and produced events
  text: Consumed events come from feature.ioSeeds.consume filtered by component role;
    produced events from feature.ioSeeds.produce filtered by capability; each capped
    at 3.
  values:
    consumes:
      source: feature.ioSeeds.consume filtered by component role
      maximum: 3
      example:
      - dilemma:presented
      - user:authenticated
    produces:
      source: feature.ioSeeds.produce filtered by component capability
      maximum: 3
      example:
      - decision:made
      - validation:completed
- term_id: structure_dependencies
  label: Dependencies
  text: Dependencies are other components in the same feature plus external dependencies.
  values:
    source: Other components in same feature + external dependencies
    example:
    - component:same:feature.other
    - wagon:external#io
examples:
  positive:
  - Component with URN, required parent feature, templated description, ≤3 consumes,
    ≤3 produces, dependencies listed
  negative:
  - A component emitted with no parent feature or with 5 produced events
