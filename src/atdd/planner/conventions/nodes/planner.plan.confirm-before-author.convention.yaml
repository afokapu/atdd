schema_version: 1.1.0
rule_id: planner.plan.confirm-before-author
kind: rule
status: active
statement: 'Nothing is authored before the operator confirms the locked decomposition.
  The Ratify gate is the conversational-to-deterministic boundary: only on ratification
  does atdd plan (the system, not the agent) invoke atdd author <kind> per locked
  unit.'
implementation:
  type: validator
  ref: test_plan_confirm_before_author::test_confirm_before_author_is_enforced
content:
  normative_text: The session machine's author pass MUST refuse to invoke any atdd
    author writer until the session is locked by the operator's ratification.
  fix_hint: 'PlanSession.author() must raise SessionGateError when self.locked is
    False, before calling any author writer. Keep the lock guard as the first
    statement of author().'
metadata:
  severity: 4
  disposition: strict
  introduced_in: 3.124.0
terms:
- term_id: confirm_boundary
  text: the point at which LLM/operator judgment ends and deterministic authoring
    begins.
- term_id: author_on_confirm
  text: on confirm, atdd plan deterministically invokes atdd author per locked unit
    (complete, atomic, idempotently replayable).
