schema_version: 1.0.0
rule_id: planner.train.interlocking-route-category-matches-train-id
kind: constraint
status: active
name: Interlocking route category matches train id
statement: Every interlocking route declares nominal/error/alternate/exception and
  its category digit must match the referenced train_id digit.
terms:
- term_id: category_digit_mapping
  text: nominal->0, error->1, alternate->2, exception->3; route.category_digit must
    equal the train_id category digit
implementation:
  type: validator
  ref: test_sequence_diagram_sanity::test_interlocking_route_category_matches_train_id
metadata:
  severity: 4
  disposition: strict
validation:
  family: coherence
  template: resolved_fact_agreement
  variant: planner_train_interlocking_route_category_matches_train_id
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: interlocking
  failure_evidence:
  - interlocking_id
  - route_id
  - category
  - expected_digit
  - actual_train_id
  - actual_digit
