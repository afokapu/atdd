schema_version: 1.0.0
rule_id: planner.train.interlocking-route-category-matches-train-id
kind: constraint
status: active
name: Interlocking route category matches train id
statement: Every interlocking route declares nominal/error/alternate/exception and
  that category must equal the `category` field of the target train it selects
  (issue #1421 — category is a validated field, not an identity digit).
terms:
- term_id: category_field_agreement
  text: route.category must equal the target train's `category` field (nominal/error/alternate/exception);
    the legacy identity digit is retired and no longer parsed
implementation:
  type: validator
  ref: test_sequence_diagram_sanity::test_interlocking_route_category_matches_train_id
metadata:
  severity: 4
  disposition: strict
validation:
  family: coherence
  template: resolved_fact_agreement
  variant: planner_train_interlocking_route_category_matches_train_id
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: interlocking
  failure_evidence:
  - interlocking_id
  - route_id
  - category
  - train_id
  - train_category
  - train_path
