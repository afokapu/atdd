schema_version: 1.1.0
rule_id: planner.feature.footprint-scoring
kind: rule
status: active
name: 'Feature: Footprint Scoring'
statement: A feature's architectural footprint is scored by summing each component's
  count times the weight of its component type, rounding up to the nearest integer,
  and mapping the total onto the XS/S/M/L/XL point brackets.
implementation:
  type: none
source:
  legacy_path: src/atdd/planner/conventions/feature.convention.yaml
  legacy_sha: sha256:4a95544261fb9541
  extraction_mode: high_fidelity
  legacy_section: footprint-scoring
content:
  summary: A component-centric, weight-based score replaces abstract screen/endpoint/table
    metrics with granular component types, so footprint correlates directly with build/test/deploy
    effort and the risk surface of persistence, async, and integration work.
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: true
  fix_hint_preserved: true
  reviewed_at: '2026-06-16'
terms:
- term_id: complexity_rubric
  label: Universal 0-3 complexity rubric
  text: Each component weight reflects a universal complexity band, from pure configuration
    (0) through simple transformation (0.5), single-responsibility business logic
    (1), complex orchestration/state/persistence (2), to very complex algorithms/integrations
    (3).
  values:
    '0': Pure configuration/declaration (routes, dtos, events, ports, styles)
    '0.5': Simple transformation/validation (serializers, mappers, validators, hooks,
      filters)
    '1': Single-responsibility with business logic (controllers, services, clients,
      views)
    '2': Complex orchestration/state/persistence (use_cases, repositories, queues,
      workflows)
    '3': Very complex algorithms/integrations (engines with ML/graph/optimization)
- term_id: backend_weights
  label: Backend component-type weight table
  text: Weights for backend component types, grouped by layer (presentation, application,
    domain, integration).
  values:
    presentation:
      controllers: 1
      routes: 0
      serializers: 0.5
      validators: 0.5
      middleware: 1
      guards: 1
      views: 1
    application:
      use_cases: 2
      handlers: 1
      ports: 0
      dtos: 0
      policies: 1
      workflows: 2
    domain:
      entities: 1
      value_objects: 0.5
      aggregates: 2
      services: 1
      specifications: 0.5
      events: 0
      exceptions: 0
    integration:
      repositories: 2
      clients: 1
      caches: 0.5
      engines: 3
      formatters: 1
      notifiers: 1
      queues: 2
      stores: 1
      mappers: 0.5
      schedulers: 2
      monitors: 1
- term_id: frontend_weights
  label: Frontend component-type weight table
  text: Weights for frontend component types, grouped by layer (presentation, application,
    domain, integration).
  values:
    presentation:
      views: 1
      components: 0.5
      containers: 1
      controllers: 2
      routes: 0
      layouts: 1
      styles: 0
      animations: 0.5
      forms: 1
      hooks: 0.5
      directives: 0.5
      filters: 0.5
    application:
      use_cases: 2
      ports: 0
      policies: 1
      dtos: 0
    domain:
      entities: 1
      value_objects: 0.5
      services: 1
      specifications: 0.5
      exceptions: 0
    integration:
      repositories: 2
      clients: 1
      stores: 1
      serializers: 0.5
      mappers: 0.5
      interceptors: 1
      caches: 0.5
      synchronizers: 2
      monitors: 1
      validators: 0.5
      workers: 2
      connectors: 1
- term_id: calculation
  label: Footprint calculation formula
  text: Footprint = sum(component.count × weight[component.urn]), rounded UP to the
    nearest integer (ceiling function).
  values:
    formula: sum(component.count × weight[component.urn])
    rounding: Round UP to nearest integer (ceiling function)
  examples:
    positive:
    - 2 controllers (2×1) + 1 repository (1×2) + 1 view (1×1) = 5 points → S bracket
    - 3 serializers (3×0.5=1.5) + 2 controllers (2×1=2) = 3.5 → ceiling(3.5) = 4 points
      → S bracket
- term_id: brackets
  label: Footprint point brackets
  text: The rounded point total maps onto brackets XS (≤5), S (6-10), M (11-15, decompose
    if necessary), L (16-25, split), XL (≥26, split).
  values:
    XS:
      max: 5
      description: ≤5 points
    S:
      max: 10
      description: 6-10 points
    M:
      max: 15
      description: 11-15 points — decompose if necessary
    L:
      max: 25
      description: 16-25 points — split
    XL:
      min: 26
      description: ≥26 points — split
- term_id: migration_alignment
  label: Alignment with retired abstract metrics
  text: This component scoring replaced the old abstract screens/endpoints/tables
    metrics; old endpoints map to controllers (1), new/old tables to repositories
    (2), screens to views (1), and async jobs to schedulers/queues/workers (2).
  values:
    from_abstract_metrics: Replaced screens/endpoints/tables with granular component
      types
    old_endpoints: 'controllers: 1'
    old_new_tables: 'repositories: 2'
    old_screens: 'views: 1'
    old_async_jobs: 'schedulers/queues/workers: 2'
