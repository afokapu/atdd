schema_version: 1.1.0
rule_id: planner.wmbt.definition
kind: family
status: draft
name: WMBT — advisory semantic anchor
statement: >-
  A WMBT (What Must Be True) is a single directional outcome statement for a wagon's job
  — it names one `object_of_control`, moved in one `direction` along exactly one
  `dimension`, at one `lens`, optionally qualified by a `context_clarifier` and placed at
  one JTBD `step`; its `statement` follows "{direction} {dimension} of {object_of_control}
  [context_clarifier]". A WMBT is not itself a test and not an acceptance criterion — it is
  made measurable only by the `acceptances` that prove it, of which at least one must be a
  SMOKE acceptance. This node is an advisory semantic anchor — it enforces nothing directly;
  the enforceable parts of this meaning are decomposed into the constraint/rule nodes that
  require it.
terms:
- term_id: semantic_anchor
  label: Advisory semantic anchor
  text: a definitional node that gives the artifact a stable meaning but is not itself
    bound to a validator; it is transitively protected by the enforceable constraint/rule
    nodes that require it.
- term_id: wmbt
  label: WMBT
  text: wmbt -> {well-shaped, single-object-of-control, single-axis, statement-formed,
    smoke-covered}.
  values:
    well-shaped: declares its `urn`, its `statement`, and the artifacts that prove the
      statement (see planner.wmbt.shape).
    single-object-of-control: scoped to exactly one object of control (see planner.wmbt.object-of-control).
    single-axis: one dimension, one direction, one lens (see planner.wmbt.dimension-selection,
      planner.wmbt.direction-selection, planner.wmbt.lens-selection, planner.wmbt.splitting-rules).
    statement-formed: follows the statement template (see planner.wmbt.statement-template).
    smoke-covered: has at least one smoke acceptance (see planner.wmbt.must-have-smoke-acceptance).
