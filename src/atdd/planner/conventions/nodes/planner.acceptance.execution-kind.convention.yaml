schema_version: 1.0.0
rule_id: planner.acceptance.execution-kind
kind: rule
status: active
source:
  legacy_path: src/atdd/planner/conventions/acceptance.convention.yaml
  legacy_sha: sha256:027e2d86ff127550
  extraction_mode: high_fidelity
statement: 'execution_kind is an orthogonal runtime-environment axis (issue #690)
  that classifies an acceptance as either hermetic_integration or live_smoke; authors
  keep selecting harness_codes/harness_types/category as before and ADD execution_kind.'
rationale: 'execution_kind is a NEW orthogonal axis introduced by issue #690. The
  existing

  harness_codes, harness_types, and category enums are unchanged — authors continue

  selecting those and add execution_kind purely as the live-infrastructure vs

  hermetic runtime classifier.

  '
notes: SMOKE remains the live-infrastructure confidence tier.
terms:
- term_id: hermetic_integration
  label: 'execution_kind: hermetic_integration'
  text: Real subject, real boundary shape, real integration sequence — NO live external
    infrastructure. Fakes (cassettes, recorded LLM responses) are permitted only with
    a declared fidelity contract.
- term_id: live_smoke
  label: 'execution_kind: live_smoke'
  text: Verification against real live infrastructure (HTTP, DB, auth, deployment).
    SMOKE remains the live-infrastructure confidence tier.
- term_id: orthogonality
  label: Orthogonal to existing enums
  text: execution_kind does not replace harness_codes, harness_types, or category;
    it is an additional orthogonal classifier added alongside them.
  values:
    issue: '#690'
    unchanged_enums:
    - harness_codes
    - harness_types
    - category
examples:
  positive:
  - 'execution_kind: hermetic_integration  # real subject, recorded http_wire cassette'
  - 'execution_kind: live_smoke  # hits real deployed endpoint'
