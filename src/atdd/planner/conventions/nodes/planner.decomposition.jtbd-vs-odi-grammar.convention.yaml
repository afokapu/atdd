schema_version: 1.0.0
rule_id: planner.decomposition.jtbd-vs-odi-grammar
kind: principle
status: active
statement: 'Keep two grammars separate: the main job uses JTBD job-statement grammar
  (verb + object + contextual clarifier); WMBTs use ODI outcome grammar (direction
  + dimension + object_of_control + context_clarifier). Collapsing job into outcome
  too early produces malformed plan/.'
terms:
- term_id: jtbd
  text: 'Jobs-To-Be-Done job statement: verb + object + contextual clarifier (e.g.
    ''Listen to music while commuting'').'
- term_id: odi
  text: "Outcome-Driven Innovation outcome: direction + dimension + object_of_control\
    \ + context_clarifier \u2014 the wmbt.schema fields."
- term_id: premature_collapse
  text: stating the main job as an outcome too early; forbidden because it yields
    malformed plan artifacts.
