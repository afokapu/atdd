schema_version: 1.1.0
rule_id: planner.theme.definition
kind: family
status: draft
name: Theme — advisory semantic anchor
statement: A theme is a canonical, single-digit (0-4) partition of the ATDD abstraction
  stack that namespaces every artifact's URN and aligns it to exactly one archetype;
  digit 0 (commons) is the mandatory, locked floor of cross-team primitives. This node
  is an advisory semantic anchor — it enforces nothing directly; the enforceable parts
  of this meaning are decomposed into the constraint/rule nodes that require it.
terms:
- term_id: semantic_anchor
  label: Advisory semantic anchor
  text: a definitional node that gives the artifact a stable meaning but is not itself
    bound to a validator; it is transitively protected by the enforceable constraint/rule
    nodes that require it.
- term_id: theme
  label: Theme
  text: theme -> {canonical, urn-namespacing, archetype-aligned, commons-floored}.
  values:
    canonical: one of the five canonical digits 0-4; 5-9 are retired (see planner.theme.canonical-taxonomy,
      planner.theme.must-be-canonical).
    urn-namespacing: the theme token prefixes the artifact URN namespace (see planner.theme.urn-namespace-matches).
    archetype-aligned: each theme maps to one archetype (see planner.theme.archetype-alignment).
    commons-floored: digit 0 is mandatory and locked to 'commons' (see planner.theme.theme-zero-mandatory,
      planner.theme.commons-coach-boundary).
