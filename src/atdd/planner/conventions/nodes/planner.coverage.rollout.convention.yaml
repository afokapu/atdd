schema_version: 1.1.0
rule_id: planner.coverage.rollout
kind: policy
status: active
name: 'Coverage: Rollout'
statement: Section 2 coverage validators are rolled out in phases; they become strict
  during the PLANNER_TESTER_ENFORCEMENT phase rather than being enforced from day
  one.
implementation:
  type: none
source:
  legacy_path: src/atdd/planner/conventions/coverage.convention.yaml
  legacy_section: rollout
  extraction_mode: high_fidelity
content:
  summary: Phasing the enforcement lets existing planner artifacts migrate into the
    coverage graph before failures become blocking. Naming the phase that flips Section
    2 validators to strict makes the rollout schedule explicit and prevents premature
    hard-failures during earlier phases.
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: true
  fix_hint_preserved: true
  reviewed_at: '2026-06-16'
terms:
- term_id: rollout_phase
  label: PLANNER_TESTER_ENFORCEMENT
  text: Section 2 validators become strict in Phase 2, identified as PLANNER_TESTER_ENFORCEMENT.
    Before this phase the Section 2 coverage rules are not enforced as blocking.
  values:
    phase: PLANNER_TESTER_ENFORCEMENT
    description: Section 2 validators become strict in Phase 2
    becomes_strict:
    - COVERAGE-PLAN-2.1
    - COVERAGE-PLAN-2.2
    - COVERAGE-PLAN-2.3
    - COVERAGE-PLAN-2.4
  examples:
    positive:
    - during PLANNER_TESTER_ENFORCEMENT a missing Wagon -> Feature reference fails
      the build because Section 2 validators are now strict
    negative:
    - treating Section 2 coverage as strict before the PLANNER_TESTER_ENFORCEMENT
      phase, blocking artifacts that are still migrating
