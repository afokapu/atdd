schema_version: 1.0.0
rule_id: planner.component.layer-assignment
kind: rule
status: active
source:
  legacy_path: src/atdd/planner/conventions/component.convention.yaml
  legacy_sha: sha256:8bfb25fd6c2bdb6e
  extraction_mode: high_fidelity
statement: A component is assigned to an architectural layer based on its artifact
  type and responsibility, using the typical-layer mapping for events, states, data,
  and configs.
rationale: A typical-layer mapping per artifact type gives the planner a default,
  defensible placement for each component so layer assignment is consistent rather
  than guessed case by case.
terms:
- term_id: events_layers
  label: Layers for event components
  text: Event publishers sit at boundaries — external integration or internal application.
  values:
    typical_layers:
    - integration
    - application
    rationale: Event publishers at boundaries (external integration or internal application)
    examples:
    - MatchStartedPublisher → backend.integration (publishes to external systems)
    - StateCommittedEmitter → backend.application (emits internal events)
- term_id: states_layers
  label: Layers for state components
  text: State trackers manage business state (domain) or coordinate it (application).
  values:
    typical_layers:
    - domain
    - application
    rationale: State trackers manage business state (domain) or coordinate (application)
    examples:
    - TimebankTracker → backend.domain (tracks core business state)
    - SessionManager → backend.application (coordinates session lifecycle)
- term_id: data_layers
  label: Layers for data components
  text: Data handlers span layers based on responsibility — domain, application, or
    integration.
  values:
    typical_layers:
    - domain
    - application
    - integration
    rationale: Data handlers span layers based on responsibility
    examples:
    - ChoiceMaker → backend.domain (business logic for making choice)
    - ChoiceHandler → backend.application (coordinates choice workflow)
    - ChoicePersister → backend.integration (persists to database)
- term_id: configs_layers
  label: Layers for config components
  text: Configuration components coordinate setup (application) or load settings (integration).
  values:
    typical_layers:
    - application
    - integration
    rationale: Configuration components coordinate setup or load settings
    examples:
    - MatchConfigurator → backend.application (coordinates match setup)
    - ConfigLoader → backend.integration (loads from external config store)
examples:
  positive:
  - A state tracker placed at backend.domain
  negative:
  - An external event publisher placed at backend.domain
