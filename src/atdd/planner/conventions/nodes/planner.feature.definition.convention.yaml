schema_version: 1.1.0
rule_id: planner.feature.definition
kind: family
status: draft
name: Feature — advisory semantic anchor
statement: A feature is the smallest independently-verifiable slice of a wagon's behavior
  — a bounded capability that declares a URN, a status, and a non-empty acceptance
  section, links to exactly one wagon, closes a feedback loop, and stays within its
  size limits. This node is an advisory semantic anchor — it enforces nothing directly;
  the enforceable parts of this meaning are decomposed into the constraint/rule nodes
  that require it.
terms:
- term_id: semantic_anchor
  label: Advisory semantic anchor
  text: a definitional node that gives the artifact a stable meaning but is not itself
    bound to a validator; it is transitively protected by the enforceable constraint/rule
    nodes that require it.
- term_id: feature
  label: Feature
  text: feature -> {well-shaped, wagon-linked, feedback-closing, size-bounded}.
  values:
    well-shaped: declares a urn, a status, and a non-empty acceptance section (see
      planner.feature.shape).
    wagon-linked: belongs to exactly one wagon (see planner.feature.wagon-link).
    feedback-closing: closes the loop it opens (see planner.feature.feedback-loop-close-the-loop).
    size-bounded: respects hard limits and the size-max rule (see planner.feature.hard-limits,
      planner.feature.size-max-rule).
