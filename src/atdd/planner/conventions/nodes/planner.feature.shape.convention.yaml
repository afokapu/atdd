schema_version: 1.0.0
rule_id: planner.feature.shape
kind: rule
status: active
source:
  legacy_path: src/atdd/planner/conventions/feature.convention.yaml
  legacy_sha: sha256:4a95544261fb9541
  extraction_mode: high_fidelity
  legacy_rule_id: planner.feature.shape
statement: Feature YAMLs declare a urn, a status, and a non-empty acceptance section,
  and must be sized S or smaller within the documented hard limits.
rationale: Requiring urn, status, and an acceptance section makes a feature a complete,
  routable unit rather than a stub. Strict S-or-smaller sizing and hard limits keep
  features tractable for AI-agent work and bound their build/test/deploy risk surface.
terms:
- term_id: feature_urn
  label: The feature URN grammar
  text: A feature is addressed by a URN following the pattern feature:{wagon}:{feature},
    kebab-case for both segments, each a verb-object phrase.
  values:
    pattern: feature:{wagon}:{feature}
    regex: ^feature:[a-z][a-z0-9-]*:[a-z][a-z0-9-]*$
  examples:
    positive:
    - feature:resolve-dilemmas:choose-option
    - feature:manage-users:authenticate-user
    negative:
    - 'feature:resolve-dilemmas  # missing feature segment'
- term_id: required_fields
  label: Required feature fields
  text: A feature YAML declares a urn, a status, and a non-empty acceptance section.
    Without all three it is a stub, not a routable feature.
  values:
    required:
    - urn
    - status
    - acceptance (non-empty)
- term_id: feature_sizing
  label: Footprint brackets and max size S
  text: Final feature size = max(WMBT-count size, footprint size). Features MUST be
    S or smaller; M/L/XL features must be split or staged before execution. Footprint
    points are summed from component weights and rounded up to the nearest integer.
  values:
    max_size: S
    overflow_action: Split or stage the feature before execution
    final_size_rule: max(wmbt_count_size, footprint_size)
    footprint_brackets:
      XS: ≤5 points
      S: 6-10 points
      M: 11-15 points — decompose if necessary
      L: 16-25 points — split
      XL: ≥26 points — split
  examples:
    positive:
    - 2 controllers + 1 repository + 1 view = 5 points → S bracket
    negative:
    - 11+ points → M bracket — must be decomposed or staged, never executed as-is
- term_id: hard_limits
  label: Per-feature hard limits (tables / async jobs / integrations)
  text: A feature may introduce at most 2 new tables, 2 async jobs, and 2 integrations.
    Features exceeding any of these hard limits MUST be split, independent of footprint
    size, because each carries disproportionate maintenance, operational, and external-dependency
    cost.
  values:
    new_tables_maximum: 2
    async_jobs_maximum: 2
    integrations_maximum: 2
- term_id: feedback_loop_kind
  label: The feedback-loop feature kind and its suppression syntax
  text: The optional kind field classifies a feature's system archetype. A value of
    feedback-loop marks a producer→consumer correction loop and triggers planner.smoke.feedback-loop-close-the-loop,
    which requires at least one SMOKE acceptance with a close_the_loop block (consumer_reacted
    + drift_resolved). The rule can be suppressed inline for docs-only features.
  values:
    field: kind
    default_when_absent: producer-only
    triggers_rule: planner.smoke.feedback-loop-close-the-loop
    requires: SMOKE acceptance with close_the_loop (consumer_reacted, drift_resolved)
  examples:
    positive:
    - 'kind: feedback-loop'
    - 'kind: feedback-loop  # atdd:suppress(planner.smoke.feedback-loop-close-the-loop)
      UNTIL=YYYY-MM-DD'
