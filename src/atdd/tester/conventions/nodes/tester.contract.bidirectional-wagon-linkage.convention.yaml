schema_version: 1.0.0
rule_id: tester.contract.bidirectional-wagon-linkage
kind: rule
status: active
name: Bidirectional contract-wagon linkage
statement: 'Contract-to-wagon linkage MUST be bidirectionally closed: a wagon''s produce[].urn
  resolves to a contract $id, and that contract''s producer references an existing
  wagon.'
terms:
- term_id: bidirectional_linkage
  text: A closed-loop traceability invariant where each wagon produce URN resolves
    to a contract and each contract producer resolves back to a real wagon.
source:
  legacy_path: src/atdd/tester/conventions/contract.convention.yaml
  legacy_section: artifact_metadata / validation.bidirectional_linkage
  legacy_rule_id: null
  extraction_mode: high_fidelity
content:
  summary: 'Every contract carries complete traceability (producer wagon, consumers,
    dependencies, wagon_ref, feature_refs) so navigation closes in both directions:
    wagon produce[].urn -> contract $id, and contract producer -> existing wagon.
    Literal regex patterns redirect to planner; the meta-validation audits directory
    is workspace.'
metadata:
  severity: 3
  disposition: documentation-only
  introduced_in: 3.137.0
