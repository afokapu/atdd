rule_id: tester.smoke.harness-subprocess-failed-crash
kind: rule
status: active
name: Harness subprocess failed crash
statement: Harness subprocess failed (crash, timeout, or schema-invalid stdout) when
  mounting the train.
terms:
- term_id: harness_subprocess_failure
  text: the train-render harness subprocess crashed, timed out, or emitted schema-invalid
    stdout while mounting the train (peer of the behavioral_render harness_error classification
    case).
source:
