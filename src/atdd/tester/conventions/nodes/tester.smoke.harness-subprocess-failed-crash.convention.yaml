content:
  normative_text: 'Train mounted but the harness subprocess failed or returned an
    unparseable result. Condition: result.error != null OR subprocess timed out OR
    stdout schema-invalid (severity 3). Per #357: errors must surface; never bare
    try/except. Classification peer of the behavioral_render harness_error case (rule_id
    TESTER-RENDER-003).'
