schema_version: 1.0.0
rule_id: tester.contract.schema-is-source-of-truth
kind: rule
status: active
name: Contract schema is the source of truth
statement: A contract schema is the authoritative source of truth and MUST carry its
  identity, semantic version, type, and complete artifact metadata (producer, consumers,
  dependencies, and traceability).
terms:
- term_id: contract_schema
  text: The authoritative schema definition of a data contract, carrying identity,
    version, type, and x-artifact-metadata.
source:
  legacy_path: src/atdd/tester/conventions/contract.convention.yaml
  legacy_section: schema_structure
  legacy_rule_id: null
  extraction_mode: high_fidelity
content:
  summary: The contract schema, not any implementation, is canonical. It must declare
    identity, a semantic version (separate field), type, and complete metadata including
    producer, consumers (possibly empty), dependencies (possibly empty), and traceability.
    The id/URN grammar regex redirects to planner; Draft-07 and .tmpl.json paths are
    workspace.
metadata:
  severity: 3
  disposition: documentation-only
  introduced_in: 3.137.0
