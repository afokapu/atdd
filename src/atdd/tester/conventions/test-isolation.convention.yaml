schema_version: "1.0.0"
convention_id: "tester.test-isolation"
name: "Test Isolation Convention"
description: |
  Structural prevention of test pollution patterns. Validates that test files
  do not contain AST-detectable patterns that mutate shared git state outside
  a tmp_path fixture scope. These patterns caused the Wave 12 contamination
  incident (2026-05-12): PRs #625 and #627 each pushed 220,000-line deletions
  because validator tests set core.bare=true on the live worktree's shared
  .git/config.

  This convention enforces structural isolation at the code level — independent
  of whether any human remembers the #619/#622 incident — so the pattern class
  cannot re-emerge undetected.

# Legacy rules-list registry consumed by bind_rule. The decomposed node form
# lives at conventions/nodes/tester.test-isolation.no-polluting-patterns.convention.yaml.
# The sole test-isolation rule was atomized into a single-node file under nodes/
# per the Phase A core-atomization slice; the registry now reads it there.
