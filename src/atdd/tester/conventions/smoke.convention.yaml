version: "1.0"
name: "Smoke Test Convention"
description: "Rules for integration/smoke tests that verify deployed system behavior against real infrastructure"

# Purpose
purpose:
  description: |
    Smoke tests fill the gap between contract-level validation (train tests) and
    production monitoring. They exercise real infrastructure: HTTP endpoints,
    databases, authentication, and state mutations.

  testing_pyramid:
    unit_tests: "RED/GREEN phase — domain logic in isolation"
    contract_tests: "Train runner — schema + sequencing via trace abstraction"
    smoke_tests: "THIS CONVENTION — real HTTP + real DB + real auth"
    monitoring: "Production observability (out of scope)"

  rationale: |
    Contract-level train tests validate artifact flow but never touch real infrastructure.
    This creates a false sense of coverage. Smoke tests catch bugs that contract tests miss:
    - Circular imports that prevent server startup
    - RLS policies that silently block writes
    - Type mismatches between schema and actual database columns

# Lifecycle Position
lifecycle:
  phase: "SMOKE"
  position: "After GREEN (tests pass), before REFACTOR (clean architecture)"
  sequence: "INIT → PLANNED → RED → GREEN → SMOKE → REFACTOR → COMPLETE"
  agent: "tester"
  trigger: "GREEN phase complete — all unit/contract tests pass"

  entry_criteria:
    - "All RED tests are GREEN (passing)"
    - "Contract-level train tests pass"
    - "Server can start without errors (no circular imports, missing deps)"

  exit_criteria:
    - "All smoke tests pass against running infrastructure"
    - "Database state mutations verified (not just response shapes)"
    - "No mock imports in smoke test files"

# Smoke Test Rules
rules:
  must:
    - "Boot or connect to a real running server"
    - "Make real HTTP calls to actual endpoints"
    - "Verify actual database state mutations (not just response shapes)"
    - "Use real authentication tokens (service role or test user)"
    - "Clean up test data after execution (teardown fixtures)"
    - "Include a database assertion after every state-mutating HTTP call"

  must_not:
    - "Use mocked repositories or in-memory fakes"
    - "Rely on train_runner trace abstraction"
    - "Skip database verification after mutations"
    - "Import unittest.mock, MagicMock, patch, or vi.fn for infrastructure"
    - "Depend on test execution order (each test is self-contained)"

# File Structure
file_structure:
  description: "Smoke tests live alongside contract-level journey tests in e2e/"

  layout:
    pattern: "e2e/{train_id}/"
    smoke_suffix: "_smoke"
    rationale: "Co-locate with contract tests; suffix distinguishes test type"

  examples:
    contract_test: "e2e/3007-matchmaking/test_3007_matchmaking_paired.py"
    smoke_test: "e2e/3007-matchmaking/test_3007_matchmaking_paired_smoke.py"

  naming:
    pattern: "test_{train_id}_{slug}_smoke.py"
    description: "Same as journey test naming with _smoke suffix"
    examples:
      - "test_3007_matchmaking_paired_smoke.py"
      - "test_0025_onboarding_full_login_smoke.py"

# Header Convention
header:
  description: "Smoke test headers extend journey test headers with Smoke: marker"

  format: |
    # URN: test:train:{train_id}:{HARNESS}-{NNN}-{slug}-smoke
    # Train: train:{train_id}
    # Phase: SMOKE
    # Layer: assembly
    # Runtime: {python|supabase}
    # Smoke: true
    # Purpose: {what is verified against real infrastructure}

  rules:
    - "Phase MUST be SMOKE (not RED/GREEN/REFACTOR)"
    - "Smoke: true marker MUST be present"
    - "Layer MUST be assembly"
    - "URN slug MUST end with -smoke"

  example:
    python: |
      # URN: test:train:3007-matchmaking:E2E-001-paired-smoke
      # Train: train:3007-matchmaking
      # Phase: SMOKE
      # Layer: assembly
      # Runtime: python
      # Smoke: true
      # Purpose: Verify matchmaking creates paired match in database via real HTTP

# Test Structure
test_structure:
  description: "Smoke tests follow Given/When/Then with real infrastructure assertions"

  pattern: |
    # GIVEN: Real server running, test user authenticated, clean state
    # WHEN: Real HTTP call to actual endpoint
    # THEN: Verify HTTP response AND database state mutation

  required_assertions:
    http_response: "Status code + response body shape"
    database_state: "Query database to verify mutation persisted"

  example:
    python: |
      def test_matchmaking_creates_paired_match(live_backend, supabase_admin):
          """Smoke: POST /matchmaking/seek creates a paired match in database."""
          # GIVEN: Two authenticated players
          player_a = create_test_player(supabase_admin)
          player_b = create_test_player(supabase_admin)

          # WHEN: Both players seek a match
          resp_a = live_backend.post("/matchmaking/seek", json={"player_id": player_a.id})
          resp_b = live_backend.post("/matchmaking/seek", json={"player_id": player_b.id})

          # THEN: HTTP response is 200
          assert resp_b.status_code == 200

          # AND: Match row exists in database with both players
          match_row = supabase_admin.table("matches").select("*").eq(
              "id", resp_b.json()["match_id"]
          ).execute()
          assert len(match_row.data) == 1
          assert set(match_row.data[0]["player_ids"]) == {player_a.id, player_b.id}

# Forbidden Patterns
forbidden_patterns:
  description: "Patterns that indicate a smoke test is not truly testing real infrastructure"

  mock_imports:
    python:
      - "from unittest.mock import"
      - "from unittest import mock"
      - "import mock"
      - "@patch("
      - "MagicMock("
    typescript:
      - "vi.fn("
      - "vi.mock("
      - "jest.fn("
      - "jest.mock("

  response_only_assertions:
    description: "Tests that only check HTTP response without verifying DB state"
    indicator: "No database query after a POST/PUT/PATCH/DELETE call"
    severity: "warning"

# Coverage Requirements
coverage:
  description: "Which trains require smoke tests"

  rule: |
    Every train that has contract-level journey tests (e2e/{train_id}/) SHOULD
    also have at least one smoke test. The validator flags trains with contract
    tests but no smoke tests as coverage gaps.

  severity: "warning"
  rationale: |
    Not all trains need smoke tests immediately. The validator surfaces gaps
    so teams can prioritize. Critical user-facing trains should be covered first.

# Fixtures
fixtures:
  description: "Recommended pytest fixtures for smoke tests"

  live_backend:
    purpose: "HTTP client connected to running server"
    provides: "Base URL + authenticated session"
    configuration: "Server URL from environment variable or config"

  supabase_admin:
    purpose: "Supabase client with service_role key for DB verification"
    provides: "Direct database access for assertion queries"
    note: "Uses service_role to bypass RLS (verification only, not the test action)"

  test_player_factory:
    purpose: "Create and clean up test users"
    provides: "Authenticated test player with cleanup on teardown"

  environment:
    required_vars:
      - "SMOKE_BACKEND_URL: Base URL of running server (e.g., http://127.0.0.1:8000)"
      - "SUPABASE_URL: Supabase project URL"
      - "SUPABASE_SERVICE_ROLE_KEY: Service role key for DB verification"

# Validation (Meta-validator)
validation:
  description: "What the ATDD smoke coverage validators check"
  validators:
    train_scoped: "src/atdd/tester/validators/test_smoke_coverage.py"
    train_route_scoped: "src/atdd/tester/validators/test_train_route_smoke_coverage.py"
    presentation_steady_state: "src/atdd/tester/validators/test_presentation_smoke_coverage.py"
    presentation_ratchet_shrink: "src/atdd/coder/validators/test_presentation_ratchet_requires_smoke.py"

  checks:
    coverage_gap:
      description: "Trains with contract tests but no smoke tests"
      severity: "warning"
      rule: "For each e2e/{train_id}/ directory with non-smoke tests, check for _smoke.py files"

    no_mock_imports:
      description: "Smoke tests must not import mocking libraries"
      severity: "error"
      rule: "Scan smoke test files for forbidden mock import patterns"

    db_assertion_present:
      description: "Smoke tests that mutate state must verify database"
      severity: "warning"
      rule: "Smoke tests with POST/PUT/PATCH/DELETE calls should include DB queries"

    header_compliance:
      description: "Smoke test headers follow convention"
      severity: "error"
      rule: "Phase: SMOKE and Smoke: true markers present in header"

    presentation_smoke_coverage:
      description: "Every web/src/*/presentation/*.tsx must have a matching e2e/*smoke*.spec.ts"
      severity: 3  # architectural per rule-id.convention.yaml severity_scale
      rule_id: "TESTER-SMOKE-PRES-001"
      rule: |
        For each presentation file under web/src/<wagon>/presentation/*.tsx,
        confirm at least one e2e/**/*smoke*.spec.ts whose path contains the
        wagon name as a kebab/snake/word-boundary token. Ratcheted via
        .atdd/baselines/tester.yaml.
      rationale: |
        Steady-state coverage (issue #293). Distinct from
        COACH-RATCHET-PRES-001 (#358), which only fires on ratchet-shrink
        events. Evidence: downstream consumer repo PRs #307, #308.

# CI Integration (issue #293)
ci_integration:
  description: |
    The validate-gate CI pipeline includes a SMOKE phase job that runs
    Playwright e2e smoke specs against a live deploy preview. The job is
    opt-in per consumer repo via a single repository secret.

  workflow_job: "validate-smoke"
  workflow_file: ".github/workflows/atdd-validate.yml"

  opt_in:
    secret_name: "SMOKE_BASE_URL"
    secret_purpose: |
      Base URL of the running consumer-repo deployment that smoke specs run
      against (e.g. a Vercel preview, a staging deploy, or a local docker URL).

  trigger_rules:
    when_secret_set: |
      validate-smoke checks out the repo, installs Playwright + Chromium,
      and runs `npx playwright test "e2e/**/*smoke*.spec.ts"` against
      $SMOKE_BASE_URL. A non-zero exit fails the validate-gate fan-in.
    when_secret_unset: |
      validate-smoke runs a single no-op step that prints a hint and exits
      success. The validate-gate result-check loop accepts both `success`
      and `skipped` for the smoke result, so the gate stays green.
    path_filter: |
      In the consumer-repo workflow generated by `atdd init`, validate-smoke
      additionally requires that web/** or e2e/** changed in the PR
      (dorny/paths-filter). The toolkit-self workflow runs it unconditionally
      because it has no web/ — the no-op skip step keeps it cheap.

  result_loop_contract: |
    `.github/workflows/atdd-validate.yml` validate-gate iterates the
    five-tuple (planner, tester, coder, coach, smoke). Adding a sixth phase
    requires updating BOTH the `needs:` list AND the bash result-check loop.

  phase_alignment: |
    Coach validator COACH-PRGATE-0003 (test_pr_phase_alignment.py) fails
    the gate when a PR touches code paths AND the linked issue is at
    atdd:GREEN — the SMOKE transition must happen before merge. Ratcheted
    via .atdd/baselines/coach.yaml. Interaction with issue #355
    (auto-phase-on-merge) is documented in #293's parent issue body.

# =============================================================================
# Behavioral Render (issue #335)
# =============================================================================
# Runtime peer to test_presentation_has_behavioral_test (#356). The
# header-level check answers "does this presentation file have a behavioral
# test?"; the section below answers "does this train actually render
# something when mounted?". Together they close the structural-vs-behavioral
# gap documented in idea-issue #318.
behavioral_render:
  description: |
    For every train in plan/_trains.yaml, mount the train through
    FrontendTrainRunner.runTrain in a headless harness and assert the
    resulting DOM is non-empty and not a stub-only render.

  validator: "src/atdd/tester/validators/test_train_renders_content.py"
  spec_id: "SPEC-TESTER-BEHAV-0001"

  harness:
    invoker_module: "src/atdd/tester/validators/test_train_renders_content.py::HarnessInvoker"
    template_dir: "src/atdd/coach/templates/harness/"
    consumer_install_dir: ".atdd/harness/"
    entrypoint: ".atdd/harness/mount-train.mjs"
    runtime: "node + @testing-library/preact + jsdom (vitest)"
    timeout_seconds: 30
    invocation: "node .atdd/harness/mount-train.mjs --train <train_id>"
    result_schema: "src/atdd/tester/schemas/train-render-harness-result.schema.json"
    metadata_schema: "contracts/frontend/train/render-metadata.schema.json"

  opt_in:
    config_path: ".atdd/config.yaml → train_renders_content"
    keys:
      enabled:
        type: boolean
        default: false
        description: |
          When false (default for repos without web/), the validator emits
          pytest.skip(). Toolkit-self repo is intentionally opted out.

  classification:
    description: "How a parsed harness result maps to canonical Violations."
    cases:
      empty_render:
        rule_id: "TESTER-RENDER-001"
        severity: 4
        condition: "result.text_length == 0 AND no expected_content match"
        detail: "Train mounted but produced an empty DOM (textLength=0)."
      stub_render:
        rule_id: "TESTER-RENDER-002"
        severity: 4
        condition: "result.stub_detected == true"
        detail: "Train mounted but the rendered DOM is loader/skeleton-only."
        related: "Conceptual peer to #334's source-AST stub detector."
      harness_error:
        rule_id: "TESTER-RENDER-003"
        severity: 3
        condition: "result.error != null OR subprocess timed out OR stdout schema-invalid"
        detail: "Harness subprocess failed or returned an unparseable result."
        related: "Per #357: errors must surface; never bare try/except."

  rules:
    - id: "tester.smoke.train-mounts-but-the"
      aliases: ["TESTER-RENDER-001"]
      severity: 4
      disposition: documentation-only
      description: "Train mounts but the rendered DOM textContent is empty (textLength == 0 with no expected_content match)."
      introduced_in: "1.64.5"
    - id: "tester.smoke.train-mounts-but-the-1"
      aliases: ["TESTER-RENDER-002"]
      severity: 4
      disposition: documentation-only
      description: "Train mounts but the rendered DOM is classified as stub-only (loader/skeleton/placeholder)."
      introduced_in: "1.64.5"
    - id: "tester.smoke.harness-subprocess-failed-crash"
      aliases: ["TESTER-RENDER-003"]
      severity: 3
      disposition: documentation-only
      description: "Harness subprocess failed (crash, timeout, or schema-invalid stdout) when mounting the train."
      introduced_in: "1.64.5"

  ratchet:
    baseline_id: "train_renders_content"
    baseline_file: ".atdd/baselines/tester.yaml"
    rationale: |
      Pre-existing empty-render trains are baselined on first run; new
      regressions must lower the count. Same pattern as
      train_route_smoke_coverage.

  failure_modes:
    harness_unavailable: "Validator skips with a clear message naming the missing template; never a silent pass."
    train_yaml_missing_metadata: "Treated as 'no expectations declared' — analyzer falls back to text_length > 0 + not stub."
    metadata_schema_invalid: "Validator emits TESTER-RENDER-003 referencing the schema path."

  cross_references:
    parent_incident: "#318 — 63/63 R283 structural tests passed while the match page rendered blank."
    sibling_runtime: "#333 — route → train edge existence (different gap)."
    sibling_static: "#334 — detect_stub_presentation_returns (source-AST peer)."
    sibling_header: "#356 — test_presentation_has_behavioral_test (URN-header peer)."
    substrate: "#340 — Violation dataclass + rule-id grammar."
    silent_swallow: "#357 — harness errors must surface."

# Cross-References
references:
  train_convention: "src/atdd/tester/conventions/train.convention.yaml"
  red_convention: "src/atdd/tester/conventions/red.convention.yaml"
  contract_convention: "src/atdd/tester/conventions/contract.convention.yaml"
  filename_convention: "src/atdd/tester/conventions/filename.convention.yaml"

# =============================================================================
# Structured rules (issue #394 — see src/atdd/coach/specs/rule-id.spec.md)
# =============================================================================
# Registry-walkable rule_ids emitted by smoke-related validators. Nested under
# a sibling key because the top-level `rules:` slot is occupied by the legacy
# must/must_not prose block above.
presentation_smoke_rules:
  rules:
    - id: "tester.smoke.pres"
      aliases: ["TESTER-SMOKE-PRES-001"]
      severity: 3
      disposition: documentation-only
      description: "Every web/src/*/presentation/*.tsx must have a sibling smoke test under e2e/*smoke*.spec.ts"
      introduced_in: "1.67.0"

# =============================================================================
# Collaborator-substitution rule (issue #704, Tier 1)
# =============================================================================
# A SMOKE test must exercise the real subject. A test that substitutes one of
# the subject's collaborators — via monkeypatch.setattr, or by assigning a
# locally-defined function/lambda over an object attribute — is a unit test
# wearing a SMOKE label: it passes CI while exercising nothing real. The lived
# incident is the observer's `obs.collect_input = _synthetic` substitution,
# which let an unwired observer ship GREEN.
#
# A static validator CANNOT certify that a test exercises real infrastructure
# (a runtime-behaviour property, undecidable from source — Rice's theorem).
# This rule does only the decidable NEGATIVE check (catch substitution); the
# positive side is the #704 Tier 2 runtime gate. Scope is Python-only; TS
# smoke tests (consumer-repo frontend e2e) are a #704 follow-up.
#
# Nested under a sibling key — the top-level `rules:` slot holds the legacy
# must/must_not prose block.
collaborator_substitution_rules:
  rules:
    - id: "tester.smoke.no-collaborator-substitution"
      severity: 4
      disposition: suppress-and-clean
      validator: "test_smoke_no_collaborator_substitution::test_smoke_tests_do_not_substitute_collaborators"
      description: "A SMOKE-phase test must not substitute a production collaborator (monkeypatch.setattr, or assigning a locally-defined function/lambda over an object attribute) — that turns it into a unit test passing CI while exercising nothing real."
      fix_hint: |
        The flagged SMOKE test replaces a collaborator instead of driving the
        real code path. Choose ONE:
          - If it was never a smoke test: relabel it — change `# Phase:` and the
            filename away from SMOKE (it is a unit/integration test, or
            hermetic_integration per #690).
          - If it should be smoke: remove the substitution and exercise the real
            boundary (real subprocess / file / socket / DB).
        Environment setup is allowed — monkeypatch.setenv / .delenv / .chdir /
        .syspath_prepend do NOT trigger this rule.
        Temporary escape: add an inline marker on the offending line:
          # atdd:suppress(tester.smoke.no-collaborator-substitution) UNTIL=<YYYY-MM-DD>
      introduced_in: "3.53.0"

# =============================================================================
# Feedback-loop systems — close-the-loop assertion required (issue #825)
# =============================================================================
# The lived incident (2026-05-21): feature:observe-and-correct:observer-runtime-
# and-rules shipped with all 4 SMOKE tests green. 3+ weeks later: 0 corrections
# delivered, 139,896 heartbeats into a dead-end channel. Every smoke asserted
# "producer wrote the artifact" without asserting "consumer received it."
#
# Root cause: the convention was written for producer-only features (success =
# artifact landed). Feedback-loop features (success = consumer reacted AND drift
# resolved next cycle) inherited that template and shipped with false-positive
# green CI.
# =============================================================================
feedback_loop:
  description: |
    A feedback-loop feature is one where success = the producer detected a
    condition, sent a signal, the consumer reacted, AND the condition is gone
    next cycle. This is distinct from producer-only features where success =
    artifact landed in a sink (DB, file, queue).

  classification:
    producer_only:
      definition: "Success = artifact persisted to a sink (e.g., POST /users → row in DB)."
      smoke_shape: "Assert HTTP response AND database state mutation."
    feedback_loop:
      definition: |
        Success = producer detected drift → sent correction → consumer received
        AND reacted → predicate no longer fires next cycle.
      smoke_shape: |
        In addition to producer assertions, the smoke MUST include:
          (a) consumer_reacted — the correction reached and was processed by the
              consumer (e.g., text arrived in the agent's pty stdin via shim inbox).
          (b) drift_resolved — re-running the producer does NOT emit a second
              correction for the same (rule_id, content-hash); the predicate has
              flipped to non-firing.

  required_assertions:
    consumer_reacted:
      description: "At least one assertion that the consumer received and processed the correction."
      valid_forms:
        - "Assert against the shim test double's pty_stdin_bytes (canonical for cli-return path)"
        - "Assert the agent's output.log contains the consumer's response to the correction"
        - "Assert per-adapter equivalent consumer-side observable"
      invalid_forms:
        - "FakeMultiplexer.send_history — records sends but never delivers them anywhere; was the exact failure mode of P001-SMOKE-001"
    drift_resolved:
      description: "At least one assertion that re-running the producer produces 0 new corrections for the same drift."
      valid_forms:
        - "Re-run scan_once() after consumer acted; assert corrections list is empty"
        - "Assert correction record count stays at 1 after a second producer cycle"

  feature_kind_marker:
    field: "kind"
    value: "feedback-loop"
    location: "feature YAML (plan/<wagon>/features/<feature>.yaml)"
    example: |
      kind: feedback-loop
    note: "Features without kind: are assumed producer-only; the validator only fires for kind: feedback-loop."

  close_the_loop_acceptance_block:
    description: |
      A SMOKE acceptance on a feedback-loop WMBT declares close_the_loop:
      with both consumer_reacted and drift_resolved fields. This is a
      first-class structured field (not string-matching) so tooling can
      enforce it unambiguously.
    schema: |
      - identity:
          urn: "acc:<wagon>:<wmbt_id>-SMOKE-NNN-close-the-loop"
          id: "AC-SMOKE-NNN"
          purpose: "Verify the feedback loop closes: consumer reacted + drift resolved"
          phase: "SMOKE"
        harness:
          type: "integration"
          category: "backend"
        close_the_loop:
          consumer_reacted: "<what the test asserts about the consumer side>"
          drift_resolved: "<what the test asserts about predicate non-firing next cycle>"
        given:
          abstract:
            - "A synthetic agent seeded with drift visible to the detection rule"
        when:
          abstract: "The observer/validator cycle runs once (detect + dispatch)"
        then:
          abstract:
            - "Correction text arrives in the consumer's input channel"
            - "Re-running the cycle produces 0 new corrections for the same drift"

  example_smoke_test: |
    # Canonical close-the-loop SMOKE shape — feedback-loop convention (issue #825)
    def test_observer_self_correcting_loop_closes(tmp_runtime, fake_shim):
        # 1. Spawn a synthetic agent under the shim with seeded drift.
        agent = fake_shim.spawn(agent_id="coder-825-test",
                                cli_stub=BashPromptStub())
        assert "bash auto-approve candidate" in agent.pty_output

        # 2. Trigger one observer cycle.
        observer.scan_once(agent_id="coder-825-test")

        # 3. CONSUMER-SIDE assertion: correction reached the agent's pty stdin.
        assert "1\n" in fake_shim.pty_stdin_bytes("coder-825-test")

        # 4. CONVERGENCE assertion: second cycle produces 0 new corrections.
        cli_return_log = read_jsonl(tmp_runtime / "agents" /
                                    "coder-825-test" / "cli-return.jsonl")
        assert len(cli_return_log) == 1
        observer.scan_once(agent_id="coder-825-test")
        assert len(cli_return_log) == 1  # still one — drift resolved

# =============================================================================
# Feedback-loop close-the-loop rule (issue #825)
# =============================================================================
feedback_loop_rules:
  rules:
    - id: "planner.smoke.feedback-loop-close-the-loop"
      severity: 3
      disposition: suppress-and-clean
      validator: "test_feedback_loop_smoke_closes_the_loop::test_every_feedback_loop_feature_has_close_the_loop_smoke"
      description: "A feature marked `kind: feedback-loop` must have at least one smoke acceptance (on any of its WMBTs) whose acceptance block contains a `close_the_loop:` field with both `consumer_reacted` and `drift_resolved` sub-fields. Producer-only smoke assertions (artifact existence, schema validation) are insufficient for feedback-loop features — they produce false-positive green CI while the consumer end of the loop is never exercised."
      introduced_in: "3.79.0"
      fix_hint: |
        The feature is marked `kind: feedback-loop` but none of its WMBT SMOKE
        acceptances declare a `close_the_loop:` block. This means CI can pass
        while the consumer end of the loop is never exercised.

        Repair:
          1. Identify the primary WMBT for this feature in plan/<wagon>/<ID>.yaml.
          2. Add (or extend) a SMOKE acceptance with a close_the_loop: block:

             - identity:
                 urn: "acc:<wagon>:<wmbt_id>-SMOKE-NNN-close-the-loop"
                 id: "AC-SMOKE-NNN"
                 purpose: "Verify feedback loop closes: consumer reacted + drift resolved"
                 phase: "SMOKE"
               harness:
                 type: "integration"
                 category: "backend"
               close_the_loop:
                 consumer_reacted: "<describe what consumer-side assertion the test makes>"
                 drift_resolved: "<describe what convergence assertion the test makes>"

          3. The corresponding test must assert:
             - The consumer received the correction (not FakeMultiplexer.send_history —
               that records sends without delivering them anywhere).
             - Re-running the producer produces 0 new corrections for the same drift.

          4. To suppress on a feature with no real infrastructure (docs-only):
             Add on the feature YAML's kind: line:
               kind: feedback-loop  # atdd:suppress(planner.smoke.feedback-loop-close-the-loop) UNTIL=YYYY-MM-DD

        See src/atdd/tester/conventions/smoke.convention.yaml::feedback_loop for
        the canonical example and the definition of valid consumer-side assertions.
        See issue #825 for the motivating incident.
