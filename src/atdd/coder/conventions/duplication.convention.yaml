version: "1.0"
convention_id: "coder.duplication"
name: "Intra-Layer Code Duplication Convention"
description: |
  Detects copy-paste duplication within the same architectural layer.
  Python: AST subtree hashing.  TypeScript: regex-based structural normalization.
  Only flags structurally identical fragments that exceed a minimum size threshold,
  within files classified to the same layer.

duplication:
  rules:
    # ------------------------------------------------------------------
    # SPEC-CODER-DUP-0001: Intra-layer structural duplication
    # ------------------------------------------------------------------
    # Rule identity for coder.duplication.no-structurally-identical-code
    # (SPEC-CODER-DUP-0001) atomized to
    # nodes/coder.duplication.no-structurally-identical-code.convention.yaml
    # (Phase A; #1225 — nodes/ is authoritative). The operational config below
    # is retained here because test_duplication_detector reads it directly.
    intra_layer_duplication:
      language: python
      detection: ast

      # Minimum number of AST statements in a fragment to consider
      min_fragment_statements: 5

      # Similarity threshold (1.0 = exact structural match only)
      similarity_threshold: 1.0

      # Layers to check (must match determine_layer_from_path output)
      layers:
        - domain
        - application
        - presentation
        - integration

      # Directories to scan (relative to repo root)
      scan_dirs:
        - "python/"
        - "src/atdd/"

      exclusions:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/conftest.py"
        - "**/__init__.py"
        - "**/__pycache__/**"
        - "**/migrations/**"
        - "**/validators/**"
        - "**/templates/**"

    # SPEC-CODER-DUP-0002 (TypeScript intra-layer structural duplication) was
    # removed in #1518. Core is stack-agnostic; the obligation is owned by
    # `coder.duplication.no-intra-layer-code-typescript` in `atdd.extension.coder`
    # (disposition: strict), which is a stronger enforcement than the
    # documentation-only declaration that stood here.

# =============================================================================
# Structured rules (issue #394 — see src/atdd/coach/specs/rule-id.spec.md)
# =============================================================================
rules:
  - id: "coder.duplication.no-intra-layer-code-python"
    validator: "test_duplication_detector::test_duplication_convention_exists"
    aliases: ["DUPLICATION-PY-001"]
    severity: 2
    disposition: strict
    description: "No intra-layer code duplication in Python sources beyond the configured threshold"
    introduced_in: "1.67.0"
