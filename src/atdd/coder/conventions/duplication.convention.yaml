version: "1.0"
convention_id: "coder.duplication"
name: "Intra-Layer Code Duplication Convention"
description: |
  Detects copy-paste duplication within the same architectural layer.
  Python: AST subtree hashing.  TypeScript: regex-based structural normalization.
  Only flags structurally identical fragments that exceed a minimum size threshold,
  within files classified to the same layer.

duplication:
  rules:
    # ------------------------------------------------------------------
    # SPEC-CODER-DUP-0001: Intra-layer structural duplication
    # ------------------------------------------------------------------
    intra_layer_duplication:
      id: "coder.duplication.no-structurally-identical-code"
      aliases: ["SPEC-CODER-DUP-0001"]
      disposition: documentation-only
      description: "No structurally identical code fragments within the same architectural layer"
      severity: warning
      language: python
      detection: ast

      # Minimum number of AST statements in a fragment to consider
      min_fragment_statements: 5

      # Similarity threshold (1.0 = exact structural match only)
      similarity_threshold: 1.0

      # Layers to check (must match determine_layer_from_path output)
      layers:
        - domain
        - application
        - presentation
        - integration

      # Directories to scan (relative to repo root)
      scan_dirs:
        - "python/"
        - "src/atdd/"

      exclusions:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/conftest.py"
        - "**/__init__.py"
        - "**/__pycache__/**"
        - "**/migrations/**"
        - "**/validators/**"
        - "**/templates/**"

    # ------------------------------------------------------------------
    # SPEC-CODER-DUP-0002: TypeScript intra-layer structural duplication
    # ------------------------------------------------------------------
    intra_layer_duplication_typescript:
      id: "coder.duplication.no-structurally-identical-typescript"
      aliases: ["SPEC-CODER-DUP-0002"]
      disposition: documentation-only
      description: "No structurally identical TypeScript fragments within the same architectural layer"
      severity: warning
      language: typescript
      detection: regex

      # Minimum number of non-trivial normalized lines in a fragment
      min_fragment_lines: 7

      # Layers to check
      layers:
        - domain
        - application
        - presentation
        - integration

      # Directories to scan
      scan_dirs:
        - "web/src/"

      exclusions:
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.spec.ts"
        - "**/*.spec.tsx"
        - "**/*.d.ts"
        - "**/node_modules/**"
        - "**/index.ts"

# =============================================================================
# Structured rules (issue #394 — see src/atdd/coach/specs/rule-id.spec.md)
# =============================================================================
rules:
  - id: "coder.duplication.no-intra-layer-code-python"
    validator: "test_duplication_detector::test_duplication_convention_exists"
    aliases: ["DUPLICATION-PY-001"]
    severity: 2
    disposition: strict
    description: "No intra-layer code duplication in Python sources beyond the configured threshold"
    introduced_in: "1.67.0"
    aliases: ["DUPLICATION-TS-001"]
    severity: 2
    disposition: strict
    description: "No intra-layer code duplication in TypeScript sources beyond the configured threshold"
    introduced_in: "1.67.0"
