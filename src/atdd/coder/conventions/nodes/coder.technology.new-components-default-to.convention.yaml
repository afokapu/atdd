rule_id: coder.technology.new-components-default-to
kind: rule
status: active
name: New components default to layer default
statement: New components default to the technology.<layer>.default for their layer;
  deviations declare an approved alternative
terms:
- term_id: layer_default
  text: technology.<layer>.default is the canonical technology a new component adopts
    for its architectural layer unless an approved alternative is declared
