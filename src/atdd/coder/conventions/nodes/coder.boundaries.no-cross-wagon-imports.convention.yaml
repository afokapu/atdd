schema_version: 1.0.0
rule_id: coder.boundaries.no-cross-wagon-imports
kind: principle
status: active
name: Wagons must not import other wagons directly
statement: A wagon MUST NOT import another wagon's modules directly; cross-wagon collaboration
  happens only through contract artifacts (cargo) or shared design-system / common
  packages. This is the canonical no-cross-wagon boundary that the per-stack detectors
  (VC-DS-06, import scans) enforce.
terms:
- term_id: cross_wagon_isolation
  text: wagon A cannot reference wagon B internals; the only legal channels between
    wagons are contract artifacts (cargo) and shared design-system or common packages
source:
