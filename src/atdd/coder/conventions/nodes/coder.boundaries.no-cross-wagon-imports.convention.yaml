content:
  summary: "Canonical no-cross-wagon-imports boundary principle (stack-neutral). Per-stack\
    \ detectors are workspace realization \u2014 the Flutter VC-DS-06 check_imports\
    \ in design.convention.yaml and the Python import scan; the design cross_wagon\
    \ and boundaries forbidden_cross_wagon_imports mirrors collapse into this single\
    \ node."
