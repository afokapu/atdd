schema_version: 1.0.0
rule_id: coder.security.xss
kind: rule
status: active
name: No innerHTML or dangerouslySetInnerHTML
statement: No innerHTML or dangerouslySetInnerHTML in frontend code (use safe DOM
  APIs)
terms:
- term_id: xss_sink
  text: innerHTML, dangerouslySetInnerHTML, and outerHTML assignments are XSS-prone
    DOM sinks that inject unsanitized markup; frontend code must use safe DOM APIs
    (textContent, createElement) or a sanitizer instead.
source:
  legacy_path: src/atdd/coder/conventions/security.convention.yaml
  legacy_section: rules
  legacy_rule_id: coder.security.xss
  extraction_mode: high_fidelity
content:
  fix_hint: Replace innerHTML/dangerouslySetInnerHTML/outerHTML assignments with safe
    DOM APIs (textContent, createElement) or a vetted sanitizer.
metadata:
