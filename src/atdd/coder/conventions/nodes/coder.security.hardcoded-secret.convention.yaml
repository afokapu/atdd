schema_version: 1.0.0
rule_id: coder.security.hardcoded-secret
kind: rule
status: active
name: No hardcoded secrets
statement: No hardcoded credentials, AWS keys, private keys, or API tokens in source
  files
terms:
- term_id: hardcoded_secret
  text: A hardcoded secret is an AWS access key, private key, password, or API token
    embedded literally in a source file rather than injected at runtime from environment
    variables or a secrets manager.
implementation:
  type: validator
  ref: test_security_patterns::test_no_raw_sql_concatenation
source:
  legacy_path: src/atdd/coder/conventions/security.convention.yaml
  legacy_section: rules
  legacy_rule_id: coder.security.hardcoded-secret
  extraction_mode: high_fidelity
content:
  fix_hint: Move the credential out of source into environment variables or a secrets
    manager, reference it at runtime, and rotate any key that was committed.
metadata:
  severity: 4
  disposition: strict
  aliases:
  - SECURITY-HARDCODED-SECRET-001
  introduced_in: 1.67.0
