schema_version: "1.0.0"
convention_id: "coder.logging"
name: "Structured Logging Convention"
description: |
  Defines logging rules for production Python code.
  Phase 1: Two enforceable rules via AST analysis.
  Phase 2 (deferred): Required field enforcement, log-level appropriateness.

rationale: |
  Production Python code must use structured logging for observability.
  The stdlib logging module with extra={} provides structured context.
  CLI tools (src/atdd/) are exempt because print() is their primary output mechanism.

scan_scope:
  LOG-001:
    include:
      - "python/"
    note: "print() check applies to consumer product code only. ATDD toolkit (src/atdd/) is a CLI tool where print() is the intentional output mechanism."
  LOG-002:
    include:
      - "python/"
      - "src/atdd/"
    note: "Structured logging check applies to both consumer code and the ATDD toolkit itself (dogfooding)."
  COACH-SILENT-SWALLOW-001:
    include:
      - "python/"
      - "src/atdd/"
      - "web/src/"
    note: "Silent swallow detection applies to consumer code, toolkit dogfooding, and frontend. Test files are excluded — they legitimately suppress exceptions for assertion patterns."
  exclude:
    - "*/tests/"
    - "*/test/"
    - "__pycache__/"
    - "__init__.py"
    - "test_*.py"
    - "*/fixtures/*"

rules:
  - id: "coder.logging.no-print-calls-in"
    aliases: ["LOG-001"]
    disposition: strict
    name: "no-print-in-production"
    description: "No print() calls in non-test production Python code"
    severity: "error"
    detection: "AST — ast.Call where func.id == 'print'"
    rationale: "Production code should use logging, not print()"
    exemptions:
      - "CLI tools (src/atdd/) — print is intentional user-facing output"
      - "Test files — print is acceptable for debug output"

  - id: "coder.logging.logger-calls-must-include"
    aliases: ["LOG-002"]
    disposition: suppress-and-clean
    name: "structured-logging-required"
    description: "Logger calls must include extra= keyword argument with context dict"
    severity: "error"
    detection: "AST — ast.Call where func.attr in {info,debug,warning,error,critical,exception,log} and no extra= kwarg"
    rationale: "Bare string logs are unstructured and not machine-parseable"
    valid_examples:
      - 'logger.info("User created", extra={"user_id": uid, "action": "create"})'
      - 'logger.error("Failed to connect", extra={"host": host, "retry": count})'
    invalid_examples:
      - 'logger.info("User created")'
      - 'logger.info("User %s created", username)'
      - 'logger.debug("Processing request")'

  - id: "coder.logging.coach-silent-swallow"
    aliases: ["COACH-SILENT-SWALLOW-001"]
    name: "no-silent-exception-swallowing"
    description: "Exception handlers must log, re-raise, or otherwise observably react — never silently return a success value"
    severity: 4
    disposition: suppress-and-clean
    detection: |
      AST (Python) / regex (TS) — try/except (or try/catch) where the handler body has:
        * NO logging call (logger.X / log.X / logging.X)
        * NO raise statement (re-raise or raise from)
        * AND returns a non-None, non-error value (or falls through to a success path)
    rationale: |
      Real incident: seek_opponent_use_case.py caught match_creator errors and returned a
      broken match_id without logging. Three backend bugs were masked for weeks. Catches
      that suppress exceptions and return success values turn loud failures into invisible
      data corruption. The fix is to require an observable reaction (log + re-raise, or
      log + structured fallback).
    valid_examples:
      - |
        try:
            match = match_creator.create(player_id)
            return match.id
        except Exception as e:
            logger.warning("match_creator failed", extra={"player_id": player_id, "error": str(e)})
            raise
      - |
        try:
            return remote_lookup(key)
        except RemoteError as e:
            logger.warning("remote lookup failed, using fallback", extra={"key": key, "error": str(e)})
            return cached_value
      - |
        try {
          return await remoteLookup(key);
        } catch (e) {
          logger.warn("remote lookup failed, using fallback", { key, error: e });
          return cachedValue;
        }
    invalid_examples:
      - |
        try:
            return match_creator.create(player_id).id
        except Exception:
            return ""
      - |
        try:
            return parse(payload)
        except Exception:
            pass
        return None
      - |
        try {
          return parse(payload);
        } catch (e) {
          return defaultValue;
        }
    exemptions:
      - "Test files (test_*.py, *.test.ts, *.spec.ts, */tests/, */test/) — assertion patterns legitimately suppress exceptions"
      - "Fixture directories (*/fixtures/*) — intentional violations for validator testing"
      - "Inline suppression: # atdd:suppress(COACH-SILENT-SWALLOW-001) on the except line"

enforcement:
  validator: "src/atdd/coder/validators/test_structured_logging.py"
  specs:
    - id: "SPEC-CODER-LOG-0001"
      description: "No print() in non-test production Python code"
      validates: "LOG-001"
    - id: "SPEC-CODER-LOG-0002"
      description: "Logger calls include extra= context"
      validates: "LOG-002"
    - id: "SPEC-CODER-SILENT-SWALLOW-0001"
      description: "Python: no try/except handlers that swallow without logging or re-raising"
      validates: "COACH-SILENT-SWALLOW-001"
      validator: "src/atdd/coder/validators/test_no_silent_exception_swallowing_python.py"
    - id: "SPEC-CODER-SILENT-SWALLOW-0002"
      description: "TypeScript: no try/catch handlers that swallow without logging or re-throwing"
      validates: "COACH-SILENT-SWALLOW-001"
      validator: "src/atdd/coder/validators/test_no_silent_exception_swallowing_typescript.py"

deferred:
  phase_2:
    - "Required context fields (wagon, phase, urn) enforcement"
    - "Log-level appropriateness analysis"
    - "Exclusion list configuration via .atdd/config.yaml"

# =============================================================================
# Structured rules (issue #394 — canonical grammar mirror)
# =============================================================================
# Top-level `rules:` array — registry-walkable. Mirrors the legacy LOG-001 /
# LOG-002 IDs above (which use string severities and pre-grammar shape).
canonical_rules:
  rules:
    - id: "coder.logging.print"
      aliases: ["LOGGING-PRINT-001"]
      severity: 2
      disposition: strict
      description: "No print() calls in non-test production Python code (use logger)"
      introduced_in: "1.67.0"
    - id: "coder.logging.structured"
      aliases: ["LOGGING-STRUCTURED-001"]
      severity: 2
      disposition: suppress-and-clean
      description: "Logger calls must include extra= keyword argument with context dict"
      introduced_in: "1.67.0"
