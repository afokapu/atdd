version: "1.0"
name: "Frontend Component Convention"
description: "Layer catalog and component suffixes for frontend implementation."

frontend:
  layers:
    presentation:
      description: "User interface components and visual elements"
      component_types:
        - name: views
          description: "Full-screen views and pages"
          suffix:
            dart: "*_page.dart, *_screen.dart"
            typescript: "*-page.tsx, *-view.tsx"
            vue: "*-view.vue"
          examples:
            - "Home page, login screen, dashboard"
            - "Product detail page, checkout flow"
            - "Settings page, profile view"

        - name: components
          description: "Reusable UI components"
          suffix:
            dart: "*_widget.dart"
            typescript: "*.tsx, *.vue"
            vue: "*.vue"
          examples:
            - "Buttons, inputs, cards, modals"
            - "Data tables, charts, forms"
            - "Navigation bars, sidebars, menus"
            - "Stateless display components"
            - "Stateful interactive components"

        - name: containers
          description: "Smart components connected to state"
          suffix:
            typescript: "*-container.tsx"
            vue: "*-container.vue"
          examples:
            - "Connected components (Redux, Vuex)"
            - "Data-fetching wrappers"
            - "State-injecting HOCs"

        - name: controllers
          description: "UI state management and business logic"
          suffix:
            dart: "*_bloc.dart, *_cubit.dart, *_controller.dart"
            typescript: "*-store.ts, *-slice.ts"
            vue: "*-store.ts"
          examples:
            - "BLoC/Cubit (Flutter)"
            - "Redux slices/reducers"
            - "Vuex modules"
            - "MobX stores"
            - "View models (MVVM)"

        - name: routes
          description: "Navigation and routing configuration"
          suffix:
            dart: "*_router.dart, *_routes.dart"
            typescript: "*-routes.ts, router.ts"
          examples:
            - "Route definitions"
            - "Navigation guards"
            - "Deep linking"
            - "Route parameters"

        - name: layouts
          description: "Page structure and composition templates"
          suffix:
            dart: "*_layout.dart"
            typescript: "*-layout.tsx"
          examples:
            - "App shell, main layout"
            - "Sidebar layout, grid layout"
            - "Responsive layouts"

        - name: styles
          description: "Design tokens, themes, and styling"
          suffix:
            dart: "*_theme.dart, *_styles.dart"
            typescript: "*.css, *.scss, *-theme.ts"
          examples:
            - "Color palettes, typography"
            - "Spacing, shadows, borders"
            - "Dark mode themes"
            - "CSS-in-JS configurations"

        - name: animations
          description: "UI animations and transitions"
          suffix:
            dart: "*_animation.dart"
            typescript: "*-animation.ts"
          examples:
            - "Page transitions"
            - "Loading animations"
            - "Gesture animations"
            - "Spring physics"

        - name: forms
          description: "Form state management and validation"
          suffix:
            dart: "*_form.dart"
            typescript: "*-form.ts, *-schema.ts"
          examples:
            - "Form builders"
            - "Validation rules (Yup, Zod, FormBuilder)"
            - "Form state (Formik, React Hook Form)"

        - name: hooks
          description: "Reusable stateful logic (React/Preact-style)"
          suffix:
            typescript: "use-*.ts, use-*.tsx"
            preact: "use-*.ts"
            dart: "use_*.dart"
          examples:
            - "useAuth, useQuery, useLocalStorage"
            - "useFetch, useDebounce, useThrottle"
            - "Custom business logic hooks"
          layer_guidance:
            presentation: "UI state hooks (useCarouselState, useModalState)"
            application: "Business logic hooks (useDilemma, useTimebank)"

        - name: directives
          description: "Custom DOM/element behaviors (Vue/Angular)"
          suffix:
            typescript: "*-directive.ts"
            vue: "v-*.ts"
          examples:
            - "v-tooltip, v-click-outside"
            - "Custom attribute directives"
            - "Structural directives"

        - name: filters
          description: "Data formatting pipes/filters"
          suffix:
            typescript: "*-filter.ts, *-pipe.ts"
            vue: "*-filter.ts"
          examples:
            - "Date formatting"
            - "Currency formatting"
            - "Text truncation"

    application:
      description: "Frontend-specific business logic and orchestration"
      component_types:
        - name: use_cases
          description: "Frontend-initiated workflows"
          suffix:
            dart: "*_use_case.dart"
            typescript: "*-use-case.ts"
          examples:
            - "Submit order flow"
            - "Load user profile"
            - "Search products"
            - "Upload file with progress"

        - name: ports
          description: "Interfaces for data access and external services"
          suffix:
            dart: "*_port.dart"
            typescript: "*-port.ts, *-interface.ts"
          allowed_layers: [domain, application]
          forbidden_layers: [integration, presentation]
          preferred_layer: domain
          examples:
            - "Repository interfaces"
            - "API client interfaces"
            - "Storage interfaces"
            - "Analytics interfaces"

        - name: policies
          description: "Frontend business policies and rules"
          suffix:
            dart: "*_policy.dart"
            typescript: "*-policy.ts"
          examples:
            - "Authorization policies"
            - "Feature flags"
            - "A/B test logic"
            - "Validation policies"

        - name: dtos
          description: "Application-internal data structures"
          suffix:
            dart: "*_dto.dart"
            typescript: "*-dto.ts"
          examples:
            - "View models (different from API DTOs)"
            - "Internal transfer objects"
            - "Aggregated UI state"

    domain:
      description: "Frontend domain types and pure logic (UI-framework agnostic)"
      component_types:
        - name: entities
          description: "Domain models used on the client"
          suffix:
            dart: "*.dart, *_entity.dart"
            typescript: "*.ts, *-entity.ts"
          examples:
            - "User, Product, Order"
            - "Domain entities mirrored from backend"
            - "Client-specific entities"

        - name: value_objects
          description: "Immutable typed values"
          suffix:
            dart: "*_vo.dart"
            typescript: "*-vo.ts, *.ts"
          examples:
            - "Email, Money, Coordinates"
            - "DateRange, Color, Dimension"

        - name: services
          description: "Pure domain logic services"
          suffix:
            dart: "*_service.dart"
            typescript: "*-service.ts"
          examples:
            - "Calculation services"
            - "Formatting services (pure functions)"
            - "Business rule evaluation"

        - name: specifications
          description: "Composable rules and predicates"
          suffix:
            dart: "*_spec.dart"
            typescript: "*-spec.ts"
          examples:
            - "Validation specifications"
            - "Filter specifications"
            - "Eligibility checks"

        - name: exceptions
          description: "Domain-level errors"
          suffix:
            dart: "*_exception.dart"
            typescript: "*-exception.ts, errors.ts"
          examples:
            - "ValidationError"
            - "BusinessRuleViolation"
            - "InvalidStateError"

    integration:
      description: "API clients, storage, and external service adapters"
      component_types:
        - name: repositories
          description: "Data access implementations"
          suffix:
            dart: "*_repository.dart"
            typescript: "*-repository.ts"
          examples:
            - "API-backed repositories"
            - "Local storage repositories"
            - "Hybrid online/offline repositories"
            - "IndexedDB repositories"

        - name: clients
          description: "HTTP/WebSocket/GraphQL API clients"
          suffix:
            dart: "*_client.dart"
            typescript: "*-client.ts, *-api.ts"
          examples:
            - "REST API clients (fetch, axios)"
            - "GraphQL clients (Apollo, urql)"
            - "WebSocket clients"
            - "gRPC-web clients"

        - name: stores
          description: "Local persistence implementations"
          suffix:
            dart: "*_store.dart"
            typescript: "*-store.ts"
          examples:
            - "LocalStorage adapters"
            - "SessionStorage adapters"
            - "IndexedDB wrappers"
            - "Secure storage (mobile)"
            - "SQLite (mobile)"

        - name: serializers
          description: "API data transformation"
          suffix:
            dart: "*_serializer.dart"
            typescript: "*-serializer.ts"
          examples:
            - "JSON serialization/deserialization"
            - "API DTO → Entity mapping"
            - "Entity → API DTO mapping"
            - "Date/time normalization"

        - name: mappers
          description: "Data transformation between layers"
          suffix:
            dart: "*_mapper.dart"
            typescript: "*-mapper.ts"
          examples:
            - "API response → Domain entity"
            - "Domain entity → View model"
            - "Form data → Request DTO"

        - name: interceptors
          description: "HTTP request/response middleware"
          suffix:
            dart: "*_interceptor.dart"
            typescript: "*-interceptor.ts"
          examples:
            - "Auth token injection"
            - "Error handling"
            - "Request/response logging"
            - "Retry logic"
            - "Cache headers"

        - name: caches
          description: "Client-side caching implementations"
          suffix:
            dart: "*_cache.dart"
            typescript: "*-cache.ts"
          examples:
            - "In-memory caches (LRU)"
            - "HTTP cache"
            - "Query result caches (React Query, SWR)"
            - "Persistent caches"

        - name: synchronizers
          description: "Offline sync and conflict resolution"
          suffix:
            dart: "*_sync.dart"
            typescript: "*-sync.ts"
          examples:
            - "Offline queue managers"
            - "Sync engines"
            - "Conflict resolution strategies"
            - "Background sync"

        - name: monitors
          description: "Client-side monitoring and telemetry"
          suffix:
            dart: "*_monitor.dart, *_tracker.dart"
            typescript: "*-monitor.ts, *-tracker.ts"
          examples:
            - "Analytics trackers (GA, Mixpanel)"
            - "Error tracking (Sentry, Bugsnag)"
            - "Performance monitoring (Web Vitals)"
            - "User session recording"

        - name: validators
          description: "Client-side validation engines"
          suffix:
            dart: "*_validator.dart"
            typescript: "*-validator.ts"
          examples:
            - "Form validators"
            - "Schema validators (Yup, Zod)"
            - "Business rule validators"

        - name: workers
          description: "Background processing and web workers"
          suffix:
            typescript: "*.worker.ts"
            dart: "*_worker.dart"
          examples:
            - "Web Workers for heavy computation"
            - "Service Workers for PWA"
            - "Background tasks"

        - name: connectors
          description: "Real-time and streaming connections"
          suffix:
            dart: "*_connector.dart"
            typescript: "*-connector.ts"
          examples:
            - "WebSocket managers"
            - "SSE (Server-Sent Events)"
            - "Firebase real-time database"
            - "SignalR connections"

  structure:
    dart:
      src_path_pattern: "lib/{wagon}/{feature}/{layer}/"
      layers: [presentation, application, domain, integration]

    flutter:
      src_path_pattern: "lib/{wagon}/{feature}/{layer}/"
      layers: [presentation, application, domain, integration]
      import_restrictions:
        domain:
          forbidden_imports: ["package:flutter", "flutter"]
          disallowed: ["package:flutter", "flutter"]
        application:
          forbidden_imports: ["package:flutter"]

    preact:
      framework: "preact + vite + typescript"
      src_path_pattern: "web/src/{wagon}/{feature}/{layer}/"
      test_path_pattern: "web/tests/{wagon}/{feature}/{layer}/"
      layers: [presentation, application, domain, integration]
      contracts:
        description: "Cross-wagon domain types and catalogs that mirror contract schemas"
        path: "web/src/commons/domain/"
        purpose: "Pure domain types/constants usable across wagons; UI extensions allowed only as additive metadata"
        allowed_content: ["types", "interfaces", "constants", "enums", "pure functions"]
        forbidden_content: ["hooks", "components", "side-effects"]
        import_rule: "Any layer in any wagon may import from web/src/commons/domain"
        traceability: "TypeScript files must include @contract {schema_id} JSDoc"
        structure:
          - "commons/domain/DomainCatalog.ts   # core contract + UI metadata"
          - "commons/domain/AttributeCatalog.ts"
          - "commons/domain/MatchContext.ts"
      file_extensions: [".ts", ".tsx"]
      layer_mapping:
        presentation: ["pages", "components", "hooks", "styles"]
        application: ["use-cases", "hooks", "ports", "context"]
        domain: ["entities", "value-objects", "services", "types", "constants", "ports"]
        integration: ["api", "repositories", "mappers", "adapters", "stores"]
      import_restrictions:
        domain:
          forbidden_imports: ["preact", "preact/hooks", "@maintain-ux", "react"]
          rationale: "Domain must be framework-agnostic - no UI imports"
        application:
          forbidden_imports: ["preact", "@maintain-ux"]
          allowed_imports: ["preact/hooks"]
          rationale: "Application orchestrates with hooks but doesn't render UI (no JSX)"
        presentation:
          forbidden_imports: ["integration layer directly"]
          allowed_imports: ["preact", "preact/hooks", "@maintain-ux", "application layer", "domain types"]
          rationale: "Presentation uses application layer, never calls APIs directly"
        integration:
          forbidden_imports: ["preact", "presentation layer"]
          allowed_imports: ["application ports", "domain types"]
          rationale: "Integration implements ports, doesn't know about UI"
      component_patterns:
        presentation_component:
          pattern: |
            import { h } from 'preact';
            import type { ComponentProps } from './types';

            export function ComponentName(props: ComponentProps) {
              return <div>{props.children}</div>;
            }
        application_hook:
          pattern: |
            import { useState } from 'preact/hooks';
            import { UseCase } from '../use-cases/UseCase';

            export function useFeature() {
              const [state, setState] = useState();
              return { state };
            }
        domain_entity:
          pattern: |
            // No framework imports allowed
            export class EntityName {
              constructor(public readonly id: string) {
                this.validate();
              }
              private validate(): void {}
            }
        integration_repository:
          pattern: |
            import type { Port } from '../../application/ports/Port';

            export class Repository implements Port {
              async method(): Promise<Result> {
                return Promise.resolve({} as Result);
              }
            }
      file_organization:
        feature_index:
          path: "src/{wagon}/{feature}/index.ts"
          purpose: "Public API - exports only what's needed"
          exports:
            - "Presentation: pages, components"
            - "Application: hooks, use cases"
            - "Domain: types, entities (read-only)"
            - "Integration: NEVER (internal only)"
        layer_index:
          path: "src/{wagon}/{feature}/{layer}/index.ts"
          purpose: "Layer-level exports for internal use"
      testing:
        framework: "vitest + @testing-library/preact"
        test_pattern: "{component}.test.tsx or {component}.test.ts"
        test_location: "web/tests/{wagon}/{feature}/{layer}/"
        harness_to_layer:
          unit: ["domain", "application"]
          widget: ["presentation"]
          integration: ["integration"]
        test_types:
          unit:
            layer: "domain, application"
            pattern: "Pure logic tests, no DOM"
          integration:
            layer: "integration"
            pattern: "API mocking, repository tests"
          component:
            layer: "presentation"
            pattern: "Component rendering, user interactions"
      design_system:
        wagon: "maintain-ux"
        special_layers: ["foundations", "primitives", "components", "templates"]
        import_aliases:
          primary: "@maintain-ux"
        exception:
          description: "maintain-ux uses flat design-system layout; traceability via URN headers"

      composition_completeness:
        convention: "composition.convention.yaml"
        value_imports_only: true
        barrel_reexports_are_edges: true
        composition_roots:
          - "presentation/*Page.tsx"
          - "presentation/*Container.tsx"

  dependency:
    # Frontend-specific dependency rules (different from backend)
    # Rationale: Frontend hooks naturally orchestrate both domain logic and integration
    # services (API clients, repositories). This is pragmatic for React/Preact ecosystems
    # where hooks serve as composition points.
    allowed_edges:
      - from: presentation
        to: [application, domain]
      - from: application
        to: [domain, integration]  # Frontend hooks CAN import integration (differs from backend)
      - from: integration
        to: [application, domain]
    forbidden_examples:
      - "domain → application (domain must be pure)"
      - "domain → integration (domain must be pure)"
      - "domain → presentation (domain must be pure)"
      - "presentation → integration (must go through application hooks)"
    note: |
      Frontend application layer (hooks/use-cases) is allowed to import from integration
      because hooks serve as natural composition points in React/Preact apps.
      This differs from backend where application layer uses ports for strict decoupling.
      Backend rule: application → domain only (use ports for integration)
      Frontend rule: application → domain, integration (pragmatic for hooks)

  http_access:
    description: "All HTTP calls must go through a centralized HttpClient"
    spec_id: "SPEC-CODER-CONTRACT-0001"
    rule:
      id: "no_raw_fetch"
      description: >
        Raw fetch() calls are forbidden in frontend TypeScript code.
        All HTTP access must use HttpClient so that contracts, interceptors,
        auth headers, and telemetry are applied uniformly.
      pattern: 'fetch\s*\('
      file_extensions: [".ts", ".tsx"]
      scan_directory: "web/src"
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
        - "*.spec.ts"
        - "*.spec.tsx"
        - "**/__tests__/**"
      whitelist_config: "contract_driven_http.whitelist"
      whitelist_example:
        - "**/HttpClient.ts"
        - "**/fetch-wrapper.ts"
      suggestion: "Use HttpClient instead of raw fetch()"
    rationale: >
      A centralized HTTP client ensures consistent error handling,
      authentication, request/response logging, retry logic, and
      contract validation across the entire frontend codebase.

  train_composition:
    description: "Frontend routes map to trains. Trains compose wagon presentations."
    composition_root: "FrontendTrainRunner"
    route_pattern: "<TrainView trainId={id} /> — not direct page components"
    wagon_registration: "Each wagon's trains.ts exports presentation components per train"
    template_resolution: "Train YAML declares template; runner resolves from the project's design system"
    auth_gating: "Train YAML declares auth_required; runner checks before composing"
    permanent_exceptions:
      criteria: "Auto-detected — pages with zero wagon imports and zero application hooks"
      detection: >
        Validator scans file imports. Zero wagon dependencies = no train possible
        = permanent exception. No manual allowlist entry needed.
    enforcement:
      page_elimination:
        spec_id: "SPEC-CODER-PAGE-0001"
        rule: "Any file in scan_dirs not in allowlist and not a permanent exception is a hard failure"
        config: ".atdd/config.yaml → page_elimination"
      god_hook_elimination:
        spec_id: "SPEC-CODER-PAGE-0003"
        rule: "Hook files exceeding max_lines (default 200) not in allowlist are a hard failure"
        config: ".atdd/config.yaml → god_hook_elimination"
      route_train_compliance:
        spec_id: "SPEC-CODER-PAGE-0004"
        rule: "New routes must use TrainView, not direct page component imports"
        config: ".atdd/config.yaml → route_train_compliance"
      route_train_wagon_coverage:
        spec_id: "SPEC-CODER-ROUTE-0005"
        rule: >
          Every <TrainView trainId="..." /> in a router file must resolve
          to a registered train in plan/_trains.yaml, and that train's
          wagons: list must reference registered wagons in plan/_wagons.yaml.
          Same-file `const X = "id"` declarations are resolved; dynamic
          expressions surface as advisory-only UNKNOWN warnings.
        config: ".atdd/config.yaml → route_train_wagon_coverage"
        validator: "src/atdd/coder/validators/test_route_train_wagon_coverage.py"
        analyzer: "src/atdd/coder/validators/route_train_wagon_analyzer.py"
        baseline: ".atdd/baselines/coder.yaml → route_train_wagon_coverage"
        rules:
          - id: "coder.frontend.trainid-not-registered-in"
            aliases: ["BOUNDARIES-ROUTE-COVERAGE-001"]
            severity: 3
            disposition: documentation-only
            description: "trainId not registered in plan/_trains.yaml (hard fail)"
          - id: "coder.frontend.resolved-train-lists-wagon"
            aliases: ["BOUNDARIES-ROUTE-COVERAGE-002"]
            severity: 3
            disposition: documentation-only
            description: "Resolved train lists wagon not in plan/_wagons.yaml (hard fail)"
          - id: "coder.frontend.trainid-expression-not-statically"
            aliases: ["BOUNDARIES-ROUTE-COVERAGE-003"]
            severity: 1
            disposition: documentation-only
            description: "trainId expression not statically resolvable (advisory; never hard-fail)"
        rationale: >
          Closes the route → train → wagon segment of the structural-vs-
          behavioral incident series tracked at #318. Sibling validators
          (#334 stub presentation; #335 train renders content) close the
          presentation-leaf and runtime-render segments.
        example_config:
          enabled: true
          router_patterns:
            - "web/src/**/router.tsx"
            - "web/src/**/App.tsx"
          allowlist:
            - path: "web/src/legacy/router.tsx"
              migration: "owner/repo#NNN"
      frontend_composition_root:
        spec_id: "SPEC-CODER-TRAIN-0001"
        rule: "The configured composition root file must exist, declare the configured class, and implement every required method"
        config: ".atdd/config.yaml → frontend_composition_root"
        example_config:
          enabled: true
          path: "web/src/application/FrontendTrainRunner.ts"
          class_name: "FrontendTrainRunner"
          required_methods:
            - "registerWagon"
            - "runTrain"
            - "resolveTemplate"
      wagon_trains_export_shape:
        spec_id: "SPEC-CODER-TRAIN-0002"
        rule: "Each wagon directory matching wagon_glob must expose a trains.ts that exports every name in required_exports"
        config: ".atdd/config.yaml → wagon_trains_export_shape"
        example_config:
          enabled: true
          wagon_glob: "web/src/wagons/*"
          required_exports:
            - "runTrainStep"
            - "HomeTrainView"
      train_yaml_render_metadata:
        spec_id: "SPEC-CODER-TRAIN-0003"
        rule: "Every train YAML matching trains_glob must conform to the JSON Schema at schema_path (declares optional template and auth_required)"
        config: ".atdd/config.yaml → train_yaml_render_metadata"
        example_config:
          enabled: true
          schema_path: "contracts/frontend/train/render-metadata.schema.json"
          trains_glob: "plan/_trains/**/*.yaml"

  ci_enforcement:
    checks:
      - name: "arch_import_rules"
        description: "Verify imports follow dependency_rules."
      - name: "suffix_placement"
        description: "Verify files live in layer matching suffix."
      - name: "no_cross_feature_imports"
        description: "Features cannot import other features' internals."
      - name: "dto_boundary"
        description: "Ensure DTOs are not imported in domain."
      - name: "test_coverage_threshold"
        description: "Min coverage for layers (configurable)."
    tools:
      - "dart import lints + custom scripts (melos/workspaces)"
    failure_policy: "block_on_violation"

  # -------------------------------------------------------------------------
  # Stub-body presentation detection (rule family PRESENTATION-NOSTUB-NNN)
  # -------------------------------------------------------------------------
  no_stub_presentation:
    description: >
      Presentation components must render visible content or be explicitly
      allowlisted with a migration reference. The validator inspects the AST
      of every functional component under presentation/ paths in scan_dirs and
      flags trivial stub-body returns. See issue #318 (jel-app AuthGateShell
      blank-render incident) for the motivating failure.
    config: ".atdd/config.yaml → no_stub_presentation"
    config_keys:
      scan_dirs: "List of TSX scan roots. Empty list / unset → validator skips."
      allowlist:
        - path: "Relative file path tracked as an explicit exemption."
          migration: "owner/repo#NNN reference to the issue that will de-stub it."
    rationale: >
      Path-based and import-based validators cannot see a presentation
      component's render body. The jel-app incident shipped
      `export const AuthGateShell = () => null;` to production with a fully
      green ATDD suite. This validator is the static-AST half of the framing
      established by parent issue #318; #356 owns the runtime/behavioral half.
    rules:
      - id: "coder.frontend.arrow-function-with-a"
        aliases: ["PRESENTATION-NOSTUB-001"]
        severity: 4
        disposition: documentation-only
        description: >
          Arrow function with a bare null/undefined expression body
          (`() => null`, `() => undefined`).
      - id: "coder.frontend.function-or-function-expression"
        aliases: ["PRESENTATION-NOSTUB-002"]
        severity: 4
        disposition: documentation-only
        description: >
          Function or function-expression block whose only return is a null
          literal, undefined, or a bare `return;`.
      - id: "coder.frontend.empty-fragment-return-or"
        aliases: ["PRESENTATION-NOSTUB-003"]
        severity: 4
        disposition: documentation-only
        description: >
          Empty fragment return (`<></>` or `<Fragment></Fragment>`) with zero
          children and zero attributes.
      - id: "coder.frontend.self-closing-or-empty"
        aliases: ["PRESENTATION-NOSTUB-004"]
        severity: 4
        disposition: documentation-only
        description: >
          Self-closing or empty element with zero children, zero static
          attributes, and zero spread expressions (e.g. `<div />`).
      - id: "coder.frontend.conditional-whose-every-branch"
        aliases: ["PRESENTATION-NOSTUB-005"]
        severity: 4
        disposition: documentation-only
        description: >
          Conditional whose every branch resolves to a stub literal
          (e.g. `flag ? null : null`).
      - id: "coder.frontend.allowlist-entry-must-include"
        aliases: ["PRESENTATION-NOSTUB-010"]
        severity: 2
        disposition: documentation-only
        description: >
          Allowlist entry must include a `migration:` field referencing the
          issue that will eliminate the exemption.
      - id: "coder.frontend.negative-rule-a-guarded"
        aliases: ["PRESENTATION-NOSTUB-020"]
        severity: 4
        disposition: documentation-only
        description: >
          Negative rule. A guarded null return paired with a sibling JSX
          return path (e.g. `if (loading) return null; return <Foo/>;`) is
          NOT a stub and MUST NOT be flagged.


