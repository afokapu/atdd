schema_version: "1.0.0"
convention_id: "coder.performance"
name: "Performance Convention"
description: |
  Static analysis rules for detecting common performance anti-patterns
  in application code, starting with N+1 query detection.

rationale: |
  N+1 query patterns are a common cause of performance degradation.
  They occur when code executes one query per item in a loop instead
  of batching. Static AST analysis catches these at development time.

cross_references:
  architectural_rules:
    - file: "backend.convention.yaml"
      section: "integration.repositories"
      note: "Repository pattern should expose batch methods to avoid N+1"
    - file: "boundaries.convention.yaml"
      section: "namespacing"
      note: "Qualified imports help trace which calls are DB-bound"

performance:
  # Phase A (#1225) partial de-monolith: the core-agnostic rule
  #   coder.performance.perf → nodes/coder.performance.perf.convention.yaml
  # has been atomized to a single-node file (now authoritative; bind_rule /
  # build_registry read nodes/). The `validators:`, `excluded_paths`, and
  # `future_rules` metadata below are intentionally LEFT in place — they are
  # not rule declarations and remain the operator-facing record for this
  # convention. No other rules live in this monolith, so the `rules:` block
  # is now empty.
  rules: []

  validators:
    # Decommissioned under #1207 batch B — legacy persona validator removed;
    # reverse-coherence binding carried by the sizing convention-variant, runtime
    # enforcement by the bound python-pytest detector (binding.lock.yaml).
    - location: "src/atdd/validators/conventions/sizing/test_query_count_nplus1.py"
      test: "test_query_count_nplus1_variant_contract"
      spec_id: "SPEC-CODER-PERF-0001"
      marker: "coder"

  excluded_paths:
    - "test/"
    - "tests/"
    - "__pycache__/"
    - "migrations/"

  future_rules:
    - id: "PERF-002"
      name: "No synchronous I/O in async functions"
      status: "planned"
    - id: "PERF-003"
      name: "No unbounded result sets"
      status: "planned"
