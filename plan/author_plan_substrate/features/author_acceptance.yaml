urn: "feature:author-plan-substrate:author-acceptance"
wagon: "wagon:author-plan-substrate"
description: "Authoring of an acceptance as an in-place append into an existing WMBT file's acceptances[] (identity/harness/given/when/then), written idempotently so re-adding the same acceptance urn is a no-op. Rejects a missing target WMBT, a duplicate acceptance urn, or a malformed phase/harness."
sizing:
  wmbts: 2
  footprint_score: 5
  footprint_size: "S"
wmbts:
  - "wmbt:author-plan-substrate:E005"
  - "wmbt:author-plan-substrate:C006"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "atdd author acceptance subcommand"
    application:
      - type: "use_cases"
        count: 2
        rationale: "create_acceptance() in-place append; validate_acceptance() guard"
    domain:
      - type: "value_objects"
        count: 2
        rationale: "AcceptanceBlock (identity/harness/given/when/then); AcceptanceTarget (existing wmbt file + acceptances[])"
    integration:
      - type: "adapters"
        count: 1
        rationale: "in-place wmbt-file acceptances[] append adapter (idempotent on urn)"
