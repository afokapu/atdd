urn: "feature:author-plan-substrate:author-train"
wagon: "wagon:author-plan-substrate"
description: "Authoring of a train: registry-class dedup-insert into plan/_trains.yaml plus a per-train file at plan/_trains/<id>.yaml, written with stable-sort + atomic write so concurrent inserts stay deterministic. Rejects a malformed train_id, a duplicate entry, or a per-train file outside plan/_trains/."
sizing:
  wmbts: 2
  footprint_score: 6
  footprint_size: "S"
wmbts:
  - "wmbt:author-plan-substrate:E004"
  - "wmbt:author-plan-substrate:C005"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "atdd author train subcommand"
    application:
      - type: "use_cases"
        count: 2
        rationale: "create_train() registry dedup-insert + per-train write; validate_train() guard"
    domain:
      - type: "value_objects"
        count: 2
        rationale: "TrainEntry (train_id, path, wagons); TrainHome (plan/_trains.yaml + plan/_trains/<id>.yaml)"
    integration:
      - type: "adapters"
        count: 1
        rationale: "_trains.yaml dedup-insert + stable-sort + atomic write adapter"
