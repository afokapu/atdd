urn: "wmbt:author-plan-substrate:E001"
step: "execute"
direction: "maximize"
dimension: "likelihood"
object_of_control: "wagon-manifest-creation"
context_clarifier: "when authoring a wagon, the writer must create a single schema-valid manifest at plan/<slug>/_<slug>.yaml (dir snake_case, file _<dirname>.yaml) with the required header fields and the schema-required produce/consume name/contract/telemetry keys"
lens: "functional.effectiveness"
statement: "maximize likelihood of schema-valid wagon-manifest-creation when authoring a wagon under its canonical plan/<slug>/_<slug>.yaml home"
acceptances:
  - identity:
      urn: "acc:author-plan-substrate:E001-UNIT-001-canonical-home-and-schema"
      id: "AC-UNIT-001"
      purpose: "create_wagon writes one manifest at plan/<slug>/_<slug>.yaml that validates against the wagon schema"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A valid wagon input (slug, description, subject, the 1:1 header fields) and a temp plan/ home"
    when:
      abstract: "create_wagon(input) is called"
    then:
      abstract:
        - "Exactly one file is written at plan/<slug_snake>/_<slug_snake>.yaml"
        - "The written manifest validates against wagon.schema.json"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
  - identity:
      urn: "acc:author-plan-substrate:E001-SMOKE-001-cli-creates-valid-wagon"
      id: "AC-SMOKE-001"
      purpose: "Verify `atdd author wagon` writes a schema-valid manifest at the canonical home in a real checkout"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A real repo checkout and the installed atdd author CLI"
    when:
      abstract: "atdd author wagon --slug <slug> ... is run"
    then:
      abstract:
        - "A manifest appears at plan/<slug_snake>/_<slug_snake>.yaml"
        - "atdd validate planner accepts the created wagon without manual fixups"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
