urn: "wmbt:author-plan-substrate:E002"
step: "execute"
direction: "maximize"
dimension: "likelihood"
object_of_control: "feature-creation"
context_clarifier: "when authoring a feature, the writer must create a single schema-valid file at plan/<slug>/features/<name>.yaml carrying urn, wagon, description, sizing, wmbts[], and components"
lens: "functional.effectiveness"
statement: "maximize likelihood of schema-valid feature-creation when authoring a feature under plan/<slug>/features/<name>.yaml"
acceptances:
  - identity:
      urn: "acc:author-plan-substrate:E002-UNIT-001-canonical-home-and-schema"
      id: "AC-UNIT-001"
      purpose: "create_feature writes one file at plan/<slug>/features/<name>.yaml that validates against the feature schema"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A valid feature input (urn, wagon, description, sizing, wmbts) and a temp plan/ home"
    when:
      abstract: "create_feature(input) is called"
    then:
      abstract:
        - "Exactly one file is written at plan/<slug>/features/<name>.yaml"
        - "The written feature validates against the feature schema"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
  - identity:
      urn: "acc:author-plan-substrate:E002-SMOKE-001-cli-creates-valid-feature"
      id: "AC-SMOKE-001"
      purpose: "Verify `atdd author feature` writes a schema-valid file at the canonical home in a real checkout"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A real repo checkout and the installed atdd author CLI"
    when:
      abstract: "atdd author feature --wagon <slug> --name <name> ... is run"
    then:
      abstract:
        - "A file appears at plan/<slug>/features/<name>.yaml"
        - "atdd validate planner accepts the created feature without manual fixups"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
