urn: "wmbt:author-plan-substrate:E005"
step: "execute"
direction: "maximize"
dimension: "likelihood"
object_of_control: "acceptance-append"
context_clarifier: "when adding an acceptance, the writer must append a schema-valid block into an existing WMBT file's acceptances[] idempotently so re-adding the same acceptance urn is a no-op"
lens: "functional.effectiveness"
statement: "maximize likelihood of schema-valid acceptance-append when adding an acceptance into an existing WMBT file's acceptances[]"
acceptances:
  - identity:
      urn: "acc:author-plan-substrate:E005-UNIT-001-idempotent-append"
      id: "AC-UNIT-001"
      purpose: "create_acceptance appends a valid block to an existing WMBT and re-adding the same urn is a no-op"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An existing WMBT file and a valid acceptance block (identity/harness/given/when/then)"
    when:
      abstract: "create_acceptance(target_wmbt, block) is called twice with the same urn"
    then:
      abstract:
        - "The first call appends the block under acceptances[]"
        - "The second call is a no-op (the file is byte-for-byte unchanged)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
  - identity:
      urn: "acc:author-plan-substrate:E005-SMOKE-001-cli-appends-acceptance"
      id: "AC-SMOKE-001"
      purpose: "Verify `atdd author acceptance` appends a schema-valid block to an existing WMBT in a real checkout"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A real repo checkout, the installed atdd author CLI, and an existing WMBT file"
    when:
      abstract: "atdd author acceptance --wmbt <urn> ... is run"
    then:
      abstract:
        - "The target WMBT gains the acceptance under acceptances[]"
        - "atdd validate planner accepts the modified WMBT without manual fixups"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
