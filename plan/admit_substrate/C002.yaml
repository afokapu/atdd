urn: "wmbt:admit-substrate:C002"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "ambiguous-alias-resolution"
context_clarifier: "aliases are a UX convenience; canonical ids are authoritative. `atdd add <alias>` may proceed only when the alias resolves to exactly one canonical artifact across configured registries; if two or more entries share the alias the resolver must refuse and print the candidate canonical ids so the operator re-runs with an unambiguous id, never silently picking one"
lens: "functional.effectiveness"
statement: "minimize likelihood of ambiguous-alias-resolution by requiring a unique alias→canonical-id match and refusing with the candidate list when two or more artifacts share the alias"
acceptances:
  - identity:
      urn: "acc:admit-substrate:C002-UNIT-001-ambiguous-alias-refusal"
      id: "AC-UNIT-001"
      purpose: "a unique alias resolves to its canonical id; an alias shared by two entries is refused with both candidates listed; an unknown alias is refused as not-found"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fixture registry where one alias maps to a single canonical id and another alias is shared by two distinct canonical ids"
    when:
      abstract: "the resolver resolves the unique alias, the shared alias, and an unknown alias"
    then:
      abstract:
        - "the unique alias resolves to exactly one canonical id"
        - "the shared alias is refused and the error names both candidate canonical ids"
        - "the unknown alias is refused as not found"
        - "a canonical id is always accepted directly, bypassing alias ambiguity"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
  - identity:
      urn: "acc:admit-substrate:C002-SMOKE-001-ambiguous-add-refused"
      id: "AC-SMOKE-001"
      purpose: "`atdd add <ambiguous-alias>` as a subprocess exits non-zero, prints candidates, and installs nothing"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A temp project with a configured registry containing two entries sharing one alias"
    when:
      abstract: "`atdd add <ambiguous-alias>` is invoked as a subprocess"
    then:
      abstract:
        - "the command exits non-zero and prints the candidate canonical ids"
        - "no artifact is installed and the lockfile is unchanged"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
