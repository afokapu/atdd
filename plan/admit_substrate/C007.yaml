urn: "wmbt:admit-substrate:C007"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "undetected-substrate-staleness"
context_clarifier: "`atdd substrate add` vendors a copy and records the version; nothing pulls afterwards and nothing reports that a registry has moved past it, so a consumer enforces an old contract indefinitely — core sat on train-interlocking-enforcement 0.1.0 while the hub had split it by persona and migrated off category_digit, and each re-pin since happened because a human noticed. `atdd substrate list` must compare the locked version against the registry's published latest_version and say which packages are behind, WITHOUT applying anything: a version bump upstream changes enforced behaviour, so auto-applying would break a consumer's CI from someone else's push with nothing in the diff to explain it. A registry that is configured but cannot be read must report COULD_NOT_CHECK, never silence and never 'up to date' — an unestablished verdict is indistinguishable from a clean one, which is the failure this repo hit three times in one day"
lens: "functional.effectiveness"
statement: "minimize likelihood of undetected-substrate-staleness by comparing each locked version against the registry's published latest_version in `atdd substrate list`, reporting which packages are behind without applying anything, and reporting COULD_NOT_CHECK when a configured registry cannot be read"
acceptances:
  - identity:
      urn: "acc:admit-substrate:C007-UNIT-001-staleness-reports-never-applies"
      id: "AC-UNIT-001"
      purpose: "the staleness comparison reports a package behind its registry, keeps 'could not read' distinct from 'nothing published', and never applies an upgrade"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An installed artifact set, and registry entries that variously publish a newer version, publish the same version, publish nothing for that id, publish no latest_version, or could not be read at all"
    when:
      abstract: "the staleness comparison is evaluated over them"
    then:
      abstract:
        - "a newer published version reports the package as behind, naming both versions"
        - "a matching version reports it as current"
        - "a registry that could not be read reports COULD_NOT_CHECK, never 'up to date'"
        - "an empty registry and an unreadable one are different verdicts"
        - "an entry publishing no latest_version reports COULD_NOT_CHECK"
        - "an id no registry publishes reports NOT_APPLICABLE"
        - "being behind does not block; an unestablished verdict does"
        - "nothing is installed, removed, or written by the comparison"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-09-09"
  - identity:
      urn: "acc:admit-substrate:C007-UNIT-002-list-reports-staleness-and-unreadable"
      id: "AC-UNIT-002"
      purpose: "`atdd substrate list` marks stale packages and names the remedy, stays silent when nothing is owed, and reports COULD_NOT_CHECK for a configured-but-unreadable registry"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A repo with an admitted package and, in turn: a registry publishing a newer version, a registry publishing the same version, a configured registry whose index is absent, and no registry at all"
    when:
      abstract: "`atdd substrate list` renders the substrate"
    then:
      abstract:
        - "a stale package is marked with the published version and the report names `atdd substrate add`"
        - "a current package adds no staleness output"
        - "a configured but unreadable registry reports COULD_NOT_CHECK and states it is not 'up to date'"
        - "a repo with no registry configured produces no staleness output at all"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-09-09"
  - identity:
      urn: "acc:admit-substrate:C007-SMOKE-001-list-cli-reports-staleness"
      id: "AC-SMOKE-001"
      purpose: "`atdd substrate list` as a subprocess names a package the registry has moved past, and refuses to render a configured-but-unreadable registry as a clean substrate"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A temp project with one admitted package and a path registry that in turn publishes a newer version, and then cannot be read at all"
    when:
      abstract: "`atdd substrate list` is invoked as a subprocess against each"
    then:
      abstract:
        - "against a registry publishing a newer version the call exits zero and names both the locked and the published version"
        - "the same output names `atdd substrate add` as the remedy, so the report is actionable"
        - "against a configured registry whose index is absent the call reports COULD_NOT_CHECK and states the substrate is not up to date"
        - "neither call writes the lockfile: staleness is reported, never applied"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-09-09"
