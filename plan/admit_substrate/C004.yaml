urn: "wmbt:admit-substrate:C004"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "depended-on-artifact-breakage"
context_clarifier: "`atdd remove` withdraws an artifact from intent and lock, but it must not silently strand a dependent: if another admitted artifact depends on the target (e.g. an extension depends_on a workspace being removed) removal is refused unless `--force`; shared workspaces are left installed unless `--prune` is passed, so removing one extension does not delete a workspace another still needs"
lens: "functional.effectiveness"
statement: "minimize likelihood of depended-on-artifact-breakage by refusing removal when another admitted artifact depends on the target (unless --force) and pruning shared workspaces only when --prune is passed"
acceptances:
  - identity:
      urn: "acc:admit-substrate:C004-UNIT-001-remove-dependency-refusal"
      id: "AC-UNIT-001"
      purpose: "removing a depended-on artifact is refused; --force overrides; a leaf artifact removes cleanly; a shared workspace stays unless --prune"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A locked substrate where an extension depends on a workspace, plus a second independent (leaf) extension"
    when:
      abstract: "remove is run on: the depended-on workspace (no flag), the same workspace with --force, the leaf extension, and the extension with --prune of its workspace"
    then:
      abstract:
        - "removing the depended-on workspace without a flag is refused and names the dependent"
        - "removing it with --force succeeds and updates intent + lock"
        - "removing the leaf extension succeeds and leaves its shared workspace installed"
        - "removing the extension with --prune also removes the workspace only when no other artifact depends on it"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
  - identity:
      urn: "acc:admit-substrate:C004-UNIT-002-remove-prune-uninstalls"
      id: "AC-UNIT-002"
      purpose: "an uninstall actually uninstalls: --prune deletes the installed package directory, removal unbinds the package's rules, and removing an absent package is a truthful no-op rather than a false success"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A real bound substrate: a workspace provider and two extensions installed on disk, each owning a convention, with a binding plan composed from the lock"
    when:
      abstract: "remove --prune is run on one extension, and then run a second time on the same (now absent) extension"
    then:
      abstract:
        - "the extension's installed directory is deleted from disk"
        - "the extension's rules are dropped from binding.lock.yaml"
        - "the other extension's rules stay bound and its shared workspace stays installed"
        - "removing the already-absent extension reports that nothing was removed and does not claim a false success"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-14"
  - identity:
      urn: "acc:admit-substrate:C004-UNIT-003-binding-substrate-coherence"
      id: "AC-UNIT-003"
      purpose: "the coherence invariant: no rule bound in binding.lock.yaml may reference a package absent from substrate.lock.yaml, so the two locks can never contradict each other"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A real bound substrate whose binding plan was composed from the substrate lock"
    when:
      abstract: "an extension is removed, and separately the last extension is removed together with its now-unused workspace under --prune"
    then:
      abstract:
        - "every rule still bound in binding.lock.yaml names an owning package that substrate.lock.yaml lists as installed"
        - "every rule still bound names a workspace that substrate.lock.yaml lists as installed"
        - "no rule survives that is attributable to no installed package"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-14"
  - identity:
      urn: "acc:admit-substrate:C004-SMOKE-001-remove-cli"
      id: "AC-SMOKE-001"
      purpose: "`atdd remove <alias>` as a subprocess refuses on a dependent and succeeds on a leaf, updating the lockfile"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A temp project with a locked substrate: an extension depending on a workspace, plus a leaf extension"
    when:
      abstract: "`atdd remove <workspace>` then `atdd remove <leaf-extension>` are invoked as subprocesses"
    then:
      abstract:
        - "removing the depended-on workspace exits non-zero and leaves the lock unchanged"
        - "removing the leaf extension exits zero and drops its entry from substrate.lock.yaml"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-18"
  - identity:
      urn: "acc:admit-substrate:C004-SMOKE-002-remove-prune-leaves-substrate-coherent"
      id: "AC-SMOKE-002"
      purpose: "`atdd substrate remove <id> --prune` as a subprocess leaves the substrate coherent, and never prints `removed` for work it did not do"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A temp project with a real bound substrate: a workspace provider and two installed extensions, with a composed binding plan"
    when:
      abstract: "`atdd substrate remove <extension> --prune` is invoked as a subprocess, then invoked a second time on the same now-absent extension"
    then:
      abstract:
        - "the first call exits zero, deletes the installed directory, and drops the extension from both substrate.lock.yaml and binding.lock.yaml"
        - "the surviving extension's rules remain bound and `atdd substrate bind` still succeeds"
        - "the second call exits zero and states that nothing was removed, rather than printing a false `removed`"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-14"
