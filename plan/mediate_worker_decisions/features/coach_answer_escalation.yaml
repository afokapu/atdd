urn: "feature:mediate-worker-decisions:coach-answer-escalation"
wagon: "wagon:mediate-worker-decisions"
description: "The operational escalation-recovery path (Track A, no engine): atdd coach answer <request_id> <verb> is the operator's direct reply command — it resolves the operator's input to the EXACT question_options[].label (rejecting a mismatch/partial loudly, never trusting cmux's silent delivered:true), then delivers via the existing feed_reply_mapper + CmuxFeedTransport — permission → feed.permission.reply {request_id, mode: once|deny}, question → feed.question.reply {request_id, selections:[label]}. atdd coach status surfaces the daemon's unanswered escalations (request_id + prompt/options) from coach-runtime/<ws>/escalations.jsonl and omits answered ones, so the operator knows what to answer. Reuses the bridge-cmux-feed reply mapper/transport and coach-runtime escalation read wholesale; adds only the operator command, an exact-label resolver, and the unanswered-escalation surfacing read. Under #1034 this operational logic later migrates onto the resolve-escalation engine wagon (C3a-3)."
sizing:
  wmbts: 3
  footprint_score: 5
  footprint_size: "S"
wmbts:
  - "wmbt:mediate-worker-decisions:E014"
  - "wmbt:mediate-worker-decisions:C009"
  - "wmbt:mediate-worker-decisions:L008"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "coach_answer_cli: atdd coach answer <request_id> <verb> dispatch plus the unanswered-escalation surfacing branch of atdd coach status (routed from the atdd coach subcommand)"
    application:
      - type: "use_cases"
        count: 1
        rationale: "answer_escalation: look up the pending item, resolve the operator input to the exact label, deliver via feed reply, exactly once; and list_unanswered_escalations for status"
      - type: "ports"
        count: 1
        rationale: "reuses the bridge-cmux-feed FeedSource (list_pending for label lookup) + FeedReply (deliver) and the coach-runtime EscalationReader (status) protocols — no new protocol introduced"
    domain:
      - type: "services"
        count: 1
        rationale: "label_resolver: pure exact-match of an operator input against question_options[].label, loudly rejecting a mismatch or partial/prefix (never a silent no-op)"
    integration:
      - type: "clients"
        count: 0
        rationale: "reuses the existing CmuxFeedSource (list_pending), CmuxFeedTransport (feed.*.reply), and jsonl escalation reader — no new integration client"
