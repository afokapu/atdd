urn: "feature:mediate-worker-decisions:sense-decision"
wagon: "wagon:mediate-worker-decisions"
description: "Turns a cmux notification (or emit-CLI call) into a normalized commons:decision:request: resolve surface->worker, read the worker surface, extract the prompt. Both entry paths share one sink."
sizing:
  wmbts: 3
  footprint_score: 9
  footprint_size: "S"
wmbts:
  - "wmbt:mediate-worker-decisions:D001"
  - "wmbt:mediate-worker-decisions:L001"
  - "wmbt:mediate-worker-decisions:C001"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "emit_cli (atdd decision emit) feeds the RequestSink (the deprecated screen-scrape notify_hook was removed in 3.90.0)"
    application:
      - type: "use_cases"
        count: 1
        rationale: "sense_decision_use_case: resolve worker -> read surface -> parse prompt -> emit request"
      - type: "ports"
        count: 3
        rationale: "SurfaceReader, WorkerRegistry, RequestSink protocols"
    domain:
      - type: "services"
        count: 1
        rationale: "prompt_parser: pure terminal-text -> DecisionRequest | None"
      - type: "value_objects"
        count: 2
        rationale: "DecisionRequest (frozen), SurfaceId/WorkerHandle"
    integration:
      - type: "clients"
        count: 0
        rationale: "the screen-scrape adapters (cmux_surface_reader, registry_worker_lookup) were removed in 3.90.0; the sense use case is now driven via injected ports (the cmux Feed path supplies its own SurfaceReader/WorkerRegistry mapping)"
      - type: "stores"
        count: 0
        rationale: "the screen-scrape jsonl_request_sink was removed in 3.90.0; the RequestSink port is supplied by callers"
