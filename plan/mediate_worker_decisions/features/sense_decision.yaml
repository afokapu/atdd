urn: "feature:mediate-worker-decisions:sense-decision"
wagon: "wagon:mediate-worker-decisions"
description: "Turns a cmux notification (or emit-CLI call) into a normalized commons:decision:request: resolve surface->worker, read the worker surface, extract the prompt. Both entry paths share one sink."
sizing:
  wmbts: 3
  footprint_score: 9
  footprint_size: "S"
wmbts:
  - "wmbt:mediate-worker-decisions:D001"
  - "wmbt:mediate-worker-decisions:L001"
  - "wmbt:mediate-worker-decisions:C001"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 2
        rationale: "notify_hook (cmux notification hook, JSON on stdin) and emit_cli (atdd decision emit) — both feed the same RequestSink"
    application:
      - type: "use_cases"
        count: 1
        rationale: "sense_decision_use_case: resolve worker -> read surface -> parse prompt -> emit request"
      - type: "ports"
        count: 3
        rationale: "SurfaceReader, WorkerRegistry, RequestSink protocols"
    domain:
      - type: "services"
        count: 1
        rationale: "prompt_parser: pure terminal-text -> DecisionRequest | None"
      - type: "value_objects"
        count: 2
        rationale: "DecisionRequest (frozen), SurfaceId/WorkerHandle"
    integration:
      - type: "clients"
        count: 2
        rationale: "cmux_surface_reader (wraps CmuxBackend.capture_pane_text), registry_worker_lookup"
      - type: "stores"
        count: 1
        rationale: "jsonl_request_sink writes the commons:decision:request line"
