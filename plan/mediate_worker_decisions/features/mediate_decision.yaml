urn: "feature:mediate-worker-decisions:mediate-decision"
wagon: "wagon:mediate-worker-decisions"
description: "Decides a commons:decision:request: a pure safety gate runs FIRST (dangerous->human_required), otherwise the coach surface is asked and its reply parsed. Emits a verdict or an escalation."
sizing:
  wmbts: 6
  footprint_score: 9
  footprint_size: "S"
wmbts:
  - "wmbt:mediate-worker-decisions:P001"
  - "wmbt:mediate-worker-decisions:C002"
  - "wmbt:mediate-worker-decisions:E001"
  - "wmbt:mediate-worker-decisions:M001"
  - "wmbt:mediate-worker-decisions:Y001"
  - "wmbt:mediate-worker-decisions:C008"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "mediate_cli: consume a request line, emit a verdict or escalation line"
    application:
      - type: "use_cases"
        count: 1
        rationale: "mediate_use_case: safety gate first, then coach dialogue, then parse -> verdict | escalation"
      - type: "ports"
        count: 4
        rationale: "CoachClient, Clock (timeout), VerdictSink, EscalationSink protocols"
    domain:
      - type: "services"
        count: 2
        rationale: "safety_classifier (request -> SafetyClass) and coach_reply_parser (text -> Verdict | ParseError) — both pure"
      - type: "specifications"
        count: 1
        rationale: "danger_rules: pure danger-pattern matcher (git push/merge, rm -rf, destructive migration)"
      - type: "value_objects"
        count: 1
        rationale: "Verdict / Escalation (frozen)"
    integration:
      - type: "clients"
        count: 0
        rationale: "the screen-scrape cmux_coach_client (and SystemClock) were removed in 3.90.0; the cmux Feed path supplies its own CoachClient (bridge_cmux_feed.integration.claude_coach.ClaudeCoach). build_mediate_use_case takes the coach + clock via injection"
      - type: "stores"
        count: 0
        rationale: "the screen-scrape jsonl_verdict_sink / jsonl_escalation_sink were removed in 3.90.0; the VerdictSink / EscalationSink ports are supplied by callers"
