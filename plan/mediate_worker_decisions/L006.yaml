urn: "wmbt:mediate-worker-decisions:L006"
step: "locate"
direction: "maximize"
dimension: "likelihood"
object_of_control: "the-next-unhandled-escalation-past-the-persisted-cursor-in-the-daemons-escalations-ledger"
context_clarifier: "atdd coach wait (alias next) blocks until the next coach-needed escalation appears in the daemon's escalations.jsonl, prints exactly that one record as a single JSON line, advances a persisted read cursor, and exits so a chat-session coach runs it as a completing command in a loop; the cursor is durable so a handled escalation is never re-emitted across invocations; the next-after-cursor selection is a pure function tested directly"
lens: "functional.effectiveness"
statement: "maximize likelihood of the next unhandled escalation past the persisted cursor in the daemons escalations ledger"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:L006-UNIT-001-pure-next-after-cursor"
      id: "AC-UNIT-001"
      purpose: "The pure cursor core returns the first record after the persisted offset with the advanced offset, and none at end-of-ledger"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An in-memory append-only ledger of escalation records and a persisted line offset"
    when:
      abstract: "The pure next-after-cursor function is called at, before, and at the end of the ledger"
      action: "invoke"
    then:
      abstract:
        - "Before the end it returns the first record past the offset and an offset advanced by one"
        - "At the end of the ledger it returns no record and leaves the offset unchanged"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
  - identity:
      urn: "acc:mediate-worker-decisions:L006-UNIT-002-wait-emits-one-advances-cursor-no-reemit"
      id: "AC-UNIT-002"
      purpose: "wait returns the next appended record, persists the advanced cursor, and a subsequent wait does not re-emit it"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An escalations ledger and a file-backed cursor store under a tmp dir"
        - "An injected sleeper and stop so the poll loop does not block the test"
    when:
      abstract: "wait is invoked, then a new escalation is appended and wait is invoked again twice"
      action: "invoke"
    then:
      abstract:
        - "The first appended record is emitted once and the persisted cursor advances by one"
        - "The next wait emits the following record (or none) and never re-emits the handled one"
      assertions:
        - type: "equals"
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
  - identity:
      urn: "acc:mediate-worker-decisions:L006-SMOKE-001-live-wait-emits-induced-escalation"
      id: "AC-SMOKE-001"
      purpose: "After inducing a real escalation, atdd coach wait emits exactly that escalation record then exits"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A managed daemon started on a real worker workspace and an induced escalation (worker_stuck or a dangerous decision)"
    when:
      abstract: "atdd coach wait is invoked"
      action: "invoke"
    then:
      abstract:
        - "Exactly the induced escalation record is printed as one JSON line and the command exits"
      assertions:
        - type: "exists"
    close_the_loop:
      consumer_reacted: "the chat-session coach receives the escalation record on stdout and the command completes"
      drift_resolved: "a subsequent atdd coach wait does not re-emit the handled escalation (cursor advanced)"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
