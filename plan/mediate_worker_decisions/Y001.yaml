urn: "wmbt:mediate-worker-decisions:Y001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-12-03
step: "modify"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-verdict-referencing-an-option-absent-from-the-request"
context_clarifier: "when the coach selects an option id that is not one of the request's prompt.options, the bridge must reject it (escalate cause coach_unparseable) rather than apply an invalid selection"
lens: "functional.effectiveness"
statement: "minimize likelihood of a verdict referencing an option absent from the request"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:Y001-UNIT-001-option-must-be-in-set"
      id: "AC-UNIT-001"
      purpose: "A selected option id within the request is accepted; an out-of-set id is rejected toward escalation"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A request whose options are 1 and 2"
        - "A coach verdict selecting 1, and another selecting 9"
    when:
      abstract: "The verdict's selected option is validated against the request"
      action: "invoke"
    then:
      abstract:
        - "Selecting 1 is accepted"
        - "Selecting 9 is rejected (escalate cause coach_unparseable) — not applied"
      assertions:
        - type: "equals"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "mediate-decision"
