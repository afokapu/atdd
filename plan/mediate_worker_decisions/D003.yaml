urn: "wmbt:mediate-worker-decisions:D003"
step: "deliver"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-per-workspace-daemon-acting-on-another-workspaces-decisions-because-the-feed-read-is-not-scoped-to-its-workspace"
context_clarifier: "the autonomous feed_daemon takes --workspace, but CmuxFeedSource.list_pending shells `cmux rpc feed.list '{}'` with empty params (global) — cmux ignores any workspace/cwd/workstream filter param (verified live: the count is identical with and without a filter), so EVERY per-workspace daemon sees EVERY worker's decisions. In the first live multi-worker demo two daemons (workspace:97, workspace:98) both decided the SAME AskUserQuestion and verdicts.jsonl held two auto_apply verdicts with the SAME request_id. The source must map each global Feed item to a workspace and return ONLY the configured workspace's items. A Feed item carries workstream_id (`claude-<session-uuid>`) and cwd but NOT a workspace id; the workspace's identity (its session/workstream + worktree cwd) is read from `cmux rpc surface.list --workspace <ws>` (resume_binding.checkpoint_id is the claude session uuid; requested_working_directory is the cwd). Primary match is the precise workstream_id; cwd is the fallback when an item's workstream cannot be resolved. cmux specifics stay inside the integration tier; the membership predicate is a pure domain value object."
lens: "functional.correctness"
statement: "minimize likelihood of a per-workspace daemon acting on another workspace's decisions because the feed read is not scoped to its workspace"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:D003-UNIT-001-scope-returns-only-own-workspace-items"
      id: "AC-UNIT-001"
      purpose: "A WorkspaceScope built from the configured workspace's workstream identity keeps only items whose workstream_id matches and excludes every other workspace's items"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A WorkspaceScope holding the configured workspace's workstream_id(s)"
        - "A mixed list of FeedItems: some carrying the configured workstream_id, others carrying a sibling workspace's workstream_id"
    when:
      abstract: "The scope filters the mixed list"
      action: "invoke"
    then:
      abstract:
        - "Only items whose workstream_id is in the configured set are returned"
        - "Items carrying a sibling workspace's workstream_id are excluded"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:D003-UNIT-002-cwd-fallback-when-workstream-unknown"
      id: "AC-UNIT-002"
      purpose: "When an item carries no resolvable workstream_id, the scope falls back to the workspace's cwd; an item whose cwd belongs to a sibling worktree is still excluded"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A WorkspaceScope holding the configured workspace's cwd and workstream_id(s)"
        - "An item with no workstream_id but the configured cwd, and an item with a sibling worktree cwd"
    when:
      abstract: "The scope filters the items"
      action: "invoke"
    then:
      abstract:
        - "The workstream-less item with the configured cwd is kept (cwd fallback)"
        - "The item with a sibling worktree cwd is excluded"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:D003-INTEGRATION-001-source-scopes-via-surface-list"
      id: "AC-INTEGRATION-001"
      purpose: "CmuxFeedSource constructed with a workspace_id resolves that workspace's identity from cmux surface.list and returns only its items; constructed without a workspace_id it returns the global pending set (back-compat)"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A fake cmux runner whose feed.list returns a mixed global pending set across two workspaces and whose surface.list returns the configured workspace's surface (its checkpoint_id + cwd)"
    when:
      abstract: "list_pending is called on a workspace-scoped source and on an unscoped source"
      action: "invoke"
    then:
      abstract:
        - "The scoped source returns only the configured workspace's pending decisions"
        - "The unscoped source returns the full global pending set (no surface.list call)"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:D003-SMOKE-001-live-two-workers-no-cross-decide"
      id: "AC-SMOKE-001"
      purpose: "Two real cmux-native workers in two workspaces each raise a distinct decision; a workspace-scoped consumer for each sees ONLY its own worker's decision — no cross-decide, no duplicate request_id across the two"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "Two real Claude workers launched cmux-native in two distinct workspaces, each blocked on a distinct live AskUserQuestion"
    when:
      abstract: "A workspace-scoped CmuxFeedSource is built for each workspace and polled"
      action: "invoke"
    then:
      abstract:
        - "Each scoped source returns its own worker's pending decision and not the other's"
        - "The two scoped result sets share no request_id (no cross-decide), captured as evidence"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
