urn: "wmbt:mediate-worker-decisions:L002"
step: "locate"
direction: "maximize"
dimension: "likelihood"
object_of_control: "locating-a-blocked-agent-decision-in-the-cmux-feed"
context_clarifier: "when a real agent (Claude Code/Codex) pipes a PermissionRequest, AskUserQuestion, or ExitPlanMode into the cmux Feed and blocks on it, the bridge must locate that pending item (via feed.list / feed events) and map it to a commons:decision:request"
lens: "functional.effectiveness"
statement: "maximize likelihood of locating a blocked agent decision in the cmux feed"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:L002-UNIT-001-maps-feed-item-to-request"
      id: "AC-UNIT-001"
      purpose: "A pending feed item (question/permission/exitPlan) maps to a DecisionRequest with request_id, question, and options"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A pending feed question item with request_id, question_prompt, and question_options [opt0,opt1]"
        - "A pending feed permission item with a tool_name and tool_input command"
    when:
      abstract: "The feed-item mapper maps each item"
      action: "invoke"
    then:
      abstract:
        - "The question item yields a request whose options carry the option ids/labels and whose worker carries the request_id"
        - "The permission item yields a request whose prompt exposes the tool_input for the safety gate"
      assertions:
        - type: "equals"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:L002-SMOKE-001-locates-live-blocked-agent"
      id: "AC-SMOKE-001"
      purpose: "A real agent's live blocked decision is located from the cmux Feed and mapped to a request"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real Claude worker that has called AskUserQuestion and is blocked pending in the Feed"
    when:
      abstract: "The feed event source reads the pending item"
      action: "invoke"
    then:
      abstract:
        - "A request is produced carrying the live request_id and the agent's options"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
