urn: "wmbt:mediate-worker-decisions:E011"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "the-autonomous-decider-deciding-without-the-coach-convention-and-operating-protocol-loaded"
context_clarifier: "when the autonomous decider (LlmCoach over claude -p, the per-decision call the feed_daemon uses for unattended runs) answers a blocked worker it must decide AS A COACH — the coach convention + operating protocol (the canonical ATDD phase machine) resolved from the repo is carried into the provider CLI as an appended system prompt, so the decision is made with the same architectural context a supervised coach session would carry, instead of a blank claude -p with no conventions and no context; the seam is provider-pluggable so the same context flows to any provider, and the rule-based dangerous-action safety gate still escalates BEFORE the decider is ever consulted"
lens: "functional.effectiveness"
statement: "minimize likelihood of the autonomous decider deciding without the coach convention and operating protocol loaded"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:E011-UNIT-001-decider-carries-coach-convention"
      id: "AC-UNIT-001"
      purpose: "The decider's claude -p invocation carries the coach convention / operating protocol text in its CLI args (the convention content reaches the args), so the autonomous decider decides as a coach rather than a blank LLM"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An LlmCoach over the real claude provider CLI with subprocess.run captured, deciding a single-question request, the coach convention resolved from the repo"
    when:
      abstract: "The decider mediates the request"
      action: "invoke"
    then:
      abstract:
        - "The captured claude argv carries the appended-system-prompt flag and the coach convention / operating-protocol text"
      assertions:
        - type: "contains"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:E011-UNIT-002-provider-seam-carries-same-context"
      id: "AC-UNIT-002"
      purpose: "The provider-pluggable seam passes the SAME coach context to an alternate (non-claude) provider's CLI, so loading the convention is not claude-specific"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An LlmCoach bound to an alternate provider whose CLI records the system context it is handed, with a known coach context injected"
    when:
      abstract: "The decider mediates the request"
      action: "invoke"
    then:
      abstract:
        - "The alternate provider CLI received the same coach context the seam carries to claude"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:E011-UNIT-003-safety-gate-unchanged-decider-not-consulted"
      id: "AC-UNIT-003"
      purpose: "The rule-based dangerous-action safety gate still escalates a dangerous decision BEFORE the convention-loaded decider is consulted — loading the convention does not weaken the gate"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The feed runner wired with an LlmCoach whose provider CLI records every call, given a dangerous permission item"
    when:
      abstract: "The runner handles the dangerous item"
      action: "invoke"
    then:
      abstract:
        - "An escalation is produced and the decider's provider CLI was never invoked"
      assertions:
        - type: "exists"
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:E011-SMOKE-001-live-decides-with-convention-loaded"
      id: "AC-SMOKE-001"
      purpose: "A live daemon decides a real blocked worker's benign question while the coach convention is loaded into the decider call — a verdict is produced AND the convention was present in the decider invocation"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A live cmux workspace with a real blocked claude worker on a benign question and the real daemon whose LlmCoach carries the repo coach convention"
    when:
      abstract: "The daemon decides the worker's question over one tick"
      action: "invoke"
    then:
      abstract:
        - "A verdict is produced for the worker AND the coach convention text was present in the decider's claude -p invocation"
      assertions:
        - type: "exists"
        - type: "contains"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
