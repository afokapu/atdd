urn: "wmbt:mediate-worker-decisions:E013"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-dispatch-spawned-worker-whose-blocking-decisions-never-reach-the-feed"
context_clarifier: >-
  Live 2026-06-09 (`atdd coach 1012`): a dispatch-spawned worker's `atdd gate`
  Bash permission appeared as a TUI prompt and `cmux rpc feed.list` was EMPTY — the
  wrapper's PermissionRequest->'cmux hooks feed' hook never fired. Root cause: the
  dispatch spawns via `new_surface_in_pane` (`cmux new-surface --pane <coach's
  focused pane>` then `cmux send "cd <wt> && <claude ...>\n"`), so the worker is a
  surface in the COACH's workspace started by pasting shell text — it is NOT the
  agent foreground process of its own workspace, which is what the cmux wrapper
  recognises to inject the hook. The proven-publishing path
  (surface_worker_decisions live_smoke + the coach_runtime daemon launcher) uses
  the SAME Bash-free `claude-code` adapter command but launches it as `cmux
  new-workspace --command <agent>` — fresh CMUX_SURFACE_ID, foreground claude, hook
  fires, decision publishes. The fix routes the dispatch fresh-spawn through the
  own-workspace foreground launch so its decisions reach the Feed, and probes the
  hook path at dispatch time so a launch that still would not publish refuses
  loudly (promoting the L004 warn to a dispatch-time gate) instead of hanging
  unmediated. Subsequent phases keep the existing in-place respawn (#730) within
  that workspace; danger classification stays in the daemon (not duplicated here).
lens: "functional.availability"
statement: >-
  minimize likelihood of a dispatch spawned worker whose blocking decisions never
  reach the feed
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:E013-UNIT-001-fresh-spawn-launches-own-workspace-foreground"
      id: "AC-UNIT-001"
      purpose: >-
        A fresh dispatch worker spawn launches the worker as the agent foreground
        process of its OWN cmux workspace (the proven-publishing launch shape),
        not a shell-text paste into the coach's existing pane
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A recording multiplexer backend capturing every cmux invocation"
        - "A fresh worker spawn (no pre-existing issue surface) with a Bash-free agent command"
    when:
      abstract: "The dispatch creates the worker surface for the fresh spawn"
      action: "invoke"
    then:
      abstract:
        - "The recorded launch creates the worker's OWN workspace with the agent command as its foreground (new-workspace --command shape), not a new-surface-in-pane plus a send-paste"
        - "The agent foreground command is the Bash-free claude-code adapter command"
      assertions:
        - type: "equals"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "surface-worker-decisions"
  - identity:
      urn: "acc:mediate-worker-decisions:E013-UNIT-002-dispatch-refuses-when-hook-path-inactive"
      id: "AC-UNIT-002"
      purpose: >-
        When the cmux Feed-publishing hook path is inactive at dispatch time, the
        dispatch worker spawn refuses loudly (raises) rather than spawning a
        silently non-publishing, unmediated worker
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A dispatch worker spawn wired with a HookPresenceProbe reporting the hook path inactive"
    when:
      abstract: "The dispatch attempts to spawn the worker"
      action: "invoke"
    then:
      abstract:
        - "The spawn refuses with a loud error naming the inactive hook precondition"
        - "No worker surface is created while the hook path is inactive"
      assertions:
        - type: "raises"
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "surface-worker-decisions"
  - identity:
      urn: "acc:mediate-worker-decisions:E013-SMOKE-001-dispatch-worker-decision-publishes-to-feed"
      id: "AC-SMOKE-001"
      purpose: >-
        A worker spawned by the REAL dispatch path raises a blocking decision that
        appears in cmux feed.list — proving the Feed-publishing hook path is live
        for the dispatch spawn (the producer half the closed #967 missed)
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A worker spawned through the real dispatch worker-spawn path under a live cmux + claude install"
    when:
      abstract: "The worker reaches a gated Bash decision (e.g. atdd gate)"
      action: "invoke"
    then:
      abstract:
        - "A pending Bash permission item for the worker appears in cmux rpc feed.list (it publishes, it does not surface only to the TUI)"
      assertions:
        - type: "exists"
    close_the_loop:
      consumer_reacted: "the blocked item is visible to a workspace-scoped feed poll, so the daemon can mediate it"
      drift_resolved: "the dispatch-spawned worker's decision rides the Feed, not the TUI"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "surface-worker-decisions"
