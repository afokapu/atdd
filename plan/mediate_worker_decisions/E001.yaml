urn: "wmbt:mediate-worker-decisions:E001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-12-03
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "misparsing-the-coach-reply-into-a-wrong-verdict"
context_clarifier: "when the coach replies on its surface with a DECISION: <option> / REASON: <text> block that must be parsed into a verdict, and a malformed reply must not be guessed into a verdict"
lens: "functional.correctness"
statement: "minimize likelihood of misparsing the coach reply — a well-formed DECISION:/REASON: yields a verdict, a malformed reply yields a ParseError, never a guessed verdict"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:E001-UNIT-001-parse-or-error"
      id: "AC-UNIT-001"
      purpose: "A DECISION:/REASON: reply parses to a verdict; a malformed reply raises ParseError rather than guessing"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A reply 'DECISION: 1\\nREASON: looks safe'"
        - "A malformed reply with no DECISION line"
    when:
      abstract: "The coach reply parser parses each reply"
      action: "invoke"
    then:
      abstract:
        - "The first yields a verdict selecting option 1 with the reason"
        - "The second raises ParseError — no verdict is guessed"
      assertions:
        - type: "equals"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "mediate-decision"
