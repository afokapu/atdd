urn: "wmbt:mediate-worker-decisions:C009"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-wrong-or-partial-option-being-delivered-as-a-silent-delivered-true-no-op-instead-of-loudly-rejected-before-any-cmux-reply"
context_clarifier: "cmux's feed.question.reply returns delivered:true silently even when the selections label does not match any real question_options[].label — the footgun that stalled a worker this session (the worker stays parked while the operator believes the answer landed). atdd coach answer must resolve the operator's input to the EXACT question_options[].label and reject a mismatch or partial/prefix match LOUDLY (raise / non-zero exit, no cmux reply sent) BEFORE calling feed.question.reply — never trusting cmux's silent delivered:true. The valid set of labels comes from the pending feed item (CmuxFeedSource.list_pending)."
lens: "functional.effectiveness"
statement: "minimize likelihood of a wrong or partial option being delivered as a silent delivered true no op instead of loudly rejected before any cmux reply"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:C009-UNIT-001-non-matching-label-rejected-loudly-no-reply"
      id: "AC-UNIT-001"
      purpose: "An operator input that matches no question_options[].label is rejected loudly and no cmux feed reply is built or sent"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A pending question item whose options are ['Blue', 'Large']"
        - "An operator answer naming 'Green' (no such option)"
    when:
      abstract: "atdd coach answer resolves the input against the item's options"
      action: "invoke"
    then:
      abstract:
        - "Resolution raises / fails loudly (non-zero), naming the invalid input and the valid options"
        - "No feed.question.reply is built and no reply is delivered"
      assertions:
        - type: "raises"
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-answer-escalation"
  - identity:
      urn: "acc:mediate-worker-decisions:C009-UNIT-002-partial-prefix-label-rejected-not-silently-accepted"
      id: "AC-UNIT-002"
      purpose: "A partial / prefix substring of a real option is rejected, not silently accepted as an exact match"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A pending question item whose options include 'Large' and 'Larger'"
        - "An operator answer naming the partial string 'Larg'"
    when:
      abstract: "atdd coach answer resolves the input against the item's options"
      action: "invoke"
    then:
      abstract:
        - "The partial string resolves to no option and is rejected loudly"
        - "No reply is delivered for an inexact match"
      assertions:
        - type: "raises"
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-answer-escalation"
  - identity:
      urn: "acc:mediate-worker-decisions:C009-SMOKE-001-live-wrong-label-rejected-no-feed-reply"
      id: "AC-SMOKE-001"
      purpose: "Against a live worker parked on a real AskUserQuestion, atdd coach answer with a wrong label is rejected loudly and no cmux reply is sent (the exact bug from this session)"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real cmux worker blocked on a live AskUserQuestion with known option labels"
    when:
      abstract: "The operator runs atdd coach answer with a label that does not exactly match any option"
      action: "invoke"
    then:
      abstract:
        - "The command exits loudly with an error naming the invalid input and the valid options"
        - "No feed reply is delivered (no false delivered:true) and the worker remains parked, awaiting a correct answer"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-answer-escalation"
