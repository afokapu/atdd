urn: "wmbt:mediate-worker-decisions:E005"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "duplicate-answers-to-the-same-request-id-across-ticks-and-restarts"
context_clarifier: "the daemon tracks answered request_ids in an in-memory AnsweredSet seeded at startup from the durable verdicts.jsonl and escalations.jsonl ledgers, so the same request_id is never answered or escalated twice — within a run or across a process restart (the coach is never re-paid for an item already handled)"
lens: "functional.availability"
statement: "minimize quantity of duplicate answers to the same request id across ticks and restarts"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:E005-UNIT-001-second-tick-skips-answered"
      id: "AC-UNIT-001"
      purpose: "An item present in two consecutive ticks is answered exactly once — the coach and transport are not re-invoked on the second tick"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fake source returning the same blocked item on tick 1 and tick 2"
        - "A fake coach and fake transport that count their calls"
    when:
      abstract: "The daemon runs two consecutive ticks"
      action: "invoke"
    then:
      abstract:
        - "The coach is consulted exactly once and the transport reply verb is called exactly once"
      assertions:
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
  - identity:
      urn: "acc:mediate-worker-decisions:E005-SMOKE-001-live-restart-no-double-answer"
      id: "AC-SMOKE-001"
      purpose: "A real daemon restarted against the same durable ledgers re-answers nothing for an already-handled live item"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real blocked item already answered and recorded in the durable ledgers"
    when:
      abstract: "A freshly started daemon runs one poll tick after re-hydrating from the ledgers"
      action: "invoke"
    then:
      abstract:
        - "No new reply is sent and no new ledger line is written for that request_id"
      assertions:
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
  - identity:
      urn: "acc:mediate-worker-decisions:E005-INTEGRATION-001-rehydrate-across-restart"
      id: "AC-INTEGRATION-001"
      purpose: "A daemon restarted against the same durable ledgers re-hydrates its answered-set and re-answers/re-escalates nothing"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A first daemon (tmp verdicts.jsonl + escalations.jsonl) answers one safe item and escalates one dangerous item"
        - "A second daemon built from the same two ledger paths and the same two items"
    when:
      abstract: "The second daemon runs a tick after re-hydrating its answered-set from the ledgers"
      action: "invoke"
    then:
      abstract:
        - "The second daemon's coach and transport are never called and no new ledger lines are written"
      assertions:
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
