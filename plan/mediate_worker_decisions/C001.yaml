urn: "wmbt:mediate-worker-decisions:C001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-12-03
step: "confirm"
direction: "minimize"
dimension: "quantity"
object_of_control: "false-decision-requests-emitted-from-non-decision-worker-output"
context_clarifier: "when the worker surface shows ordinary output, a progress bar, an empty buffer, or a half-rendered prompt that is not yet a real decision"
lens: "functional.correctness"
statement: "minimize quantity of false decision-requests emitted from worker output that is not a genuine, fully-rendered decision prompt"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:C001-UNIT-001-no-false-positive"
      id: "AC-UNIT-001"
      purpose: "Non-decision text (empty, progress, or partially-rendered prompt) yields no request"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "Surface text is empty, a progress bar, or a prompt missing its options"
    when:
      abstract: "The prompt parser parses the surface text"
      action: "invoke"
    then:
      abstract:
        - "It returns None for each — no decision request is produced"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "sense-decision"
