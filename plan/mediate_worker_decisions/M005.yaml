urn: "wmbt:mediate-worker-decisions:M005"
step: "monitor"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-managed-daemons-cmux-rpc-calls-failing-silently-because-the-detached-spawn-inherited-stale-cmux-client-context-env"
context_clarifier: "atdd coach start spawns the workspace-scoped feed_daemon DETACHED via daemon_manager; the detached child inherits the coach session's stale cmux CLIENT-CONTEXT env (CMUX_PANEL_ID, an empty CMUX_SOCKET, CMUX_SURFACE_ID, CMUX_AGENT_*), so its cmux rpc calls fail with a broken-pipe write error and commons.cmux_cli.run_cmux SWALLOWS the failure (returns '' ignoring returncode+stderr) — the daemon then sees an empty Feed every poll and silently never decides. The spawn must hand the daemon an env with the stale per-surface/panel/socket cmux identity SCRUBBED (keep PATH and CMUX_BUNDLED_CLI_PATH so cmux still finds its own bundled CLI + default socket) so its rpc reaches the cmux server cleanly; and run_cmux must STOP swallowing a non-zero cmux exit — loud-log it and raise a typed CmuxCommandError so a broken Feed connection is visible in daemon.log rather than masquerading as an empty Feed, with the daemon loop staying alive across the failure"
lens: "functional.availability"
statement: "minimize likelihood of a managed daemons cmux rpc calls failing silently because the detached spawn inherited stale cmux client context env"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:M005-UNIT-001-run-cmux-raises-and-loud-logs-on-nonzero-exit-not-swallowed"
      id: "AC-UNIT-001"
      purpose: "run_cmux surfaces a non-zero cmux exit — loud-logs and raises a typed CmuxCommandError carrying the argv/returncode/stderr — instead of returning '' and masquerading as empty output (the broken-pipe swallow that hid #1007 for three rounds)"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A stubbed subprocess.run returning a CompletedProcess with returncode=1, empty stdout, and a broken-pipe stderr"
        - "A captured logger on the cmux_cli module"
    when:
      abstract: "run_cmux is invoked for a cmux rpc subcommand"
      action: "invoke"
    then:
      abstract:
        - "run_cmux raises CmuxCommandError (it does NOT return '') and the error carries the returncode and stderr"
        - "A WARNING-or-higher record naming the cmux failure is emitted on the cmux_cli logger"
      assertions:
        - type: "raises"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
  - identity:
      urn: "acc:mediate-worker-decisions:M005-UNIT-002-spawn-env-scrubs-stale-cmux-client-context-vars"
      id: "AC-UNIT-002"
      purpose: "SubprocessDaemonSpawner.spawn hands Popen an explicit env with the stale cmux client-context vars (CMUX_PANEL_ID/CMUX_SOCKET/CMUX_SURFACE_ID/CMUX_AGENT_*) scrubbed, while preserving PATH and CMUX_BUNDLED_CLI_PATH — so the detached daemon's cmux rpc reaches the server cleanly instead of impersonating the coach's dead surface/socket"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A SubprocessDaemonSpawner and a stubbed Popen capturing the env kwarg"
        - "A process environment carrying stale CMUX_PANEL_ID, an empty CMUX_SOCKET, CMUX_SURFACE_ID, a CMUX_AGENT_ID, alongside PATH and CMUX_BUNDLED_CLI_PATH"
    when:
      abstract: "spawn is invoked with a no-op argv and a durable log_path"
      action: "invoke"
    then:
      abstract:
        - "Popen receives an explicit env mapping (not None) that contains NO CMUX_PANEL_ID/CMUX_SOCKET/CMUX_SURFACE_ID/CMUX_AGENT_ key"
        - "The env still contains PATH and CMUX_BUNDLED_CLI_PATH unchanged"
      assertions:
        - type: "equals"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
  - identity:
      urn: "acc:mediate-worker-decisions:M005-SMOKE-001-real-coach-start-managed-daemon-writes-a-verdict"
      id: "AC-SMOKE-001"
      purpose: "The headline gate every prior round missed: started through the REAL `atdd coach start --workspace <ws>` detached daemon_manager spawn (NOT the loop directly, NOT feed_daemon_cli foreground) against a live worker blocked on a real AskUserQuestion, the managed daemon's verdicts.jsonl GAINS A LINE — the production command actually decides"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real worker blocked on a real AskUserQuestion visible in cmux feed.list, and a tmp runtime root for the managed daemon's per-workspace ledgers"
    when:
      abstract: "The production coach runtime is started via coach_runtime_cli `start` (the detached SubprocessDaemonSpawner path) for that workspace and given a moment to poll"
      action: "invoke"
    then:
      abstract:
        - "The managed daemon's per-workspace verdicts.jsonl gains a line: the daemon spawned by the real command completed a real decision and recorded it durably"
      assertions:
        - type: "exists"
    close_the_loop:
      consumer_reacted: "the daemon spawned detached by `atdd coach start` reached cmux cleanly, decided the blocked question, and appended a verdict to its managed verdicts.jsonl"
      drift_resolved: "the real production command auto-answers a blocked decision instead of inheriting stale CMUX_* env, hitting broken-pipe, and silently writing zero verdicts"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
