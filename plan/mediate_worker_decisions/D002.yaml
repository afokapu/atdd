urn: "wmbt:mediate-worker-decisions:D002"
step: "define"
direction: "minimize"
dimension: "likelihood"
object_of_control: "two-daemon-instances-answering-the-same-feed-concurrently"
context_clarifier: "a pidfile single-instance guard ensures only one daemon answers a given Feed; a second daemon acquiring the same lock path must refuse to start, while a stale pidfile (no live process) is detected and reclaimed so a crashed daemon does not wedge the lock"
lens: "functional.effectiveness"
statement: "minimize likelihood of two daemon instances answering the same feed concurrently"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:D002-UNIT-001-second-acquire-refused-stale-reclaimed"
      id: "AC-UNIT-001"
      purpose: "A second acquire on a held lock path is refused; a stale pidfile (dead pid) is reclaimed"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A pidfile lock acquired at a tmp path"
        - "A second lock at the same path, and a separate stale pidfile naming a dead pid"
    when:
      abstract: "Each lock attempts to acquire"
      action: "invoke"
    then:
      abstract:
        - "The second acquire against the live holder returns False"
        - "Acquire against the stale pidfile succeeds (reclaimed)"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
  - identity:
      urn: "acc:mediate-worker-decisions:D002-INTEGRATION-001-run-forever-refuses-when-locked"
      id: "AC-INTEGRATION-001"
      purpose: "A daemon refuses to run its loop when the single-instance lock is already held"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A first daemon holding the single-instance lock at a tmp path"
        - "A second daemon configured with the same lock path"
    when:
      abstract: "The second daemon attempts to run its loop"
      action: "invoke"
    then:
      abstract:
        - "The second daemon refuses (raises a single-instance error) and never ticks"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
  - identity:
      urn: "acc:mediate-worker-decisions:D002-SMOKE-001-live-second-instance-refused"
      id: "AC-SMOKE-001"
      purpose: "A second real daemon process refuses to start while the first holds the single-instance lock"
      phase: "SMOKE"
    execution_kind: live_smoke
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A first real daemon process holding the single-instance lock"
    when:
      abstract: "A second daemon process is started with the same lock path"
      action: "invoke"
    then:
      abstract:
        - "The second process refuses to start and the first keeps the lock"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
