urn: "wmbt:mediate-worker-decisions:C004"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "the-daemon-auto-answering-a-dangerous-tool-use-instead-of-escalating-to-a-human"
context_clarifier: "when a polled feed permission/exitPlan item is a dangerous tool use, the daemon must record an escalation to escalations.jsonl AND emit a loud operator-visible log line, and NEVER deliver a feed reply — the headline safety property; the coach is never consulted on the dangerous path"
lens: "functional.effectiveness"
statement: "minimize likelihood of the daemon auto answering a dangerous tool use instead of escalating to a human"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:C004-UNIT-001-dangerous-escalates-not-auto"
      id: "AC-UNIT-001"
      purpose: "A dangerous item in a tick is escalated (recorded + loud log) and never replied to; the coach is not consulted"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fake source with one dangerous permission item (git push)"
        - "A recording escalation sink, a fake transport, and a fake coach"
    when:
      abstract: "The daemon runs a single tick"
      action: "invoke"
    then:
      abstract:
        - "An escalation is recorded to the sink and the transport reply verb is never called"
        - "The coach is never consulted on the dangerous path"
      assertions:
        - type: "count"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
  - identity:
      urn: "acc:mediate-worker-decisions:C004-INTEGRATION-001-escalation-ledger-written-no-reply"
      id: "AC-INTEGRATION-001"
      purpose: "The dangerous escalation is durably appended to escalations.jsonl and no reply transport call is made"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A JsonlEscalationSink backed by a tmp escalations.jsonl path"
        - "A fake transport and a dangerous permission item"
    when:
      abstract: "The daemon handles the dangerous item in a tick"
      action: "invoke"
    then:
      abstract:
        - "escalations.jsonl contains one escalation record matching the escalation contract"
        - "The transport reply verb is never called"
      assertions:
        - type: "count"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
  - identity:
      urn: "acc:mediate-worker-decisions:C004-SMOKE-001-live-dangerous-not-auto-answered"
      id: "AC-SMOKE-001"
      purpose: "A real agent's dangerous tool use is escalated, never auto-answered, by the live daemon"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real worker whose blocked permission requests a dangerous command"
    when:
      abstract: "The daemon runs one poll tick over the live Feed"
      action: "invoke"
    then:
      abstract:
        - "No reply is sent; the item is escalated to the human channel"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
