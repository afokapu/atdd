urn: "wmbt:mediate-worker-decisions:E003"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "failing-to-deliver-the-coach-verdict-through-the-feed-reply"
context_clarifier: "when the coach reaches an auto_apply verdict for a blocked agent decision, the bridge must reply through the correct cmux feed verb (feed.question.reply / feed.permission.reply / feed.exit_plan.reply) for that item kind, exactly once per request_id, to unblock the agent"
lens: "functional.effectiveness"
statement: "minimize likelihood of failing to deliver the coach verdict through the feed reply"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:E003-UNIT-001-verdict-maps-to-feed-reply"
      id: "AC-UNIT-001"
      purpose: "A verdict maps to the correct feed reply verb and params for its item kind"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An auto_apply verdict selecting option alpha for a question-kind item"
        - "An auto_apply verdict for a permission-kind item"
    when:
      abstract: "The feed reply mapper builds the reply"
      action: "invoke"
    then:
      abstract:
        - "The question verdict yields feed.question.reply with request_id + selections"
        - "The permission verdict yields feed.permission.reply with request_id + decision"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:E003-INTEGRATION-001-reply-once-per-request"
      id: "AC-INTEGRATION-001"
      purpose: "The same request_id is replied to exactly once (idempotent), via a fake feed transport"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A fake feed transport recording reply calls and an auto_apply verdict"
        - "The same verdict delivered twice"
    when:
      abstract: "The feed reply applier delivers"
      action: "invoke"
    then:
      abstract:
        - "The transport's reply verb is called exactly once for the request_id"
      assertions:
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:E003-SMOKE-001-unblocks-live-agent"
      id: "AC-SMOKE-001"
      purpose: "A coach verdict replied via the Feed unblocks a real agent end-to-end"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real Claude worker blocked on a live Feed decision"
    when:
      abstract: "The bridge delivers the coach verdict via feed reply"
      action: "invoke"
    then:
      abstract:
        - "The feed item resolves and the worker proceeds with the chosen option"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
