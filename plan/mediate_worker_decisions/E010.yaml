urn: "wmbt:mediate-worker-decisions:E010"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-second-feed-daemon-spawned-for-a-workspace-that-already-has-a-live-managed-daemon"
context_clarifier: "atdd coach start --workspace <ws> runs atdd gate, then launches the #993 workspace-scoped feed_daemon as a managed background process recorded in a per-workspace manager pidfile and returns immediately; a start for a workspace whose recorded pid is still alive is a no-op so two daemons never decide the same Feed; the existing feed_daemon CLI/composition is reused wholesale (the daemon is never reimplemented)"
lens: "functional.effectiveness"
statement: "minimize likelihood of a second feed daemon spawned for a workspace that already has a live managed daemon"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:E010-UNIT-001-start-writes-pidfile-and-spawns-once"
      id: "AC-UNIT-001"
      purpose: "A first start writes the per-workspace manager pidfile and invokes the daemon spawn exactly once"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A managed-daemon registry rooted at a tmp dir"
        - "A recording spawner that returns a live fake pid, and a stub gate runner"
    when:
      abstract: "start is invoked for a workspace with no existing managed daemon"
      action: "invoke"
    then:
      abstract:
        - "The spawner is called exactly once with the workspace-scoped feed_daemon argv"
        - "A manager pidfile for the workspace exists and records the spawned pid"
      assertions:
        - type: "count"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
  - identity:
      urn: "acc:mediate-worker-decisions:E010-UNIT-002-second-start-is-a-no-op"
      id: "AC-UNIT-002"
      purpose: "A second start for the same workspace, while the recorded pid is alive, performs no second spawn"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A managed-daemon registry already holding a live pidfile for the workspace"
        - "A recording spawner and an injected liveness probe reporting the recorded pid alive"
    when:
      abstract: "start is invoked a second time for the same workspace"
      action: "invoke"
    then:
      abstract:
        - "The spawner is never called (no second daemon)"
        - "The existing manager pidfile is left unchanged"
      assertions:
        - type: "count"
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
  - identity:
      urn: "acc:mediate-worker-decisions:E010-SMOKE-001-live-start-launches-scoped-daemon"
      id: "AC-SMOKE-001"
      purpose: "atdd coach start on a real worker workspace launches the scoped feed_daemon as a live managed process"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real cmux worker workspace and a /tmp scratch runtime dir"
    when:
      abstract: "atdd coach start --workspace <ws> is invoked"
      action: "invoke"
    then:
      abstract:
        - "A manager pidfile is written and names a live feed_daemon process scoped to the workspace"
      assertions:
        - type: "exists"
    close_the_loop:
      consumer_reacted: "the spawned feed_daemon process is alive and polling the workspace-scoped Feed"
      drift_resolved: "atdd coach daemons lists the workspace with a running status"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
