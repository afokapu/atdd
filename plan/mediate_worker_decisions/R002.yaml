urn: "wmbt:mediate-worker-decisions:R002"
step: "resolve"
direction: "minimize"
dimension: "likelihood"
object_of_control: "the-daemon-failing-to-shut-down-cleanly-and-release-its-lock-on-a-termination-signal"
context_clarifier: "on SIGINT/SIGTERM the daemon must stop the poll loop between ticks and release its single-instance lock in a finally block — no abandoned lock, no busy-spin after the stop signal is set"
lens: "functional.sustainability"
statement: "minimize likelihood of the daemon failing to shut down cleanly and release its lock on a termination signal"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:R002-UNIT-001-stop-signal-exits-loop-and-releases-lock"
      id: "AC-UNIT-001"
      purpose: "When the stop signal is set, run_forever exits the poll loop and releases the lock"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fake stop signal that flips to set after the first tick"
        - "A fake sleeper and a recording fake lock"
    when:
      abstract: "The daemon runs its poll loop"
      action: "invoke"
    then:
      abstract:
        - "The loop performs a bounded number of ticks and returns"
        - "The lock is released exactly once"
      assertions:
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
  - identity:
      urn: "acc:mediate-worker-decisions:R002-INTEGRATION-001-sigterm-sets-stop"
      id: "AC-INTEGRATION-001"
      purpose: "A SIGTERM delivered to the installed handler sets the stop event the loop observes"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A SignalStop with its SIGINT/SIGTERM handlers installed"
    when:
      abstract: "The termination handler is invoked"
      action: "invoke"
    then:
      abstract:
        - "is_set() returns True after the handler runs"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
  - identity:
      urn: "acc:mediate-worker-decisions:R002-SMOKE-001-live-sigterm-clean-shutdown"
      id: "AC-SMOKE-001"
      purpose: "A running daemon process exits cleanly and releases its lock on SIGTERM"
      phase: "SMOKE"
    execution_kind: live_smoke
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real daemon process running with its pidfile lock held"
    when:
      abstract: "SIGTERM is delivered to the daemon process"
      action: "invoke"
    then:
      abstract:
        - "The process exits cleanly and the lock path is released"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "feed-daemon"
