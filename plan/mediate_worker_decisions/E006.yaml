urn: "wmbt:mediate-worker-decisions:E006"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "the-decider-leaving-any-block-of-the-decision-document-unanswered"
context_clarifier: "when the decider (ClaudeCoach over claude -p) is given a multi-block decision document it must render EVERY block and return a kind-correct structured answer for each one — one option id for single_choice, a list of ids for multi_choice/checkbox, text for free_text, approve/deny for confirm — so no question is silently dropped the way the old flat decider dropped all but the first"
lens: "functional.effectiveness"
statement: "minimize likelihood of the decider leaving any block of the decision document unanswered"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:E006-UNIT-001-answers-every-block-by-kind"
      id: "AC-UNIT-001"
      purpose: "Given a document of single_choice + single_choice + multi_choice + free_text blocks, the decider returns one answer per block, each of the correct kind (single id, list of ids, text)"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A decision request carrying a four-block document and a fake claude CLI returning a structured per-block answer"
    when:
      abstract: "The decider mediates the request"
      action: "invoke"
    then:
      abstract:
        - "The verdict carries one answer per block keyed by block_id"
        - "The multi_choice block answer is a list of option ids; the free_text block answer is text"
      assertions:
        - type: "count"
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:E006-UNIT-002-selection-constrained-to-block-options"
      id: "AC-UNIT-002"
      purpose: "Each block answer is constrained to that block's own options — a single_choice answer is one of its options, a multi_choice answer is a subset of its options"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A two-block document (single_choice Color, multi_choice Features) and a fake claude CLI"
    when:
      abstract: "The decider mediates the request"
      action: "invoke"
    then:
      abstract:
        - "The Color answer is one of Color's option ids and the Features answer ids are all drawn from Features' options"
      assertions:
        - type: "equals"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:E006-SMOKE-001-live-decider-answers-whole-doc"
      id: "AC-SMOKE-001"
      purpose: "A real claude -p decider answers every block of a live multi-question document"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A live multi-question document and the real ClaudeCoach over claude -p"
    when:
      abstract: "The decider mediates the document"
      action: "invoke"
    then:
      abstract:
        - "The verdict carries a non-empty answer for every block in the document"
      assertions:
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
