urn: "wmbt:mediate-worker-decisions:R001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-12-03
step: "resolve"
direction: "minimize"
dimension: "likelihood"
object_of_control: "an-escalated-human-required-verdict-being-auto-applied"
context_clarifier: "the C-side mirror of the safety gate: when apply receives a verdict whose disposition is human_required, it must never deliver to the worker and must record disposition escalated"
lens: "functional.effectiveness"
statement: "minimize likelihood of an escalated human required verdict being auto applied"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:R001-UNIT-001-human-required-not-applied"
      id: "AC-UNIT-001"
      purpose: "A human_required verdict is never delivered to the worker and is recorded as escalated"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fake worker applier that records whether it was called"
        - "A verdict with disposition human_required"
    when:
      abstract: "The apply use case handles the verdict"
      action: "invoke"
    then:
      abstract:
        - "The worker applier was never called"
        - "A record with disposition escalated is written"
      assertions:
        - type: "equals"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "apply-decision"
