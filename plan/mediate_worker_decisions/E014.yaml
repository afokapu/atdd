urn: "wmbt:mediate-worker-decisions:E014"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "atdd-coach-answer-failing-to-deliver-the-operator-reply-through-the-correct-cmux-feed-verb-and-params"
context_clarifier: "atdd coach answer <request_id> <verb> is the operator's direct reply command for a parked worker — no engine, cargo, or journey. It wraps the cmux reply directly through the existing feed_reply_mapper + CmuxFeedTransport: a permission verb maps to feed.permission.reply {request_id, mode: once|deny} and a question verb maps to feed.question.reply {request_id, selections:[label]} with the operator's choice resolved to the exact question_options[].label. The reply must fire exactly once per request_id via the correct verb with the correct params; tests assert the cmux RPC verb+params (not a log line)."
lens: "functional.effectiveness"
statement: "minimize likelihood of atdd coach answer failing to deliver the operator reply through the correct cmux feed verb and params"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:E014-UNIT-001-permission-reply-verb-and-params"
      id: "AC-UNIT-001"
      purpose: "atdd coach answer on a permission item builds feed.permission.reply with the request_id and the once/deny mode for the operator's verb"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A pending permission-kind feed item with a known request_id"
        - "An operator answer verb of 'once' and, separately, 'deny'"
    when:
      abstract: "atdd coach answer builds the reply plan for the item"
      action: "invoke"
    then:
      abstract:
        - "The 'once' verb yields feed.permission.reply with the request_id and mode 'once'"
        - "The 'deny' verb yields feed.permission.reply with the request_id and mode 'deny'"
        - "The assertion is on the cmux RPC verb and params, not a log line"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-answer-escalation"
  - identity:
      urn: "acc:mediate-worker-decisions:E014-UNIT-002-question-reply-exact-label-selections"
      id: "AC-UNIT-002"
      purpose: "atdd coach answer on a question item builds feed.question.reply with the request_id and selections carrying the exact resolved option label"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A pending question-kind feed item whose question_options include the label 'Blue'"
        - "An operator answer naming the 'Blue' option"
    when:
      abstract: "atdd coach answer resolves the operator input to the exact option label and builds the reply plan"
      action: "invoke"
    then:
      abstract:
        - "The reply is feed.question.reply with the request_id and selections equal to ['Blue']"
        - "The selections carry the exact question_options[].label, not the raw operator string"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-answer-escalation"
  - identity:
      urn: "acc:mediate-worker-decisions:E014-INTEGRATION-001-delivers-once-via-transport"
      id: "AC-INTEGRATION-001"
      purpose: "atdd coach answer delivers the reply through the cmux transport exactly once for the request_id"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A fake cmux feed transport recording rpc verb + params"
        - "A pending question item and an operator answer naming a valid label"
    when:
      abstract: "atdd coach answer delivers the reply"
      action: "invoke"
    then:
      abstract:
        - "The transport records exactly one feed.question.reply call for the request_id"
        - "The recorded params carry the request_id and the exact-label selections"
      assertions:
        - type: "count"
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-answer-escalation"
  - identity:
      urn: "acc:mediate-worker-decisions:E014-SMOKE-001-live-answer-advances-parked-worker"
      id: "AC-SMOKE-001"
      purpose: "After a real daemon escalation parks a worker, atdd coach answer delivers the operator reply and the parked worker advances"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real managed feed_daemon on a live cmux worker workspace whose blocking decision was escalated (unanswered in escalations.jsonl)"
    when:
      abstract: "The operator runs atdd coach answer <request_id> <verb> for the escalated item"
      action: "invoke"
    then:
      abstract:
        - "The reply is delivered via the correct cmux feed verb and the worker's screen advances past the parked menu (evidence: screen-before parked, screen-after answered)"
        - "The feed item reaches resolved with a decision, never left expired-and-parked"
      assertions:
        - type: "exists"
    close_the_loop:
      consumer_reacted: "the parked worker receives the operator's reply through the cmux feed and proceeds past its decision prompt"
      drift_resolved: "the escalation is answered — the feed item resolves and a subsequent atdd coach status no longer lists the request_id as unanswered"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-answer-escalation"
