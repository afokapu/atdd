urn: "wmbt:mediate-worker-decisions:M004"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-managed-daemon-spawned-with-its-output-discarded-to-dev-null-so-runtime-failures-are-unobservable"
context_clarifier: "atdd coach start launches the workspace-scoped feed_daemon as a detached managed process; spawning it with stdout/stderr to /dev/null makes any runtime failure (decide loop, LlmCoach, scope) undiagnosable in production. start must direct the daemon's stdout/stderr to a durable per-workspace log (a daemon.log under the workspace runtime dir, append, line-buffered) so a watched daemon that hits an error leaves a trace rather than vanishing"
lens: "functional.observability"
statement: "minimize likelihood of a managed daemon being spawned with its output discarded so runtime failures are unobservable"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:M004-UNIT-001-start-passes-durable-log-path-to-spawner"
      id: "AC-UNIT-001"
      purpose: "start invokes the spawner with a durable per-workspace log_path (a daemon.log sibling of the workspace ledgers), never None/DEVNULL"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A managed-daemon registry rooted at a tmp dir and a recording spawner that captures the log_path argument"
    when:
      abstract: "start is invoked for a workspace with no existing managed daemon"
      action: "invoke"
    then:
      abstract:
        - "The spawner is called once with a non-empty log_path under the workspace runtime dir whose basename is daemon.log"
      assertions:
        - type: "exists"
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
  - identity:
      urn: "acc:mediate-worker-decisions:M004-UNIT-002-subprocess-spawner-wires-stdout-stderr-to-log-file"
      id: "AC-UNIT-002"
      purpose: "The real SubprocessDaemonSpawner opens the log_path for append and wires the child's stdout AND stderr to it (stdin stays DEVNULL), instead of discarding output to /dev/null"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A SubprocessDaemonSpawner and a stubbed Popen capturing the stdout/stderr/stdin kwargs"
        - "A tmp log_path that does not yet exist"
    when:
      abstract: "spawn is invoked with a no-op argv and the log_path"
      action: "invoke"
    then:
      abstract:
        - "Popen receives a writable file object (not DEVNULL) for both stdout and stderr and DEVNULL for stdin; the log file exists on disk afterward"
      assertions:
        - type: "exists"
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
