urn: "wmbt:mediate-worker-decisions:M004"
step: "monitor"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-managed-daemon-spawned-with-its-output-discarded-so-runtime-failures-are-unobservable"
context_clarifier: "atdd coach start launches the workspace-scoped feed_daemon as a managed headless cmux surface (#1007); leaving its output only in the surface pane / discarded makes any runtime failure (decide loop, LlmCoach, scope) undiagnosable in production. start must direct the daemon's stdout/stderr to a durable per-workspace log (a daemon.log under the workspace runtime dir) — the surface launch command redirects stdout+stderr to it — so a watched daemon that hits an error leaves a trace rather than vanishing"
lens: "functional.availability"
statement: "minimize likelihood of a managed daemon spawned with its output discarded so runtime failures are unobservable"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:M004-UNIT-001-start-passes-durable-log-path-to-spawner"
      id: "AC-UNIT-001"
      purpose: "start invokes the spawner with a durable per-workspace log_path (a daemon.log sibling of the workspace ledgers), never None/DEVNULL"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A managed-daemon registry rooted at a tmp dir and a recording spawner that captures the log_path argument"
    when:
      abstract: "start is invoked for a workspace with no existing managed daemon"
      action: "invoke"
    then:
      abstract:
        - "The spawner is called once with a non-empty log_path under the workspace runtime dir whose basename is daemon.log"
      assertions:
        - type: "exists"
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
  - identity:
      urn: "acc:mediate-worker-decisions:M004-UNIT-002-subprocess-spawner-wires-stdout-stderr-to-log-file"
      id: "AC-UNIT-002"
      purpose: "The real CmuxSurfaceDaemonLauncher builds a new-workspace --command that redirects the daemon's stdout AND stderr to the durable daemon.log (>> log 2>&1), instead of leaving output only in the surface pane / discarded, and creates the log directory"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A CmuxSurfaceDaemonLauncher and a stubbed cmux runner capturing the new-workspace argv"
        - "A tmp log_path whose parent does not yet exist"
    when:
      abstract: "spawn is invoked with a no-op daemon argv and the log_path"
      action: "invoke"
    then:
      abstract:
        - "The --command redirects both stdout and stderr to the daemon.log (>> log 2>&1); the log directory exists on disk afterward"
      assertions:
        - type: "exists"
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
  - identity:
      urn: "acc:mediate-worker-decisions:M004-SMOKE-001-real-spawn-captures-daemon-output-to-log"
      id: "AC-SMOKE-001"
      purpose: "A REAL cmux surface launched via CmuxSurfaceDaemonLauncher with a log_path has its stdout/stderr captured to the durable daemon.log on disk — not left only in the surface pane"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real cmux surface running a command that prints a known marker, and a /tmp scratch daemon.log path"
    when:
      abstract: "The surface is launched via CmuxSurfaceDaemonLauncher.spawn with the log_path"
      action: "invoke"
    then:
      abstract:
        - "The on-disk daemon.log contains the command's printed marker (its output was captured to the durable log)"
      assertions:
        - type: "exists"
    close_the_loop:
      consumer_reacted: "the surface command's stdout was redirected to the durable per-workspace daemon.log"
      drift_resolved: "a runtime failure in the managed daemon now leaves a diagnosable trace instead of vanishing"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "coach-runtime"
