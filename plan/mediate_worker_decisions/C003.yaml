urn: "wmbt:mediate-worker-decisions:C003"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "auto-replying-to-a-dangerous-tool-use-without-human-review"
context_clarifier: "the tool_input safety gate auto-approves ONLY a known read-only allowlist (git status/log/diff/show, ls, cat, head, tail, grep, rg, find without -delete/-exec, echo, pwd, which, pytest, atdd validate/gate); every other or unrecognized command is human_required and the bridge must NOT auto-reply — leaving the agent's 120s soft-wait to fall through to a human. Escalate-by-default: a denylist whose default disposition is auto is forbidden, because it silently auto-approved git reset --hard, git clean -fd, and git branch -D (#1014)."
lens: "functional.effectiveness"
statement: "minimize likelihood of auto replying to a dangerous tool use without human review"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:C003-UNIT-001-dangerous-tool-input-human-required"
      id: "AC-UNIT-001"
      purpose: "A permission whose tool_input is a dangerous command classifies human_required; a safe command classifies auto"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A permission request whose tool_input command is 'git push origin main'"
        - "A permission request whose tool_input command is 'ls -la'"
    when:
      abstract: "The safety gate classifies each request"
      action: "invoke"
    then:
      abstract:
        - "The dangerous command is human_required"
        - "The safe command is auto"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:C003-UNIT-002-dangerous-permission-policy-deny-or-escalate"
      id: "AC-UNIT-002"
      purpose: "A dangerous permission is NEVER auto-approved and the coach is never consulted; under the deny policy it is actively denied via feed.permission.reply {mode: deny} and escalated, under the escalate policy no reply is sent and it is escalated (#981)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A dangerous permission feed item (tool_input 'rm -rf /')"
        - "A FeedRunnerUseCase configured with the deny policy, and one with the escalate policy"
    when:
      abstract: "The runner handles the dangerous item under each policy"
      action: "invoke"
    then:
      abstract:
        - "Under deny: exactly one feed.permission.reply with mode 'deny' is delivered and an escalation is recorded"
        - "Under escalate: no reply is delivered and an escalation is recorded"
        - "The coach is never consulted for the dangerous item under either policy"
      assertions:
        - type: "equality"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:C003-UNIT-003-unrecognized-command-escalates-by-default"
      id: "AC-UNIT-003"
      purpose: "The tool_input gate is allowlist-based: a read-only command (git status, ls -la, pytest -q) is auto; any unrecognized or destructive command absent from the original denylist (git reset --hard, git clean -fd, git branch -D, git rebase, git restore ., DELETE FROM, dd if=, mkfs, chmod -R) is human_required. Escalate-by-default — the denylist's auto default is the defect (#1014)."
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "tool_input commands that are read-only (git status, ls -la, pytest -q)"
        - "tool_input commands that are destructive or unrecognized and absent from the original denylist (git reset --hard, git clean -fd, git branch -D, dd if=/dev/zero, mkfs.ext4)"
    when:
      abstract: "The tool_input safety gate classifies each command"
      action: "invoke"
    then:
      abstract:
        - "Each read-only command is auto"
        - "Each unrecognized or destructive command is human_required"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:C003-INTEGRATION-001-no-reply-for-dangerous"
      id: "AC-INTEGRATION-001"
      purpose: "A dangerous permission item produces an escalation and NO feed reply is sent"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A fake feed transport recording reply calls"
        - "A dangerous permission feed item (git push)"
    when:
      abstract: "The feed-driven runner handles the item"
      action: "invoke"
    then:
      abstract:
        - "An escalation is emitted and the transport's reply verb is never called"
      assertions:
        - type: "count"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
  - identity:
      urn: "acc:mediate-worker-decisions:C003-SMOKE-001-live-dangerous-not-auto-approved"
      id: "AC-SMOKE-001"
      purpose: "A real agent's dangerous tool use is not auto-approved through the Feed"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real worker whose blocked permission requests a dangerous command"
    when:
      abstract: "The bridge evaluates the live feed item"
      action: "invoke"
    then:
      abstract:
        - "No auto reply is sent; the item is escalated for human review"
      assertions:
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "bridge-cmux-feed"
