urn: "wmbt:mediate-worker-decisions:M002"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-12-03
step: "monitor"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-worker-application-failure-being-silently-swallowed"
context_clarifier: "when delivering the answer to the worker fails (the applier raises), the bridge must record a failure record carrying the error and must not swallow the exception or report success"
lens: "functional.reliability"
statement: "minimize likelihood of a worker-application failure being swallowed — a delivery error is recorded as application_failed with the error, never hidden"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:M002-INTEGRATION-001-failure-recorded"
      id: "AC-INTEGRATION-001"
      purpose: "When delivery raises, a record with disposition application_failed and the error is written, and no success is reported"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A fake worker applier that raises on deliver and a fake ledger"
        - "An auto_apply verdict"
    when:
      abstract: "The apply use case applies the verdict"
      action: "invoke"
    then:
      abstract:
        - "A record with disposition application_failed and a non-empty error is written"
        - "The use case does not report the decision as applied"
      assertions:
        - type: "equals"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "apply-decision"
