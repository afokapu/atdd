urn: "wmbt:mediate-worker-decisions:D001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-09-30
# Live SMOKE coverage migrated to the cmux Feed feature (bridge-cmux-feed: L002/E003/C003) in 3.90.0;
# the deprecated screen-scrape live smoke was removed (#962). D001 retains hermetic INTEGRATION coverage.
step: "define"
direction: "minimize"
dimension: "likelihood"
object_of_control: "diverging-entry-paths-serializing-different-request-shapes"
context_clarifier: "when a decision enters via the notification source or an emit-CLI call, both entry paths must serialize the same commons:decision:request shape through one shared RequestSink (modulo provenance.source)"
lens: "functional.effectiveness"
statement: "minimize likelihood of diverging entry paths serializing different request shapes"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:D001-INTEGRATION-001-entry-path-parity"
      id: "AC-INTEGRATION-001"
      purpose: "the notification-source path and the emit-CLI path serialize a byte-identical request (modulo provenance.source) via one shared RequestSink"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "The same worker + prompt enter once via the notification source and once via emit_cli"
        - "Both paths write through the shared RequestSink"
    when:
      abstract: "Both entry paths emit their commons:decision:request"
      action: "invoke"
    then:
      abstract:
        - "The two requests are identical except provenance.source (cmux_notification vs emit_cli)"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "sense-decision"
