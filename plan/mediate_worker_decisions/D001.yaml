urn: "wmbt:mediate-worker-decisions:D001"
step: "define"
direction: "minimize"
dimension: "likelihood"
object_of_control: "resolving-a-cmux-notification-to-the-wrong-worker-or-diverging-entry-paths"
context_clarifier: "when a cmux notification (or an emit-CLI call) names a surface and the bridge must map it to exactly one registered worker, and the notify-hook and emit-CLI entry paths must serialize the same commons:decision:request shape"
lens: "functional.correctness"
statement: "minimize likelihood of resolving a cmux notification to the wrong worker, or of the notify-hook and emit-CLI entry paths producing divergent requests"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:D001-UNIT-001-surface-maps-to-one-worker"
      id: "AC-UNIT-001"
      purpose: "A known surface id resolves to exactly one worker; an unknown surface id resolves to None (no worker invented)"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A worker registry maps surface:3 -> worker feature_validator_execution"
        - "A notification names surface:3, and another names surface:99 (unregistered)"
    when:
      abstract: "The worker registry resolves each surface id"
      action: "invoke"
    then:
      abstract:
        - "surface:3 resolves to exactly one worker handle"
        - "surface:99 resolves to None — no worker is fabricated"
      assertions:
        - type: "equals"
        - type: "exists"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "sense-decision"
  - identity:
      urn: "acc:mediate-worker-decisions:D001-INTEGRATION-001-entry-path-parity"
      id: "AC-INTEGRATION-001"
      purpose: "notify-hook and emit-CLI serialize a byte-identical request (modulo provenance.source) via one shared RequestSink"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "The same worker + prompt enter once via notify_hook and once via emit_cli"
        - "Both paths write through the shared RequestSink"
    when:
      abstract: "Both entry paths emit their commons:decision:request"
      action: "invoke"
    then:
      abstract:
        - "The two requests are identical except provenance.source (cmux_notification vs emit_cli)"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "sense-decision"
  - identity:
      urn: "acc:mediate-worker-decisions:D001-INTEGRATION-002-live-resolve"
      id: "AC-INTEGRATION-002"
      purpose: "A live cmux notification resolves through the real registry to the worker that raised it"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A real worker runs in a cmux surface and raises a notification"
    when:
      abstract: "The notify hook resolves the notification surface to a worker"
      action: "invoke"
    then:
      abstract:
        - "The resolved worker is the one running in that surface"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "sense-decision"
