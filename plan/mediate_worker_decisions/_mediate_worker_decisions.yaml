wagon: mediate-worker-decisions
urn: "wagon:mediate-worker-decisions"
name: "Mediate Worker Decisions"
description: "cmux bridge that lets the coach answer a blocked worker agent's decision prompt, with dangerous actions always escalated to a human and every outcome recorded"
theme: commons

subject: "coach:mediator"
context: "worker-blocked, cmux-surface, lifecycle-active"
action: "mediates a blocked worker's decision through the coach"
goal: "keep agents progressing without a human operator in the loop while never auto-applying dangerous actions"
outcome: "decision applied to the worker or escalated to a human, with a durable audit record"

produce:
  - name: commons:feed:blocked-item
    contract: "contract:commons:feed:blocked-item"
    telemetry: null
    to: internal
  - name: commons:decision:record
    contract: "contract:commons:decision:record"
    telemetry: null
    to: external
  - name: commons:decision:escalation
    contract: "contract:commons:decision:escalation"
    telemetry: null
    to: external
  - name: commons:decision:request
    contract: "contract:commons:decision:request"
    telemetry: null
    to: internal
  - name: commons:decision:verdict
    contract: "contract:commons:decision:verdict"
    telemetry: null
    to: internal

consume:
  - name: commons:cmux:notification
    from: system:cmux
    contract: null
    telemetry: null

features:
  - urn: "feature:mediate-worker-decisions:sense-decision"
  - urn: "feature:mediate-worker-decisions:mediate-decision"
  - urn: "feature:mediate-worker-decisions:apply-decision"
  - urn: "feature:mediate-worker-decisions:bridge-cmux-feed"
  - urn: "feature:mediate-worker-decisions:feed-daemon"
  - urn: "feature:mediate-worker-decisions:surface-worker-decisions"
  - urn: "feature:mediate-worker-decisions:coach-runtime"

wmbt:
  total: 34
  D001: "minimize likelihood of resolving a cmux notification to the wrong worker (or routing two entry paths to divergent requests)"
  L001: "maximize likelihood of locating the latest decision prompt in worker surface text"
  C001: "minimize quantity of false decision-requests emitted from non-decision worker output"
  P001: "minimize effort of presenting a structured worker decision to the coach surface"
  C002: "minimize likelihood of a dangerous action being auto-applied instead of escalated to a human"
  E001: "minimize likelihood of misparsing the coach reply into a wrong verdict"
  M001: "minimize likelihood of coach silence causing a silent auto-apply instead of an escalation"
  Y001: "minimize likelihood of a verdict referencing an option absent from the request"
  E002: "minimize quantity of duplicate applications of the same verdict to a worker"
  K001: "minimize likelihood of an applied decision missing from the durable ledger"
  M002: "minimize likelihood of a worker-application failure being silently swallowed"
  R001: "minimize likelihood of an escalated (human_required) verdict being auto-applied"
  L002: "maximize likelihood of locating a blocked agent decision in the cmux feed"
  E003: "minimize likelihood of failing to deliver the coach verdict through the feed reply"
  C003: "minimize likelihood of auto replying to a dangerous tool use without human review"
  E004: "minimize likelihood of a blocked feed item left unanswered by the autonomous daemon loop"
  E005: "minimize quantity of duplicate answers to the same request id across ticks and restarts"
  C004: "minimize likelihood of the daemon auto answering a dangerous tool use instead of escalating to a human"
  R002: "minimize likelihood of the daemon failing to shut down cleanly and release its lock on a termination signal"
  D002: "minimize likelihood of two daemon instances answering the same feed concurrently"
  L003: "maximize likelihood of preserving every question when mapping a feed item into the decision document"
  E006: "minimize likelihood of the decider leaving any block of the decision document unanswered"
  E007: "minimize likelihood of delivering selections for only the first question instead of every question"
  C005: "minimize likelihood of a dangerous block in a mixed document being auto answered instead of escalating the whole document"
  E008: "minimize likelihood of a spawned workers escalation worthy decision being pre authorized so it never surfaces to the feed"
  C006: "minimize likelihood of the launch policy pre authorizing an action class tool so a dangerous action executes without ever surfacing for mediation"
  Y002: "minimize likelihood of the rendered dispatch spec values diverging from the declared decision surfacing policy"
  L004: "maximize likelihood of the feed publishing hook being active for a spawned worker at launch"
  E009: "minimize likelihood of claiming a feed reply delivered while the worker stays parked on its tui menu"
  L005: "minimize likelihood of a daemon acting on decisions outside its own workspace because the feed read is not scoped"
  E010: "minimize likelihood of a second feed daemon spawned for a workspace that already has a live managed daemon"
  L006: "maximize likelihood of the next unhandled escalation past the persisted cursor in the daemons escalations ledger"
  R003: "minimize likelihood of a managed daemon left running or a stale manager pidfile after atdd coach stop"
  E011: "minimize likelihood of the autonomous decider deciding without the coach convention and operating protocol loaded"
