urn: "wmbt:mediate-worker-decisions:E002"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-09-30
# Live SMOKE coverage migrated to the cmux Feed feature (bridge-cmux-feed: L002/E003/C003, incl. E003
# close-the-loop) in 3.90.0; the deprecated screen-scrape close-the-loop live smoke was removed (#962).
# E002 retains hermetic UNIT+INTEGRATION coverage.
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "duplicate-applications-of-the-same-verdict-to-a-worker"
context_clarifier: "when the same verdict is handed to apply more than once (replay, retry, double-notification) the worker must receive the answer exactly once, keyed by a stable idempotency key derived from request+verdict"
lens: "functional.availability"
statement: "minimize quantity of duplicate applications of the same verdict to a worker"
acceptances:
  - identity:
      urn: "acc:mediate-worker-decisions:E002-UNIT-001-stable-idempotency-key"
      id: "AC-UNIT-001"
      purpose: "The idempotency key is stable for the same request+verdict and differs across distinct ones"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A request+verdict pair, and a second distinct pair"
    when:
      abstract: "The idempotency key is computed for each"
      action: "invoke"
    then:
      abstract:
        - "The same pair yields the same key; the distinct pair yields a different key"
      assertions:
        - type: "equals"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "apply-decision"
  - identity:
      urn: "acc:mediate-worker-decisions:E002-INTEGRATION-001-applied-once"
      id: "AC-INTEGRATION-001"
      purpose: "Handing the same verdict twice delivers to the worker exactly once"
      phase: "RED"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A fake worker applier and an applied-guard backed by tmp storage"
        - "An auto_apply verdict handed to apply twice"
    when:
      abstract: "The apply use case runs for both"
      action: "invoke"
    then:
      abstract:
        - "The worker applier is called exactly once"
        - "Two records are written: applied, then a deduped no-op"
      assertions:
        - type: "count"
    signal: {}
    metadata:
      wagon: "mediate-worker-decisions"
      feature: "apply-decision"
