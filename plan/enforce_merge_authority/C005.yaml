urn: wmbt:enforce-merge-authority:C005
step: confirm
direction: minimize
dimension: likelihood
object_of_control: undocumented-merge
context_clarifier: when a pull request reaches the merge boundary, on a gate with
  known holes that must not be inherited silently by the documentation check
lens: functional.effectiveness
statement: minimize likelihood of an undocumented-merge, by refusing entry to main
  when the declared documentation obligation is unresolved, and by failing closed
  when the obligation lookup itself cannot be performed
acceptances:
- given:
    abstract:
    - A pull request whose issue carries an unresolved declared documentation obligation
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-001
    phase: RED
    purpose: Merge must preserve the same invariant COMPLETE enforces
    urn: acc:enforce-merge-authority:C005-UNIT-001-red-unresolved-obligation-blocks-merge
  metadata:
    author: atdd:self-compliance
    created: '2026-09-06'
  then:
    abstract:
    - The merge is blocked naming the obligation
  when:
    abstract: the merge check runs
- given:
    abstract:
    - A merge check whose obligation lookup cannot be performed
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-002
    phase: GREEN
    purpose: A lookup failure must not degrade to advisory and report a pass, which
      is the defect this gate already carries
    urn: acc:enforce-merge-authority:C005-UNIT-002-lookup-failure-fails-closed
  metadata:
    author: atdd:self-compliance
    created: '2026-09-06'
  then:
    abstract:
    - The check blocks rather than passing
    - The unobservable lookup is reported as data, not as a clean result
  when:
    abstract: the merge check runs
