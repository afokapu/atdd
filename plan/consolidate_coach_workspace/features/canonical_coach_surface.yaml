urn: "feature:consolidate-coach-workspace:canonical-coach-surface"
wagon: "wagon:consolidate-coach-workspace"
description: "Phase 1 of issue #736: a single canonical coach orchestration tab, a consolidated multi-issue status view rendered inside it, and a fixed 50/50 coach/worker workspace layout with workers placed as right-pane surfaces. session_naming.py gains a canonical coach-tab name (no issue number embedded); coach.py resolves-or-creates that one surface, renders a per-issue status table (phase, last decision, worker/agent health) into it, and places each worker as a surface/tab in the right pane instead of a new tiled pane — applied uniformly across cmux, tmux, and zellij."
sizing:
  wmbts: 3
  footprint_score: 13
  footprint_size: "M"
wmbts:
  - "wmbt:consolidate-coach-workspace:Y001"
  - "wmbt:consolidate-coach-workspace:E001"
  - "wmbt:consolidate-coach-workspace:D001"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "coach.py — resolves-or-creates the canonical coach orchestration surface and renders the consolidated multi-issue status view into it"
    application:
      - type: "use_cases"
        count: 3
        rationale: "resolve_or_create_coach_surface(), build_consolidated_view(), and coach_workspace_layout() use-case functions"
    domain:
      - type: "value_objects"
        count: 2
        rationale: "CanonicalCoachSurface (issue-number-free tab name) and WorkspaceLayout (fixed 50/50 split + pane assignment)"
    integration:
      - type: "adapters"
        count: 1
        rationale: "multiplexer adapter — surface-vs-pane placement and right-pane surface attach across cmux/tmux/zellij"
