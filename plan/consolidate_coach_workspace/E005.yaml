urn: "wmbt:consolidate-coach-workspace:E005"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "a-decorated-cmux-workspace-handle-reaching-cmux-list-panes-unsanitized"
context_clarifier: >-
  Live 2026-06-09 (`atdd coach 1012`): the layout pass crashed with
  `Invalid workspace handle: "* workspace:1  ATDD COACH  [selected]"`. Root cause:
  CmuxBackend.list_workspaces (multiplexer.py) returns each `cmux list-workspaces`
  line only `.strip()`-ed — keeping cmux's decoration (`* ` current marker,
  trailing workspace title, `[selected]`) — and surface_workspace feeds those
  decorated strings straight into `cmux list-panes --workspace <handle>`, which
  cmux rejects. The same unresolved handle is what
  enforce-surface-conformance.place_worker_surface_right needs to position the
  worker (the layout-conformance rule) AND what the #1012 dispatch->daemon attach
  needs to scope a per-worker daemon. The fix is a pure handle sanitizer that
  extracts the bare `workspace:N` token from a decorated listing line (mirroring
  the existing `workspace:\d+` extraction in daemon_manager / _surface_workspace),
  applied so list_workspaces never emits a decorated handle. Relates #601 / #865.
lens: "functional.effectiveness"
statement: >-
  minimize likelihood of a decorated cmux workspace handle reaching cmux list
  panes unsanitized
acceptances:
  - identity:
      urn: "acc:consolidate-coach-workspace:E005-UNIT-001-sanitizer-extracts-bare-handle"
      id: "AC-UNIT-001"
      purpose: >-
        The handle sanitizer extracts the bare `workspace:N` token from a decorated
        cmux list-workspaces line (`* `, trailing title, `[selected]` stripped) and
        leaves an already-bare handle unchanged
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A decorated listing line `* workspace:1  ATDD COACH  [selected]` and a bare `workspace:5`"
    when:
      abstract: "The handle sanitizer is applied to each"
      action: "invoke"
    then:
      abstract:
        - "The decorated line yields exactly `workspace:1`"
        - "The already-bare handle is returned unchanged"
      assertions:
        - type: "equals"
        - type: "equals"
    signal: {}
    metadata:
      wagon: "consolidate-coach-workspace"
      feature: "enforce-surface-conformance"
  - identity:
      urn: "acc:consolidate-coach-workspace:E005-UNIT-002-list-workspaces-emits-only-bare-handles"
      id: "AC-UNIT-002"
      purpose: >-
        list_workspaces returns only sanitized bare `workspace:N` handles, so a
        downstream `cmux list-panes --workspace <handle>` never receives cmux
        decoration
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A cmux list-workspaces output of several decorated lines (current marker, titles, [selected])"
    when:
      abstract: "list_workspaces parses the output"
      action: "invoke"
    then:
      abstract:
        - "Every returned handle matches the bare `workspace:N` shape with no decoration"
        - "No returned handle contains `*`, `[selected]`, or a workspace title"
      assertions:
        - type: "equals"
        - type: "count"
    signal: {}
    metadata:
      wagon: "consolidate-coach-workspace"
      feature: "enforce-surface-conformance"
  - identity:
      urn: "acc:consolidate-coach-workspace:E005-SMOKE-001-surface-workspace-resolves-without-invalid-handle"
      id: "AC-SMOKE-001"
      purpose: >-
        Against a live cmux with a real worker surface, surface_workspace resolves
        the owning workspace without an `Invalid workspace handle` error, so the
        layout conformance pass applies
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A live cmux session with a real worker surface in its own workspace"
    when:
      abstract: "surface_workspace resolves the worker surface's owning workspace"
      action: "invoke"
    then:
      abstract:
        - "A bare `workspace:N` handle is returned and no `Invalid workspace handle` error is raised"
      assertions:
        - type: "exists"
    close_the_loop:
      consumer_reacted: "place_worker_surface_right positions the resolved worker workspace with no parse crash"
      drift_resolved: "the layout-conformance pass completes instead of warning `layout not applied`"
    signal: {}
    metadata:
      wagon: "consolidate-coach-workspace"
      feature: "enforce-surface-conformance"
