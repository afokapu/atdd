urn: "wmbt:consolidate-coach-workspace:E001"
step: "execute"
direction: "increase"
dimension: "likelihood"
object_of_control: "multi-issue-orchestration-state-visibility"
context_clarifier: "when a coach manages several issues at once and the operator must read overall orchestration state — phase per issue, worker/agent health, last decision — but today sees only one raw `atdd coach` process terminal per invocation, so 20 issues means 20 stdout streams and no at-a-glance view"
lens: "functional.effectiveness"
statement: "increase likelihood of multi-issue-orchestration-state-visibility when a coach manages multiple issues by rendering a consolidated per-issue status view — one row per managed issue showing phase, last decision, and worker/agent health — inside the single canonical coach tab, instead of one raw coach process terminal per invocation"
acceptances:
  - identity:
      urn: "acc:consolidate-coach-workspace:E001-UNIT-001-one-status-row-per-managed-issue"
      id: "AC-UNIT-001"
      purpose: "the consolidated-view builder emits exactly one status row per managed issue, each row naming phase, last decision, and worker/agent health"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A list of 3 managed-issue state records (#736 PLANNED, #601 RED, #730 REFACTOR), each with phase, last-decision, and worker-health fields"
    when:
      abstract: "the consolidated coach-view builder is called with the 3-issue list"
    then:
      abstract:
        - "The rendered view contains exactly 3 status rows"
        - "Each row names its issue number, its phase, its last decision, and its worker/agent health"
        - "No raw `atdd coach` process stdout is included in the rendered view"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:consolidate-coach-workspace:E001-INTEGRATION-001-view-renders-into-canonical-tab"
      id: "AC-INTEGRATION-001"
      purpose: "the consolidated view renders into the canonical coach surface and creates no new tab"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A mock multiplexer that records surface creations and render targets"
        - "Two managed issues with state records available"
    when:
      abstract: "the coach renders its consolidated status view"
    then:
      abstract:
        - "The render target surface reference equals the canonical coach orchestration tab"
        - "Exactly zero new surfaces/tabs are created to host the view"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:consolidate-coach-workspace:E001-SMOKE-001-real-coach-tab-shows-every-issue"
      id: "AC-SMOKE-001"
      purpose: "against a real coach run, the single coach tab displays a per-issue status line for every managed issue"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "integration"
    given:
      abstract:
        - "A real coach driving two issues with the consolidated view active"
    when:
      abstract: "the operator views the canonical coach tab"
    then:
      abstract:
        - "The tab content shows exactly one status line per managed issue"
        - "Each status line displays that issue's current phase"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
