urn: "wmbt:consolidate-coach-workspace:D001"
step: "define"
direction: "minimize"
dimension: "quantity"
object_of_control: "coach-pane-shrinkage-when-workers-are-added"
context_clarifier: "when the coach workspace gains worker N+1 and today `--multiplexer-mode pane` opens a new tiled pane per worker, re-tiling and shrinking every other pane — including the coach's half — so readability decays with each added worker, and there is no fixed coach/worker ratio"
lens: "functional.sustainability"
statement: "minimize quantity of coach-pane-shrinkage-when-workers-are-added by defining a fixed 50/50 two-pane coach workspace layout (coach left, all workers right) where each new worker is added as a surface/tab inside the right pane rather than a new tiled pane, applied uniformly across cmux, tmux, and zellij so the coach's half never shrinks regardless of worker count"
acceptances:
  - identity:
      urn: "acc:consolidate-coach-workspace:D001-UNIT-001-split-ratio-is-fixed-fifty-fifty"
      id: "AC-UNIT-001"
      purpose: "the coach workspace layout policy returns a 50/50 split ratio independent of worker count"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The coach workspace layout helper"
        - "Worker counts of 1, 5, and 20"
    when:
      abstract: "the layout helper is called once for each worker count"
    then:
      abstract:
        - "The coach (left) pane ratio is 0.5 for every worker count"
        - "The worker (right) pane ratio is 0.5 for every worker count"
        - "The returned ratio does not vary with worker count"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:consolidate-coach-workspace:D001-INTEGRATION-001-worker-added-as-right-pane-surface"
      id: "AC-INTEGRATION-001"
      purpose: "adding a worker creates a surface in the right pane and zero new panes, leaving the coach pane geometry unchanged"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A mock multiplexer that records new-surface vs new-pane calls and pane geometry"
        - "An existing two-pane coach workspace (coach left, one worker right)"
    when:
      abstract: "a second worker is placed into the workspace"
    then:
      abstract:
        - "Exactly one new surface/tab is created inside the right pane"
        - "Zero new panes are created"
        - "The coach (left) pane geometry is unchanged from before the worker was added"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:consolidate-coach-workspace:D001-SMOKE-001-real-layout-holds-as-workers-added"
      id: "AC-SMOKE-001"
      purpose: "against a real multiplexer, adding workers keeps the coach pane at 50% and places workers as right-pane tabs"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "integration"
    given:
      abstract:
        - "A real cmux session with a coach pane and one worker"
    when:
      abstract: "three more workers are added to the workspace"
    then:
      abstract:
        - "The coach pane still occupies 50% of the workspace width"
        - "The three new workers appear as tabs inside the right pane (no new panes are created)"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
