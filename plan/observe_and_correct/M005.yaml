urn: "wmbt:observe-and-correct:M005"
step: "monitor"
direction: "minimize"
dimension: "likelihood"
object_of_control: "live-workers-whose-liveness-never-reaches-the-coach"
context_clarifier: "when a coach-spawned worker is running under its observer sidecar, the coach has no signal that the worker is still alive — today the worker's events.jsonl is empty because no persona prompt reliably emits heartbeats and LLM discretion is unreliable (workers already forget atdd agent done); the observer, being a per-worker LLM-neutral Python sidecar, must itself emit periodic atdd agent heartbeat events for its worker on a fixed cadence, through an adapter-neutral path that depends on no Claude-Code-specific hook so every ADAPTER_REGISTRY adapter (claude-code today; codex/gemini/glm later) inherits it for free"
lens: "functional.availability"
statement: "minimize likelihood of live-workers-whose-liveness-never-reaches-the-coach by having the observer sidecar emit periodic atdd agent heartbeat events for its worker on a fixed cadence, via an adapter-neutral mechanism that relies on no Claude-Code-specific hook and works identically for every adapter in ADAPTER_REGISTRY"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:M005-UNIT-001-observer-emits-heartbeat-on-cadence"
      id: "AC-UNIT-001"
      purpose: "The observer sidecar emits an atdd agent heartbeat event for its worker once per configured interval"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer sidecar is attached to a worker with a known canonical agent_id and a heartbeat interval of T seconds"
        - "The observer's clock is driven by a controllable fake so N intervals can be advanced deterministically"
        - "The worker's events.jsonl is empty at start"
    when:
      abstract: "The observer loop is advanced by N heartbeat intervals"
    then:
      abstract:
        - "Exactly N heartbeat events are appended to the worker's events.jsonl"
        - "Every emitted heartbeat event carries the worker's canonical agent_id"
        - "No heartbeat is emitted before the first full interval elapses"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:observe-and-correct:M005-UNIT-002-heartbeat-emission-is-adapter-agnostic"
      id: "AC-UNIT-002"
      purpose: "The heartbeat emission path is LLM-agnostic — it imports no Claude-Code-specific hook and emits identically regardless of which ADAPTER_REGISTRY adapter spawned the worker"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer sidecar attached to a worker whose adapter is set, in turn, to each entry of ADAPTER_REGISTRY (claude-code, codex, gemini, glm)"
        - "The observer's heartbeat-emission module is importable without any Claude-Code hook module on the path"
    when:
      abstract: "The observer loop is advanced by one heartbeat interval once per adapter"
    then:
      abstract:
        - "A heartbeat event is emitted for every adapter, with no adapter producing zero events"
        - "The emission module's import graph contains no Claude-Code-specific hook module"
        - "The emitted heartbeat payload is byte-identical in shape across all adapters"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:observe-and-correct:M005-SMOKE-001-real-observer-heartbeats-reach-coach"
      id: "AC-SMOKE-001"
      purpose: "A real observer sidecar attached to a live worker writes heartbeat events that the coach RuntimeWatcher observes"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "A real coach run with a spawned worker and its observer sidecar running against real runtime files"
    when:
      abstract: "The worker runs for at least two heartbeat intervals and the worker's events.jsonl is inspected"
    then:
      abstract:
        - "The worker's events.jsonl contains at least two heartbeat events with the worker's agent_id"
        - "The coach RuntimeWatcher reports the worker as live based on the observed heartbeats"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
