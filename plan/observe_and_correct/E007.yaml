urn: "wmbt:observe-and-correct:E007"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "cli-return-corrections-missing-submit-sentinel"
context_clarifier: "when _process_cli_return_line writes correction_text.encode('utf-8') verbatim to the pty master fd, it omits the submit sentinel that claude's TUI requires to dispatch the message. Claude's TUI uses bare Enter (`\\r`, carriage return) to submit — Shift+Enter adds a newline within a message. Without `\\r` appended, the correction bytes fill the TUI input box but are never dispatched: the agent sees nothing, forever. Even if defect 1 (startup race, fixed by E006) is addressed and the bytes reach claude's input parser, they sit in the input box unsubmitted. The fix: _process_cli_return_line appends the adapter-specific submit sentinel after the correction text. For claude-code the sentinel is `\\r`; the sentinel is configurable via PersonaShim(submit_sentinel=...) or ATDD_SHIM_SUBMIT_SENTINEL env var; explicit b'' disables appending for adapters that do not need a sentinel. (2026-05-26 issue #862)"
lens: "functional.effectiveness"
statement: "minimize quantity of cli-return-corrections-missing-submit-sentinel by appending the adapter-specific submit sentinel (default `\\r` for claude-code) to correction_text in _process_cli_return_line, with the sentinel configurable via PersonaShim(submit_sentinel=...) or ATDD_SHIM_SUBMIT_SENTINEL env var, so that every correction delivered via cli-return is automatically submitted to the adapter's TUI input parser"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:E007-UNIT-001-sentinel-appended-to-correction"
      id: "AC-UNIT-001"
      purpose: "_process_cli_return_line appends the submit sentinel (`\\r` by default for claude-code) to correction_text before writing to the pty; the pty_write_sink receives correction_text + sentinel"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A PersonaShim instance with a pty_write_sink capturing all writes"
        - "submit_sentinel is b'\\r' (the claude-code default)"
        - "A cli-return.jsonl entry with correction_text 'hello world'"
    when:
      abstract: "poll_once() is called"
    then:
      abstract:
        - "The pty_write_sink receives b'hello world\\r'"
        - "The sentinel byte appears exactly once, at the end of the payload"
        - "The original correction_text ('hello world') is unchanged in cli-return.jsonl"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-26"
  - identity:
      urn: "acc:observe-and-correct:E007-UNIT-002-sentinel-configurable-per-adapter"
      id: "AC-UNIT-002"
      purpose: "The submit sentinel is configurable: PersonaShim(submit_sentinel=b'\\n') uses LF; ATDD_SHIM_SUBMIT_SENTINEL env var overrides; PersonaShim(submit_sentinel=b'') disables sentinel appending entirely"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "Three PersonaShim instances: one with submit_sentinel=b'\\n', one reading ATDD_SHIM_SUBMIT_SENTINEL='\\n' from env, one with submit_sentinel=b'' (disabled)"
        - "Each has a pty_write_sink and a cli-return.jsonl entry with correction_text 'test'"
    when:
      abstract: "poll_once() is called on each instance"
    then:
      abstract:
        - "The first sink receives b'test\\n'"
        - "The second sink receives b'test\\n' (env var override effective)"
        - "The third sink receives b'test' with no trailing byte (disabled)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-26"
  - identity:
      urn: "acc:observe-and-correct:E007-UNIT-003-existing-e003-tests-pass-with-sentinel-disabled"
      id: "AC-UNIT-003"
      purpose: "Pre-existing E003 unit tests that assert exact byte payloads remain GREEN when PersonaShim is constructed with submit_sentinel=b'' (no-sentinel mode), confirming the sentinel is additive and does not break existing tests"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The full E003 unit test suite (test_e003_unit_*.py) run with PersonaShim constructed with submit_sentinel=b''"
    when:
      abstract: "The E003 unit tests execute"
    then:
      abstract:
        - "All E003 unit tests pass: no byte-payload assertions fail because the sentinel is absent when explicitly disabled"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-26"
  - identity:
      urn: "acc:observe-and-correct:E007-SMOKE-001-sentinel-enables-tui-submission"
      id: "AC-SMOKE-001"
      purpose: "A synthetic 'echo-on-enter' agent echoes received lines prefixed with ECHO: only when a carriage return is received; with submit_sentinel=b'\\r' the correction is echoed; without it the echo does not appear"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd-shim is installed as a CLI entry point"
        - "A synthetic 'echo-on-enter' agent script reads input in raw mode: it only emits 'ECHO:<text>' to output.log when a carriage return (`\\r`) is received, buffering otherwise"
        - "The TUI ready-marker appears immediately on start"
        - "A cli-return.jsonl entry contains correction_text 'SUBMIT_SENTINEL_TEST' (no \\r)"
        - "PersonaShim is launched with submit_sentinel=b'\\r'"
    when:
      abstract: "atdd-shim wraps the echo-on-enter agent and poll_once() delivers the correction"
    then:
      abstract:
        - "output.log contains 'ECHO:SUBMIT_SENTINEL_TEST' within 5 seconds (sentinel triggered submission)"
        - "Running the same fixture with submit_sentinel=b'' produces NO 'ECHO:' line (demonstrating the sentinel is required)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-26"
