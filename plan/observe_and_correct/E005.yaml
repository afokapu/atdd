urn: "wmbt:observe-and-correct:E005"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "atdd-shim-popen-missing-env-kwarg-for-typed-env-override-delivery"
context_clarifier: "The atdd-shim CLI entry point (src/atdd/coach/shim/__main__.py) currently has no --env flag and PersonaShim has no env_overrides parameter. When _build_shim_command (E016) emits '--env KEY=VALUE' flags, atdd-shim must parse them and PersonaShim.run() must pass them to subprocess.Popen via env= kwarg. Without this, the shim-side half of the Shape-A fix is missing: atdd-shim's argparse rejects --env as unknown, and even if it were accepted, PersonaShim.run() passes no env to Popen so the override is silently dropped."
lens: "functional.effectiveness"
statement: "minimize likelihood of atdd-shim-popen-missing-env-kwarg-for-typed-env-override-delivery by adding a repeatable --env KEY=VALUE argument to atdd-shim's argparse, updating PersonaShim.__init__ to accept env_overrides: dict[str, str], and having PersonaShim.run() merge env_overrides on top of os.environ and pass the result to subprocess.Popen via the env= kwarg — completing the Shape-A fix so ATDD_AGENT_ID reaches the spawned adapter process without a shell"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:E005-UNIT-001-shim-main-parses-env-flag"
      id: "AC-UNIT-001"
      purpose: "atdd-shim __main__.main parses '--env KEY=VALUE' (repeatable) and builds an env_overrides dict passed to PersonaShim; unknown --env values do not raise SystemExit"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A minimal argv: ['--agent-id', 'x-001', '--runtime-dir', '/tmp/r', '--env', 'ATDD_AGENT_ID=x-001', '--', 'true']"
    when:
      abstract: "atdd-shim.__main__._build_parser().parse_args(argv) is called"
    then:
      abstract:
        - "args.env equals ['ATDD_AGENT_ID=x-001']"
        - "No SystemExit or argparse error is raised"
        - "When '--env' appears twice, both values appear in args.env"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
  - identity:
      urn: "acc:observe-and-correct:E005-UNIT-002-persona-shim-applies-env-overrides-to-popen"
      id: "AC-UNIT-002"
      purpose: "PersonaShim constructed with env_overrides={'ATDD_AGENT_ID': 'x-001'} passes a merged env to subprocess.Popen that contains ATDD_AGENT_ID=x-001; the spawned process can read the variable"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A PersonaShim instance with spawn_command=['python3', '-c', 'import os,sys; sys.exit(0 if os.environ.get(\"ATDD_AGENT_ID\")==\"x-001\" else 1)']"
        - "env_overrides={'ATDD_AGENT_ID': 'x-001'}"
        - "A real temporary runtime_dir"
    when:
      abstract: "shim.run() is called"
    then:
      abstract:
        - "The spawned Python process exits with code 0 (env var present and correct)"
        - "subprocess.Popen was called with an env dict containing 'ATDD_AGENT_ID': 'x-001'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
  - identity:
      urn: "acc:observe-and-correct:E005-UNIT-003-regression-argv-leading-key-value-fails-without-fix"
      id: "AC-UNIT-003"
      purpose: "A unit test calling atdd-shim with argv ['--agent-id', 'x', '--runtime-dir', '/tmp', '--', 'ATDD_AGENT_ID=x', 'python3', '-c', 'pass'] (old broken path) would raise FileNotFoundError; with the fix in place, this argv is never produced by _build_shim_command"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A PersonaShim instance with spawn_command=['ATDD_AGENT_ID=x', 'python3', '-c', 'pass'] (simulates old broken argv)"
        - "env_overrides={} (no override)"
        - "A real temporary runtime_dir"
    when:
      abstract: "shim.run() is called"
    then:
      abstract:
        - "subprocess.Popen raises FileNotFoundError (exec of 'ATDD_AGENT_ID=x' fails)"
        - "This documents the bug and confirms the fix prevents it via _build_shim_command always using --env flags"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
  - identity:
      urn: "acc:observe-and-correct:E005-SMOKE-001-full-shim-spawn-with-env-override"
      id: "AC-SMOKE-001"
      purpose: "End-to-end: invoke the installed atdd-shim binary with --env ATDD_AGENT_ID=smoke-test-001 wrapping a synthetic adapter that echoes $ATDD_AGENT_ID; assert the sentinel value appears in the shim output within 10 s"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "atdd-shim is installed as a CLI entry point"
        - "A temporary runtime-dir exists"
        - "A synthetic adapter script that prints the value of ATDD_AGENT_ID to stdout"
    when:
      abstract: "atdd-shim --agent-id smoke-test-001 --runtime-dir <tmp> --env ATDD_AGENT_ID=smoke-test-001 -- <synthetic_script> is invoked as a subprocess with stdout=PIPE"
    then:
      abstract:
        - "The sentinel string 'smoke-test-001' appears in captured stdout within 10 s"
        - "The shim process exits with return code 0"
        - "output.log in the agent dir contains the sentinel string"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
