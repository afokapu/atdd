urn: "wmbt:observe-and-correct:E004"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-09-01
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "persona-shim-spawn-dispatch-wiring-gaps"
context_clarifier: "when PersonaShim (shipped in #824, v3.80.2) exists in src/atdd/coach/shim/ but is referenced in zero production files — spawn.py, coach.py, handlers/spawn.py all contain zero imports of PersonaShim — so every `atdd coach <N>` / `atdd spawn` run launches a bare adapter command (claude ...) directly inside a cmux surface with no shim. Nothing drains cli-return.jsonl. Observer corrections written by the coach reach no consumer, reproducing exactly the original measurement: 0 corrections in 139,896 heartbeats (2026-05-20). PersonaShim (#824) already owns the pty, polls cli-return.jsonl, and forwards operator stdin; cmd_spawn must wrap the adapter command in the shim and prime cli-return.jsonl with the launch prompt before the shim starts, skipping the post-boot paste_text + send_key path when ATDD_CORRECTION_TRANSPORT=cli-return."
lens: "functional.effectiveness"
statement: "minimize quantity of persona-shim-spawn-dispatch-wiring-gaps by routing cmd_spawn's adapter command through PersonaShim — the shim becomes the pane foreground process and the adapter runs in its pty — writing the launch prompt as the first cli-return.jsonl entry before spawn so the shim delivers it as the first agent turn (no post-boot paste_text + send_key when cli-return transport is active), adding a real integration SMOKE test that drives the actual atdd spawn entry point (not a synthetic agent), and retitling test_e003_smoke_001 as a component smoke so it is not mistaken for the wiring guarantee"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:E004-UNIT-003-fallback-to-direct-dispatch-when-no-cli-return"
      id: "AC-UNIT-003"
      purpose: "When ATDD_CORRECTION_TRANSPORT is unset or set to any value other than cli-return, cmd_spawn falls back to the existing direct-adapter dispatch path — no shim wrapper, launch prompt delivered via paste_text + send_key as before"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "ATDD_CORRECTION_TRANSPORT is either unset or set to 'multiplexer-send'"
        - "cmd_spawn is called with a FakeMultiplexer"
    when:
      abstract: "cmd_spawn executes"
    then:
      abstract:
        - "The command string passed to the surface is the bare adapter command (not wrapped in atdd-shim)"
        - "No cli-return.jsonl priming entry is written before surface creation"
        - "The existing _wait_for_claude_ready + paste_text path executes as normal"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-22"
