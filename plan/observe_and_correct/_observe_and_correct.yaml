    from: wagon:freeze-runtime-contracts
  - name: commons:coach:runtime-event-schema
    from: wagon:freeze-runtime-contracts
  - name: commons:coach:runtime-layout-doc
    from: wagon:freeze-runtime-contracts
  - name: commons:coach:event-semantics-doc
    from: wagon:freeze-runtime-contracts

wmbt:
  total: 5
  L001: "minimize effort of locating-active-coach-surface-state"
  E001: "minimize effort of approving-known-safe-cross-surface-prompts"
  E003: "minimize quantity of observer-correction-loop-activation-gaps"
  C001: "minimize likelihood of behavioral-regression-against-babysit-baseline"
  C002: "minimize likelihood of smoke-tests-that-pass-ci-while-substituting-their-declared-boundary"
