wagon: observe-and-correct
urn: "wagon:observe-and-correct"
name: "Observe And Correct"
description: "Detect-and-correct observer sidecar for coach v9: implements `atdd observer` (run/attach/status/aggregate-approve), event-driven runtime watcher, all 17 default observer rules per spec §8.3 (basic protocol rules 01–05/08/09, absorbed-from-babysit rules 06/13/14/15/16, substrate-aware rules 10/11/12/17), three correction injection paths (CLI return-path, multiplexer send-keys, kill-and-respawn), dashboard parity with `atdd babysit`, aggregate-approval batch action, and the babysit parity test suite that gates decommissioning"
theme: commons

subject: "agent:coach"
context: "during-active-coach-runs, agent-sidecars-must-detect-and-correct-protocol-violations-in-real-time"
action: "tails agent output, watches worktrees, runs detection rules, and writes structured corrections back into the agent feedback loop"
goal: "replace babysit's polling-and-fixed-pattern model with an event-driven, extensible observer that catches protocol-level issues before tier-1 validators do"
outcome: "`atdd observer run` operates as the coach's standing detect-and-correct sidecar, with 17 default rules wired in, dashboard + aggregate-approve operator surfaces at parity with babysit, and a parity test suite proving behavioral equivalence before babysit is decommissioned"

features:
  - urn: "feature:observe-and-correct:observer-operator-surface"
  - urn: "feature:observe-and-correct:shim-cli-return-delivery"

produce:
  - name: commons:coach:observer-command
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-correction-injection-paths
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-rule-registry
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-rules-basic-protocol
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-rule-token-threshold
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-rules-babysit-absorbed
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-rules-substrate-aware
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-status-dashboard
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-aggregate-approve
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:babysit-parity-test-suite
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-worker-heartbeat-emitter
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-blocked-worker-detector
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:observer-ask-answer-roundtrip
    contract: null
    telemetry: null
