urn: "feature:observe-and-correct:observer-runtime-and-rules"
wagon: "wagon:observe-and-correct"
description: "Event-driven observer sidecar runtime plus the full set of 17 default detection rules from spec §8.3. Delivers `atdd observer run/attach`, three correction injection paths (CLI return-path, multiplexer send-keys, kill-and-respawn), the `.atdd/observer/rules/*.yaml` registry, and the rule implementations for: 01-unstructured-question, 02-token-silence, 03-completion-claim-without-commit, 04-out-of-scope-edit, 05-missed-heartbeat, 06-token-threshold, 08-reviewer-edit-attempt, 09-validator-failure-ignored, 10-stale-suppression-detected, 11-unbound-rule-id-in-validator, 12-rule-id-grammar-violation, 13-bash-auto-approve, 14-canonical-naming-drift, 15-layout-drift, 16-smoke-skip, 17-repo-rule-disposition-declared. Rule failure isolation, alphabetical-but-order-independent loading, and per-rule fault surfacing are first-class."
sizing:
  wmbts: 7
  footprint_score: 24
  footprint_size: "L"
wmbts:
  - "wmbt:observe-and-correct:P001"
  - "wmbt:observe-and-correct:P002"
  - "wmbt:observe-and-correct:M001"
  - "wmbt:observe-and-correct:M002"
  - "wmbt:observe-and-correct:M003"
  - "wmbt:observe-and-correct:M004"
  - "wmbt:observe-and-correct:E002"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "`atdd observer run/attach` CLI subcommands wired into src/atdd/coach/commands/observer.py"
    application:
      - type: "use_cases"
        count: 4
        rationale: "Tail-and-detect loop, correction-injection dispatcher, rule-registry loader with fault isolation, and per-rule evaluation orchestrator"
      - type: "use_cases"
        count: 4
        rationale: "Issue #713 input acquisition: persona-dir resolver, multiplexer surface-capture into output.log, ObservedInput field population (now/last_token_at/heartbeat_mtime), and the universal observer status-line renderer"
    domain:
      - type: "value_objects"
        count: 17
        rationale: "Each of the 17 default observer rules is a value-object encoding trigger predicate + correction text + rule_id binding"
    integration:
      - type: "schemas"
        count: 0
        rationale: "Schemas are consumed (correction.schema.json, runtime-event.schema.json) from wagon:freeze-runtime-contracts; this feature does not produce new schemas"
      - type: "absorbed_modules"
        count: 6
        rationale: "Absorbs `load_token_alert_threshold`, `read_token_count`, `check_token_threshold`, `classify_prompt`, `correct_naming_drift`, `correct_layout_drift` from commands/babysit.py with behavior preserved per §0.2"
