urn: "feature:observe-and-correct:observer-operator-surface"
wagon: "wagon:observe-and-correct"
description: "Operator-facing observer surfaces that absorb babysit's user-visible behavior plus the parity test suite that gates babysit decommissioning. Delivers `atdd observer status` (dashboard at parity with `atdd babysit` — `_render_dashboard`, `SurfaceRow`, `_format_hms`, `_extract_surface_state`), `atdd observer aggregate-approve [--scope <ids>]` (batch-approve known-safe prompts across active sessions, absorbs `aggregate_approve` and `AggregateApprovalResult`), and a fixture-driven parity test suite at tests/integration/test_babysit_observer_parity.py covering token alert, bash auto-approve, naming drift, layout drift, smoke skip, dashboard rendering, and aggregate-approve. The parity test suite gates #P6 — CI failure on this suite blocks babysit decommissioning."
sizing:
  wmbts: 3
  footprint_score: 8
  footprint_size: "M"
wmbts:
  - "wmbt:observe-and-correct:L001"
  - "wmbt:observe-and-correct:E001"
  - "wmbt:observe-and-correct:C001"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 2
        rationale: "`atdd observer status` and `atdd observer aggregate-approve` CLI subcommands"
    application:
      - type: "use_cases"
        count: 2
        rationale: "Surface-state aggregator (reads from .atdd/runtime/agents/*/) and cross-surface batch-approval orchestrator"
    domain:
      - type: "value_objects"
        count: 2
        rationale: "SurfaceRow (dashboard row contract) and AggregateApprovalResult (batch outcome contract), absorbed verbatim from babysit"
    integration:
      - type: "test_suites"
        count: 1
        rationale: "tests/integration/test_babysit_observer_parity.py — fixture-driven parity coverage with at least 7 scenarios, runtime budget <60s, gating #P6 decommissioning"
