urn: "feature:observe-and-correct:worker-coach-event-loop"
wagon: "wagon:observe-and-correct"
description: "LLM-agnostic worker->coach event loop: the observer sidecar emits heartbeat (M005), detects a blocked/idle worker and emits ask/escalate (M006), and round-trips an ask answer back into the worker so it unblocks (R001)."
sizing:
  wmbts: 3
  footprint_score: 12
  footprint_size: "M"
wmbts:
  - "wmbt:observe-and-correct:M005"
  - "wmbt:observe-and-correct:M006"
  - "wmbt:observe-and-correct:R001"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "The atdd observer run loop hosts the emit cadence and the answer-delivery callback — the single per-worker LLM-neutral sidecar surface that drives heartbeat/ask/escalate emission and the ask round-trip"
    application:
      - type: "use_cases"
        count: 3
        rationale: "Periodic heartbeat emission (M005), blocked/idle detection that emits ask/escalate (M006), and ask-answer round-trip delivery back into the worker (R001) — three discrete observer-application use cases"
    domain:
      - type: "specifications"
        count: 1
        rationale: "A blocked/idle worker detection predicate (extending observer predicates.py) decides ask vs escalate vs healthy without false-positiving on a quiet-but-working worker"
    integration:
      - type: "clients"
        count: 1
        rationale: "An adapter-neutral emitter that invokes atdd agent heartbeat/ask/escalate and the return-path delivery — depends on no Claude-Code-specific hook so every ADAPTER_REGISTRY adapter inherits it"
  frontend:
    presentation:
      - type: "components"
        count: 0
        rationale: "No frontend surface — the observer is a CLI-only coach sidecar"
