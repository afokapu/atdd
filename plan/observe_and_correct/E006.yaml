urn: "wmbt:observe-and-correct:E006"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "launch-prompt-delivery-races-before-tui-is-ready"
context_clarifier: "when PersonaShim._run_loop calls poll_once() on the very first iteration immediately after Popen returns — before claude's TUI has finished bootstrapping and claimed the pty for its input handler — the launch prompt bytes written to the pty master fd are echoed by the kernel pty driver and appear as plain terminal text above claude's TUI region. Claude renders its TUI on top and never sees the bytes; the agent sits idle forever. Empirically claude takes 1–3 seconds to bootstrap its TUI. The fix inserts a wait-for-ready gate: (a) poll output.log for a TUI ready-marker substring (default `❯`), falling back to (b) a configurable bootstrap delay (ATDD_SHIM_BOOTSTRAP_DELAY_S, default 2.5s) when the marker never appears. The first poll_once() call is withheld until the gate clears. Named E006 because sibling issues #860 and #861 each author an E005 in this wagon. (2026-05-26 issue #862)"
lens: "functional.effectiveness"
statement: "minimize quantity of launch-prompt-delivery-races-before-tui-is-ready by inserting a wait-for-ready gate into _run_loop that blocks the first poll_once() call until either a TUI ready-marker (ATDD_SHIM_READY_MARKER, default `❯`) is observed in output.log or a configurable bootstrap delay (ATDD_SHIM_BOOTSTRAP_DELAY_S, default 2.5) elapses, whichever comes first"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:E006-UNIT-001-run-loop-blocks-poll-until-ready-marker"
      id: "AC-UNIT-001"
      purpose: "_run_loop does not call poll_once() until the TUI ready-marker appears in output.log; once the marker appears, subsequent cli-return.jsonl entries are delivered normally"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A PersonaShim instance with a pty_write_sink and a temp agent dir"
        - "output.log does NOT contain the ready-marker at startup; a synthetic child process writes the marker after 0.2s"
        - "ATDD_SHIM_BOOTSTRAP_DELAY_S is set to 5.0 (longer than the marker appearance)"
        - "A cli-return.jsonl entry is primed before the shim starts"
    when:
      abstract: "The shim's _run_loop runs until the process exits"
    then:
      abstract:
        - "poll_once() is not called before the ready-marker appears in output.log (no entry delivered before 0.2s)"
        - "After the marker appears, the cli-return.jsonl entry is delivered to the pty_write_sink"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-26"
  - identity:
      urn: "acc:observe-and-correct:E006-UNIT-002-bootstrap-delay-fallback"
      id: "AC-UNIT-002"
      purpose: "When the TUI ready-marker never appears in output.log, the shim falls back to starting cli-return delivery after ATDD_SHIM_BOOTSTRAP_DELAY_S seconds have elapsed since process spawn"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A PersonaShim instance with a pty_write_sink and a temp agent dir"
        - "ATDD_SHIM_BOOTSTRAP_DELAY_S is set to 0.2 (short for test speed)"
        - "output.log receives NO ready-marker content during the run"
        - "A cli-return.jsonl entry is primed before the shim starts"
    when:
      abstract: "The shim's _run_loop runs until the process exits"
    then:
      abstract:
        - "The cli-return.jsonl entry is NOT delivered before 0.2 seconds have elapsed"
        - "After 0.2 seconds, poll_once() is called and the entry IS delivered to the pty_write_sink"
        - "No crash or hang occurs when the ready-marker never appears"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-26"
  - identity:
      urn: "acc:observe-and-correct:E006-UNIT-003-ready-marker-configurable"
      id: "AC-UNIT-003"
      purpose: "The TUI ready-marker pattern is configurable via ATDD_SHIM_READY_MARKER (default: `❯`); the shim scans the tail of output.log for the marker byte string"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A PersonaShim with ATDD_SHIM_READY_MARKER set to a custom ASCII string 'READY_SENTINEL'"
        - "ATDD_SHIM_BOOTSTRAP_DELAY_S is large (10.0) so delay does not fire first"
        - "output.log gains the custom marker string after 0.1s"
    when:
      abstract: "The shim's _run_loop runs"
    then:
      abstract:
        - "poll_once() is not called before 'READY_SENTINEL' appears in output.log"
        - "poll_once() is called after 'READY_SENTINEL' appears"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-26"
  - identity:
      urn: "acc:observe-and-correct:E006-SMOKE-001-delivery-waits-for-tui"
      id: "AC-SMOKE-001"
      purpose: "With a synthetic process that has a known TUI-startup delay, cli-return.jsonl entries are not delivered until after the ready-marker appears in output.log"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd-shim is installed as a CLI entry point"
        - "A synthetic 'slow-start' agent script sleeps 1s, then writes the ready-marker to its stdout, then reads from stdin and echoes received lines prefixed with RECV:"
        - "A cli-return.jsonl entry with correction_text 'WAIT_GATE_TEST' is primed before launch"
        - "ATDD_SHIM_BOOTSTRAP_DELAY_S is set to 5.0 (longer than the 1s marker delay)"
        - "ATDD_SHIM_READY_MARKER is set to the marker the synthetic script emits"
    when:
      abstract: "atdd-shim is launched wrapping the slow-start agent"
    then:
      abstract:
        - "output.log does NOT contain 'RECV:WAIT_GATE_TEST' within the first 0.5 seconds (gate held delivery)"
        - "output.log DOES contain 'RECV:WAIT_GATE_TEST' after the marker appears (gate released delivery)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-26"
