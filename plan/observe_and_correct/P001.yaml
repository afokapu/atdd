urn: "wmbt:observe-and-correct:P001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "prepare"
direction: "minimize"
dimension: "quantity"
object_of_control: "observer-runtime-skeleton-gaps"
context_clarifier: "when coach v9 needs an event-driven sidecar process per agent that tails output.log, watches the worktree, loads detection rules from .atdd/observer/rules/*.yaml, dispatches corrections via three injection paths (CLI return-path default, multiplexer send-keys for stuck agents, kill-and-respawn for catastrophic failure), and isolates rule-level faults so a single buggy rule cannot crash the observer or silently mask other detections"
lens: "functional.effectiveness"
statement: "minimize quantity of observer-runtime-skeleton-gaps when coach v9 needs an event-driven detect-and-correct sidecar with three correction injection paths, an alphabetically-loaded but evaluation-order-independent rule registry, and per-rule fault isolation so a buggy rule never crashes the observer or silently swallows other detections"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-001-observer-run-tails-log"
      id: "AC-UNIT-001"
      purpose: "`atdd observer run --agent-id <id>` starts and tails the agent's output.log, watching the worktree per §8.1"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/observer.py exposes a `run` subcommand"
        - "An agent runtime directory exists at .atdd/runtime/agents/<id>/ with output.log"
    when:
      abstract: "An operator invokes `atdd observer run --agent-id <id>`"
    then:
      abstract:
        - "The observer process starts and tails the agent's output.log"
        - "The observer watches the worktree associated with the agent"
        - "Detection rules from .atdd/observer/rules/*.yaml are discovered and loaded"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-002-correction-fires-and-writes"
      id: "AC-UNIT-002"
      purpose: "A simulated detection rule fires and writes a correction to corrections.jsonl conforming to the correction schema from C0"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A test rule loaded into the observer that fires on a known synthetic input"
        - "The correction.schema.json contract from wagon:freeze-runtime-contracts is in scope"
    when:
      abstract: "The observer evaluates the rule against the synthetic input"
    then:
      abstract:
        - "The rule fires and the observer writes a correction record to .atdd/runtime/agents/<id>/corrections.jsonl"
        - "The record validates against correction.schema.json (agent_id, rule_id, severity, disposition, correction_text, injection_method)"
        - "The default injection_method is `cli-return` per §8.2 path 1"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-003-attach-prints-recent-observations"
      id: "AC-UNIT-003"
      purpose: "`atdd observer attach --agent-id <id>` prints recent observations for the named agent"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer has been running for an agent and has emitted at least one correction record"
    when:
      abstract: "An operator invokes `atdd observer attach --agent-id <id>`"
    then:
      abstract:
        - "The command prints recent observations for that agent"
        - "Output includes rule_id, timestamp, and correction_text per observation"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-004-rule-failure-isolation"
      id: "AC-UNIT-004"
      purpose: "Each rule loads, evaluates, and emits independently — a rule that raises an unhandled exception is logged with its rule_id and marked faulty for the run, without crashing the observer or affecting other rules"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "Two rules are loaded: rule A always raises an unhandled exception during evaluation; rule B is well-formed and would fire on the same input"
    when:
      abstract: "The observer evaluates both rules against an input that satisfies B"
    then:
      abstract:
        - "Rule A's exception is caught; the observer process does not crash"
        - "Rule A is marked faulty for the remainder of the run with its rule_id captured"
        - "Rule B still evaluates and fires; B's correction is recorded normally"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-005-rule-loading-order-independent"
      id: "AC-UNIT-005"
      purpose: "Rules in .atdd/observer/rules/ load in alphabetical order but evaluation order does not affect outcome; rules cannot depend on side effects of other rules' evaluation"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A test set of rules covering protocol, token, drift, and substrate categories"
    when:
      abstract: "The observer is invoked twice — once with the natural alphabetical order, once with a forced reverse load order"
    then:
      abstract:
        - "Both invocations against identical input produce the same set of corrections"
        - "No rule observes side effects from another rule's evaluation"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-006-rule-load-error-surfaced"
      id: "AC-UNIT-006"
      purpose: "Rule-level errors are surfaced via stderr warning and a corrections.jsonl entry with meta: rule_load_error, so operators see the failure rather than silently missing detections"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A rule YAML at .atdd/observer/rules/ that fails to parse or fails to bind its rule_id at load time"
    when:
      abstract: "The observer starts and discovers the malformed rule"
    then:
      abstract:
        - "A one-time warning is emitted to stderr identifying the rule file and the failure mode"
        - "An entry is appended to corrections.jsonl with meta: rule_load_error referencing the rule path"
        - "The observer continues to run with the remaining well-formed rules"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-007-three-injection-paths-available"
      id: "AC-UNIT-007"
      purpose: "All three correction injection paths from §8.2 are implemented and selectable per correction: CLI return-path (default), multiplexer send-keys (stuck agents), kill-and-respawn (catastrophic failure)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer instance with the three injection-path implementations wired in"
    when:
      abstract: "Three rules are evaluated, each requesting a distinct injection_method"
    then:
      abstract:
        - "The cli-return injection path emits the correction back through the agent's CLI return channel"
        - "The multiplexer send-keys path delivers correction text via the multiplexer abstraction (cmux/zellij/tmux)"
        - "The kill-and-respawn path terminates the agent process and triggers respawn through coach"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-008-cmd-run-exits-when-persona-dir-removed"
      id: "AC-UNIT-008"
      purpose: "`cmd_run` exits 0 on its own when its persona runtime dir is deleted while running — no kill signal needed"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "cmd_run started in a background thread with a short poll_interval"
        - "The persona runtime dir exists at start"
    when:
      abstract: "The persona runtime dir is deleted while cmd_run is looping"
    then:
      abstract:
        - "cmd_run returns 0 without receiving SIGINT or SIGTERM"
        - "The return happens within 3 × poll_interval seconds of deletion"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-009-cmd-run-exits-after-idle-timeout"
      id: "AC-UNIT-009"
      purpose: "`cmd_run` exits 0 after a configurable idle timeout with no persona output.log activity"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "cmd_run started with idle_timeout=1.0 and a short poll_interval"
        - "The persona runtime dir exists but output.log is never written"
    when:
      abstract: "idle_timeout seconds elapse with no persona activity"
    then:
      abstract:
        - "cmd_run returns 0 without receiving any signal"
        - "The function accepts idle_timeout as a keyword argument"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"
  - identity:
      urn: "acc:observe-and-correct:P001-UNIT-010-teardown-fixture-reaps-observer-procs"
      id: "AC-UNIT-010"
      purpose: "A pytest fixture in conftest.py registers observer subprocesses and terminates them after each test so no orphans remain"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A test uses the observer_proc fixture to spawn a subprocess"
        - "The subprocess is still alive at the end of the test body"
    when:
      abstract: "pytest fixture teardown runs after the test body returns"
    then:
      abstract:
        - "The subprocess is terminated (SIGTERM then SIGKILL if necessary)"
        - "The process is no longer alive after teardown"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"
