urn: "wmbt:observe-and-correct:E002"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "per-worker-observer-processes-spawned-by-coach"
context_clarifier: "when coach orchestrates N workers in parallel, the current model spawns one observer process per worker (N × observer), each with its own independent poll loop shelling out to git/gh/cmux, and each co-spawning a visible ':obs' multiplexer surface. A single observer per coach — watching all active runtime dirs under .atdd/runtime/agents/* in one event-driven/debounced loop (sleep >= 1.0s, never sub-second) — covers the same monitoring ground with 1 process, zero ':obs' surfaces, and one clean reap path on coach exit."
lens: "functional.efficiency"
statement: "minimize quantity of per-worker-observer-processes-spawned-by-coach by replacing N per-worker observer spawns with a single MultiAgentObserver that starts alongside the coach, watches all active agent runtime dirs in one debounced loop (poll_interval >= 1.0s), creates no per-worker ':obs' multiplexer surfaces, and terminates cleanly when the coach exits"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:E002-UNIT-001-coach-starts-one-observer"
      id: "AC-UNIT-001"
      purpose: "coach._execute_cold_start starts exactly one observer regardless of how many workers are driven"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fake spawn handler that records calls and a MultiAgentObserver injected via a test seam"
        - "Coach configured with 3 issues to drive concurrently"
    when:
      abstract: "_execute_cold_start is invoked with _max_loop_events=0 (skip event loop) and a captured observer sink"
    then:
      abstract:
        - "Exactly one MultiAgentObserver is started (observer.start() called once)"
        - "Observer.stop() is called once after all waves complete"
        - "No per-worker _spawn_observer call is made"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"
  - identity:
      urn: "acc:observe-and-correct:E002-UNIT-002-multiagent-observer-watches-all-dirs"
      id: "AC-UNIT-002"
      purpose: "MultiAgentObserver discovers and scans all agent dirs under runtime_root/agents/* in a single loop iteration"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A runtime_root/agents/ directory containing 3 agent subdirectories (agent-A, agent-B, agent-C)"
        - "Each agent dir has an output.log file with some content"
    when:
      abstract: "MultiAgentObserver._loop_once() is invoked (single iteration helper)"
    then:
      abstract:
        - "scan_once() is called for each of the 3 agents (agent-A, agent-B, agent-C)"
        - "No agent dir is skipped"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"
  - identity:
      urn: "acc:observe-and-correct:E002-UNIT-003-observer-debounced-no-subsecond-poll"
      id: "AC-UNIT-003"
      purpose: "MultiAgentObserver poll_interval is >= 1.0s by default and the loop does not busy-wait"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "MultiAgentObserver constructed with default arguments"
    when:
      abstract: "The observer's poll_interval attribute is inspected; a sub-second value is passed to the constructor"
    then:
      abstract:
        - "Default poll_interval >= 1.0 (not sub-second)"
        - "Passing poll_interval=0.1 is clamped or raised — the observer never runs tighter than 1.0s"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"
  - identity:
      urn: "acc:observe-and-correct:E002-UNIT-004-no-per-worker-obs-surface"
      id: "AC-UNIT-004"
      purpose: "cmd_spawn and handlers/spawn.handle create no ':obs' multiplexer surface for any worker"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A FakeMultiplexer injected into both cmd_spawn and handlers/spawn.handle"
        - "A valid spawn call for a worker in pane mode and workspace mode"
    when:
      abstract: "cmd_spawn is invoked (pane mode) and handlers/spawn.handle is invoked (workspace mode)"
    then:
      abstract:
        - "FakeMultiplexer.calls contains no entry with name ending in ':obs'"
        - "new_persona_surface is NOT called — a plain new_surface is used for the worker"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"
  - identity:
      urn: "acc:observe-and-correct:E002-UNIT-005-observer-terminates-on-coach-exit"
      id: "AC-UNIT-005"
      purpose: "MultiAgentObserver.stop() signals the internal thread to stop and joins it within a reasonable timeout"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A MultiAgentObserver that has been started (start() called)"
    when:
      abstract: "stop() is called"
    then:
      abstract:
        - "The observer's _stop event is set"
        - "The background thread terminates within 3.0 seconds after stop() returns"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"
