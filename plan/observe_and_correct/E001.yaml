urn: "wmbt:observe-and-correct:E001"
step: "execute"
direction: "minimize"
dimension: "effort"
object_of_control: "approving-known-safe-cross-surface-prompts"
context_clarifier: "when several coach-orchestrated agents simultaneously hit a tool-prompt covered by `babysit.bash_auto_approve_patterns` but blocked by an outer permission scope — today the operator must visit each surface individually. The legacy `aggregate_approve` and `AggregateApprovalResult` from commands/babysit.py absorb into `atdd observer aggregate-approve [--scope <ids>]` per §5.4 and §0.2, sharing the same bash-pattern source as rule 13 (#L4)"
lens: "functional.efficiency"
statement: "minimize effort of approving-known-safe-cross-surface-prompts by absorbing `aggregate_approve` and `AggregateApprovalResult` into `atdd observer aggregate-approve [--scope <ids>]`, batch-approving matching prompts across active sessions with one operator action and parity to babysit's existing behavior"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:E001-UNIT-001-scope-batch-approves"
      id: "AC-UNIT-001"
      purpose: "`atdd observer aggregate-approve --scope 358,359` approves matching prompts across the named issues' sessions in a single operator action"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "Two active agent sessions for issues 358 and 359, each currently blocked on a tool prompt that matches a known-safe `babysit.bash_auto_approve_patterns.rules` entry"
    when:
      abstract: "An operator invokes `atdd observer aggregate-approve --scope 358,359`"
    then:
      abstract:
        - "Both sessions' matching prompts are approved in a single batch"
        - "Bash patterns are read via the same path as rule 13 (#L4)"
        - "Output reports approved-prompt count, refused-prompt count, and any per-surface errors via the absorbed AggregateApprovalResult shape"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:E001-UNIT-002-parity-with-babysit-aggregate-approve"
      id: "AC-UNIT-002"
      purpose: "Output is at parity with `atdd babysit` aggregate-approve at time of decommissioning"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fixture set of multi-surface scenarios with auto-approvable prompts"
        - "The babysit and observer aggregate-approve implementations exercised against the same fixtures"
    when:
      abstract: "Both implementations are run"
    then:
      abstract:
        - "Both approve the same set of prompts for each fixture"
        - "Parity is documented as a gating condition for #P6 (babysit decommissioning)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
