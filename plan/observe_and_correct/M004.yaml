urn: "wmbt:observe-and-correct:M004"
step: "monitor"
direction: "minimize"
dimension: "likelihood"
object_of_control: "undetected-substrate-rule-id-and-suppression-violations"
context_clarifier: "when an agent commit touches a file with a stale `# atdd:suppress(<rule_id>) [UNTIL=<past>]` marker (toolkit conventions only — repo.* rules are unsuppressible per substrate v12 §2), creates a validator missing a `bind_rule()` call (SPEC-COACH-RULEID-0007 violation), declares a rule with non-canonical-grammar `id` (SPEC-COACH-RULEID-0001 violation), or edits WMBT/train/feature YAML adding a `disposition:` field on an acceptance or abuse_case (substrate v12 §4.4 — disposition is set by the walker, not declared). These four rules are tier-2 bridges that catch protocol-level issues before tier-1 validators flag them, shortening the feedback loop"
lens: "functional.effectiveness"
statement: "minimize likelihood of undetected-substrate-rule-id-and-suppression-violations by implementing observer rules 10-stale-suppression-detected, 11-unbound-rule-id-in-validator, 12-rule-id-grammar-violation, and 17-repo-rule-disposition-declared from §8.3 — substrate-aware rules that bridge to substrate v12's repo-rule strict-by-construction model and the SPEC-COACH-RULEID-0001/0007 grammar contracts"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:M004-UNIT-001-rule-10-stale-suppression"
      id: "AC-UNIT-001"
      purpose: "Rule 10-stale-suppression-detected fires when a commit touches a file with a stale `# atdd:suppress(<rule_id>) [UNTIL=past]` marker (toolkit conventions only) and does NOT fire for `repo.*` rule IDs which are unsuppressible per substrate v12 §2"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A commit diff touching a file containing `# atdd:suppress(coder.green.something) [UNTIL=2025-01-01]` (a past UNTIL date)"
        - "The substrate's existing `find_stale_suppressions` is available"
    when:
      abstract: "Rule 10 evaluates the commit"
    then:
      abstract:
        - "The rule fires and the correction names the rule_id, location, and expired UNTIL date"
        - "Markers naming `repo.*` rule IDs do NOT fire the rule (repo rules are unsuppressible)"
        - "Non-stale markers (UNTIL in the future) do NOT fire the rule"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:M004-UNIT-002-rule-11-unbound-rule-id"
      id: "AC-UNIT-002"
      purpose: "Rule 11-unbound-rule-id-in-validator fires when an agent creates a validator that emits a rule_id without a corresponding `bind_rule()` call at module-import time, per SPEC-COACH-RULEID-0007"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A new validator file emits a Violation with rule_id=X but no `bind_rule('X')` call appears at module-import time"
    when:
      abstract: "Rule 11 evaluates the new validator"
    then:
      abstract:
        - "The rule fires and the correction references SPEC-COACH-RULEID-0007 and the canonical rule_id"
        - "A validator that correctly calls `bind_rule()` does NOT fire the rule"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:M004-UNIT-003-rule-12-grammar-violation"
      id: "AC-UNIT-003"
      purpose: "Rule 12-rule-id-grammar-violation fires when an agent declares a rule with non-canonical-grammar `id` per SPEC-COACH-RULEID-0001 (canonical form `<archetype>.<convention>.<rule>`)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A rule declaration with id=`SPEC-COACH-RULEID-1234` (legacy form) introduced as the primary id"
    when:
      abstract: "Rule 12 evaluates the declaration"
    then:
      abstract:
        - "The rule fires and the correction directs the agent to use canonical form and place legacy IDs under aliases"
        - "Canonical-grammar IDs (`coder.green.completion-without-commit`) do NOT fire the rule"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:M004-UNIT-004-rule-17-disposition-declared"
      id: "AC-UNIT-004"
      purpose: "Rule 17-repo-rule-disposition-declared fires when an agent's diff adds a `disposition:` field to any acceptance or abuse_case YAML — repo contract rules cannot declare disposition (substrate v12 §4.4)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A diff adding a `disposition:` field on an acceptance or abuse_case in a WMBT/train/feature YAML"
    when:
      abstract: "Rule 17 evaluates the diff"
    then:
      abstract:
        - "The rule fires and the correction states `Repo contract rules cannot declare disposition (substrate v12 §4.4). Disposition is set by the walker to strict. Remove the field.`"
        - "Diffs that do not introduce a disposition declaration do NOT fire the rule"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
