urn: "wmbt:observe-and-correct:M006"
step: "monitor"
direction: "minimize"
dimension: "likelihood"
object_of_control: "blocked-workers-whose-need-for-a-decision-never-reaches-the-coach"
context_clarifier: "when a coach-spawned worker is blocked — idle past a threshold with no output, or stalled awaiting an architectural decision it cannot make alone — the coach today stays blind because the worker LLM is not relied upon to emit atdd agent ask / escalate (LLM discretion is unreliable); the observer sidecar, watching its worker's output and worktree, must itself detect the blocked/idle condition and emit ask (decision needed) or escalate (hard-blocked) on the worker's behalf, through an adapter-neutral path with no Claude-Code-specific hook, and without false-positiving on a worker that is merely working quietly"
lens: "functional.effectiveness"
statement: "minimize likelihood of blocked-workers-whose-need-for-a-decision-never-reaches-the-coach by having the observer sidecar detect an idle or decision-blocked worker and emit atdd agent ask / escalate on the worker's behalf, via an adapter-neutral mechanism, while a healthy progressing worker triggers neither"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:M006-UNIT-001-blocked-worker-emits-ask"
      id: "AC-UNIT-001"
      purpose: "When the observer detects its worker is blocked awaiting a decision, it emits exactly one atdd agent ask event on the worker's behalf"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer sidecar attached to a worker with a known canonical agent_id"
        - "The worker is simulated into a decision-blocked state — idle past the configured ask threshold with a pending-decision marker in its output"
    when:
      abstract: "The observer loop is advanced until the ask threshold is crossed"
    then:
      abstract:
        - "Exactly one ask event is appended to the worker's events.jsonl"
        - "The ask event carries the worker's canonical agent_id and the captured decision context"
        - "No ask event is emitted before the ask threshold is crossed"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:observe-and-correct:M006-UNIT-002-hard-blocked-worker-emits-escalate"
      id: "AC-UNIT-002"
      purpose: "When the observer detects its worker is hard-blocked or idle past the escalation threshold, it emits an atdd agent escalate event"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer sidecar attached to a worker with a known canonical agent_id"
        - "The worker is simulated as idle past the configured escalation threshold (longer than the ask threshold)"
    when:
      abstract: "The observer loop is advanced until the escalation threshold is crossed"
    then:
      abstract:
        - "An escalate event is appended to the worker's events.jsonl carrying the worker's agent_id"
        - "The escalate event records the blocked duration that crossed the escalation threshold"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:observe-and-correct:M006-UNIT-003-healthy-worker-emits-no-ask-or-escalate"
      id: "AC-UNIT-003"
      purpose: "A worker that is making progress triggers neither ask nor escalate — the blocked detector does not false-positive on quiet-but-working"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer sidecar attached to a worker that produces fresh output and worktree changes within every detection window"
    when:
      abstract: "The observer loop is advanced past both the ask and escalation thresholds while the worker keeps progressing"
    then:
      abstract:
        - "Zero ask events are appended to the worker's events.jsonl"
        - "Zero escalate events are appended to the worker's events.jsonl"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:observe-and-correct:M006-SMOKE-001-real-blocked-worker-reaches-coach"
      id: "AC-SMOKE-001"
      purpose: "A real observer sidecar on a genuinely blocked worker emits ask/escalate that the coach receive-side observes"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "A real coach run with a spawned worker and observer sidecar, where the worker is driven into a genuine decision-blocked state"
    when:
      abstract: "The worker remains blocked past the ask and escalation thresholds and the worker's events.jsonl plus the coach event surface are inspected"
    then:
      abstract:
        - "An ask event and then an escalate event appear in the worker's events.jsonl"
        - "The coach RuntimeWatcher / CoachEventQueue receives both events with no manual emission"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
