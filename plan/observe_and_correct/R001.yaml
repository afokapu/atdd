urn: "wmbt:observe-and-correct:R001"
step: "resolve"
direction: "minimize"
dimension: "likelihood"
object_of_control: "ask-events-whose-answer-never-reaches-the-waiting-worker"
context_clarifier: "when the observer has emitted an atdd agent ask on a blocked worker's behalf, the coach or operator produces an answer — but an answer that is merely recorded leaves the worker still blocked forever; the ask must round-trip: the answer is delivered back into the waiting worker through the observer's existing correction-injection / return-path machinery so the worker actually unblocks and resumes, and the delivery must be adapter-neutral (no Claude-Code-specific hook) so every ADAPTER_REGISTRY adapter inherits the round-trip"
lens: "functional.effectiveness"
statement: "minimize likelihood of ask-events-whose-answer-never-reaches-the-waiting-worker by routing a coach/operator answer back into the blocked worker through the observer's adapter-neutral return-path so the worker unblocks and resumes, rather than the answer being only recorded"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:R001-UNIT-001-answer-delivered-back-to-worker"
      id: "AC-UNIT-001"
      purpose: "An answer to an ask event is delivered back into the worker via the observer return-path, not merely recorded"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A worker that emitted an ask event and is waiting on an answer, with its observer sidecar attached"
        - "A coach/operator answer string keyed to that ask event's identifier"
    when:
      abstract: "The answer is submitted for that ask event's identifier"
    then:
      abstract:
        - "The answer text is delivered into the worker through the observer return-path"
        - "The delivered payload is correlated to the originating ask event by its identifier"
        - "The answer is not only appended to a log — it reaches the worker input surface"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:observe-and-correct:R001-UNIT-002-roundtrip-delivery-is-adapter-agnostic"
      id: "AC-UNIT-002"
      purpose: "The answer-delivery path is adapter-neutral — it uses the observer's existing injection paths and no Claude-Code-specific hook"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A waiting ask event for a worker whose adapter is set, in turn, to each entry of ADAPTER_REGISTRY"
        - "The answer-delivery module is importable with no Claude-Code hook module on the path"
    when:
      abstract: "An answer is delivered once per adapter for the waiting ask event"
    then:
      abstract:
        - "The answer reaches the worker for every adapter, with no adapter failing delivery"
        - "The delivery module's import graph contains no Claude-Code-specific hook module"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:observe-and-correct:R001-INTEGRATION-001-answered-worker-unblocks"
      id: "AC-INTEGRATION-001"
      purpose: "A blocked worker that emitted ask, once its answer is delivered, leaves the blocked state and resumes"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "An observer sidecar and a worker driven into a decision-blocked state that emitted an ask event"
        - "A coach/operator answer for that ask event"
    when:
      abstract: "The answer is delivered back through the round-trip path and the observer re-evaluates the worker"
    then:
      abstract:
        - "The worker transitions out of the blocked state after the answer is delivered"
        - "The observer emits no further escalate event for that same block once the answer is delivered"
        - "The worker produces fresh output/worktree progress after delivery"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
  - identity:
      urn: "acc:observe-and-correct:R001-SMOKE-001-real-ask-answer-roundtrip"
      id: "AC-SMOKE-001"
      purpose: "An end-to-end real round-trip: a blocked worker emits ask, an operator answers, and the worker unblocks"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "A real coach run with a spawned worker and observer sidecar, the worker driven into a genuine decision-blocked state"
    when:
      abstract: "The observer emits ask, an operator submits an answer for that ask, and the worker is observed afterward"
    then:
      abstract:
        - "The answer reaches the worker and the worker resumes without manual intervention"
        - "The worker subsequently completes its phase and emits done with no further escalation"
    metadata:
      author: "atdd:planner"
      created: "2026-05-17"
