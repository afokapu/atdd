urn: "wmbt:observe-and-correct:P002"
step: "prepare"
direction: "minimize"
dimension: "quantity"
object_of_control: "observer-input-acquisition-gaps"
context_clarifier: "when the co-spawned observer cannot see its persona — collect_input reads the observer's own dir, never sets now/last_token_at/heartbeat_mtime, and no writer feeds output.log or heartbeat.json, so silence/heartbeat/log-regex rules are dead"
lens: "functional.effectiveness"
statement: "minimize quantity of observer-input-acquisition-gaps by resolving collect_input to the persona's runtime dir (persona agent_id = observer agent_id minus the `-observer` suffix), populating now/last_token_at/heartbeat_mtime, acquiring the persona output stream via the co-spawned observer's multiplexer surface capture tailed into output.log, co-spawning a heartbeat ticker beside the persona, and rendering a universal operator-visible observer status line so silence/heartbeat/log-regex rules fire and every observer tab is interpretable"
# Planner decision (issue #713, INIT->PLANNED): the observer acquires the
# persona output stream via option (a) — the co-spawned observer captures the
# persona's multiplexer surface (`cmux capture-pane`) and tails the delta into
# the persona's output.log. The observer is already co-spawned per #695 and is
# told the persona's surface ref by the coach, so (a) needs no wrapper process
# (option b) and no persona cooperation (option c). Liveness: last_token_at is
# derived from surface-capture deltas; heartbeat.json is refreshed by a
# lightweight heartbeat ticker co-spawned beside the persona so rule 05 has a
# real signal. collect_input derives the persona agent_id by stripping the
# `-observer` suffix and reads runtime/agents/<persona-id>/.
acceptances:
  - identity:
      urn: "acc:observe-and-correct:P002-UNIT-001-collect-input-reads-persona-dir"
      id: "AC-UNIT-001"
      purpose: "collect_input resolves the persona's runtime dir (observer agent_id minus the `-observer` suffix) and reads ObservedInput from it, not from the observer's own agent dir (issue #713 Layer 1 / OBSINPUT-001)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer with agent_id `<persona-id>-observer` co-spawned beside a persona whose runtime dir is `.atdd/runtime/agents/<persona-id>/`"
    when:
      abstract: "Observer.collect_input runs a scan"
    then:
      abstract:
        - "The ObservedInput is built by reading `.atdd/runtime/agents/<persona-id>/` — the persona's dir — and NOT `.atdd/runtime/agents/<persona-id>-observer/`"
        - "An observer agent_id that does not end in `-observer` is rejected with an error rather than silently reading its own dir"
        - "PASS/FAIL: the path collect_input reads from equals the persona dir; fails if it equals the observer's own agent_dir"
    metadata:
      author: "atdd:planner-713"
      created: "2026-05-15"
  - identity:
      urn: "acc:observe-and-correct:P002-UNIT-002-time-token-fields-populated"
      id: "AC-UNIT-002"
      purpose: "collect_input populates now, last_token_at and heartbeat_mtime so the silence (02) and missed-heartbeat (05) predicates evaluate instead of short-circuiting to no-fire (issue #713 Layer 2 / OBSINPUT-002)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A persona runtime dir with a recent output-stream change and a heartbeat.json file present"
    when:
      abstract: "collect_input builds the ObservedInput for that persona"
    then:
      abstract:
        - "ObservedInput.now is set to the current wall-clock time and is not None"
        - "ObservedInput.last_token_at is set from the persona's most recent output activity and is not None"
        - "ObservedInput.heartbeat_mtime is set from the persona heartbeat.json mtime when that file exists"
        - "PASS/FAIL: with all three fields non-None, rules 02 and 05 reach their threshold comparison; fails if any field is None and the rule short-circuits"
    metadata:
      author: "atdd:planner-713"
      created: "2026-05-15"
  - identity:
      urn: "acc:observe-and-correct:P002-UNIT-003-persona-output-stream-acquired"
      id: "AC-UNIT-003"
      purpose: "The persona output stream is acquired via the observer's multiplexer surface capture and tailed into the persona's output.log, so log_lines carries real agent output for the log-regex rules (issue #713 Layer 3 / OBSINPUT-003)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A persona bound to a known multiplexer surface ref, with surface-capture output containing agent text"
    when:
      abstract: "The observer's input-acquisition step captures the persona surface and collect_input runs"
    then:
      abstract:
        - "The captured surface delta is appended to the persona's `output.log`"
        - "ObservedInput.log_lines is non-empty and contains the persona's real output text (not the observer's own)"
        - "PASS/FAIL: a log-regex rule (e.g. 01-unstructured-question) evaluating that ObservedInput can fire; fails if log_lines is empty"
    metadata:
      author: "atdd:planner-713"
      created: "2026-05-15"
  - identity:
      urn: "acc:observe-and-correct:P002-UNIT-004-observer-status-line-and-trace"
      id: "AC-UNIT-004"
      purpose: "`atdd observer run` renders a live status line and exposes the per-scan ingest+fired trace, so the observer tab is operator-interpretable (issue #713 Layer 4 / OBSINPUT-005)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer running against a persona that has completed at least one scan"
    when:
      abstract: "The operator views the observer tab or runs `atdd observer attach --agent-id <id>`"
    then:
      abstract:
        - "A live status line shows the watched persona id, the count of loaded rules, the last-scan timestamp, and the running corrections-issued count"
        - "The operator can see what the observer ingested for a scan (the persona output snapshot evaluated) and the rule ids that fired"
        - "PASS/FAIL: the status line is present and refreshes each scan; fails if the tab stays blank after launch"
    metadata:
      author: "atdd:planner-713"
      created: "2026-05-15"
  - identity:
      urn: "acc:observe-and-correct:P002-UNIT-005-universal-operator-visibility"
      id: "AC-UNIT-005"
      purpose: "The operator-visibility of OBSINPUT-005 is universal — every observer-bearing entry point (observers co-spawned with planner/tester/coder/reviewer personas and any coach-side monitoring surface) is visible by the same status-line mechanism (issue #713 OBSINPUT-006, parallels #695)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A table-driven fixture enumerating every observer-bearing entry point: observers co-spawned with planner, tester, coder and reviewer personas, plus each coach-side monitoring surface"
    when:
      abstract: "The visibility check runs against each enumerated entry point"
    then:
      abstract:
        - "Every enumerated entry point renders the OBSINPUT-005 status line via the same shared mechanism — no entry point is headless"
        - "The test fails if any single observer-bearing entry point in the table lacks the operator-visible status line"
        - "PASS/FAIL: count of visible entry points equals count of enumerated entry points"
    metadata:
      author: "atdd:planner-713"
      created: "2026-05-15"
  - identity:
      urn: "acc:observe-and-correct:P002-INTEGRATION-001-persona-heartbeat-produced"
      id: "AC-INTEGRATION-001"
      purpose: "A heartbeat ticker is co-spawned beside the persona so heartbeat.json is refreshed on a timer during a real run, giving rule 05 a live signal (issue #713 scope item 2)"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "A persona launched under the coach with the co-spawned heartbeat ticker active"
    when:
      abstract: "The persona runs for longer than one configured heartbeat interval"
    then:
      abstract:
        - "`.atdd/runtime/agents/<persona-id>/heartbeat.json` mtime advances on each heartbeat interval while the persona is alive"
        - "collect_input reads a non-stale heartbeat_mtime during normal persona activity"
        - "PASS/FAIL: when the persona genuinely stalls the heartbeat stops advancing and rule 05 observes the staleness; fails if heartbeat.json is never written"
    metadata:
      author: "atdd:planner-713"
      created: "2026-05-15"
  - identity:
      urn: "acc:observe-and-correct:P002-SMOKE-001-blocked-persona-triggers-correction"
      id: "AC-SMOKE-001"
      purpose: "End-to-end against real infrastructure: a persona blocked/silent past the rule-02 threshold triggers an observer correction/escalation — the lived #711 12-minute undetected stall no longer happens (issue #713 OBSINPUT-004)"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "integration"
    given:
      abstract:
        - "A real co-spawned observer watching a real persona running under the coach on a real git worktree"
    when:
      abstract: "The persona sits blocked on a structured question with no token activity for longer than the rule-02 silence threshold"
    then:
      abstract:
        - "collect_input populates last_token_at from the (now stale) persona surface capture"
        - "Rule 02 (token-silence) fires and a correction/escalation record is appended to corrections.jsonl within one scan interval past the threshold"
        - "PASS/FAIL: the correction record exists for the stall; fails if the persona stays silent past the threshold with no correction (the #711 regression)"
    metadata:
      author: "atdd:planner-713"
      created: "2026-05-15"
