urn: "wmbt:observe-and-correct:C001"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "behavioral-regression-against-babysit-baseline"
context_clarifier: "when babysit is decommissioned in #P6, behavior parity for the observer-absorbing issues (#L3 token threshold, #L4 bash auto-approve + naming/layout drift + smoke skip, #L6 dashboard, #L7 aggregate-approve) must be operationalized as an executable test suite. Mirrors the discipline of #K5 (orchestrate parity). At least 7 fixture scenarios cover each absorbed function category; CI failure on this suite blocks #P6 from landing"
lens: "functional.effectiveness"
statement: "minimize likelihood of behavioral-regression-against-babysit-baseline by creating tests/integration/test_babysit_observer_parity.py — a fixture-driven suite asserting equivalence on token-alert firing, bash-pattern auto-approval, naming drift correction, layout drift correction, smoke-skip detection, dashboard rendering, and aggregate-approve, with CI failure gating #P6"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:C001-INTEGRATION-001-seven-fixture-scenarios"
      id: "AC-INTEGRATION-001"
      purpose: "At least 7 fixture scenarios are present, one per absorbed function category, all passing on CI"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "tests/integration/test_babysit_observer_parity.py exists"
        - "Fixtures define a babysit invocation against a fake multiplexer state and the expected `atdd observer` equivalent"
    when:
      abstract: "The parity test suite runs in CI"
    then:
      abstract:
        - "Token-alert firing — given a fake `claude --print-context-status` output, both fire the alert at the same threshold"
        - "Bash-pattern auto-approval — given a screen with a known-safe prompt, both approve; with a deny pattern, both escalate"
        - "Naming drift correction — given a renamed surface, both detect drift and re-apply canonical name within one tick"
        - "Layout drift correction — given a non-conforming surface arrangement, both correct it"
        - "Smoke-skip detection — given a screen showing `--status REFACTOR` without prior SMOKE, both flag the violation"
        - "Dashboard rendering — given a fake set of surfaces, both produce the same row content modulo trailing whitespace"
        - "Aggregate-approve — given multiple surfaces with auto-approvable prompts, both approve the same set"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:C001-INTEGRATION-002-runtime-budget-and-differences-list"
      id: "AC-INTEGRATION-002"
      purpose: "The suite runs in <60s on a developer machine, and the differences-allowed list is documented"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The parity test suite is committed and CI-wired"
    when:
      abstract: "A developer runs the suite locally"
    then:
      abstract:
        - "Total wall-clock runtime is under 60 seconds"
        - "Differences that are NOT failures are documented in-repo: corrections.jsonl additions (coach-side richer logging), dashboard-format minor whitespace, internal state representation changes"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:C001-INTEGRATION-003-gates-decommissioning"
      id: "AC-INTEGRATION-003"
      purpose: "CI failure on this suite blocks #P6 (babysit decommissioning) from landing"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The parity test suite is gating in CI"
        - "The repo's #P6 PR-merge policy references this suite explicitly"
    when:
      abstract: "A simulated regression in any absorbed function is introduced and the parity suite runs"
    then:
      abstract:
        - "The suite fails and #P6's CI status reflects the failure"
        - "Repo policy documentation states that this suite gates babysit decommissioning"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
