urn: "wmbt:observe-and-correct:M002"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "monitor"
direction: "minimize"
dimension: "likelihood"
object_of_control: "unflagged-context-window-exhaustion"
context_clarifier: "when an agent under coach orchestration approaches its context window limit (default 400k tokens per spec §10 `coach.token_alert_threshold`) and would otherwise silently degrade, requiring the operator to manually `/compact`. The legacy machinery in commands/babysit.py (`load_token_alert_threshold`, `read_token_count`, `check_token_threshold`) is absorbed verbatim into a coach observer module and re-bound to rule 06-token-threshold per §8.3 and §0.2"
lens: "functional.sustainability"
statement: "minimize likelihood of unflagged-context-window-exhaustion by absorbing babysit's token-count alerting machinery (`load_token_alert_threshold`, `read_token_count`, `check_token_threshold`) into observer rule 06-token-threshold with the default 400k threshold from `coach.token_alert_threshold` and behavior at parity with babysit"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:M002-UNIT-001-rule-06-fires-above-threshold"
      id: "AC-UNIT-001"
      purpose: "A simulated context-status reading above the threshold fires rule 06-token-threshold and emits the §8.3 correction text"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An observer instance with rule 06-token-threshold loaded"
        - "A synthetic `claude --print-context-status` reading above 400k tokens"
    when:
      abstract: "The observer evaluates the rule against the synthetic reading"
    then:
      abstract:
        - "Rule 06 fires"
        - "The correction text is `Approaching context limit. Run /compact.`"
        - "The injected correction reaches the agent via the cli-return injection path"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:M002-UNIT-002-config-override-lowers-threshold"
      id: "AC-UNIT-002"
      purpose: "Setting `coach.token_alert_threshold: 350000` in .atdd/config.yaml lowers the firing threshold accordingly"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - ".atdd/config.yaml contains `coach.token_alert_threshold: 350000`"
        - "A synthetic context-status reading at 360k tokens"
    when:
      abstract: "The observer loads the config via the absorbed `load_token_alert_threshold` and evaluates rule 06"
    then:
      abstract:
        - "Rule 06 fires at 360k because the threshold has been lowered to 350k"
        - "A reading at 340k under the same config does NOT fire the rule"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:M002-UNIT-003-babysit-parity-preserved"
      id: "AC-UNIT-003"
      purpose: "The absorbed functions `load_token_alert_threshold`, `read_token_count`, `check_token_threshold` preserve babysit's existing behavior verbatim — same firing decision for the same inputs"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fixture set of token-count readings spanning above, at, and below the threshold"
        - "The babysit and observer implementations of the three absorbed functions"
    when:
      abstract: "Both implementations are run against each fixture"
    then:
      abstract:
        - "For every fixture both implementations agree on whether the alert fires"
        - "The default threshold remains 400k tokens"
        - "The absorbed module path is documented and discoverable from the rule YAML"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
