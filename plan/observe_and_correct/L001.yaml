urn: "wmbt:observe-and-correct:L001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "locate"
direction: "minimize"
dimension: "effort"
object_of_control: "active-coach-surface-state"
context_clarifier: "when an operator running multiple coach-orchestrated agents needs a single command to surface the per-agent dashboard at parity with `atdd babysit` — name, phase, last-heartbeat, token count — without polling multiplexer state directly. The legacy babysit rendering machinery (`_render_dashboard`, `SurfaceRow`, `_format_hms`, `_extract_surface_state`) is absorbed into the observer command per §0.2, with the data source moved from raw multiplexer polling to `.atdd/runtime/agents/*/`"
lens: "functional.efficiency"
statement: "minimize effort of locating-active-coach-surface-state by absorbing babysit's `_render_dashboard`, `SurfaceRow`, `_format_hms`, and `_extract_surface_state` into `atdd observer status`, reading from `.atdd/runtime/agents/*/` rather than polling multiplexer state, with parity to babysit's dashboard at time of decommissioning"
acceptances:
  - identity:
      urn: "acc:observe-and-correct:L001-UNIT-001-status-prints-per-surface-table"
      id: "AC-UNIT-001"
      purpose: "`atdd observer status` prints a per-surface table with name, phase, last-heartbeat, and token count for every active agent"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "Three active agents recorded under .atdd/runtime/agents/ with heartbeat.json, token-count metadata, and current phase"
    when:
      abstract: "An operator invokes `atdd observer status`"
    then:
      abstract:
        - "The command prints a table with rows for each active agent"
        - "Each row includes name, phase, last-heartbeat (formatted via the absorbed `_format_hms`), and token count"
        - "The table layout matches the SurfaceRow schema absorbed from babysit"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:observe-and-correct:L001-UNIT-002-parity-with-babysit-dashboard"
      id: "AC-UNIT-002"
      purpose: "Output is at parity with `atdd babysit` dashboard at time of decommissioning, modulo trailing whitespace"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fixture set of agent runtime states"
        - "The babysit and observer dashboard implementations both exercised against the same fixtures"
    when:
      abstract: "Both implementations render the dashboard"
    then:
      abstract:
        - "For every fixture the row content matches modulo trailing whitespace"
        - "The data source for `atdd observer status` is .atdd/runtime/agents/*/, not direct multiplexer polling"
        - "Parity is documented as a gating condition for #P6 (babysit decommissioning)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
