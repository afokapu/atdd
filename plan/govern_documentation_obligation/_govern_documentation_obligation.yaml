wmbt:
  C001: minimize likelihood of an unobserved-obligation being reported as a discharged
    one, by resolving the installed documentation capability and treating COULD_NOT_CHECK
    as a blocking verdict distinct from NOT_APPLICABLE
  D001: maximize likelihood of a format-agnostic declaration-integrity-check that
    decides a documentation declaration is well-formed and its named artifacts are
    present in the change set, so core proves the obligation without reading a single
    documentation file
  total: 2
