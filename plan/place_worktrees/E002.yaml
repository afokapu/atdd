urn: wmbt:place-worktrees:E002
step: execute
direction: minimize
dimension: likelihood
object_of_control: a-spawned-agent-being-directed-to-a-path-no-resolver-created
context_clarifier: session_template.py:225 builds the launch-prompt path by string
  manipulation as ../{branch with slashes replaced}, a different algorithm from the
  creation sites, so a spawned agent can be told to cd to a directory that was never
  created
lens: functional.effectiveness
statement: minimize likelihood of a-spawned-agent-being-directed-to-a-path-no-resolver-created
  by deriving the launch-prompt path from the same resolver that created the worktree
  rather than by string manipulation of the branch name
acceptances:
- identity:
    urn: acc:place-worktrees:E002-UNIT-001-launch-prompt-names-the-created-path
    id: AC-UNIT-001
    purpose: 'closes the second audit finding: the agent-facing path and the created
      path are computed by different algorithms today'
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - a repo with worktree_root configured to a non-default directory and a branch
      containing a slash
  when:
    abstract: a worktree is created for that branch and a launch prompt is rendered
      for it
  then:
    abstract:
    - the path named in the launch prompt is the path the resolver created
    - the prompt path is absolute or resolves to the created directory, not a bare
      ../ string
  metadata:
    author: atdd:self-compliance
    created: '2026-07-18'
- identity:
    urn: acc:place-worktrees:E002-UNIT-002-gc-scans-configured-root-and-legacy-siblings
    id: AC-UNIT-002
    purpose: worktree_gc skips any directory without a hyphen, so a root named worktrees
      is silently never scanned; and a hyphenated root would be rglobbed as an orphan
      candidate
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - orphan worktrees present both under a configured worktree_root and at the legacy
      sibling location
    - a configured root whose directory name contains a hyphen
  when:
    abstract: the orphan scan runs in dry-run mode
  then:
    abstract:
    - orphans in both locations are reported
    - the configured root itself is excluded from the orphan candidate set explicitly,
      not by its name shape
  metadata:
    author: atdd:self-compliance
    created: '2026-07-18'
