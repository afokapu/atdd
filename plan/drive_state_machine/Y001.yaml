urn: "wmbt:drive-state-machine:Y001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "modify"
direction: "minimize"
dimension: "likelihood"
object_of_control: "warm-resume-re-executing-completed-phases"
context_clarifier: "when atdd coach <N> is invoked on an issue already past INIT (e.g., PLANNED, RED, GREEN), _drive_single_issue currently hardcodes the INIT→PLANNED cold-start path, spawning the planner unconditionally. The fix reads the live atdd:<phase> label from GitHub at startup and dispatches to the correct persona for the current phase — or drops straight into the event loop if the phase is already past what coach would spawn. Root: _drive_single_issue was written as a fresh-start-only path during #645; resume semantics were deferred. Lived incident: coach 690 (at PLANNED) re-spawned a redundant planner that ran 15+ min on already-committed planning artifacts."
lens: "functional.availability"
statement: "minimize likelihood of warm-resume-re-executing-completed-phases when atdd coach <N> is invoked on an issue already past INIT by reading the current atdd:<phase> GitHub label at _drive_single_issue entry and dispatching to the appropriate persona — or entering the event loop directly — without re-running the cold-start INIT→PLANNED path"
acceptances:
  - identity:
      urn: "acc:drive-state-machine:Y001-UNIT-001-read-current-phase-at-startup"
      id: "AC-UNIT-001"
      purpose: "_drive_single_issue reads the live GitHub atdd:<phase> label at startup to determine the resume point"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An issue is at PLANNED (GitHub label: atdd:PLANNED)"
        - "_drive_single_issue receives a StateMachine initialized at INIT"
    when:
      abstract: "_drive_single_issue is called"
    then:
      abstract:
        - "It reads the GitHub labels for the issue and detects atdd:PLANNED"
        - "The SM phase is updated to PLANNED before any persona is spawned"
        - "The INIT→PLANNED cold-start path (write init decision + spawn planner) is skipped"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-20"
  - identity:
      urn: "acc:drive-state-machine:Y001-UNIT-002-spawn-correct-persona-for-phase"
      id: "AC-UNIT-002"
      purpose: "When the current phase is PLANNED, coach spawns the tester; when RED, spawns the coder; when GREEN, enters the event loop without spawning (waits for SMOKE)"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "GitHub label is atdd:PLANNED on the issue"
        - "_spawn_func is monkeypatched to record which Transition it is called with"
    when:
      abstract: "_drive_single_issue is called with _max_loop_events=0"
    then:
      abstract:
        - "spawn_h is called once with a Transition whose src is PLANNED and dst is RED"
        - "spawn_h is NOT called with any Transition involving INIT"
        - "The planner persona is never dispatched"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-20"
  - identity:
      urn: "acc:drive-state-machine:Y001-INTEGRATION-001-warm-resume-skips-planner"
      id: "AC-INTEGRATION-001"
      purpose: "Full call to _drive_single_issue on a PLANNED issue: tester spawned, planner not spawned; SM history shows no INIT→PLANNED transition"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A test issue has GitHub label atdd:PLANNED"
        - "_spawn_func is a recording stub; label fetch is monkeypatched to return atdd:PLANNED"
        - "_max_loop_events=0 so the event loop exits immediately after the warm-start spawn"
    when:
      abstract: "_drive_single_issue(cfg, sm, runtime_dir, _max_loop_events=0) is called"
    then:
      abstract:
        - "spawn_h is called exactly once with Transition(PLANNED, RED)"
        - "sm.history does not contain Phase.INIT (no cold-start decision written)"
        - "sm.phase is PLANNED (the event loop exited immediately; no further advance)"
        - "_drive_single_issue returns 0"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-20"
