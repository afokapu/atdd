urn: "wmbt:drive-state-machine:L001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "locate"
direction: "minimize"
dimension: "effort"
object_of_control: "in-progress-coach-run-state"
context_clarifier: "when an operator running atdd coach needs a single command to inspect a live or recent coach orchestration run — run ID, start time, elapsed, per-issue phase, active agents, recent decisions, recent judgments — without tailing raw JSONL files. Reads from .atdd/runtime/coach/ (decisions.jsonl, judgments.jsonl) and .atdd/runtime/agents/<id>/ and .atdd/runtime/runs/<run-id>/manifest.json. Shares _format_hms from observer for elapsed-time rendering. Wires in as atdd coach status [--run-id ID] [--decisions N] [--judgments N] [--watch] [--json]."
lens: "functional.efficiency"
statement: "minimize effort of locating-in-progress-coach-run-state by adding atdd coach status, a live inspection subcommand that reads .atdd/runtime/coach/ and .atdd/runtime/agents/<id>/ and renders a coherent status table — run id, per-issue phases, active agents, recent decisions, recent judgments — without requiring the operator to tail raw JSONL files or know the runtime layout"
acceptances:
  - identity:
      urn: "acc:drive-state-machine:L001-UNIT-001-no-runs-exits-zero"
      id: "AC-UNIT-001"
      purpose: "`atdd coach status` with no runtime directory or empty coach/ dir exits 0 with a clear 'no runs found' message"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The .atdd/runtime/coach/ directory does not exist or contains no decisions.jsonl"
    when:
      abstract: "An operator invokes `atdd coach status`"
    then:
      abstract:
        - "The command exits 0"
        - "stdout contains 'No coach runs found in .atdd/runtime/coach/'"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:drive-state-machine:L001-UNIT-002-fixture-run-renders-table"
      id: "AC-UNIT-002"
      purpose: "`atdd coach status` with a fixture run renders run-id, per-issue phase from decisions, and recent decisions in a readable table"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fixture .atdd/runtime/coach/decisions.jsonl with 3 decisions for run-id 'run-abc' covering issues 616 and 617 with phase-transition type entries"
    when:
      abstract: "An operator invokes `atdd coach status`"
    then:
      abstract:
        - "The command exits 0"
        - "stdout contains the run id 'run-abc'"
        - "stdout contains per-issue phases derived from the latest phase-transition decision per issue"
        - "stdout contains the most recent decisions formatted as [timestamp] issue=N type=X"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:drive-state-machine:L001-UNIT-003-json-flag-parseable"
      id: "AC-UNIT-003"
      purpose: "`atdd coach status --json` emits machine-readable JSON with run_id, issues, decisions keys"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fixture .atdd/runtime/coach/decisions.jsonl with decisions for run-id 'run-abc'"
    when:
      abstract: "An operator invokes `atdd coach status --json`"
    then:
      abstract:
        - "The command exits 0"
        - "stdout is valid JSON"
        - "The JSON object contains 'run_id', 'issues', and 'decisions' keys"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:drive-state-machine:L001-UNIT-004-nonexistent-run-id-exits-nonzero"
      id: "AC-UNIT-004"
      purpose: "`atdd coach status --run-id nonexistent` exits non-zero with a clear error message"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A fixture .atdd/runtime/coach/decisions.jsonl with decisions for run-id 'run-abc'"
        - "The operator requests run-id 'run-xyz' which does not exist"
    when:
      abstract: "An operator invokes `atdd coach status --run-id run-xyz`"
    then:
      abstract:
        - "The command exits non-zero"
        - "stderr contains 'run-xyz' and a message indicating the run was not found"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:drive-state-machine:L001-INTEGRATION-001-cli-dispatch-wires-status"
      id: "AC-INTEGRATION-001"
      purpose: "`atdd coach status` is reachable via the top-level CLI dispatch (cli.py) and does not break existing `atdd coach <N>` invocations"
      phase: "RED"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The atdd CLI is installed"
        - "A temporary runtime directory with no coach runs"
    when:
      abstract: "An operator invokes `atdd coach status` via the CLI entry point"
    then:
      abstract:
        - "The command exits 0"
        - "stdout contains 'No coach runs found'"
        - "Invoking `atdd coach 358` (existing behavior) still initializes the state machine and prints the planned path"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
