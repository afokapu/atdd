urn: "wmbt:drive-state-machine:E002"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-10-18 — warm-resume SMOKE + tests retired with sub-worker orchestration (#1483); WMBT retains agent-done phase-match unit coverage
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "phase-advance-without-current-phase-completion-match"
context_clarifier: "when coach re-runs against an issue whose current phase worker never completed (e.g. RED after a transient tester-spawn failure: cmux Broken pipe, no done.json written), two paths can advance the phase anyway. (1) Warm-resume in src/atdd/train/issue_runner.py:84-119 unconditionally computes next_phase = _COLD_START_ADVANCE_FROM[current] and spawns the NEXT persona, never checking whether the CURRENT phase's worker actually completed — so RED→GREEN fires and a coder is spawned with no RED tests to make pass (reproduced 3x live on #1051). (2) The agent_done branch of src/atdd/coach/commands/coach.py::_cold_start_proposed_transition matches only the issue number (parts[1]) and advances from sm.phase, ignoring the completing persona (parts[0]); a durable/replayed planner done.json keeps re-firing PLANNED-completion while the SM sits at RED, re-advancing on every run. The commit_observed branch already guards this (completed = _PHASE_TRAILER_MAP[phase]; return None if completed != sm.phase); the agent_done branch and warm-resume omit the equivalent guard. Because tester serves RED+SMOKE and coder serves GREEN+REFACTOR, 'did this phase's worker finish?' cannot be answered by persona alone — it requires a phase-tagged completion marker (a done.json recorded under / tagged for the current phase)."
lens: "functional.availability"
statement: "minimize likelihood of phase-advance-without-current-phase-completion-match when coach warm-resumes or processes an agent_done event by requiring a completion marker for the CURRENT phase before advancing: warm-resume re-spawns the current phase's persona (Transition(prev, current)) when no current-phase completion marker exists and advances only when the current phase completed; the agent_done branch advances only when the completing agent's phase matches sm.phase — mirroring the commit_observed guard so a stale/replayed or wrong-phase done.json can never skip a phase"
acceptances:
  - identity:
      urn: "acc:drive-state-machine:E002-UNIT-003-agent-done-advances-only-on-persona-phase-match"
      id: "AC-UNIT-003"
      purpose: "The agent_done branch of _cold_start_proposed_transition advances only when the completing agent's phase equals sm.phase; a stale/wrong-phase done.json returns None"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "sm.phase = Phase.RED and sm.issue_number = 1051"
        - "Two agent_done events for issue 1051: one from the planner persona (completes PLANNED) and one from the tester persona (completes RED)"
    when:
      abstract: "_cold_start_proposed_transition is called with each agent_done event"
    then:
      abstract:
        - "For the planner-done event (completes PLANNED != RED): the function returns None — no advance"
        - "For the tester-done event (completes RED == sm.phase): the function returns Transition(RED, GREEN)"
        - "The guard derives the completed phase from the persona prefix (parts[0]), mirroring the commit_observed branch's `completed != sm.phase` return-None guard"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-11"