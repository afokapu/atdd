urn: "wmbt:drive-state-machine:L002"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "locate"
direction: "minimize"
dimension: "effort"
object_of_control: "worktree-lifecycle-command-surface"
context_clarifier: "when an operator manages the git worktree that is an agent's working environment, the verbs are split across two top-level commands for the same object: `atdd branch <N>` (create) and `atdd worktree gc` (orphan cleanup), with no `list` or `remove`. Consolidate them into one object-verb command — `atdd worktree {create, gc, list, remove}` — where `create` is the former `atdd branch`, `list` shows every registered worktree with its store-bound work item, and `remove` tears one down (refusing the main checkout; never `--force`). `atdd branch` remains as a deprecation alias that warns and delegates to `atdd worktree create`, so existing muscle-memory and scripts keep working. Wires into cli.py argparse (worktree subparsers) + dispatch, delegating to BranchManager (`branch`, `list_worktrees`, `remove_worktree`) and the existing worktree_gc."
lens: "functional.efficiency"
statement: "minimize effort of locating-the-worktree-lifecycle-command-surface by consolidating `atdd branch` + `atdd worktree` into one object-verb surface `atdd worktree {create, gc, list, remove}` (create = former `atdd branch`; list shows store bindings; remove refuses the main checkout), keeping `atdd branch` as a deprecation alias that warns and delegates to `atdd worktree create`"
acceptances:
  - identity:
      urn: "acc:drive-state-machine:L002-UNIT-001-worktree-create-dispatches-to-creation"
      id: "AC-UNIT-001"
      purpose: "`atdd worktree create <N>` dispatches to the worktree-creation path (BranchManager.branch)"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The atdd CLI argument parser and dispatch"
        - "BranchManager.branch is patched to record its call and return 0"
    when:
      abstract: "`atdd worktree create 42` is dispatched"
    then:
      abstract:
        - "BranchManager.branch is called once with issue_number=42"
        - "The command returns 0"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-07"
  - identity:
      urn: "acc:drive-state-machine:L002-UNIT-002-branch-alias-warns-and-delegates"
      id: "AC-UNIT-002"
      purpose: "`atdd branch <N>` still works, emits a deprecation warning, and delegates to worktree creation"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The atdd CLI argument parser and dispatch"
        - "BranchManager.branch is patched to record its call and return 0"
    when:
      abstract: "`atdd branch 42` is dispatched"
    then:
      abstract:
        - "BranchManager.branch is called once with issue_number=42 (same path as worktree create)"
        - "A deprecation warning naming 'atdd worktree create' is emitted to stderr"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-07"
  - identity:
      urn: "acc:drive-state-machine:L002-UNIT-003-worktree-list-shows-registered-worktrees"
      id: "AC-UNIT-003"
      purpose: "`atdd worktree list` enumerates registered git worktrees with their branch"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A BranchManager whose git worktree list returns two worktrees (main + a feature branch)"
    when:
      abstract: "list_worktrees() is invoked"
    then:
      abstract:
        - "The output includes both worktree paths and their branch names"
        - "The call returns 0"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-07"
  - identity:
      urn: "acc:drive-state-machine:L002-UNIT-004-worktree-remove-refuses-main-checkout"
      id: "AC-UNIT-004"
      purpose: "`atdd worktree remove` refuses to remove the main checkout"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A BranchManager whose target_dir is the main checkout"
    when:
      abstract: "remove_worktree(<path of the main checkout>) is invoked"
    then:
      abstract:
        - "The call returns non-zero"
        - "An error message refusing to remove the main checkout is printed"
        - "No git worktree remove is executed against the main checkout"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-07"
