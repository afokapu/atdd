urn: "wmbt:author-atdd-substrate:E010"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "issue-bodies-stamped-with-a-non-current-mint-date"
context_clarifier: "when authoring an issue body, the Metadata Date row must report the day the body is generated, because every other row in that table is interpolated from the spec while Date alone was frozen as a literal, so every issue ever minted reports the same day and a reader cannot tell a fresh issue from a stale one"
lens: "functional.effectiveness"
statement: "minimize quantity of issue-bodies-stamped-with-a-non-current-mint-date when authoring an issue body"
acceptances:
  - identity:
      urn: "acc:author-atdd-substrate:E010-UNIT-001-date-row-reports-generation-day"
      id: "AC-UNIT-001"
      purpose: "create_issue_body stamps the Date row with the day the body is generated, not a literal"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A valid issue spec accepted by create_issue_body"
        - "A known current date, injected by freezing the clock the generator reads"
    when:
      abstract: "create_issue_body(spec) is called"
    then:
      abstract:
        - "The Metadata Date row carries the frozen current date in ISO-8601 form"
        - "The emitted body still validates against issue.schema.json"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-09-06"
  - identity:
      urn: "acc:author-atdd-substrate:E010-UNIT-002-no-literal-date-survives-in-the-generator"
      id: "AC-UNIT-002"
      purpose: "Guard the regression shape itself: no hardcoded ISO date may sit in the generator's body-assembly source"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The source of atdd.planner.commands.author_issue"
    when:
      abstract: "The module source is scanned for literal ISO-8601 dates inside the Metadata table assembly"
    then:
      abstract:
        - "No literal YYYY-MM-DD string is emitted into the Date row"
        - "The check names the offending line when it fails, so the fix location is unambiguous"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-09-06"
