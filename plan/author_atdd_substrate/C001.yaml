urn: "wmbt:author-atdd-substrate:C001"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "malformed-author-input"
context_clarifier: "when any `atdd author` subcommand is invoked, the shared spine must validate the role, id, and path before routing to a per-kind writer so no invalid input ever reaches a write path"
lens: "functional.effectiveness"
statement: "minimize likelihood of malformed-author-input by having the shared atdd author spine reject an invalid role, id, or path before any per-kind writer runs"
acceptances:
  - identity:
      urn: "acc:author-atdd-substrate:C001-UNIT-001-spine-rejects-bad-role"
      id: "AC-UNIT-001"
      purpose: "the spine rejects an unknown role before dispatch"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An author input with role 'nonsense' (not a known ATDD role)"
    when:
      abstract: "validate_author_input(role='nonsense', id=..., path=...) is called"
    then:
      abstract:
        - "Validation fails with a role error"
        - "No per-kind writer is invoked"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-14"
  - identity:
      urn: "acc:author-atdd-substrate:C001-UNIT-002-spine-rejects-bad-id-and-path"
      id: "AC-UNIT-002"
      purpose: "the spine rejects a malformed id and a path outside the canonical home"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An author input with a malformed id and a path outside the kind's canonical home"
    when:
      abstract: "validate_author_input() is called"
    then:
      abstract:
        - "Validation fails citing the malformed id"
        - "Validation fails citing the out-of-home path"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-14"
  - identity:
      urn: "acc:author-atdd-substrate:C001-SMOKE-001-cli-refuses-bad-input"
      id: "AC-SMOKE-001"
      purpose: "Verify `atdd author` exits non-zero and writes nothing when given an invalid role/id/path against the real CLI"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A real repo checkout and the installed atdd author CLI"
        - "An invocation carrying an invalid role, id, and path"
    when:
      abstract: "atdd author <kind> is run with the invalid input"
    then:
      abstract:
        - "The process exits non-zero with a validation error"
        - "No artifact file is created or modified on disk"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-14"
