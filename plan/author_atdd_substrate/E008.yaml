urn: "wmbt:author-atdd-substrate:E008"
step: "execute"
direction: "maximize"
dimension: "likelihood"
object_of_control: "issue-publish-to-store"
context_clarifier: "when authoring an issue via `atdd author issue`, the writer must — by default, with no extra flag — perform the store-first publish: write the work_item into the State Store (objects.upsert keyed by the slug, state = the Metadata Status, data carrying title/type/branch/train/feature/body) and then link exactly one github issue external_ref (#1220), so authoring FILES the issue in the canonical SoT instead of emitting a body-only string (the gap that orphaned #1271). GitHub is a store-first projection: the issue is created synchronously via the coach-free integrations.github primitive and its number linked as the ref; if that projection cannot complete the outbox is enqueued (durable retry) while the store work_item still stands (no orphan)."
lens: "functional.effectiveness"
statement: "maximize likelihood of issue-publish-to-store when authoring via `atdd author issue` (store-first work_item + exactly one github external_ref, by default)"
acceptances:
  - identity:
      urn: "acc:author-atdd-substrate:E008-SMOKE-001-author-issue-publishes-to-live-store"
      id: "AC-SMOKE-001"
      purpose: "Verify `atdd author issue` publishes a work_item + a single github external_ref into a live State Store, run via the installed CLI against a real Control Root"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A real repo checkout, an initialized ATDD Control Root (State Store), and the installed atdd author CLI"
        - "A stubbed `gh` on PATH that returns a canned issue URL (so the projection resolves without touching production GitHub)"
    when:
      abstract: "atdd author issue --title <t> --type implementation --status INIT --slug <slug> is run against the Control Root"
    then:
      abstract:
        - "A work_item object keyed by <slug> exists in the State Store with state INIT and data carrying title/type/branch/train/feature/body"
        - "Exactly one github issue external_ref is linked to that work_item (one-per-issue, #1220)"
        - "No body-only output path was taken — the command created, it did not merely author"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-30"
