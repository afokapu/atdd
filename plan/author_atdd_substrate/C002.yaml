urn: "wmbt:author-atdd-substrate:C002"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "invalid-convention-node"
context_clarifier: "when authoring a convention-node, the writer must reject a structurally invalid node — a bad role, a bad rule_id, a semantic subfolder under nodes/, or a numbered term id"
lens: "functional.effectiveness"
statement: "minimize likelihood of accepting an invalid-convention-node (bad role, bad rule_id, semantic subfolder, numbered term id)"
acceptances:
  - identity:
      urn: "acc:author-atdd-substrate:C002-UNIT-001-rejects-bad-role-and-rule-id"
      id: "AC-UNIT-001"
      purpose: "validate_convention_node rejects an unknown role and a malformed rule_id"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A convention-node with an unknown role and a separate one with a malformed rule_id"
    when:
      abstract: "validate_convention_node() is called on each"
    then:
      abstract:
        - "The unknown-role node is rejected with a role error"
        - "The malformed rule_id node is rejected with a rule_id error"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-14"
  - identity:
      urn: "acc:author-atdd-substrate:C002-UNIT-002-rejects-subfolder-and-numbered-term"
      id: "AC-UNIT-002"
      purpose: "validate_convention_node rejects a semantic subfolder path and a numbered term id"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A node whose path uses a semantic subfolder under nodes/"
        - "A node carrying a numbered term id"
    when:
      abstract: "validate_convention_node() is called on each"
    then:
      abstract:
        - "The semantic-subfolder node is rejected (flat home required)"
        - "The numbered-term-id node is rejected"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-14"
  - identity:
      urn: "acc:author-atdd-substrate:C002-SMOKE-001-cli-rejects-bad-node"
      id: "AC-SMOKE-001"
      purpose: "Verify `atdd author convention-node` exits non-zero and writes nothing for a structurally invalid node in a real checkout"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A real repo checkout and the installed atdd author CLI"
        - "An invocation with a bad role / bad rule_id / subfolder / numbered term"
    when:
      abstract: "atdd author convention-node is run with the invalid node"
    then:
      abstract:
        - "The process exits non-zero with a structural validation error"
        - "No node file is created under nodes/"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-14"
