urn: "feature:author-atdd-substrate:author-contract"
wagon: "wagon:author-atdd-substrate"
description: "First-class authoring of a contract as a plan unit. `atdd plan` gains a contract unit kind that flows through add → decide → confirm → author like every other artifact: the plan Confirm→author seam (build_author_fn) dispatches kind contract to create_contract, and the `atdd author contract` subcommand invokes the same writer. create_contract validates the theme-first identity, derives the schema path from it (contracts/{theme}/…/{aspect}.schema.json), sets $id to contract:{identity}, writes a schema-valid draft-07 JSON Schema, and dedup-inserts a thin entry into contracts/_contracts.yaml. An invalid identity (bad shape or unknown theme) is rejected before any write. Contracts stop being hand-authored loose files outside the guardrails."
sizing:
  wmbts: 1
  footprint_score: 5
  footprint_size: "S"
wmbts:
  - "wmbt:author-atdd-substrate:E008"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "atdd author contract subcommand + the build_author_fn contract dispatch case"
    application:
      - type: "use_cases"
        count: 2
        rationale: "create_contract() (validate-then-write: derive path, set $id, write schema); _contracts.yaml dedup-insert + stable-sort by id"
    domain:
      - type: "value_objects"
        count: 2
        rationale: "ContractIdentity (theme-first {theme}(:{category})*:{aspect}(.{variant})?, path derivation); ContractRegistryEntry (id, urn, path)"
    integration:
      - type: "adapters"
        count: 1
        rationale: "contracts/_contracts.yaml sorted-insert writer + schema-file writer"
