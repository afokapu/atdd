urn: "feature:author-atdd-substrate:author-relationship"
wagon: "wagon:author-atdd-substrate"
description: "Authoring of relationship edges into the single src/atdd/coach/graph/relationships.yaml registry via load → dedup-insert → stable-sort by source_ref → atomic write. Idempotent re-insert is a no-op. A re-sort/dedup git merge driver handles concurrent inserts. Malformed edges (invalid type, malformed rule_id#term_id ref, non-role-prefixed id) are rejected."
sizing:
  wmbts: 2
  footprint_score: 5
  footprint_size: "S"
wmbts:
  - "wmbt:author-atdd-substrate:E002"
  - "wmbt:author-atdd-substrate:C003"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "atdd author relationship subcommand"
    application:
      - type: "use_cases"
        count: 2
        rationale: "insert_edge() (dedup-insert + stable-sort + atomic write); validate_edge() guard"
    domain:
      - type: "value_objects"
        count: 2
        rationale: "RelationshipEdge (type, source_ref, target_ref); EdgeRef (rule_id#term_id)"
    integration:
      - type: "adapters"
        count: 1
        rationale: "relationships.yaml sorted-insert merge-driver-backed writer"
