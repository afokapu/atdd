urn: "wmbt:author-atdd-substrate:C003"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "malformed-edge"
context_clarifier: "when authoring a relationship edge, the writer must reject a malformed edge — an invalid relationship type, a malformed rule_id#term_id reference, or a non-role-prefixed id"
lens: "functional.effectiveness"
statement: "minimize likelihood of accepting a malformed-edge (invalid type, malformed rule_id#term_id ref, non-role-prefixed id)"
acceptances:
  - identity:
      urn: "acc:author-atdd-substrate:C003-UNIT-001-rejects-bad-type-and-ref"
      id: "AC-UNIT-001"
      purpose: "validate_edge rejects an invalid relationship type and a malformed rule_id#term_id reference"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An edge with an invalid relationship type and one with a malformed rule_id#term_id ref"
    when:
      abstract: "validate_edge() is called on each"
    then:
      abstract:
        - "The invalid-type edge is rejected with a type error"
        - "The malformed-ref edge is rejected with a reference error"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-14"
  - identity:
      urn: "acc:author-atdd-substrate:C003-UNIT-002-rejects-non-role-prefixed-id"
      id: "AC-UNIT-002"
      purpose: "validate_edge rejects an id that is not role-prefixed"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An edge whose source or target id lacks a role prefix"
    when:
      abstract: "validate_edge() is called"
    then:
      abstract:
        - "The edge is rejected citing the non-role-prefixed id"
        - "relationships.yaml is not modified"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-14"
  - identity:
      urn: "acc:author-atdd-substrate:C003-SMOKE-001-cli-rejects-bad-edge"
      id: "AC-SMOKE-001"
      purpose: "Verify `atdd author relationship` exits non-zero and leaves relationships.yaml untouched for a malformed edge in a real checkout"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A real repo checkout and the installed atdd author CLI"
        - "An invocation carrying a malformed edge"
    when:
      abstract: "atdd author relationship is run with the malformed edge"
    then:
      abstract:
        - "The process exits non-zero with a validation error"
        - "relationships.yaml is unchanged on disk"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-14"
