action: defines the SyncProvider seam and its registration surface, statically enforces the core-never-imports-provider
  law, drives the full workflow against a bare remote with no providers, pins core and provider digests
  into .atdd/extensions.lock, and proves an attached extension mirrors through external_refs.* only
context: core-provider-boundary, milestone-m5, zero providers registered against a bare git remote
description: 'Milestone M5: prove ATDD core is provider-free. Core defines the SyncProvider seam (mirror/detect_drift/digest)
  and a registration/discovery surface that is empty by default; a static import-boundary test enforces
  the §8.1 boundary law (provider code imports core, core never imports provider code); a non-GitHub remote
  conformance suite drives the full workflow against a bare git remote with zero providers; .atdd/extensions.lock
  pins the core schema, lifecycle-policy and merge-policy digests alongside every provider digest; and
  a cross-repo smoke test proves a registered extension is presentation-only — its failure never blocks
  merge and it writes back only through the constrained external_refs.* path.'
features:
- urn: feature:isolate-provider-boundary:define-provider-interface
- urn: feature:isolate-provider-boundary:register-sync-providers
- urn: feature:isolate-provider-boundary:enforce-import-boundary
- urn: feature:isolate-provider-boundary:verify-remote-conformance
- urn: feature:isolate-provider-boundary:lock-extension-digests
- urn: feature:isolate-provider-boundary:validate-extension-integration
- urn: feature:isolate-provider-boundary:surface-undrainable-outbox
goal: make it impossible for a lifecycle decision to depend on GitHub, so an extension can be attached
  or removed without changing what core decides
name: Isolate Provider Boundary
outcome: core completes its full workflow with zero providers against a bare git remote, the import-boundary
  test is green, .atdd/extensions.lock pins every core and provider digest, and a registered extension
  provider mirrors without ever blocking merge
