wmbt:
  C001: minimize likelihood of a core-provider-import surviving into main, by statically walking the core
    import graph and failing on any provider, gh, or GitHub-API dependency reachable from a lifecycle
    module
  C002: maximize likelihood of a provider-free-workflow completing end to end against a bare git remote
    with zero providers registered, proving no lifecycle decision depends on GitHub
  D001: maximize likelihood of a sync-provider-interface that core owns and providers implement, where
    mirror() yields only bot-namespaced ExternalRefUpdate records, detect_drift() is alarm-only, and no
    authoritative state ever crosses back into core
  E001: maximize likelihood of a provider-registration and discovery seam that is empty by default, deterministic
    in ordering, and never consulted by a lifecycle decision
  E002: maximize likelihood of a deterministic extensions-lock that pins the core schema, lifecycle policy
    and merge policy digests alongside every registered provider digest, so a drifting extension is detected
    before it mirrors
  E003: maximize likelihood of undrainable-outbox-visibility, so that a non-empty outbox whose rows no
    registered provider can route is named, surfaced by every operator surface that would otherwise
    report health, and dispositionable with a recorded reason
  K001: maximize likelihood of a core-extension-smoke proving the mirror is presentation-only, where a
    failing provider never blocks merge and the only projection write-back is through the constrained
    external_refs path
  total: 7
