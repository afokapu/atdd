urn: wmbt:isolate-provider-boundary:D001
step: define
direction: maximize
dimension: likelihood
object_of_control: sync-provider-interface
context_clarifier: when core declares the provider seam (§8.2) as a Protocol with mirror/detect_drift/digest,
  mirror returns only bot-namespaced ExternalRefUpdate records, detect_drift is alarm-only, and no provider
  implementation is imported by core
lens: functional.effectiveness
statement: maximize likelihood of a sync-provider-interface that core owns and providers implement, where
  mirror() yields only bot-namespaced ExternalRefUpdate records, detect_drift() is alarm-only, and no
  authoritative state ever crosses back into core
acceptances:
- given:
    abstract:
    - A SyncProvider stub whose mirror() returns an ExternalRefUpdate outside the bot namespace
    - A second stub whose detect_drift() returns a record claiming authoritative lifecycle state
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-001
    phase: RED
    purpose: mirror() output carrying a non-bot-namespaced or authoritative-state record is rejected at
      the seam
    urn: acc:isolate-provider-boundary:D001-UNIT-001-rejects-non-bot-external-ref
  metadata:
    author: atdd:self-compliance
    created: '2026-07-09'
  then:
    abstract:
    - The non-bot-namespaced ExternalRefUpdate is rejected and never reaches external_refs
    - The authoritative-state drift record is rejected as an alarm-only contract violation
    - No projection field outside external_refs.* is written
  when:
    abstract: core applies the provider result through the constrained external_refs update path
- given:
    abstract:
    - The core provider module and a conforming in-memory SyncProvider implementation
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-002
    phase: GREEN
    purpose: the SyncProvider Protocol declares name, mirror, detect_drift and digest with the ObjectSnapshot/ExternalRefUpdate/DriftAlarm/ExtensionDigest
      types
    urn: acc:isolate-provider-boundary:D001-UNIT-002-protocol-shape-holds
  metadata:
    author: atdd:self-compliance
    created: '2026-07-09'
  then:
    abstract:
    - The implementation satisfies the Protocol (name, mirror, detect_drift, digest)
    - mirror() accepts list[ObjectSnapshot] and returns list[ExternalRefUpdate]
    - digest() returns an ExtensionDigest carrying version and sha256 digest
  when:
    abstract: the conforming implementation is structurally checked against the SyncProvider Protocol
- identity:
    urn: acc:isolate-provider-boundary:D001-SMOKE-001-sync-provider-interface
    id: AC-SMOKE-001
    phase: SMOKE
    purpose: 'End-to-end: sync-provider-interface holds against a real repo checkout, the installed atdd
      CLI, and a real .atdd/state/state.sqlite — no manual patching.'
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A real repo checkout, the installed atdd CLI, and a real local State Store exercising sync-provider-interface
  when:
    abstract: the D001 behavior is driven end-to-end through the real CLI
  then:
    abstract:
    - sync-provider-interface is observed to hold end-to-end against real infrastructure, with no mocks
      or manual patching
  metadata:
    author: atdd:self-compliance
    created: '2026-07-10'
