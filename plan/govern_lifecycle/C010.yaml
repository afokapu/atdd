urn: wmbt:govern-lifecycle:C010
step: confirm
direction: minimize
dimension: likelihood
object_of_control: an-operator-approval-token-signed-once-for-one-branch-verifying-on-every-other-branch-and-indefinitely-into-the-future-because-canonical-scope-signs-only-issue-from-to-and-binds-neither-a-branch-nor-a-moment-in-time
context_clarifier: 'canonical_scope() signs only <issue>:<FROM>:<TO>, so verify_token
  is content-based and path-independent: a token minted in any checkout verifies in
  every other checkout forever, measured live on 2026-07-18 as 19 of 19 main-signed
  tokens verifying from an unrelated worktree'
lens: functional.effectiveness
statement: minimize likelihood of an-operator-approval-token-signed-once-for-one-branch-verifying-on-every-other-branch-and-indefinitely-into-the-future-because-canonical-scope-signs-only-issue-from-to-and-binds-neither-a-branch-nor-a-moment-in-time
  by widening the signed scope to bind the branch and an expiry, so verification rejects
  a token presented on a branch it was not signed for and a token presented after
  its expiry
acceptances:
- identity:
    urn: acc:govern-lifecycle:C010-UNIT-001-scope-binds-branch
    id: AC-UNIT-001
    purpose: "The signed canonical scope binds the branch, so a token minted for branch\
      \ A is REJECTED when verified against branch B, while the same token still verifies\
      \ against branch A \u2014 the replay-across-branch property measured live on\
      \ 2026-07-18 is closed"
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - The pure canonical_scope / sign_approval / verify_token functions (stdlib-only,
      no I/O)
    - A token built for issue N, PLANNED->RED, branch 'feat/alpha', with an expiry
      in the future
    - The identical token bytes presented for verification against branch 'feat/beta'
  when:
    abstract: verify_token is evaluated for the token against branch 'feat/alpha'
      and again against branch 'feat/beta'
  then:
    abstract:
    - Verification against branch 'feat/alpha' returns True
    - Verification against branch 'feat/beta' returns False (the signed scope binds
      the branch)
    - canonical_scope output for the two branches differs, so the signature cannot
      coincide
    - A token carrying no branch field at all verifies False against every branch
      (fail-closed, no exception flow)
  metadata:
    author: atdd:self-compliance
    created: '2026-07-18'
- identity:
    urn: acc:govern-lifecycle:C010-UNIT-002-scope-binds-expiry
    id: AC-UNIT-002
    purpose: "The token carries a signed expiry, so a token presented after its expiry\
      \ is REJECTED while an unexpired token verifies \u2014 a token stops being eternal"
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - The pure verify_token function taking an explicit 'now' so the test needs no
      wall-clock sleep
    - A token for issue N, PLANNED->RED, branch B, whose expiry is a fixed instant
    - 'Two evaluation instants: one before the expiry and one after it'
  when:
    abstract: verify_token is evaluated at the instant before the expiry and again
      at the instant after it
  then:
    abstract:
    - Verification at the instant before the expiry returns True
    - Verification at the instant after the expiry returns False
    - A token whose expiry field is absent, malformed, or non-numeric verifies False
      (fail-closed, no exception escapes the pure verifier)
    - The expiry is covered by the signature, so editing the expiry in the token body
      invalidates it rather than extending its life
  metadata:
    author: atdd:self-compliance
    created: '2026-07-18'
- identity:
    urn: acc:govern-lifecycle:C010-INTEGRATION-002-guards-are-not-stubs-under-fault-injection
    id: AC-INTEGRATION-002
    purpose: "Each new guard is shown to be load-bearing: removing the branch binding,\
      \ and separately the expiry check, turns the suite RED \u2014 no guard is a\
      \ stub that cannot fail"
    phase: GREEN
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A copy of the approval module source under a temp path, so the real tree is
      never mutated
    - A fault injector that removes the branch component from the canonical scope,
      and a second that removes the expiry comparison
    - The branch and expiry acceptances above as the suite under observation
  when:
    abstract: each fault is injected in isolation and the observing suite is re-run
      against the mutated copy
  then:
    abstract:
    - Each injection's anchor is asserted to have matched EXACTLY ONCE, so a silently
      non-matching regex cannot pass as a removed guard
    - The mutated source is asserted to still parse, so a syntax error cannot masquerade
      as a failing guard
    - Removing the branch binding turns the branch acceptance RED
    - Removing the expiry comparison turns the expiry acceptance RED
    - With no fault injected the suite is GREEN, establishing the fault as the sole
      cause of each failure
  metadata:
    author: atdd:self-compliance
    created: '2026-07-18'
- identity:
    urn: acc:govern-lifecycle:C010-SMOKE-001-real-token-does-not-replay-across-checkouts
    id: AC-SMOKE-001
    purpose: "Against the real installed package in a real checkout: an operator-signed
      token minted for one branch does not verify for another, and does still verify
      for its own \u2014 the live 19-of-19 replay reproduction is closed in the shipped
      code, not merely in the test tree"
    phase: SMOKE
  harness:
    type: smoke
    category: backend
  given:
    abstract:
    - A real checkout and the real atdd package, exercised in a separate real process
      (no in-process import of the module under test, no monkeypatching)
    - A real operator-signed token minted through the real build_token for branch
      'feat/alpha'
    - The same token bytes presented for verification against a different branch
  when:
    abstract: a subprocess mints the token and verifies it against its own branch
      and against a different branch, printing both verdicts
  then:
    abstract:
    - The subprocess exits zero and reports the token verifying True on the branch
      it was signed for
    - The subprocess reports the token verifying False on any other branch
    - The refusal comes from the shipped signing/verification path, so the replay
      property is closed in the real artifact
    - 'Scope note (CLOSED by #1721, 2026-08-04): this acceptance covers the pure
      signing/verification path only. Refusal at the TRANSITION gate additionally
      required the mint and the gate consumer to PASS branch/expires_at, which
      neither did — the binding shipped inert. C010-INTEGRATION-003/004/005 below
      cover the call sites; the seam is no longer unowned.'
  metadata:
    author: atdd:self-compliance
    created: '2026-07-22'
- identity:
    urn: acc:govern-lifecycle:C010-INTEGRATION-003-branch-binding-is-enforced-at-the-gate
    id: AC-INTEGRATION-003
    purpose: "The branch binding is enforced at the TRANSITION gate, not merely recorded
      in the token: the real mint binds the branch the State Store binds the issue to,
      and the real ApprovalTokenGateCheck refuses the same token once the issue is bound
      to a different branch — with a message NAMING the branch change rather than
      reporting a malformed or mis-scoped token"
    phase: GREEN
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - An isolated Control Root whose State Store binds the issue to a branch, and the
      real approve command and real ApprovalTokenGateCheck (no stubbed sign/verify)
    - A token minted by the real mint while the issue is bound to branch A
    - 'Two arrangements: the issue still bound to branch A, and the issue re-bound to
      branch B (a rename or a recreated worktree)'
  when:
    abstract: the real gate check is evaluated for the same transition in each arrangement
  then:
    abstract:
    - The minted token carries branch A, so the binding is recorded and not merely
      passed
    - With the issue still bound to branch A the check PASSES
    - With the issue re-bound to branch B the check FAILS — the binding is enforced at
      the gate, which is what #1525 shipped and neither call site connected
    - The refusal message names BOTH branches and says the branch changed; it does not
      report a scope/signature mismatch, because the token is intact
    - The branch is resolved from the STORE binding at both ends, never from the current
      directory, so the verdict does not depend on which worktree the gate ran in
  metadata:
    author: atdd:self-compliance
    created: '2026-08-04'
- identity:
    urn: acc:govern-lifecycle:C010-INTEGRATION-004-expired-token-names-expiry
    id: AC-INTEGRATION-004
    purpose: "An approval stops being valid: the real mint stamps an expiry, a token
      past it is REFUSED at the gate, and the refusal NAMES EXPIRY as the cause —
      the distinction that separates 'your approval aged out, re-approve' from 'this
      token is malformed or forged', which the pre-#1721 message could not make"
    phase: GREEN
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - An isolated Control Root whose State Store binds the issue to a branch, and the
      real mint and real ApprovalTokenGateCheck
    - A token minted by the real mint, carrying the expiry the mint stamps rather than
      one the test wrote
    - 'Two evaluation instants supplied to the check: one before the recorded expiry and
      one after it, so no wall-clock sleep is needed'
  when:
    abstract: the real gate check is evaluated at the instant before the expiry and
      again at the instant after it
  then:
    abstract:
    - The minted token carries an expires_at, and it is the approved_at plus the decided
      TTL — the duration is asserted against the mint, not restated by the test
    - Evaluation before the expiry PASSES
    - Evaluation after the expiry FAILS
    - The refusal names expiry as the cause and quotes both instants; it does NOT report
      a malformed, mis-scoped, or mis-signed token, which is what it read as before
    - The token's signature is still intact at that point, so expiry is established by
      elimination rather than inferred from a failed signature
  metadata:
    author: atdd:self-compliance
    created: '2026-08-04'
- identity:
    urn: acc:govern-lifecycle:C010-INTEGRATION-005-pre-binding-tokens-keep-their-regime
    id: AC-INTEGRATION-005
    purpose: "The 169 tokens minted before the binding existed carry neither branch nor
      expires_at and are NOT retro-invalidated: they are read under the regime they were
      minted in, the decision is asserted rather than left implicit, and the gate says
      which regime a token belongs to so an unbound token cannot present as a bound one"
    phase: GREEN
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A token in the pre-binding shape — the exact field set measured across all 169
      live tokens on 2026-08-03, carrying no branch and no expires_at
    - The real ApprovalTokenGateCheck, and an issue whose store binding is present in
      one arrangement and absent in another
  when:
    abstract: the real gate check is evaluated against the pre-binding token
  then:
    abstract:
    - The pre-binding token still satisfies its own transition, so versioning the scope
      is not a silent migration (the same boundary #1718 drew for schema_version)
    - It does so whether or not the issue has a resolvable branch binding, because a
      token that asserts no binding cannot be refused for one it never claimed
    - The pass message identifies it as a PRE-BINDING token, so a reader can tell the
      two regimes apart at the gate rather than by opening the file
    - A token carrying an expiry but no branch is NOT treated as pre-binding — it is
      refused, and the message says it carries no branch binding
  metadata:
    author: atdd:self-compliance
    created: '2026-08-04'
