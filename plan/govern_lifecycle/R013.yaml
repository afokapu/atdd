urn: wmbt:govern-lifecycle:R013
step: resolve
direction: minimize
dimension: likelihood
object_of_control: the-repo-asserting-two-contradictory-models-for-what-an-installed-hook-is
context_clarifier: the installer writes a fixed-content dispatcher for every hook while two
  validators require five of them to stay byte-identical snapshots of their templates; both
  cannot hold, and the contradiction is invisible until someone runs upgrade or sync, which
  rewrites tracked files under them
lens: functional.sustainability
statement: minimize likelihood of the-repo-asserting-two-contradictory-models-for-what-an-installed-hook-is
  by finishing the migration the installer already performs — every installed hook a dispatcher
  — and retiring the byte-identity assertions that encode the abandoned model
acceptances:
- identity:
    urn: acc:govern-lifecycle:R013-UNIT-001-every-installed-hook-is-a-dispatcher
    id: AC-UNIT-001
    purpose: five hooks still tracked as snapshots are frozen at install AND fail open when
      the toolkit is missing — a gate that neither protects nor announces that it stopped
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - the hook files this repository tracks as installed
  when:
    abstract: each is read and classified
  then:
    abstract:
    - every one of them is a dispatcher, so none can freeze at install time
    - none is a copy of its template, so an upgrade cannot leave a tracked file rewritten
- identity:
    urn: acc:govern-lifecycle:R013-UNIT-002-retiring-the-byte-identity-rule-loses-no-coverage
    id: AC-UNIT-002
    purpose: the two assertions being retired encode the abandoned model, but they sit beside
      tests that do real work, and deleting a neighbour by accident is how a migration silently
      removes enforcement
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - the two validator modules that held the byte-identity assertions
  when:
    abstract: their remaining tests are collected and run
  then:
    abstract:
    - no assertion comparing an installed hook against its template survives
    - every other check in those modules still runs, and each reads the template rather than
      the installed file, so none of them depended on the retired model
- identity:
    urn: acc:govern-lifecycle:R013-SMOKE-001-migrated-hooks-still-gate-a-real-repository
    id: AC-SMOKE-001
    purpose: the whole risk of this change is disabling enforcement while appearing to tidy
      it, so the proof has to be a real hook refusing a real operation
    phase: SMOKE
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - a real repository whose installed hooks are dispatchers and whose toolkit is resolvable
  when:
    abstract: an operation the hooks exist to refuse is attempted on the protected branch
  then:
    abstract:
    - it is refused, and the refusal comes from the gate logic rather than from the dispatcher
      failing to resolve
    - with the toolkit made unresolvable the same operation is refused too, so the migration
      fails closed rather than open
