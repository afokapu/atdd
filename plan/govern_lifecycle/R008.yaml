urn: "wmbt:govern-lifecycle:R008"
step: "resolve"
direction: "minimize"
dimension: "likelihood"
object_of_control: "bypass-token-reintroduction-to-agent-context-going-undetected-in-ci"
context_clarifier: "After E022 strips ATDD_SKIP_* from CLAUDE.md, any future contributor (human or agent) could re-add a bypass token to CLAUDE.md without a CI signal. This would silently re-open the bypass-discovery vector that #851 closed at the gate level. Fix: a new coach-phase meta-validator (coach.claude_md.no_bypass_advertising, sev 3, strict) greps CLAUDE.md for ATDD_SKIP_*, --no-verify, and similar bypass token patterns, failing CI if any are found. The validator runs as part of `atdd validate coach` and is complementary to R002 (size budget): R002 catches bloat, R003 catches bypass re-introduction."
lens: "functional.effectiveness"
statement: "minimize likelihood of bypass-token-reintroduction-to-agent-context-going-undetected-in-ci by adding a meta-validator coach.claude_md.no_bypass_advertising (sev 3, strict) that greps CLAUDE.md for ATDD_SKIP_* and --no-verify tokens, failing CI if any are found, integrated into the `atdd validate coach` suite"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:R008-UNIT-001-validator-fails-when-claude-md-contains-atdd-skip-token"
      id: "AC-UNIT-001"
      purpose: "The coach.claude_md.no_bypass_advertising validator raises a ValidationError when given CLAUDE.md content containing an ATDD_SKIP_* env-var token"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A synthetic CLAUDE.md containing the string 'ATDD_SKIP_POSTCOMMIT=1'"
        - "coach.claude_md.no_bypass_advertising validator imported and instantiated"
    when:
      abstract: "The validator is run against the synthetic file"
    then:
      abstract:
        - "A validation error is raised or violation count > 0"
        - "Error message identifies the matched bypass token and line number"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
  - identity:
      urn: "acc:govern-lifecycle:R008-UNIT-002-validator-passes-when-claude-md-is-clean"
      id: "AC-UNIT-002"
      purpose: "The coach.claude_md.no_bypass_advertising validator passes (no error) when given CLAUDE.md content with no bypass tokens"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A synthetic CLAUDE.md with no ATDD_SKIP_* or --no-verify tokens"
        - "coach.claude_md.no_bypass_advertising validator imported and instantiated"
    when:
      abstract: "The validator is run against the clean synthetic file"
    then:
      abstract:
        - "No validation error is raised"
        - "Violation count is 0"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
  - identity:
      urn: "acc:govern-lifecycle:R008-SMOKE-001-atdd-validate-coach-includes-no-bypass-advertising-rule"
      id: "AC-SMOKE-001"
      purpose: "Running `atdd validate coach` against the live repo confirms the no_bypass_advertising rule is registered and executes without error (it should pass since E022 removed ATDD_SKIP_* from CLAUDE.md)"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "CLAUDE.md sanitized per E022 (zero ATDD_SKIP_* tokens)"
        - "coach.claude_md.no_bypass_advertising validator registered in the coach validator suite"
        - "ATDD_RUN_SMOKE=1 is set"
    when:
      abstract: "atdd validate coach is run from the repo root"
    then:
      abstract:
        - "The run completes"
        - "No no_bypass_advertising violation is reported"
        - "The rule ID 'coach.claude_md.no_bypass_advertising' appears in the validator output (rule ran)"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
