urn: "wmbt:govern-lifecycle:E009"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "runtime-artifacts-committed-into-feature-pr-diff"
context_clarifier: "when an agent runs atdd coach or any coach sub-command during development, coach writes ephemeral per-run state under .atdd/runtime/; if .atdd/runtime/ is not fully gitignored and an agent uses git add -A or git commit -a, that runtime state rides into the PR diff — PR #749 shipped .atdd/runtime/coach/358/planner-358-e7620840.session.json and two appended lines in .atdd/runtime/coach/decisions.jsonl from an unrelated zombie issue (#358); green CI gave false confidence because no check inspected the diff file set"
lens: "functional.effectiveness"
statement: "minimize likelihood of runtime-artifacts-committed-into-feature-pr-diff when an agent or developer commits changes during coach-active development by fully gitignoring .atdd/runtime/ and declaring a strict coach.pr.runtime-artifacts-blocked rule in pr.convention.yaml with a paired atdd validate coach validator that fails when the branch diff vs the default branch adds or modifies any .atdd/runtime/** path"
# acc:govern-lifecycle:E009-UNIT-001-convention-declares-runtime-artifacts-rule retired (#1207):
# the "convention declares + binds the rule" assertion moved to convention variant
# binding/runtime_artifacts_rule_binding (family-parity: binding = 4/4 both); the rule's
# severity/disposition/fix_hint properties are enforced generically by the
# presence/binding rule-id variants. The legacy anchored test
# (test_e009_unit_001_convention_declares_runtime_artifacts_rule.py) is decommissioned.
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:E009-UNIT-002-evaluator-emits-violation-on-runtime-path-in-diff"
      id: "AC-UNIT-002"
      purpose: "The pure evaluator emits exactly one Violation when the diff file set contains a path matching .atdd/runtime/**, and returns empty when no such path is present"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "evaluate_runtime_artifact_violations(changed_files) is the pure evaluator in test_e009_runtime_artifacts_blocked.py"
        - "changed_files is a list of file paths (strings) from the branch diff vs the default branch"
    when:
      abstract:
        - "evaluate_runtime_artifact_violations(['.atdd/runtime/coach/decisions.jsonl']) is called"
        - "evaluate_runtime_artifact_violations(['.atdd/runtime/agents/planner-358/events.jsonl', 'src/foo.py']) is called"
        - "evaluate_runtime_artifact_violations(['src/foo.py', 'plan/bar.yaml']) is called"
    then:
      abstract:
        - "First call returns exactly one Violation with rule_id coach.pr.runtime-artifacts-blocked"
        - "Second call returns exactly one Violation naming the .atdd/runtime path; src/foo.py does not trigger a Violation"
        - "Third call returns [] — no .atdd/runtime paths, no Violation"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"

  - identity:
      urn: "acc:govern-lifecycle:E009-SMOKE-001-real-validate-coach-runs-runtime-guard"
      id: "AC-SMOKE-001"
      purpose: "Running atdd validate coach --local --skip-api on this repo collects and executes test_e009_runtime_artifacts_blocked.py and it reports PASS (no .atdd/runtime paths in the current branch diff)"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "test_e009_runtime_artifacts_blocked.py is registered under src/atdd/coach/validators/"
        - ".atdd/runtime/ is fully gitignored with no tracked files remaining"
        - "The current branch diff vs the default branch contains no .atdd/runtime/** paths"
    when:
      abstract: "atdd validate coach --local --skip-api is invoked from the repo root"
    then:
      abstract:
        - "pytest collects test_e009_runtime_artifacts_blocked.py"
        - "The validator runs (not skipped) and reports PASS for the current branch"
        - "atdd rules show coach.pr.runtime-artifacts-blocked exits 0 and prints the strict disposition"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-18"
