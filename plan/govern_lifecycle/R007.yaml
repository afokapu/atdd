urn: "wmbt:govern-lifecycle:R007"
step: "resolve"
direction: "minimize"
dimension: "likelihood"
object_of_control: "claude-md-context-budget-violations-going-undetected-in-ci"
context_clarifier: "After E023 slims CLAUDE.md to ≤ 250 lines, there is no automated gate preventing a future PR from growing CLAUDE.md past the budget. Any agent or human contributor adding detailed implementation notes to CLAUDE.md (the pre-#867 pattern) will silently re-introduce the context bloat without any CI signal. Fix: a new coach-phase meta-validator (coach.claude_md.size_budget, sev 3, strict) counts CLAUDE.md lines and fails with a clear error message when the count exceeds 250. The validator runs as part of `atdd validate coach` and blocks CI on violation."
lens: "functional.effectiveness"
statement: "minimize likelihood of claude-md-context-budget-violations-going-undetected-in-ci by adding a meta-validator coach.claude_md.size_budget (sev 3, strict) that counts CLAUDE.md lines and raises a validation error when the count exceeds 250, integrated into the `atdd validate coach` suite"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:R007-UNIT-001-validator-fails-when-claude-md-exceeds-budget"
      id: "AC-UNIT-001"
      purpose: "The coach.claude_md.size_budget validator raises a ValidationError (or equivalent) when given a CLAUDE.md with > 250 lines"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A synthetic CLAUDE.md with 251 lines (or more)"
        - "coach.claude_md.size_budget validator imported and instantiated"
    when:
      abstract: "The validator is run against the 251-line synthetic file"
    then:
      abstract:
        - "A validation error is raised or the validator returns a non-zero violation count"
        - "The error message references the line count and the 250-line budget"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
  - identity:
      urn: "acc:govern-lifecycle:R007-UNIT-002-validator-passes-when-claude-md-within-budget"
      id: "AC-UNIT-002"
      purpose: "The coach.claude_md.size_budget validator passes (no error) when given a CLAUDE.md with ≤ 250 lines"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A synthetic CLAUDE.md with exactly 250 lines"
        - "coach.claude_md.size_budget validator imported and instantiated"
    when:
      abstract: "The validator is run against the 250-line synthetic file"
    then:
      abstract:
        - "No validation error is raised"
        - "Violation count is 0"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
  - identity:
      urn: "acc:govern-lifecycle:R007-SMOKE-001-atdd-validate-coach-includes-size-budget-rule"
      id: "AC-SMOKE-001"
      purpose: "Running `atdd validate coach` against the live repo confirms the size_budget rule is registered and executes without error (it should pass since E023 slimmed CLAUDE.md to ≤ 250 lines)"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "CLAUDE.md slimmed to ≤ 250 lines per E023"
        - "coach.claude_md.size_budget validator registered in the coach validator suite"
        - "ATDD_RUN_SMOKE=1 is set"
    when:
      abstract: "atdd validate coach is run from the repo root"
    then:
      abstract:
        - "The run completes"
        - "No size_budget violation is reported (CLAUDE.md is within budget)"
        - "The rule ID 'coach.claude_md.size_budget' appears in the validator output (rule ran)"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
