wagon: govern-lifecycle
urn: "wagon:govern-lifecycle"
name: "Govern Lifecycle"
description: "Orchestrates ATDD lifecycle, manages GitHub issues, validates phase transitions, maintains registries"
theme: commons

subject: "agent:coach"
context: "in-atdd-lifecycle, phases-require-gates"
action: "validates compliance and orchestrates phase transitions"
goal: "ensure all agents follow ATDD conventions and quality gates"
outcome: "audit-passing repository with traceable plan-test-code graph"

produce:
  - name: commons:compliance:gate
    contract: "contract:commons:compliance:gate"
    telemetry: null
    to: external
  - name: commons:compliance:inventory
    contract: "contract:commons:compliance:inventory"
    telemetry: null
    to: external

consume:
  - name: commons:plan:manifest
    from: wagon:define-plans
  - name: commons:contract:schema
    from: wagon:verify-contracts
  - name: commons:code:implementation
    from: wagon:implement-code

features:
  - urn: "feature:govern-lifecycle:fix-issue-transition-side-effects"
  - urn: "feature:govern-lifecycle:enforce-orchestrate-ready-lifecycle"
  - urn: "feature:govern-lifecycle:enforce-issue-label-compliance"
  - urn: "feature:govern-lifecycle:custom-themes"
  - urn: "feature:govern-lifecycle:config-driven-code-roots"
  - urn: "feature:govern-lifecycle:orchestrate-pane-mode"
  - urn: "feature:govern-lifecycle:detect-stub-presentation-returns"
  - urn: "feature:govern-lifecycle:enforce-route-train-wagon-coverage"
  - urn: "feature:govern-lifecycle:atdd-issue-canonical-path"
  - urn: "feature:govern-lifecycle:enforce-smoke-refactor-phase-substrate"
  - urn: "feature:govern-lifecycle:issue-template-substrate-completeness"
  - urn: "feature:govern-lifecycle:init-emitted-command-drift-coverage"
  - urn: "feature:govern-lifecycle:worktree-layout-detects-flat-sibling"
  - urn: "feature:govern-lifecycle:hermetic-integration-execution-kind"
  - urn: "feature:govern-lifecycle:reliable-manifest-registration"
  - urn: "feature:govern-lifecycle:validator-blocks-runtime-artifacts-in-pr-diff"
  - urn: "feature:govern-lifecycle:keep-local-main-current-branch-from-origin"
  - urn: "feature:govern-lifecycle:coach-single-instance-lock-and-zombie-reaping"
  - urn: "feature:govern-lifecycle:on-main-manifest-exception-and-self-heal"
  - urn: "feature:govern-lifecycle:agent-behavior-rules-enforcement"
  - urn: "feature:govern-lifecycle:bulk-suppress-backfill"
  - urn: "feature:govern-lifecycle:docs-models-md-and-manifest-backfill"
  - urn: "feature:govern-lifecycle:pr-scoped-registry-drift-gate"
  - urn: "feature:govern-lifecycle:issue-author-validate-locally-publish-once"
  - urn: "feature:govern-lifecycle:rename-codex-conductor-md"
  - urn: "feature:govern-lifecycle:systemic-registry-drift-enforcement"
  - urn: "feature:govern-lifecycle:close-substrate-friction-regressions"
  - urn: "feature:govern-lifecycle:consumer-validator-scope-gate"

wmbt:
  total: 52
  R001: "minimize stale local manifest status after a successful GitHub transition"
  R002: "minimize misleading layout errors during post-transition re-enter"
  R003: "minimize stale hierarchy_coverage_features ratchet baseline carrying tactical baseline bumps"
  R004: "minimize branch-creation-gate rejections of repos already in flat-sibling worktree layout"
  D001: "minimize issues created without orchestrate-ready template body"
  D002: "minimize parent issues without GitHub WMBT sub-issues when plan artifacts exist"
  D003: "minimize undetected template drift across open issues"
  D004: "minimize missed parallelization opportunities at issue creation time"
  D005: "minimize unlabeled open issues invisible to coach validators"
  D006: "minimize atdd-issues missing required label set (phase/archetype/wagon)"
  D007: "minimize label drift between issue body metadata and GitHub labels"
  D008: "minimize pushed commits referencing unlabeled issues"
  D009: "minimize config files unable to declare domain-specific theme mappings"
  D010: "minimize duplicated hardcoded theme_map dicts across modules"
  D011: "minimize hardcoded implementation-root constants in coder validators blocking multi-stack adoption"
  D012: "minimize toolkit-self features invisible to the hierarchy-coverage validator"
  D013: "minimize schema drift between documented CLAUDE.md code: contract and enforced config"
  D014: "minimize multiplexer abstractions that bind the spawn unit to workspace-level only"
  D015: "minimize cmux pane and surface primitives left unreachable from the multiplexer abstraction"
  D016: "minimize orchestrate invocations that cannot opt into pane mode without forking"
  D017: "minimize convention rules whose letter (workspace) hides their intent (one isolated agent context)"
  D018: "minimize presentation components whose render body is statically empty (jel-app AuthGateShell incident, #318)"
  L001: "minimize manual theme discovery during atdd init"
  P001: "minimize blind theme prompts that force game-domain defaults on non-game repos"
  C001: "minimize invalid custom theme names accepted into config"
  E001: "minimize schema validation failures on valid custom theme names"
  M001: "minimize silent commons digit overrides that break cross-repo tooling"
  E002: "minimize issue-creation landing on wrong branch and leaving orphan worktrees"
  E003: "minimize wmbts-without-smoke-acceptance-and-prs-auto-closing-pre-smoke-issues when planner authors a WMBT or coach merges a PR (#681)"
  E004: "minimize newly-filed-issues shipping without graph context or cross-agent mirror"
  E005: "minimize init-emitted-atdd-invocations-that-fail-to-parse-under-the-live-cli when atdd init emits workflow templates and the drift-detection self-validate scans them (#481)"
  E006: "minimize hermetic-acceptances-that-omit-fidelity-declaration-or-skip-required-live-smoke-pairing"
  E008: "minimize atdd-issue leaving the manifest entry uncommitted when the tree has unrelated staged changes (#738)"
  E009: "minimize runtime-artifacts-committed-into-feature-pr-diff when an agent uses git add -A during coach-active development by fully gitignoring .atdd/runtime/ and adding a strict coach.pr.runtime-artifacts-blocked validator to atdd validate coach (#755)"
  E010: "minimize new-worktree-starts-behind-origin-default-branch by fetching origin/<default> before git worktree add and fast-forwarding the local default-branch worktree after each PR merge (ff-only, skip-with-notice when tracked files are modified, #770)"
  E011: "minimize concurrent-coach-processes-for-the-same-issue-and-zombie-coaches-that-never-exit by acquiring a per-issue PID lockfile at .atdd/runtime/coach/<N>/coach.lock on startup (refusing when a live PID holds it, auto-cleaning stale dead-PID locks) and self-terminating the watcher event loop via escalation when elapsed time since the last phase advance exceeds a configurable no-progress TTL (#724)"
  E012: "minimize manifest-registration-commits-blocked-on-main by adding a manifest-only staged-paths exception to the pre-commit hook, and minimize issues-missing-from-manifest-blocking-worktree-creation by making atdd branch <N> self-heal from GitHub and adding atdd issue reconcile for bulk backfill (#775)"
  Y004: "minimize pre-commit hook drift-detection that silently omits a notice when the current branch slug is absent from the manifest"
  Y005: "minimize atdd issue reconcile missing from the CLI when bulk backfill of unregistered open issues is needed"
  E013: "minimize issues-filed-without-duplicate-search when an operator runs atdd issue <slug> by running gh issue list --search before GitHub issue creation and aborting with a warning listing matches unless --no-dup-check is passed (#657)"
  E014: "minimize agent-spawn-commands-containing-dangerously-skip-permissions by detecting the forbidden flag in the adapter command string and raising SpawnPermissionViolation before the multiplexer dispatches (#657)"
  E015: "minimize agent-behavioral-rules-visible-only-in-per-user-memory by committing .atdd/agent-rules.yaml with the portable enforcement subset and injecting it into atdd gate output under an 'Agent Behavioral Rules' section (#657)"
  E016: "minimize consumer-repos-blocked-on-substrate-v12-cutover-without-a-backfill-tool by implementing atdd suppress backfill --rule <rule_id> --until <date> to bulk-insert inline suppress markers on pre-existing violation sites idempotently, plus orphaned-baseline-key warnings for stale integer-count entries in .atdd/baselines/coder.yaml (#482)"
  E017: "minimize operators-unable-to-find-adapter-documentation-or-run-manifest-backfill by creating docs/MODELS.md with the adapter table and wiring atdd manifest backfill as a CLI route to IssueManager.reconcile() (#664)"
  E018: "minimize pr-registry-gate-absorbs-unrelated-repo-wide-drift when a PR runs GT-002 by adding --scope changed-files to atdd registry update --check that limits drift detection to wagon sources in git diff main..HEAD (#582)"
  E019: "minimize issue-author-submits-non-compliant-body-or-triggers-redundant-create-edit-graphql-pair when an operator runs atdd issue <slug> by validating the full body locally (--check gate) before any GitHub call and publishing via a single gh issue create with no follow-up gh issue edit for body (#792)"
  E020: "minimize codex-agents-receiving-no-atdd-rules-because-sync-writes-deprecated-agents-md-not-conductor-md by renaming the persona template to CONDUCTOR.md.tmpl, updating AgentConfigSync.AGENT_FILES['codex'] to 'CONDUCTOR.md', and emitting a migration notice when a stale AGENTS.md with managed block is detected (#794)"
  E021: "minimize registry-mirror-drift-accumulates-on-main-because-no-push-or-ci-gate-enforces-atdd-registry-update-before-landing by applying a one-shot atdd registry update --yes chore commit, wiring atdd registry update --check into the pre-push hook, and adding a required atdd-registry-drift CI check on main so future WMBT additions cannot land without mirror resync (#817)"
  E022: "minimize core-bare-true-reappearing-in-shared-git-config by excluding SMOKE-tagged tests from the post-commit blast-radius run and adding a shell-level core.bare trap to the hook template (#845)"
  E023: "minimize distinct-environment-variables-required-for-routine-branch-push by adding ATDD_SKIP_ALL_GATES=1 meta-bypass, tightening the version gate to repo minimum_version, and making the registry check auto-heal rather than block (#845)"
  E024: "minimize publish-workflow-auto-skips-on-every-merge by removing the issues trigger from atdd-validate.yml and adding head_branch==main to the Publish condition (#845)"
  E025: "minimize red-phase-toolkit-tests-leaking-into-consumer-validator-sweep-because-skip-api-flag-disables-split-mode-and-bypasses-platform-marker-exclusion by moving the is_atdd_source_repo() consumer-mode platform-exclusion into run_tests() so it applies regardless of split mode, and adding a regression validator that fails if any Phase:RED test file in the validator dirs lacks the platform guard (#846)"
