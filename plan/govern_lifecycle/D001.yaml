urn: "wmbt:govern-lifecycle:D001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "define"
direction: "minimize"
dimension: "quantity"
object_of_control: "issues-created-without-orchestrate-ready-template-body"
context_clarifier: "when atdd issue <slug> creates a parent GitHub issue and the body must contain the Issue Metadata table, seeded Branch, Train, and Dependencies sections required by atdd orchestrate"
lens: "functional.effectiveness"
statement: "minimize quantity of issues-created-without-orchestrate-ready-template-body when atdd issue <slug> creates a parent GitHub issue and the body must contain the Issue Metadata table, seeded Branch, Train, and Dependencies sections required by atdd orchestrate"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:D001-UNIT-001-template-seed-on-create"
      id: "AC-UNIT-001"
      purpose: "Every atdd issue <slug> invocation produces a template-compliant body"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An atdd issue <slug> invocation with any valid slug"
    when:
      abstract: "The parent issue body is rendered and posted to GitHub"
    then:
      abstract:
        - "The posted body contains the Issue Metadata table with Branch, Train, and Dependencies entries"
        - "atdd issue <N> --check on the freshly-created issue reports 'template compliant'"
        - "Branch defaults to feat/issue-{num} when no override is given"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-04-14"
