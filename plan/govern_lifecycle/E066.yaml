urn: "wmbt:govern-lifecycle:E066"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "operator-emergency-bypass-mechanism-documented-as-copy-pasteable-env-var-in-agent-readable-context"
context_clarifier: "Pre-#867, CLAUDE.md documents emergency bypass as ATDD_SKIP_POSTCOMMIT=1 (an env-var copy-paste). Agents treat documented env vars as 'normal things to do when a gate is in the way'. The #851 work retired the bypass flags at the gate level, but the CLAUDE.md documentation remained as a discovery vector. The correct operator emergency path is the CLI: atdd emergency --reason '<text>', which creates a .atdd/EMERGENCY_BYPASS file with a 5-minute TTL, requiring conscious operator action. This path must be documented in docs/operator-emergency-bypass.md — an operator-only file that is not referenced by agent context loads. The docs/ file must NOT be inside an agent-scanned conventions directory."
lens: "functional.effectiveness"
statement: "minimize likelihood of operator-emergency-bypass-mechanism-documented-as-copy-pasteable-env-var-in-agent-readable-context by creating docs/operator-emergency-bypass.md documenting the atdd emergency --reason CLI path and explicitly marking it as operator-only; CLAUDE.md gains a single line pointing to this doc instead of the former env-var inline"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:E066-UNIT-001-operator-emergency-bypass-doc-exists"
      id: "AC-UNIT-001"
      purpose: "The file docs/operator-emergency-bypass.md exists in the repository; this confirms the operator override path is documented somewhere"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "Repository root after #867 edits"
    when:
      abstract: "Path('docs/operator-emergency-bypass.md').exists() is evaluated"
    then:
      abstract:
        - "Returns True (file exists)"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
  - identity:
      urn: "acc:govern-lifecycle:E066-UNIT-002-operator-emergency-bypass-doc-documents-cli-not-env-var"
      id: "AC-UNIT-002"
      purpose: "docs/operator-emergency-bypass.md contains the string 'atdd emergency' (the CLI command), and does NOT contain any ATDD_SKIP_* env-var form — the file promotes CLI-only override, not copy-paste env vars"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "docs/operator-emergency-bypass.md after #867 edits"
    when:
      abstract: "File content is read and searched for CLI command and env-var tokens"
    then:
      abstract:
        - "Content contains 'atdd emergency'"
        - "Content does not contain 'ATDD_SKIP_' tokens that could be copy-pasted by an agent"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
  - identity:
      urn: "acc:govern-lifecycle:E066-SMOKE-001-live-operator-emergency-bypass-doc-present-and-correct"
      id: "AC-SMOKE-001"
      purpose: "The deployed docs/operator-emergency-bypass.md is present in the live repo root after merge and documents the atdd emergency CLI path; confirmed against the real filesystem"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "Repository root after PR #867 is merged"
        - "ATDD_RUN_SMOKE=1 is set"
    when:
      abstract: "docs/operator-emergency-bypass.md is read from the live repo filesystem"
    then:
      abstract:
        - "File exists"
        - "Content contains 'atdd emergency'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
