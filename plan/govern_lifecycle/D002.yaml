urn: "wmbt:govern-lifecycle:D002"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "define"
direction: "minimize"
dimension: "quantity"
object_of_control: "parent-issues-without-github-wmbt-subissues-when-plan-artifacts-exist"
context_clarifier: "when a parent issue has feature and WMBT YAMLs on disk but the corresponding GitHub sub-issues were never created (backfilled issues, or issues whose plan artifacts were added later)"
lens: "functional.effectiveness"
statement: "minimize quantity of parent-issues-without-github-wmbt-subissues-when-plan-artifacts-exist when a parent issue has feature and WMBT YAMLs on disk but the corresponding GitHub sub-issues were never created"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:D002-UNIT-001-sync-wmbts-backfill"
      id: "AC-UNIT-001"
      purpose: "atdd issue <N> --sync-wmbts reconciles GitHub sub-issues with plan artifacts idempotently"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A parent issue N registered in .atdd/manifest.yaml with wagon and feature fields"
        - "A feature YAML listing N WMBT URNs"
        - "Some subset of the expected WMBT sub-issues already exists on GitHub"
    when:
      abstract: "atdd issue N --sync-wmbts is invoked"
    then:
      abstract:
        - "Missing WMBT sub-issues are created and linked to the parent"
        - "Existing WMBT sub-issues are left untouched (idempotent)"
        - "Project v2 custom fields are populated on newly created sub-issues"
        - "The command exits 0 and reports how many were created vs skipped"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-04-14"
