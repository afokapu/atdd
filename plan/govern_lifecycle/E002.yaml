urn: "wmbt:govern-lifecycle:E002"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "issue-creation-landing-on-wrong-branch-and-leaving-orphan-worktrees"
context_clarifier: "when atdd issue <slug> is called from a non-main branch the manifest commit lands on that branch instead of main; when the default flow does not chain to atdd branch <N> the operator assumes a worktree exists when it does not; when cancelled coach spawns leave only .launch_prompt.txt at sibling-of-main there is no CLI to detect or clean them"
lens: "functional.adaptability"
statement: "minimize likelihood of issue-creation-landing-on-wrong-branch-and-leaving-orphan-worktrees when atdd issue <slug> is called without a branch guard and without automatic worktree chaining"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:E002-UNIT-002-gc-classifier"
      id: "AC-UNIT-002"
      purpose: "_is_orphan(path, worktree_paths) -> bool returns True only for dirs containing only .launch_prompt.txt and not in real worktrees"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A tmp dir containing only .launch_prompt.txt (orphan candidate)"
        - "A tmp dir containing .launch_prompt.txt AND a python file (operator WIP — NOT orphan)"
        - "A tmp dir that IS a real worktree path (NOT orphan)"
        - "An empty tmp dir (NOT orphan — no launch_prompt marker)"
    when:
      abstract: "_is_orphan(path, worktree_paths) is called for each case"
    then:
      abstract:
        - "Returns True only for the dir with only .launch_prompt.txt and not in worktree_paths"
        - "Returns False for the dir with extra files"
        - "Returns False for the real worktree dir"
        - "Returns False for the empty dir"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"

  - identity:
      urn: "acc:govern-lifecycle:E002-INTEGRATION-006-gc-lists-orphans"
      id: "AC-INTEGRATION-006"
      purpose: "atdd worktree gc with a fixture orphan dir (only .launch_prompt.txt) lists it"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A git repo whose parent dir contains a sibling dir with only .launch_prompt.txt"
        - "git worktree list returns only the main worktree"
    when:
      abstract: "worktree_gc.gc(repo_root, apply=False) is called"
    then:
      abstract:
        - "Returns a list containing the orphan path"
        - "The orphan dir still exists (dry-run)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"

  - identity:
      urn: "acc:govern-lifecycle:E002-INTEGRATION-007-gc-apply-cleans"
      id: "AC-INTEGRATION-007"
      purpose: "atdd worktree gc --apply removes the listed orphan dir"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "Same setup as INTEGRATION-006"
    when:
      abstract: "worktree_gc.gc(repo_root, apply=True) is called"
    then:
      abstract:
        - "Returns a list containing the orphan path"
        - "The orphan dir no longer exists after the call"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"

  - identity:
      urn: "acc:govern-lifecycle:E002-INTEGRATION-008-gc-spares-real-worktrees"
      id: "AC-INTEGRATION-008"
      purpose: "gc does NOT list dirs that are in git worktree list output"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A git repo with a real linked worktree at a sibling dir containing only .launch_prompt.txt"
    when:
      abstract: "worktree_gc.gc(repo_root, apply=False) is called"
    then:
      abstract:
        - "The real worktree dir is NOT in the returned orphan list"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"

  - identity:
      urn: "acc:govern-lifecycle:E002-INTEGRATION-009-gc-spares-non-launch-prompt-dirs"
      id: "AC-INTEGRATION-009"
      purpose: "gc does NOT list sibling dirs that contain files other than .launch_prompt.txt"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A sibling dir containing .launch_prompt.txt AND a README.md (operator WIP)"
    when:
      abstract: "worktree_gc.gc(repo_root, apply=False) is called"
    then:
      abstract:
        - "The dir with extra files is NOT in the returned orphan list"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
