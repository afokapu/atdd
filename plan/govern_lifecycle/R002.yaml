urn: "wmbt:govern-lifecycle:R002"
step: "resolve"
direction: "minimize"
dimension: "quantity"
object_of_control: "misleading-layout-errors-during-post-transition-reenter"
context_clarifier: "when the post-transition re-enter path runs a worktree-layout check that is only meaningful for branch creation and bails even though the transition itself already succeeded"
lens: "functional.efficiency"
statement: "minimize quantity of misleading-layout-errors-during-post-transition-reenter when the post-transition re-enter path runs a worktree-layout check that is only meaningful for branch creation and bails even though the transition itself already succeeded"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:R002-UNIT-001-reenter-display-only"
      id: "AC-UNIT-001"
      purpose: "Post-transition re-enter prints updated state without failing on branch-creation layout checks"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A successful GitHub status transition for issue N"
        - "A repository with any valid worktree layout"
    when:
      abstract: "The transition path calls into the display/re-enter step after the GitHub update"
    then:
      abstract:
        - "Exit code is 0"
        - "No 'Repository layout is worktree, expected worktree-ready' error is printed"
        - "Updated status is displayed to the user"
    signal:
      metric: "transition_reenter_error_count"
      threshold: 0
    metadata:
      author: "atdd:self-compliance"
      created: "2026-04-14"
