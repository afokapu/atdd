urn: "wmbt:govern-lifecycle:E043"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "worker-launch-staying-coupled-to-the-pty-shim-so-the-coach-cannot-start-a-worker-without-a-cli-return-inbox-an-output-log-heartbeat-and-a-submit-sentinel-the-very-machinery-that-carries-the-cold-start-heartbeat-flake-and-the-950-submit-bug"
context_clarifier: "the shim's only remaining job is launch + seed — decision communication already rides the cmux Feed (the wrapper's PermissionRequest/AskUserQuestion hooks), bypassing the shim entirely. The 2026-06-05 spike proved cmux can launch the agent natively (cmux new-workspace --command) and the agent's POSITIONAL prompt both lands AND auto-submits the first turn, with the wrapper publishing the worker's activity to feed.list without any shim in the path. This WMBT adds a cmux-native launch path so the pty shim, cli-return inbox, output.log heartbeat and submit sentinel are no longer required to start a worker (full shim deletion is #979; permission-blocking mediation is investigated in #980)."
lens: "functional.effectiveness"
statement: "minimize likelihood of worker launch staying coupled to the pty shim so the coach cannot start a worker without a cli return inbox an output log heartbeat and a submit sentinel the very machinery that carries the cold start heartbeat flake and the 950 submit bug by adding a CmuxAgentController (atdd.runtime.agent_control) that launches the worker via cmux new-workspace --command with the agent's positional prompt placed BEFORE the variadic --allowedTools flag (so the seed is not swallowed), deriving permission_mode + allowed_tools from the DispatchSpec, running the built argv through assert_no_forbidden_launch_flags so no bypass flag reaches a launch, relying on the cmux wrapper's existing Feed hooks for decision communication (no pty, no cli-return inbox, no output.log heartbeat, no submit sentinel), and exposing pure builders (build_agent_seed_argv / build_cmux_launch_argv) so the launch shape is unit-testable without a real cmux"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:E043-UNIT-001-cmux-native-launch-seeds-prompt-first"
      id: "AC-UNIT-001"
      purpose: "The cmux-native launcher seeds the worker's first turn via the agent's positional prompt placed before --allowedTools, wraps it in a cmux new-workspace --command launch, returns a cmux-native handle without writing a cli-return inbox, and refuses a forbidden bypass flag at the launch boundary"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "a DispatchSpec carrying a prompt, permission_mode and allowed_tools"
        - "a CmuxAgentController with an injected cmux runner (no real cmux)"
    when:
      abstract: "the seed/launch builders run and the controller spawns the worker"
      action: "invoke"
    then:
      abstract:
        - "build_agent_seed_argv places the positional prompt before the variadic --allowedTools and omits the flag when no tools are scoped"
        - "build_cmux_launch_argv wraps the agent argv in cmux new-workspace --cwd <worktree> --command, and the positional prompt survives the shell round-trip as a single token"
        - "CmuxAgentController.spawn delegates to the injected runner with a prompt-first command, returns a cmux-native handle, writes no cli-return.jsonl inbox, and raises ForbiddenLaunchFlagError when a bypass flag is smuggled in"
      assertions:
        - type: "equality"
        - type: "absence"
        - type: "raises"
    signal: {}
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-05"
      wagon: "govern-lifecycle"
      feature: "cmux-native-worker-launcher"

