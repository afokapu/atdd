urn: "wmbt:govern-lifecycle:E043"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "worker-launch-staying-coupled-to-the-pty-shim-so-the-coach-cannot-start-a-worker-without-a-cli-return-inbox-an-output-log-heartbeat-and-a-submit-sentinel-the-very-machinery-that-carries-the-cold-start-heartbeat-flake-and-the-950-submit-bug"
context_clarifier: "the shim's only remaining job is launch + seed — decision communication already rides the cmux Feed (the wrapper's PermissionRequest/AskUserQuestion hooks), bypassing the shim entirely. The 2026-06-05 spike proved cmux can launch the agent natively (cmux new-workspace --command) and the agent's POSITIONAL prompt both lands AND auto-submits the first turn, with the wrapper publishing the worker's activity to feed.list without any shim in the path. This WMBT adds a cmux-native launch path so the pty shim, cli-return inbox, output.log heartbeat and submit sentinel are no longer required to start a worker (full shim deletion is #979; permission-blocking mediation is investigated in #980)."
lens: "functional.effectiveness"
statement: "minimize likelihood of worker launch staying coupled to the pty shim so the coach cannot start a worker without a cli return inbox an output log heartbeat and a submit sentinel the very machinery that carries the cold start heartbeat flake and the 950 submit bug by adding a CmuxAgentController (atdd.runtime.agent_control) that launches the worker via cmux new-workspace --command with the agent's positional prompt placed BEFORE the variadic --allowedTools flag (so the seed is not swallowed), deriving permission_mode + allowed_tools from the DispatchSpec, running the built argv through assert_no_forbidden_launch_flags so no bypass flag reaches a launch, relying on the cmux wrapper's existing Feed hooks for decision communication (no pty, no cli-return inbox, no output.log heartbeat, no submit sentinel), and exposing pure builders (build_agent_seed_argv / build_cmux_launch_argv) so the launch shape is unit-testable without a real cmux"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:E043-UNIT-001-cmux-native-launch-seeds-prompt-first"
      id: "AC-UNIT-001"
      purpose: "The cmux-native launcher seeds the worker's first turn via the agent's positional prompt placed before --allowedTools, wraps it in a cmux new-workspace --command launch, returns a cmux-native handle without writing a cli-return inbox, and refuses a forbidden bypass flag at the launch boundary"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "a DispatchSpec carrying a prompt, permission_mode and allowed_tools"
        - "a CmuxAgentController with an injected cmux runner (no real cmux)"
    when:
      abstract: "the seed/launch builders run and the controller spawns the worker"
      action: "invoke"
    then:
      abstract:
        - "build_agent_seed_argv places the positional prompt before the variadic --allowedTools and omits the flag when no tools are scoped"
        - "build_cmux_launch_argv wraps the agent argv in cmux new-workspace --cwd <worktree> --command, and the positional prompt survives the shell round-trip as a single token"
        - "CmuxAgentController.spawn delegates to the injected runner with a prompt-first command, returns a cmux-native handle, writes no cli-return.jsonl inbox, and raises ForbiddenLaunchFlagError when a bypass flag is smuggled in"
      assertions:
        - type: "equality"
        - type: "absence"
        - type: "raises"
    signal: {}
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-05"
      wagon: "govern-lifecycle"
      feature: "cmux-native-worker-launcher"

  - identity:
      urn: "acc:govern-lifecycle:E043-UNIT-002-spawn-default-routes-cmux-native-killswitch-shim"
      id: "AC-UNIT-002"
      purpose: "The default spawn path launches the worker cmux-native (agent positional prompt seeds the surface, NO shim wrap, NO cli-return inbox priming, NO post-boot paste); the ATDD_USE_LEGACY_SPAWN=1 kill switch still routes to the shim (cli-return) for the soak"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "cmd_spawn invoked with a FakeMultiplexer and no transport env override"
        - "the same invocation again under ATDD_USE_LEGACY_SPAWN=1"
    when:
      abstract: "the spawn dispatch resolves the transport and builds the surface command"
      action: "invoke"
    then:
      abstract:
        - "resolve_transport returns cmux-native by default and cli-return (the shim) under ATDD_USE_LEGACY_SPAWN=1"
        - "the default surface command starts with the agent binary and carries the launch prompt as the positional seed BEFORE --allowedTools — never wrapped with atdd.coach.shim / atdd.runtime.agent_control, and no cli-return.jsonl inbox is primed and no paste_text is fired"
        - "under ATDD_USE_LEGACY_SPAWN=1 the surface command IS the shim wrapper and the cli-return inbox is primed (the proven fallback is intact)"
      assertions:
        - type: "equality"
        - type: "absence"
    signal: {}
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-05"
      wagon: "govern-lifecycle"
      feature: "cmux-native-worker-launcher"

  - identity:
      urn: "acc:govern-lifecycle:E043-UNIT-003-cmux-native-liveness-not-output-log-heartbeat"
      id: "AC-UNIT-003"
      purpose: "On the cmux-native path worker liveness derives from cmux surface state, NOT the 5s output.log heartbeat poll (which removes the cold-start flake); the shim path's output.log heartbeat is left untouched"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "a cmux-native spawn whose surface never writes an output.log"
        - "a backend whose surface responds to a liveness query"
    when:
      abstract: "the spawn pipeline runs its post-surface liveness verification"
      action: "invoke"
    then:
      abstract:
        - "the cmux-native liveness check passes from the live surface and never polls agents/<id>/output.log"
        - "a cmux-native spawn whose surface has vanished raises ProcessNotAlive so the coach escalates rather than proceeding with a dead worker"
      assertions:
        - type: "equality"
        - type: "raises"
    signal: {}
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-05"
      wagon: "govern-lifecycle"
      feature: "cmux-native-worker-launcher"

  - identity:
      urn: "acc:govern-lifecycle:E043-SMOKE-001-live-cmux-native-launch-feed-no-shim"
      id: "AC-SMOKE-001"
      purpose: "LIVE: cmux new-workspace --command boots a real claude worker whose positional prompt auto-submits the first turn, with NO atdd.coach.shim/PersonaShim process in the path, and the worker's activity publishes to cmux feed.list with source=claude (wrapper hooks active without the shim)"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "a real cmux (>=0.64.7) and claude on PATH (skip otherwise)"
        - "the production launch builders build_agent_seed_argv + build_cmux_launch_argv with a tiny task prompt and --allowedTools Read"
    when:
      abstract: "the built cmux new-workspace --command argv is run against the real cmux"
      action: "invoke"
    then:
      abstract:
        - "a worker surface is created and NO process matching atdd.coach.shim / PersonaShim exists in the launch path"
        - "the positional prompt auto-submits — the worker starts its first turn unattended"
        - "the worker's activity appears in cmux feed.list with source=claude; the workspace ref + a feed item are captured as evidence in docs/smoke-audit.md"
    signal: {}
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-05"
      wagon: "govern-lifecycle"
      feature: "cmux-native-worker-launcher"
