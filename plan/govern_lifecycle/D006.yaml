urn: "wmbt:govern-lifecycle:D006"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "define"
direction: "minimize"
dimension: "quantity"
object_of_control: "atdd-issues-whose-label-set-has-drifted-from-the-body-metadata-in-a-family-something-actually-reads"
context_clarifier: "The required set was a TRIPLET — atdd:<PHASE>, archetype:*, wagon:* — and two thirds of it guarded nothing. Measured on this repository: `archetype:*` has exactly two read sites, and both are circular — sync_labels' own is-this-mine-to-manage guard (issue.py:685) and this validator's own assertion. Nothing filters by it, no gh query names it, no workflow reads it. `wagon:*` is worse than unread: the issue template emits no Wagon row at all since the field became train + feature (#1477), so no issue authored through the sanctioned path can carry one, and the requirement was unsatisfiable rather than merely useless. The validator's own premise had also expired — its docstring justified the check by saying `atdd issue <slug>` applies the full triplet on creation, and that command was removed in #1309; its replacement `atdd author issue` applies atdd-issue and atdd:<phase> and nothing more. What remains true is the original concern for the families that ARE read: atdd-issue gates every coach validator through conftest's github_issues fixture (14 read sites) and atdd:<PHASE> is the phase machine's representation (13). Those drift, and drift in those is invisible. This was found only because #1761 removed the Projects v2 board prefetch whose failing GraphQL had been making this validator SKIP in CI."
lens: "functional.effectiveness"
statement: "minimize quantity of atdd-issues-whose-label-set-has-drifted-from-the-body-metadata-in-a-family-something-actually-reads by requiring exactly the families with a live reader — one atdd:<PHASE> — and dropping archetype:* and wagon:*, which no code consults and which no correctly-authored issue can satisfy"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:D006-UNIT-001-require-only-the-label-families-with-a-reader"
      id: "AC-UNIT-001"
      purpose: "The validator fails on a missing phase label, and does NOT fail on a missing archetype or wagon label — because requiring a label nothing reads makes every correctly-authored issue non-compliant and teaches the reader to ignore the check"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An atdd-issue-labeled open issue carrying no phase label"
        - "An atdd-issue-labeled open issue carrying a phase label and neither an archetype nor a wagon label — the shape every issue minted by the sanctioned authoring path has"
    when:
      abstract: "the required-family check evaluates each"
    then:
      abstract:
        - "The issue missing its phase label is reported, naming the issue and the family, since that family gates the phase machine"
        - "The issue missing archetype and wagon is NOT reported, since neither family has a reader and the wagon row no longer exists in the issue schema"
        - "The repair path named in the failure is a command that exists — `atdd coach sync-labels`, not the `atdd issue sync-labels` removed in #1309"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-09-09"
