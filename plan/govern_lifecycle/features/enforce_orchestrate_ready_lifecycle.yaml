urn: "feature:govern-lifecycle:enforce-orchestrate-ready-lifecycle"
wagon: "wagon:govern-lifecycle"
description: "Closes the write-time enforcement gap that orchestrate depends on: template seeding on create, sync-wmbts backfill, coach validator walking open issues, and orchestrate hook on a single issue"
sizing:
  wmbts: 4
  footprint_score: 5
  footprint_size: "M"
wmbts:
  - "wmbt:govern-lifecycle:D001"
  - "wmbt:govern-lifecycle:D002"
  - "wmbt:govern-lifecycle:D003"
  - "wmbt:govern-lifecycle:D004"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 2
        rationale: "Two new CLI flags: atdd issue <N> --sync-wmbts and atdd issue <N> --orchestrate"
    application:
      - type: "use_cases"
        count: 4
        rationale: "Template render on create; sync-wmbts reconciliation; validate coach walker; orchestrate dep-graph walk"
    domain:
      - type: "entities"
        count: 0
        rationale: "No new domain concepts — template, manifest, and orchestrate primitives already exist"
    integration:
      - type: "repositories"
        count: 0
        rationale: "Reuses existing GitHub client and yaml readers"
