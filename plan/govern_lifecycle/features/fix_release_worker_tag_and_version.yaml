urn: "feature:govern-lifecycle:fix-release-worker-tag-and-version"
wagon: "wagon:govern-lifecycle"
description: "Fixes the two defects the first real Publish run (28495533869) hit in the #1285 release wiring (nothing published — it died before twine; PyPI safe at 3.151.0). (1) Mis-version: version.change_class_for_commit derived the class by scanning the WHOLE merge message for the substring 'BREAKING CHANGE', so the #1291 merge commit — whose body merely DESCRIBES the mapping ('breaking !/BREAKING CHANGE=MAJOR') — was misclassified MAJOR and bumped 3.151.0 -> 4.0.0 instead of the correct MINOR 3.152.0. The migration v2 seed is NOT implicated: it seeds only the singleton release object (3.149.0), never a version_decided outbox message. The fix narrows breaking-change detection to a line-anchored Conventional-Commits FOOTER ('BREAKING CHANGE:' / 'BREAKING-CHANGE:'), leaving the '!' marker and a genuine footer still MAJOR. (2) Mis-tag: publish.yml's tag-release job never configured a git identity, so the extension's 'git tag -a vX' failed with 'empty ident name' — the fix sets a release-bot user.name/user.email before the drain step. Core stays provider-neutral; tag/PyPI mechanics remain the extension's. Follow-up to feature:govern-lifecycle:wire-release-worker-drains-version-decided (E058)."
sizing:
  wmbts: 1
  footprint_score: 3
  footprint_size: "S"
wmbts:
  - "wmbt:govern-lifecycle:E059"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 0
        rationale: "No new CLI surface; publish.yml gains a git-config identity step and the existing tag-release orchestration is unchanged in shape"
    application:
      - type: "use_cases"
        count: 1
        rationale: "version.change_class_for_commit gains footer-anchored breaking-change detection (narrowing an over-broad substring match) — a pure refinement of the existing helper over the passed string; no new function"
    domain:
      - type: "entities"
        count: 0
        rationale: "Reuses the singleton release object, the version_bumped event, and the neutral version_decided outbox message; nothing new at runtime"
    integration:
      - type: "repositories"
        count: 0
        rationale: "Reuses ObjectStore/EventStore/SyncStore on the passed sqlite3 connection; the tag/publish side-effect stays the release extension's contract"
