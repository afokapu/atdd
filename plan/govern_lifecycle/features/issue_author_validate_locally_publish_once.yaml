urn: "feature:govern-lifecycle:issue-author-validate-locally-publish-once"
wagon: "wagon:govern-lifecycle"
description: "Make issue authoring validate the full body locally against issue.schema.json before any GitHub call and publish store-first via a single create — preventing non-compliant bodies from ever reaching GitHub (#792). Realized by `atdd author issue`; the IssueManager mint path that first carried this was retired in #1477."
sizing:
  wmbts: 2
  footprint_score: 3
  footprint_size: "S"
wmbts:
  - "wmbt:govern-lifecycle:E019"
  - "wmbt:govern-lifecycle:Y007"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "`atdd author issue` (create + --revise) routes through the schema gate and publishes store-first via a single create"
    application:
      - type: "use_cases"
        count: 1
        rationale: "validate_issue_body use case: validates a body against issue.schema.json before any GitHub mutation"
    domain:
      - type: "entities"
        count: 1
        rationale: "schema-validation errors: raised when the body fails issue.schema.json, carrying field-level feedback"
    integration:
      - type: "repositories"
        count: 0
        rationale: "No new repository abstraction; gh subprocess call count reduced from 2 to 1 within existing adapter"
