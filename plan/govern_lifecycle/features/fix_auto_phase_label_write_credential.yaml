urn: "feature:govern-lifecycle:fix-auto-phase-label-write-credential"
wagon: "wagon:govern-lifecycle"
description: "Resolves the credential mismatch that made every auto-phase label write fail: the job declares `permissions: issues: write` (which binds to GITHUB_TOKEN) and then hands the write to a PROJECT_TOKEN PAT that `||` always short-circuits to, a credential kept alive only by the ProjectV2 Status sync #1051 decommissioned. Removes the PAT from the workflow, its template and the operator doc #1051 intended to delete, and — the half that keeps it fixed — classifies GitHub's authenticated-but-not-authorised refusal as its own error type so it stops reading as a transport blip, and makes a refused phase-label write report the store/label divergence and exit non-zero instead of raising (#1621)"
sizing:
  wmbts: 1
  footprint_score: 3
  footprint_size: "S"
wmbts:
  - "wmbt:govern-lifecycle:R009"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 0
        rationale: "CLI surface unchanged — `atdd coach transition` keeps its command and flags; only its exit code on a refused write changes"
    application:
      - type: "use_cases"
        count: 2
        rationale: "IssueManager._write_phase_label reports a refusal and returns False; IssueManager.update propagates that as exit 1 so CI cannot read a half-applied transition as done"
    domain:
      - type: "entities"
        count: 0
        rationale: "No new domain concepts — the phase machine and the store/label projection ordering (#1452) are unchanged"
    integration:
      - type: "repositories"
        count: 1
        rationale: "GitHubClient._run_gh gains refusal classification (GitHubPermissionError, a GitHubClientError subclass) so the transport boundary distinguishes a missing scope from an outage"
