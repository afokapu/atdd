urn: "feature:govern-lifecycle:release-steps-carry-their-credential"
wagon: "wagon:govern-lifecycle"
description: "Hands the workflow token to the publish drain step, which shells out to `gh release create` and has never been given one. The job already declares contents: write, so the scope is present and merely unsupplied; the result is that publish.yml fails on every merge, the version_decided outbox never drains, and no GitHub Release has been created since v4.21.0 — while the tag and the PyPI upload both succeed. Adds a workflow-wide check so a future step that reaches gh cannot ship without its credential."
sizing:
  wmbts: 1
  footprint_score: 1
  footprint_size: "S"
wmbts:
  - "wmbt:govern-lifecycle:R012"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 0
        rationale: "No CLI surface; the change is one env entry in a workflow definition."
    application:
      - type: "use_cases"
        count: 0
        rationale: "No behaviour is added — the publish path already exists and is merely unable to authenticate."
    domain:
      - type: "entities"
        count: 0
        rationale: "A CI credential is configuration, not a domain concept."
    integration:
      - type: "repositories"
        count: 0
        rationale: "The validator reads the committed workflow YAML; it calls no provider."
