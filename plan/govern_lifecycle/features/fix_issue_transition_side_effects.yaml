urn: "feature:govern-lifecycle:fix-issue-transition-side-effects"
wagon: "wagon:govern-lifecycle"
description: "Resolves side effects of the phase-transition path: stale local manifest status after a successful GitHub transition, a misleading layout error emitted by the post-transition re-enter path, phase labels authored independently of the store write they are supposed to project (#1452), and the drifted records that desync left behind with no verb able to repair them (#1338)"
