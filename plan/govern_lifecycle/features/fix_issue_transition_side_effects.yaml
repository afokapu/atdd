  - "wmbt:govern-lifecycle:R002"
  - "wmbt:govern-lifecycle:R005"
  - "wmbt:govern-lifecycle:R006"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 0
        rationale: "CLI surface unchanged — same command, same flags"
    application:
      - type: "use_cases"
        count: 2
        rationale: "IssueManager.update writes manifest; IssueLifecycle.transition re-enters in display-only mode"
    domain:
      - type: "entities"
        count: 0
        rationale: "No new domain concepts — manifest and state-machine already exist"
    integration:
      - type: "repositories"
        count: 0
