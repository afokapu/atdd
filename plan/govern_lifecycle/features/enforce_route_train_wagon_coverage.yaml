      - type: "controllers"
        count: 0
        rationale: "Coder-validator only; no CLI surface."
    application:
      - type: "use_cases"
        count: 2
        rationale: "parse_trainview_bindings + analyze_router_content (pure)."
    domain:
      - type: "entities"
        count: 1
        rationale: "TrainIdBinding dataclass; reuses Violation from #340."
    integration:
      - type: "repositories"
        count: 2
        rationale: "load_registered_trains + load_registered_wagons (YAML I/O)."
