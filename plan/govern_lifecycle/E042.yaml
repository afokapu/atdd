urn: "wmbt:govern-lifecycle:E042"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "the-multi-issue-wave-orchestration-and-crash-recovery-staying-fused-into-coach-py-so-there-is-no-run-wave-or-atdd-resume-and-wave-concurrency-stays-unbounded"
context_clarifier: "when the Coach decomposition (docs/coach-decomposition.md, umbrella #887) lands Child 9 — the wave runner + crash-recovery surface that completes the TrainRunner Protocol on top of the Child 8 JsonlTrainRunner: implementing run_wave (dependency-ordered waves driven concurrently, bounded by train.concurrency.max_parallel_issues) and resume(run_id) (replay the frozen event log + reconcile + continue per §6.3), moving _resolve_waves / _drive_wave_concurrently / _execute_cold_start into atdd.train.wave_runner behind @deprecated shims, adding the new public atdd resume <run_id> CLI command, and shipping tests/train/test_jsonl_crash_recovery.py as the §10.3 gate that governs any future Temporal adoption"
lens: "functional.effectiveness"
statement: "minimize likelihood of the-multi-issue-wave-orchestration-and-crash-recovery-staying-fused-into-coach-py-so-there-is-no-run-wave-or-atdd-resume-and-wave-concurrency-stays-unbounded by implementing JsonlTrainRunner.run_wave (dependency-ordered waves driven concurrently and bounded by train.concurrency.max_parallel_issues, §7.1/§7.4) and JsonlTrainRunner.resume(run_id) per §6.3 (load the FROZEN conventions.snapshot.yaml, replay events.jsonl to reconstruct RunState, re-materialize evidence, recompute the decision via coach.core.next_transition under the frozen conventions, and append a RunResumed continuation with no double-execution), moving _resolve_waves / _drive_wave_concurrently / _execute_cold_start into atdd.train.wave_runner behind @deprecated(removal=3.87.0) shims, adding the atdd resume <run_id> public CLI command (§3.4/§7.4), and landing tests/train/test_jsonl_crash_recovery.py as the §10.3 gate that kill-mid-wave-then-resume yields identical decisions (#896)"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:E042-UNIT-001-run-wave-concurrency-and-wave-result"
      id: "AC-UNIT-001"
      purpose: "JsonlTrainRunner.run_wave resolves the dependency-ordered wave plan, drives each wave's members concurrently bounded by train.concurrency.max_parallel_issues, and returns a typed WaveResult; the concurrency cap is enforced by atdd.train.wave_runner.drive_wave_concurrently"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "a JsonlTrainRunner over a temp repo with a bound PolicyHandle and the per-issue drive delegated to a stubbed atdd.train.issue_runner.drive_single_issue, plus the pure atdd.train.wave_runner.drive_wave_concurrently helper"
    when:
      abstract: "run_wave(issue_numbers, concurrency=N) is called, and drive_wave_concurrently is exercised directly with a worker that records peak concurrency under a max_parallel cap"
    then:
      abstract:
        - "run_wave returns a WaveResult whose started / blocked / failed_to_start tuples partition the requested issues, with each started run driven exactly once through start_issue"
        - "drive_wave_concurrently never lets more than max_parallel workers run at once while still joining every member before returning (the between-wave dependency barrier is preserved)"
        - "a worker that raises is captured as a failed_to_start entry rather than propagating, so one member's failure cannot abort its siblings"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-31"
  - identity:
      urn: "acc:govern-lifecycle:E042-UNIT-002-jsonl-resume-replays-frozen-conventions"
      id: "AC-UNIT-002"
      purpose: "JsonlTrainRunner.resume implements §6.3 — it loads the frozen conventions snapshot (not live source), replays events.jsonl to reconstruct RunState, re-materializes evidence, recomputes the decision via coach.core.next_transition, and appends a RunResumed continuation plus the recomputed decision without advancing the phase or re-dispatching"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "a durable JSONL run created over a temp repo with a frozen conventions.snapshot.yaml and a hermetic GitHub evidence source, driven a few phases into its lifecycle via the single-writer event log"
    when:
      abstract: "resume(run_id) is called on the JsonlTrainRunner"
    then:
      abstract:
        - "resume loads the run's frozen conventions.snapshot.yaml (via load_conventions_for_run) rather than re-reading the current source conventions"
        - "resume appends a RunResumed event carrying from_event_seq and a recomputed decision (DecisionMade + decisions.jsonl row) equal to coach.core.next_transition over the re-materialized evidence under the frozen conventions, and emits no new PhaseAdvanced (no double-execution)"
        - "a recorded conventions-hash that disagrees with the frozen snapshot raises rather than replaying non-deterministically"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-31"
  # AC-UNIT-003 (acc:govern-lifecycle:E042-UNIT-003-wave-runner-move-and-deprecated-shims)
  # removed in #923 along with its parity test
  # (tests/coach/test_e042_unit_003_wave_runner_move_and_deprecated_shims.py) when
  # _resolve_waves and _drive_wave_concurrently were deleted from coach.py. The
  # remaining _execute_cold_start shim (1 caller) is tracked under #790.
  - identity:
      urn: "acc:govern-lifecycle:E042-UNIT-004-atdd-resume-cli-command"
      id: "AC-UNIT-004"
      purpose: "atdd resume <run_id> is a new public CLI command (§3.4/§7.4) that builds the JSONL store + runner for the repo and replays the run via JsonlTrainRunner.resume, documenting itself under --help and erroring cleanly on an unknown run id"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "the atdd top-level argparse surface with the resume subcommand registered, forwarding to atdd.train.resume_cli over a temp repo holding a durable run"
    when:
      abstract: "atdd resume --help is rendered, atdd resume <run_id> is dispatched for an existing run, and atdd resume <unknown> is dispatched"
    then:
      abstract:
        - "the resume subcommand is registered on the top-level parser and atdd resume --help documents the run_id positional and the command's purpose"
        - "dispatching atdd resume <run_id> for an existing run resumes it (rc 0) by calling JsonlTrainRunner.resume, appending a RunResumed event to the run"
        - "dispatching atdd resume against an unknown run id returns a non-zero rc with a clear error rather than raising"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-31"
  - identity:
      urn: "acc:govern-lifecycle:E042-SMOKE-001-jsonl-crash-recovery-identical-decisions"
      id: "AC-SMOKE-001"
      purpose: "The §10.3 crash-recovery gate: killing a JsonlTrainRunner mid-wave and replaying via resume reproduces identical decisions with no double-execution — the test that governs any future Temporal adoption (§16 R-7)"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "a real temp ATDD repo with a durable JSONL run driven several phases into its lifecycle on disk (events.jsonl + frozen conventions.snapshot.yaml), with the GitHub evidence source driven through a hermetic double"
    when:
      abstract: "a brand-new JsonlTrainRunner instance (the post-crash process, with no in-memory state) resumes the run from disk, and a second fresh instance resumes it again"
    then:
      abstract:
        - "tests/train/test_jsonl_crash_recovery.py drives a real run, simulates a kill -9 by discarding the runner, and resumes from the durable log"
        - "the decision resume records equals the decision the live loop would have computed next, and re-resuming on another fresh instance produces the identical decision (deterministic across process restart)"
        - "resume writes no additional PhaseAdvanced events — the recovered run does not re-execute a phase that already ran"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-31"
