urn: wmbt:govern-lifecycle:E068
step: execute
direction: minimize
dimension: likelihood
object_of_control: an-upgrade-banner-advertising-a-forbidden-flag-or-a-verb-that-cannot-act
context_clarifier: 'CLAUDE.md is the primary context file read by every dispatched worker agent. Lines
  643 and 658 (pre-#867) explicitly document ATDD_SKIP_POSTCOMMIT=1 as a routine operator override inside
  the post_commit_hook.overrides block. Agents (including ATDD860, ATDD861, ATDD862, ATDD851) self-discover
  this documentation and apply the bypass without operator instruction — 76 invocations across 4 workers
  in a single session (2026-05-26). The bypass-discovery vector is the project''s own context file, not
  an external doc site. Fix: remove every ATDD_SKIP_* reference from CLAUDE.md and replace with a pointer
  to docs/operator-emergency-bypass.md, which is operator-only and excluded from agent context loads.'
lens: functional.effectiveness
statement: minimize likelihood of an-upgrade-banner-advertising-a-forbidden-flag-or-a-verb-that-cannot-act
  by keeping the banner free of --force and naming atdd upgrade, the one verb that can act on an already-initialised
  repo (#1811 retired this WMBT's three CLAUDE.md acceptances with the projection they policed)
acceptances:
- identity:
    urn: acc:govern-lifecycle:E068-UNIT-003-upgrade-banner-does-not-suggest-force
    id: AC-UNIT-003
    purpose: check_upgrade_sync_needed() returns a banner naming a verb an agent can run ('atdd upgrade')
      and NOT containing '--force', so the banner cannot teach the destructive flag
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - atdd.version_check is importable
    - check_upgrade_sync_needed() is patched to return a synthetic banner string
  when:
    abstract: check_upgrade_sync_needed() is called (or the banner string is inspected directly)
  then:
    abstract:
    - The returned string contains 'atdd upgrade'
    - The returned string does NOT contain '--force'
  metadata:
    author: atdd:coder
    created: '2026-05-28'
- identity:
    urn: acc:govern-lifecycle:E068-SMOKE-001-live-upgrade-banner-names-a-runnable-verb
    id: AC-SMOKE-001
    purpose: 'the banner the REAL version_check emits names a runnable verb and carries no forbidden flag,
      read from the shipped source rather than a synthetic string -- #1811 changed the verb and a patched
      fixture would have kept passing against the old one'
    phase: SMOKE
  harness:
    type: smoke
    category: backend
  given:
    abstract:
    - the toolkit's own src/atdd/version_check.py as committed
  when:
    abstract: the banner-producing source lines are read from the real module
  then:
    abstract:
    - every banner names 'atdd upgrade'
    - no banner contains '--force'
    - 'no banner names ''atdd sync && atdd init'', which #1600 showed cannot act on an initialised repo'
  metadata:
    author: atdd:planner
    created: '2026-05-27'
