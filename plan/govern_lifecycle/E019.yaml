urn: wmbt:govern-lifecycle:E019
step: execute
direction: minimize
dimension: likelihood
object_of_control: issue-author-submits-non-compliant-body-or-triggers-redundant-create-edit-graphql-pair
context_clarifier: "atdd issue <slug> currently makes two GraphQL mutations: gh issue\
  \ create (with a placeholder scaffold) then gh issue edit --body-file (with the\
  \ real content). The redundant second call consumes the shared 5 000/hr GitHub GraphQL\
  \ budget which has been exhausted repeatedly, stalling the merge-watcher 30-45 min\
  \ each time. Separately, no compliance check runs before the body goes live, so\
  \ non-compliant bodies (missing Graph Context, Mirror Across Agents, etc.) land\
  \ on GitHub unchecked and fail test_issue_body_has_graph_context inside validate-planner\
  \ on every unrelated PR's CI \u2014 lived example: #768's missing Graph Context\
  \ blocked #788 and every other open PR until fixed by hand. The fix has two parts:\
  \ (1) validate the full body locally against the issue-body compliance rules before\
  \ any GitHub call (refuse to publish on failure, print structured feedback), (2)\
  \ when the body passes, issue a single gh issue create call that carries the full\
  \ body \u2014 no subsequent gh issue edit needed. The same local gate must re-run\
  \ on any later body edit."
lens: functional.effectiveness
statement: minimize likelihood of issue-author-submits-non-compliant-body-or-triggers-redundant-create-edit-graphql-pair
  when an operator runs atdd issue <slug> by (1) authoring the complete issue body
  in a local temp file, (2) running --check (the same validators that back test_issue_body_has_graph_context
  and sibling body validators) against that local file and refusing to publish + printing
  structured field-level feedback on failure, (3) on pass, issuing exactly one gh
  issue create call whose --body-file carries the validated content with no follow-up
  gh issue edit for body, and (4) re-running the same --check gate on any subsequent
  atdd issue <N> --body-file edit; a unit test asserts the gh subprocess call count
  equals 1 for create and a test asserts a non-compliant body never reaches GitHub
acceptances:
- identity:
    urn: acc:govern-lifecycle:E019-SMOKE-001-revise-publishes-to-live-store
    id: AC-SMOKE-001
    purpose: Against a live State Store and a real gh subprocess, atdd author issue
      --revise writes the authoritative store revision and then projects the body;
      when the provider is unreachable the revision still stands and the projection
      defers to the outbox
    phase: SMOKE
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A real repo checkout, an initialized ATDD Control Root (State Store), and the
      installed atdd author CLI
    - An issue-backed work_item seeded in the live store and linked to a github issue
      number
    - A stubbed `gh` on PATH (so the projection runs as a real subprocess without
      touching production GitHub), selectable to exit 0 or non-zero
  when:
    abstract: atdd author issue --revise <N> --body-file <path> --type refactor is
      run against the Control Root, once with a reachable provider and once with a
      provider that exits non-zero
  then:
    abstract:
    - The live State Store carries the revised body and type, and the lifecycle state
      is unchanged by the revision
    - An issue_revised event is recorded against the work item
    - "With a reachable provider the outbox is empty \u2014 nothing was deferred"
    - With an unreachable provider the command still succeeds, the store revision
      stands, and the body update is deferred to the outbox rather than lost
  metadata:
    author: atdd:self-compliance
    created: '2026-07-14'
- identity:
    urn: acc:govern-lifecycle:E019-UNIT-003-author-issue-revise-store-first
    id: AC-UNIT-003
    purpose: 'atdd author issue --revise <N> revises an issue-backed work item STORE-FIRST:
      the State Store is authoritative and the GitHub body update is a best-effort
      projection, outboxed on failure'
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - An existing store-registered issue work item
  when:
    abstract: atdd author issue --revise <N> is called with a new body and/or type
  then:
    abstract:
    - The State Store record is updated first and is authoritative
    - A store lookup/write failure raises PublishError and NO provider mutation is
      attempted
    - The GitHub body update is a projection; on failure it is recorded in the outbox
      and reported as projection_deferred
  metadata:
    author: atdd:self-compliance
    created: '2026-07-12'
- identity:
    urn: acc:govern-lifecycle:E019-UNIT-004-revise-writes-title-with-body
    id: AC-UNIT-004
    purpose: "`atdd author issue --revise` carries the title with the body: the store\
      \ write that takes a new body also takes the title that body's H1 declares,\
      \ and the provider projection re-titles the issue in the same edit \u2014 so\
      \ data.title, the body H1, and the GitHub title cannot end a revision disagreeing"
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - An existing store-registered issue work item whose data.title and body H1 agree
    - A replacement body whose H1 states a different title
  when:
    abstract: atdd author issue --revise <N> --body-file <path> is called, once with
      no --title, once with a --title that agrees with the H1, and once with a --title
      that contradicts it
  then:
    abstract:
    - With no --title the store write derives data.title from the replacement body's
      H1, in the same upsert as the body
    - An explicit --title that agrees with the H1 is accepted and written
    - An explicit --title that contradicts the H1 is refused as a schema violation
      before any store or provider write
    - The provider projection carries the new title and the new body in a single issue
      edit, not a body-only one
    - A failed projection outboxes the title alongside the body, so the deferred retry
      can restore both
  metadata:
    author: atdd:self-compliance
    created: '2026-07-29'
- identity:
    urn: acc:govern-lifecycle:E019-UNIT-005-title-h1-consistency-check
    id: AC-UNIT-005
    purpose: A consistency check names any work item whose stored title disagrees
      with its own body H1, so the two representations of one fact cannot drift apart
      silently once the revise path is repaired
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - 'Work items covering the four cases: stored title equals the body H1; the two
      disagree; the body carries no H1 at all; the body''s only ''#'' line sits inside
      a fenced code block'
  when:
    abstract: The title/H1 consistency check is evaluated over each
  then:
    abstract:
    - "The disagreeing work item is reported with both sides named \u2014 the stored\
      \ title and the body H1 \u2014 never a bare 'mismatch'"
    - The agreeing work item is not reported
    - 'A body with no H1 is not reported: absent is not disagreeing, and the body-shape
      schema owns that gap'
    - A '#' line inside a fenced code block is not read as the H1, so a body quoting
      a shell comment is not falsely accused
    - The check is a planner-side predicate over a title and a body, so the coach
      store-mirror gate can consume it without the boundary pointing coach-ward
  metadata:
    author: atdd:self-compliance
    created: '2026-07-29'
- identity:
    urn: acc:govern-lifecycle:E019-SMOKE-002-revise-retitles-live-store-and-projection
    id: AC-SMOKE-002
    purpose: "Against a live State Store and a real gh subprocess, a revise that changes\
      \ the body H1 changes the stored title too and re-titles the projected issue\
      \ \u2014 the end-to-end shape of the defect that left #1639's stored title naming\
      \ a superseded scope"
    phase: SMOKE
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A real repo checkout, an initialized ATDD Control Root (State Store), and the
      installed atdd author CLI
    - An issue-backed work_item seeded in the live store, linked to a github issue
      number, whose stored title matches its seeded body H1
    - A stubbed `gh` on PATH that records the argv it was invoked with, so the projection
      runs as a real subprocess without touching production GitHub
  when:
    abstract: atdd author issue --revise <N> --body-file <path> is run against the
      Control Root with a replacement body whose H1 states a new title
  then:
    abstract:
    - The live State Store carries both the revised body and the new title, and the
      lifecycle state is unchanged by the revision
    - The recorded gh argv carries the new title, so the projection was re-titled
      rather than left naming the superseded scope
    - "The store's title and its own body H1 agree after the revision \u2014 the consistency\
      \ check passes on the work item the revise just wrote"
  metadata:
    author: atdd:self-compliance
    created: '2026-07-29'
