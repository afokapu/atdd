urn: "wmbt:govern-lifecycle:E014"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "agent-spawn-commands-containing-dangerously-skip-permissions"
context_clarifier: "atdd spawn / dispatch scripts can pass --dangerously-skip-permissions to the Claude CLI without CLI-level rejection; lived incident 2026-05-13 (#646/#648): the classifier caught it but no systematic gate existed; the fix must reject the flag at spawn time before the multiplexer ever dispatches the command. Reinforced 2026-06-04 (#969): the cmd_spawn string guard only inspected the cmux-surface adapter string — the runtime cli-return / Shim launch transport (ShimAgentController) built its own launch argv that bypassed the guard and hardcoded the forbidden flag, the divergent second config behind #967; that argv path must derive its permission policy from the DispatchSpec and pass the same forbidden-flag check"
lens: "functional.effectiveness"
statement: "minimize likelihood of agent-spawn-commands-containing-dangerously-skip-permissions when cmd_spawn OR the runtime cli-return launch transport (ShimAgentController) constructs a launch command by (1) scanning the adapter-produced command string, any caller-supplied extra_args, AND every runtime launch argv (default-built or caller-injected) for the substring '--dangerously-skip-permissions', (2) raising SpawnPermissionViolation (cmd_spawn) or ForbiddenLaunchFlagError (runtime agent_control) with a clear message naming the forbidden flag when found, (3) the CLI entry point catching SpawnPermissionViolation and exiting non-zero with a human-readable rejection message, and (4) the runtime ShimAgentController._default_command deriving its permission policy (--permission-mode + --allowedTools) entirely from the DispatchSpec rather than hardcoding any permission flag"
acceptances:
  - identity:
      urn: "acc:govern-lifecycle:E014-UNIT-001-adapter-command-rejected"
      id: "AC-UNIT-001"
      purpose: "cmd_spawn raises SpawnPermissionViolation when the adapter command string contains '--dangerously-skip-permissions'"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "cmd_spawn and SpawnPermissionViolation are importable from atdd.coach.commands.spawn"
        - "A fake adapter in ADAPTER_REGISTRY returns 'claude --dangerously-skip-permissions' for llm='unsafe-claude'"
        - "All other required arguments (persona, worktree, issue, agent_id, runtime_root) use valid test doubles"
    when:
      abstract: "cmd_spawn(persona='planner', llm='unsafe-claude', worktree=tmp_path, issue=1, agent_id='a', runtime_root=tmp_path) is called"
    then:
      abstract:
        - "SpawnPermissionViolation is raised"
        - "The exception message contains '--dangerously-skip-permissions'"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-19"

  - identity:
      urn: "acc:govern-lifecycle:E014-UNIT-002-clean-command-passes-guard"
      id: "AC-UNIT-002"
      purpose: "cmd_spawn does NOT raise SpawnPermissionViolation when the adapter command contains no forbidden flag"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The registered adapter for llm='claude-code' returns a safe command string (no --dangerously-skip-permissions)"
        - "multiplexer is patched to a no-op so no real process is launched"
    when:
      abstract: "cmd_spawn(persona='planner', llm='claude-code', worktree=tmp_path, issue=1, agent_id='a', runtime_root=tmp_path) is called"
    then:
      abstract:
        - "No SpawnPermissionViolation is raised"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-19"

  - identity:
      urn: "acc:govern-lifecycle:E014-UNIT-003-claude-code-adapter-never-emits-forbidden-flag"
      id: "AC-UNIT-003"
      purpose: "The canonical _claude_code_adapter returns a command string that does NOT contain '--dangerously-skip-permissions'"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "_claude_code_adapter is importable from atdd.coach.commands.spawn"
        - "A dummy prompt_path (tmp_path / 'prompt.md') is passed"
    when:
      abstract: "_claude_code_adapter(prompt_path=tmp_path / 'prompt.md') is called"
    then:
      abstract:
        - "The returned string does not contain '--dangerously-skip-permissions'"
        - "The returned string does not contain 'bypassPermissions'"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-19"

  - identity:
      urn: "acc:govern-lifecycle:E014-SMOKE-001-spawn-guard-reachable-from-cli"
      id: "AC-SMOKE-001"
      purpose: "SpawnPermissionViolation is importable and the guard is wired into cmd_spawn such that injecting the forbidden flag raises the exception without reaching the multiplexer"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "SpawnPermissionViolation is imported from atdd.coach.commands.spawn"
        - "A minimal fake adapter is registered in ADAPTER_REGISTRY for llm='test-unsafe' that returns 'claude --dangerously-skip-permissions'"
        - "multiplexer is a MagicMock (to confirm it is never called)"
    when:
      abstract: "cmd_spawn(persona='planner', llm='test-unsafe', worktree=tmp_path, issue=1, agent_id='a', runtime_root=tmp_path, multiplexer=multiplexer) is called"
    then:
      abstract:
        - "SpawnPermissionViolation is raised before the multiplexer is invoked"
        - "multiplexer.create_surface was NOT called"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-19"

  - identity:
      urn: "acc:govern-lifecycle:E014-UNIT-004-runtime-default-command-derives-permission-policy-from-spec"
      id: "AC-UNIT-004"
      purpose: "The runtime cli-return launch transport derives its permission policy from the DispatchSpec (--permission-mode + --allowedTools) and never emits --dangerously-skip-permissions (#969 — closes the divergent second config behind #967)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "ShimAgentController and DispatchSpec are importable from atdd.runtime.agent_control"
        - "A DispatchSpec with permission_mode='acceptEdits' and a scoped allowed_tools tuple (e.g. ('Bash','Edit','Read'))"
    when:
      abstract: "ShimAgentController()._default_command(spec) is called"
    then:
      abstract:
        - "The returned argv contains '--permission-mode' immediately followed by the spec's permission_mode"
        - "The returned argv contains '--allowedTools' immediately followed by the space-joined allowed_tools"
        - "The returned argv does NOT contain '--dangerously-skip-permissions' for any permission_mode"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-04"

  - identity:
      urn: "acc:govern-lifecycle:E014-UNIT-005-runtime-launch-boundary-rejects-forbidden-flag"
      id: "AC-UNIT-005"
      purpose: "The runtime launch boundary rejects a forbidden flag in any launch argv — default-built or caller-injected — closing the enforcement gap where the cli-return argv list bypassed the cmd_spawn string guard (#969)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "assert_no_forbidden_launch_flags, ForbiddenLaunchFlagError, and ShimAgentController are importable from atdd.runtime.agent_control"
        - "A valid DispatchSpec test double"
    when:
      abstract: "ShimAgentController().spawn(spec, agent_command=['claude', '--dangerously-skip-permissions']) is called"
    then:
      abstract:
        - "ForbiddenLaunchFlagError is raised before any shim process is launched"
        - "assert_no_forbidden_launch_flags also raises on the '--flag=value' substring form"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-04"

  - identity:
      urn: "acc:govern-lifecycle:E014-UNIT-006-runtime-shim-entry-rejects-forbidden-flag"
      id: "AC-UNIT-006"
      purpose: "The runtime shim CLI entry point (python -m atdd.runtime.agent_control) refuses an adapter command carrying the forbidden flag before spawning any process — last-mile defense-in-depth so no runtime launch path can emit it (#969)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "main is importable from atdd.runtime.agent_control.__main__"
        - "A runtime-dir under tmp_path and an adapter command 'claude --dangerously-skip-permissions'"
    when:
      abstract: "main(['--agent-id','x','--runtime-dir',<dir>,'--','claude','--dangerously-skip-permissions']) is called"
    then:
      abstract:
        - "main returns a non-zero exit code"
        - "stderr names the forbidden flag '--dangerously-skip-permissions'"
        - "No agent runtime directory (agents/<id>) is created — the launch was refused"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-04"

  - identity:
      urn: "acc:govern-lifecycle:E014-SMOKE-002-runtime-shim-entry-refuses-forbidden-flag"
      id: "AC-SMOKE-002"
      purpose: "The real runtime shim CLI subprocess refuses a forbidden-flag launch: operator sees a non-zero exit and a stderr message naming the flag, and no agent process starts (#969)"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The real `python -m atdd.runtime.agent_control` module CLI is invoked as a subprocess (no mocks, no FakeMultiplexer, no synthetic stub)"
        - "The adapter command after -- is 'claude --dangerously-skip-permissions'"
    when:
      abstract: "the subprocess runs with --agent-id, --runtime-dir <tmp>, -- claude --dangerously-skip-permissions"
    then:
      abstract:
        - "The process exits non-zero (operator-observable)"
        - "stderr contains '--dangerously-skip-permissions'"
        - "No agents/<id> runtime directory was created (no agent process launched)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-04"
