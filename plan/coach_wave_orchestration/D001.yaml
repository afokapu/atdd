urn: "wmbt:coach-wave-orchestration:D001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-08-14
step: "define"
direction: "minimize"
dimension: "likelihood"
object_of_control: "per-phase-pane-proliferation"
context_clarifier: "when coach spawns a fresh cmux pane on every phase transition for an issue — naming it via compute_canonical_name(repo, issue, slug) with no phase component — so an issue accumulates one identically-named idle pane per completed phase instead of reusing a single persistent surface"
lens: "functional.effectiveness"
statement: "minimize likelihood of per-phase-pane-proliferation by hosting each issue in a single persistent cmux surface named ATDD<N> — created once at first spawn and never renamed across phases — and by respawning the persona agent in place inside that same surface on each phase transition (a fresh claude process via cmux respawn-pane, not /clear) rather than creating a new pane, while leaving a BLOCKED phase's pane and agent intact for debugging"
acceptances:
  - identity:
      urn: "acc:coach-wave-orchestration:D001-UNIT-001-issue-surface-named-by-issue-identity"
      id: "AC-UNIT-001"
      purpose: "the issue's persistent surface is named ATDD-N — issue identity only, with no slug, persona, or phase segment"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A repo short name and an issue number"
        - "A persona spawn for that issue at a known phase"
    when:
      abstract: "the spawn computes the name for the issue's cmux surface"
    then:
      abstract:
        - "The surface name is exactly ATDD<N> — the repo token followed by the issue number"
        - "The surface name carries no slug, persona, or phase segment"
        - "The same surface name is produced regardless of which phase or persona is spawning"
    metadata:
      author: "atdd:planner"
      created: "2026-05-16"
  - identity:
      urn: "acc:coach-wave-orchestration:D001-UNIT-002-issue-surface-resolved-or-created-once"
      id: "AC-UNIT-002"
      purpose: "a phase transition for an issue that already has a surface reuses it — no second pane is created"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An issue whose persistent surface was created by a prior phase's spawn"
        - "A multiplexer test double that records every pane/surface creation call"
    when:
      abstract: "the spawn handler is invoked for the next phase transition of that issue"
    then:
      abstract:
        - "No new pane/surface is created — the issue's existing surface is resolved and reused"
        - "Exactly one surface exists for the issue after the second transition"
    metadata:
      author: "atdd:planner"
      created: "2026-05-16"
  - identity:
      urn: "acc:coach-wave-orchestration:D001-UNIT-003-persona-respawned-in-place-not-cleared"
      id: "AC-UNIT-003"
      purpose: "a phase transition relaunches the persona agent in place via cmux respawn-pane (a fresh process), and /clear is not used"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An issue with an existing persistent surface from a prior phase"
        - "A multiplexer test double recording respawn-pane calls and text sent to the surface"
    when:
      abstract: "the spawn handler advances the issue to the next phase"
    then:
      abstract:
        - "The persona agent is relaunched inside the issue's existing surface via a respawn-pane operation carrying the new persona's launch command"
        - "No /clear is sent to the surface — a fresh process is started, not a conversation reset"
    metadata:
      author: "atdd:planner"
      created: "2026-05-16"
  - identity:
      urn: "acc:coach-wave-orchestration:D001-INTEGRATION-001-one-pane-across-lifecycle-blocked-intact"
      id: "AC-INTEGRATION-001"
      purpose: "driving one issue across multiple phase transitions keeps exactly one pane; a BLOCKED phase leaves that pane intact"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A multiplexer test double tracking the set of live panes and respawn calls per issue"
        - "One issue advanced INIT -> PLANNED -> RED -> GREEN through the spawn handler"
    when:
      abstract: "the issue is driven across the phase transitions, then a phase BLOCKs"
    then:
      abstract:
        - "The issue occupies exactly one pane (surface ATDD<N>) across all phase transitions"
        - "Each transition respawns the persona agent in that same surface — no new pane is created"
        - "A BLOCKED phase triggers no respawn — the pane and its agent are left intact for debugging"
    metadata:
      author: "atdd:planner"
      created: "2026-05-16"
