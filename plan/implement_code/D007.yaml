      purpose: "Validator detects wagon trains.ts files missing required export symbols"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "Wagon directories matching wagon_trains_export_shape.wagon_glob"
        - "A list of required_exports declared in .atdd/config.yaml"
    when:
      abstract: "Running atdd validate coder with wagon_trains_export_shape configured"
    then:
      abstract:
        - "Any wagon missing trains.ts, or exporting only a subset of required_exports, produces a hard failure with SPEC-CODER-TRAIN-0002 error block"
