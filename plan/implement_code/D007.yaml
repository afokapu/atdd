urn: "wmbt:implement-code:D007"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "define"
direction: "minimize"
dimension: "quantity"
object_of_control: "unverified-wagon-trains-ts-export-contracts"
context_clarifier: "when a wagon's trains.ts must expose presentation registration symbols required by the frontend train runner"
lens: "functional.effectiveness"
statement: "minimize quantity of unverified-wagon-trains-ts-export-contracts when a wagon's trains.ts must expose presentation registration symbols required by the frontend train runner"
acceptances:
