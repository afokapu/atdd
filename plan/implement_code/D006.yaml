urn: "wmbt:implement-code:D006"
step: "define"
direction: "minimize"
dimension: "quantity"
object_of_control: "undetected-frontend-composition-root-drift"
context_clarifier: "when consumers rename, remove, or break the required methods of the frontend train runner class"
lens: "functional.effectiveness"
statement: "minimize quantity of undetected-frontend-composition-root-drift when consumers rename, remove, or break the required methods of the frontend train runner class"
acceptances:
  - identity:
      urn: "acc:implement-code:D006-UNIT-001-composition-root-identity"
      id: "AC-UNIT-001"
      purpose: "Validator detects renamed, missing, or incomplete frontend composition root class"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A frontend source file configured as frontend_composition_root.path"
        - "An expected class_name and a list of required_methods declared in .atdd/config.yaml"
    when:
      abstract: "Running atdd validate coder with frontend_composition_root configured"
    then:
      abstract:
        - "Missing file, missing class, or missing required method produces a hard failure with SPEC-CODER-TRAIN-0001 error block"
        - "Absent configuration key produces a clean pytest skip with no failure"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-04-14"
