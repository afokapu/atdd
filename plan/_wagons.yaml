  goal: ensure every commit on a coach-watched worktree produces a deterministic,
    schema-conformant validation record set (violations.jsonl, suppressed.jsonl, stale-suppressions.jsonl,
    risk-score.json) within the §6.4 grace window so coach can route the agent without
