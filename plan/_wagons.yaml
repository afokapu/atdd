- wagon: verify-enforcement
  description: Guarantee that deleting a core convention node can never silently remove
    enforcement of the rule its extension twin was meant to inherit
  theme: commons
  subject: agent:tester
  context: in CI today all 50 extension rules are enforced solely by their core twin,
    because no job runs the enforcement path
  action: reports which rules are enforced in CI versus merely reported, and proves
    that every core node with an extension twin has that twin bound and running before
    the core node may be retired
  goal: guarantee that deleting a core convention node can never silently remove enforcement
    of the rule its extension twin was meant to inherit
  outcome: a coverage report and a succession proof that the core-deletion guard consumes
