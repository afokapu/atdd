    (provider code imports core, core never imports provider code); a non-GitHub remote
    conformance suite drives the full workflow against a bare git remote with zero
    providers; .atdd/extensions.lock pins the core schema, lifecycle-policy and merge-policy
    digests alongside every provider digest; and a cross-repo smoke test proves a
    registered extension is presentation-only — its failure never blocks merge and
    it writes back only through the constrained external_refs.* path.'
