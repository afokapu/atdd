- wagon: bind-extension-conventions
  description: Make the binding lock a faithful projection of the obligations that
    must gate, closing 26 of the 28 unbound rules through implementation fan-out with
    zero new detectors
  theme: commons
  subject: agent:coder
  context: closing the gap between declared extension convention nodes and the binding
    lock
  action: separates obligations lacking a mechanism from mechanisms lacking an obligation,
    binds each implementation to every convention it realizes, and asserts that every
    GATING node is bound while documentation-only nodes stay unbound
  goal: make the binding lock a faithful projection of the obligations that must gate,
    closing 26 of the 28 unbound rules through implementation fan-out with zero new
    detectors
  outcome: a lock in which every gating node is bound, no entry is orphaned, and documentation-only
    nodes are correctly absent
  produce:
  - name: commons:binding-lock
    contract: contract:commons:binding-lock
    telemetry: null
    to: internal
  consume:
  - name: commons:rule-registry
    from: wagon:govern-registry
  - name: commons:provider-capability
    from: wagon:govern-providers
  wmbt:
    total: 3
    L001: minimize likelihood of an unbound gating obligation or a phantom binding
      going unnamed by the binding-gap inventory
    E001: maximize quantity of gating obligations bound by fanning each multi-rule
      implementation out to every convention it realizes, without shipping a single
      new detector
    E002: minimize likelihood of a gating extension node shipping with no bound mechanism,
      or a mechanism binding an obligation nobody declared, slipping past the gate
  total: 0
  manifest: plan/bind_extension_conventions/_bind_extension_conventions.yaml
  path: plan/bind_extension_conventions/
- wagon: bind-substrate-runtime
  description: 'The ATDD substrate runtime back end: the binder that turns a locked,
    inert `.atdd/substrate.lock.yaml` into running, gating capabilities. Admission
    (`admit-substrate`) installs packages but never executes them; this wagon is the
    first layer that runs admitted code. It loads enabled packages from the lock by
    `installed_path`, re-verifies each package''s sha256 digest against the lock before
    loading (the tamper boundary), composes the capability graph and indexes implementations
    by `realizes_convention`, selects which bound capabilities apply to a given lifecycle
    phase + blast radius, resolves the workspace each implementation targets (SemVer
    contract check + materialized workspace instance), and executes the implementation
    via PROVIDER-SPAWN (a subprocess in the provider''s runtime — core imports no
    extension code) to produce Violations. Those Violations are normalized into core''s
    disposition gate so a bound implementation gates a lifecycle transition exactly
    like a legacy validator, SHADOWING the matching legacy validator for the same
    convention; on any bind failure (digest mismatch, contract mismatch, crash, timeout,
    malformed output) gating FALLS BACK to legacy, loudly logged — never fail-open.
    The binding plan is cached in `.atdd/binding.lock.yaml`, digest-keyed off the
    substrate lock for reproducibility. The public surface is two commands: `atdd
    capabilities` (render which conventions are bound-owned vs legacy-fallback) and
    `atdd bind --check` (compose the plan, dry-run, never execute). Distinct from
    `admit-substrate`, which ADMITS external artifacts non-executing (subject operator,
    runtime never runs); this wagon BINDS and EXECUTES locked artifacts. The third
    and final substrate stage: author → admit → bind.'
  theme: commons
  subject: agent:operator
  context: admit-substrate-installs-packages-into-a-locked-but-inert-substrate, capabilities-cannot-gate-anything-until-something-binds-the-lock-to-behavior
  action: loads enabled packages from `.atdd/substrate.lock.yaml` by installed_path,
    re-verifies each package's sha256 digest against the lock before loading, composes
    the capability graph and indexes implementations by realizes_convention, selects
    applicable capabilities for a lifecycle phase + blast radius, resolves the targeted
    workspace (SemVer contract check + materialized instance), provider-spawns the
    implementation entrypoint as an isolated subprocess to produce Violations, and
    routes them into the disposition gate — shadowing the matching legacy validator
    on success and falling back to legacy on any failure
  goal: move gating out of core into admitted packages, executed reproducibly and
    in subprocess isolation with core importing no extension code, so a locked capability
    can gate a lifecycle transition exactly like a legacy validator while any bind
    failure fails safe to legacy
  outcome: enabled substrate becomes live gating capability driven entirely from `.atdd/substrate.lock.yaml`,
    with a cached digest-keyed `.atdd/binding.lock.yaml`, `atdd capabilities` / `atdd
    bind --check` surfaces, and a loud legacy-fallback path — never executing a tampered
    or contract-incompatible package and never failing open
  produce:
  - name: commons:bind:lock-loader
    contract: null
    telemetry: null
    to: external
  - name: commons:bind:capability-composer
    contract: null
    telemetry: null
    to: external
  - name: commons:bind:scope-selector
    contract: null
    telemetry: null
    to: external
  - name: commons:bind:workspace-resolver
    contract: null
    telemetry: null
    to: external
  - name: commons:bind:implementation-binder
    contract: null
    telemetry: null
    to: external
  - name: commons:bind:violation-router
    contract: null
    telemetry: null
    to: external
  - name: commons:bind:binding-cli
    contract: null
    telemetry: null
    to: external
  consume: []
  wmbt:
    total: 7
    D001: maximize likelihood of a schema-valid binding plan by defining one canonical
      JSON schema for `.atdd/binding.lock.yaml` (which conventions are bound-owned
      vs legacy-fallback, keyed by the substrate-lock digest) and validating it before
      use
    L001: maximize likelihood of loading exactly the live substrate by loading only
      `enabled` packages from the lock by installed_path and indexing implementations
      by realizes_convention, never loading a disabled or lock-absent package
    C001: minimize likelihood of executing a tampered or unlocked package by re-verifying
      each package's sha256 digest against the lock before loading and refusing on
      mismatch — bind is the first layer that runs admitted code
    C002: minimize likelihood of binding an implementation to an incompatible workspace
      by refusing when the implementation contract_version is not SemVer-compatible
      with the targeted provider's contract_version, or the targeted provider is absent
      or not enabled in the lock
    E001: maximize likelihood of isolated, import-clean execution by provider-spawning
      the implementation entrypoint as a subprocess in the resolved workspace instance
      and capturing Violations over the violation-output-contract, so core imports
      no extension code
    E002: maximize likelihood of correct gating by routing bound Violations into the
      disposition gate with deterministic precedence, so a bound implementation shadows
      the matching legacy validator for the same convention and gates a lifecycle
      transition exactly like a legacy validator
    M001: minimize likelihood of a silent bind failure by detecting a bound implementation
      that crashes, times out, or emits malformed output and falling back to legacy
      gating, surfaced loudly — never silently passing the gate (fail-safe, not fail-open)
  total: 0
  manifest: plan/bind_substrate_runtime/_bind_substrate_runtime.yaml
  path: plan/bind_substrate_runtime/
- wagon: coach-ops
  description: 'Rate-limit-aware operational tooling for coach runtime: batched PR
    polling via a single gh pr list call, exponential backoff on secondary rate-limit
    hits, pre-flight budget checks, and the `atdd coach watch` / `atdd agent wait-ci`
    CLI surface. Replaces per-PR gh pr view polling that caused ~24× over-consumption
    of GitHub GraphQL quota during dense waves.'
  theme: commons
  subject: agent:coach
  context: in-coach-v9-execution, dense-waves-hit-secondary-rate-limit-multiple-times-per-session
  action: batches all PR status reads into a single gh pr list call per cycle, defers
    statusCheckRollup to on-demand failures(), and exponentially backs off on 403-abuse
    responses
  goal: reduce GitHub API consumption by ~24× and eliminate secondary-rate-limit blackouts
    during multi-PR waves
  outcome: atdd coach watch + atdd agent wait-ci commands backed by a reusable coach.runtime.pr_watcher
    module; rate-limit preflight guard; exponential backoff with escalation-channel
