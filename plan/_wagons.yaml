- wagon: validate-conventions
  description: 'Convention-graph validator family/template suite under src/atdd/validators/conventions/:
    13 graph-question families and 22 reusable templates that ask executable questions
    against the composed convention graph, backed by a machine-readable registry and
    a typed template contract, with registry<->archetype conformance. Runs in parallel
    with the legacy persona validators until parity (#1205/#1206) permits their decommissioning
    (#1207).'
  theme: commons
  subject: agent:tester
  context: authoring-and-enforcing-convention-graph-validators, while-legacy-persona-validators-still-run
  action: defines the family/template catalogue, registry, and template contract,
    and instantiates graph-question variants that select eligible nodes by metadata
    and assert template-shaped failure evidence
  goal: organize validators by graph-question family rather than persona so new convention
    nodes are auto-captured by reusable templates, and prove parity before any legacy
    decommissioning
  outcome: src/atdd/validators/conventions/<family>/ exists with 13 families, 22 templates,
    a registry, and a template contract; convention validators run in parallel with
    legacy and become authoritative once parity is proven
  produce:
  - name: commons:validators:convention-family-registry
    contract: null
    telemetry: null
    to: external
  - name: commons:validators:convention-template-contract
    contract: null
    telemetry: null
    to: external
  consume: []
  wmbt:
    total: 22
    E036: minimize likelihood of parallel-checkout-corruption — every convention test
      that mutates the shared checkout carries the convention_filesystem_mutation
      marker and runs in a serial CI subset, while everything else runs under pytest-xdist
      -n auto, and the two subsets together collect exactly the un-split suite
    E032: minimize time of clean-convention-graph-construction — the composed convention
      graph is built once per pytest session and reused by every read-only baseline
      and contract test
    E033: minimize likelihood of binding-fault-filesystem-mutation — binding-family
      faults are injected by renaming a rule id in a cloned graph while the emitted
      bind_rule index is left unchanged, so no convention YAML is ever rewritten
    E034: minimize likelihood of evaluator-fault-filesystem-mutation — the remaining
      template-evaluator fault families (coherence, presence, resolution, coverage,
      acyclicity) inject faults into a cloned convention graph via graph_mutations
      instead of rewriting plan or convention YAML on disk
    E035: minimize likelihood of root-reader-fault-filesystem-mutation — the last
      seven fault families (policy, schema, grammar, composition, boundary, sizing,
      uniqueness) inject faults into a cloned graph or into a temp tree the graph
      is re-pointed at, so no fault family rewrites the real checkout and none re-composes
      the clean graph
    E001: minimize likelihood of registry-family-template-mismatch — registry.yaml
      declares exactly the 13 canonical families and 22 templates
    E002: minimize likelihood of registry-archetype-divergence — each family archetype.py
      exposes exactly the template ids registry.yaml assigns it
    E003: minimize likelihood of incomplete-template-contract — template_contract.py
      defines all eight mandatory template metadata fields
    E004: minimize likelihood of malformed-family-folder — every family folder contains
      README.md, archetype.py and fixtures.py
    E005: minimize likelihood of legacy-validator-regression — legacy persona validator
      folders are unmoved and atdd validate behaviour is unchanged
    E010: minimize likelihood of unbuilt-p0-variant — every P0 direct/split/merged/superseded
      entry has a target implementation or explicit superseded evidence
    E011: minimize likelihood of variant-metadata-noncompliance — every variant references
      a registry family/template and declares the nine metadata fields including a
      legacy_parity_source
    E013: minimize likelihood of legacy-import-coupling — no target convention validator
      imports a legacy persona validator module as its source of truth
    E014: minimize likelihood of parallel-run-collision — target convention validators
      and legacy persona validators run in parallel without collision
    E015: minimize likelihood of persona-folder-convention-validator — CI rejects
      any new convention-graph validator added under a legacy persona validator folder
    E018: minimize likelihood of non-authoritative-convention-path — after promotion
      the convention validators run as the authoritative convention-graph enforcement
      path
    E019: minimize likelihood of unnormalized-graph-node — composed graph exposes
      id/kind/refs/theme/package/location on real nodes
    E020: minimize likelihood of vacuous-variant-selection — every variant selects
      >0 real nodes or declares an allowed-empty selection
    E021: minimize likelihood of untemplated-failure-evidence — variant evidence keys
      are a subset of its template failure_evidence
    E025: minimize likelihood of train-representation-mismatch — train nodes loaded
      from detail files conform to the train schema
    E026: minimize likelihood of incomplete-harness-enum — the acceptance harness
      enum includes smoke so SMOKE accs are not false-flagged
    Y003: minimize likelihood of coverage-loss-on-legacy-validator-sweep-retirement
      — no rule implementation.ref/validator resolves to a deleted persona-folder
      validator and every repointed rule binds to an executing convention variant
      (not an xfail/stub)
  total: 0
  manifest: plan/validate_conventions/_validate_conventions.yaml
  path: plan/validate_conventions/
