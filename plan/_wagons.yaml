wagons:
  - wagon: self-compliance-migration
    description: "Bootstrap ATDD plan artifacts, contracts, and URN traceability for the toolkit itself"
    theme: commons
    subject: "toolkit:self"
    context: "in-migration, no-plan-artifacts-exist"
    action: "creates plan, contract, and traceability artifacts for existing code"
    goal: "prove the toolkit can validate itself under its own conventions"
    outcome: "full URN chain from plan to test to code for all four agent wagons"
    path: "plan/self_compliance_migration/"
    manifest: "plan/self_compliance_migration/_self_compliance_migration.yaml"

  - wagon: govern-lifecycle
    description: "Orchestrates ATDD lifecycle, manages GitHub issues, validates phase transitions, maintains registries"
    theme: commons
    subject: "agent:coach"
    context: "in-atdd-lifecycle, phases-require-gates"
    action: "validates compliance and orchestrates phase transitions"
    goal: "ensure all agents follow ATDD conventions and quality gates"
    outcome: "audit-passing repository with traceable plan-test-code graph"
    path: "plan/govern_lifecycle/"
    manifest: "plan/govern_lifecycle/_govern_lifecycle.yaml"

  - wagon: define-plans
    description: "Defines what must be built — wagons, features, acceptance criteria, and trains"
    theme: commons
    subject: "agent:planner"
    context: "in-design-phase, no-implementation-yet"
    action: "creates plan artifacts from requirements"
    goal: "establish traceable specifications before any code is written"
    outcome: "wagon manifests, feature YAMLs, WMBTs, and train definitions"
    path: "plan/define_plans/"
    manifest: "plan/define_plans/_define_plans.yaml"

  - wagon: verify-contracts
    description: "Defines how to verify the system — contracts, RED tests, and telemetry artifacts"
    theme: commons
    subject: "agent:tester"
    context: "in-red-phase, plan-artifacts-available"
    action: "generates failing tests and contract schemas from acceptance criteria"
    goal: "lock expected behavior before implementation begins"
    outcome: "RED tests, JSON Schema contracts, and telemetry signal definitions"
    path: "plan/verify_contracts/"
    manifest: "plan/verify_contracts/_verify_contracts.yaml"

  - wagon: implement-code
    description: "Implements code that makes RED tests GREEN, then refactors to clean 4-layer architecture"
    theme: commons
    subject: "agent:coder"
    context: "in-green-phase, red-tests-available"
    action: "writes minimal code to pass tests then refactors to 4-layer architecture"
    goal: "deliver working, well-architected implementation"
    outcome: "GREEN tests passing with domain-application-integration-presentation layers"
    path: "plan/implement_code/"
    manifest: "plan/implement_code/_implement_code.yaml"

  - wagon: security-patterns
    description: "AST-based validator that scans consumer code for known-bad security patterns — SQL injection, missing auth, hardcoded secrets, XSS"
    theme: commons
    subject: "coder:security"
    context: "in-coder-phase, code-review-rules-encodable"
    action: "scans consumer code via AST and regex for security anti-patterns"
    goal: "catch security violations that code review catches but are fully automatable"
    outcome: "zero known-bad security patterns in consumer codebase"
    path: "plan/security_patterns/"
    manifest: "plan/security_patterns/_security_patterns.yaml"

  - wagon: enforce-structured-logging
    description: "Enforce structured logging and prohibit print() in non-CLI production Python code"
    theme: commons
    subject: "agent:coder"
    context: "in-green-phase, logging-conventions-undefined"
    action: "validates logging patterns via AST analysis in coder phase"
    goal: "ensure all production Python code uses structured logging with context"
    outcome: "coder validator that detects unstructured log calls and print() in production code"
    path: "plan/enforce_structured_logging/"
    manifest: "plan/enforce_structured_logging/_enforce_structured_logging.yaml"

  - wagon: freeze-runtime-contracts
    description: "Coordination prerequisite for all coach v9 parallel tracks: centralized JSON schemas for runtime events, decisions, judgments, corrections, validator results, risk scores, plus runtime-layout, validator-invocation, and event-semantics docs"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-bootstrap, six-tracks-need-stable-cross-interface"
    action: "freezes coach-internal artifact contracts before parallel tracks begin"
    goal: "eliminate cross-track merge conflicts and divergent temporal assumptions in coach v9"
    outcome: "six committed JSON schemas with example fixtures plus three reviewed-and-approved contract docs at src/atdd/coach/schemas/"
    path: "plan/freeze_runtime_contracts/"
    manifest: "plan/freeze_runtime_contracts/_freeze_runtime_contracts.yaml"

  - wagon: drive-state-machine
    description: "atdd coach state machine MVP, atdd agent CLI subcommands, decision/judgment durability, two-phase commit absorbed from orchestrate, runtime watcher event sources, resume from decisions log"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-execution, polling-based-orchestrate-replaced"
    action: "drives the per-issue state machine (INIT → COMPLETE) deterministically with durable decisions.jsonl"
    goal: "own the issue lifecycle as a durable orchestrator instead of trusting agents to self-report phase"
    outcome: "atdd coach + atdd agent CLI surface with two-phase commit, runtime watchers, and resume semantics"
    path: "plan/drive_state_machine/"
    manifest: "plan/drive_state_machine/_drive_state_machine.yaml"

  - wagon: spawn-agents
    description: "atdd spawn skeleton, harness rendering with substrate blocks (wmbt_rules, train_rules, security_rules), canonical naming + layout pass, per-LLM convention file integration, orchestrate parity tests"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-execution, atdd-orchestrate-spawn-pipeline-absorbed"
    action: "spawns persona agents (planner/tester/coder/reviewer) via atdd spawn with substrate spawn-harness blocks"
    goal: "centralize launch-prompt rendering, multiplexer dispatch, and naming/layout under one rule-IDed entry point"
    outcome: "atdd spawn command at parity with absorbed orchestrate machinery (CI-enforced via K5)"
    path: "plan/spawn_agents/"
    manifest: "plan/spawn_agents/_spawn_agents.yaml"

  - wagon: observe-and-correct
    description: "atdd observer skeleton + correction injection paths, all 17 default observer rules (token threshold, bash auto-approve, naming/layout drift, smoke skip, substrate-aware), dashboard, aggregate-approve, babysit parity tests"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-execution, atdd-babysit-polling-replaced-by-event-driven-watcher"
    action: "observes per-agent runtime state via inotify/fswatch and injects corrections through rule-IDed sidecars"
    goal: "replace babysit's fixed-handful detect_violation with extensible observer rules"
    outcome: "atdd observer command at parity with absorbed babysit machinery (CI-enforced via L8)"
    path: "plan/observe_and_correct/"
    manifest: "plan/observe_and_correct/_observe_and_correct.yaml"

  - wagon: dispatch-validators
    description: "Git watcher, commit trailer parsing, custom pytest plugin (coach.runtime.violation_collector), validator selection per phase, suppression scanner integration, risk score with repo archetype slice"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-execution, substrate-pytest-violation-substrate-available"
    action: "dispatches tier-1 validators per (phase, WMBT scope) over each new commit and aggregates Violations by disposition"
    goal: "deliver fast, deterministic, suppression-aware feedback to agents at every commit"
    outcome: "real-time validator dispatch with risk-score routing and stale-suppression surfacing"
    path: "plan/dispatch_validators/"
    manifest: "plan/dispatch_validators/_dispatch_validators.yaml"

  - wagon: review-phase-boundaries
    description: "Reviewer persona + no-write spawn adapter, review-report schema (rule-ID-first + AC-coverage hard rule), per-phase reviewer prompts, judge call site #2 integration, atdd agent review"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-execution, tier-1-validator-output-structured-and-spawn-supports-reviewer"
    action: "runs adversarial LLM review at phase exits with rule-ID-resolving findings and no worktree write access"
    goal: "catch semantic and AC-coverage gaps that deterministic validators cannot express"
    outcome: "reviewer persona embedded in coach state machine at PLANNED, RED, GREEN, SMOKE (REFACTOR optional)"
    path: "plan/review_phase_boundaries/"
    manifest: "plan/review_phase_boundaries/_review_phase_boundaries.yaml"

  - wagon: judge-ambiguous-decisions
    description: "atdd judge core, six v1 call sites (borderline tier-1, reviewer concern, retry-vs-escalate, cross-phase regression, issue review aggregate, superseded rule-ID consolidation), atdd issue review multi-pass cross-LLM"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-execution, deterministic-routing-cannot-resolve-genuinely-ambiguous-decisions"
    action: "calls a structured-output LLM to judge ambiguous coach decisions and pre-coach issue reviews"
    goal: "preserve deterministic-first ordering while letting LLM judgment break ties at well-defined call sites"
    outcome: "atdd judge + atdd issue review with audit-trail in judgments.jsonl and discipline criteria for new call sites"
    path: "plan/judge_ambiguous_decisions/"
    manifest: "plan/judge_ambiguous_decisions/_judge_ambiguous_decisions.yaml"

  - wagon: discover-and-decommission
    description: "atdd rules discovery commands (show, where, grep, disposition, archetype, suppressions), per-LLM convention file generation in atdd sync, config loader extensions for coach.* block, decommissioning of atdd orchestrate (gated on K5) and atdd babysit (gated on L8)"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-execution, parity-test-suites-passing-on-ci"
    action: "exposes rule-registry discovery commands and removes legacy orchestrate/babysit entry points from the CLI"
    goal: "give humans + agents discovery handles into the rule registry and finalize the hard cut from legacy commands"
    outcome: "atdd rules subcommands + archived legacy commands with helpful error messages pointing at coach v9 equivalents"
    path: "plan/discover_and_decommission/"
    manifest: "plan/discover_and_decommission/_discover_and_decommission.yaml"

  - wagon: integrate-end-to-end
    description: "End-to-end coach-driven cycle on a real issue from atdd coach <N> through COMPLETE with PR opened; integration-bug observation as the explicit acceptance lens"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-done-line, all-other-tracks-merged"
    action: "drives the first real issue end-to-end and inventories integration bugs as follow-ups"
    goal: "prove coach v9 can manage its own development beyond the worked example"
    outcome: "successful coach-driven PR + filed integration-hardening follow-ups against the appropriate track"
    path: "plan/integrate_end_to_end/"
    manifest: "plan/integrate_end_to_end/_integrate_end_to_end.yaml"

  - wagon: integration-hardening
    description: "Wires the eight integration gaps discovered during the integrate-end-to-end run: K1 spawn-agents at every state transition, J3 decisions.jsonl write-before-action discipline, J5 watcher-driven reactive state advancement, M3 validator dispatch at phase-exit gates, L1 observer co-spawn, N5 reviewer at phase boundaries, J4 two-phase commit at COMPLETE, and production LLM client registration"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-integration-hardening, integrate-end-to-end-revealed-eight-wiring-gaps"
    action: "wires K1 spawn, J3 decisions.jsonl, J5 watcher, M3 validator dispatch, L1 observer, N5 reviewer, J4 two-phase commit, and production LLM registry into atdd coach state machine handlers"
    goal: "close all eight wiring gaps so atdd coach <N> drives a real issue from INIT to MERGED without operator intervention"
    outcome: "atdd coach <N> autonomously drives an issue through the full lifecycle with durable decisions, reactive watcher events, validator-gated phase exits, observer corrections, reviewer verdicts, two-phase commit, and registered LLM clients"
    path: "plan/integration_hardening/"
    manifest: "plan/integration_hardening/_integration_hardening.yaml"

  - wagon: coach-ops
    description: "Rate-limit-aware batched PR polling: single gh pr list call per cycle, statusCheckRollup deferred to on-demand failures(), 180s minimum interval, exponential backoff on 403-abuse, pre-flight rate-limit budget check; atdd coach watch + atdd agent wait-ci CLI"
    theme: commons
    subject: "agent:coach"
    context: "in-coach-v9-execution, dense-waves-hit-secondary-rate-limit-multiple-times-per-session"
    action: "batches all PR status reads into a single gh pr list call, backs off exponentially on abuse responses, skips cycles when <500 graphql points remain"
    goal: "reduce GitHub API consumption ~24× and eliminate secondary-rate-limit blackouts during multi-PR waves"
    outcome: "pr_watcher module + coach watch + agent wait-ci CLI; no secondary-rate-limit hits during 8-PR waves"
    path: "plan/coach_ops/"
    manifest: "plan/coach_ops/_coach_ops.yaml"
