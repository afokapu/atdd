  description: 'Implements coach v9''s real-time tier-1 validator pipeline (spec §6.4–§6.6,
    §6.8): a git watcher emits commit_observed events with parsed Phase/WMBT-Urn/Agent-Id
    trailers; a pytest plugin (coach.runtime.violation_collector) captures Violation
    records into validations/<sha>/violations.jsonl; per-phase validator selection
    unions toolkit conventions with substrate v12 repo.* rules whose RuleMetadata.phase
    matches the current coach phase; the suppression scanner separates suppressed
    and stale-suppression violations into suppressed.jsonl and stale-suppressions.jsonl
    while strict repo rules bypass suppression; risk score with by_archetype (incl.
    repo slice), by_severity, by_disposition, and stale_suppressions is computed and
    written to risk-score.json. Together these deliver the deterministic feedback
    loop that coach uses to route GREEN/SMOKE/REFACTOR phase exits and to block COMPLETE
    on configurable risk thresholds.'
