wagons:
- wagon: admit-substrate
  description: 'The ATDD substrate front door: a small, explicit admission layer that
    pulls external extension/workspace packages into a project''s local substrate
    — validated, digest-pinned, locked, and non-executing. `pip install atdd` ships
    only the core engine; `atdd add` admits substrate; core composes from `.atdd/substrate.lock.yaml`.
    Admission resolves a ref/alias/path, validates the package manifest + owned files
    + realizes/depends_on against core, composes an in-memory protocol view, records
    a sha256 digest, and installs into a versioned home under `.atdd/`, writing user
    intent (`substrate.yaml`) and resolved state (`substrate.lock.yaml`). It never
    imports or executes extension implementation code — runtime binding is a later,
    separate wagon. The public surface is exactly four commands: search, add, remove,
    list. Distinct from `author-atdd-substrate`, which PRODUCES artifacts (subject
    planner); this wagon ADMITS external artifacts (subject operator).'
  theme: commons
  subject: agent:operator
  context: pip-installs-only-the-core-engine, capabilities-live-in-external-extension-and-workspace-packages
  action: searches configured registries, then resolves a ref/alias/path, validates
    the package manifest + owned files + realizes/depends_on against core, composes
    a protocol view, records a sha256 digest, and installs into a versioned `.atdd/`
    home — writing intent (substrate.yaml) and resolved state (substrate.lock.yaml)
    — while never importing or executing extension implementation code
  goal: make every admitted package explicit, validated, digest-pinned, locked, and
    reviewable, and make core load substrate only from the lockfile (never an arbitrary
    filesystem scan), without ever executing admitted runtime code
  outcome: a `.atdd/substrate.yaml` (intent) plus `.atdd/substrate.lock.yaml` (resolved,
    digested) admitted via `atdd search/add/remove/list`, with no runtime implementation
    executed during admission
  produce:
  - name: commons:admit:substrate-schemas
    contract: null
    telemetry: null
    to: external
  - name: commons:admit:registry-reader
    contract: null
    telemetry: null
    to: external
  - name: commons:admit:artifact-resolver
    contract: null
    telemetry: null
    to: external
  - name: commons:admit:substrate-installer
    contract: null
    telemetry: null
    to: external
  - name: commons:admit:admission-cli
    contract: null
    telemetry: null
    to: external
  consume: []
  wmbt:
    total: 11
    D001: maximize likelihood of schema-valid substrate intent and lock by defining
      canonical substrate.yaml / substrate.lock.yaml / registry-index schemas and
      validating both files against them
    C001: minimize likelihood of executing extension runtime implementation code during
      admission (search/add/remove/list) — admission inspects manifests, validates,
      composes, and writes the lock, but never imports or runs an implementation module
    L001: maximize likelihood of correct registry search results by resolving a query
      against configured registry indexes by alias, canonical id, tags, and kind
    C002: minimize likelihood of mis-resolving an ambiguous alias by requiring a unique
      alias match and refusing with a candidate list when ambiguous
    C003: minimize likelihood of admitting an invalid artifact by resolving and validating
      the manifest, owned files, and realizes/depends_on against core and composing
      a protocol view before install, refusing on any failure
    E001: maximize likelihood of a reproducible installed substrate by installing
      into a versioned `.atdd/{extensions,workspaces}/<id>/<version>/` home, recording
      a sha256 digest, and writing a lock entry that `atdd list` reads
    C004: minimize likelihood of breaking a depended-on artifact by refusing removal
      when other admitted artifacts depend on it (unless --force) and pruning shared
      workspaces only with --prune
    E002: maximize likelihood of grouped-verb-parity by routing `atdd substrate {add,remove,bind,capabilities,list}`
      to the same handlers as the flat verbs, so exit codes and lock-file effects
      are identical
    C005: minimize likelihood of flat-verb-regression by keeping `atdd add/remove/bind/capabilities`
      and `list --substrate` working as deprecated aliases that emit a stderr deprecation
      notice naming the grouped form
    L002: maximize likelihood of grouped-command-discoverability by listing the five
      `atdd substrate` subcommands in its help and marking the flat verbs deprecated
      in the top-level help
    C006: minimize likelihood of stale-flat-verb-docs by documenting `atdd substrate
      ...` as the canonical form in the README and synced agent docs, with no doc
      presenting a flat substrate verb as primary
  total: 0
  manifest: plan/admit_substrate/_admit_substrate.yaml
  path: plan/admit_substrate/
- wagon: author-atdd-substrate
  description: 'First-class authoring substrate for ATDD governance artifacts: a shared
    `atdd author` CLI validation spine plus deterministic writers for the four canonical
    artifact kinds. One kind is conflict-free by construction (convention-node: one
    file per rule_id); the other three are registry-class (relationship, scope, gate)
    where many entries accumulate in one file. Each writer enforces a single canonical
    schema and flat canonical home per kind and performs dedup-insert + stable-sort
    + atomic write; for the registry kinds a re-sort/dedup git merge driver resolves
    residual concurrent-insert conflicts deterministically (it does not make them
    conflict-free). Authored artifacts pass normal ATDD validation unmodified.'
  theme: commons
  subject: agent:planner
  context: authoring-new-governance-artifacts, concurrent-waves-insert-into-shared-registries
  action: defines one canonical schema and flat canonical home per artifact kind,
    validates role/id/path on a shared author spine, and writes each artifact via
    dedup-insert + stable-sort + atomic write backed by a re-sort/dedup merge driver
  goal: make it impossible to author a malformed or non-deterministically-ordered
    governance artifact, and deterministically resolve (not eliminate) merge collisions
    when many wagons insert into the same registry file concurrently
  outcome: schema-valid convention-nodes, relationships.yaml, scopes.yaml, and per-trigger
    gate files authored deterministically through `atdd author`, all passing unmodified
    through normal ATDD validation
  produce:
  - name: commons:author:substrate-schemas
    contract: null
    telemetry: null
    to: external
  - name: commons:author:author-spine
    contract: null
    telemetry: null
    to: external
  - name: commons:author:author-merge-driver
    contract: null
    telemetry: null
    to: external
  - name: commons:author:convention-node-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:relationship-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:scope-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:gate-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:issue-body-command
    contract: null
    telemetry: null
    to: external
  consume: []
  wmbt:
    total: 26
    D001: maximize likelihood of schema-valid substrate by defining one canonical
      schema and flat canonical home per artifact kind and freezing the controlled
      vocabularies
    C009: minimize likelihood of orphan-extension-convention-nodes by asserting in
      atdd validate package that every convention node an extension owns is an endpoint
      of at least one edge in the extension's relationships.yaml
    C008: minimize likelihood of orphan-convention-nodes by asserting every convention
      node appears as a source_ref or target_ref of at least one relationship-graph
      edge (no node outside the graph), making graph integrity bidirectional
    C001: minimize likelihood of the shared atdd author spine accepting an invalid
      role, id, or path
    P001: minimize likelihood of wrong-authoring-context by resolving extension-vs-core
      (extension default; core only with --core)
    P002: maximize likelihood of a well-formed package-skeleton by scaffolding a new
      extension or workspace-provider package (manifest + canonical skeleton) from
      a validated namespaced id via `atdd author … init`
    C006: minimize likelihood of accepting a malformed package manifest (extension/workspace/implementation)
      or an incompatible provider↔implementation contract_version
    K001: minimize likelihood that authored artifacts are rejected or regressed by
      existing ATDD gates (authoring does not bypass validation)
    R001: minimize likelihood of an unresolved registry merge conflict by shipping
      a .gitattributes-registered re-sort/dedup git merge driver
    E001: maximize likelihood of schema-valid convention-node creation under a flat
      per-role nodes/ file
    C002: minimize likelihood of accepting a structurally invalid convention-node
    E002: maximize likelihood of a schema-valid, deterministically-ordered relationships.yaml
      when authoring an edge
    C003: minimize likelihood of accepting a malformed relationship edge
    E003: maximize likelihood of a schema-valid per-file scope (scopes/<scope_id>.scope.yaml)
      with embedded selectors sorted by selector_id
    C004: minimize likelihood of accepting a malformed or empty scope
    E004: maximize likelihood of a schema-valid, deterministically-ordered per-trigger
      gate file when authoring a gate entry
    C005: minimize likelihood of accepting a malformed gate
    C007: minimize likelihood of accepting an invalid package realization by validating
      realizes mappings (owned extension_node, shipped core_node, no design_candidate
      realized, derived targets) and refusing authored cross-package graph edges
    E005: maximize likelihood of a faithful composed protocol view by materializing
      realizes as derived edges with the provenance triple in composed mode only,
      source-only in core mode, never executing runtime
    E006: maximize likelihood of schema-valid issue-body creation when authoring from
      issue.schema.json (Graph Context + Mirror present, zero placeholders)
    E007: maximize likelihood of schema-valid convention-node validation metadata
      when authoring a convention node (optional block, family/(family,template) checked
      against registry.yaml, invalid JSON rejected, no concrete runtime state) without
      changing bind_rule semantics
    C010: minimize likelihood of accepting an invalid issue body (missing required
      section / missing Graph Context / out-of-enum Status) by validating against
      issue.schema.json instead of greping strings
    C011: minimize likelihood of schema-generator-gate drift by asserting issue.schema.json
      properties == create_issue_body fields == E019 required sections
    K002: minimize likelihood of existing-compliant-body validation regression by
      asserting today's compliant issue bodies validate against issue.schema.json
      (back-compat)
    E008: maximize likelihood of issue-publish-to-store when authoring via `atdd author
      issue` (store-first work_item + exactly one github external_ref, by default)
    C012: minimize likelihood of author-without-publish by requiring the generate
      path to reach the store-first publish and to fail loud (no body-only degrade)
      when the store is unreachable
  total: 0
  manifest: plan/author_atdd_substrate/_author_atdd_substrate.yaml
  path: plan/author_atdd_substrate/
- wagon: author-plan-substrate
  description: 'Deterministic `atdd author` writers for the five plan-layer artifact
    kinds (wagon, feature, wmbt, train, acceptance) that live under plan/<slug>/ and
    are keyed by URN/slug/step-code, not role.rule_id. Sibling of author-atdd-substrate
    (the governance layer): it reuses the shared author validation spine but adds
    a plan-artifact input guard (slug/URN/step-code/path-under-plan/) and one canonical
    schema + canonical home per plan kind. Per-file kinds (wagon, feature, wmbt) are
    written conflict-free by construction; train is registry-class (plan/_trains.yaml
    dedup-insert + plan/_trains/<id>.yaml); acceptance is an in-place append into
    an existing wmbt file''s acceptances[]. Authored plan artifacts pass normal `atdd
    validate planner` unmodified. This is the on-Confirm writer #1139 (atdd plan)
    invokes per locked unit.'
  theme: commons
  subject: agent:planner
  context: authoring-new-plan-artifacts, atdd-plan-confirm-boundary invokes the writer
    per locked unit
  action: validates slug/URN/step-code/path on the shared author spine extended with
    a plan-artifact guard, then writes each plan kind to its canonical home under
    plan/ via schema-valid construction (per-file kinds conflict-free; train registry-class
    dedup-insert + stable-sort + atomic write; acceptance in-place append)
  goal: make it impossible to author a malformed or mis-placed plan-layer artifact,
    so the atdd plan Confirm boundary can lock a decomposition and have it written
    deterministically without a bespoke writer
  outcome: schema-valid wagons, features, WMBTs, train entries, and acceptances authored
    deterministically through `atdd author`, all passing unmodified through `atdd
    validate planner`
  produce:
  - name: commons:author:plan-spine
    contract: null
    telemetry: null
    to: external
  - name: commons:author:wagon-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:feature-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:wmbt-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:train-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:acceptance-command
    contract: null
    telemetry: null
    to: external
  consume:
  - name: commons:author:author-spine
    from: wagon:author-atdd-substrate
  wmbt:
    total: 15
    C001: minimize likelihood of the plan-artifact author guard accepting a malformed
      slug, URN, step-code, or a path escaping plan/
    C008: minimize likelihood of non-object-author-spec by having the plan-author
      spine reject any spec that is not a JSON object before a unit is admitted or
      a per-kind writer runs
    E001: maximize likelihood of schema-valid wagon-manifest creation under the canonical
      plan/<slug>/_<slug>.yaml home
    C002: minimize likelihood of accepting a structurally invalid wagon manifest
    E002: maximize likelihood of schema-valid feature creation under plan/<slug>/features/<name>.yaml
    C003: minimize likelihood of accepting a structurally invalid feature
    E003: maximize likelihood of schema-valid wmbt creation (ODI grammar + seed SMOKE
      acceptance) under plan/<slug>/<CODE>.yaml
    C004: minimize likelihood of accepting a structurally invalid wmbt
    E004: maximize likelihood of schema-valid train-entry creation into the _trains.yaml
      registry and plan/_trains/<id>.yaml
    C005: minimize likelihood of accepting a structurally invalid train
    E005: maximize likelihood of schema-valid acceptance append into an existing wmbt
      file's acceptances[]
    C006: minimize likelihood of accepting a malformed acceptance
    E006: 'minimize likelihood of an unbound-train-validator by adding a train.convention.yaml
      rules: block and binding the train validators (executable-train family + dispatch
      rules), behaviour-preserving'
    E007: 'maximize likelihood of a schema-valid interlocking-artifact-write under
      plan/_trains/_interlockings/<id>.yaml: derive ONLY the digests via the single-source-of-truth
      stamp (per-route expected_sequence_digest + whole-doc content_digest), dedup-insert
      the registry entry, idempotent re-stamp, clean refusal (no partial write) on
      a missing route train, satisfying the real #1249 Confirm gate'
    E008: maximize likelihood of a schema-valid contract-schema-write authored by
      construction (identity-derived path, $id contract:{identity}, deduped _contracts.yaml
