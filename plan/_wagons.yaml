wagons:
- wagon: author-atdd-substrate
  description: 'First-class authoring substrate for ATDD governance artifacts: a shared
    `atdd author` CLI validation spine plus deterministic writers for the four canonical
    artifact kinds. One kind is conflict-free by construction (convention-node: one
    file per rule_id); the other three are registry-class (relationship, scope, gate)
    where many entries accumulate in one file. Each writer enforces a single canonical
    schema and flat canonical home per kind and performs dedup-insert + stable-sort
    + atomic write; for the registry kinds a re-sort/dedup git merge driver resolves
    residual concurrent-insert conflicts deterministically (it does not make them
    conflict-free). Authored artifacts pass normal ATDD validation unmodified.'
  theme: commons
  subject: agent:planner
  context: authoring-new-governance-artifacts, concurrent-waves-insert-into-shared-registries
  action: defines one canonical schema and flat canonical home per artifact kind,
    validates role/id/path on a shared author spine, and writes each artifact via
    dedup-insert + stable-sort + atomic write backed by a re-sort/dedup merge driver
  goal: make it impossible to author a malformed or non-deterministically-ordered
    governance artifact, and deterministically resolve (not eliminate) merge collisions
    when many wagons insert into the same registry file concurrently
  outcome: schema-valid convention-nodes, relationships.yaml, scopes.yaml, and per-trigger
    gate files authored deterministically through `atdd author`, all passing unmodified
    through normal ATDD validation
  produce:
  - name: commons:author:substrate-schemas
    contract: null
    telemetry: null
    to: external
  - name: commons:author:author-spine
    contract: null
    telemetry: null
    to: external
  - name: commons:author:author-merge-driver
    contract: null
    telemetry: null
    to: external
  - name: commons:author:convention-node-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:relationship-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:scope-command
    contract: null
    telemetry: null
    to: external
  - name: commons:author:gate-command
    contract: null
    telemetry: null
    to: external
  consume: []
  wmbt:
    total: 17
    D001: maximize likelihood of schema-valid substrate by defining one canonical
      schema and flat canonical home per artifact kind and freezing the controlled
      vocabularies
    C001: minimize likelihood of the shared atdd author spine accepting an invalid
      role, id, or path
    P001: minimize likelihood of wrong-authoring-context by resolving extension-vs-core
      (extension default; core only with --core)
    P002: maximize likelihood of a well-formed package-skeleton by scaffolding a new
      extension or workspace-provider package (manifest + canonical skeleton) from
      a validated namespaced id via `atdd author … init`
    C006: minimize likelihood of accepting a malformed package manifest (extension/workspace/implementation)
      or an incompatible provider↔implementation contract_version
    K001: minimize likelihood that authored artifacts are rejected or regressed by
      existing ATDD gates (authoring does not bypass validation)
    R001: minimize likelihood of an unresolved registry merge conflict by shipping
      a .gitattributes-registered re-sort/dedup git merge driver
    E001: maximize likelihood of schema-valid convention-node creation under a flat
      per-role nodes/ file
    C002: minimize likelihood of accepting a structurally invalid convention-node
    E002: maximize likelihood of a schema-valid, deterministically-ordered relationships.yaml
      when authoring an edge
    C003: minimize likelihood of accepting a malformed relationship edge
    E003: maximize likelihood of a schema-valid per-file scope (scopes/<scope_id>.scope.yaml)
      with embedded selectors sorted by selector_id
    C004: minimize likelihood of accepting a malformed or empty scope
    E004: maximize likelihood of a schema-valid, deterministically-ordered per-trigger
      gate file when authoring a gate entry
    C005: minimize likelihood of accepting a malformed gate
    C007: minimize likelihood of accepting an invalid package realization by validating
      realizes mappings (owned extension_node, shipped core_node, no design_candidate
      realized, derived targets) and refusing authored cross-package graph edges
    E005: maximize likelihood of a faithful composed protocol view by materializing
      realizes as derived edges with the provenance triple in composed mode only,
      source-only in core mode, never executing runtime
  total: 0
  manifest: plan/author_atdd_substrate/_author_atdd_substrate.yaml
  path: plan/author_atdd_substrate/
- wagon: coach-ops
  description: 'Rate-limit-aware operational tooling for coach runtime: batched PR
    polling via a single gh pr list call, exponential backoff on secondary rate-limit
    hits, pre-flight budget checks, and the `atdd coach watch` / `atdd agent wait-ci`
    CLI surface. Replaces per-PR gh pr view polling that caused ~24× over-consumption
    of GitHub GraphQL quota during dense waves.'
  theme: commons
  subject: agent:coach
  context: in-coach-v9-execution, dense-waves-hit-secondary-rate-limit-multiple-times-per-session
  action: batches all PR status reads into a single gh pr list call per cycle, defers
    statusCheckRollup to on-demand failures(), and exponentially backs off on 403-abuse
    responses
  goal: reduce GitHub API consumption by ~24× and eliminate secondary-rate-limit blackouts
    during multi-PR waves
  outcome: atdd coach watch + atdd agent wait-ci commands backed by a reusable coach.runtime.pr_watcher
    module; rate-limit preflight guard; exponential backoff with escalation-channel
    notification
  produce:
  - name: commons:coach:pr-watcher-module
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:coach-watch-cli
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:agent-wait-ci-cli
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:dashboard-card
    contract: contract:commons:coach:dashboard-card
    telemetry: null
    to: external
  consume: []
  wmbt:
    total: 2
    M001: minimize likelihood of secondary-rate-limit-hits-during-batched-pr-polling
    M002: minimize time to assess live-coach-worker-state during a wave
  total: 0
  manifest: plan/coach_ops/_coach_ops.yaml
  path: plan/coach_ops/
- wagon: coach-wave-orchestration
  description: Within-wave concurrency and one-persistent-pane-per-issue for atdd
    coach cold-start. Drives every issue in a dependency-free wave concurrently (one
    coach-run id, worker pane, and _drive_single_issue loop per member), joins all
    members before advancing, and aggregates per-member rc so a BLOCKED member is
    reported without aborting already-spawned siblings. Hosts each issue in a single
    persistent cmux surface named ATDD<N>, created once and never renamed, and respawns
    the persona agent in place inside that surface on each phase transition (a fresh
    claude process via cmux respawn-pane, not /clear) so coach never accumulates a
    new pane per phase; a BLOCKED phase leaves its pane intact for debugging.
  theme: commons
  subject: agent:coach
  context: in-coach-v9-cold-start, _execute_cold_start-loops-wave-members-serially-and-the-spawn-path-creates-a-new-pane-per-phase
  action: drives all members of a dependency-free wave concurrently with an aggregate
    rc, and hosts each issue in one persistent cmux surface named ATDD<N>, respawning
    the persona agent in place each phase
  goal: make the executor honour the printed wave plan and give each issue one stable
    pane for its whole lifecycle
  outcome: concurrent within-wave driver in _execute_cold_start with between-wave
    dependency ordering preserved; one persistent surface per issue with in-place
    persona respawn in the spawn path
  produce:
  - name: commons:coach:concurrent-wave-driver
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:persistent-issue-pane
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:in-place-persona-respawn
    contract: null
    telemetry: null
    to: external
  consume: []
  wmbt:
    total: 2
    E001: minimize likelihood of within-wave-issues-executing-serially
    D001: minimize likelihood of per-phase-pane-proliferation
  total: 0
  manifest: plan/coach_wave_orchestration/_coach_wave_orchestration.yaml
  path: plan/coach_wave_orchestration/
- wagon: consolidate-coach-workspace
  description: 'Coach workspace layout consolidation (issue #736): a fixed 50/50 two-pane
    split (coach left, all workers right), one canonical coach orchestration tab regardless
    of how many issues/invocations are in flight, a consolidated multi-issue status
    view rendered in that tab, workers added as right-pane surfaces rather than tiled
    panes, and the per-worker observer demoted from a co-spawned `:obs` surface to
    a headless background process. Stops coach-tab count and per-worker tab count
    from scaling linearly with the wave.'
  theme: commons
  subject: agent:coach
  context: in-coach-v9-execution, n-coach-invocations-produce-n-tabs-and-each-worker-spawns-a-persona-plus-an-obs-surface
  action: lays out the coach workspace as a fixed 50/50 split with one canonical coach
    orchestration tab, renders a consolidated multi-issue status view in it, places
    workers as right-pane surfaces, and runs the per-worker observer headless
  goal: keep the coach workspace readable and singular regardless of how many issues
    or workers are in flight
  outcome: one canonical coach orchestration tab with a consolidated per-issue status
    view, a fixed 50/50 coach/worker split, workers as right-pane surfaces, and a
    headless observer so each worker is one tab
  produce:
  - name: commons:coach:canonical-coach-surface
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:consolidated-coach-view
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:coach-workspace-layout
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:headless-observer
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:canonical-surface-name
    contract: contract:commons:coach:canonical-surface-name
    telemetry: null
    to: external
  consume: []
  wmbt:
    total: 9
    Y001: minimize quantity of coach-orchestration-tabs so N issues / N invocations
      resolve to one canonical tab
    E001: increase likelihood of multi-issue-orchestration-state-visibility via a
      consolidated per-issue status view
    D001: minimize quantity of coach-pane-shrinkage-when-workers-are-added via a fixed
      50/50 split and workers-as-surfaces
    Y002: minimize quantity of surfaces-spawned-per-worker by running the observer
      headless
    E002: minimize quantity of obs-surfaces-co-spawned-by-cmd-spawn by running the
      observer headless in the live cmd_spawn path
    C001: maximize likelihood of each per-workspace worker keeping its own single-identity
      daemon scope after a layout pass
    E003: minimize likelihood of logging a layout target without invoking a backend
      layout primitive
    E004: minimize likelihood of emitting a managed surface name lacking the role-aware
      canonical shape
    E005: minimize likelihood of a decorated cmux workspace handle reaching cmux list
      panes unsanitized
  total: 0
  manifest: plan/consolidate_coach_workspace/_consolidate_coach_workspace.yaml
  path: plan/consolidate_coach_workspace/
