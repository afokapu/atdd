wagon: coach-verb-split
urn: "wagon:coach-verb-split"
name: "Coach Verb Split"
description: "Split the monolithic `atdd issue` command into archetype-owned sub-verbs (umbrella #1303). C1 (#1304, LEAD) extracts the phase transition into `atdd coach transition <N> <TO>`, backed by a single engine (issue_transition.apply_transition) that preserves operator-token enforcement, store-first write, manifest mirror, github label swap, and the strict/non-strict commit paths. Establishes the coach_verbs auto-discovery package so each extracted verb is a drop-in file and parallel children edit nothing shared; the deprecated `atdd issue --status` shim warns and delegates."
theme: commons

subject: "agent:coach"
context: "in-umbrella-1303-atdd-issue-split, ~10-existing-atdd-issue-status-callers-must-keep-working, c2-c4-add-verbs-in-parallel"
action: "moves the phase-transition orchestration into a single engine that both the new coach verb and the deprecated shim call, and registers each extracted verb as an auto-discovered coach_verbs drop-in"
goal: "extract `atdd coach transition` with byte-for-byte behavior parity and establish a merge-conflict-free verb-registration pattern for C2-C4"
outcome: "atdd coach transition <N> <TO> verb backed by issue_transition.apply_transition; coach_verbs auto-discovery package; deprecated `atdd issue --status` warns + delegates; operator token, store-first, manifest mirror, github label and strict/non-strict paths preserved identically"

features:
  - urn: "feature:coach-verb-split:split-issue-verbs"

produce:
  - name: commons:coach:transition-verb
    contract: null
    telemetry: null
    to: external
  - name: commons:coach:verb-registry
    contract: null
    telemetry: null
    to: external

consume: []

wmbt:
  total: 4
  E001: "minimize likelihood of behavior-drift-between-atdd-issue-status-and-atdd-coach-transition"
  E002: "minimize likelihood of behavior-drift-between-atdd-issue-reconcile-and-atdd-coach-reconcile"
  E003: "minimize likelihood of behavior-drift-between-atdd-issue-read-forms-and-atdd-coach-issues"
  E004: "minimize likelihood of behavior-drift-between-atdd-issue-sync-labels-and-atdd-coach-sync-labels"
