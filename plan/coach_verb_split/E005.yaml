urn: "wmbt:coach-verb-split:E005"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "behavior-drift-between-the-six-remaining-atdd-issue-verbs-and-their-atdd-coach-homes"
context_clarifier: "when umbrella #1303 splits `atdd issue` across the author and coach archetypes: C5a (#1382) extracts the LAST six monolith-only verbs — review (the #508 LLM issue-review), is-registered, --check, --close-wmbt, --sync-wmbts, and the bare enter — DELEGATION-ONLY (it must NOT re-implement any of them), the existing `atdd issue <verb>` callers must keep working, the pre-commit hook's branch-registration gate (`atdd issue is-registered`) must keep gating after C5b deletes the monolith, and `branch.py`/`pr.py` must stop hard-depending on `issue.py` for TYPE_TO_PREFIX / ALLOWED_BRANCH_PREFIXES so C5b (#1309) can delete the `atdd issue` subparser + monolith cleanly. `atdd coach review` is already owned by the coach disposition/merge-readiness command, so the LLM issue-review lands as the non-colliding `atdd coach issue-review <N>`."
lens: "functional.effectiveness"
statement: "minimize likelihood of behavior-drift-between-the-six-remaining-atdd-issue-verbs-and-their-atdd-coach-homes by registering `atdd coach issue-review <N>`, `atdd coach is-registered <branch>`, `atdd coach check <N>`, `atdd coach close-wmbt <N> <ID>`, `atdd coach sync-wmbts <N>`, and `atdd coach enter <N>` as thin auto-discovered drop-ins in the coach_verbs package that DELEGATE verbatim to the current logic (issue_review.run; IssueManager.branch_is_registered; IssueLifecycle.check; IssueLifecycle.close_wmbt; IssueManager.sync_wmbts; IssueLifecycle.enter) — re-implementing nothing — and rewiring the deprecated `atdd issue` forms to warn on stderr (direct print, NOT _deprecation_warning, so no wholesale `atdd issue` key lands in the fix-hint C2 registry) and delegate to the same code; additionally moving TYPE_TO_PREFIX / ALLOWED_BRANCH_PREFIXES into a neutral issue_prefixes module (re-exported by issue.py) so branch.py/pr.py no longer hard-depend on the monolith, and repointing the pre-commit hook to `atdd coach is-registered`, so the two entry points are the same code, each extracted verb touches nothing shared, and C5b can delete the monolith cleanly."
acceptances:
  - identity:
      urn: "acc:coach-verb-split:E005-UNIT-001-remaining-verbs-auto-discovery-and-prefix-decouple"
      id: "AC-UNIT-001"
      purpose: "coach_verbs.resolve_verb resolves each of the six new drop-ins to its run entry point with zero edits to any shared file, and TYPE_TO_PREFIX / ALLOWED_BRANCH_PREFIXES resolve from the neutral issue_prefixes module (with issue.py re-exporting them unchanged)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The coach_verbs auto-discovery package with the issue_review, is_registered, check, close_wmbt, sync_wmbts, and enter drop-ins present"
        - "The neutral issue_prefixes module and the re-exporting issue.py"
    when:
      abstract: "resolve_verb / discover() are called for each verb token, and the prefix constants are imported from both issue_prefixes and issue"
    then:
      abstract:
        - "resolve_verb('issue-review'|'is-registered'|'check'|'close-wmbt'|'sync-wmbts'|'enter') is the same callable as the matching coach_verbs.<module>.run"
        - "discover() maps each of those six tokens to that same callable"
        - "resolve_verb of an unknown token or a bare issue number returns None"
        - "issue_prefixes.TYPE_TO_PREFIX == issue.TYPE_TO_PREFIX and issue_prefixes.ALLOWED_BRANCH_PREFIXES == issue.ALLOWED_BRANCH_PREFIXES (issue.py re-exports; branch.py/pr.py import from issue_prefixes)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-08"
  - identity:
      urn: "acc:coach-verb-split:E005-INTEGRATION-001-coach-verbs-delegate-identically-and-shims-warn"
      id: "AC-INTEGRATION-001"
      purpose: "each new atdd coach verb delegates to the same function/method the old atdd issue form did, and each deprecated atdd issue shim warns on stderr (direct print) and delegates to the same code"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The delegated targets (issue_review.run; IssueManager.branch_is_registered / sync_wmbts; IssueLifecycle.check / close_wmbt / enter) stubbed at the class/module level with recording spies (no GitHub/git I/O)"
        - "A throwaway issue number / branch name (never a live issue) under a temp control root"
    when:
      abstract: "coach.run_cli(['issue-review', N ...]) / (['is-registered', BRANCH]) / (['check', N]) / (['close-wmbt', N, ID]) / (['sync-wmbts', N]) / (['enter', N]) is called, and separately cli.main for each deprecated `atdd issue` form"
    then:
      abstract:
        - "coach.run_cli reaches the corresponding delegate exactly once with the same arguments the old atdd issue path passed, and returns its exit code (issue-review flags --passes/--llms/--dimensions/--show/--force forwarded; is-registered returns 0/1 and 2 on a missing branch; check -> IssueLifecycle.check(N); close-wmbt -> close_wmbt(N, ID, force); sync-wmbts -> 0 if rc>=0 else 1; enter -> IssueLifecycle.enter(N))"
        - "The deprecated `atdd issue review <N>` / `atdd issue is-registered <branch>` / `atdd issue <N> --check` / `atdd issue <N> --close-wmbt <ID>` / `atdd issue <N> --sync-wmbts` forms each print a one-line stderr deprecation notice naming the canonical `atdd coach <verb>` and reach the SAME delegate (no re-implementation), returning its exit code"
        - "The bare `atdd issue <N>` (#1307 shim, unchanged) still reaches IssueLifecycle.enter — the same engine `atdd coach enter <N>` delegates to"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-08"
  - identity:
      urn: "acc:coach-verb-split:E005-SMOKE-001-real-remaining-verbs-and-hook-gate-in-temp-control-root"
      id: "AC-SMOKE-001"
      purpose: "against an isolated temp control root a real `atdd coach is-registered` reaches the real branch-registration gate (proving delegation), the deprecated `atdd issue is-registered` reaches the same gate + warns, and the pre-commit hook now invokes `atdd coach is-registered` so C5b's monolith deletion cannot break commits"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A temp ATDD_CONTROL_ROOT / temp cwd with a throwaway branch name that is not any real registered branch (never a live issue)"
        - "The repointed pre-commit hook text invoking `atdd coach is-registered \"$BRANCH\"`"
    when:
      abstract: "`atdd coach is-registered <branch>` and the deprecated `atdd issue is-registered <branch>` are executed as REAL subprocesses against the temp control root, and the hook's registration line is inspected"
    then:
      abstract:
        - "`atdd coach is-registered` drives the REAL IssueManager.branch_is_registered gate (exit 1 for an unregistered branch in an atdd-managed repo; exit 0 when nothing to check), proving the verb delegated to the real gate with no UnboundLocalError and no live gh mutation"
        - "The deprecated `atdd issue is-registered` reaches the SAME gate (same exit semantics) and prints the stderr deprecation notice naming `atdd coach is-registered`"
        - "The pre-commit hook invokes `atdd coach is-registered` (not `atdd issue is-registered`), so the branch-registration gate survives C5b's deletion of the `atdd issue` monolith"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-08"
