urn: "wmbt:coach-verb-split:E003"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "behavior-drift-between-atdd-issue-read-forms-and-atdd-coach-issues"
context_clarifier: "when umbrella #1303 splits `atdd issue` across the author and coach archetypes: the existing `atdd issue open` (list) and `atdd issue <N>` (show/enter) read callers must keep working unchanged, the list + show/enter rendering must survive the move by DELEGATING to the current logic (IssueManager.open_issues / IssueLifecycle.enter) rather than being reimplemented, and C1/C2/C4 (#1304/#1305/#1308) plus #1272 must be able to add their verbs in parallel without merge conflicts"
lens: "functional.effectiveness"
statement: "minimize likelihood of behavior-drift-between-atdd-issue-read-forms-and-atdd-coach-issues by extracting the read verbs into `atdd coach issues` (list) and `atdd coach issues <N>` (show/enter) as a drop-in in the coach_verbs auto-discovery package that DELEGATES to the existing read logic — IssueManager.open_issues for the list and IssueLifecycle.enter for show/enter — reimplementing nothing, while the deprecated `atdd issue open` and `atdd issue <N>` shims warn on stderr and delegate to the same new verb, and the drop-in registers with zero edits to any shared file so parallel children never merge-conflict"
acceptances:
  - identity:
      urn: "acc:coach-verb-split:E003-UNIT-001-issues-verb-auto-discovery"
      id: "AC-UNIT-001"
      purpose: "coach_verbs.resolve_verb('issues') returns the issue_read.run entry point, and the drop-in is discovered with zero edits to any shared file"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The coach_verbs auto-discovery package with the issues.py drop-in present"
    when:
      abstract: "resolve_verb('issues') and discover() are called"
    then:
      abstract:
        - "resolve_verb('issues') is the same callable as issue_read.run"
        - "discover()['issues'] is that same callable"
        - "resolve_verb of an unknown token or a bare issue number returns None"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-08"
  - identity:
      urn: "acc:coach-verb-split:E003-INTEGRATION-001-coach-issues-delegates-identically"
      id: "AC-INTEGRATION-001"
      purpose: "atdd coach issues delegates the list + show/enter identically to the old atdd issue open / atdd issue <N> paths, and the deprecated shims warn + delegate"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "IssueManager.open_issues and IssueLifecycle.enter stubbed via class-level patches (recording spies)"
        - "A throwaway issue number (never a live issue) under a temp control root"
    when:
      abstract: "coach.run_cli(['issues','open']) / coach.run_cli(['issues', N]) is called, and separately cli.main for `issue open` and `issue N`"
    then:
      abstract:
        - "coach.run_cli(['issues','open']) reaches IssueManager.open_issues with the same (label, limit, assignee) args the old `atdd issue open` used"
        - "coach.run_cli(['issues', N]) reaches IssueLifecycle.enter with issue_number=N — the show/enter path"
        - "The deprecated `atdd issue open` and `atdd issue <N>` print a stderr deprecation notice naming `atdd coach issues` and delegate to the new verb; the delegate is reached with the same args"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-08"
  - identity:
      urn: "acc:coach-verb-split:E003-SMOKE-001-real-read-in-temp-control-root"
      id: "AC-SMOKE-001"
      purpose: "against a temp ATDD_CONTROL_ROOT with a throwaway slug (never a live issue), atdd coach issues drives a real list + show/enter render and the deprecated shims still route to it"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A temp control root (ATDD_CONTROL_ROOT) seeded with a throwaway work item whose slug is not any real issue"
        - "GitHub list/fetch I/O stubbed at the client seam — the smoke exercises the real verb dispatch + delegation wiring, never a live GitHub issue"
    when:
      abstract: "atdd coach issues open and atdd coach issues <throwaway-N> are executed end-to-end against the temp control root, then the deprecated `atdd issue open` / `atdd issue <throwaway-N>` forms"
    then:
      abstract:
        - "The `atdd coach issues` list and the `atdd coach issues <N>` show/enter render identical output to the old `atdd issue open` / `atdd issue <N>` forms (proven by capturing both and comparing)"
        - "Running the deprecated `atdd issue open` / `atdd issue <throwaway-N>` reaches the same delegation target (proven by identical output) and prints the deprecation notice on stderr"
        - "No live GitHub issue and no real control root outside the temp dir is ever touched"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-07-08"
