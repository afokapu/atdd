urn: "feature:coach-verb-split:split-issue-verbs"
wagon: "wagon:coach-verb-split"
description: "Split the monolithic `atdd issue` command into archetype-owned sub-verbs (umbrella #1303). C1 (#1304, LEAD) extracts the phase transition into `atdd coach transition <N> <TO>`, backed by a single engine (issue_transition.apply_transition) that preserves operator-token enforcement, store-first write, manifest mirror, github label swap, and the strict/non-strict commit paths. Establishes the coach_verbs auto-discovery package so each extracted verb is a drop-in file (VERB + run) and parallel children (#1305/#1307/#1308) edit nothing shared. The deprecated `atdd issue --status` shim warns on stderr and delegates, keeping the ~10 existing callers working."
sizing:
  wmbts: 3
  footprint_score: 9
  footprint_size: "S"
wmbts:
  - "wmbt:coach-verb-split:E001"
  - "wmbt:coach-verb-split:E002"
  - "wmbt:coach-verb-split:E003"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 6
        rationale: "E001: coach_verbs/transition.py drop-in (the `atdd coach transition` verb) and the cli.py `atdd issue --status` deprecated delegator. E002: coach_verbs/reconcile.py drop-in (the `atdd coach reconcile` verb) and the cli.py `atdd issue reconcile` deprecated warn-and-delegate shim. E003: coach_verbs/issues.py drop-in (the `atdd coach issues` verb) and the cli.py `atdd issue open`/`atdd issue <N>` deprecated delegators"
    application:
      - type: "use_cases"
        count: 1
        rationale: "E001: issue_transition.apply_transition — the moved transition orchestration engine. E002 + E003 add none: both are delegation-only and reuse existing engines unchanged (E002 → IssueManager.reconcile() with its E054 fixes; E003 → IssueManager.open_issues / IssueLifecycle.enter)"
    integration:
      - type: "adapters"
        count: 1
        rationale: "coach_verbs auto-discovery resolver (resolve_verb / discover) that maps a coach sub-verb token to its drop-in module — established by E001 and reused by E002's reconcile + E003's issues drop-ins with no new adapter"
