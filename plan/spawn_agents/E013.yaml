urn: "wmbt:spawn-agents:E013"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "coach-spawn-adapters-lacking-declared-permission-flags-and-allowed-tools-allowlist"
context_clarifier: "ADAPTER_REGISTRY in src/atdd/coach/commands/spawn.py currently maps llm-id to a plain Callable[[Path], str]; the permission-mode flag and allowed-tools string are embedded inline in each adapter function's body with no structured field that validators or #824's shim can introspect — every new adapter must remember to add them by convention with no enforcement, and the cli-return shim (issue #824) cannot read the allowlist config programmatically to decide whether a received cli-return is for a freedom-set tool or a deny-pattern bash"
lens: "functional.effectiveness"
statement: "minimize likelihood of coach-spawn-adapters-lacking-declared-permission-flags-and-allowed-tools-allowlist when ADAPTER_REGISTRY must carry structured permission_flags and allowed_tools fields on each entry so validators can gate missing config and the #824 shim can introspect the freedom set without re-parsing the shell command string"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E013-UNIT-001-adapter-registry-entries-have-permission-fields"
      id: "AC-UNIT-001"
      purpose: "Each entry in ADAPTER_REGISTRY carries a permission_flags list and an allowed_tools list accessible by key; accessing these fields for every registered adapter does not raise AttributeError or KeyError"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/spawn.py defines ADAPTER_REGISTRY"
        - "ADAPTER_REGISTRY is imported in the test without side effects"
    when:
      abstract: "For each key in ADAPTER_REGISTRY, the entry's permission_flags and allowed_tools attributes are read"
    then:
      abstract:
        - "Every registered adapter (claude-code, claude-glm, claude-gpt, codex, gemini) has a non-empty permission_flags list"
        - "Every registered adapter has a non-empty allowed_tools list"
        - "permission_flags is a list of strings (not embedded in a shell command string)"
        - "allowed_tools is a list of strings (each tool name without quotes or --allowedTools wrapper)"
    metadata:
      author: "atdd:planner"
      created: "2026-05-21"
  - identity:
      urn: "acc:spawn-agents:E013-UNIT-002-claude-adapters-declare-accept-edits-flag"
      id: "AC-UNIT-002"
      purpose: "claude-code, claude-glm, and claude-gpt adapter entries declare --permission-mode acceptEdits in their permission_flags; this is the canonical alternative to --dangerously-skip-permissions"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "ADAPTER_REGISTRY is imported from spawn.py"
    when:
      abstract: "permission_flags for claude-code, claude-glm, and claude-gpt are read"
    then:
      abstract:
        - "'--permission-mode' and 'acceptEdits' both appear in the joined permission_flags string for each claude adapter"
        - "No adapter declares '--dangerously-skip-permissions' in permission_flags"
        - "No adapter declares '--permission-mode ask' in permission_flags"
    metadata:
      author: "atdd:planner"
      created: "2026-05-21"
  - identity:
      urn: "acc:spawn-agents:E013-UNIT-003-validator-fails-on-missing-permission-fields"
      id: "AC-UNIT-003"
      purpose: "atdd validate coach fails with a clear error message when an ADAPTER_REGISTRY entry is missing permission_flags or allowed_tools; the error names the offending adapter key and the missing field"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A patched ADAPTER_REGISTRY that omits permission_flags from the codex entry"
        - "The Layer-B spawn validator (test_spawn_non_interactive_validator.py)"
    when:
      abstract: "The validator runs against the patched registry"
    then:
      abstract:
        - "The validator raises or returns a failure containing the string 'codex'"
        - "The failure message references 'permission_flags' or 'allowed_tools'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-21"
  - identity:
      urn: "acc:spawn-agents:E013-SMOKE-001-live-adapter-registry-passes-layer-b-validator"
      id: "AC-SMOKE-001"
      purpose: "The live ADAPTER_REGISTRY imported from spawn.py passes check_adapter_registry_fields with zero violations; every registered adapter has non-empty permission_flags and allowed_tools"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "ADAPTER_REGISTRY imported from the deployed spawn.py"
        - "check_adapter_registry_fields from test_spawn_non_interactive_validator"
    when:
      abstract: "check_adapter_registry_fields(ADAPTER_REGISTRY) is called"
    then:
      abstract:
        - "Zero violations are returned"
    metadata:
      author: "atdd:planner"
      created: "2026-05-22"
