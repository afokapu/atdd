urn: "wmbt:spawn-agents:E032"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "destructive-or-unscoped-bash-entry-admitted-into-the-declared-freedom-set-allowlist"
context_clarifier: "The E013/#829 validator asserts 'Bash absent' from allowed_tools. This issue admits a curated scoped-Bash allow-list, so the safety invariant must flip from absence to shape: the declared freedom_layer.allowed_bash MUST contain NO command listed in freedom_layer.forbidden_bash (and none of the destructive/outward family — git push/commit/add/rm/checkout/restore/reset/stash, rm/mv/cp, atdd emergency/agent done/issue/pr/branch, all gh, pip/pipx/sudo, bare python -c), AND every Bash entry MUST be tightly scoped as Bash(<cmd>:*) — never bare 'Bash', 'Bash(*)', or 'Bash(:*)'. This is load-bearing because Claude Code matches Bash allow-patterns by command PREFIX and splits compound commands, so a loose or destructive prefix is injection-prone (a pre-authorized prefix can be chained, e.g. 'pytest && rm -rf'). Because the flipped validator inspects convention DATA rather than Python code, the check is language-agnostic and portable to non-Python stacks (#1035) — the RULE stays constant across stacks while the per-language data varies."
lens: "functional.sustainability"
statement: "minimize likelihood of destructive-or-unscoped-bash-entry-admitted-into-the-declared-freedom-set-allowlist when the freedom-set validator asserts that freedom_layer.allowed_bash contains no command present in freedom_layer.forbidden_bash and that every Bash entry is tightly scoped (Bash(cmd:*), never bare Bash or Bash(*)), operating on convention data so the guarantee is language-agnostic"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E032-UNIT-001-validator-rejects-forbidden-command-in-allowlist"
      id: "AC-UNIT-001"
      purpose: "The flipped freedom-set validator fails when allowed_bash contains a command that also appears in forbidden_bash (or in the destructive/outward family), naming the offending entry."
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A freedom_layer mapping whose allowed_bash includes a destructive entry, e.g. 'Bash(git push:*)' while forbidden_bash lists 'git push'"
        - "The freedom-set allow-list validator (flipped E013 check)"
    when:
      abstract: "The validator runs against the tampered freedom_layer"
    then:
      abstract:
        - "The validator returns at least one violation"
        - "The violation message names the offending entry (contains 'git push')"
        - "The clean declared list (no forbidden command in allowed_bash) yields zero violations"
    metadata:
      author: "atdd:planner"
      created: "2026-06-11"
  - identity:
      urn: "acc:spawn-agents:E032-UNIT-002-validator-rejects-unscoped-bash-entry"
      id: "AC-UNIT-002"
      purpose: "The validator fails when a Bash allow-list entry is not tightly scoped — bare 'Bash', 'Bash(*)', or 'Bash(:*)' are rejected; only Bash(<cmd>:*) form is accepted."
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "freedom_layer.allowed_bash variants containing 'Bash', 'Bash(*)' and 'Bash(:*)' respectively"
        - "The freedom-set allow-list validator"
    when:
      abstract: "The validator runs against each unscoped variant"
    then:
      abstract:
        - "Each of 'Bash', 'Bash(*)' and 'Bash(:*)' produces a violation referencing unscoped/over-broad Bash"
        - "A well-formed entry 'Bash(pytest:*)' produces no violation"
    metadata:
      author: "atdd:planner"
      created: "2026-06-11"
  - identity:
      urn: "acc:spawn-agents:E032-UNIT-003-validator-is-language-agnostic-data-only"
      id: "AC-UNIT-003"
      purpose: "The validator operates purely on convention freedom_layer data — it performs no Python-specific code/AST inspection — so the same check holds for a non-Python stack's allow-list (e.g. 'Bash(go test:*)')."
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A freedom_layer mapping whose allowed_bash uses a non-Python stack command, e.g. 'Bash(go test:*)' and 'Bash(npm test:*)', with the standard forbidden_bash list"
    when:
      abstract: "The validator runs against the non-Python freedom_layer"
    then:
      abstract:
        - "The validator returns zero violations (scoped, no forbidden command) without importing or parsing any Python source module"
        - "Injecting a forbidden command (e.g. 'Bash(rm:*)') into that same non-Python list produces a violation"
    metadata:
      author: "atdd:planner"
      created: "2026-06-11"
  - identity:
      urn: "acc:spawn-agents:E032-SMOKE-001-live-freedom-layer-passes-flipped-validator"
      id: "AC-SMOKE-001"
      purpose: "The deployed session.convention.yaml::spawn_time.freedom_layer passes the flipped freedom-set validator with zero violations: no forbidden command in allowed_bash, every Bash entry tightly scoped."
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "The deployed session.convention.yaml loaded from the installed codebase"
        - "The flipped freedom-set allow-list validator"
    when:
      abstract: "The validator runs against the live freedom_layer"
    then:
      abstract:
        - "Zero violations are returned"
        - "Every entry in the live allowed_bash matches the Bash(<cmd>:*) scoped form"
    metadata:
      author: "atdd:planner"
      created: "2026-06-11"
