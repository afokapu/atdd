urn: "wmbt:spawn-agents:E015"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "planner-agent-commits-planned-without-verifying-smoke-acceptance-coverage"
context_clarifier: >
  The rule planner.wmbt.must-have-smoke-acceptance (sev 3, suppress-and-clean, introduced v3.50.0)
  is correctly defined in src/atdd/planner/conventions/wmbt.convention.yaml and fires at CI via
  atdd validate planner. But it consistently fires at CI time, not at agent-planning time. The
  post-commit hook (introduced by #642) runs atdd validate planner --local --skip-api after every
  commit touching plan/, but it always exits 0 (advisory) and its output is buried in a background
  subprocess's stderr — agents do not react. Neither SESSION-LAUNCH-TEMPLATE.md nor ATDD.md names
  planner.wmbt.must-have-smoke-acceptance or instructs the planner to run the validator BEFORE
  committing PLANNED; the agent therefore commits without checking. Observed across every dispatched
  issue in the 2026-05-21 to 2026-05-24 session: #831 (Y004), #830 (E007), #841 (E004), #845
  (E022/E023/E024), #846 (E025) — each required at least one operator intervention cycle after CI
  flagged the missing SMOKE acceptance.
lens: "functional.effectiveness"
statement: >
  minimize likelihood of planner-agent-commits-planned-without-verifying-smoke-acceptance-coverage
  by (1) adding an explicit pre-commit gate section to SESSION-LAUNCH-TEMPLATE.md that names the
  rule planner.wmbt.must-have-smoke-acceptance and the command atdd validate planner --local
  --skip-api with zero-violation required before committing PLANNED; (2) adding a pre_commit_gate
  key to the INIT phase in ATDD.md that names the rule, the command, and the timing constraint
  (BEFORE committing, not after); and (3) updating the audits.workflow.after_planner annotation to
  clarify this must run before the PLANNED commit, not just before the RED phase transition
acceptances:
  - identity:
      urn: "acc:spawn-agents:E015-UNIT-001-session-launch-template-names-must-have-smoke-acceptance-rule"
      id: "AC-UNIT-001"
      purpose: "SESSION-LAUNCH-TEMPLATE.md contains the string 'planner.wmbt.must-have-smoke-acceptance' and the command 'atdd validate planner --local --skip-api' in a pre-commit gate section before the RED step"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/templates/SESSION-LAUNCH-TEMPLATE.md is read from the filesystem"
    when:
      abstract: "The file content is inspected for the rule ID and the validator command"
    then:
      abstract:
        - "The string 'planner.wmbt.must-have-smoke-acceptance' appears in the file"
        - "The string 'atdd validate planner --local --skip-api' appears in the file"
        - "The string 'SMOKE' appears in proximity to a 'before committing PLANNED' context"
    metadata:
      author: "atdd:planner"
      created: "2026-05-24"

  # AC-UNIT-002 (acc:spawn-agents:E015-UNIT-002-atdd-md-init-phase-instructs-pre-commit-validate-planner)
  # removed in #925 — the assertion that the INIT phase carries a pre_commit_gate
  # invoking `atdd validate planner` is now anchored to the canonical convention,
  # not the template (see test_phase_machine_init_pre_commit_gate.py). The
  # 'before committing' timing semantic is encoded by the field name
  # (pre_commit_gate) — no separate prose assertion needed.
  - identity:
      urn: "acc:spawn-agents:E015-SMOKE-001-deployed-templates-contain-smoke-acceptance-checklist"
      id: "AC-SMOKE-001"
      purpose: "SMOKE: the installed atdd package templates (SESSION-LAUNCH-TEMPLATE.md and ATDD.md) both contain the planner.wmbt.must-have-smoke-acceptance rule ID, confirming the checklist shipped in the installed distribution"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The atdd package is installed in the current Python environment"
        - "import atdd.coach.templates succeeds"
    when:
      abstract: "The package templates directory is located via the installed module's __file__ attribute and both template files are read"
    then:
      abstract:
        - "SESSION-LAUNCH-TEMPLATE.md read from the installed package contains 'planner.wmbt.must-have-smoke-acceptance'"
        - "ATDD.md read from the installed package contains 'planner.wmbt.must-have-smoke-acceptance'"
        - "Both files contain 'atdd validate planner --local --skip-api'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-24"
