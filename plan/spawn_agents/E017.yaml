urn: "wmbt:spawn-agents:E017"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "coach-spawn-shim-command-resolves-to-wrong-atdd-installation-on-multi-install-hosts"
context_clarifier: "_build_shim_command emits a bare 'atdd-shim' token as the executable in the worker shell's launch command. On hosts with multiple atdd installations (e.g. homebrew at /opt/homebrew/bin/atdd-shim at v3.81.1 AND pipx at /Users/alecfokapu/.local/bin/atdd-shim at v3.82.4), the worker surface's $PATH resolves the bare token to whichever installation appears first — typically the homebrew installation. The coach process itself runs from the pipx installation (3.82.4) but does not propagate its own atdd-shim absolute path to its spawned command. This caused the Popen env-prefix fix in #854 (present in pipx 3.82.4) to be invisible in practice: the spawned command invoked the older homebrew shim (3.81.1) which still had the bug. Reproduced 2026-05-25 on the live host with ATDD_CORRECTION_TRANSPORT=cli-return."
lens: "functional.effectiveness"
statement: "minimize likelihood of coach-spawn-shim-command-resolves-to-wrong-atdd-installation-on-multi-install-hosts by replacing the bare 'atdd-shim' token in _build_shim_command with a module-invocation form '[sys.executable, \"-m\", \"atdd.coach.shim\", ...]' — routing the shim through the SAME Python interpreter that is running coach, eliminating PATH resolution entirely"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E017-UNIT-001-build-shim-command-uses-module-invocation"
      id: "AC-UNIT-001"
      purpose: "_build_shim_command returns a list whose first element is sys.executable and second element is '-m', not a bare 'atdd-shim' string — eliminating PATH resolution"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/spawn.py _build_shim_command is callable"
        - "A known sys.executable path (patched if necessary)"
    when:
      abstract: "_build_shim_command(adapter_command, agent_id, runtime_root, env_overrides) is called"
    then:
      abstract:
        - "The returned command list starts with sys.executable followed by '-m'"
        - "The returned command list does NOT contain the bare string 'atdd-shim' as an element"
        - "The returned command list contains 'atdd.coach.shim' as the module specifier"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
  - identity:
      urn: "acc:spawn-agents:E017-UNIT-002-no-bare-atdd-shim-token-in-command"
      id: "AC-UNIT-002"
      purpose: "On a host where 'which atdd-shim' would resolve to a different version than sys.executable's installation, _build_shim_command still uses sys.executable's atdd.coach.shim module"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "sys.executable is patched to '/usr/local/pipx/venvs/atdd/bin/python3'"
        - "os.environ PATH is patched to put /opt/homebrew/bin first"
    when:
      abstract: "_build_shim_command is called with any adapter_command"
    then:
      abstract:
        - "The returned command list's first element equals the patched sys.executable"
        - "shlex.join of the command contains '/usr/local/pipx/venvs/atdd/bin/python3'"
        - "The string 'atdd-shim' does not appear anywhere in shlex.join of the returned command"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
  - identity:
      urn: "acc:spawn-agents:E017-UNIT-003-module-invocation-passes-all-existing-args"
      id: "AC-UNIT-003"
      purpose: "The module-invocation form preserves all existing _build_shim_command arguments: --agent-id, --runtime-dir, --env flags (from E016), and the adapter command after '--'"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "agent_id = 'planner-857-abc'"
        - "runtime_root = '/tmp/rt'"
        - "env_overrides = {'ATDD_AGENT_ID': 'planner-857-abc'}"
        - "adapter_command = 'claude --permission-mode auto'"
    when:
      abstract: "_build_shim_command(adapter_command, agent_id, runtime_root, env_overrides) is called"
    then:
      abstract:
        - "The returned list contains '--agent-id' followed by 'planner-857-abc'"
        - "The returned list contains '--runtime-dir' followed by '/tmp/rt'"
        - "The returned list contains '--env' followed by 'ATDD_AGENT_ID=planner-857-abc'"
        - "The token 'claude' appears in the returned list after '--'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
  - identity:
      urn: "acc:spawn-agents:E017-SMOKE-001-shim-invoked-via-same-python-as-coach"
      id: "AC-SMOKE-001"
      purpose: "When atdd spawn is invoked, the spawned shim process is started via the same Python interpreter as the coach process, verified by comparing the first element of the spawned command against sys.executable"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "atdd is installed via pipx"
        - "A fixture issue with a minimal adapter command that exits 0 immediately"
        - "ATDD_RUN_SMOKE=1 is set"
    when:
      abstract: "atdd spawn is called against the fixture; the shim command is captured (via monkeypatching subprocess.Popen before the real invocation in a smoke integration test)"
    then:
      abstract:
        - "The first element of args[0] (or the Popen command list) equals sys.executable"
        - "No element equals the bare string 'atdd-shim'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
