urn: "wmbt:spawn-agents:E031"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "spawned-worker-bash-allowlist-hardcoded-in-adapter-code-instead-of-sourced-from-the-session-convention-freedom-layer-data"
context_clarifier: "Today the freedom set is split awkwardly: session.convention.yaml::spawn_time.freedom_layer DOCUMENTS the rule (Bash MUST NOT be in allowed_tools — E013/D002, issue #829, later reinforced by #971/#967 so Bash surfaces to the Feed) while the actual allow-list lives in code — ADAPTER_REGISTRY.allowed_tools (_CLAUDE_ALLOWED_TOOLS) in src/atdd/coach/commands/spawn.py and the Sequence passed to build_agent_seed_argv in src/atdd/runtime/agent_control/cmux_launch.py. Because the data is hardcoded, the curated scoped-Bash allow-list this issue introduces (Bash(pytest:*), Bash(atdd validate:*), Bash(grep:*), …) cannot be declared once and read by both launch planes; and the list is inherently stack-specific (pytest=Python, jest=JS, go test=Go — relates to #1035) so it belongs in convention data, not a Python literal. This issue makes session.convention.yaml::spawn_time.freedom_layer the SOURCE OF TRUTH (allowed_tools / allowed_bash / forbidden_bash declared as data) and has spawn.py + cmux_launch.py READ the scoped allow-list from it, emitting --allowedTools (auto-allow tools ∪ scoped Bash entries) from the convention rather than from a hardcoded literal."
lens: "functional.effectiveness"
statement: "minimize likelihood of spawned-worker-bash-allowlist-hardcoded-in-adapter-code-instead-of-sourced-from-the-session-convention-freedom-layer-data when session.convention.yaml::spawn_time.freedom_layer declares allowed_tools, allowed_bash and forbidden_bash as data and both worker launch planes (coach/commands/spawn.py and runtime/agent_control/cmux_launch.py) read the scoped allow-list from the convention and emit --allowedTools from it, so the curated safe-Bash freedom set is config-driven and stack-portable rather than a code literal"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E031-UNIT-001-convention-declares-freedom-layer-data"
      id: "AC-UNIT-001"
      purpose: "session.convention.yaml::spawn_time.freedom_layer declares three data lists — allowed_tools, allowed_bash, forbidden_bash — so the freedom set is convention data, not prose. Loading the convention exposes all three as non-empty lists of strings."
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/conventions/session.convention.yaml is loaded as a mapping"
        - "spawn_time.freedom_layer is read"
    when:
      abstract: "freedom_layer.allowed_tools, freedom_layer.allowed_bash and freedom_layer.forbidden_bash are accessed"
    then:
      abstract:
        - "allowed_tools is a non-empty list of strings and includes Read, Edit, Write, TodoWrite, Glob, Grep, WebFetch"
        - "allowed_bash is a non-empty list of strings and includes 'Bash(pytest:*)' and 'Bash(atdd validate:*)'"
        - "forbidden_bash is a non-empty list of strings and includes 'git push', 'git commit', 'rm', 'gh' and 'sudo'"
    metadata:
      author: "atdd:planner"
      created: "2026-06-11"
  - identity:
      urn: "acc:spawn-agents:E031-UNIT-002-spawn-emits-convention-sourced-scoped-allowlist"
      id: "AC-UNIT-002"
      purpose: "The claude-family adapter in spawn.py emits --allowedTools sourced from the convention freedom_layer (allowed_tools ∪ allowed_bash), not from a hardcoded literal; the emitted allow-list contains the scoped Bash entries."
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/spawn.py with the claude-code adapter building its launch command"
        - "session.convention.yaml::spawn_time.freedom_layer is the source of the allow-list"
    when:
      abstract: "The claude-code adapter command string is built and the --allowedTools value is parsed"
    then:
      abstract:
        - "The --allowedTools value contains every entry in freedom_layer.allowed_tools and every entry in freedom_layer.allowed_bash"
        - "'Bash(pytest:*)' appears in the emitted --allowedTools value"
        - "No entry in freedom_layer.forbidden_bash (e.g. 'git push', 'rm') appears anywhere in the emitted --allowedTools value"
        - "The allow-list is read from the convention loader, not from a module-level hardcoded list literal"
    metadata:
      author: "atdd:planner"
      created: "2026-06-11"
  - identity:
      urn: "acc:spawn-agents:E031-UNIT-003-cmux-launch-argv-carries-scoped-bash-allowlist"
      id: "AC-UNIT-003"
      purpose: "The cmux-native launch plane (runtime/agent_control/cmux_launch.py::build_agent_seed_argv) receives the convention-sourced scoped allow-list and the resulting argv carries the scoped Bash entries after --allowedTools."
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The convention-sourced freedom-set allow-list (allowed_tools ∪ allowed_bash) is resolved"
        - "build_agent_seed_argv is called with that allow-list as allowed_tools"
    when:
      abstract: "The returned argv is inspected for the --allowedTools flag and its space-joined value"
    then:
      abstract:
        - "'--allowedTools' is present in argv and its value contains 'Bash(pytest:*)' and 'Bash(atdd validate:*)'"
        - "The positional prompt still precedes --allowedTools (the load-bearing ordering rule is preserved)"
        - "No forbidden_bash command appears in the --allowedTools value"
    metadata:
      author: "atdd:planner"
      created: "2026-06-11"
  - identity:
      urn: "acc:spawn-agents:E031-SMOKE-001-live-spawn-argv-config-driven-scoped-bash"
      id: "AC-SMOKE-001"
      purpose: "Built from the deployed session.convention.yaml, a real worker launch command/argv carries the scoped Bash freedom set and none of the forbidden commands — proving the convention is the live source of truth end-to-end."
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "The deployed session.convention.yaml and spawn.py / cmux_launch.py importable from the installed codebase"
    when:
      abstract: "A claude-family worker launch command/argv is built through the real code path"
    then:
      abstract:
        - "The emitted --allowedTools value contains 'Bash(pytest:*)' and 'Bash(atdd validate:*)' sourced from the live convention"
        - "None of the live freedom_layer.forbidden_bash commands appear in the emitted --allowedTools value"
    metadata:
      author: "atdd:planner"
      created: "2026-06-11"
