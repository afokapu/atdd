urn: "wmbt:spawn-agents:E010"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
# #1486: E010-SMOKE-001 'readiness-gate-with-real-multiplexer' exercised the readiness gate
# inside `commands/spawn.py`, decommissioned with the coach's sub-worker orchestration.
# The surviving unit behaviour is still bound to a live test.
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "coach-spawned-workers-that-never-process-their-launch-prompt-due-to-a-missing-readiness-gate"
context_clarifier: "when the coach creates a multiplexer surface it immediately fires 'cd <cwd> && claude ...\n' via cmux send, then paste_text + send_key(Enter) — all without waiting for Claude Code's TUI to become interactive; on a freshly-created worktree the workspace-trust modal fires (absorbing every key sent before the modal is dismissed); PR #796 shipped _assert_worker_processing() as the post-paste guard but it silently no-ops in production because no multiplexer backend implements capture_surface_text (the hasattr guard at spawn.py L247 always short-circuits); the only viable backend-agnostic signal is jsonl file size growth — the same session .jsonl that _wait_for_claude_ready already confirmed exists; fix (#797): rewrite _assert_worker_processing to poll the session jsonl byte size (sample at t=0, return when size grows by ≥1), removing the capture_surface_text dependency entirely — fix: (1) pre-trust the worktree in ~/.claude.json before _create_surface, (2) poll _wait_for_claude_ready() before paste confirming a live session .jsonl, (3) after paste + Enter poll _assert_worker_processing() until the session .jsonl byte size grows (proves Claude appended ≥1 new message), (4) gate decisions.jsonl 'transitioned:true' on that assertion passing"
lens: "functional.effectiveness"
statement: "minimize likelihood of coach-spawned-workers-that-never-process-their-launch-prompt-due-to-a-missing-readiness-gate when the coach creates a surface and pastes the launch prompt — by pre-trusting the worktree in ~/.claude.json, polling _wait_for_claude_ready() before paste to confirm a live session .jsonl, asserting _assert_worker_processing() after paste by polling the session jsonl byte size until it grows (≥1 byte added proves Claude accepted the prompt), and emitting 'transitioned:true' in decisions.jsonl only after that assertion passes, with loud escalation on timeout"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E010-UNIT-005-decision-log-gated-on-assertion"
      id: "AC-UNIT-005"
      purpose: "decisions.jsonl emits 'transitioned:true' only if _assert_worker_processing passed; on assertion failure (jsonl byte size never grows within timeout) the handler returns HandlerResult.ERROR and no phantom transitioned:true is recorded"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The coach phase-transition path (src/atdd/coach/commands/spawn.py) is exercised with a project dir whose session jsonl file exists but is static (no new bytes appended — worker never processes the launch prompt)"
        - "ATDD_CLAUDE_PROJECTS_DIR points to a tmp_path containing the static project/session.jsonl"
        - "ATDD_WORKER_READY_TIMEOUT is set to 0.05 so the timeout fires quickly"
        - "WorkerReadinessTimeout is raised by _assert_worker_processing after its bounded wait"
    when:
      abstract: "The coach attempts the INIT→PLANNED transition"
    then:
      abstract:
        - "The decisions.jsonl entry for this transition does NOT have 'transitioned': true"
        - "The handler returns HandlerResult.ERROR rather than HandlerResult.HANDLED"
    metadata:
      author: "atdd:planner"
      created: "2026-05-20"
      updated: "2026-05-20"
