urn: "wmbt:spawn-agents:E011"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "coach-spawn-pipeline-stages-that-silently-fail-without-raising-a-stage-specific-exception"
context_clarifier: "cmd_spawn currently pipelines the worker-launch flow with optimistic step transitions: (1) /rename injection in apply_canonical_name_and_layout (session_naming_apply.py L80-94) is fire-and-forget with only backend errors caught, never confirming Claude accepted the rename; (2) paste_text of launch prompt is best-effort — on failure a warning prints and flow continues with no follow-up capture to verify the prompt landed; (3) send_key(Enter) to submit has no verification that submission happened — operators have observed 'swallowed Enter' where the input box retained the queued prompt indefinitely; (4) _assert_worker_processing (L221) silently skips when the backend lacks capture_surface_text, which is the production cmux backend. The result: a successful agent_spawned event can fire while the worker is in fact idle/queued/broken. Fix: introduce _verify_stage(stage_name, surface_ref, backend, expect_any, timeout_s) that polls backend.capture_pane_text for an explicit success signal within a bounded timeout; on timeout raises a stage-specific exception (RenameNotAccepted, PasteDidNotLand, PromptNotSubmitted) so callers can log exactly which stage failed; add MultiplexerBackend.capture_pane_text method; remove the silent-skip escape hatch in _assert_worker_processing; add verify_after_send param to apply_canonical_name_and_layout"
lens: "functional.effectiveness"
statement: "minimize likelihood of coach-spawn-pipeline-stages-that-silently-fail-without-raising-a-stage-specific-exception when cmd_spawn fires /rename, paste_text, and send_key(Enter) — by introducing _verify_stage() that polls capture_pane_text for an explicit success signal per stage, raises RenameNotAccepted/PasteDidNotLand/PromptNotSubmitted on timeout, and removing the silent-skip in _assert_worker_processing so all capture-capable backends raise on timeout"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E011-UNIT-001-verify-stage-raises-rename-not-accepted"
      id: "AC-UNIT-001"
      purpose: "_verify_stage raises RenameNotAccepted when capture_pane_text never returns the canonical name within the timeout; passes when the canonical name appears"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/spawn.py exposes _verify_stage(stage_name, surface_ref, backend, expect_any, timeout_s, poll_interval_s)"
        - "A fake backend whose capture_pane_text always returns 'Press Enter to send' (rename never reflected)"
    when:
      abstract: "_verify_stage is called with stage_name='rename-accepted', expect_any=('ATDD42',), timeout_s=0.1"
    then:
      abstract:
        - "RenameNotAccepted is raised"
        - "RenameNotAccepted is a subclass of WorkerReadinessTimeout"
        - "When capture_pane_text returns a string containing 'ATDD42', _verify_stage returns without raising"
    metadata:
      author: "atdd:tester"
      created: "2026-05-20"
  - identity:
      urn: "acc:spawn-agents:E011-UNIT-002-verify-stage-raises-paste-did-not-land"
      id: "AC-UNIT-002"
      purpose: "_verify_stage raises PasteDidNotLand when capture_pane_text never shows the paste indicator or prompt prefix within the timeout; passes when paste indicator appears"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/spawn.py exposes _verify_stage and PasteDidNotLand"
        - "A fake backend whose capture_pane_text always returns 'Press Enter to send'"
    when:
      abstract: "_verify_stage is called with stage_name='paste-landed', expect_any=('paste again to expand', 'You are the planner'), timeout_s=0.1"
    then:
      abstract:
        - "PasteDidNotLand is raised"
        - "PasteDidNotLand is a subclass of WorkerReadinessTimeout"
        - "When capture_pane_text returns 'paste again to expand · 1 line', _verify_stage returns without raising"
        - "When capture_pane_text returns a string starting with the prompt prefix, _verify_stage returns without raising"
    metadata:
      author: "atdd:tester"
      created: "2026-05-20"
  - identity:
      urn: "acc:spawn-agents:E011-UNIT-003-verify-stage-raises-prompt-not-submitted"
      id: "AC-UNIT-003"
      purpose: "_verify_stage raises PromptNotSubmitted when no thinking/tool-use marker appears in capture_pane_text within the timeout; passes when thinking marker appears"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/spawn.py exposes _verify_stage and PromptNotSubmitted"
        - "A fake backend whose capture_pane_text shows the prompt text in the input box but no thinking marker (swallowed-Enter simulation)"
    when:
      abstract: "_verify_stage is called with stage_name='prompt-submitted', expect_any=('⏺ Thinking', '⏺ Reading', '⏺ Bash', '⏺ Running', '⏺ Writing', '✶', '✻', '✳'), timeout_s=0.1"
    then:
      abstract:
        - "PromptNotSubmitted is raised"
        - "PromptNotSubmitted is a subclass of WorkerReadinessTimeout"
        - "When capture_pane_text returns '⏺ Thinking... · ATDD42', _verify_stage returns without raising"
        - "When capture_pane_text returns '⏺ Bash(gh issue view 799)', _verify_stage returns without raising"
    metadata:
      author: "atdd:tester"
      created: "2026-05-20"
  - identity:
      urn: "acc:spawn-agents:E011-UNIT-004-capture-pane-text-on-multiplexer-backend"
      id: "AC-UNIT-004"
      purpose: "MultiplexerBackend declares capture_pane_text and FakeMultiplexer implements it with scriptable responses via _pane_captures"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/utils/multiplexer.py MultiplexerBackend base class"
        - "FakeMultiplexer test double from the same module"
    when:
      abstract: "MultiplexerBackend.capture_pane_text is inspected and FakeMultiplexer.capture_pane_text is called"
    then:
      abstract:
        - "MultiplexerBackend has a callable attribute 'capture_pane_text'"
        - "FakeMultiplexer().capture_pane_text('surface:1') returns a string (not raises)"
        - "When mux._pane_captures = ['⏺ Thinking...'], mux.capture_pane_text('surface:1') returns '⏺ Thinking...'"
    metadata:
      author: "atdd:tester"
      created: "2026-05-20"
  - identity:
      urn: "acc:spawn-agents:E011-UNIT-005-apply-canonical-name-verify-after-send"
      id: "AC-UNIT-005"
      purpose: "apply_canonical_name_and_layout raises RenameNotAccepted with verify_after_send=True when the canonical name never appears in capture_pane_text; does not probe without verify_after_send"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/utils/session_naming_apply.py apply_canonical_name_and_layout accepts verify_after_send: bool = False"
        - "A backend whose capture_pane_text always returns 'Press Enter to send' (rename not reflected)"
    when:
      abstract: "apply_canonical_name_and_layout is called with verify_after_send=True, verify_timeout_s=0.1"
    then:
      abstract:
        - "RenameNotAccepted is raised"
        - "When called with verify_after_send=False (the default), no capture probe occurs and no exception is raised even when the fake mux never reflects the name"
        - "When backend.capture_pane_text returns a string containing the canonical name, no exception is raised"
    metadata:
      author: "atdd:tester"
      created: "2026-05-20"
  - identity:
      urn: "acc:spawn-agents:E011-UNIT-006-assert-worker-processing-hard-raises"
      id: "AC-UNIT-006"
      purpose: "_assert_worker_processing raises WorkerReadinessTimeout (not silently skips) when the backend implements capture_pane_text but the pane never shows a processing indicator"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/spawn.py _assert_worker_processing with E011 changes"
        - "A backend implementing capture_pane_text that always returns 'Press up to edit queued messages'"
    when:
      abstract: "_assert_worker_processing is called with timeout_s=0.1, poll_interval_s=0.01"
    then:
      abstract:
        - "WorkerReadinessTimeout is raised (NOT silently returned)"
        - "When capture_pane_text returns 'Press Enter to send' (another idle marker), WorkerReadinessTimeout is still raised"
    metadata:
      author: "atdd:tester"
      created: "2026-05-20"
  - identity:
      urn: "acc:spawn-agents:E011-UNIT-007-verify-stage-retries-once-before-raise"
      id: "AC-UNIT-007"
      purpose: "_verify_stage exception message includes the stage name and surface ref; succeeds when the expected signal appears on the second capture poll"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/spawn.py exposes _verify_stage and WorkerReadinessTimeout"
        - "A fake backend that returns an idle string on first call and the expected signal on the second call"
    when:
      abstract: "_verify_stage is called with a stage_name and a backend that times out; separately with a backend that succeeds on second poll"
    then:
      abstract:
        - "On timeout: the exception message contains the stage_name string"
        - "On timeout: the exception message contains the surface_ref string"
        - "When the signal appears on the second poll, _verify_stage returns without raising and at least 2 capture calls were made"
    metadata:
      author: "atdd:tester"
      created: "2026-05-20"
  - identity:
      urn: "acc:spawn-agents:E011-INTEGRATION-001-full-spawn-path-verify-each-stage"
      id: "AC-INTEGRATION-001"
      purpose: "The full cmd_spawn path exercises all four verify stages (claude-up, rename-accepted, paste-landed, prompt-submitted) in sequence with a FakeMultiplexer scripted for correct progression; no agent_spawned when paste-landed fails"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A FakeMultiplexer whose capture_pane_text cycles through staged responses: calls 1-2 return Anthropic/accept-edits, 3-4 return canonical name, 5-6 return paste indicator, 7+ return thinking marker"
        - "A tmp claude_projects_dir with a pre-created session .jsonl file"
        - "A tmp claude_json_path (real ~/.claude.json never touched)"
        - "A dummy launch prompt file exists on disk"
    when:
      abstract: "cmd_spawn is invoked end-to-end with the staged FakeMultiplexer; separately with a PasteFailsMux that always returns an idle string"
    then:
      abstract:
        - "Happy-path: paste_calls and send_key_calls are populated; agent_spawned event exists in runtime/agents/"
        - "Paste-fail path: an exception is raised and no agent_spawned event exists in runtime/agents/"
    metadata:
      author: "atdd:tester"
      created: "2026-05-20"
