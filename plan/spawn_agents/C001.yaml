urn: "wmbt:spawn-agents:C001"
step: "confirm"
direction: "minimize"
dimension: "likelihood"
object_of_control: "orchestrate-coach-spawn-divergence-shipping-undetected"
context_clarifier: "when the orchestrate-absorbing issues (J4 two-phase commit, K1 spawn skeleton, K3 canonical naming) make a behavior-parity claim that today is a review-time judgment call — without a CI-enforced fixture suite the wave-w3 atdd orchestrate decommission (#P5) cannot land safely; the suite at tests/integration/test_orchestrate_coach_parity.py runs each fixture against today's atdd orchestrate <args> and the equivalent atdd coach <args>, asserting equivalence on worktree creation order/paths/branches, multiplexer dispatch (backend/mode/surfaces created), canonical naming, .launch_prompt.txt contents (byte-equivalent modulo timestamps), and the semantic mapping between orchestrate-state.json (orchestrate) and decisions.jsonl (coach) — with at least five fixture scenarios (single issue, multi-issue with deps, resume, worktree creation failure with rollback, multiplexer-mode pane), the suite running in <60s on a developer machine, and CI failure of this suite blocking #P5"
lens: "functional.effectiveness"
statement: "minimize likelihood of orchestrate-coach-spawn-divergence-shipping-undetected when the orchestrate-absorbing issues make a behavior-parity claim that today is a review-time judgment call and the wave-w3 atdd orchestrate decommission cannot land without CI-enforced equivalence on worktrees, multiplexer dispatch, canonical naming, launch prompts, and resume-state semantics"
acceptances:
  - identity:
      urn: "acc:spawn-agents:C001-INTEGRATION-001-fixture-coverage-five-scenarios"
      id: "AC-INTEGRATION-001"
      purpose: "tests/integration/test_orchestrate_coach_parity.py defines at least five fixture scenarios covering the spectrum that motivated atdd orchestrate's two-phase commit"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "tests/integration/test_orchestrate_coach_parity.py exists in the repository"
        - "A multiplexer mock backend and a fake gh CLI returning fixed issue bodies are wired in via conftest"
    when:
      abstract: "pytest collects the module"
    then:
      abstract:
        - "Each of the five scenarios is collected as a distinct test: single issue, multi-issue with dependencies, resume case, worktree creation failure with rollback, multiplexer-mode pane"
        - "Each fixture defines an atdd orchestrate <args> invocation and the expected atdd coach <equivalent args> invocation against shared state"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:C001-INTEGRATION-002-equivalence-assertions-pass"
      id: "AC-INTEGRATION-002"
      purpose: "Each fixture asserts equivalence on worktree creation order/paths/branches, multiplexer backend/mode/surfaces, canonical naming, and .launch_prompt.txt byte-equivalence (modulo timestamps)"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The fixtures from AC-INTEGRATION-001 are runnable on CI"
    when:
      abstract: "pytest tests/integration/test_orchestrate_coach_parity.py runs end-to-end"
    then:
      abstract:
        - "Worktree creation equivalence asserts identical order, paths, and branches between the two invocations"
        - "Multiplexer dispatch equivalence asserts identical backend, mode, and surfaces created (per the mock backend's recorded calls)"
        - "Canonical naming equivalence asserts identical names applied to surfaces"
        - ".launch_prompt.txt byte-equivalence (modulo a documented timestamp normalisation pass) holds"
        - "All five fixtures pass on CI"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:C001-INTEGRATION-003-state-file-mapping-documented"
      id: "AC-INTEGRATION-003"
      purpose: "The semantic mapping between orchestrate-state.json (orchestrate) and decisions.jsonl (coach) is documented field-by-field at tests/integration/parity-fixtures/orchestrate-coach.md and is the reference for the suite's allowed differences"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "tests/integration/parity-fixtures/orchestrate-coach.md exists alongside the test module"
    when:
      abstract: "A linter test scans the document for required sections"
    then:
      abstract:
        - "Every field in today's orchestrate-state.json is mapped to its decisions.jsonl counterpart (or marked NOT-PRESENT-INTENTIONALLY with rationale)"
        - "Allowed-differences are explicitly enumerated: state file format (jsonl vs single-doc json), additional logging, and additional decision entries with no orchestrate equivalent (e.g. observer hookup events)"
        - "The document is the authoritative oracle for the equivalence assertions in AC-INTEGRATION-002"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:C001-INTEGRATION-004-runtime-budget-respected"
      id: "AC-INTEGRATION-004"
      purpose: "The full parity suite runs in under 60s on a developer machine so it can be a blocking CI check without slowing the merge pipeline"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The suite is collected per AC-INTEGRATION-001 and asserts equivalences per AC-INTEGRATION-002"
    when:
      abstract: "pytest tests/integration/test_orchestrate_coach_parity.py runs end-to-end on a representative developer machine"
    then:
      abstract:
        - "Total wall-clock duration is under 60 seconds"
        - "Failure of this suite on CI blocks the wave-w3 atdd orchestrate decommission issue (#P5) from landing per spec §11.3"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
