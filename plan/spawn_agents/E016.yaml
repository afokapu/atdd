urn: "wmbt:spawn-agents:E016"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "shell-style-env-prefix-injected-into-shim-argv-causing-popen-exec-failure"
context_clarifier: "when ATDD_CORRECTION_TRANSPORT=cli-return is set, _inject_agent_env returns 'ATDD_AGENT_ID=<id> <adapter_command>' — a shell-style KEY=value prefix — which _build_shim_command embeds verbatim after '--' in the atdd-shim argv: ['atdd-shim', '--agent-id', ..., '--runtime-dir', ..., '--', 'ATDD_AGENT_ID=<id>', 'claude', ...]. PersonaShim.run() calls subprocess.Popen(spawn_command) without shell=True, so the OS exec treats 'ATDD_AGENT_ID=<id>' as the executable path and raises FileNotFoundError: [Errno 2] No such file or directory: 'ATDD_AGENT_ID=planner-828-497dbd44'. Every cli-return-enabled coach dispatch on v3.82.3 fails here with 100% reproduction rate (#828 test-drive, 2026-05-24)."
lens: "functional.effectiveness"
statement: "minimize likelihood of shell-style-env-prefix-injected-into-shim-argv-causing-popen-exec-failure by changing _inject_agent_env to return a tuple (env_overrides: dict[str, str], command: str) instead of a shell-prefixed string, updating _build_shim_command to accept env_overrides and emit --env KEY=VALUE flags for atdd-shim, and in the non-cli-return path reconstructing the shell prefix from env_overrides so the multiplexer shell dispatch behavior is preserved"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E016-UNIT-001-inject-agent-env-returns-tuple"
      id: "AC-UNIT-001"
      purpose: "_inject_agent_env(command, agent_id) returns a 2-tuple (env_overrides, command) where env_overrides is {'ATDD_AGENT_ID': agent_id} when agent_id is truthy, and ({}, command) when agent_id is empty"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "An adapter command string (e.g. 'claude --permission-mode auto')"
        - "A non-empty agent_id string"
    when:
      abstract: "_inject_agent_env(command, agent_id) is called"
    then:
      abstract:
        - "Returns a 2-tuple (env_overrides, command)"
        - "env_overrides equals {'ATDD_AGENT_ID': agent_id}"
        - "command is unchanged from the input"
        - "When agent_id is empty string, env_overrides is {} and command is unchanged"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
  - identity:
      urn: "acc:spawn-agents:E016-UNIT-002-build-shim-command-emits-env-flags"
      id: "AC-UNIT-002"
      purpose: "_build_shim_command with env_overrides={'ATDD_AGENT_ID': 'x-001'} emits '--env ATDD_AGENT_ID=x-001' and does NOT place 'ATDD_AGENT_ID=x-001' as argv[0] after '--'"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "adapter_command = 'claude --permission-mode auto'"
        - "env_overrides = {'ATDD_AGENT_ID': 'planner-001-abc'}"
        - "agent_id and runtime_root set"
    when:
      abstract: "_build_shim_command(adapter_command, agent_id, runtime_root, env_overrides=env_overrides) is called"
    then:
      abstract:
        - "The returned command string contains '--env ATDD_AGENT_ID=planner-001-abc'"
        - "The token immediately after '--' in the returned command is 'claude', not 'ATDD_AGENT_ID=planner-001-abc'"
        - "Lexing the returned command with shlex.split produces argv where 'ATDD_AGENT_ID=...' does not appear between '--' and 'claude'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
  - identity:
      urn: "acc:spawn-agents:E016-UNIT-003-non-cli-return-shell-prefix-reconstructed"
      id: "AC-UNIT-003"
      purpose: "In the non-cli-return code path, cmd_spawn reconstructs the shell-style KEY=value prefix from env_overrides and prepends it to the adapter command, so the multiplexer shell dispatch behavior is unchanged"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "ATDD_CORRECTION_TRANSPORT is unset"
        - "cmd_spawn is called with a FakeMultiplexer and a non-empty agent_id"
    when:
      abstract: "cmd_spawn assembles the surface command"
    then:
      abstract:
        - "The command string passed to FakeMultiplexer.new_surface starts with 'ATDD_AGENT_ID=<agent_id>'"
        - "No '--env' flag appears in that command string"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
  - identity:
      urn: "acc:spawn-agents:E016-SMOKE-001-no-popen-exec-failure-with-cli-return-env"
      id: "AC-SMOKE-001"
      purpose: "The installed atdd-shim CLI, invoked with --env ATDD_AGENT_ID=test-001 -- python3 -c 'pass', exits 0 within 10 s and does not raise FileNotFoundError"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "atdd-shim is installed as a CLI entry point"
        - "A temporary runtime-dir is created"
    when:
      abstract: "atdd-shim --agent-id test-001 --runtime-dir <tmp> --env ATDD_AGENT_ID=test-001 -- python3 -c pass is run as a subprocess"
    then:
      abstract:
        - "The process exits with return code 0 (no FileNotFoundError)"
        - "No stderr line contains 'No such file or directory'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-25"
