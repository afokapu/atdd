wagon: spawn-agents
urn: "wagon:spawn-agents"
name: "Spawn Agents"
description: "Centralizes coach v9 persona launch under one rule-IDed entry point: atdd spawn skeleton wrapping session_template render with multiplexer dispatch (per spec §5.2, §7.1), substrate spawn-harness block renderers (wmbt_rules / train_rules / security_rules per spec §7.1 + substrate v12 §8.2), canonical-naming + layout pass absorbed from atdd orchestrate (per spec §7.1.5), per-LLM convention file generation (CLAUDE.md, AGENTS.md, GLM.md, GEMINI.md per spec §7.1), and a fixture-driven orchestrate parity test suite that gates the eventual decommission of atdd orchestrate (per spec §11.3)"
theme: commons

subject: "agent:coach"
context: "in-coach-v9-execution, atdd-orchestrate-spawn-pipeline-absorbed"
action: "spawns persona agents (planner/tester/coder/reviewer) via atdd spawn with substrate spawn-harness blocks"
goal: "centralize launch-prompt rendering, multiplexer dispatch, and naming/layout under one rule-IDed entry point with CI-enforced parity to today's atdd orchestrate"
outcome: "atdd spawn command at parity with absorbed orchestrate machinery (CI-enforced via K5 fixture suite), plus per-LLM convention files generated by atdd sync, ready for the wave-w3 atdd orchestrate decommission gate"

features:
  - urn: "feature:spawn-agents:atdd-spawn-skeleton-and-harness"
  - urn: "feature:spawn-agents:orchestrate-parity-and-decommission-gate"
  - urn: "feature:spawn-agents:transactional-spawn-and-orphan-pane-gc"

produce:
  - name: coach:spawn:atdd-spawn-cli
    contract: null
    telemetry: null
    to: external
  - name: coach:spawn:launch-prompt-file
    contract: null
    telemetry: null
    to: external
  - name: coach:spawn:agent-spawned-event
    contract: null
    telemetry: null
    to: external
  - name: coach:spawn:wmbt-rules-block-renderer
    contract: null
    telemetry: null
    to: external
  - name: coach:spawn:train-rules-block-renderer
    contract: null
    telemetry: null
    to: external
  - name: coach:spawn:canonical-naming-and-layout-pass
    contract: null
    telemetry: null
    to: external
  - name: coach:spawn:per-llm-convention-files
    contract: null
    telemetry: null
    to: external
  - name: coach:spawn:orchestrate-parity-fixture-suite
    contract: null
    telemetry: null
    to: external
  - name: coach:spawn:transactional-spawn-pipeline
    contract: null
    telemetry: null
    to: external
  - name: coach:spawn:coach-gc-cli
    contract: null
    telemetry: null
    to: external

consume:
  - name: commons:coach:runtime-event-schema
    from: wagon:freeze-runtime-contracts
  - name: commons:coach:runtime-layout-doc
    from: wagon:freeze-runtime-contracts
  - name: commons:coach:event-semantics-doc
    from: wagon:freeze-runtime-contracts
  - name: commons:coach:decisions-jsonl-writer
    from: wagon:drive-state-machine

wmbt:
  total: 6
  E001: "minimize likelihood of unrouted-persona-launches-bypassing-the-spawn-rule-id"
  D001: "minimize likelihood of ambiguity-in-substrate-spawn-harness-block-rendering"
  E002: "minimize quantity of post-launch-sessions-with-non-canonical-name-or-layout"
  P001: "minimize quantity of llm-personas-without-rule-id-aware-convention-file"
  C001: "minimize likelihood of orchestrate-coach-spawn-divergence-shipping-undetected"
  E003: "minimize quantity of orphan-multiplexer-panes-leaked-by-failed-or-partial-coach-spawns"
