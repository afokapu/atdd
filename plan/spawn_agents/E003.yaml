urn: "wmbt:spawn-agents:E003"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "orphan-multiplexer-panes-leaked-by-failed-or-partial-coach-spawns"
context_clarifier: "when atdd spawn dispatches a coach persona surface, the spawn pipeline runs a multi-step sequence — create pane (CmuxBackend.new_surface), attach surface + seed command (cd <worktree> && claude ...), then apply_canonical_name_and_layout — and any step after pane creation can fail (failed cmux send, seed command error, rename error); today CmuxBackend.new_surface creates the pane unconditionally and never calls the close primitive on the failure path, so each failed or partial spawn strands a live cmux pane that defaults its label to ~/Github/atdd and never gets reclaimed (the #582 retry cycle on 2026-05-13 left ~25 such orphans in workspace:1, requiring 20+ manual cmux close-surface calls); two corrections are needed — Layer 1 makes the spawn pipeline transactional so a pane created earlier in an attempt is closed before the error propagates, and Layer 2 adds a retroactive atdd coach gc command that cross-references live workspace:1 surfaces against the spawned surface refs recorded in .atdd/runtime/coach/*/decisions.jsonl (the DecisionWriter registry) and closes only the unreferenced default-cwd orphans, defaulting to a dry-run listing and requiring --apply to close; without these, every coach run that hits friction permanently accumulates dead panes that crowd workspace:1 and obscure live agent surfaces"
lens: "functional.effectiveness"
statement: "minimize quantity of orphan-multiplexer-panes-leaked-by-failed-or-partial-coach-spawns by making the atdd spawn pipeline transactional — closing a pane created earlier in an attempt before propagating any later-step failure — and by adding an atdd coach gc command that cross-references live workspace:1 surfaces against decisions.jsonl-recorded surface refs and closes only the unreferenced default-cwd orphans, dry-run by default and requiring --apply to close"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E003-INTEGRATION-001-spawn-failure-cleans-pane"
      id: "AC-INTEGRATION-001"
      purpose: "When a spawn step after pane creation fails, the pane created earlier in the same attempt is closed so the failed spawn leaves zero orphan panes"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A fake multiplexer backend bound via get_multiplexer that records new_surface and close calls"
        - "The fake backend is configured to raise on the seed-command step (e.g. a failed cmux send) that runs after pane creation succeeds"
    when:
      abstract: "atdd spawn dispatches a persona surface through the fake backend and the seed-command step raises"
    then:
      abstract:
        - "close(surface_ref) is called exactly once for the surface ref returned by the earlier new_surface call"
        - "The original spawn-step exception propagates to the caller (the failure is not swallowed)"
        - "After the attempt, the fake backend reports zero live surfaces created by this spawn"
    metadata:
      author: "atdd:planner"
      created: "2026-05-16"
  - identity:
      urn: "acc:spawn-agents:E003-INTEGRATION-002-gc-detects-orphans"
      id: "AC-INTEGRATION-002"
      purpose: "atdd coach gc --dry-run lists exactly the workspace:1 panes that are unreferenced by decisions.jsonl and carry the default cwd, leaving referenced panes off the list"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A fixture .atdd/runtime/coach/*/decisions.jsonl referencing 3 spawned agent surface refs"
        - "A fake cmux list-panels for workspace:1 returning those 3 referenced surfaces plus 2 unreferenced surfaces whose label is the default ~/Github/atdd cwd"
    when:
      abstract: "atdd coach gc --dry-run is run against the fixture runtime dir and fake cmux"
    then:
      abstract:
        - "The command output lists exactly the 2 unreferenced default-cwd surfaces as orphans"
        - "Neither of the 3 decisions.jsonl-referenced surfaces appears in the orphan list"
        - "No cmux close-surface call is made (dry-run performs no mutation) and exit code is 0"
    metadata:
      author: "atdd:planner"
      created: "2026-05-16"
  - identity:
      urn: "acc:spawn-agents:E003-INTEGRATION-003-gc-apply-closes"
      id: "AC-INTEGRATION-003"
      purpose: "atdd coach gc --apply closes exactly the unreferenced orphan panes and leaves every decisions.jsonl-referenced pane intact"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The same fixture as E003-INTEGRATION-002: 3 decisions.jsonl-referenced surfaces and 2 unreferenced default-cwd surfaces in workspace:1"
        - "A fake cmux that records close-surface calls and reflects them in subsequent list-panels output"
    when:
      abstract: "atdd coach gc --apply is run against the fixture"
    then:
      abstract:
        - "close-surface is called for exactly the 2 unreferenced orphan surface refs"
        - "A follow-up cmux list-panels for workspace:1 no longer contains the 2 orphan surfaces"
        - "All 3 decisions.jsonl-referenced surfaces remain present in list-panels and have no close-surface call"
    metadata:
      author: "atdd:planner"
      created: "2026-05-16"
