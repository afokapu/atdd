urn: "feature:spawn-agents:scoped-bash-freedom-set-config-driven"
wagon: "wagon:spawn-agents"
description: "Makes session.convention.yaml::spawn_time.freedom_layer the SOURCE OF TRUTH for the spawned-worker freedom set: it declares allowed_tools, allowed_bash (a curated, tightly-scoped Bash(cmd:*) safe allow-list — pytest / atdd validate / grep / read-only git, etc.) and forbidden_bash (destructive/outward commands — git push/commit/add, rm/mv/cp, gh, pip/pipx/sudo, atdd emergency/agent done/issue/pr/branch, bare python -c) as data. Both worker launch planes (coach/commands/spawn.py and runtime/agent_control/cmux_launch.py::build_agent_seed_argv) read the scoped allow-list from the convention instead of the hardcoded ADAPTER_REGISTRY.allowed_tools literal and emit --allowedTools from it, so safe read/test commands auto-run (cutting operator babysitting) while consequential commands stay gated. The E013-era freedom-set validator flips from 'asserts Bash absent' to 'asserts allowed_bash contains no forbidden command AND every Bash entry is scoped (Bash(cmd:*), never bare Bash or Bash(*))' — validating data, so it is language-agnostic and stack-portable (#1035). (E031 config-driven sourcing; E032 allow-list safety invariant)"
sizing:
  wmbts: 2
  footprint_score: 8
  footprint_size: "S"
wmbts:
  - "wmbt:spawn-agents:E031"
  - "wmbt:spawn-agents:E032"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 2
        rationale: "The two rule-IDed worker launch surfaces that emit --allowedTools must source the scoped allow-list from the convention instead of a hardcoded literal: src/atdd/coach/commands/spawn.py (the claude-family adapter / _claude_code_adapter launch assembly, replacing _CLAUDE_ALLOWED_TOOLS / ADAPTER_REGISTRY.allowed_tools) and src/atdd/runtime/agent_control/cmux_launch.py::build_agent_seed_argv (the cmux-native argv) — E031 AC-UNIT-002 / AC-UNIT-003"
    application:
      - type: "use_cases"
        count: 2
        rationale: "(1) A convention loader/derivation that reads spawn_time.freedom_layer and composes the launch allow-list (allowed_tools ∪ allowed_bash) as the single source both launch planes consume — E031 AC-UNIT-001/002/003. (2) The flipped freedom-set allow-list validator that asserts no forbidden_bash command appears in allowed_bash and that every Bash entry is tightly scoped Bash(cmd:*), operating on convention data only so it is language-agnostic — E032 AC-UNIT-001/002/003"
    domain:
      - type: "value_objects"
        count: 0
        rationale: "No new domain primitive — the freedom set is plain convention data (lists of strings); the scoped-Bash shape check is a string/pattern assertion, not a domain type"
  frontend:
    presentation:
      - type: "components"
        count: 0
        rationale: "No frontend surface — coach is a CLI-only orchestrator"
