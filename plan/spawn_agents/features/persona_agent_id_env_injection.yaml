urn: "feature:spawn-agents:persona-agent-id-env-injection"
wagon: "wagon:spawn-agents"
description: "Coach spawn path exports ATDD_AGENT_ID=<agent_id> into every persona process environment and states that agent_id in the rendered launch prompt as a --agent-id fallback (E005)"
sizing:
  wmbts: 1
  footprint_score: 4
  footprint_size: "XS"
wmbts:
  - "wmbt:spawn-agents:E005"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "cmd_spawn in src/atdd/coach/commands/spawn.py is the single rule-IDed launch surface that already knows the canonical agent_id (it writes the manifest and agent_spawned event) — the env injection and prompt agent_id statement are wired here"
    application:
      - type: "use_cases"
        count: 2
        rationale: "persona-environment assembly that injects ATDD_AGENT_ID=<agent_id> into the _claude_code_adapter launch command/env (E005 primary), and launch-prompt rendering that states the agent_id as a --agent-id fallback in _render_launch_prompt (E005 belt-and-braces)"
    domain:
      - type: "value_objects"
        count: 0
        rationale: "No new domain primitive — agent_id is an already-canonical identity string of the form <persona>-<issue>-<suffix> produced upstream of the spawn path"
  frontend:
    presentation:
      - type: "components"
        count: 0
        rationale: "No frontend surface — coach is a CLI-only orchestrator"
