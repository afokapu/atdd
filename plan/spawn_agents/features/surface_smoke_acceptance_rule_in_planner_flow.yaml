urn: "feature:spawn-agents:surface-smoke-acceptance-rule-in-planner-flow"
wagon: "wagon:spawn-agents"
description: "Surfaces planner.wmbt.must-have-smoke-acceptance at agent-planning time, not at CI time. SESSION-LAUNCH-TEMPLATE.md gains an explicit pre-commit gate section naming the rule and the atdd validate planner --local --skip-api command with zero-violation required before committing PLANNED (E015 AC-UNIT-001). ATDD.md gains a pre_commit_gate key in the INIT phase block that names the rule and annotates the command with a BEFORE-committing timing constraint (E015 AC-UNIT-002). A SMOKE test verifies the installed atdd package templates contain the rule ID (E015 AC-SMOKE-001)."
sizing:
  wmbts: 1
  footprint_score: 2
  footprint_size: "XS"
wmbts:
  - "wmbt:spawn-agents:E015"
components:
  backend:
