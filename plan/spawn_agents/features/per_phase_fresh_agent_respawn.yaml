urn: "feature:spawn-agents:per-phase-fresh-agent-respawn"
wagon: "wagon:spawn-agents"
description: "Per-phase fresh worker agent respawn for the coach lifecycle (issue #746, implementing #730's Decision #5): on every phase transition (INIT→PLANNED→RED→GREEN→SMOKE→REFACTOR) the coach terminates the current worker process and relaunches a fresh next-phase agent in the SAME surface via the multiplexer abstraction's backend-neutral respawn primitive — extending respawn coverage from CmuxBackend alone to TmuxBackend and ZellijBackend — never a hardcoded CLI-specific quit such as claude's /exit. The relaunch command is built from the per-phase adapter/model selection so a phase may run a different model or adapter (claude-code/codex/gemini/glm) than the prior phase, and the worker surface is renamed via session_naming to a phase-qualified name encoding the live phase and persona (e.g. ATDD746·RED·tester) so the operator can see which agent is live (E007)"
sizing:
  wmbts: 1
  footprint_score: 9
  footprint_size: "S"
wmbts:
  - "wmbt:spawn-agents:E007"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 0
        rationale: "No new runtime entry point — the per-phase respawn hooks into the existing coach phase-transition path in src/atdd/coach/handlers/spawn.py / src/atdd/coach/commands/spawn.py rather than adding a new CLI command"
    application:
      - type: "use_cases"
        count: 2
        rationale: "Per-phase respawn orchestration (terminate the worker process and relaunch the next phase's agent in the same surface on each transition) and per-phase adapter/model selection (build the relaunch command from the phase's chosen adapter) are two discrete coach-application use cases"
    domain:
      - type: "value_objects"
        count: 1
        rationale: "The phase-qualified surface name (issue number + lifecycle phase + persona) is a new naming value object added to src/atdd/coach/utils/session_naming.py; surface ref and adapter shapes are imported from already-shipped multiplexer and spawn modules"
    integration:
      - type: "adapters"
        count: 3
        rationale: "The backend-neutral respawn primitive is extended from CmuxBackend to TmuxBackend and ZellijBackend so respawn works uniformly across all three multiplexer backends — each backend issues its native in-place respawn command"
  frontend:
    presentation:
      - type: "components"
        count: 0
        rationale: "No frontend surface — coach is a CLI-only orchestrator"
