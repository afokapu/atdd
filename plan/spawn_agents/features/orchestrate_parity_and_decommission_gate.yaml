    presentation:
      - type: "controllers"
        count: 0
        rationale: "Test-only feature; no runtime entry points introduced"
    application:
      - type: "use_cases"
        count: 0
        rationale: "Validates equivalence of two existing application paths (atdd orchestrate, atdd coach + atdd spawn); does not add new use cases"
    domain:
      - type: "value_objects"
        count: 1
        rationale: "Equivalence-mapping reference at tests/integration/parity-fixtures/orchestrate-coach.md captures the field-by-field semantic mapping between orchestrate-state.json and decisions.jsonl as a value-object contract"
    integration:
      - type: "fixtures"
        count: 5
        rationale: "At least five fixture scenarios per spec §11.3: single issue, multi-issue with deps, resume case, worktree creation failure with rollback, and multiplexer-mode pane"
  frontend:
    presentation:
      - type: "components"
        count: 0
        rationale: "No frontend surface — coach is a CLI-only orchestrator"
