description: "Fixture-driven CI test suite at tests/integration/test_orchestrate_coach_parity.py that proves atdd orchestrate <args> and atdd coach <equivalent args> produce equivalent worktree creation, multiplexer dispatch, canonical naming, launch-prompt contents, and resume-state semantics across at least five fixture scenarios — the gate that authorizes the wave-w3 atdd orchestrate decommission (K5 blocks P5 per spec §11.3)"
sizing:
