urn: "feature:spawn-agents:claude-md-slim-and-debanner"
wagon: "wagon:spawn-agents"
description: "Closes the bypass-discovery vector in the worker context file and enforces a size budget going forward. Three phases: (E022) strip all ATDD_SKIP_* env-var references from CLAUDE.md, replacing with a pointer to docs/operator-emergency-bypass.md (operator-only, not loaded by agents); (E023) trim CLAUDE.md from 854 lines to ≤ 250 lines by moving detail to conventions files; (E024) create docs/operator-emergency-bypass.md documenting the atdd emergency --reason CLI as the sole emergency override path. A SMOKE test (L003) dispatches a real agent and asserts zero ATDD_SKIP_* invocations in its bash log. Two meta-validators lock the gains in CI: R002 (coach.claude_md.size_budget, sev 3) fails if CLAUDE.md grows past 250 lines; R003 (coach.claude_md.no_bypass_advertising, sev 3) fails if any bypass token re-appears (issue #867)."
sizing:
  wmbts: 6
  footprint_score: 4
  footprint_size: "S"
wmbts:
  - "wmbt:spawn-agents:E022"
  - "wmbt:spawn-agents:E023"
  - "wmbt:spawn-agents:E024"
  - "wmbt:spawn-agents:L003"
  - "wmbt:spawn-agents:R002"
  - "wmbt:spawn-agents:R003"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 0
        rationale: "No new CLI surface — changes are CLAUDE.md edits and new coach validator functions"
    application:
      - type: "use_cases"
        count: 2
        rationale: "Two new coach validator callables: claude_md_size_budget() and claude_md_no_bypass_advertising() in src/atdd/coach/validators/"
    domain:
      - type: "value_objects"
        count: 0
        rationale: "No new domain primitives — validators operate on file text"
    integration:
      - type: "adapters"
        count: 0
        rationale: "No new external integration surface"
  frontend:
    presentation:
      - type: "components"
        count: 0
        rationale: "No frontend surface — coach is a CLI-only orchestrator"
