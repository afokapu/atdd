urn: "feature:spawn-agents:interactive-model-selection-at-spawn"
wagon: "wagon:spawn-agents"
description: "TTY-gated per-persona model selection prompt in atdd coach (issue #723): when atdd coach is run interactively (TTY, no --persona-llm, no --no-prompt) a prompt_persona_models() call in coach.py asks the operator to pick from the registered adapter ids for each persona before any agent is spawned; non-interactive runs (non-TTY, --persona-llm given, --no-prompt) skip the prompt entirely so automation and coach-of-coach runs never block; invalid choices are rejected with the valid-id list and re-prompted until a valid id is entered (E008)"
sizing:
  wmbts: 1
  footprint_score: 4
  footprint_size: "XS"
wmbts:
  - "wmbt:spawn-agents:E008"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 1
        rationale: "coach.py is the entry-point controller; it gains a --no-prompt flag and the TTY-gate logic that calls prompt_persona_models() before delegating to run()"
    application:
      - type: "use_cases"
        count: 2
        rationale: "prompt_persona_models() (collect per-persona model choice from the operator) and should_prompt_for_models() (determine whether the interactive prompt should fire at all) are two discrete application-layer use cases added to coach.py"
    domain:
      - type: "value_objects"
        count: 0
        rationale: "No new domain shapes — the result is a plain dict[str, str] that flows into the existing persona_llm field on Config; ADAPTER_REGISTRY is imported from spawn.py as the source of valid model ids"
    integration:
      - type: "adapters"
        count: 0
        rationale: "No new integration adapters — the prompt reads from sys.stdin and writes to sys.stdout; injection of fake stdin/stdout in tests is done via keyword arguments, not an adapter"
  frontend:
    presentation:
      - type: "components"
        count: 0
        rationale: "No frontend surface — coach is a CLI-only orchestrator"
