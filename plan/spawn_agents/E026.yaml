urn: "wmbt:spawn-agents:E026"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "launch-prompts-emitted-without-wagon-scoped-graph-context-section"
context_clarifier: >
  SESSION-LAUNCH-TEMPLATE.md and `_render_launch_prompt` in session_template.py produce
  the launch prompts that every dispatched worker receives at INIT. The pre-flight checklist
  currently instructs workers to: (1) read CLAUDE.md, (2) run `atdd gate`, (3) run
  `atdd repo validate`, (4) run `gh issue view <N>`. It does NOT instruct the worker to
  run `atdd repo graph --wagon <wagon>`. Workers therefore enter their wagon
  architecturally blind: they do not see existing features, WMBTs, produces/consumes
  contracts, or the sibling wagons they may need to coordinate with.
  Fix: embed the wagon-scoped graph view (E025 output) between the issue body and the
  persona instructions in every rendered launch prompt. SESSION-LAUNCH-TEMPLATE.md gains
  a `## Wagon Architecture` section with a pre-flight step 5 instructing the worker to
  re-run `atdd repo graph --wagon <wagon> --format launch-prompt` before committing
  PLANNED to catch mid-work architectural drift. `_render_launch_prompt` calls
  `atdd repo graph --wagon <wagon> --format launch-prompt` at render time and injects
  the output. If the command fails or the wagon is unknown, the step is omitted with a
  warning rather than blocking the dispatch.
lens: "functional.effectiveness"
statement: >
  minimize likelihood of launch-prompts-emitted-without-wagon-scoped-graph-context-section
  by updating SESSION-LAUNCH-TEMPLATE.md to include a wagon-graph slot and pre-flight
  step 5 (re-run before PLANNED commit), and updating `_render_launch_prompt` in
  src/atdd/coach/commands/session_template.py to call
  `atdd repo graph --wagon <wagon> --format launch-prompt` at render time and inject
  the output between the issue body and the persona instructions
acceptances:
  - identity:
      urn: "acc:spawn-agents:E026-UNIT-001-session-launch-template-contains-wagon-graph-slot"
      id: "AC-UNIT-001"
      purpose: "SESSION-LAUNCH-TEMPLATE.md contains a wagon-graph section slot and pre-flight step 5 instructing workers to re-run the graph command before PLANNED commit"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/templates/SESSION-LAUNCH-TEMPLATE.md is read from the filesystem"
    when:
      abstract: "The file content is inspected for the wagon graph slot and pre-flight step 5"
    then:
      abstract:
        - "The file contains 'atdd repo graph' or 'wagon graph'"
        - "The file contains a step 5 or equivalent instruction referencing the graph command"
        - "The file contains the string '## Wagon Architecture' or a similarly scoped section heading"
        - "The file contains a 'before committing PLANNED' timing annotation near the graph command reference"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"

  - identity:
      urn: "acc:spawn-agents:E026-UNIT-002-render-launch-prompt-injects-graph-section"
      id: "AC-UNIT-002"
      purpose: "_render_launch_prompt injects the wagon-scoped graph output between the issue body section and the persona instructions section of the rendered prompt"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A minimal fake issue object with wagon='spawn-agents'"
        - "`atdd repo graph --wagon spawn-agents --format launch-prompt` is monkeypatched to return a known fixture string (e.g. '## Wagon: spawn-agents\\n...fixture...')"
        - "_render_launch_prompt is called with the fake issue"
    when:
      abstract: "The rendered prompt string is captured"
    then:
      abstract:
        - "The rendered prompt contains the fixture graph string"
        - "The fixture graph string appears AFTER the issue body section and BEFORE the persona instructions section"
        - "The graph section is bounded by recognizable headers (e.g. '## Wagon Architecture')"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"

  - identity:
      urn: "acc:spawn-agents:E026-UNIT-003-render-launch-prompt-omits-graph-on-command-failure"
      id: "AC-UNIT-003"
      purpose: "When `atdd repo graph --wagon <wagon> --format launch-prompt` fails (non-zero exit), _render_launch_prompt emits a warning and continues rendering without the graph section, rather than raising or blocking the dispatch"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A minimal fake issue object with an unknown wagon ID"
        - "`atdd repo graph` subprocess call is monkeypatched to return exit code 1"
    when:
      abstract: "_render_launch_prompt is called with the fake issue"
    then:
      abstract:
        - "No exception is raised"
        - "The returned prompt is a non-empty string"
        - "The returned prompt does NOT contain a Python traceback"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"

  - identity:
      urn: "acc:spawn-agents:E026-SMOKE-001-real-rendered-prompt-contains-graph-section"
      id: "AC-SMOKE-001"
      purpose: "SMOKE: rendering a launch prompt for a real issue whose wagon is spawn-agents produces a prompt containing the wagon-graph section (non-empty, well-formed markdown)"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "The atdd CLI is installed and atdd repo graph --wagon spawn-agents --format launch-prompt works (E025-SMOKE-001 passed)"
        - "A real or representative issue object with wagon='spawn-agents' is available"
    when:
      abstract: "_render_launch_prompt (or `atdd spawn --dry-run`) is invoked for the issue"
    then:
      abstract:
        - "The output contains a wagon-graph section (e.g. '## Wagon Architecture' or 'spawn-agents')"
        - "The wagon-graph section is non-empty"
        - "The wagon-graph section is positioned between the issue body and the persona instructions in the output"
    metadata:
      author: "atdd:planner"
      created: "2026-05-27"
