urn: "wmbt:spawn-agents:E007"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "phase-transitions-that-reuse-the-prior-phase-worker-process"
context_clarifier: "when the coach advances an issue across a lifecycle phase boundary (INIT→PLANNED→RED→GREEN→SMOKE→REFACTOR) it currently leaves one continuous worker agent running for the whole lifecycle, so each persona inherits the polluted context of every earlier phase; instead, on every phase transition the coach terminates the current worker process and relaunches a fresh next-phase agent in the SAME surface via the multiplexer abstraction's respawn primitive (cmux respawn-pane, plus tmux/zellij equivalents) — a hard kill loses nothing because the worker's state lives in committed artifacts (plan YAMLs, RED tests, commits, the Activity Log, decisions.jsonl). The terminate must be CLI-agnostic: never a hardcoded CLI-specific quit such as claude's /exit. The respawn command for the next phase is built from the adapter/model selected for THAT phase (so a phase may launch a different model or a different adapter — claude-code/codex/gemini/glm — than the prior phase), and the surface is renamed to a phase-qualified name encoding the live phase and persona (e.g. ATDD746·RED·tester) so the operator can see which agent is running now"
lens: "functional.effectiveness"
statement: "minimize quantity of phase-transitions-that-reuse-the-prior-phase-worker-process when the coach advances an issue across a lifecycle phase boundary — the coach terminates the current worker process and relaunches a fresh next-phase agent in the same surface via the multiplexer abstraction's backend-neutral respawn primitive (never a hardcoded CLI-specific quit), builds the relaunch command from the per-phase adapter/model selection, and renames the surface to a phase-qualified name encoding the live phase and persona"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E007-UNIT-001-respawn-primitive-backend-neutral-same-surface"
      id: "AC-UNIT-001"
      purpose: "The multiplexer abstraction's respawn primitive kills the current process and relaunches a fresh one in the SAME surface, on every concrete backend (cmux, tmux, zellij) — no new surface is allocated"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/utils/multiplexer.py exposes a respawn primitive on the MultiplexerBackend abstraction"
        - "CmuxBackend, TmuxBackend, and ZellijBackend each implement the respawn primitive — none falls through to the base-class NotImplementedError"
        - "A subprocess recorder captures every backend command argv without spawning real processes"
        - "An existing surface ref with a running process is supplied for each backend"
    when:
      abstract: "the respawn primitive is invoked once per backend with a replacement launch command for the next phase"
    then:
      abstract:
        - "Each backend issues its native in-place respawn command (cmux respawn-pane, and the tmux/zellij equivalents) — verified against the recorded argv"
        - "The surface ref passed in is reused unchanged in the recorded command — no new_surface / new_workspace call is recorded"
        - "No backend raises NotImplementedError for the respawn primitive"
        - "The replacement launch command supplied by the caller appears in the recorded argv"
    metadata:
      author: "atdd:planner"
      created: "2026-05-18"
  - identity:
      urn: "acc:spawn-agents:E007-SMOKE-001-real-respawn-fresh-process-same-surface"
      id: "AC-SMOKE-001"
      purpose: "On a real multiplexer backend a respawn kills the running process and a fresh process is observed in the same surface, leaving no orphan"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "A real multiplexer backend (cmux) with a real surface running an observable long-lived process"
    when:
      abstract: "the respawn primitive is invoked on that surface with a replacement command"
    then:
      abstract:
        - "The original process is no longer running after the respawn"
        - "A fresh process for the replacement command is running in the same surface ref"
        - "No orphan pane or detached process is left behind by the respawn"
    metadata:
      author: "atdd:planner"
      created: "2026-05-18"
