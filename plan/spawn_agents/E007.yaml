urn: "wmbt:spawn-agents:E007"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "phase-transitions-that-reuse-the-prior-phase-worker-process"
context_clarifier: "when the coach advances an issue across a lifecycle phase boundary (INIT→PLANNED→RED→GREEN→SMOKE→REFACTOR) it currently leaves one continuous worker agent running for the whole lifecycle, so each persona inherits the polluted context of every earlier phase; instead, on every phase transition the coach terminates the current worker process and relaunches a fresh next-phase agent in the SAME surface via the multiplexer abstraction's respawn primitive (cmux respawn-pane, plus tmux/zellij equivalents) — a hard kill loses nothing because the worker's state lives in committed artifacts (plan YAMLs, RED tests, commits, the Activity Log, decisions.jsonl). The terminate must be CLI-agnostic: never a hardcoded CLI-specific quit such as claude's /exit. The respawn command for the next phase is built from the adapter/model selected for THAT phase (so a phase may launch a different model or a different adapter — claude-code/codex/gemini/glm — than the prior phase), and the surface is renamed to a phase-qualified name encoding the live phase and persona (e.g. ATDD746·RED·tester) so the operator can see which agent is running now"
lens: "functional.effectiveness"
statement: "minimize quantity of phase-transitions-that-reuse-the-prior-phase-worker-process when the coach advances an issue across a lifecycle phase boundary — the coach terminates the current worker process and relaunches a fresh next-phase agent in the same surface via the multiplexer abstraction's backend-neutral respawn primitive (never a hardcoded CLI-specific quit), builds the relaunch command from the per-phase adapter/model selection, and renames the surface to a phase-qualified name encoding the live phase and persona"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E007-UNIT-001-respawn-primitive-backend-neutral-same-surface"
      id: "AC-UNIT-001"
      purpose: "The multiplexer abstraction's respawn primitive kills the current process and relaunches a fresh one in the SAME surface, on every concrete backend (cmux, tmux, zellij) — no new surface is allocated"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/utils/multiplexer.py exposes a respawn primitive on the MultiplexerBackend abstraction"
        - "CmuxBackend, TmuxBackend, and ZellijBackend each implement the respawn primitive — none falls through to the base-class NotImplementedError"
        - "A subprocess recorder captures every backend command argv without spawning real processes"
        - "An existing surface ref with a running process is supplied for each backend"
    when:
      abstract: "the respawn primitive is invoked once per backend with a replacement launch command for the next phase"
    then:
      abstract:
        - "Each backend issues its native in-place respawn command (cmux respawn-pane, and the tmux/zellij equivalents) — verified against the recorded argv"
        - "The surface ref passed in is reused unchanged in the recorded command — no new_surface / new_workspace call is recorded"
        - "No backend raises NotImplementedError for the respawn primitive"
        - "The replacement launch command supplied by the caller appears in the recorded argv"
    metadata:
      author: "atdd:planner"
      created: "2026-05-18"
  - identity:
      urn: "acc:spawn-agents:E007-UNIT-002-transition-respawns-no-cli-specific-quit"
      id: "AC-UNIT-002"
      purpose: "On a phase transition the coach invokes the multiplexer respawn primitive for the worker surface and never sends a hardcoded CLI-specific quit string (/exit, /quit)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The coach phase-transition path (src/atdd/coach/handlers/spawn.py / src/atdd/coach/commands/spawn.py) is exercised with a FakeMultiplexer that records respawn and send calls"
        - "A worker surface ref bound to an issue is in scope at a phase boundary"
    when:
      abstract: "the coach advances the issue across one phase transition"
    then:
      abstract:
        - "Exactly one respawn primitive call is recorded for the worker surface, targeting the same surface ref the prior phase used"
        - "No send / send_key call carrying a CLI-specific quit literal ('/exit', '/quit', '/clear') is recorded for the worker surface"
        - "Static scan of the transition path source confirms no hardcoded '/exit' (or equivalent CLI-specific quit) literal is present"
    metadata:
      author: "atdd:planner"
      created: "2026-05-18"
  - identity:
      urn: "acc:spawn-agents:E007-UNIT-003-per-phase-adapter-selection-honored"
      id: "AC-UNIT-003"
      purpose: "The relaunch command for the next phase is built from the adapter/model selected for THAT phase, not inherited from the prior phase"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A per-phase adapter/model selection maps at least two phases to two distinct adapters or models (e.g. planner→claude-code/opus, coder→claude-code/sonnet, or one phase→codex)"
        - "A FakeMultiplexer records the launch command of each respawn"
    when:
      abstract: "the coach respawns the worker for two consecutive phases whose per-phase selection differs"
    then:
      abstract:
        - "The launch command recorded for the second phase reflects that phase's selected adapter/model"
        - "The two recorded launch commands differ exactly where the per-phase selection differs"
        - "When two phases share the same selection the launch commands match on the adapter/model segment — the selection, not the prior phase, is the source"
    metadata:
      author: "atdd:planner"
      created: "2026-05-18"
  - identity:
      urn: "acc:spawn-agents:E007-UNIT-004-phase-qualified-surface-name"
      id: "AC-UNIT-004"
      purpose: "The worker surface is renamed on each transition to a phase-qualified name encoding the live phase and persona"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/utils/session_naming.py exposes a phase-qualified naming helper taking issue number, phase, and persona"
        - "A FakeMultiplexer records every rename call against the worker surface"
    when:
      abstract: "the coach computes the worker surface name for the RED/tester and the GREEN/coder phases of issue 746"
    then:
      abstract:
        - "The RED name encodes issue 746, the RED phase, and the tester persona (e.g. ATDD746·RED·tester)"
        - "The GREEN name encodes issue 746, the GREEN phase, and the coder persona"
        - "Each name round-trips: parsing it recovers the issue number, phase, and persona it was built from"
        - "A rename call to the new phase-qualified name is recorded on the worker surface for each transition"
    metadata:
      author: "atdd:planner"
      created: "2026-05-18"
  - identity:
      urn: "acc:spawn-agents:E007-INTEGRATION-001-multi-phase-run-fresh-process-per-phase"
      id: "AC-INTEGRATION-001"
      purpose: "Across a multi-phase run each phase respawns a fresh process in the same surface with no carried-over conversation, and the surface name reflects the current phase — the issue's RED-first regression test"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A FakeMultiplexer that assigns a fresh process identity (incrementing token / PID) to every launch and exposes the current process identity per surface"
        - "An issue is driven through a multi-phase lifecycle sequence (planner → tester → coder → tester → coder) via the coach phase-transition path"
    when:
      abstract: "the coach advances the issue through every phase transition in the sequence"
    then:
      abstract:
        - "The worker surface ref is identical at every phase — one surface for the whole run"
        - "The process identity recorded on the surface changes at every transition — a fresh process per phase, never reused"
        - "No carried-over conversation marker from a prior phase is present in the freshly launched process"
        - "The recorded surface name at each phase is the phase-qualified name for that phase's persona"
    metadata:
      author: "atdd:planner"
      created: "2026-05-18"
  - identity:
      urn: "acc:spawn-agents:E007-SMOKE-001-real-respawn-fresh-process-same-surface"
      id: "AC-SMOKE-001"
      purpose: "On a real multiplexer backend a respawn kills the running process and a fresh process is observed in the same surface, leaving no orphan"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "A real multiplexer backend (cmux) with a real surface running an observable long-lived process"
    when:
      abstract: "the respawn primitive is invoked on that surface with a replacement command"
    then:
      abstract:
        - "The original process is no longer running after the respawn"
        - "A fresh process for the replacement command is running in the same surface ref"
        - "No orphan pane or detached process is left behind by the respawn"
    metadata:
      author: "atdd:planner"
      created: "2026-05-18"
