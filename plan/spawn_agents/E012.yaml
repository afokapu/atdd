urn: "wmbt:spawn-agents:E012"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "coach-spawned-workers-blocked-by-rename-race-false-positive-accepted-gate-and-orphan-pane-on-timeout"
context_clarifier: "apply_canonical_name_and_layout (session_naming_apply.py L91-92) issues two separate cmux subprocess calls: backend.send(ref, '/rename X') followed immediately by backend.send_key(ref, 'Enter'); cmux dispatches each as an independent shell invocation and the OS scheduler can deliver Enter before the typed text reaches Claude Code's TUI input buffer — production evidence shows '/rename ATDD794' typed-but-unsubmitted in the pane indefinitely (cmux read-screen confirms text is visible; Enter did not register as a submit). The downstream false-positive: _verify_stage('rename-accepted', expect_any=(canonical_name,)) matches the canonical name string anywhere in the pane capture — including inside the typed-but-unsubmitted '❯ /rename ATDD794' input line — so the rename gate passes even though Claude never processed the command and no jsonl is ever written. The rename failure then surfaces one step later as a _wait_for_claude_ready timeout ('❌ worker on surface:N did not boot in time') which hides the actual root cause. Compound regression: when WorkerReadinessTimeout fires from _wait_for_claude_ready or from any post-paste _verify_stage call, _close_surface_on_failure is NOT called for that failure path — only the apply_canonical_name_and_layout failure path (spawn.py L909) closes the surface. Each failed coach run therefore strands a live cmux pane with Claude running and '/rename X' stuck in the input buffer, requiring manual 'cmux close-surface' before the next retry. Fix: (1) send the /rename command as a single atomic text block with trailing newline (backend.paste_text or backend.send with '\\n' appended) so the rename text and submit land as one input event; (2) tighten _verify_stage('rename-accepted') to require the post-submit acknowledgment 'Session renamed to: <name>' rather than just the canonical name string; (3) extend _close_surface_on_failure coverage to all WorkerReadinessTimeout sites (post-wait and post-paste verify stages)"
lens: "functional.effectiveness"
statement: "minimize likelihood of coach-spawned-workers-blocked-by-rename-race-false-positive-accepted-gate-and-orphan-pane-on-timeout when apply_canonical_name_and_layout sends '/rename X' and Enter as two unsynced cmux calls — by replacing the two-call pattern with a single atomic send that includes the trailing newline, tightening the rename-accepted gate to require 'Session renamed to: <name>' rather than bare canonical name presence, and extending orphan-pane close coverage to every WorkerReadinessTimeout raise site so failed spawns leave no live cmux panes"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E012-UNIT-001-atomic-rename-send-no-separate-enter"
      id: "AC-UNIT-001"
      purpose: "apply_canonical_name_and_layout sends the /rename command as a single atomic text block with trailing newline rather than two separate send + send_key calls; a FakeMultiplexer confirms paste_text is called with '/rename X\\n' and send_key('Enter') is NOT called for the rename path"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/utils/session_naming_apply.py apply_canonical_name_and_layout with E012 changes"
        - "A FakeMultiplexer that records paste_text and send_key calls"
        - "The backend does not implement the native rename() method (falls into the /rename injection branch)"
    when:
      abstract: "apply_canonical_name_and_layout(backend, ref, 'ATDD42', surface_count=1) is called"
    then:
      abstract:
        - "backend.paste_text is called exactly once with a text argument containing '/rename ATDD42' and a trailing newline"
        - "backend.send_key is NOT called with 'Enter' as a standalone follow-up to the rename injection"
        - "The call does not raise any exception on a FakeMultiplexer that implements paste_text"
    metadata:
      author: "atdd:planner"
      created: "2026-05-20"
