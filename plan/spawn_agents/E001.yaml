urn: "wmbt:spawn-agents:E001"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "unrouted-persona-launches-bypassing-the-spawn-rule-id"
context_clarifier: "when coach v9 must route every persona launch (planner, tester, coder, reviewer) through one rule-IDed entry point that wraps session_template.py::render, writes <worktree>/.launch_prompt.txt, dispatches the multiplexer surface via get_multiplexer/new_workspace/new_surface, runs the claude-code adapter (claude --dangerously-skip-permissions \"$(cat <prompt>)\") with codex/gemini/glm as follow-up adapters, and emits an agent_spawned runtime event — instead of agents being launched by ad-hoc shell from atdd orchestrate, atdd coach, or operator hand-typing"
lens: "functional.effectiveness"
statement: "minimize likelihood of unrouted-persona-launches-bypassing-the-spawn-rule-id when coach v9 must route every persona launch through one entry point that renders the launch prompt, dispatches the multiplexer, runs the per-LLM adapter, and emits an agent_spawned event"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E001-UNIT-001-spawn-cli-launches-session"
      id: "AC-UNIT-001"
      purpose: "atdd spawn with the full required flag set launches a session, writes the launch prompt to disk, and creates a multiplexer surface whose ref is logged"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/spawn.py exists and registers the atdd spawn command per spec §5.2"
        - "A fake multiplexer backend is bound via the existing get_multiplexer abstraction"
        - "session_template.py::render is the rendering primitive being wrapped (existing module)"
    when:
      abstract: "atdd spawn --persona coder --llm claude-code --worktree <path> --issue 358 --agent-id coder-358-001 --runtime <path> runs against the fake backend"
    then:
      abstract:
        - "<worktree>/.launch_prompt.txt is created with the rendered prompt"
        - "A multiplexer surface is created via the fake backend; the surface ref is returned and logged"
        - "An agent_spawned runtime event is emitted to the runtime path conforming to the runtime-event JSON Schema frozen by wagon:freeze-runtime-contracts"
        - "Required flags --persona, --llm, --worktree, --issue, --agent-id, --runtime parse without error"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:E001-UNIT-002-claude-code-adapter-invoked"
      id: "AC-UNIT-002"
      purpose: "The --llm claude-code adapter shells out to claude --dangerously-skip-permissions \"$(cat <prompt>)\" against the rendered launch prompt"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "atdd spawn --llm claude-code is the supported adapter for the K1 deliverable"
        - "The shell-out target is the claude CLI with --dangerously-skip-permissions and \"$(cat <prompt>)\" as documented in spec §5.2"
    when:
      abstract: "atdd spawn --persona coder --llm claude-code is invoked against a captured-shell test harness"
    then:
      abstract:
        - "The exact shell invocation matches claude --dangerously-skip-permissions \"$(cat <worktree>/.launch_prompt.txt)\""
        - "Adapter selection is dispatched off --llm so other LLMs can register as separate adapters in K-track follow-ups without editing spawn.py's CLI surface"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:E001-CONTRACT-001-agent-spawned-event-conforms"
      id: "AC-CONTRACT-001"
      purpose: "The agent_spawned event emitted by atdd spawn validates against the frozen runtime-event JSON Schema and event-semantics contract"
      phase: "GREEN"
    harness:
      type: "contract"
      category: "contract"
    given:
      abstract:
        - "wagon:freeze-runtime-contracts has frozen runtime-event.schema.json and event-semantics.md"
        - "agent_spawned is one of the 12 enumerated event types"
    when:
      abstract: "atdd spawn writes the agent_spawned event into the runtime path"
    then:
      abstract:
        - "The emitted event document round-trips through the runtime-event schema validator with zero errors"
        - "The event's producer, triggering condition, idempotency, ordering, and replay semantics match the agent_spawned subsection of event-semantics.md"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
