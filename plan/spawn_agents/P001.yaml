urn: "wmbt:spawn-agents:P001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "prepare"
direction: "minimize"
dimension: "quantity"
object_of_control: "llm-personas-without-rule-id-aware-convention-file"
context_clarifier: "when each supported LLM persona (claude-code, codex, gemini, glm) must be served a per-LLM convention file at the repo root that embeds the rule-ID grammar (<archetype>.<convention_short_name>.<rule_name>) and the bind_rule() contract per spec §7.1, generated from src/atdd/coach/templates/persona/<llm>/<file>.md.tmpl, regenerated by atdd sync (existing command; per-LLM hookup also tracked in #P3); without this prep the spawn harness in E001 emits prompts whose rule-ID context cannot be resolved by the agent under review"
lens: "functional.effectiveness"
statement: "minimize quantity of llm-personas-without-rule-id-aware-convention-file when each supported LLM persona must be served a per-LLM convention file at the repo root that embeds rule-ID grammar and the bind_rule contract, regenerated by atdd sync from src/atdd/coach/templates/persona/<llm>/<file>.md.tmpl"
acceptances:
  - identity:
      urn: "acc:spawn-agents:P001-UNIT-001-templates-and-output-files"
      id: "AC-UNIT-001"
      purpose: "Per-LLM templates exist under src/atdd/coach/templates/persona/<llm>/<file>.md.tmpl and atdd sync regenerates CLAUDE.md, AGENTS.md, GLM.md, and GEMINI.md (aliased to AGENTS.md) at the repo root"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/templates/persona/<llm>/ holds template files for claude-code, codex, gemini, glm"
        - "atdd sync is the existing toolkit-sync entry point"
    when:
      abstract: "atdd sync runs in a fixture repo with the templates present"
    then:
      abstract:
        - "CLAUDE.md exists at the repo root and is the rendered output of the claude-code template"
        - "AGENTS.md exists at the repo root and is the rendered output of the codex template"
        - "GLM.md exists at the repo root and is the rendered output of the glm template"
        - "GEMINI.md exists at the repo root either as its own template output or aliased to AGENTS.md per spec §7.1"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:P001-UNIT-002-rule-id-grammar-embedded"
      id: "AC-UNIT-002"
      purpose: "Each generated convention file embeds the canonical rule-ID grammar (<archetype>.<convention_short_name>.<rule_name>) so agents under review can recognise and reference rule-IDs in commits and reports"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "atdd sync has run and produced the four convention files"
    when:
      abstract: "A linter test scans CLAUDE.md, AGENTS.md, GLM.md, and GEMINI.md for the rule-ID grammar string"
    then:
      abstract:
        - "Each file contains the literal grammar pattern <archetype>.<convention_short_name>.<rule_name>"
        - "Each file contains an example rule-ID that follows the grammar (e.g. coder.dead-code.reachability)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:P001-UNIT-003-bind-rule-contract-embedded"
      id: "AC-UNIT-003"
      purpose: "Each generated convention file embeds the bind_rule() contract example so validators that emit rule-IDs are anchored to a discoverable contract"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "atdd sync has run and produced the four convention files"
    when:
      abstract: "A linter test scans CLAUDE.md, AGENTS.md, GLM.md, and GEMINI.md for the bind_rule contract"
    then:
      abstract:
        - "Each file contains the bind_rule(\"<canonical_id>\") contract example"
        - "Each file states the substrate-level expectation: validators MUST call bind_rule at module-import time and the named rule MUST exist in a convention's rules: block"
        - "Each file references the rule-ID grammar contract (e.g. SPEC-COACH-RULEID-0007 anchor) so agents can locate the source authority"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
