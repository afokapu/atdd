urn: "wmbt:spawn-agents:E002"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "post-launch-sessions-with-non-canonical-name-or-layout"
context_clarifier: "when atdd spawn launches a multiplexer surface and must apply canonical session naming + grid layout immediately afterwards by absorbing apply_canonical_name_and_layout from today's commands/orchestrate.py — calling compute_canonical_name(repo_short, issue_number, slug) per the coach.orchestration.canonical-session-name rule, renaming the multiplexer surface (e.g. cmux rename-tab), sending /rename <canonical_name>\\n into the running agent so the in-conversation header matches, and printing the target grid layout via target_grid_label(surface_count); the function must be best-effort (rename failures don't crash spawn) because observer rule 14-canonical-naming-drift in wagon:observe-and-correct re-applies on subsequent ticks"
lens: "functional.effectiveness"
statement: "minimize quantity of post-launch-sessions-with-non-canonical-name-or-layout when atdd spawn launches a multiplexer surface and must absorb apply_canonical_name_and_layout from atdd orchestrate to rename the surface, propagate /rename into the agent, and print the grid label — best-effort so observer rule 14-canonical-naming-drift handles drift on subsequent ticks"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E002-UNIT-001-canonical-name-applied"
      id: "AC-UNIT-001"
      purpose: "After atdd spawn returns, the multiplexer surface has the canonical name (e.g. FORGE358-coder) computed via compute_canonical_name"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "apply_canonical_name_and_layout is moved into a coach module (e.g. src/atdd/coach/utils/session_naming_apply.py) preserving today's behavior"
        - "A fake multiplexer backend records every rename call"
        - "compute_canonical_name from session_naming.py is called with (repo_short, issue_number, slug)"
    when:
      abstract: "atdd spawn --persona coder --issue 358 is invoked against the fake backend"
    then:
      abstract:
        - "The fake backend records exactly one rename call against the launched surface"
        - "The rename target equals compute_canonical_name(repo_short, 358, slug) — e.g. FORGE358-coder"
        - "The coach.orchestration.canonical-session-name rule-ID is emitted on the rename action so observers can correlate"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:E002-UNIT-002-rename-injected-into-agent"
      id: "AC-UNIT-002"
      purpose: "/rename <canonical_name>\\n is sent into the running agent's stdin so the in-conversation header matches the surface name"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The fake multiplexer backend captures input sent to launched-session stdin"
    when:
      abstract: "atdd spawn completes its naming pass against the fake backend"
    then:
      abstract:
        - "Exactly one /rename <canonical_name>\\n line is captured on the session's stdin"
        - "The canonical_name value equals the surface rename target from AC-UNIT-001"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:E002-UNIT-003-layout-label-printed"
      id: "AC-UNIT-003"
      purpose: "The target grid layout label is printed via target_grid_label(surface_count) so the operator (and operator's terminal scrollback) carries the recommended layout"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "target_grid_label from session_naming.py is the existing label-rendering primitive"
    when:
      abstract: "atdd spawn completes its naming pass with N surfaces present"
    then:
      abstract:
        - "stdout contains the target_grid_label(N) string"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
  - identity:
      urn: "acc:spawn-agents:E002-UNIT-004-best-effort-on-rename-failure"
      id: "AC-UNIT-004"
      purpose: "Rename failures are caught and logged without crashing atdd spawn — observer rule 14-canonical-naming-drift will re-apply on subsequent ticks"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The fake multiplexer backend is configured to raise on rename"
    when:
      abstract: "atdd spawn invokes the naming pass against this failing backend"
    then:
      abstract:
        - "atdd spawn returns successfully (non-zero exit only on prior launch failure, not on rename failure)"
        - "The rename failure is recorded as a log line referencing coach.orchestration.canonical-session-name so the observer rule can correlate"
        - "An agent_spawned event is still emitted (E001 contract holds independent of the naming pass outcome)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-09"
