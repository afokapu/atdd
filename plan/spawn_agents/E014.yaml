urn: "wmbt:spawn-agents:E014"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-21
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "bash-auto-approve-rule-referencing-stale-multiplexer-modal-typing-path"
context_clarifier: "src/atdd/coach/observer_rules/bash_auto_approve.py docstring says 'the multiplexer separately sends 1\\n to accept' when classify_prompt returns auto_approve — this describes legacy babysit behavior (src/atdd/coach/commands/_archived/babysit.py backend.send(ref, '1') + send_key Enter) that was superseded when the observer migrated to cli-return injection; the current rule already uses injection_method='cli-return' and no multiplexer send happens at runtime, but the stale docstring misleads readers about the runtime behavior and the fix_hint does not reference the spawn-time allowlist that pre-empts the modal before it fires"
lens: "functional.effectiveness"
statement: "minimize likelihood of bash-auto-approve-rule-referencing-stale-multiplexer-modal-typing-path by removing the 'multiplexer separately sends 1\\n' comment from bash_auto_approve.py and rewriting the rule's fix_hint to reference the spawn-time allowlist and atdd agent escalate for deny-pattern bashes"
acceptances:
  - identity:
      urn: "acc:spawn-agents:E014-UNIT-001-bash-auto-approve-no-multiplexer-send-reference"
      id: "AC-UNIT-001"
      purpose: "bash_auto_approve.py does not contain the string 'multiplexer separately sends' or reference to typing '1\\n' into a modal; the docstring accurately describes cli-return injection as the correction mechanism"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/observer_rules/bash_auto_approve.py source text is read"
    when:
      abstract: "The module source is inspected for stale multiplexer send references"
    then:
      abstract:
        - "The string 'multiplexer separately sends' does not appear in the file"
        - "The string '\"1\\\\n\"' (the modal typing sequence) does not appear in the file"
        - "The module still imports classify_prompt and build_rule is still present"
    metadata:
      author: "atdd:planner"
      created: "2026-05-21"
  - identity:
      urn: "acc:spawn-agents:E014-UNIT-002-bash-auto-approve-fix-hint-references-allowlist"
      id: "AC-UNIT-002"
      purpose: "The ObserverRule returned by build_rule() carries a fix_hint that references the spawn-time allowlist (acceptEdits or allowedTools) and atdd agent escalate for deny-pattern bashes; fix_hint does not reference multiplexer send or modal typing"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "bash_auto_approve.build_rule() is called"
    when:
      abstract: "rule.fix_hint is read from the returned ObserverRule"
    then:
      abstract:
        - "fix_hint contains 'acceptEdits' or 'allowedTools' referencing the spawn-time pre-grant"
        - "fix_hint contains 'atdd agent escalate' as the escalation path for deny-pattern bashes"
        - "fix_hint does not contain 'multiplexer' or '\"1\"' or 'send_key'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-21"
