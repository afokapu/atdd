wagon: govern-providers
urn: wagon:govern-providers
name: Govern Providers
theme: commons
description: Make the mechanism layer explicit so an obligation without a detector
  and a detector without an obligation are both caught, instead of one silently defaulting
  to strict
subject: agent:coder
context: a convention node is an agnostic obligation; a workspace provider is the
  stack-specific mechanism that checks it
action: states the subprocess-not-import boundary and the contract_version SemVer
  refusal, resolves detectors shipped by extension packages as well as workspaces,
  and fails loudly on an implementation bound to a convention nobody declares
goal: make the mechanism layer explicit so an obligation without a detector and a
  detector without an obligation are both caught, instead of one silently defaulting
  to strict
outcome: an explicit provider boundary, extension-shipped detector resolution, and
  loud orphan-detector detection
features:
- urn: feature:govern-providers:govern-providers
produce:
- name: commons:provider-capability
  contract: contract:commons:provider-capability
  telemetry: null
  to: internal
consume: []
wmbt:
  total: 0
