urn: wmbt:govern-providers:D001
step: define
direction: minimize
dimension: likelihood
object_of_control: provider-boundary-erosion
context_clarifier: a convention node is an agnostic obligation and a workspace provider
  is the stack-specific mechanism that checks it; the provider is reached only by
  SUBPROCESS (core imports no provider code, the V5 boundary), declares a contract_version,
  and is refused when no installed contract version satisfies the caret range, so
  a drifted or missing mechanism never silently binds
lens: functional.sustainability
statement: minimize likelihood of provider-boundary-erosion by resolving a workspace
  provider to a subprocess CLI handle that core never imports, requiring the provider
  to declare a contract_version, and refusing resolution when no installed contract
  version satisfies the requested caret range
acceptances:
- identity:
    urn: acc:govern-providers:D001-UNIT-001-provider-resolves-to-subprocess-cli-handle
    id: AC-UNIT-001
    purpose: "resolving a workspace provider yields a filesystem path to its cli/scan.py\
      \ subprocess entrypoint \u2014 a handle core shells out to, never an imported\
      \ module"
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - a candidate root holding a workspace package whose atdd.workspace.yaml declares
      workspace_id 'atdd.workspace.python-pytest' and contract_version '1.1.0', with
      a cli/scan.py file present
  when:
    abstract: resolve_provider(candidate_roots, 'atdd.workspace.python-pytest', '^1.0.0')
      is called
  then:
    abstract:
    - a ResolvedProvider is returned whose provider_cli_path points at the workspace
      package's cli/scan.py
    - provider_cli_path is an existing file on disk (a subprocess entrypoint), not
      a python module object or callable
    - the resolved contract_version is '1.1.0'
  metadata:
    author: atdd:self-compliance
    created: '2026-07-10'
- identity:
    urn: acc:govern-providers:D001-UNIT-002-semver-incompatible-provider-refused
    id: AC-UNIT-002
    purpose: a provider whose installed contract version does not satisfy the requested
      caret range is refused, and an absent workspace_id is refused, before any subprocess
      is spawned
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - a candidate root holding one workspace package declaring workspace_id 'atdd.workspace.python-pytest'
      at contract_version '1.1.0'
  when:
    abstract: resolve_provider is asked for that workspace against an incompatible
      caret range ('^2.0.0'), and separately for a workspace_id absent from the roots
  then:
    abstract:
    - the incompatible caret range raises ContractRangeError
    - the absent workspace_id raises UnknownWorkspaceError
    - a compatible range ('^1.0.0') against the same package resolves successfully
  metadata:
    author: atdd:self-compliance
    created: '2026-07-10'
- identity:
    urn: acc:govern-providers:D001-UNIT-003-runner-invokes-provider-by-subprocess-never-imports
    id: AC-UNIT-003
    purpose: "the runner reaches the resolved provider only by launching it as a subprocess\
      \ (python <cli/scan.py>), never by importing provider code \u2014 the V5 boundary"
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - a ResolvedProvider whose provider_cli_path is a known scan.py path
    - subprocess.run is captured so the argv the runner would launch can be inspected
      without executing it
  when:
    abstract: the runner's provider invocation is driven for one implementation over
      a scan root
  then:
    abstract:
    - "the launched argv is [sys.executable, str(provider_cli_path), ...] \u2014 the\
      \ provider is spawned as a subprocess"
    - no module under .atdd/workspaces or .atdd/extensions is imported by the atdd.enforce
      package (the boundary is a CLI, not an import)
  metadata:
    author: atdd:self-compliance
    created: '2026-07-10'
- identity:
    urn: acc:govern-providers:D001-UNIT-004-provider-run-leaves-no-caches-in-the-vendored-tree
    id: AC-UNIT-004
    purpose: "reaching a provider leaves the vendored tree byte-identical \u2014 the\
      \ provider subprocess writes no __pycache__/ or .pytest_cache/ into the digest-locked\
      \ substrate it was launched from, so a plain enforce run cannot mutate a tree\
      \ core is only supposed to read"
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - a vendored workspace tree whose cli/scan.py imports a sibling module and subprocesses
      python -m pytest over a test file inside that same tree (the real adapter's
      shape)
    - a control run of the same tree with the runner's cache-suppressing env removed,
      proving the tree WOULD be polluted without it
  when:
    abstract: the runner's provider invocation is driven over that vendored tree,
      once with the shipped env and once with the cache-suppressing env removed
  then:
    abstract:
    - "the control run deposits __pycache__/ and .pytest_cache/ inside the vendored\
      \ tree \u2014 the pollution is real and the harness can see it"
    - the shipped run deposits neither, leaving the vendored tree's file set unchanged
  metadata:
    author: atdd:self-compliance
    created: '2026-07-24'
- identity:
    urn: acc:govern-providers:D001-UNIT-005-substrate-digest-covers-source-not-generated-caches
    id: AC-UNIT-005
    purpose: "the substrate digest content-addresses SOURCE \u2014 generated bytecode\
      \ caches left inside a vendored tree are not tamper, while any real source change\
      \ still is, so excluding caches cannot blind the guard"
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - a vendored workspace package installed with a substrate.lock.yaml digest recorded
      over its pristine source
  when:
    abstract: 'verify_substrate is driven over that package after each of: nothing,
      planted __pycache__/*.pyc and .pytest_cache/ files, a non-bytecode file planted
      under a __pycache__ directory, an edited source file, and a deleted source file'
  then:
    abstract:
    - "the pristine tree and the cache-polluted tree both verify intact \u2014 generated\
      \ caches are not tamper"
    - "a non-bytecode file planted under __pycache__ is reported tampered \u2014 the\
      \ exclusion is not a hiding place"
    - "an edited source file and a deleted source file are each reported tampered\
      \ \u2014 real tamper is still caught"
  metadata:
    author: atdd:self-compliance
    created: '2026-07-24'
- identity:
    urn: acc:govern-providers:D001-SMOKE-001-real-vendored-provider-resolves-to-cli-path
    id: AC-SMOKE-001
    purpose: "over the toolkit's real vendored substrate, the python-pytest workspace\
      \ provider resolves to an on-disk cli/scan.py \u2014 the live subprocess boundary"
    phase: SMOKE
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - the toolkit's real substrate_home resolved by the enforce runner (the repo shipping
      this atdd package, with its vendored .atdd/workspaces)
  when:
    abstract: resolve_provider is driven over the real candidate roots for workspace_id
      'atdd.workspace.python-pytest' against '^1.0.0'
  then:
    abstract:
    - a ResolvedProvider is returned
    - its provider_cli_path exists on disk and is a file
  metadata:
    author: atdd:self-compliance
    created: '2026-07-10'
- identity:
    urn: acc:govern-providers:D001-UNIT-006-per-repo-interlocking-layout-emitted-to-provider
    id: AC-UNIT-006
    purpose: "a repo's declared interlocking layout crosses the provider boundary\
      \ as env and nothing else does \u2014 core forwards ATDD_INTERLOCKING_LAYOUT\
      \ to the provider subprocess for a coder.train.interlocking-* rule when the\
      \ repo declares the block, and omits it entirely otherwise, so the detector's\
      \ own scope selectors and defaults stay in force and no unrelated rule's subprocess\
      \ ever sees it"
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - "the train-interlocking detector resolves its scan surfaces by precedence \u2014\
      \ (1) the env var ATDD_INTERLOCKING_LAYOUT holding JSON {selector_id -> [globs]},\
      \ (2) the extension's own scope selectors, (3) hardcoded defaults \u2014 and\
      \ core owns step (1) alone"
    - a repo that declares an interlocking_layout block on the existing .atdd/config.yaml
      surface, and a repo that declares none
    - the provider subprocess call is captured rather than executed, so the exact
      environment core would hand across the V5 boundary is inspectable (the same
      technique as D001-UNIT-003)
  when:
    abstract: the runner's provider invocation is driven for a coder.train.interlocking-*
      rule and for an unrelated rule, against a repo that declares the layout and
      a repo that does not
  then:
    abstract:
    - the declaring repo's interlocking rule receives ATDD_INTERLOCKING_LAYOUT carrying
      the declared mapping verbatim as JSON
    - "a repo that declares nothing produces no ATDD_INTERLOCKING_LAYOUT at all \u2014\
      \ absent, not empty, so the detector falls back to its own selectors rather\
      \ than reading core's silence as \"no globs\""
    - a non-interlocking rule's subprocess never carries the variable, so a per-repo
      scan surface cannot leak onto a rule it was never declared for
    - "the resolver reads the block off the config surface the runner already loads\
      \ and normalizes it to the contract's selector ids, dropping an unknown selector\
      \ or a malformed glob list with a warning rather than raising \u2014 a scan-surface\
      \ hint must not sink an enforce run"
  metadata:
    author: atdd:self-compliance
    created: '2026-07-25'
