urn: wmbt:reconcile-local-store:P001
step: prepare
direction: maximize
dimension: likelihood
object_of_control: store-base-commit
context_clarifier: when the local store is hydrated from the committed projection,
  the commit it was hydrated from is written to the store metadata table and advanced
  only on a successful reconcile, so base_projection is resolvable without guessing
lens: functional.availability
statement: maximize likelihood of a durable store-base-commit stamped into the local
  store metadata at every hydrate and advanced only on successful reconcile, so reconcile
  can resolve base_projection deterministically
acceptances:
- given:
    abstract:
    - A git checkout at commit <C> carrying .atdd/state/projection/<uid>.yaml
    - An empty local store
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-001
    phase: GREEN
    purpose: hydrate() writes store_base_commit into the store metadata table, equal
      to the commit the projection was read from
    urn: acc:reconcile-local-store:P001-UNIT-001-hydrate-stamps-base-commit
  metadata:
    author: atdd:self-compliance
    created: '2026-07-09'
  then:
    abstract:
    - The store metadata table holds store_base_commit == C
    - The metadata also carries the store schema version and a clean dirty marker
    - Re-hydrating at the same commit is idempotent and rewrites the same value
  when:
    abstract: hydrate(projection @ C) is called
- given:
    abstract:
    - A local store whose metadata has no store_base_commit, or one naming an unknown
      commit sha
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-002
    phase: RED
    purpose: reconcile refuses to run when store_base_commit is absent or names a
      commit not reachable in the repository
    urn: acc:reconcile-local-store:P001-UNIT-002-reconcile-refuses-absent-base-commit
  metadata:
    author: atdd:self-compliance
    created: '2026-07-09'
  then:
    abstract:
    - A StoreBaseCommitError is raised naming the missing or unresolvable commit
    - No sqlite mutation and no projection read of the base commit is attempted
    - The operator is told to re-hydrate rather than reconcile
  when:
    abstract: reconcile(new_head) is called
