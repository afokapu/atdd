wmbt:
  C001: minimize likelihood of a dirty-store-overwrite during reconcile
  E001: maximize likelihood of a complete overlay-event-log recording every uncommitted
    local authoring command
  K001: maximize likelihood of a proven collaboration-flow in which Dev B keeps private
    work across Dev A's merge
  M001: maximize likelihood of a head-change-reconcile firing on every operation that
    moves HEAD
  P001: maximize likelihood of a durable store-base-commit stamped on the local store
    at every hydrate
  P002: maximize likelihood of cold-start-hydrate succeeding when no store or no base
    commit exists and no overlay is present, while refusing and emitting remediation
    when a store is missing its base commit but carries overlay events
  R001: maximize likelihood of a correct overlay-replay onto the freshly hydrated
    incoming projection
  R002: maximize likelihood of an actionable conflict-report with a retained backup
    when replay is invalid
  Y001: minimize likelihood of overlay-event-replayed-twice by giving each event a
    stable event_id and a status (pending/projected/committed/discarded/conflicted),
    recording which events a projection represents, and replaying only pending or
    projected-but-uncommitted events
  total: 9
