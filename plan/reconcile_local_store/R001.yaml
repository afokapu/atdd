urn: wmbt:reconcile-local-store:R001
step: resolve
direction: maximize
dimension: likelihood
object_of_control: overlay-replay
context_clarifier: when HEAD has moved, reconcile hydrates the incoming projection
  into public state, replays the explicit overlay on top, re-projects affected objects
  and advances store_base_commit; a store with no overlay reduces to plain hydrate
lens: functional.effectiveness
statement: maximize likelihood of a correct overlay-replay onto the freshly hydrated
  incoming projection, re-projecting affected objects and advancing store_base_commit
  only when the replay is wholly valid
acceptances:
- given:
    abstract:
    - A store at store_base_commit B with a valid overlay of local authoring events
    - An incoming projection at new HEAD H touching disjoint objects
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-001
    phase: GREEN
    purpose: reconcile hydrates the incoming projection into public state, replays
      the overlay on top, re-projects affected objects, and advances store_base_commit
    urn: acc:reconcile-local-store:R001-UNIT-001-reconcile-replays-overlay-onto-incoming
  metadata:
    author: atdd:self-compliance
    created: '2026-07-09'
  then:
    abstract:
    - The store equals hydrate(incoming_projection) with the overlay replayed on top
    - Objects affected by the replay are re-projected
    - store_base_commit advances from B to H
    - A store with no overlay reduces to plain hydrate(incoming_projection)
  when:
    abstract: atdd state reconcile is invoked with HEAD == H
- given:
    abstract:
    - A store at store_base_commit B whose overlay requests a phase transition on
      an object the incoming projection has since tombstoned
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-002
    phase: RED
    purpose: an overlay event that no longer applies to the incoming public state
      stops the replay without advancing store_base_commit
    urn: acc:reconcile-local-store:R001-UNIT-002-invalid-replay-does-not-advance-base
  metadata:
    author: atdd:self-compliance
    created: '2026-07-09'
  then:
    abstract:
    - The replay stops at the first invalid event
    - store_base_commit remains B
    - The partially replayed store is discarded and never persisted
  when:
    abstract: atdd state reconcile is invoked with HEAD == H
