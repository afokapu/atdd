urn: wmbt:reconcile-local-store:C001
step: confirm
direction: minimize
dimension: likelihood
object_of_control: dirty-store-overwrite
context_clarifier: when reconcile runs against a store whose overlay_events are non-empty,
  the gate classifies it dirty, backs up state.sqlite before any mutation, and routes
  to replay; every plain hydrate-overwrite path raises before touching sqlite
lens: functional.sustainability
statement: minimize likelihood of a dirty-store-overwrite by classifying a non-empty
  overlay as dirty, backing up before any mutation, and raising on every overwrite
  path
acceptances:
- given:
    abstract:
    - A hydrated local store carrying at least one uncommitted overlay event
    - An incoming projection at a new HEAD
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-001
    phase: GREEN
    purpose: a store with non-empty overlay_events is classified dirty, backed up
      before any mutation, and routed to replay rather than overwrite
    urn: acc:reconcile-local-store:C001-UNIT-001-dirty-store-is-backed-up-not-overwritten
  metadata:
    author: atdd:self-compliance
    created: '2026-07-09'
  then:
    abstract:
    - The store is reported dirty and the overlay event count is surfaced
    - A backup of state.sqlite is written before any mutation and its path is returned
    - The gate selects the backup-hydrate-replay path, never plain hydrate-overwrite
  when:
    abstract: the dirty-store gate is evaluated ahead of reconcile
- given:
    abstract:
    - A dirty local store with uncommitted overlay events
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-002
    phase: RED
    purpose: any code path that would replace a dirty store with hydrate(incoming)
      raises before touching sqlite
    urn: acc:reconcile-local-store:C001-UNIT-002-overwrite-path-raises-before-mutation
  metadata:
    author: atdd:self-compliance
    created: '2026-07-09'
  then:
    abstract:
    - A DirtyStoreError is raised naming the overlay events that would be lost
    - state.sqlite is byte-identical to its pre-call content
    - The clean-store case still hydrates without a backup
  when:
    abstract: a caller invokes the overwrite path hydrate(incoming_projection) directly
