urn: "wmbt:coach-ops:M001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "monitor"
direction: "minimize"
dimension: "likelihood"
object_of_control: "secondary-rate-limit-hits-during-batched-pr-polling"
context_clarifier: "when coach or an agent polls GitHub PR status during a dense wave (4-8 PRs in flight) and must determine merge state without triggering GitHub secondary rate limits; the root causes are per-PR gh pr view calls, statusCheckRollup always fetched, and tight polling intervals"
lens: "functional.effectiveness"
statement: "minimize likelihood of secondary-rate-limit-hits-during-batched-pr-polling by implementing coach.runtime.pr_watcher with a single gh pr list call per cycle (regardless of PR count), deferring statusCheckRollup to on-demand failures(), enforcing a 180s minimum poll interval, performing a pre-flight rate-limit budget check, and applying exponential backoff (180s→600s→1200s) on 403-abuse responses"
acceptances:
  - identity:
      urn: "acc:coach-ops:M001-UNIT-001-batched-poll-single-api-call"
      id: "AC-UNIT-001"
      purpose: "poll(prs=[N1,N2,N3,N4]) issues exactly one gh pr list call regardless of PR count"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A mock for subprocess that records gh invocations"
        - "A list of 4 PR numbers [101, 102, 103, 104]"
    when:
      abstract: "pr_watcher.poll(prs=[101, 102, 103, 104]) is called"
    then:
      abstract:
        - "Exactly one gh subprocess call was made"
        - "The call uses --json number,mergeStateStatus (no statusCheckRollup)"
        - "The returned dict maps each PR number to its mergeStateStatus string"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:coach-ops:M001-UNIT-002-cheap-state-default"
      id: "AC-UNIT-002"
      purpose: "default poll response contains mergeStateStatus only — no statusCheckRollup field"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A mock gh response with number and mergeStateStatus fields only"
    when:
      abstract: "pr_watcher.poll() is called with default options"
    then:
      abstract:
        - "The returned dict values are plain strings (the mergeStateStatus value)"
        - "No statusCheckRollup data appears in any return value or intermediate structure"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:coach-ops:M001-UNIT-003-failures-on-demand"
      id: "AC-UNIT-003"
      purpose: "failures(pr_number) fetches statusCheckRollup for that single PR and returns failing check names"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A mock gh pr view response with statusCheckRollup containing one FAILURE check"
        - "No prior call to poll() in this test"
    when:
      abstract: "pr_watcher.failures(pr=101) is called"
    then:
      abstract:
        - "Exactly one gh pr view call is made for PR 101 with --json statusCheckRollup"
        - "The returned list contains the name(s) of the failing check(s)"
        - "No additional gh calls are made beyond this single pr view"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:coach-ops:M001-INTEGRATION-001-backoff-on-secondary-limit"
      id: "AC-INTEGRATION-001"
      purpose: "simulated 403 abuse response triggers exponential backoff sequence 180s→600s→1200s"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A mock gh that returns a 403 secondary-rate-limit error on the first two poll calls, then succeeds on the third"
        - "time.sleep is patched to record delays without actually sleeping"
    when:
      abstract: "pr_watcher.poll() is called three times in sequence"
    then:
      abstract:
        - "First failure triggers a sleep of 600s (first backoff step)"
        - "Second failure triggers a sleep of 1200s (second backoff step)"
        - "Third call (success) resets backoff state to normal interval"
        - "No unhandled exception is raised"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:coach-ops:M001-INTEGRATION-002-preflight-budget-check"
      id: "AC-INTEGRATION-002"
      purpose: "when gh api rate_limit shows <500 graphql points, poll cycle is skipped and operator notified once"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A mock gh api rate_limit response returning 450 graphql remaining points"
        - "A mock for the poll inner call (gh pr list)"
    when:
      abstract: "pr_watcher.poll() is called"
    then:
      abstract:
        - "gh pr list is NOT called (poll cycle skipped)"
        - "The returned dict is empty (or None) with a skip reason"
        - "A notification/warning is emitted exactly once (not on every poll)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:coach-ops:M001-INTEGRATION-003-coach-watch-cli-batched"
      id: "AC-INTEGRATION-003"
      purpose: "atdd coach watch with 4 PRs makes a single gh pr list call"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A mock gh that records all subprocess calls"
        - "Rate limit mock returning 5000 remaining"
    when:
      abstract: "run_watch(['101', '102', '103', '104']) is called"
    then:
      abstract:
        - "Exactly one gh pr list call is recorded"
        - "Output contains a status line for each requested PR"
        - "Exit code is 0"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:coach-ops:M001-INTEGRATION-004-agent-wait-ci-uses-watcher"
      id: "AC-INTEGRATION-004"
      purpose: "atdd agent wait-ci routes through pr_watcher.poll — same batched behavior"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A mock gh pr list returning CLEAN for a specific PR number"
        - "An agent runtime dir with a pr_number file or --pr argument"
    when:
      abstract: "run_agent(['wait-ci', '--pr', '101']) is called"
    then:
      abstract:
        - "poll() is invoked (verified via mock call count)"
        - "When the PR state is CLEAN, exit code is 0 and the PR number is printed"
        - "No direct gh pr view calls are made (only gh pr list)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
