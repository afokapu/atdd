urn: wmbt:migrate-projection-authority:E002
step: execute
direction: maximize
dimension: likelihood
object_of_control: store-projection-migration
context_clarifier: 'when the legacy manifest is already decommissioned and the State Store is the only
  surviving source of truth: the migration mints immutable identity and an owner for every legacy work
  item directly in the store, because the manifest-keyed path (E001) can no longer run against an artifact
  that no longer exists'
lens: functional.effectiveness
statement: maximize likelihood of a store-projection-migration that mints a uid and an owner_actor for
  every projectable work item already in the State Store and refuses the whole run before any write when
  an object cannot be migrated
acceptances:
- given:
    abstract:
    - A State Store whose work items carry slug-shaped uids and no owner_actor, and a repo with no committed
      projection
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-001
    phase: RED
    purpose: the store-native migration mints an immutable uid and an owner_actor for every projectable
      work item, so identity stops depending on the deleted manifest
    urn: acc:migrate-projection-authority:E002-UNIT-001-mints-identity-in-the-store
  metadata:
    author: atdd:state-projection-plan
    created: '2026-07-26'
  then:
    abstract:
    - Every projectable work item carries a uid matching the contract's identity pattern
    - Every projectable work item carries an owner_actor
    - The object's prior identity remains resolvable, so no existing reference is orphaned
    - 'RED: no store-native mint path exists today — mint_uids operates only on the manifest'
  when:
    abstract: the store-native projection migration is run
- given:
    abstract:
    - A State Store holding one work item that cannot be migrated
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-002
    phase: RED
    purpose: a single unmigratable object refuses the whole run before any write, so a half-migrated store
      is never produced
    urn: acc:migrate-projection-authority:E002-UNIT-002-refuses-before-any-write
  metadata:
    author: atdd:state-projection-plan
    created: '2026-07-26'
  then:
    abstract:
    - The run exits non-zero naming the offending object and the reason
    - No object in the store was mutated
    - No projection file was written
  when:
    abstract: the store-native projection migration is run
- identity:
    urn: acc:migrate-projection-authority:E002-SMOKE-001-store-projection-migration
    id: AC-SMOKE-001
    phase: SMOKE
    purpose: 'End-to-end: store-projection-migration holds against a real repo checkout, the installed
      atdd CLI, and a real .atdd/state/state.sqlite — no manual patching.'
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A real repo checkout, the installed atdd CLI, and a real local State Store exercising store-projection-migration
  when:
    abstract: the E002 behavior is driven end-to-end through the real CLI
  then:
    abstract:
    - store-projection-migration is observed to hold end-to-end against real infrastructure, with no mocks
      or manual patching
  metadata:
    author: atdd:self-compliance
    created: '2026-07-26'
- identity:
    id: AC-UNIT-003
    phase: RED
    purpose: after a SUCCESSFUL migration a backup still holds the pre-migration store and can be restored
      from, so the operator retains a real undo; preservation is stated over the store's logical snapshot,
      because backup_store checkpoints the live WAL and the file's bytes therefore move before any migration
      runs
    urn: acc:migrate-projection-authority:E002-UNIT-003-the-backup-survives-a-successful-migration
  harness:
    category: backend
    type: unit
  given:
    abstract:
    - A live WAL-mode State Store of legacy slug-keyed work items with no owner_actor, with an open connection
      and recent commits still in the write-ahead log — not a quiesced, pre-checkpointed file
  when:
    abstract: the store-native projection migration is run to completion and succeeds
  then:
    abstract:
    - The backup's logical snapshot equals the store's snapshot as it stood before the run — every row
      of objects, relationships, events, external_refs, overlay_events, inbox, outbox and store_metadata
    - Restoring the backup returns the live store to that same snapshot
    - The live store is fully migrated, so its snapshot differs from the backup's
    - The migration mutates a scratch copy; the backup file is never opened for writing
    - 'The byte-identity of state.sqlite is NOT asserted: backup_store checkpoints the live file first,
      so its bytes change before the migration begins and a byte-identical claim would fail a correct
      implementation'
    - 'RED: migrate_cli takes no backup at all, and the specified design migrated the backup_store() file
      itself, leaving no undo even on success'
  metadata:
    author: atdd:issue-2024
    created: '2026-09-14'
- identity:
    id: AC-UNIT-004
    phase: GREEN
    purpose: 'a GUARD on the repair, not a demonstration of the current defect: these properties hold
      vacuously today because the migration mutates in place, and the copy/swap fix is what would introduce
      the loss — so they must hold before AND after'
    urn: acc:migrate-projection-authority:E002-UNIT-004-the-migration-window-loses-nothing
  harness:
    category: backend
    type: unit
  given:
    abstract:
    - A WAL-mode State Store shared by more than one writer, as the sibling-worktree layout intends
  when:
    abstract: a second writer commits to the live store while the migration is in flight, and the migration
      is separately interrupted part-way
  then:
    abstract:
    - The concurrent write either survives the swap or its writer is refused with an explicit lock error;
      it is never silently discarded
    - A concurrent reader is not blocked while the migration holds its fence
    - After an interruption the live store holds the same objects with the same content as before the
      run, stated over the snapshot rather than the file's bytes
    - The swapped store carries no stale -wal or -shm beside it and reopens without error
    - 'NOT RED: today the migration mutates the live store in place, so there is no snapshot window and
      a concurrent write survives by accident while a crash destroys the store instead. These assertions
      pass now and must still pass once copy/swap lands — that is precisely their value, and labelling
      them RED would misreport it'
  metadata:
    author: atdd:issue-2024
    created: '2026-09-14'
