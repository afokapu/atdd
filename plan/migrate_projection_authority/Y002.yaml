urn: wmbt:migrate-projection-authority:Y002
step: modify
direction: minimize
dimension: likelihood
object_of_control: manifest-read-fallback
context_clarifier: 'when CORE-034 lands after projection reaches blocking mode: no core reader may fall
  back to .atdd/manifest.yaml for shared lifecycle state, and the manifest readers are removed rather
  than deprecated in place'
lens: functional.effectiveness
statement: 'minimize likelihood of a manifest-read-fallback: once projection is in blocking mode, no core
  reader consults .atdd/manifest.yaml for shared lifecycle state'
acceptances:
- given:
    abstract:
    - A repo with a complete committed projection and .atdd/manifest.yaml deleted
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-001
    phase: RED
    purpose: deleting .atdd/manifest.yaml changes no core read result once projection is authoritative
    urn: acc:migrate-projection-authority:Y002-UNIT-001-absent-manifest-does-not-degrade-reads
  metadata:
    author: atdd:state-projection-plan
    created: '2026-07-09'
  then:
    abstract:
    - All reads resolve from the projection with results identical to the manifest-present run
    - 'RED: several readers raise or silently degrade today when the manifest is absent'
  when:
    abstract: every core lifecycle read is exercised
- given:
    abstract:
    - The core source tree after the manifest read-fallback is decommissioned
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-002
    phase: GREEN
    purpose: no core module retains a read path against the manifest file
    urn: acc:migrate-projection-authority:Y002-UNIT-002-no-core-reader-references-manifest
  metadata:
    author: atdd:state-projection-plan
    created: '2026-07-09'
  then:
    abstract:
    - No core module opens, globs, or parses .atdd/manifest.yaml for lifecycle state
    - The removed readers' tests are deleted or retargeted at the projection reader
  when:
    abstract: the source tree is scanned for manifest read paths
- given:
    abstract:
    - The shipped `atdd state` verb surface after the manifest read-fallback is decommissioned
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-003
    phase: RED
    purpose: no registered verb resolves .atdd/manifest.yaml as its input, which the module scan cannot
      see because the read happens inside a declared-exempt module
    urn: acc:migrate-projection-authority:Y002-UNIT-003-no-registered-verb-reads-the-manifest
  metadata:
    author: atdd:state-projection-plan
    created: '2026-09-14'
  then:
    abstract:
    - No verb in the `atdd state` parser, OPS tuple, or dispatch map resolves .atdd/manifest.yaml as its
      input
    - 'RED: `mint-uids` and `migrate-manifest` are registered today and both fail with "no legacy manifest
      to migrate" on any real repo'
    - The three surfaces that register a verb — OPS, add_parsers, dispatch — agree on the same verb set
  when:
    abstract: the registered verb surface is enumerated and each verb's input is resolved
- given:
    abstract:
    - The shadow drift report, whose manifest source calls read_manifest(manifest_path(root))
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-004
    phase: RED
    purpose: the drift report offers no comparison source that resolves .atdd/manifest.yaml, so a
      shipped command holds no manifest read path
    urn: acc:migrate-projection-authority:Y002-UNIT-004-shadow-offers-no-manifest-source
  metadata:
    author: atdd:state-projection-plan
    created: '2026-09-14'
  then:
    abstract:
    - SOURCES names exactly the sources that can be produced, and the manifest is not among them
    - No helper remains that resolves the manifest path on behalf of the report
    - 'RED: SOURCE_MANIFEST is declared today and its helper reads the manifest that CORE-034 deleted'
  when:
    abstract: the drift report's comparison sources are enumerated
- identity:
    urn: acc:migrate-projection-authority:Y002-SMOKE-001-manifest-read-fallback
    id: AC-SMOKE-001
    phase: SMOKE
    purpose: 'End-to-end: manifest-read-fallback holds against a real repo checkout, the installed atdd
      CLI, and a real .atdd/state/state.sqlite — no manual patching.'
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A real repo checkout, the installed atdd CLI, and a real local State Store exercising manifest-read-fallback
  when:
    abstract: the Y002 behavior is driven end-to-end through the real CLI
  then:
    abstract:
    - manifest-read-fallback is observed to hold end-to-end against real infrastructure, with no mocks
      or manual patching
  metadata:
    author: atdd:self-compliance
    created: '2026-07-10'
- identity:
    urn: acc:migrate-projection-authority:Y002-SMOKE-002-shipped-cli-offers-no-manifest-verb
    id: AC-SMOKE-002
    phase: SMOKE
    purpose: 'End-to-end: the real `atdd state` CLI rejects the manifest-era verbs as unknown rather than
      failing on an input that cannot exist, still offers the live migration, and the doc-integrity checks
      pass over the reduced surface.'
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A real repo checkout and the shipped atdd CLI, with no .atdd/manifest.yaml
  when:
    abstract: the retired verbs are typed at the real command surface
  then:
    abstract:
    - Each retired verb is refused as an invalid choice, not run and failed
    - '`atdd state migrate-store` is still offered — the successor did not go out with them'
    - '`atdd state runbook-check` and `atdd state rollout-check` pass against this checkout'
  metadata:
    author: atdd:state-projection-plan
    created: '2026-09-14'
