urn: wmbt:migrate-projection-authority:M001
step: monitor
direction: maximize
dimension: likelihood
object_of_control: shadow-projection-report
context_clarifier: 'when CORE-032''s shadow-mode CI job runs before projection becomes blocking: it recomputes
  the projection from the store and reports drift against the committed projection, without failing the build —
  and reports rather than raises when the projection cannot be computed at all (#2023)'
lens: functional.effectiveness
statement: maximize likelihood of a shadow-projection-report that recomputes the projection on every push
  and surfaces drift against the committed projection while remaining non-blocking on every path, including
  one on which the projection cannot be computed
acceptances:
- given:
    abstract:
    - A repo whose committed projection disagrees with project(store) for one work item
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-001
    phase: RED
    purpose: shadow mode reports drift and still exits zero, so it cannot block a merge while the cutover
      is staged
    urn: acc:migrate-projection-authority:M001-UNIT-001-reports-drift-without-failing
  metadata:
    author: atdd:state-projection-plan
    created: '2026-07-09'
  then:
    abstract:
    - The drift is reported with the uid and the differing fields
    - The check exits zero because shadow mode is non-blocking
    - 'RED: no shadow-mode check exists today'
  when:
    abstract: the shadow-mode projection check is run
- given:
    abstract:
    - A repo whose committed projection is byte-identical to project(store)
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-002
    phase: GREEN
    purpose: a repo whose committed projection already equals project(store) produces an empty drift report
    urn: acc:migrate-projection-authority:M001-UNIT-002-clean-repo-reports-no-drift
  metadata:
    author: atdd:state-projection-plan
    created: '2026-07-09'
  then:
    abstract:
    - The drift report is empty
    - The check exits zero
  when:
    abstract: the shadow-mode projection check is run
- given:
    abstract:
    - A store whose documents cannot be projected, so build_documents raises before any source is read
  harness:
    category: backend
    type: unit
  identity:
    id: AC-UNIT-003
    phase: RED
    purpose: the non-blocking exit code is the invariant on EVERY path, including the store side,
      which is computed before the per-source loop and outside any handler
    urn: acc:migrate-projection-authority:M001-UNIT-003-store-side-failure-still-exits-zero
  metadata:
    author: atdd:state-projection-plan
    created: '2026-09-14'
  then:
    abstract:
    - The run exits SHADOW_EXIT_CODE rather than raising, honouring compare()'s own "never raises to
      gate"
    - The failure is reported as an unavailable source, with its reason, on stdout
    - 'RED: the projection error escapes as a traceback and the command exits 1, through the one
      constant declared so the CLI, the workflow and the tests cannot drift from it'
  when:
    abstract: the shadow-mode projection check is run against that store
- identity:
    urn: acc:migrate-projection-authority:M001-SMOKE-001-shadow-projection-report
    id: AC-SMOKE-001
    phase: SMOKE
    purpose: 'End-to-end: shadow-projection-report holds against a real repo checkout, the installed atdd
      CLI, and a real .atdd/state/state.sqlite — no manual patching.'
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A real repo checkout, the installed atdd CLI, and a real local State Store exercising shadow-projection-report
  when:
    abstract: the M001 behavior is driven end-to-end through the real CLI
  then:
    abstract:
    - shadow-projection-report is observed to hold end-to-end against real infrastructure, with no mocks
      or manual patching
  metadata:
    author: atdd:self-compliance
    created: '2026-07-10'
- identity:
    urn: acc:migrate-projection-authority:M001-SMOKE-002-dead-run-exits-zero-and-says-so
    id: AC-SMOKE-002
    phase: SMOKE
    purpose: 'End-to-end: the real `atdd state shadow`, against a real store that cannot be projected, exits
      0 and writes a report naming the failure; and the CI step that publishes it cannot render that failure
      as an empty, clean-looking drift block.'
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - A real repo checkout whose real State Store holds an object the projection guard must refuse
  when:
    abstract: the real shadow command is run, and the workflow step that publishes it is replayed verbatim
  then:
    abstract:
    - The command exits SHADOW_EXIT_CODE and its stdout names the offending field
    - The report never reads 'no drift' when nothing was compared
    - The replayed CI step publishes a non-empty report that shows the failure
  metadata:
    author: atdd:state-projection-plan
    created: '2026-09-14'
