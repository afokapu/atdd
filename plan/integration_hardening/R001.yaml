urn: "wmbt:integration-hardening:R001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "resolve"
direction: "minimize"
dimension: "quantity"
object_of_control: "unreviewed-phase-boundary-transitions-in-atdd-coach"
context_clarifier: "when atdd coach <N> exits a phase boundary in the --review-phases set (PLANNED, RED, GREEN, SMOKE, REFACTOR by default) and must spawn the N5 reviewer persona, validate review-report.json against the schema and hard rules, and route on verdict (pass→advance state, concern→judge call site #2, fail→respawn phase agent with reviewer findings as spawn-feedback)"
lens: "functional.effectiveness"
statement: "minimize quantity of unreviewed-phase-boundary-transitions-in-atdd-coach when coach exits each enabled phase boundary and must spawn the N5 reviewer, validate the review-report, and route on verdict"
acceptances:
  - identity:
      urn: "acc:integration-hardening:R001-INTEGRATION-001-reviewer-at-phase-boundary"
      id: "AC-INTEGRATION-001"
      purpose: "With default --review-phases, a reviewer spawns at each of PLANNED/RED/GREEN/SMOKE/REFACTOR boundaries; review-report.json appears at the expected path"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "N1 (#526), N2 (#527), N3 (#528), N4 (#529), N5 (#530) are merged"
        - "atdd coach <N> with default --review-phases"
    when:
      abstract: "Coach exits PLANNED, RED, GREEN, SMOKE, and REFACTOR phase boundaries"
    then:
      abstract:
        - "A reviewer agent spawns at each boundary using the appropriate src/atdd/coach/prompts/persona/reviewer/<phase>.prompt.yaml"
        - "review-report.json appears at .atdd/runtime/agents/<reviewer-id>/reviews/<review-id>.json"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:R001-INTEGRATION-002-verdict-routing"
      id: "AC-INTEGRATION-002"
      purpose: "pass advances state; concern invokes judge call site #2; fail respawns the coder with reviewer findings"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A reviewer produces each of the three verdict types (pass, concern, fail) in separate test scenarios"
    when:
      abstract: "Coach processes the review-report.json verdict"
    then:
      abstract:
        - "pass: state machine advances to next phase"
        - "concern: judge call site #2 (#529) is invoked; result determines block or annotate-and-continue"
        - "fail: phase agent is respawned with reviewer findings embedded as spawn-feedback"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:R001-INTEGRATION-003-skip-review-honored"
      id: "AC-INTEGRATION-003"
      purpose: "--skip-review runs the full lifecycle without any reviewer spawn; review-report.json is absent"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach <N> invoked with --skip-review"
    when:
      abstract: "Coach advances through all phase boundaries"
    then:
      abstract:
        - "No reviewer agent is spawned at any boundary"
        - "review-report.json is absent from all runtime agent paths"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
