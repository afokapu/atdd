wagon: integration-hardening
urn: "wagon:integration-hardening"
name: "Integration Hardening"
description: "Wires the eight integration gaps discovered during the integrate-end-to-end run: K1 spawn-agents at every state transition, J3 decisions.jsonl write-before-action discipline, J5 watcher-driven reactive state advancement, M3 validator dispatch at phase-exit gates, L1 observer co-spawn alongside each phase agent, N5 reviewer spawn at phase boundaries, J4 two-phase commit at COMPLETE, and production LLM client registration. Together these gaps mean atdd coach <N> prints and exits rather than driving a real issue to MERGED."
theme: commons

subject: "agent:coach"
context: "in-coach-v9-integration-hardening, integrate-end-to-end-revealed-eight-wiring-gaps-between-shipped-components-and-the-atdd-coach-state-machine"
action: "wires K1 spawn, J3 decisions.jsonl, J5 watcher, M3 validator dispatch, L1 observer, N5 reviewer, J4 two-phase commit, and production LLM registry into src/atdd/coach/commands/coach.py and supporting handler modules"
goal: "close all eight wiring gaps so atdd coach <N> can drive a real issue from INIT to MERGED without operator intervention"
outcome: "atdd coach <N> autonomously drives an issue through the full lifecycle: spawning the right persona at each transition, writing durable decisions before side-effects, advancing state reactively via J5 watcher events, gating phase exits on M3 validator results, correcting agents via L1 observer, reviewing at phase boundaries via N5, merging via J4 two-phase commit, and resolving LLM calls via registered production clients"

features:
  - urn: "feature:integration-hardening:coach-single-command-driver"
  - urn: "feature:integration-hardening:coach-cold-start-wiring"
  - urn: "feature:integration-hardening:coach-graph-aware-orchestration"
  - urn: "feature:integration-hardening:coach-resume-wiring"
  - urn: "feature:integration-hardening:pre-push-version-gate-never-auto-upgrades"

