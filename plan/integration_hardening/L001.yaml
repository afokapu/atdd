urn: "wmbt:integration-hardening:L001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "locate"
direction: "minimize"
dimension: "quantity"
object_of_control: "uncorrected-agent-violations-during-phase-execution"
context_clarifier: "when atdd coach <N> spawns a phase agent and must co-spawn an L1 observer process subscribed to the agent's events.jsonl and screen capture, applying the phase-appropriate rule subset (L2-L6: token-threshold, naming-drift, layout-drift, smoke-skip, substrate-aware) and injecting corrections via the cli-return channel"
lens: "functional.effectiveness"
statement: "minimize quantity of uncorrected-agent-violations-during-phase-execution when coach co-spawns an L1 observer alongside each phase agent, subscribed to events.jsonl and screen capture, injecting corrections via cli-return for each predicate-matching rule"
acceptances:
  - identity:
      urn: "acc:integration-hardening:L001-INTEGRATION-001-observer-alongside-agent"
      id: "AC-INTEGRATION-001"
      purpose: "Every spawned phase agent has a co-spawned observer; observer pid is recorded; correction events appear in events.jsonl when a rule predicate fires"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "L1 observer skeleton (#500) and the L2-L6 absorbed rule subset are merged"
        - "A running atdd coach <N> session spawning a phase agent"
    when:
      abstract: "Coach spawns the phase agent at any of the 5 persona-transitions"
    then:
      abstract:
        - "An observer process is co-spawned with the phase-appropriate rule subset"
        - "The observer's pid is recorded in .atdd/runtime/agents/<id>/"
        - "When an observer rule predicate fires, a correction event is appended to the agent's events.jsonl"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
