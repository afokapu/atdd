urn: "wmbt:integration-hardening:P001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "prepare"
direction: "minimize"
dimension: "likelihood"
object_of_control: "incomplete-merge-lifecycle-at-atdd-coach-complete-state"
context_clarifier: "when atdd coach <N> reaches COMPLETE state and must invoke J4 two-phase commit (PR creation via atdd pr <N> validating default-branch base per #477, CI-clean and reviewer wait, squash merge via gh pr merge --squash --delete-branch, release tag v<version>, worktree and cmux cleanup) with --auto-merge flag governing operator-approval requirement and BLOCKED-state routing on any failure"
lens: "functional.availability"
statement: "minimize likelihood of incomplete-merge-lifecycle-at-atdd-coach-complete-state when coach reaches COMPLETE and must invoke the J4 two-phase commit sequence with auto-merge flag and BLOCKED routing on failure"
acceptances:
  - identity:
      urn: "acc:integration-hardening:P001-INTEGRATION-001-complete-triggers-merge"
      id: "AC-INTEGRATION-001"
      purpose: "With --auto-merge, COMPLETE state invokes atdd pr <N> then gh pr merge --squash; release tag is created; decisions.jsonl records MERGED"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "J4 two-phase commit (#502) is merged"
        - "atdd coach <N> invoked with --auto-merge; issue has reached COMPLETE state"
    when:
      abstract: "Coach processes the COMPLETE state"
    then:
      abstract:
        - "atdd pr <N> is invoked first (validates default-branch base per #477)"
        - "gh pr merge --squash --delete-branch executes after CI clean and reviewer pass"
        - "Release tag v<version> is created on the merge commit"
        - "decisions.jsonl records MERGED state"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:P001-INTEGRATION-002-cleanup"
      id: "AC-INTEGRATION-002"
      purpose: "Post-MERGED, the worktree directory is removed and the cmux tab/pane is closed"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The issue has successfully reached MERGED state"
    when:
      abstract: "Coach executes the post-merge cleanup step"
    then:
      abstract:
        - "The worktree directory is removed via git worktree remove"
        - "The cmux tab/pane for the issue is closed"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:P001-INTEGRATION-003-no-auto-merge-without-flag"
      id: "AC-INTEGRATION-003"
      purpose: "Without --auto-merge, COMPLETE state remains pending operator approval; escalation sent; manual --resume --auto-merge completes the merge"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach <N> invoked without --auto-merge; issue reaches COMPLETE state"
    when:
      abstract: "Coach processes the COMPLETE state"
    then:
      abstract:
        - "COMPLETE state remains pending; no automatic merge is performed"
        - "An escalation is sent via --escalation-channel requesting operator approval"
        - "atdd coach --resume <run-id> --auto-merge successfully completes the merge"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
