urn: "wmbt:integration-hardening:L003"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "locate"
direction: "minimize"
dimension: "quantity"
object_of_control: "persona-spawns-via-entry-points-that-lack-observer-cospawn-due-to-handler-only-wiring"
context_clarifier: "when atdd spawn, atdd orchestrate, or any future dispatch path creates a persona surface without running the coach state-machine handler, the observer sidecar is absent because _spawn_observer only fired from handlers/spawn.py::handle(); lifting the observer co-spawn into Multiplexer.new_persona_surface ensures every entry point co-spawns the observer without coupling to the state machine"
lens: "functional.effectiveness"
statement: "minimize quantity of persona-spawns-via-entry-points-that-lack-observer-cospawn-due-to-handler-only-wiring when atdd spawn or orchestrate creates a persona surface outside the coach state machine, requiring Multiplexer.new_persona_surface to atomically co-spawn the observer so that every persona surface has a paired observer regardless of which entry point initiated the spawn"
acceptances:
  - identity:
      urn: "acc:integration-hardening:L003-UNIT-001-multiplexer-abc-supports-new-persona-surface"
      id: "AC-UNIT-001"
      purpose: "MultiplexerBackend.new_persona_surface exists; FakeMultiplexer implements it and records calls in new_persona_surface_calls"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "FakeMultiplexer instantiated"
    when:
      abstract: "new_persona_surface(...) is called on FakeMultiplexer"
    then:
      abstract:
        - "Returns a persona surface ref"
        - "new_persona_surface_calls has 1 entry"
        - "calls has 2 new_surface entries (persona + observer)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:integration-hardening:L003-UNIT-002-spawn-observer-removed-from-handler"
      id: "AC-UNIT-002"
      purpose: "_spawn_observer no longer exists in handlers/spawn.py; grep returns 0 hits"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "handlers/spawn.py is the current post-migration version"
    when:
      abstract: "grep for _spawn_observer in src/atdd/coach/handlers/spawn.py"
    then:
      abstract:
        - "0 matches — function deleted"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:integration-hardening:L003-UNIT-003-observer-failure-structured-logged"
      id: "AC-UNIT-003"
      purpose: "When observer co-spawn raises in MultiplexerBackend.new_persona_surface, a structured JSON log event is emitted to stderr and persona spawn still succeeds"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A MultiplexerBackend subclass where new_surface succeeds on call 1 (persona) but raises on call 2 (observer)"
    when:
      abstract: "new_persona_surface(...) is called"
    then:
      abstract:
        - "Returns a valid persona surface ref (no exception raised)"
        - "stderr contains a JSON object with event=observer_cospawn_failed"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
