    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach is invoked and reaches the relevant transition or phase"
    when:
      abstract: "The LLM handler fires"
    then:
      abstract:
        - "atdd judge with a registered LLM completes end-to-end against a stub fixture"
    metadata:
      author: "atdd:integration-hardening"
      created: "2026-05-11"
