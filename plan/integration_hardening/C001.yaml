urn: "wmbt:integration-hardening:C001"
step: "wire"
direction: "establish"
dimension: "binding"
object_of_control: "production-LLM-client-registration-at-import-time"
context_clarifier: "when atdd judge or atdd issue review is invoked and the LLM_REGISTRY must have production clients registered"
lens: "functional.effectiveness"
statement: "establish production-LLM-client-registration-at-import-time when atdd coach drives the lifecycle so the LLM handler invokes the shipped component"

acceptances:
