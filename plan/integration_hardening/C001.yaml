      urn: "acc:integration-hardening:LLM-REGISTRY-001-default-clients-registered"
      id: "AC-INTEGRATION-001"
      purpose: "Default LLMs registered when env vars are set"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach is invoked and reaches the relevant transition or phase"
    when:
      abstract: "The LLM handler fires"
    then:
      abstract:
        - "Fresh atdd issue review <N> succeeds with at least 2 LLMs configured; per-pass JSON written to .atdd/runtime/issue-reviews/<N>/pass-<i>.json"
    metadata:
      author: "atdd:integration-hardening"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:LLM-REGISTRY-002-missing-keys-degrade-gracefully"
      id: "AC-INTEGRATION-002"
      purpose: "Missing API keys produce clear non-crash error"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach is invoked and reaches the relevant transition or phase"
    when:
      abstract: "The LLM handler fires"
    then:
      abstract:
        - "With no keys set, atdd issue review <N> prints clear configuration message and exits non-zero; does not crash"
    metadata:
      author: "atdd:integration-hardening"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:LLM-REGISTRY-003-judge-also-works"
