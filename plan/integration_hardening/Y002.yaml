urn: "wmbt:integration-hardening:Y002"
step: "modify"
direction: "minimize"
dimension: "quantity"
object_of_control: "validator-tests-that-mutate-the-active-worktree"
context_clarifier: "when atdd validate coach runs as a post-commit hook or locally and the test suite includes parity/runtime tests that call git commit against the live worktree rather than an isolated tmp_path fixture repo"
lens: "functional.effectiveness"
statement: "minimize quantity of validator-tests-that-mutate-the-active-worktree when atdd validate coach is run as a post-commit hook or locally and must not produce phantom commits, flip core.bare, or otherwise mutate the active worktree"
acceptances:
  - identity:
      urn: "acc:integration-hardening:Y002-UNIT-001-no-phantom-commits"
      id: "GT-001"
      purpose: "Running atdd validate coach --local --skip-api must leave git log -1 unchanged"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The active worktree has at least one commit"
        - "The coach validator session-scoped guard fixture is installed in conftest.py"
    when:
      abstract: "The full coach validator suite runs via atdd validate coach --local --skip-api"
    then:
      abstract:
        - "git rev-parse HEAD is identical before and after the validator session"
        - "No commits authored by 'ATDD Test <test@example.com>' appear in HEAD~5..HEAD"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:integration-hardening:Y002-UNIT-002-core-bare-unchanged"
      id: "GT-002"
      purpose: "Running atdd validate coach --local --skip-api must leave git config core.bare unchanged"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The active worktree has core.bare=false"
    when:
      abstract: "The full coach validator suite runs via atdd validate coach --local --skip-api"
    then:
      abstract:
        - "git config core.bare returns 'false' after the validator session"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:integration-hardening:Y002-UNIT-003-guard-fixture-registered"
      id: "GT-003"
      purpose: "The session-scoped autouse guard fixture is declared in the coach validators conftest.py"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/validators/conftest.py exists"
    when:
      abstract: "The file is inspected for the _worktree_integrity_guard fixture"
    then:
      abstract:
        - "_worktree_integrity_guard is defined with scope='session' and autouse=True"
        - "Any future test that commits to the live repo causes the session to fail with a clear message"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:integration-hardening:Y002-UNIT-004-post-commit-hook-enabled"
      id: "GT-004"
      purpose: ".atdd/hooks/post-commit is present and matches the template"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/templates/hooks/post-commit is the source-of-truth template"
        - ".atdd/hooks/ is the git hooksPath directory"
    when:
      abstract: ".atdd/hooks/post-commit is inspected"
    then:
      abstract:
        - "The file exists and its content is identical to the template"
        - "A commit to src/atdd/coach/ triggers blast-radius validation via the post-commit hook"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
