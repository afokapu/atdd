urn: "wmbt:integration-hardening:E004"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "coach-sessions-with-unsubmitted-rename-or-missing-uuid-persistence"
context_clarifier: "when apply_canonical_name_and_layout sends /rename text via send() with a literal newline that claude's repl does not interpret as enter, and when no claude --resume uuid is captured after spawn so the session cannot be resumed if the surface dies"
lens: "functional.effectiveness"
statement: "minimize quantity of coach-sessions-with-unsubmitted-rename-or-missing-uuid-persistence when apply_canonical_name_and_layout uses send() with a literal newline that claude's repl does not interpret as enter, requiring a split into send(ref, '/rename <name>') followed by send_key(ref, 'Enter'), and a post-rename read_screen to extract and persist the claude --resume uuid to .atdd/runtime/coach/<N>/<agent_id>.session.json"
acceptances:
  - identity:
      urn: "acc:integration-hardening:E004-UNIT-001-rename-submits-via-send_key"
      id: "AC-UNIT-001"
      purpose: "apply_canonical_name_and_layout produces two multiplexer calls for /rename: send(ref, '/rename <name>') with no trailing newline, then send_key(ref, 'Enter'); the send call precedes send_key; asserted with FakeMultiplexer"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "FakeMultiplexer injected into apply_canonical_name_and_layout"
        - "canonical_name set to 'ATDD582-issue-582'"
        - "surface ref set to 'surface:1'"
    when:
      abstract: "apply_canonical_name_and_layout(backend, ref, canonical_name, surface_count=1) is called"
    then:
      abstract:
        - "FakeMultiplexer.calls contains exactly one send entry with text='/rename ATDD582-issue-582' (no trailing newline)"
        - "FakeMultiplexer.calls contains exactly one send_key entry with key='Enter'"
        - "The send call index is lower than the send_key call index"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:integration-hardening:E004-UNIT-002-graceful-uuid-extraction"
      id: "AC-UNIT-002"
      purpose: "capture_session_uuid does not raise when read_screen returns content without a claude --resume UUID; it logs a warning to stderr and returns None without writing a session file"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "FakeMultiplexer with read_screen returning a screen that does not contain 'claude --resume'"
        - "runtime_root is a tmp_path directory"
    when:
      abstract: "capture_session_uuid(backend, ref, issue=582, agent_id='planner-582-001', canonical_name='ATDD582-issue-582', persona='planner', phase='PLANNED', runtime_root=tmp_path, delay=0) is called"
    then:
      abstract:
        - "No exception is raised"
        - "Return value is None"
        - "No .session.json file is written under runtime_root"
        - "A warning is printed to stderr"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:integration-hardening:E004-INTEGRATION-001-claude-header-actually-renames"
      id: "AC-INTEGRATION-001"
      purpose: "live atdd coach <N> followed by cmux read-screen shows the session header reflecting the canonical name rather than the default Claude welcome name"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach <N> invoked on a real INIT issue with cmux available"
        - "Claude Code process started in the surface"
    when:
      abstract: "cmux read-screen --surface <ref> is called after a 2s delay"
    then:
      abstract:
        - "The screen output contains the canonical name ATDD<N>-<slug>"
        - "The session header does not show the default Claude welcome name"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:integration-hardening:E004-INTEGRATION-002-uuid-captured"
      id: "AC-INTEGRATION-002"
      purpose: ".atdd/runtime/coach/<N>/<agent_id>.session.json exists after spawn with a valid claude_resume_uuid matching [a-f0-9-]{36}"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach <N> completes spawn with a real Claude Code process in the surface"
    when:
      abstract: "spawn returns and the session file path is checked"
    then:
      abstract:
        - ".atdd/runtime/coach/<N>/<agent_id>.session.json exists"
        - "The file contains claude_resume_uuid matching [a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:integration-hardening:E004-INTEGRATION-003-status-surfaces-resume-hint"
      id: "AC-INTEGRATION-003"
      purpose: "atdd coach status output includes a 'Resume agent: claude --resume <UUID>' line read from the saved session JSON"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A .atdd/runtime/coach/<N>/<agent_id>.session.json file exists with a valid claude_resume_uuid"
    when:
      abstract: "run_status is invoked with runtime_dir pointing to the test runtime root"
    then:
      abstract:
        - "Output contains 'Resume agent: claude --resume <UUID>'"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
