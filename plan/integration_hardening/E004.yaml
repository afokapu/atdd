urn: "wmbt:integration-hardening:E004"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "coach-sessions-with-unsubmitted-rename-or-missing-uuid-persistence"
context_clarifier: "when apply_canonical_name_and_layout sends /rename text via send() with a literal newline that claude's repl does not interpret as enter, and when no claude --resume uuid is captured after spawn so the session cannot be resumed if the surface dies"
lens: "functional.effectiveness"
statement: "minimize quantity of coach-sessions-with-unsubmitted-rename-or-missing-uuid-persistence when apply_canonical_name_and_layout uses send() with a literal newline that claude's repl does not interpret as enter, requiring a split into send(ref, '/rename <name>') followed by send_key(ref, 'Enter'), and a post-rename read_screen to extract and persist the claude --resume uuid to .atdd/runtime/coach/<N>/<agent_id>.session.json"
acceptances:
  - identity:
      urn: "acc:integration-hardening:E004-INTEGRATION-003-status-surfaces-resume-hint"
      id: "AC-INTEGRATION-003"
      purpose: "atdd coach status output includes a 'Resume agent: claude --resume <UUID>' line read from the saved session JSON"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A .atdd/runtime/coach/<N>/<agent_id>.session.json file exists with a valid claude_resume_uuid"
    when:
      abstract: "run_status is invoked with runtime_dir pointing to the test runtime root"
    then:
      abstract:
        - "Output contains 'Resume agent: claude --resume <UUID>'"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
