urn: wmbt:integration-hardening:E008
step: execute
direction: minimize
dimension: likelihood
object_of_control: concurrent-upgrade-runs-mutating-the-one-shared-install-that-sits-beneath-every-worktree
context_clarifier: "when roughly sixty agents run out of a single pipx install and\
  \ Y007 has just made `atdd upgrade` reachable to all of them, so two or more can\
  \ enter auto_upgrade() at once and have pip rewrite the venv beneath the others\
  \ mid-run \u2014 the hazard that would otherwise be the argument for keeping a human\
  \ in the loop, except the human faces the identical hazard with no better information\
  \ and no way to see the other fifty-nine; note the lock cannot live under a worktree's\
  \ own .atdd/ control root, because sixty worktrees have sixty of those and would\
  \ serialise against nothing"
lens: functional.effectiveness
statement: "minimize likelihood of concurrent-upgrade-runs-mutating-the-one-shared-install-that-sits-beneath-every-worktree\
  \ by serialising the mutating section of `atdd upgrade` on a lock scoped to the\
  \ install rather than to the checkout, making a run that finds nothing to do a no-op\
  \ instead of a second mutation, and refusing loudly with a named reason if the lock\
  \ cannot be taken within a bounded wait \u2014 never proceeding unlocked and never\
  \ degrading quietly, so the answer to concurrency is a lock and idempotency rather\
  \ than an operator"
acceptances:
- identity:
    urn: acc:integration-hardening:E008-UNIT-001-lock-is-scoped-to-the-install-not-the-checkout
    id: AC-UNIT-001
    purpose: 'The load-bearing property: two runs launched from two different worktrees
      must contend for the same lock. A lock under a worktree''s own .atdd/ would
      give sixty agents sixty locks and serialise nothing'
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - Two distinct repo roots on disk, each a valid ATDD checkout with its own .atdd/
      control root, both resolving to the same installed atdd
  when:
    abstract: The lock identity the upgrader would use is resolved for each repo root
  then:
    abstract:
    - Both resolve to the same lock, so the two checkouts contend
    - The lock does not live inside either repo root, and in particular not under
      either .atdd/ directory
    - The lock identity is derived from the install being mutated, so two genuinely
      separate installs on one machine do not contend with each other
  metadata:
    author: atdd:run-upgrade-unattended
    created: '2026-07-26'
- identity:
    urn: acc:integration-hardening:E008-UNIT-002-second-run-waits-and-never-sees-a-partial-install
    id: AC-UNIT-002
    purpose: 'Two concurrent runs serialise rather than interleave: the second waits
      for the first to finish its mutation and then observes a whole install, never
      one being rewritten'
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - is_outdated() reports a pending upgrade for both runs at start
    - auto_upgrade() is patched to a slow function that records entry and exit timestamps
      and flips the reported installed version on exit
  when:
    abstract: Two Upgrader.run() invocations are started concurrently against the
      same install
  then:
    abstract:
    - "The two auto_upgrade() intervals do not overlap \u2014 one wholly precedes\
      \ the other"
    - Exactly one mutation is performed for the single version delta; the run that
      waited re-reads state after acquiring the lock and finds nothing left to do
    - Both invocations return 0
  metadata:
    author: atdd:run-upgrade-unattended
    created: '2026-07-26'
- identity:
    urn: acc:integration-hardening:E008-UNIT-003-already-current-run-is-a-no-op
    id: AC-UNIT-003
    purpose: 'Idempotency: a run that finds the install current and the stamp in sync
      mutates nothing, so the fifty-nine agents that arrive after the upgrade cost
      one check each'
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - is_outdated() returns (False, '4.27.0', '4.27.0') and toolkit.last_version already
      equals the installed version
    - auto_upgrade and subprocess.run are patched with call tracking
  when:
    abstract: Upgrader.run() is called with yes=False and stdin not a terminal
  then:
    abstract:
    - auto_upgrade() is never called and no `atdd sync` or `atdd init --force` subprocess
      is spawned
    - The return code is 0 and the output says the install is already in sync
    - Running it a second time produces the same result and the same absence of side
      effects
  metadata:
    author: atdd:run-upgrade-unattended
    created: '2026-07-26'
- identity:
    urn: acc:integration-hardening:E008-UNIT-004-unavailable-lock-refuses-loudly-and-never-proceeds-unlocked
    id: AC-UNIT-004
    purpose: 'Fail closed, in the posture managed hooks and manifest_migration already
      set: if the lock cannot be taken within its bounded wait, the run refuses with
      a named reason rather than mutating the shared install without it'
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - The lock is held for longer than the bounded wait by a separate live holder
    - is_outdated() reports a pending upgrade, and auto_upgrade is patched with call
      tracking
  when:
    abstract: Upgrader.run() is called and its wait for the lock expires
  then:
    abstract:
    - "auto_upgrade() is never called \u2014 the run does not proceed unlocked"
    - The return code is non-zero and the message names the contention as the reason
      and says the run may simply be retried
    - No environment variable exists that skips the lock; the refusal has no bypass
  metadata:
    author: atdd:run-upgrade-unattended
    created: '2026-07-26'
- identity:
    urn: acc:integration-hardening:E008-UNIT-005-a-dead-holder-does-not-wedge-the-install
    id: AC-UNIT-005
    purpose: 'The lock must not recreate the failure it is closing: an agent killed
      mid-upgrade must not leave sixty workers blocked behind a lock nobody holds,
      needing an operator to clear it by hand'
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - A lock left behind by a process that no longer exists
  when:
    abstract: Upgrader.run() is called and attempts to acquire the lock
  then:
    abstract:
    - "The abandoned lock does not block the run indefinitely \u2014 acquisition succeeds\
      \ without any manual clean-up"
    - A lock held by a process that IS still alive is still respected and still waited
      on
  metadata:
    author: atdd:run-upgrade-unattended
    created: '2026-07-26'
- identity:
    urn: acc:integration-hardening:E008-UNIT-006-two-sequential-runs-converge-and-the-first-names-the-second
    id: AC-UNIT-006
    purpose: "The upgrade is a two-step by existing design \u2014 the process that\
      \ ran pip is still running the old code and returns telling the caller to re-run.\
      \ Unattended, that must converge and the first run must name its own successor"
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - A pending upgrade, stdin not a terminal, and auto_upgrade() patched to succeed
      and advance the reported installed version
  when:
    abstract: Upgrader.run() is called, then called again against the now-upgraded
      install
  then:
    abstract:
    - The first run returns 0 and its output names the exact command to run next to
      finish the sync
    - The second run performs the sync step and stamps toolkit.last_version forward,
      returning 0
    - A third run is a no-op, so the sequence converges rather than oscillating
  metadata:
    author: atdd:run-upgrade-unattended
    created: '2026-07-26'
- identity:
    urn: acc:integration-hardening:E008-SMOKE-001-two-real-concurrent-upgrades-serialise-on-one-install
    id: AC-SMOKE-001
    purpose: "SMOKE: two real `atdd upgrade` processes started at once against one\
      \ install, from two different worktrees, with no mocking of the lock \u2014\
      \ exactly one does the work, both exit cleanly, and the install is intact afterwards"
    phase: SMOKE
  harness:
    type: smoke
    category: backend
  given:
    abstract:
    - Two real ATDD checkouts on disk sharing one installed atdd, each with a stale
      toolkit.last_version stamp
    - Both are invoked as subprocesses with stdin=DEVNULL and --no-pypi, so the smoke
      exercises the real lock and the real sync step without touching PyPI or rewriting
      the shared venv
    - "The real lock is used \u2014 nothing about the locking path is patched"
  when:
    abstract: Both subprocesses are launched simultaneously and run to completion
  then:
    abstract:
    - Both exit 0, and neither output contains 'EOFError'
    - 'Their mutating sections did not overlap: the evidence each run writes shows
      one wholly before the other'
    - After both finish, the checkouts are stamped current and the install still resolves
      and reports a version
  metadata:
    author: atdd:run-upgrade-unattended
    created: '2026-07-26'
