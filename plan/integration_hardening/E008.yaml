urn: "wmbt:integration-hardening:E008"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "review-gate-failures-caused-by-pr-resolution-errors-bypassing-the-in-process-broken-sentinel"
context_clarifier: "when atdd coach review <N> --no-spawn --in-process fails to resolve the PR commit (gh pr view rate-limited, network failure, or a missing PR) and run() step 1 returns 2 before the if in_process dispatch, escaping the _write_broken_sentinel path and producing a merge-blocking fail verdict with no report file"
lens: "functional.effectiveness"
statement: "minimize quantity of review-gate-failures-caused-by-pr-resolution-errors-bypassing-the-in-process-broken-sentinel when run() step 1 catches a _resolve_pr_commit RuntimeError and, in in-process mode, routes through _write_broken_sentinel — writing a review-step-broken report with a diagnostic PR-resolution summary to --report-file and returning 0 — while the spawn-based path retains its return 2 because it has no exit-0-always contract"
acceptances:
  - identity:
      urn: "acc:integration-hardening:E008-UNIT-001-pr-resolution-failure-in-process-writes-sentinel"
      id: "AC-UNIT-001"
      purpose: "run(pr_number=N, in_process=True, report_file=p) with _resolve_pr_commit forced to raise RuntimeError writes a review-step-broken sentinel to report_file and returns 0"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "coach_review._resolve_pr_commit is monkeypatched to raise RuntimeError('gh pr view 726 failed (rc=1): GraphQL: API rate limit already exceeded')"
        - "tmp_path used for the --report-file path so the write is isolated"
    when:
      abstract: "run(pr_number=726, in_process=True, report_file=str(tmp_path / 'review.json')) is called"
    then:
      abstract:
        - "Exit code is 0"
        - "report.json exists at the --report-file path"
        - "report.json verdict field is 'review-step-broken'"
        - "report.json summary field is non-empty"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-17"
  - identity:
      urn: "acc:integration-hardening:E008-UNIT-002-pr-resolution-failure-spawn-path-still-returns-2"
      id: "AC-UNIT-002"
      purpose: "run(pr_number=N, in_process=False) with _resolve_pr_commit forced to raise RuntimeError still returns 2 — the spawn-based path is unchanged (true negative)"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "coach_review._resolve_pr_commit is monkeypatched to raise RuntimeError"
        - "tmp_path used for the --report-file path"
    when:
      abstract: "run(pr_number=726, in_process=False, report_file=str(tmp_path / 'review.json')) is called"
    then:
      abstract:
        - "Exit code is 2"
        - "No report.json is written at the --report-file path"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-17"
  - identity:
      urn: "acc:integration-hardening:E008-UNIT-003-sentinel-summary-names-pr-resolution"
      id: "AC-UNIT-003"
      purpose: "The sentinel written on a PR-resolution failure carries a diagnostic summary that names the PR-resolution failure and surfaces the underlying gh error, so operators can distinguish a transient infra hiccup from a genuine review failure"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "coach_review._resolve_pr_commit is monkeypatched to raise RuntimeError('gh pr view 726 failed (rc=1): GraphQL: API rate limit already exceeded')"
        - "tmp_path used for the --report-file path"
    when:
      abstract: "run(pr_number=726, in_process=True, report_file=str(tmp_path / 'review.json')) is called and the written report.json is parsed"
    then:
      abstract:
        - "report.json summary (or error) field contains the substring 'PR resolution'"
        - "report.json summary (or error) field contains the substring 'rate limit' from the underlying gh error"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-17"
  - identity:
      urn: "acc:integration-hardening:E008-SMOKE-001-nonexistent-pr-exits-0-with-broken-verdict"
      id: "AC-SMOKE-001"
      purpose: "atdd coach review against a non-existent PR in --no-spawn --in-process mode, using the real coach_review.run() and the real gh-backed _resolve_pr_commit, exits 0 and writes a real report.json containing verdict review-step-broken — no monkeypatched resolver, proving the contract holds against an actual PR-resolution failure"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The real coach_review module with no monkeypatch on _resolve_pr_commit"
        - "A PR number that does not exist in the repo (e.g. 999999) so the real gh pr view fails"
        - "A real tmp_path for the --report-file path"
    when:
      abstract: "run(pr_number=999999, in_process=True, report_file=str(tmp_path / 'r.json')) is called — equivalent to `atdd coach review 999999 --no-spawn --in-process --report-file <p>`"
    then:
      abstract:
        - "Exit code is 0"
        - "tmp_path/r.json exists and is valid JSON"
        - "tmp_path/r.json verdict field is 'review-step-broken'"
        - "tmp_path/r.json summary field is non-empty"
    metadata:
      author: "atdd:smoke-backfill-trivial-tier"
      created: "2026-05-17"
