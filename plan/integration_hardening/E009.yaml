urn: "wmbt:integration-hardening:E009"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "resume-driver-phase-transitions-recorded-without-dispatching-orchestration"
context_clarifier: "when atdd coach --resume <RUN_ID> reconstructs an in-flight issue and ResumeRunner.drive_to_complete walks PLANNED_PATH, _step_transition must invoke a real transition_action that spawns the phase persona and drives the phase work; today coach.py constructs ResumeRunner with no transition_action, so it defaults to None and the `if … transition_action is not None` guard in _step_transition skips all orchestration — every remaining phase is paper-stamped to COMPLETE (observed: #662 SMOKE→REFACTOR→COMPLETE written 0.9 ms apart, no persona, no smoke tests). This is the resume-path analog of the cold-start gap closed by #645/E002."
lens: "functional.effectiveness"
statement: "minimize quantity of resume-driver-phase-transitions-recorded-without-dispatching-orchestration when atdd coach --resume <RUN_ID> drives a reconstructed issue, requiring the coach.py resume path to construct ResumeRunner with a transition_action that performs genuine per-phase orchestration (the same spawn/drive work as the cold-start path) and to fail loudly when transition_action is absent rather than paper-walking to COMPLETE"
acceptances:
  - identity:
      urn: "acc:integration-hardening:E009-UNIT-001-missing-transition-action-fails-loudly"
      id: "AC-UNIT-001"
      purpose: "ResumeRunner.drive_to_complete with transition_action=None on a reconstructed mid-lifecycle issue raises a loud error before writing any phase-transition record, instead of silently stamping COMPLETE"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A ResumeRunner constructed with transition_action=None (the current default)"
        - "A decisions.jsonl in a tmp_path runtime_dir that reconstructs issue 999 to phase SMOKE (pending phases remain)"
    when:
      abstract: "ResumeRunner.drive_to_complete() is called"
    then:
      abstract:
        - "A clear exception is raised naming the missing transition_action (e.g. ValueError / RuntimeError mentioning 'transition_action')"
        - "decisions.jsonl contains zero phase-transition records written after the call (no new SMOKE→REFACTOR or REFACTOR→COMPLETE entries)"
        - "No record with inputs.target_phase=COMPLETE is appended"
    metadata:
      author: "atdd:planner:734"
      created: "2026-05-17"
  - identity:
      urn: "acc:integration-hardening:E009-INTEGRATION-001-resume-invokes-transition-action"
      id: "AC-INTEGRATION-001"
      purpose: "A resumed run with pending phases invokes transition_action once per pending transition, each call receiving (issue, src, dst)"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A decisions.jsonl in a tmp_path runtime_dir reconstructing issue 999 to phase SMOKE"
        - "ResumeRunner constructed via the coach.py resume path with a recording fake transition_action that appends each (issue, src, dst) call to a list"
    when:
      abstract: "ResumeRunner.drive_to_complete() walks the remaining PLANNED_PATH"
    then:
      abstract:
        - "The recording transition_action is invoked at least once (call count >= 1)"
        - "The recorded calls cover every pending transition: (999, SMOKE, REFACTOR) and (999, REFACTOR, COMPLETE)"
        - "Each recorded call carries the issue number, a source phase, and a destination phase"
    metadata:
      author: "atdd:planner:734"
      created: "2026-05-17"
  - identity:
      urn: "acc:integration-hardening:E009-INTEGRATION-002-resume-spawns-pending-phase-persona"
      id: "AC-INTEGRATION-002"
      purpose: "atdd coach --resume on an issue reconstructed mid-lifecycle records a persona spawn for the pending phase via the same orchestration the cold-start path uses"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A decisions.jsonl reconstructing issue 999 to phase SMOKE"
        - "coach.run is invoked with --resume <RUN_ID> and a FakeMultiplexer injected so no real cmux pane is created"
        - "spawn handler dependencies (_load_persona_prompt, _resolve_worktree) return synthetic values"
    when:
      abstract: "The resume path drives the SMOKE→REFACTOR transition"
    then:
      abstract:
        - "FakeMultiplexer records at least one spawn invocation for the pending phase's persona (coder for SMOKE→REFACTOR)"
        - "No real cmux pane is created"
        - "The spawn count is non-zero — the resume run is not a paper walk"
    metadata:
      author: "atdd:planner:734"
      created: "2026-05-17"
  - identity:
      urn: "acc:integration-hardening:E009-INTEGRATION-003-no-paper-fast-forward-on-block"
      id: "AC-INTEGRATION-003"
      purpose: "When a pending phase cannot complete, the resume run BLOCKs/escalates and writes no phase-transition record for that phase or any later one — never a …→COMPLETE stamp"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A decisions.jsonl reconstructing issue 999 to phase SMOKE"
        - "ResumeRunner constructed via the coach.py resume path with a transition_action that fails (raises / signals BLOCK) on the SMOKE→REFACTOR transition"
        - "An escalation channel configured to a tmp_path file"
    when:
      abstract: "ResumeRunner.drive_to_complete() reaches the failing SMOKE→REFACTOR transition"
    then:
      abstract:
        - "decisions.jsonl contains no phase-transition record with inputs.target_phase=REFACTOR and none with inputs.target_phase=COMPLETE"
        - "The run reports a BLOCK/escalation outcome (non-zero rc or an escalation entry written to the channel file)"
        - "Issue 999 is not reported as COMPLETE"
    metadata:
      author: "atdd:planner:734"
      created: "2026-05-17"
  - identity:
      urn: "acc:integration-hardening:E009-INTEGRATION-004-already-complete-resume-idempotent"
      id: "AC-INTEGRATION-004"
      purpose: "Resuming a run whose issue reconstructs to COMPLETE does no orchestration and writes no new records — idempotent"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A decisions.jsonl reconstructing issue 999 to phase COMPLETE (no pending phases)"
        - "ResumeRunner constructed via the coach.py resume path with a recording fake transition_action"
    when:
      abstract: "ResumeRunner.drive_to_complete() is called"
    then:
      abstract:
        - "The recording transition_action is invoked exactly zero times"
        - "No new phase-transition record is appended to decisions.jsonl"
        - "drive_to_complete returns a success/no-op result (rc 0)"
    metadata:
      author: "atdd:planner:734"
      created: "2026-05-17"
  - identity:
      urn: "acc:integration-hardening:E009-SMOKE-001-resume-real-orchestration"
      id: "AC-SMOKE-001"
      purpose: "atdd coach --resume drives the real transition_action, real spawn handler, and real decisions.jsonl round-trip — proving the #734 fix is not a paper walk and a kill-and-resume cycle completes for real"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A real decisions.jsonl on disk reconstructing issue N to phase SMOKE (created by a partial run that logs INIT→PLANNED→RED→GREEN→SMOKE)"
        - "coach.run invoked with --resume <RUN_ID> using the REAL _make_resume_transition_action (no _transition_action_override seam)"
        - "FakeMultiplexer injected via multiplexer_backend to record spawns without opening real cmux panes"
    when:
      abstract: "The resume path drives the remaining pending phases"
    then:
      abstract:
        - "FakeMultiplexer records at least one spawn invocation — the run is not a paper walk"
        - "decisions.jsonl contains the expected phase-transition records written by the real DecisionWriter"
        - "No real cmux pane is created (FakeMultiplexer intercepts all spawn calls)"
    metadata:
      author: "atdd:planner:734"
      created: "2026-05-17"
