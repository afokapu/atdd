      abstract:
        - "atdd coach is invoked and reaches the relevant transition or phase"
    when:
      abstract: "The J5 handler fires"
    then:
      abstract:
        - "atdd coach exits cleanly on SIGTERM; watcher subprocess terminated; partial state preserved in decisions.jsonl"
    metadata:
      author: "atdd:integration-hardening"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:J5-INTEGRATION-004-event-serialization"
