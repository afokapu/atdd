urn: "wmbt:integration-hardening:E001"
step: "execute"
direction: "minimize"
dimension: "quantity"
object_of_control: "imperatively-polled-state-transitions-bypassing-watcher-events"
context_clarifier: "when atdd coach <N> must convert its state-machine driver from imperative (call handler → advance state) to reactive (subscribe J5 watcher to filesystem and git-refs events → let commit_observed and events.jsonl-append events drive transitions) per spec §4.4 event sources"
lens: "functional.effectiveness"
statement: "minimize quantity of imperatively-polled-state-transitions-bypassing-watcher-events when atdd coach <N> converts the driver to reactive and subscribes J5 watcher to filesystem, git-refs, and liveness-timer event sources per spec §4.4"
acceptances:
  - identity:
      urn: "acc:integration-hardening:E001-INTEGRATION-001-watcher-drives-state"
      id: "AC-INTEGRATION-001"
      purpose: "A manually-triggered git commit on the worktree's branch advances state and appends to decisions.jsonl, driven by the watcher event not polling"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "J5 runtime watcher (#510) is merged"
        - "A running atdd coach <N> session watching a worktree branch"
    when:
      abstract: "A git commit is made manually on the worktree's branch"
    then:
      abstract:
        - "The watcher emits a commit_observed event"
        - "The state machine advances based on the event; decisions.jsonl is appended"
        - "No polling loop drives the transition; the advance is event-triggered"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:E001-INTEGRATION-002-stale-warn-fires"
      id: "AC-INTEGRATION-002"
      purpose: "After --stale-warn minutes of no events, an INFO escalation appears on the configured escalation-channel"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach <N> invoked with --stale-warn 1 and a configured --escalation-channel"
    when:
      abstract: "1 minute passes with no watcher events"
    then:
      abstract:
        - "An INFO-level stale-alert is sent to the --escalation-channel"
        - "The state machine continues running without termination"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:E001-INTEGRATION-003-liveness-cleanup"
      id: "AC-INTEGRATION-003"
      purpose: "atdd coach exits cleanly on SIGTERM; watcher subprocess is terminated; partial state is preserved in decisions.jsonl"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A running atdd coach <N> session with an active J5 watcher subprocess"
    when:
      abstract: "SIGTERM is sent to the atdd coach process"
    then:
      abstract:
        - "The watcher subprocess is terminated cleanly"
        - "decisions.jsonl retains all entries written before SIGTERM"
        - "No partial JSON lines are written to decisions.jsonl"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"

  - identity:
      urn: "acc:integration-hardening:E001-SMOKE-001-watcher-real-infrastructure"
      id: "AC-SMOKE-001"
      purpose: "Watcher works against real filesystem and git refs"
      phase: "SMOKE"
    signal:
      metric: "watcher.commit_observed.count"
      threshold: ">= 1"
    given:
      abstract:
        - "atdd coach is running against a real git worktree with filesystem watchers active"
    when:
      abstract: "A real git commit fires on the worktree branch"
    then:
      abstract:
        - "The watcher emits commit_observed and the state machine advances or records BLOCKED"
    metadata:
      author: "atdd:integration-hardening"
      created: "2026-05-11"
