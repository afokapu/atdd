urn: "wmbt:integration-hardening:M001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "monitor"
direction: "minimize"
dimension: "quantity"
object_of_control: "unvalidated-phase-exit-transitions-in-atdd-coach"
context_clarifier: "when atdd coach <N> reaches a phase-exit gate (RED→GREEN, GREEN→SMOKE, SMOKE→REFACTOR, REFACTOR→COMPLETE) and must invoke M3 validator dispatch to produce violations.jsonl, suppressed.jsonl, stale-suppressions.jsonl, and risk-score.json before routing the transition based on violation disposition and --risk-threshold-block"
lens: "functional.effectiveness"
statement: "minimize quantity of unvalidated-phase-exit-transitions-in-atdd-coach when coach reaches each phase-exit gate and must invoke M3 validator dispatch producing four conformant artifacts and gate the transition on violation disposition and risk threshold"
acceptances:
  - identity:
      urn: "acc:integration-hardening:M001-INTEGRATION-001-validators-fire-at-phase-exit"
      id: "AC-INTEGRATION-001"
      purpose: "atdd coach <N> produces validator artifacts at every phase exit with the phase-appropriate validator subset"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "M3 (#519), M2 (#518), M4 (#520), M5 (#521) are all merged"
        - "A running atdd coach <N> session"
    when:
      abstract: "Coach advances through RED→GREEN, GREEN→SMOKE, SMOKE→REFACTOR, REFACTOR→COMPLETE"
    then:
      abstract:
        - ".atdd/runtime/coach/validations/<sha>/{violations,suppressed,stale-suppressions,risk-score} artifacts are written at each phase exit"
        - "The validator subset matches the §6.5 phase mapping (planner-validators at INIT exit, coder-validators at GREEN exit)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:M001-INTEGRATION-002-strict-violation-blocks"
      id: "AC-INTEGRATION-002"
      purpose: "A strict-disposition violation blocks the transition; decisions.jsonl records BLOCKED with the violating rule_id"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A strict-disposition violation is present in the coder phase's violations.jsonl"
    when:
      abstract: "Coach evaluates the RED→GREEN phase-exit gate after validator dispatch"
    then:
      abstract:
        - "The RED→GREEN transition is aborted"
        - "decisions.jsonl records BLOCKED state with the violating rule_id in the rationale"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:M001-INTEGRATION-003-risk-threshold-block"
      id: "AC-INTEGRATION-003"
      purpose: "--risk-threshold-block blocks transitions whose post-validation risk_score.sum exceeds the threshold"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach <N> invoked with --risk-threshold-block 10"
        - "The post-validation risk_score.sum is 15 for a given phase exit"
    when:
      abstract: "Coach evaluates the phase-exit gate after M3 dispatch"
    then:
      abstract:
        - "The transition is blocked; decisions.jsonl records BLOCKED with risk_score.sum=15 exceeding threshold=10"
        - "A risk_score.sum below 10 on a different transition allows it to proceed"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
