urn: "wmbt:integration-hardening:D001"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "define"
direction: "minimize"
dimension: "likelihood"
object_of_control: "state-transitions-without-durable-decisions-jsonl-entries"
context_clarifier: "when atdd coach <N> fires a state transition and must append a conformant JSON line to .atdd/runtime/coach/decisions.jsonl BEFORE executing any side-effect (K1 spawn, J4 merge), with write-before-action discipline ensuring decisions.jsonl is the authoritative source of phase truth for --resume <run-id> replay"
lens: "functional.availability"
statement: "minimize likelihood of state-transitions-without-durable-decisions-jsonl-entries when atdd coach <N> fires each phase transition before any side-effect, with write-before-action discipline ensuring decisions.jsonl is authoritative for --resume replay via J6 reader"
acceptances:
  - identity:
      urn: "acc:integration-hardening:D001-INTEGRATION-001-decision-per-transition"
      id: "AC-INTEGRATION-001"
      purpose: "A full atdd coach <N> run produces exactly N decisions.jsonl entries conforming to coach-decision.schema.json"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "J3 decisions writer (#498) and coach-decision.schema.json (#483) are merged"
        - "A running atdd coach <N> session in INIT state"
    when:
      abstract: "atdd coach <N> runs from INIT to MERGED"
    then:
      abstract:
        - ".atdd/runtime/coach/decisions.jsonl contains exactly one entry per state transition"
        - "Each entry validates against coach-decision.schema.json with decision_id, issue_number, coach_run_id, from_state, to_state, timestamp, rationale, judgment_id (nullable), actor"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:D001-INTEGRATION-002-write-before-side-effect"
      id: "AC-INTEGRATION-002"
      purpose: "Decision write completes before K1 spawn; on crash between write and spawn, --resume re-issues spawn without duplicating the decision entry"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A crash is simulated between the decisions.jsonl write and the subsequent K1 spawn side-effect"
    when:
      abstract: "atdd coach --resume <run-id> is invoked after the crash"
    then:
      abstract:
        - "decisions.jsonl contains the to_state entry from the crashed transition"
        - "Resume re-issues the K1 spawn side-effect for that state without adding a duplicate decisions.jsonl entry"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
  - identity:
      urn: "acc:integration-hardening:D001-INTEGRATION-003-resume-replays-correctly"
      id: "AC-INTEGRATION-003"
      purpose: "--resume reconstructs state from decisions.jsonl and continues from last recorded to_state"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "decisions.jsonl has 3 entries (INIT→PLANNED, PLANNED→RED, RED→GREEN) from a previous run"
        - "The session was interrupted mid-GREEN"
    when:
      abstract: "atdd coach --resume <run-id> is invoked"
    then:
      abstract:
        - "J6 reader is invoked; current state is reconstructed as GREEN"
        - "Coach continues from GREEN→SMOKE without re-running INIT→GREEN transitions"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-11"
