urn: "feature:integration-hardening:coach-resume-wiring"
wagon: "wagon:integration-hardening"
description: "Hardens the atdd coach --resume <RUN_ID> path so it performs real per-phase orchestration instead of paper-walking remaining phases to COMPLETE. Today coach.py constructs ResumeRunner with no transition_action, so it defaults to None; ResumeRunner._step_transition then writes a phase-transition decision record but skips the work behind the `if … transition_action is not None` guard — every remaining phase is stamped COMPLETE with no persona spawn, no tests, no orchestration (observed live on #662: SMOKE→REFACTOR and REFACTOR→COMPLETE written 0.9 ms apart). This feature wires a real transition_action — reusing the cold-start per-phase orchestration — into the resume path, and makes ResumeRunner fail loudly when transition_action is absent so a silent paper fast-forward is never a valid outcome. It is the resume-path analog of the cold-start wiring gap E002 (#645)."
sizing:
  wmbts: 1
  footprint_score: 3
  footprint_size: "XS"
wmbts:
  - "wmbt:integration-hardening:E009"
components:
  backend:
    presentation:
      - type: "controllers"
        count: 0
        rationale: "No new CLI or HTTP surface; the fix is internal to the existing atdd coach --resume path"
    application:
      - type: "use_cases"
        count: 1
        rationale: "One wiring use case: construct ResumeRunner with a transition_action that drives genuine per-phase orchestration, reusing the cold-start spawn/drive work"
    domain:
      - type: "value_objects"
        count: 0
        rationale: "No new domain type — the resume path reuses the existing PhaseTransition fact already modelled by coach-single-command-driver"
    integration:
      - type: "wiring_modules"
        count: 1
        rationale: "src/atdd/coach/commands/coach.py resume path composes the cold-start per-phase orchestration into ResumeRunner.transition_action; src/atdd/coach/commands/resume.py fails loudly when transition_action is absent"
