urn: "wmbt:integration-hardening:L002"
step: "locate"
direction: "minimize"
dimension: "quantity"
object_of_control: "persona-spawns-without-co-spawned-observer-surface"
context_clarifier: "when atdd coach <N> executes the INIT→PLANNED transition and spawns the planner persona, the spawn handler must also call multiplexer.new_surface for an observer process so the observer L1 sidecar is present from the first frame of the phase rather than being absent and requiring manual operator attachment"
lens: "functional.effectiveness"
statement: "minimize quantity of persona-spawns-without-co-spawned-observer-surface when atdd coach <N> spawns the planner persona at INIT→PLANNED, requiring the spawn handler to call multiplexer.new_surface a second time with the observer command so that every phase agent has an observer sidecar from the moment it starts"
acceptances:
  - identity:
      urn: "acc:integration-hardening:L002-INTEGRATION-001-observer-cospawns-with-planner"
      id: "AC-INTEGRATION-001"
      purpose: "A live atdd coach <N> cold-start (INIT→PLANNED) produces two new multiplexer surfaces: one for the planner persona and one for the observer; observer surface name matches ATDD<N>-observer-planned pattern"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "atdd coach <N> invoked without --resume on a fresh INIT issue"
        - "FakeMultiplexer injected so no real cmux pane is spawned"
        - "spawn_handler._load_persona_prompt returns a synthetic prompt"
        - "spawn_handler._resolve_worktree returns a tmp_path directory"
    when:
      abstract: "coach.run() executes the INIT→PLANNED transition"
    then:
      abstract:
        - "FakeMultiplexer.calls contains exactly 2 new_surface entries (persona + observer)"
        - "One surface command contains 'planner'"
        - "One surface name matches the pattern ATDD<N>-observer-planned (or similar observer pattern)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:integration-hardening:L002-INTEGRATION-002-observer-failure-does-not-block-persona"
      id: "AC-INTEGRATION-002"
      purpose: "If the observer surface spawn raises an exception, the persona spawn result is still returned and handle() returns HANDLED; only a warning is emitted"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "spawn_handler._spawn_observer is monkeypatched to raise RuntimeError"
        - "The persona spawn succeeds normally"
    when:
      abstract: "coach.run() executes the INIT→PLANNED transition"
    then:
      abstract:
        - "handle() returns HandlerResult.HANDLED (not ERROR)"
        - "A warning is printed to stderr mentioning the observer failure"
        - "No escalation is sent"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
  - identity:
      urn: "acc:integration-hardening:L002-UNIT-001-fake-multiplexer-records-both-spawns"
      id: "AC-UNIT-001"
      purpose: "With FakeMultiplexer, an INIT→PLANNED call to handle() records exactly 2 spawn calls (new_surface or new_workspace) — one for the persona and one for the observer"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "FakeMultiplexer injected directly into the spawn handler"
        - "spawn_handler._resolve_multiplexer monkeypatched to return FakeMultiplexer"
        - "spawn_handler._load_persona_prompt returns a synthetic prompt"
        - "spawn_handler._resolve_worktree returns a tmp_path directory"
    when:
      abstract: "handle(ctx, transition=INIT→PLANNED) is called"
    then:
      abstract:
        - "FakeMultiplexer.calls has exactly 2 entries with op in (new_surface, new_workspace)"
        - "One entry command contains 'planner'"
        - "One entry command contains 'observer'"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-13"
