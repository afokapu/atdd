urn: "wmbt:integration-hardening:M002"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-14
step: "monitor"
direction: "minimize"
dimension: "likelihood"
object_of_control: "plan-directory-changes-that-bypass-planner-validator-suite-at-hook-time"
context_clarifier: "when an agent commits or pushes changes to plan/** (wagon YAML, WMBT files, feature files), the post-commit and pre-push hooks must run atdd validate planner --local --skip-api in addition to atdd repo validate, so that invalid step-code letters, unauthorized lens attributes, wagon manifest schema errors, and URN chain breaks are caught locally rather than burning a CI cycle"
lens: "functional.availability"
statement: "minimize likelihood of plan-directory-changes-that-bypass-planner-validator-suite-at-hook-time when an agent commits or pushes files under plan/**, by routing plan/* changes to RUN_PLANNER=1 in both the post-commit and pre-push hook templates so atdd validate planner --local --skip-api fires alongside the existing atdd repo validate, blocking the push on any planner validation failure"
acceptances:
  - identity:
      urn: "acc:integration-hardening:M002-UNIT-001-postcommit-runs-validate-planner-on-plan-changes"
      id: "AC-UNIT-001"
      purpose: "post-commit hook invokes atdd validate planner when a plan/** file is in the commit"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The post-commit hook template src/atdd/coach/templates/hooks/post-commit installed in a tmp_path git repo"
        - "A fake atdd binary on PATH that records all subcommand invocations"
        - "A commit touching plan/<wagon>/<wmbt>.yaml"
    when:
      abstract: "The post-commit hook script is executed (sh hookpath)"
    then:
      abstract:
        - "The fake atdd binary was called with 'validate planner' arguments"
        - "The hook exits 0 (post-commit is info-only)"
    metadata:
      author: "atdd:issue-642"
      created: "2026-05-13"

  - identity:
      urn: "acc:integration-hardening:M002-UNIT-002-prepush-runs-validate-planner-on-plan-changes"
      id: "AC-UNIT-002"
      purpose: "pre-push hook invokes atdd validate planner (blocking) when a plan/** file is in the push diff"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The pre-push hook template src/atdd/coach/templates/hooks/pre-push installed in a tmp_path git repo"
        - "A fake atdd binary on PATH that exits 1 for 'validate planner'"
        - "A changed file matching plan/<wagon>/<wmbt>.yaml in the push diff"
    when:
      abstract: "The pre-push hook script is executed with a non-main remote ref"
    then:
      abstract:
        - "The hook exits non-zero (blocked by failing planner validator)"
        - "stderr contains the planner validator failure message"
    metadata:
      author: "atdd:issue-642"
      created: "2026-05-13"

  - identity:
      urn: "acc:integration-hardening:M002-INTEGRATION-001-prepush-blocks-invalid-wmbt-letter"
      id: "AC-INTEGRATION-001"
      purpose: "pre-push hook blocks a push when plan/ contains a WMBT with an invalid step-code letter, caught by atdd validate planner"
      phase: "RED"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "The pre-push hook template installed in a tmp_path git repo"
        - "A fake atdd binary on PATH that exits 1 and emits 'invalid step code' when called with 'validate planner'"
        - "A commit touching plan/X/U001.yaml (U is not a valid step-code letter)"
    when:
      abstract: "The pre-push hook script is executed"
    then:
      abstract:
        - "The hook exits non-zero"
        - "stderr contains the planner validator's error message about the step code"
    metadata:
      author: "atdd:issue-642"
      created: "2026-05-13"
