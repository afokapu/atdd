urn: "wmbt:integration-hardening:C005"
step: "confirm"
direction: "minimize"
dimension: "quantity"
object_of_control: "coach-phase-advances-triggered-by-a-stale-done-json-from-a-prior-run"
context_clarifier: "when a fresh RuntimeWatcher starts with an empty _snapshots map and a pre-existing done.json (left in the dispatched persona's worktree runtime by an earlier coach run) is treated by the first scan as newly-written, so _emit_done fires agent_done and _cold_start_proposed_transition advances the phase before the freshly-dispatched persona has produced any work — the regression observed in coach-run-690-cb0a26c9 advancing PLANNED->RED in 9 s (#711, precision flaw in #708)"
lens: "functional.effectiveness"
statement: "minimize quantity of coach-phase-advances-triggered-by-a-stale-done-json-from-a-prior-run by binding the agent_done signal to the agent_id the coach dispatched for the current phase — RuntimeWatcher establishes a dispatch-time baseline so a pre-existing done.json is not emitted as new, and _cold_start_proposed_transition matches event.agent_id against the recorded dispatched agent_id rather than the issue number alone — so a leftover done.json never satisfies the advance gate"
acceptances:
  - identity:
      urn: "acc:integration-hardening:C005-UNIT-001-agent-done-matched-to-dispatched-agent-id"
      id: "AC-UNIT-001"
      purpose: "_cold_start_proposed_transition ignores an agent_done event whose agent_id does not match the agent_id the coach recorded at dispatch, and proposes a transition only for an event whose agent_id matches — proving the advance gate keys on full agent_id, not the issue number alone"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The coach has recorded dispatched_agent_id for the current phase (the agent_id returned by the spawn handler at this transition)"
        - "Two agent_done events for the same issue number: event A with agent_id == dispatched_agent_id, event B with a different historical agent_id (a prior run's persona)"
    when:
      abstract: "_cold_start_proposed_transition is called once with event B (mismatched agent_id) and once with event A (matching agent_id)"
    then:
      abstract:
        - "For event B (mismatched agent_id): returns None — no proposed transition"
        - "For event A (matching agent_id): returns a proposed transition for the current phase"
        - "The match is performed on the full agent_id string, not on the parsed issue number"
    metadata:
      author: "atdd:planner-711"
      created: "2026-05-15"
  - identity:
      urn: "acc:integration-hardening:C005-INTEGRATION-001-stale-done-json-does-not-advance"
      id: "AC-INTEGRATION-001"
      purpose: "A done.json present in the dispatched persona's runtime dir before the current persona is dispatched does NOT cause the coach to advance the phase on the watcher's first scan (finalizes provisional acc:coach:STALEDONE-001)"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A tmp runtime dir .atdd/runtime/agents/<agent-id>/ already contains a done.json whose mtime is earlier than the current dispatch time (a stale file left by a prior run)"
        - "A fresh RuntimeWatcher instance is constructed over that runtime dir with an empty _snapshots map and baselined at dispatch time"
        - "The coach has dispatched the current-phase persona and recorded its agent_id; the coach StateMachine is at PLANNED"
    when:
      abstract: "RuntimeWatcher runs its first scan over the runtime dir before the dispatched persona writes anything"
    then:
      abstract:
        - "Zero agent_done events are emitted for the stale done.json on the first scan"
        - "_cold_start_proposed_transition either is not invoked or returns without proposing a transition"
        - "The coach StateMachine.phase is still PLANNED after the scan — unchanged from before the scan"
    metadata:
      author: "atdd:planner-711"
      created: "2026-05-15"
  - identity:
      urn: "acc:integration-hardening:C005-INTEGRATION-002-current-persona-done-advances-once"
      id: "AC-INTEGRATION-002"
      purpose: "After dispatch, the currently-dispatched persona writing a fresh done.json triggers exactly one agent_done event and exactly one phase advance, even when a stale done.json was also present (finalizes provisional acc:coach:STALEDONE-002)"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A RuntimeWatcher baselined at dispatch time over the dispatched persona's runtime dir, which also contains a pre-existing stale done.json"
        - "The coach has recorded the dispatched persona's agent_id for the current phase; the coach StateMachine is at PLANNED"
    when:
      abstract: "The dispatched persona writes a fresh done.json (mtime after the dispatch baseline) and the watcher scans, then the watcher scans a second time with no new done.json"
    then:
      abstract:
        - "Exactly one agent_done event is emitted across both scans, and it carries the dispatched persona's agent_id"
        - "_cold_start_proposed_transition proposes exactly one phase transition"
        - "The coach StateMachine.phase advances by exactly one phase (PLANNED -> RED); the second scan emits zero further agent_done events"
    metadata:
      author: "atdd:planner-711"
      created: "2026-05-15"
  - identity:
      urn: "acc:integration-hardening:C005-SMOKE-001-coach-run-no-premature-advance-on-seeded-stale-done"
      id: "AC-SMOKE-001"
      purpose: "A real atdd coach <N> cold-start run over a worktree whose persona runtime dir is seeded with a stale done.json does not advance PLANNED->RED until the freshly-dispatched planner writes its own done.json — verified against the real coach state machine and a real decisions.jsonl, no mocked watcher"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A real tmp git worktree for issue <N> whose persona runtime dir .atdd/runtime/agents/planner-<N>-<hash>/ is seeded with a stale done.json copied from a prior run"
        - "The real atdd coach <N> cold-start path is invoked without --resume, with a FakeMultiplexer so no real cmux pane is spawned and the dispatched planner's done.json is written on a controlled schedule"
    when:
      abstract: "atdd coach <N> drives the INIT->PLANNED->RED segment: the planner persona is dispatched, then later writes a fresh done.json"
    then:
      abstract:
        - "No PLANNED->RED phase-transition record is written to .atdd/runtime/coach/decisions.jsonl while only the seeded stale done.json exists (before the dispatched planner writes a fresh done.json)"
        - "The PLANNED->RED transition record's timestamp is greater than or equal to the mtime of the dispatched planner's fresh done.json"
        - "Exactly one record in decisions.jsonl has decision_type=phase-transition with inputs.current_phase=PLANNED and inputs.target_phase=RED"
    metadata:
      author: "atdd:planner-711"
      created: "2026-05-15"
