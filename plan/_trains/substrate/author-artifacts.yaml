train_id: train:substrate:author-artifacts
title: Author Substrate
description: 'Authoring substrate train: define canonical schemas + flat homes, validate
  author input on a shared spine, then deterministically write the four governance
  artifact kinds (convention-node, relationship, scope, gate) so authored artifacts
  pass normal ATDD validation unmodified.'
themes:
- commons
primary_wagon: author-atdd-substrate
route_space:
  classification: single-route
  basis: not-yet-assessed
  retires_with: 1549
participants:
- wagon:author-atdd-substrate
- wagon:author-plan-substrate
- system:atdd-cli
sequence:
- step: 1
  intent: Define one canonical schema and flat canonical home per artifact kind
  from: wagon:author-atdd-substrate
  to: system:atdd-cli
  artifact: commons:author:substrate-schemas
- step: 2
  intent: Validate role/id/path on the shared author spine before any write
  from: wagon:author-atdd-substrate
  to: system:atdd-cli
  artifact: commons:author:author-spine
- step: 3
  intent: Author convention-nodes (flat per-rule_id files) once the shared spine lands
  from: wagon:author-atdd-substrate
  to: system:atdd-cli
  artifact: commons:author:convention-node-command
- step: 4
  intent: Author relationship edges into the single relationships.yaml registry (parallel
    after spine)
  from: wagon:author-atdd-substrate
  to: system:atdd-cli
  artifact: commons:author:relationship-command
- step: 5
  intent: Author scope selectors into the single scopes.yaml registry (parallel after
    spine)
  from: wagon:author-atdd-substrate
  to: system:atdd-cli
  artifact: commons:author:scope-command
- step: 6
  intent: Author gates into per-trigger gate files (parallel after spine)
  from: wagon:author-atdd-substrate
  to: system:atdd-cli
  artifact: commons:author:gate-command
- step: 7
  intent: "Author the five plan-layer kinds (wagon/feature/wmbt/train/acceptance)\
    \ under plan/, reusing the spine via a plan-artifact guard \u2014 the on-Confirm\
    \ writer for atdd plan (#1139)"
  from: wagon:author-plan-substrate
  to: system:atdd-cli
  artifact: commons:author:wagon-command
status: planned
category: nominal
