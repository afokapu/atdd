train_id: train:substrate:admit-packages
title: Admit Substrate
description: "Admission substrate train: the front door that admits external extension/workspace\
  \ packages into a project \u2014 define the substrate/lock/registry schemas, read\
  \ registries, resolve+validate+compose an artifact against core, then install it\
  \ into a versioned home with a sha256 digest and a lockfile, all without executing\
  \ any runtime implementation. Sibling to the author-substrate train; runtime binding\
  \ is a later train."
themes:
- commons
primary_wagon: admit-substrate
route_space:
  classification: single-route
  basis: not-yet-assessed
  retires_with: 1549
participants:
- wagon:admit-substrate
- system:atdd-cli
sequence:
- step: 1
  intent: Define canonical substrate.yaml / substrate.lock.yaml / registry-index schemas
  from: wagon:admit-substrate
  to: system:atdd-cli
  artifact: commons:admit:substrate-schemas
- step: 2
  intent: Read configured registries and locate artifacts by alias/id/tags/kind
  from: wagon:admit-substrate
  to: system:atdd-cli
  artifact: commons:admit:registry-reader
- step: 3
  intent: "Resolve a ref/alias/path, validate the manifest + owned files + realizes/depends_on,\
    \ and compose a protocol view \u2014 never executing runtime code"
  from: wagon:admit-substrate
  to: system:atdd-cli
  artifact: commons:admit:artifact-resolver
- step: 4
  intent: Install a validated package into a versioned .atdd/ home, record a sha256
    digest, and write the intent + lock
  from: wagon:admit-substrate
  to: system:atdd-cli
  artifact: commons:admit:substrate-installer
- step: 5
  intent: Surface the four admission commands (search/add/remove/list) over the locked
    substrate
  from: wagon:admit-substrate
  to: system:atdd-cli
  artifact: commons:admit:admission-cli
status: planned
category: nominal
