train_id: train:coach:place-worktrees
title: Place Worktrees
description: 'Worktree-placement train: turn seven independent worktree-path derivations
  into one config-backed resolver, so an operator chooses the repo layout once via
  worktree_root and both creation paths, the spawned-agent launch prompt, and the
  orphan scanner agree on it. Default is the current flat-sibling layout, so an upgraded
  repo that configures nothing sees no change. Carries the transactional self-relocation
  offer. Standalone by design: it shares no wagon with another train, so its validation
  blast radius is this wagon alone.'
category: nominal
themes:
- commons
primary_wagon: place-worktrees
route_space:
  classification: single-route
  basis: sole-terminal-outcome
sequence:
- step: 1
  intent: Resolve the worktree directory from a worktree_root config key defaulting
    to the flat sibling
  from: wagon:place-worktrees
  to: system:atdd-cli
  artifact: commons:coach:worktree-root-resolver
- step: 2
  intent: Route both creation paths, the launch-prompt path, and the orphan scan through
    that resolver
  from: wagon:place-worktrees
  to: system:atdd-cli
  artifact: commons:coach:worktree-root-resolver
- step: 3
  intent: Offer a transactional self-relocation when the configured and actual layouts
    disagree
  from: wagon:place-worktrees
  to: system:atdd-cli
  artifact: commons:coach:worktree-relocation-offer
participants:
- wagon:place-worktrees
- system:atdd-cli
status: planned
