train_id: train:documentation-obligation:restore-obligation-observability
title: Restore Documentation Obligation Observability
description: "Error-path train (category: error): a documentation capability is installed\
  \ and ran to completion but could not answer \u2014 its toolchain is absent, the\
  \ documentation tree is unreadable, or a render failed in a way it cannot attribute.\
  \ The verdict is COULD_NOT_CHECK. This blocks, and it is deliberately not the exception\
  \ route: nothing was observed to be wrong, so the remedy is to restore observability\
  \ rather than to author documentation. Conflating this with a pass is the defect\
  \ class #1745, #1774 and #1716 record."
category: error
themes:
- commons
family: behavior
primary_wagon: govern-documentation-obligation
sequence:
- step: 1
  intent: Run the installed capability to completion and receive no judgeable observation
  from: wagon:govern-documentation-obligation
  to: system:atdd-cli
  artifact: commons:documentation-capability-seam
- step: 2
  intent: Emit COULD_NOT_CHECK as data, naming why observation failed rather than
    returning clean
  from: wagon:govern-documentation-obligation
  to: system:atdd-cli
  artifact: commons:documentation-verdict
- step: 3
  intent: Block the transition and surface the unobservable lookup in the gate report
  from: wagon:govern-lifecycle
  to: system:atdd-cli
  artifact: commons:documentation-complete-decision
participants:
- wagon:govern-documentation-obligation
- wagon:govern-lifecycle
- system:atdd-cli
status: planned
source_interlocking:
  interlocking_id: interlocking:govern-documentation-obligation
  route_id: restore-obligation-observability
