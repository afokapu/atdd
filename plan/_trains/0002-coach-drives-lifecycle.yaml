train_id: "0002-coach-drives-lifecycle"
title: "Coach Drives Lifecycle"
description: "Replace polling-and-trust with an event-driven, observer-augmented coach that drives the issue → merged-PR lifecycle (per atdd-coach-spec-v9.md). Absorbs valuable machinery from atdd orchestrate and atdd babysit; introduces durable state, two-tier verification, six judge call sites, and pre-coach issue review."
themes:
  - commons
primary_wagon: freeze-runtime-contracts
participants:
  - "wagon:freeze-runtime-contracts"
  - "wagon:drive-state-machine"
  - "wagon:spawn-agents"
  - "wagon:observe-and-correct"
  - "wagon:dispatch-validators"
  - "wagon:review-phase-boundaries"
  - "wagon:judge-ambiguous-decisions"
  - "wagon:discover-and-decommission"
  - "wagon:integrate-end-to-end"
  - "wagon:integration-hardening"
  - "wagon:coach-ops"
  - "wagon:coach-wave-orchestration"
  - "wagon:consolidate-coach-workspace"
  - "system:atdd-cli"
sequence:
  - step: 1
    intent: "Freeze runtime + validator contracts (schemas, layout, invocation, event semantics) so parallel tracks share a stable interface"
    from: "wagon:freeze-runtime-contracts"
    to: "wagon:drive-state-machine"
    artifact: "commons:contract:schema"
  - step: 2
    intent: "Drive the per-issue state machine (INIT → COMPLETE) with durable decisions.jsonl, two-phase commit, and runtime watchers"
    from: "wagon:drive-state-machine"
    to: "system:atdd-cli"
    artifact: "commons:coach:decision"
  - step: 3
    intent: "Spawn persona agents via atdd spawn — harness rendering, substrate spawn-blocks, canonical naming + layout, per-LLM convention files"
    from: "wagon:spawn-agents"
    to: "wagon:drive-state-machine"
    artifact: "commons:coach:spawn"
  - step: 4
    intent: "Observe-and-correct via observer sidecars — replaces babysit polling with event-driven runtime watcher and 17 default rules"
    from: "wagon:observe-and-correct"
    to: "wagon:drive-state-machine"
    artifact: "commons:coach:correction"
  - step: 5
    intent: "Dispatch tier-1 validators per phase (toolkit conventions + substrate v12 repo rules) and compute risk score"
    from: "wagon:dispatch-validators"
    to: "wagon:drive-state-machine"
    artifact: "commons:coach:validator-result"
  - step: 6
    intent: "Adversarial review at phase boundaries (PLANNED, RED, GREEN, SMOKE) with no-write reviewer persona — depends on spawn (K2) and validator dispatch (M3)"
    from: "wagon:review-phase-boundaries"
    to: "wagon:drive-state-machine"
    artifact: "commons:coach:review"
  - step: 7
    intent: "Judge ambiguous decisions via six v1 call sites and run multi-pass pre-coach issue review"
    from: "wagon:judge-ambiguous-decisions"
    to: "wagon:drive-state-machine"
    artifact: "commons:coach:judgment"
  - step: 8
    intent: "Discover rules over the registry; decommission atdd orchestrate and atdd babysit (gated on K5 / L8 parity suites passing)"
    from: "wagon:discover-and-decommission"
    to: "system:atdd-cli"
    artifact: "commons:coach:discovery"
  - step: 9
    intent: "End-to-end integration: drive a real issue from atdd coach <N> through COMPLETE with PR opened; observe substrate↔coach integration bugs as the done-line"
    from: "wagon:integrate-end-to-end"
    to: "system:atdd-cli"
    artifact: "commons:compliance:gate"
  - step: 10
    intent: "Wire all eight integration gaps (K1 spawn, J3 decisions.jsonl, J5 watcher, M3 validator dispatch, L1 observer, N5 reviewer, J4 two-phase commit, LLM registry) into atdd coach <N> so it drives a real issue from INIT to MERGED autonomously"
    from: "wagon:integration-hardening"
    to: "system:atdd-cli"
    artifact: "commons:coach:spawn-wiring"
  - step: 11
    intent: "Rate-limit-aware batched PR polling — replaces per-PR gh pr view with a single gh pr list call; exponential backoff on 403-abuse; atdd coach watch + atdd agent wait-ci CLI"
    from: "wagon:coach-ops"
    to: "system:atdd-cli"
    artifact: "commons:coach:pr-watcher"
status: planned
