- id: frag:unrealized-obligation-detected
  kind: alt
  acceptance_refs:
  - acceptance:unrealized-obligation-detected
  wmbt_refs:
  - wmbt:bind-extension-conventions:L001
  guards:
  - id: guard:unrealized-obligation
    wmbt_refs:
    - wmbt:bind-extension-conventions:L001
    expression: declared == true and gating == true and realized == false
- id: frag:orphan-detector-decommissioned
  kind: alt
  acceptance_refs:
  - acceptance:orphan-detector-decommissioned
  wmbt_refs:
  - wmbt:govern-providers:E002
  guards:
  - id: guard:orphan-detector
    wmbt_refs:
    - wmbt:govern-providers:E002
    expression: declared == false and realized == true
invariants:
- id: inv:gating-node-is-bound
  wmbt_ref: wmbt:bind-extension-conventions:E002
  expression: gating == true and bound == true
- id: inv:no-orphan-detector
  wmbt_ref: wmbt:govern-providers:E002
  expression: realized == true and declared == true
- id: inv:strict-fails-closed
  wmbt_ref: wmbt:enforce-conventions-ci:E002
  expression: disposition == 'strict' and violations > 0
- id: inv:no-silent-succession-loss
  wmbt_ref: wmbt:guard-succession:E003
  expression: declared == true and core_backed == false and bound == true
residuals:
- id: residual:ratchet-baseline
  kind: structural
  acceptance_ref: acc:enforce-extension-conventions:enforcement-ratchet-baseline
  wmbt_refs:
  - wmbt:enforce-conventions-ci:E003
  validator_ref: src/atdd/enforce/validators/test_ratchet_baseline.py
  reason: the pre-existing 13 failing rules are held flat by a recorded baseline rather
    than by a guarded route, because the baseline is a stored artifact and not a decision
    branch
- id: residual:mirror-coherence
  kind: structural
  acceptance_ref: acc:enforce-extension-conventions:mirror-coherence-validation
  wmbt_refs:
  - wmbt:govern-registry:E001
  validator_ref: src/atdd/planner/validators/test_extension_mirror_coherence.py
  reason: extension nodes mirror core rules as data read by a validator, not as a
    route the enforcement entrypoint can take
- id: residual:duplicate-precedence
  kind: structural
  acceptance_ref: acc:enforce-extension-conventions:duplicate-rule-precedence
  wmbt_refs:
  - wmbt:govern-registry:E002
  validator_ref: src/atdd/coach/validators/test_rule_id_uniqueness.py
  reason: a duplicate rule_id is detected while building the registry at import time,
    before any enforcement entrypoint runs, so it cannot be expressed as a guarded
    route
