entrypoint:
  exposed: true
  actions:
  - run_enforce_gate
  reason: null
route_resolution:
  strategy: first_priority
lifelines:
- ref: wagon:govern-registry
- ref: wagon:govern-providers
- ref: wagon:bind-extension-conventions
- ref: wagon:reconcile-dispositions
- ref: wagon:enforce-conventions-ci
- ref: wagon:verify-enforcement
- ref: wagon:guard-succession
messages:
- id: msg:project-registry
  kind: boundary
  from: wagon:govern-registry
  to: wagon:bind-extension-conventions
  intent: project the core rule registry
  payload:
    contract: commons:rule-registry
  wmbt_refs:
  - wmbt:govern-registry:D001
- id: msg:index-realization
  kind: boundary
  from: wagon:govern-providers
  to: wagon:bind-extension-conventions
  intent: index each implementation to the conventions it realizes
  payload:
    contract: commons:provider-capability
  wmbt_refs:
  - wmbt:bind-extension-conventions:E001
  - wmbt:govern-providers:D001
  - wmbt:govern-providers:E001
- id: msg:reconcile-lock
  kind: boundary
  from: wagon:bind-extension-conventions
  to: wagon:reconcile-dispositions
  intent: reconcile the binding lock
  payload:
    contract: commons:binding-lock
  wmbt_refs:
  - wmbt:govern-providers:E003
- id: msg:publish-policy
  kind: boundary
  from: wagon:reconcile-dispositions
  to: wagon:enforce-conventions-ci
  intent: publish the disposition policy
  payload:
    contract: commons:disposition-policy
  wmbt_refs:
  - wmbt:reconcile-dispositions:D001
  - wmbt:reconcile-dispositions:E002
- id: msg:emit-verdict
  kind: boundary
  from: wagon:enforce-conventions-ci
  to: wagon:verify-enforcement
  intent: emit the enforcement verdict
  payload:
    contract: commons:enforce-verdict
  wmbt_refs:
  - wmbt:enforce-conventions-ci:E002
- id: msg:feed-succession
  kind: boundary
  from: wagon:verify-enforcement
  to: wagon:guard-succession
  intent: feed succession coverage to the deletion guard
  payload:
    contract: commons:succession-coverage
  wmbt_refs:
  - wmbt:verify-enforcement:M001
  - wmbt:verify-enforcement:E001
fragments:
- id: frag:clean-gate-passes
  kind: alt
  acceptance_refs:
  - acceptance:clean-gate-passes
  wmbt_refs:
  - wmbt:enforce-conventions-ci:E001
  guards:
  - id: guard:clean-gate
    wmbt_refs:
    - wmbt:enforce-conventions-ci:E001
    expression: bound == true and violations == 0
- id: frag:strict-violation-fails
