schema_version: 1.0.0
interlocking_id: interlocking:enforce-extension-conventions
title: Enforce extension conventions as a CI gate
theme: commons
status: draft
source:
  path: plan/_trains/_interlockings/enforce-extension-conventions.yaml
  content_digest: be8374f435aff2e5e63f409a3d674af82bac6a4a4ca084e18996c3a3b8400b1c
entrypoint:
  exposed: true
  actions:
  - run_enforce_gate
  reason: null
route_resolution:
  strategy: first_priority
lifelines:
- ref: wagon:govern-registry
- ref: wagon:govern-providers
- ref: wagon:bind-extension-conventions
- ref: wagon:reconcile-dispositions
- ref: wagon:enforce-conventions-ci
- ref: wagon:verify-enforcement
messages:
- id: msg:project-registry
  kind: boundary
  from: wagon:govern-registry
  to: wagon:bind-extension-conventions
  intent: project the core rule registry
  payload:
    contract: commons:rule-registry
- id: msg:index-realization
  kind: boundary
  from: wagon:govern-providers
  to: wagon:bind-extension-conventions
  intent: index each implementation to the conventions it realizes
  payload:
    contract: commons:provider-capability
- id: msg:reconcile-lock
  kind: boundary
  from: wagon:bind-extension-conventions
  to: wagon:reconcile-dispositions
  intent: reconcile the binding lock
  payload:
    contract: commons:binding-lock
- id: msg:publish-policy
  kind: boundary
  from: wagon:reconcile-dispositions
  to: wagon:enforce-conventions-ci
  intent: publish the disposition policy
  payload:
    contract: commons:disposition-policy
- id: msg:emit-verdict
  kind: boundary
  from: wagon:enforce-conventions-ci
  to: wagon:verify-enforcement
  intent: emit the enforcement verdict
  payload:
    contract: commons:enforce-verdict
- id: msg:feed-succession
  kind: boundary
  from: wagon:verify-enforcement
  to: wagon:govern-registry
  intent: feed succession coverage to the deletion guard
  payload:
    contract: commons:succession-coverage
fragments:
- id: frag:clean-gate-passes
  kind: alt
  acceptance_refs:
  - acceptance:clean-gate-passes
  guards:
  - id: guard:clean-gate
    expression: bound == true and violations == 0
- id: frag:strict-violation-fails
  kind: alt
  acceptance_refs:
  - acceptance:strict-violation-fails
  guards:
  - id: guard:strict-violation
    expression: bound == true and disposition == 'strict' and violations > 0
- id: frag:advisory-violation-reports
  kind: alt
  acceptance_refs:
  - acceptance:advisory-violation-reports
  guards:
  - id: guard:advisory-violation
    expression: bound == true and disposition == 'advisory' and violations > 0
- id: frag:unbound-declaration-detected
  kind: alt
  acceptance_refs:
  - acceptance:unbound-declaration-detected
  guards:
  - id: guard:unbound-declaration
    expression: declared == true and gating == true and realized == true and bound
      == false and core_backed == true
- id: frag:succession-loss-blocked
  kind: alt
  acceptance_refs:
  - acceptance:succession-loss-blocked
  guards:
  - id: guard:succession-loss
    expression: declared == true and gating == true and realized == true and bound
      == false and core_backed == false
- id: frag:unrealized-obligation-detected
  kind: alt
  acceptance_refs:
  - acceptance:unrealized-obligation-detected
  guards:
  - id: guard:unrealized-obligation
    expression: declared == true and gating == true and realized == false
- id: frag:orphan-detector-decommissioned
  kind: alt
  acceptance_refs:
  - acceptance:orphan-detector-decommissioned
  guards:
  - id: guard:orphan-detector
    expression: declared == false and realized == true
invariants:
- id: inv:gating-node-is-bound
  expression: gating == true and bound == true
- id: inv:no-orphan-detector
  expression: realized == true and declared == true
- id: inv:strict-fails-closed
  expression: disposition == 'strict' and violations > 0
- id: inv:no-silent-succession-loss
  expression: declared == true and core_backed == false and bound == true
residuals:
- id: residual:ratchet-baseline
  kind: structural
  acceptance_ref: acceptance:enforcement-ratchet-baseline
  validator_ref: src/atdd/enforce/validators/test_ratchet_baseline.py
  reason: the pre-existing 13 failing rules are held flat by a recorded baseline rather
    than by a guarded route, because the baseline is a stored artifact and not a decision
    branch
- id: residual:mirror-coherence
  kind: structural
  acceptance_ref: acceptance:mirror-coherence-validation
  validator_ref: src/atdd/planner/validators/test_extension_mirror_coherence.py
  reason: extension nodes mirror core rules as data read by a validator, not as a
    route the enforcement entrypoint can take
- id: residual:duplicate-precedence
  kind: structural
  acceptance_ref: acceptance:duplicate-rule-precedence
  validator_ref: src/atdd/coach/validators/test_rule_id_uniqueness.py
  reason: a duplicate rule_id is detected while building the registry at import time,
    before any enforcement entrypoint runs, so it cannot be expressed as a guarded
    route
