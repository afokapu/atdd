components:
  backend:
    application:
    - count: 1
      rationale: graph-query / parity / matrix logic
      type: use_cases
    domain:
    - count: 1
      rationale: result/record dataclasses
      type: value_objects
    integration:
    - count: 0
      rationale: reads composed graph + reports
      type: schemas
    presentation:
    - count: 0
      rationale: pytest-collected gate
      type: controllers
description: A harness that seeds one realistic fault per legacy rule plus a clean
  baseline, runs both the legacy and convention suites on identical inputs, and builds
  a catch-matrix + gap report quantifying parity, improvements, regressions, and false
  positives.
sizing:
  footprint_score: 5
  footprint_size: S
  wmbts: 5
urn: feature:validate-conventions:differential-catch-matrix-harness
wagon: wagon:validate-conventions
wmbts:
- wmbt:validate-conventions:E027
- wmbt:validate-conventions:E028
- wmbt:validate-conventions:E029
- wmbt:validate-conventions:E030
- wmbt:validate-conventions:E031
