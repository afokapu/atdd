urn: wmbt:validate-conventions:E033
step: execute
direction: minimize
dimension: likelihood
object_of_control: binding-fault-filesystem-mutation
context_clarifier: binding-family faults are injected by renaming a rule id in a cloned
  graph while the emitted bind_rule index is left unchanged, so no convention YAML
  is ever rewritten
lens: functional.sustainability
statement: minimize likelihood of binding-fault-filesystem-mutation by ensuring binding-family
  faults are injected by renaming a rule id in a cloned graph while the emitted bind_rule
  index is left unchanged, so no convention YAML is ever rewritten
acceptances:
- identity:
    urn: acc:validate-conventions:E033-RED-001-binding-fault-rewrites-convention-yaml
    id: AC-RED-001
    purpose: Before the in-memory mutation helper exists, binding-family fault injection
      rewrites a real convention YAML on disk and reverts it in a finally block.
    phase: RED
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - The binding family's assert_fault_convention_only helper
    - A byte-level snapshot of the convention YAML it targets
  when:
    abstract: A binding fault variant is executed
  then:
    abstract:
    - The targeted convention YAML differs from its snapshot at some point during
      the test
    - A test asserting the file is byte-identical throughout therefore fails
  metadata:
    author: atdd:planner
    created: '2026-07-10'
- identity:
    urn: acc:validate-conventions:E033-GREEN-001-binding-fault-injected-into-cloned-graph
    id: AC-GREEN-001
    purpose: Binding faults are injected by renaming a rule id in a deep-copied graph
      while the emitted bind_rule index is left untouched, producing the same declaration/implementation
      roundtrip break with no filesystem write.
    phase: GREEN
  harness:
    type: unit
    category: backend
  given:
    abstract:
    - A _support/graph_mutations.py exposing clone_graph and rename_rule_id
    - The session-scoped clean_convention_graph fixture from E032
  when:
    abstract: A binding fault variant is executed against a cloned, mutated graph
  then:
    abstract:
    - The emitted_identity_roundtrip template flags the injected rule, and only that
      rule
    - Evidence keys are a subset of the template's declared failure_evidence
    - Every convention YAML under src/atdd is byte-identical before and after the
      test
    - "The session clean_convention_graph is unmutated \u2014 its node ids are unchanged"
  metadata:
    author: atdd:planner
    created: '2026-07-10'
- identity:
    urn: acc:validate-conventions:E033-SMOKE-001-no-yaml-written-in-real-checkout
    id: AC-SMOKE-001
    purpose: In a real checkout, running the binding family through the real pytest
      entrypoint leaves the working tree untouched.
    phase: SMOKE
  harness:
    type: smoke
    category: backend
  given:
    abstract:
    - A real repo checkout with a clean git working tree
  when:
    abstract: pytest is invoked as a subprocess over the binding family
  then:
    abstract:
    - The suite exits 0
    - git status reports no modification to any tracked convention YAML
    - "The binding fault is still caught \u2014 coverage is preserved, not removed"
  metadata:
    author: atdd:planner
    created: '2026-07-10'
