action: defines the family/template catalogue, registry, and template contract, and
  instantiates graph-question variants that select eligible nodes by metadata and
  assert template-shaped failure evidence
context: authoring-and-enforcing-convention-graph-validators, while-legacy-persona-validators-still-run
description: 'Convention-graph validator family/template suite under src/atdd/validators/conventions/:
  13 graph-question families and 22 reusable templates that ask executable questions
  against the composed convention graph, backed by a machine-readable registry and
  a typed template contract, with registry<->archetype conformance. Runs in parallel
  with the legacy persona validators until parity (#1205/#1206) permits their decommissioning
  (#1207).'
features:
- urn: feature:validate-conventions:family-template-catalogue
- urn: feature:validate-conventions:registry-archetype-conformance
- urn: feature:validate-conventions:legacy-parity-audit
- urn: feature:validate-conventions:p0-graph-integrity-variants
- urn: feature:validate-conventions:p1-parity-variants
- urn: feature:validate-conventions:variant-metadata-conformance
- urn: feature:validate-conventions:shadow-and-promote
- urn: feature:validate-conventions:legacy-decommission
- urn: feature:validate-conventions:anti-regression-gate
- urn: feature:validate-conventions:convention-graph-query-contract
- urn: feature:validate-conventions:sentinel-parity-gates
- urn: feature:validate-conventions:stricter-finding-adjudication
- urn: feature:validate-conventions:differential-catch-matrix-harness
goal: organize validators by graph-question family rather than persona so new convention
  nodes are auto-captured by reusable templates, and prove parity before any legacy
  decommissioning
name: Validate Conventions
outcome: src/atdd/validators/conventions/<family>/ exists with 13 families, 22 templates,
  a registry, and a template contract; convention validators run in parallel with
  legacy and become authoritative once parity is proven
subject: agent:tester
theme: commons
urn: wagon:validate-conventions
wagon: validate-conventions
produce:
- name: commons:validators:convention-family-registry
  contract: null
  telemetry: null
  to: external
- name: commons:validators:convention-template-contract
  contract: null
  telemetry: null
  to: external
consume: []
wmbt:
