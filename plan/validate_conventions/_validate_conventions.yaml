  Y003: minimize likelihood of coverage-loss-on-legacy-validator-sweep-retirement — no rule implementation.ref/validator resolves to a deleted persona-folder validator and every repointed rule binds to an executing convention variant (not an xfail/stub); complements Y001 (map safety) and Y002 (preflight visibility)
