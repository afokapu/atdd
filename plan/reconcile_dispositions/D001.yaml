urn: "wmbt:reconcile-dispositions:D001"
step: "define"
direction: "minimize"
dimension: "likelihood"
object_of_control: "the-three-distinct-things-spelled-disposition-being-conflated-into-one-namespace"
context_clarifier: "three unrelated things are all spelled `disposition` in the enforcement stack and today share no model, so they get confused: (1) a convention node's `metadata.disposition` is a TREATMENT that says how a rule's violations map to a verdict, with the vocabulary {strict, advisory, suppress-and-clean, documentation-only}; (2) a `binding.lock.yaml` convention entry's `disposition: bound` is a WIRING state that marks a convention married to a provider so the runner enforces it — it shares the spelling but not the vocabulary; (3) `disposition_gate` is the NAME of the suppression-marker validator, not a value any node carries. The model must name all three separately — as importable, non-colliding constants under the enforce package — so a documentation-only node (treatment) can never again be read as strict, and a bound entry (wiring) can never be read as a treatment. The treatment namespace carries the single total verdict rule (strict/suppress-and-clean fail on any violation; advisory/documentation-only never fail); the wiring value `bound` is explicitly NOT a member of the treatment vocabulary."
lens: "functional.effectiveness"
statement: "minimize likelihood of the three distinct things spelled disposition being conflated into one namespace by defining a single model under the enforce package that names the node metadata disposition treatment, the binding-lock disposition:bound wiring, and the validator disposition gate as three separate, importable namespaces"
acceptances:
  - identity:
      urn: "acc:reconcile-dispositions:D001-UNIT-001-treatment-vocabulary-is-the-four-treatments"
      id: "AC-UNIT-001"
      purpose: "The treatment namespace enumerates exactly the four metadata.disposition treatments and excludes the wiring value bound"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The disposition model imported from the enforce package"
    when:
      abstract: "The treatment vocabulary set is read"
      action: "invoke"
    then:
      abstract:
        - "The treatment vocabulary is exactly {strict, advisory, suppress-and-clean, documentation-only}"
        - "The binding-lock wiring value 'bound' is NOT a member of the treatment vocabulary"
      assertions:
        - type: "equals"
        - type: "excludes"
    signal: {}
    metadata:
      wagon: "reconcile-dispositions"
      feature: "reconcile-dispositions"
  - identity:
      urn: "acc:reconcile-dispositions:D001-UNIT-002-three-namespaces-named-separately-without-collision"
      id: "AC-UNIT-002"
      purpose: "The model names the treatment vocabulary, the wiring value bound, and the disposition-gate validator name as three distinct constants"
      phase: "RED"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The disposition model imported from the enforce package"
    when:
      abstract: "The three namespace anchors (treatment vocabulary, wiring value, gate name) are read"
      action: "invoke"
    then:
      abstract:
        - "The wiring value constant equals 'bound' and the gate-name constant equals 'disposition_gate'"
        - "No single symbol conflates a treatment with the wiring value or the gate name"
      assertions:
        - type: "equals"
        - type: "distinct"
    signal: {}
    metadata:
      wagon: "reconcile-dispositions"
      feature: "reconcile-dispositions"
  - identity:
      urn: "acc:reconcile-dispositions:D001-SMOKE-001-model-imports-cleanly-in-the-installed-package"
      id: "AC-SMOKE-001"
      purpose: "The disposition model imports from the installed atdd.enforce package and exposes the three namespaces without an import error"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "integration"
    given:
      abstract:
        - "The atdd package installed in the runtime environment"
    when:
      abstract: "`atdd.enforce.dispositions` is imported and its three namespace anchors are accessed"
      action: "invoke"
    then:
      abstract:
        - "The import succeeds and the treatment vocabulary, the wiring value, and the gate name are all reachable as named module attributes"
      assertions:
        - type: "exists"
    close_the_loop:
      consumer_reacted: "the enforce runner and the conventions metadata reader both import the shared model rather than re-spelling disposition literals"
      drift_resolved: "grep for a hard-coded treatment literal outside the model finds only the model's own definition site"
    signal: {}
    metadata:
      wagon: "reconcile-dispositions"
      feature: "reconcile-dispositions"
