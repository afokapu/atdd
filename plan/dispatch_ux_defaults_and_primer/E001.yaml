urn: "wmbt:dispatch-ux-defaults-and-primer:E001"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "coach-dispatch-sessions-where-workspace-mode-is-selected-despite-cmux-workspace-id-being-set"
context_clarifier: "atdd coach currently defaults --multiplexer-mode to 'workspace' unconditionally, which creates a NEW cmux workspace and hides the worker offscreen — violating the established workspace:1-only convention and making it impossible for operators to see the worker spawn. When an operator is already inside a cmux session (CMUX_WORKSPACE_ID is set in env), the correct default is 'pane' so the worker appears as a sibling pane in the existing workspace rather than spawning a new offscreen workspace. The fix is an env-aware default in the CLI entrypoint: if CMUX_WORKSPACE_ID is set and --multiplexer-mode was not provided explicitly, default to 'pane'."
lens: "functional.effectiveness"
statement: "minimize likelihood of coach-dispatch-sessions-where-workspace-mode-is-selected-despite-cmux-workspace-id-being-set when atdd coach is invoked from inside a cmux session — by defaulting multiplexer-mode to pane when cmux-workspace-id is present in the environment and the operator has not passed the flag explicitly"
acceptances:
  - identity:
      urn: "acc:dispatch-ux-defaults-and-primer:E001-UNIT-001-pane-mode-default-when-cmux-workspace-id-set"
      id: "AC-UNIT-001"
      purpose: "multiplexer_mode resolves to 'surface' when CMUX_WORKSPACE_ID is set and --multiplexer-mode was not passed (E007 supersedes original 'pane' fix)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/coach.py exposes a resolve_multiplexer_mode(explicit_flag, env) helper"
        - "env contains CMUX_WORKSPACE_ID='workspace:1'"
    when:
      abstract: "resolve_multiplexer_mode is called with explicit_flag=None and env={'CMUX_WORKSPACE_ID': 'workspace:1'}"
    then:
      abstract:
        - "The return value is 'surface' (E007: cmux new-pane is also deprecated; canonical RPC is new-surface)"
        - "When explicit_flag='surface' and CMUX_WORKSPACE_ID is set, the return value is 'surface' (explicit override wins)"
        - "When CMUX_WORKSPACE_ID is absent and explicit_flag is None, the return value is 'surface' (unconditional default)"
    metadata:
      author: "atdd:planner"
      created: "2026-05-20"
      updated: "2026-05-21"
  - identity:
      urn: "acc:dispatch-ux-defaults-and-primer:E001-UNIT-002-pane-mode-default-respects-tmux-env"
      id: "AC-UNIT-002"
      purpose: "resolve_multiplexer_mode returns 'surface' unconditionally — TMUX env has no special effect (E007)"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "src/atdd/coach/commands/coach.py exposes resolve_multiplexer_mode(explicit_flag, env)"
        - "env contains TMUX='/tmp/tmux-socket,12345,0' but not CMUX_WORKSPACE_ID"
    when:
      abstract: "resolve_multiplexer_mode is called with explicit_flag=None and env={'TMUX': '/tmp/tmux-socket,12345,0'}"
    then:
      abstract:
        - "The return value is 'surface' (unconditional default since E007 — pane is also deprecated)"
        - "When neither CMUX_WORKSPACE_ID nor TMUX is set and explicit_flag is None, the return value is 'surface'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-20"
      updated: "2026-05-21"
  - identity:
      urn: "acc:dispatch-ux-defaults-and-primer:E001-SMOKE-001-pane-mode-in-real-cmux-session"
      id: "AC-SMOKE-001"
      purpose: "Against a real cmux session (CMUX_WORKSPACE_ID set), atdd coach resolves surface mode without the operator passing --multiplexer-mode"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "A real cmux session is available (CMUX_WORKSPACE_ID is set in the shell environment)"
        - "ATDD_RUN_SMOKE=1 is set in the environment"
        - "A valid issue number N is accessible"
    when:
      abstract: "atdd coach <N> is invoked without --multiplexer-mode from inside the cmux session"
    then:
      abstract:
        - "The coach log confirms 'surface' mode was selected (not 'workspace' or 'pane')"
        - "No new cmux workspace (workspace:2+) is created during the dispatch"
        - "The spawn call uses cmux new-surface --pane <ref>"
    metadata:
      author: "atdd:planner"
      created: "2026-05-20"
      updated: "2026-05-21"
  - identity:
      urn: "acc:dispatch-ux-defaults-and-primer:E001-INTEGRATION-001-coach-cli-uses-resolve-multiplexer-mode"
      id: "AC-INTEGRATION-001"
      purpose: "The atdd coach CLI entrypoint calls resolve_multiplexer_mode and passes the result to the spawn pipeline; the mode seen by the spawn call is 'surface' when CMUX_WORKSPACE_ID is set"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A monkeypatched spawn pipeline that records the multiplexer_mode it receives"
        - "CMUX_WORKSPACE_ID='workspace:1' is set in the test environment"
        - "--multiplexer-mode is not passed on the CLI invocation"
    when:
      abstract: "atdd coach <N> is invoked programmatically (or via subprocess) without --multiplexer-mode"
    then:
      abstract:
        - "The recorded multiplexer_mode is 'surface'"
        - "No 'workspace:2' or higher workspace is created in the cmux session"
    metadata:
      author: "atdd:planner"
      created: "2026-05-20"
      updated: "2026-05-21"
