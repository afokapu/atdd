urn: "wmbt:dispatch-ux-defaults-and-primer:Y002"
step: "modify"
direction: "minimize"
dimension: "likelihood"
object_of_control: "stale-upgrade-banner-cluttering-every-atdd-command-after-sync-has-run"
context_clarifier: "Every atdd invocation prints '⚠️  ATDD upgraded (3.42.0 → 3.77.0). Run: atdd sync && atdd init --force' even after the operator has already run atdd sync. Additionally, a buggy '→ 4.0.0' footer line appears (wrong version) on some invocations. The banner should be muted after atdd sync runs by writing a marker file (e.g. .atdd/runtime/sync_acknowledged_{version}) — any subsequent atdd invocation that finds the marker skips the banner. The marker is cleared when the toolkit version bumps again, so operators see the banner exactly once per upgrade."
lens: "functional.effectiveness"
statement: "minimize likelihood of stale-upgrade-banner-cluttering-every-atdd-command-after-sync-has-run when atdd sync has been successfully executed — by writing a sync-acknowledged marker file and checking for it before emitting the upgrade banner"
acceptances:
  - identity:
      urn: "acc:dispatch-ux-defaults-and-primer:Y002-UNIT-001-banner-muted-when-marker-exists"
      id: "AC-UNIT-001"
      purpose: "check_upgrade_sync_needed returns None (no banner) when the toolkit-sync record names the installed version"
      phase: "RED"
    given:
      abstract:
        - "src/atdd/version_check.py exposes check_upgrade_sync_needed() and _read_sync_record(root)"
        - "A sync record at '.atdd/runtime/toolkit-sync.json' names the installed version"
    when:
      abstract: "check_upgrade_sync_needed is called on that checkout"
    then:
      abstract:
        - "The return value is None — no banner is emitted"
        - "When no record exists, the reader returns None and the check falls back to the legacy toolkit.last_version field"
        - "When the record names a DIFFERENT (older) version, a banner is returned reporting that version as the from-version (new upgrade)"
    notes: |
      #1641 supersedes the per-version marker-file mechanism this WMBT originally
      prescribed ('sync_acknowledged_{version}' + should_emit_upgrade_banner). The
      control objective is unchanged and the directory is the one named here
      (.atdd/runtime/); only the representation changed, to a single JSON record
      that carries the synced version instead of one file per version. The URN is
      retained as a stable identity — 'marker' in it now means that record.
    harness:
      type: "unit"
      category: "backend"
    metadata:
      author: "atdd:planner"
      created: "2026-05-20"
  - identity:
      urn: "acc:dispatch-ux-defaults-and-primer:Y002-SMOKE-001-banner-absent-after-sync-in-real-env"
      id: "AC-SMOKE-001"
      purpose: "After running atdd sync in a real shell, subsequent atdd invocations do not print the upgrade banner"
      phase: "SMOKE"
    harness:
      type: "smoke"
      category: "backend"
    given:
      abstract:
        - "ATDD_RUN_SMOKE=1 is set"
        - "atdd sync has been run and the marker file exists on disk"
    when:
      abstract: "atdd status (or any atdd subcommand) is run after atdd sync"
    then:
      abstract:
        - "The output does NOT contain the upgrade warning line starting with the warning symbol and 'ATDD upgraded'"
    metadata:
      author: "atdd:planner"
      created: "2026-05-20"
  - identity:
      urn: "acc:dispatch-ux-defaults-and-primer:Y002-UNIT-002-atdd-sync-writes-marker"
      id: "AC-UNIT-002"
      purpose: "Running atdd sync records the installed toolkit version in this checkout's toolkit-sync record"
      phase: "RED"
    given:
      abstract:
        - "The atdd sync command (or its main function) is invoked"
        - "A tmp repo root is passed or monkeypatched"
    when:
      abstract: "atdd sync completes successfully"
    then:
      abstract:
        - "'.atdd/runtime/toolkit-sync.json' exists and its last_synced_version is the installed version"
        - "A subsequent call to check_upgrade_sync_needed returns None"
        - "The write leaves the git working tree clean, because .atdd/runtime/ is gitignored"
    notes: |
      #1641 supersedes the marker-file mechanism (see AC-UNIT-001 notes). The
      writer is record_toolkit_sync(root), replacing update_toolkit_version,
      which wrote toolkit.last_version into the git-tracked .atdd/config.yaml —
      a correct but ephemeral write that every checkout/stash/reset reverted.
    harness:
      type: "unit"
      category: "backend"
    metadata:
      author: "atdd:planner"
      created: "2026-05-20"
