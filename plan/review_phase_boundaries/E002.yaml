urn: "wmbt:review-phase-boundaries:E002"
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "operator-inaccessible-reviewer-surface"
context_clarifier: "when an operator wants to run a review against a specific PR or commit outside of a full atdd coach <N> lifecycle run; the reviewer infrastructure (N1 no-write spawn adapter, N5 `atdd agent review` command, review-report.schema.json) is already wired for the coach lifecycle but there is no operator-facing CLI surface to invoke it standalone; operators are forced to do manual `gh pr diff` sweeps even though the reviewer wagon is complete"
lens: "functional.effectiveness"
statement: "minimize likelihood of operator-inaccessible-reviewer-surface by shipping `atdd coach review <N>` that spawns a reviewer-persona agent via the N1 adapter (no worktree mutation), waits for it to call `atdd agent review`, validates the resulting review-report.json, prints a summary, and exits nonzero on fail|concern so it can gate a merge pipeline"
acceptances:
  - identity:
      urn: "acc:review-phase-boundaries:E002-UNIT-001-pr-commit-resolution"
      id: "AC-UNIT-001"
      purpose: "atdd coach review <PR-N> resolves the PR to its head commit via `gh pr view` and uses that commit as the review target"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A PR number is passed as the positional argument"
        - "`gh pr view <N> --json headRefOid` returns a JSON payload with a headRefOid field"
    when:
      abstract: "The operator runs `atdd coach review <PR-N>`"
    then:
      abstract:
        - "The resolved commit SHA equals the headRefOid returned by gh"
        - "The reviewer is spawned with --target-commit set to the resolved SHA"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:review-phase-boundaries:E002-UNIT-002-commit-flag-variant"
      id: "AC-UNIT-002"
      purpose: "atdd coach review --commit <sha> works on any commit without invoking gh"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The operator passes --commit <sha> instead of a PR number"
    when:
      abstract: "The operator runs `atdd coach review --commit <sha>`"
    then:
      abstract:
        - "The reviewer is spawned with --target-commit <sha> directly, with no gh invocation"
        - "The command exits 0 on a pass verdict"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:review-phase-boundaries:E002-UNIT-003-no-llm-registry-error"
      id: "AC-UNIT-003"
      purpose: "atdd coach review with no LLM_REGISTRY entries prints a clear human-readable error and exits nonzero without crashing"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "judge.LLM_REGISTRY is empty (no production clients registered)"
    when:
      abstract: "The operator runs `atdd coach review --commit <sha>`"
    then:
      abstract:
        - "The command prints a message containing 'no LLM clients configured' and a reference to docs/MODELS.md"
        - "The command exits nonzero (rc != 0)"
        - "No exception traceback is printed"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:review-phase-boundaries:E002-UNIT-004-exit-code-on-fail-concern"
      id: "AC-UNIT-004"
      purpose: "atdd coach review exits 0 on pass verdict and nonzero on fail or concern verdicts so it can be wired into a merge gate"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A reviewer report with verdict=pass | fail | concern is pre-written to the reviewer agent's reviews/ directory"
    when:
      abstract: "The operator runs `atdd coach review --commit <sha>`"
    then:
      abstract:
        - "verdict=pass  → exit code 0"
        - "verdict=fail  → exit code 1"
        - "verdict=concern → exit code 2"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
  - identity:
      urn: "acc:review-phase-boundaries:E002-UNIT-005-output-json"
      id: "AC-UNIT-005"
      purpose: "atdd coach review --output json prints the validated review-report.json payload to stdout"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A conforming reviewer report with verdict=pass is pre-written"
    when:
      abstract: "The operator runs `atdd coach review --commit <sha> --output json`"
    then:
      abstract:
        - "stdout contains valid JSON that parses to a dict"
        - "The parsed dict contains the review_id, verdict, and summary fields from the original report"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-12"
