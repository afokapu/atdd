urn: "wmbt:review-phase-boundaries:E005"  # atdd:suppress(planner.wmbt.must-have-smoke-acceptance) UNTIL=2026-11-19
step: "execute"
direction: "minimize"
dimension: "likelihood"
object_of_control: "reviewer-not-invoked-at-pre-complete-boundary-by-default"
context_clarifier: "when an operator runs a plain `atdd coach <N>` with no flags, `--review-phases` defaults to an empty set and no reviewer is ever spawned, meaning the implementation is shipped to COMPLETE with zero adversarial review of whether it satisfies the issue acceptances; the reviewer machinery exists (handlers/reviewer.py, review-report.json) but is silently inert unless the operator explicitly passes `--review-phases refactor`; the safe behaviour is opt-out not opt-in"
lens: "functional.effectiveness"
statement: "minimize likelihood of reviewer-not-invoked-at-pre-complete-boundary-by-default by changing the `--review-phases` argparse default from an empty set to {\"refactor\"} so a plain `atdd coach <N>` always spawns a reviewer at the pre-COMPLETE boundary, keeping `--skip-review` as the explicit opt-out and `--review-phases` as the explicit override for adding or removing review at other boundaries"
acceptances:
  - identity:
      urn: "acc:review-phase-boundaries:E005-UNIT-001-parse-cli-defaults-review-phases-to-refactor"
      id: "AC-UNIT-001"
      purpose: "parse_cli with no --review-phases flag produces review_phases == {\"refactor\"}"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The atdd coach CLI parser built by _build_parser()"
        - "No --review-phases flag is passed on the command line"
    when:
      abstract: "parse_cli(['999']) is called with a bare issue number and no review-phases flag"
    then:
      abstract:
        - "The returned Config has review_phases == {\"refactor\"}"
        - "The returned Config has skip_review == False"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-19"
  - identity:
      urn: "acc:review-phase-boundaries:E005-UNIT-002-skip-review-bypasses-default"
      id: "AC-UNIT-002"
      purpose: "parse_cli with --skip-review sets skip_review=True regardless of default review_phases"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The atdd coach CLI parser"
        - "Only --skip-review is passed; no --review-phases flag"
    when:
      abstract: "parse_cli(['999', '--skip-review']) is called"
    then:
      abstract:
        - "The returned Config has skip_review == True"
        - "The reviewer handler returns NOOP for the REFACTOR boundary (because skip_review is honoured)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-19"
  - identity:
      urn: "acc:review-phase-boundaries:E005-UNIT-003-explicit-review-phases-override"
      id: "AC-UNIT-003"
      purpose: "parse_cli with --review-phases green,smoke overrides the default and uses exactly that set"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "The atdd coach CLI parser"
        - "--review-phases green,smoke is passed explicitly"
    when:
      abstract: "parse_cli(['999', '--review-phases', 'green,smoke']) is called"
    then:
      abstract:
        - "The returned Config has review_phases == {\"green\", \"smoke\"}"
        - "The value does not include \"refactor\" (the override replaces the default, not augments it)"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-19"
  - identity:
      urn: "acc:review-phase-boundaries:E005-INTEGRATION-001-reviewer-fires-at-refactor-boundary-by-default"
      id: "AC-INTEGRATION-001"
      purpose: "With the default review_phases={\"refactor\"}, the reviewer handle() returns HANDLED at the REFACTOR boundary"
      phase: "GREEN"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A CoachContext built from the default parse_cli output (review_phases={\"refactor\"}, skip_review=False)"
        - "A fake _spawn_reviewer that is a no-op and a fake _wait_for_review_report that returns a pass report"
    when:
      abstract: "reviewer.handle(ctx, Transition(src=Phase.REFACTOR, dst=Phase.COMPLETE)) is called"
    then:
      abstract:
        - "The result is HandlerResult.HANDLED (the reviewer ran and returned a pass verdict)"
        - "A reviewer manifest is written under .atdd/runtime/agents/"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-05-19"
