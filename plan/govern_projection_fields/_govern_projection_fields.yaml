wmbt:
  C001: minimize likelihood of a policy-coverage-gap surviving authoring, by rejecting
    a field-ownership policy that omits any projection schema field or names a writer
    outside the declared writer set
  C002: minimize likelihood of a merge-matrix-blind-spot, by exercising every ownership
    merge rule against every divergence case (identical, no-op, evidence-backed, unsafe)
    in the merge-driver test matrix
  D001: maximize likelihood of a machine-readable field-ownership-policy that names,
    for every projection field, its single legal writer and its merge rule, so the
    field-writer validator and the merge driver read one declared source instead of
    prose
  D002: maximize likelihood of single-owner-body-rule-computability by carrying owner_actor
    and last_lifecycle_actor on the projection object, so the field-writer validator
    can accept or reject a body edit and the merge driver can explain a conflict
  E001: minimize likelihood of a wrong-writer-field-change reaching main, by failing
    CI when a human commit mutates external_refs or an extension bot commit mutates
    a lifecycle field owned by core
  E002: maximize likelihood of a safe-projection-merge completing without operator
    intervention when the two sides are identical, one side is a strict no-op, or
    the further phase carries verifiable evidence for every skipped gate
  K001: minimize likelihood of a tombstoned-object-resurrection, by recording retirement
    as state TOMBSTONED with a reason digest, never deleting the projection file,
    and refusing any later merge that revives the uid
  R001: maximize likelihood of an unsafe-merge-conflict being raised with an actionable
    report naming the field, both sides' writers, and the failing ownership or evidence
    rule, never resolved by blind max phase
  total: 8
