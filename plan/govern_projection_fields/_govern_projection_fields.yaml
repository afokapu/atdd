action: resolves every touched projection field to its single declared writer and
  merge rule, rejects a diff whose committing writer does not own a touched field,
  auto-merges only identical, no-op, or evidence-backed same-object divergence, and
  records retirement as a non-deletable tombstone
context: merging-two-branches-that-touched-the-same-per-uid-projection-object, and
  validating a pushed projection diff against the writer identity carried by its commit
  trailers
description: Field ownership and safe conflicts for the committed projection (M4).
  Declares, as machine-readable data, the single legal writer and merge rule of every
  projection field; enforces that declaration in CI with a field-writer validator;
  implements a projection merge driver that auto-merges disjoint objects and the three
  safe same-object cases while conflicting with an actionable report on everything
  else; proves the driver with an ownership-class by divergence-case test matrix;
  and makes retirement a tombstone record that no later merge can resurrect. Prevents
  same-object and wrong-writer corruption of the shared source of truth.
features:
- urn: feature:govern-projection-fields:define-field-ownership
- urn: feature:govern-projection-fields:validate-field-writer
- urn: feature:govern-projection-fields:merge-projection-objects
- urn: feature:govern-projection-fields:verify-merge-matrix
- urn: feature:govern-projection-fields:mark-object-tombstone
- urn: feature:govern-projection-fields:define-actor-ownership
goal: prevent same-object and wrong-writer corruption of the committed projection,
  so the shared source of truth stays trustworthy without an operator adjudicating
  every merge
name: Govern Projection Fields
outcome: disjoint objects merge cleanly; unsafe same-object conflicts block with a
  report naming the field, both writers, and the failing rule; wrong-writer field
  changes fail CI; tombstoned objects never resurrect
