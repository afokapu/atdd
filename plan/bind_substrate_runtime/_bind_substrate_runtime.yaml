    contract: null
    telemetry: null
    to: external
  - name: commons:bind:binding-cli
    contract: null
    telemetry: null
    to: external

consume: []

wmbt:
  total: 7
  D001: "maximize likelihood of a schema-valid binding plan by defining one canonical JSON schema for `.atdd/binding.lock.yaml` (which conventions are bound-owned vs legacy-fallback, keyed by the substrate-lock digest) and validating it before use"
  L001: "maximize likelihood of loading exactly the live substrate by loading only `enabled` packages from the lock by installed_path and indexing implementations by realizes_convention, never loading a disabled or lock-absent package"
  C001: "minimize likelihood of executing a tampered or unlocked package by re-verifying each package's sha256 digest against the lock before loading and refusing on mismatch — bind is the first layer that runs admitted code"
  C002: "minimize likelihood of binding an implementation to an incompatible workspace by refusing when the implementation contract_version is not SemVer-compatible with the targeted provider's contract_version, or the targeted provider is absent or not enabled in the lock"
  E001: "maximize likelihood of isolated, import-clean execution by provider-spawning the implementation entrypoint as a subprocess in the resolved workspace instance and capturing Violations over the violation-output-contract, so core imports no extension code"
  E002: "maximize likelihood of correct gating by routing bound Violations into the disposition gate with deterministic precedence, so a bound implementation shadows the matching legacy validator for the same convention and gates a lifecycle transition exactly like a legacy validator"
  M001: "minimize likelihood of a silent bind failure by detecting a bound implementation that crashes, times out, or emits malformed output and falling back to legacy gating, surfaced loudly — never silently passing the gate (fail-safe, not fail-open)"
