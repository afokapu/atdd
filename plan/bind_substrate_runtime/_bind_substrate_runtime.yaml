wagon: bind-substrate-runtime
urn: "wagon:bind-substrate-runtime"
name: "Bind ATDD Substrate Runtime"
description: "The ATDD substrate runtime back end: the binder that turns a locked, inert `.atdd/substrate.lock.yaml` into running, gating capabilities. Admission (`admit-substrate`) installs packages but never executes them; this wagon is the first layer that runs admitted code. It loads enabled packages from the lock by `installed_path`, re-verifies each package's sha256 digest against the lock before loading (the tamper boundary), composes the capability graph and indexes implementations by `realizes_convention`, selects which bound capabilities apply to a given lifecycle phase + blast radius, resolves the workspace each implementation targets (SemVer contract check + materialized workspace instance), and executes the implementation via PROVIDER-SPAWN (a subprocess in the provider's runtime — core imports no extension code) to produce Violations. Those Violations are normalized into core's disposition gate so a bound implementation gates a lifecycle transition exactly like a legacy validator, SHADOWING the matching legacy validator for the same convention; on any bind failure (digest mismatch, contract mismatch, crash, timeout, malformed output) gating FALLS BACK to legacy, loudly logged — never fail-open. The binding plan is cached in `.atdd/binding.lock.yaml`, digest-keyed off the substrate lock for reproducibility. The public surface is two commands: `atdd capabilities` (render which conventions are bound-owned vs legacy-fallback) and `atdd bind --check` (compose the plan, dry-run, never execute). Distinct from `admit-substrate`, which ADMITS external artifacts non-executing (subject operator, runtime never runs); this wagon BINDS and EXECUTES locked artifacts. The third and final substrate stage: author → admit → bind."
theme: commons

subject: "agent:operator"
context: "admit-substrate-installs-packages-into-a-locked-but-inert-substrate, capabilities-cannot-gate-anything-until-something-binds-the-lock-to-behavior"
action: "loads enabled packages from `.atdd/substrate.lock.yaml` by installed_path, re-verifies each package's sha256 digest against the lock before loading, composes the capability graph and indexes implementations by realizes_convention, selects applicable capabilities for a lifecycle phase + blast radius, resolves the targeted workspace (SemVer contract check + materialized instance), provider-spawns the implementation entrypoint as an isolated subprocess to produce Violations, and routes them into the disposition gate — shadowing the matching legacy validator on success and falling back to legacy on any failure"
goal: "move gating out of core into admitted packages, executed reproducibly and in subprocess isolation with core importing no extension code, so a locked capability can gate a lifecycle transition exactly like a legacy validator while any bind failure fails safe to legacy"
outcome: "enabled substrate becomes live gating capability driven entirely from `.atdd/substrate.lock.yaml`, with a cached digest-keyed `.atdd/binding.lock.yaml`, `atdd capabilities` / `atdd bind --check` surfaces, and a loud legacy-fallback path — never executing a tampered or contract-incompatible package and never failing open"

features:
  - urn: "feature:bind-substrate-runtime:substrate-binding"

