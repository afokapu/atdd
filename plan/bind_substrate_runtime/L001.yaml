urn: "wmbt:bind-substrate-runtime:L001"
step: "locate"
direction: "maximize"
dimension: "likelihood"
object_of_control: "enabled-package-loading"
context_clarifier: "binding loads only what the lock says is live: it reads `.atdd/substrate.lock.yaml`, takes each artifact whose `enabled` is true, loads it from its recorded `installed_path`, and indexes the implementations it ships by their `realizes_convention` — a package that is absent from the lock, or present but disabled, must never be loaded or indexed, so the bound capability set is exactly the locked-and-enabled set and core never picks up an arbitrary on-disk package"
lens: "functional.effectiveness"
statement: "maximize likelihood of correct enabled-package-loading by loading only `enabled` lock artifacts from their installed_path and indexing the implementations they ship by realizes_convention, never loading a disabled or lock-absent package"
acceptances:
  - identity:
      urn: "acc:bind-substrate-runtime:L001-UNIT-001-load-enabled-only"
      id: "AC-UNIT-001"
      purpose: "loading a lock with one enabled and one disabled extension loads only the enabled package and indexes its implementations by realizes_convention; an on-disk package absent from the lock is ignored"
      phase: "GREEN"
    harness:
      type: "unit"
      category: "backend"
    given:
      abstract:
        - "A temp project with `.atdd/substrate.lock.yaml` listing two extensions (one enabled, one disabled) installed under their installed_path, each shipping an implementation manifest with a realizes_convention, plus a third extension present on disk but absent from the lock"
    when:
      abstract: "the lock-loader loads enabled packages and indexes their implementations by realizes_convention"
    then:
      abstract:
        - "only the enabled extension's package is loaded"
        - "its implementations are indexed by their realizes_convention"
        - "the disabled extension is not loaded"
        - "the lock-absent on-disk extension is not loaded or indexed"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-19"
  - identity:
      urn: "acc:bind-substrate-runtime:L001-SMOKE-001-load-real-github"
      id: "AC-SMOKE-001"
      purpose: "loading a real admitted substrate (the github extension + python-pytest provider, admitted by `atdd add`) loads the enabled packages from their installed_path and indexes the real github implementations by realizes_convention"
      phase: "SMOKE"
    harness:
      type: "integration"
      category: "backend"
    given:
      abstract:
        - "A temp project where the real github extension and the python-pytest workspace provider have been admitted via `atdd add` (a real `.atdd/substrate.lock.yaml` with enabled artifacts under installed_path)"
    when:
      abstract: "the binding lock-loader loads enabled packages from the real lock and indexes implementations by realizes_convention"
    then:
      abstract:
        - "the github extension and python-pytest provider are loaded from their installed_path"
        - "the real github implementations are indexed under their realizes_convention values"
        - "no implementation code is imported or executed during loading and indexing"
    metadata:
      author: "atdd:self-compliance"
      created: "2026-06-19"
