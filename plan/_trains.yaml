trains:
  self-compliance:
    nominal:
    - train_id: train:self-compliance:validate-lifecycle
      category: nominal
      description: 'Validate lifecycle train: planner defines plans, tester verifies
        contracts, coder implements, coach governs'
      path: plan/_trains/self-compliance/validate-lifecycle.yaml
      wagons:
      - define-plans
      - verify-contracts
      - implement-code
      - govern-lifecycle
      - self-compliance-migration
      - security-patterns
      - enforce-structured-logging
      - validate-conventions
      - enforce-binding-plan
  issue-lifecycle:
    nominal:
    - train_id: train:issue-lifecycle:drive-state-machine
      category: nominal
      description: "Replace polling-and-trust with an event-driven, observer-augmented\
        \ coach that drives the issue \u2192 merged-PR lifecycle (per atdd-coach-spec-v9.md).\
        \ Absorbs valuable machinery from atdd orchestrate and atdd babysit; introduces\
        \ durable state, two-tier verification, six judge call sites, and pre-coach\
        \ issue review."
      path: plan/_trains/issue-lifecycle/drive-state-machine.yaml
      wagons:
      - freeze-runtime-contracts
      - drive-state-machine
      - observe-and-correct
      - dispatch-validators
      - review-phase-boundaries
      - judge-ambiguous-decisions
      - discover-and-decommission
      - integrate-end-to-end
      - integration-hardening
      - coach-ops
      - coach-wave-orchestration
      - dispatch-ux-defaults-and-primer
      - coach-verb-split
    - train_id: train:issue-lifecycle:record-agent-session-identity
      description: "Record which agent session worked which work_item by reading ambient\
        \ environment at two mandatory chokepoints \u2014 `atdd author issue` (creator)\
        \ and the packaged `post-commit` hook (participant) \u2014 storing provider-tagged\
        \ opaque session refs in `external_refs` with recency in `data.last_seen_at`\
        \ and the worktree path per participation. The agent-kind \u2192 session-env-var\
        \ mapping lives in a convention YAML so core never learns a provider, and\
        \ no role is ever stored: orchestrator vs worker is inferred at read time\
        \ from the worktree paths a session participated in."
      path: plan/_trains/issue-lifecycle/record-agent-session-identity.yaml
      wagons:
      - isolate-provider-boundary
      - author-atdd-substrate
      - drive-state-machine
      - project-shared-state
      category: nominal
  substrate:
    nominal:
    - train_id: train:substrate:admit-packages
      category: nominal
      description: "Admission substrate train: the front door that admits external\
        \ extension/workspace packages into a project \u2014 define the substrate/lock/registry\
        \ schemas, read registries, resolve+validate+compose an artifact against core,\
        \ then install it into a versioned home with a sha256 digest and a lockfile,\
        \ all without executing any runtime implementation. Sibling to the author-substrate\
        \ train; runtime binding is a later train."
      path: plan/_trains/substrate/admit-packages.yaml
      wagons:
      - admit-substrate
    - train_id: train:substrate:author-artifacts
      category: nominal
      description: 'Authoring substrate train: define canonical schemas + flat homes,
        validate author input on a shared spine, then deterministically write the
        four governance artifact kinds (convention-node, relationship, scope, gate)
        so authored artifacts pass normal ATDD validation unmodified.'
      path: plan/_trains/substrate/author-artifacts.yaml
      wagons:
      - author-atdd-substrate
      - author-plan-substrate
    - train_id: train:substrate:bind-runtime
      category: nominal
      description: "Binding substrate train: the runtime back end that turns a locked,\
        \ inert .atdd/substrate.lock.yaml into running, gating capabilities. Define\
        \ a binding-plan schema, load enabled packages from the lock by installed_path,\
        \ re-verify each package's sha256 digest before loading, compose the capability\
        \ graph and index implementations by realizes_convention, refuse contract-incompatible\
        \ bindings, then provider-spawn the implementation as an isolated subprocess\
        \ and route its Violations into the disposition gate \u2014 shadowing legacy\
        \ on success and failing safe to legacy on any failure. The third and final\
        \ substrate stage, downstream of the author-substrate and admit-substrate\
        \ trains; this is the binding train the admit-substrate train explicitly defers\
        \ to."
      path: plan/_trains/substrate/bind-runtime.yaml
      wagons:
      - bind-substrate-runtime
  extension-conventions:
    nominal:
    - train_id: train:extension-conventions:enforce-extension-conventions
      category: nominal
      description: 'Enforce extension conventions as a CI gate: every gating node
        is realized by a detector, bound, and reports no strict violation.'
      path: plan/_trains/extension-conventions/enforce-extension-conventions.yaml
      wagons:
      - bind-extension-conventions
      - enforce-conventions-ci
      - govern-providers
      - govern-registry
      - reconcile-dispositions
      - verify-enforcement
    alternate:
    - train_id: train:extension-conventions:decommission-orphan-detector
      category: alternate
      description: 'An implementation is bound to a convention_id no node declares:
        a mechanism enforcing an obligation nobody wrote down.'
      path: plan/_trains/extension-conventions/decommission-orphan-detector.yaml
      wagons:
      - bind-extension-conventions
      - govern-providers
    - train_id: train:extension-conventions:detect-succession-loss
      category: alternate
      description: 'A gating node is unbound and its core twin has been deleted: enforcement
        has actually vanished and the guard must block.'
      path: plan/_trains/extension-conventions/detect-succession-loss.yaml
      wagons:
      - guard-succession
      - verify-enforcement
    - train_id: train:extension-conventions:detect-unbound-declaration
      category: alternate
      description: 'A gating node is realized by a detector but absent from the lock
        while its core twin still enforces it: latent hole, reported.'
      path: plan/_trains/extension-conventions/detect-unbound-declaration.yaml
      wagons:
      - bind-extension-conventions
      - reconcile-dispositions
    - train_id: train:extension-conventions:detect-unrealized-obligation
      category: alternate
      description: 'A gating node is declared but no provider implementation realizes
        it: an obligation nobody can check.'
      path: plan/_trains/extension-conventions/detect-unrealized-obligation.yaml
      wagons:
      - bind-extension-conventions
      - govern-providers
    - train_id: train:extension-conventions:enforce-strict-failure
      category: alternate
      description: A strict convention node reports at least one violation, so the
        enforce job exits non-zero and CI fails.
      path: plan/_trains/extension-conventions/enforce-strict-failure.yaml
      wagons:
      - enforce-conventions-ci
      - verify-enforcement
    - train_id: train:extension-conventions:report-advisory-violation
      category: alternate
      description: An advisory convention node reports violations; they are surfaced
        in the report and the job still passes.
      path: plan/_trains/extension-conventions/report-advisory-violation.yaml
      wagons:
      - enforce-conventions-ci
      - verify-enforcement
  coach:
    nominal:
    - train_id: train:coach:place-worktrees
      description: 'Worktree-placement train: turn seven independent worktree-path
        derivations into one config-backed resolver, so an operator chooses the repo
        layout once via worktree_root and both creation paths, the spawned-agent launch
        prompt, and the orphan scanner agree on it. Default is the current flat-sibling
        layout, so an upgraded repo that configures nothing sees no change. Carries
        the transactional self-relocation offer. Standalone by design: it shares no
        wagon with another train, so its validation blast radius is this wagon alone.'
      path: plan/_trains/coach/place-worktrees.yaml
      wagons:
      - place-worktrees
      category: nominal
  documentation-obligation:
    alternate:
    - train_id: train:documentation-obligation:proceed-without-capability
      description: 'Alternate-path train (category: alternate): no documentation capability
        is registered on the atdd.documentation entry-point group, so there is genuinely
        nothing to judge. The verdict is NOT_APPLICABLE and the lifecycle proceeds.
        This is the route that keeps core''s documentation contract from conscripting
        a consumer that installed no documentation extension, and it is deliberately
        distinct from the nominal route: no capability was consulted.'
      path: plan/_trains/documentation-obligation/proceed-without-capability.yaml
      wagons:
      - govern-documentation-obligation
      - govern-lifecycle
      category: alternate
    nominal:
    - train_id: train:documentation-obligation:prove-documentation-obligation
      description: 'Nominal-path train (category: nominal): the documentation obligation
        is declared at Ratify, registered as an owned projection field, projected
        one-way into the issue body, discharged in the implementation worktree, and
        verified at COMPLETE and again at merge. The installed documentation capability
        returns PASS and accepted software enters main with its accepted documentation.
        This is the journey the other three routes diverge from.'
      path: plan/_trains/documentation-obligation/prove-documentation-obligation.yaml
      wagons:
      - define-plans
      - govern-projection-fields
      - author-atdd-substrate
      - govern-documentation-obligation
      - govern-lifecycle
      - enforce-merge-authority
      category: nominal
    exception:
    - train_id: train:documentation-obligation:remediate-undischarged-obligation
      description: "Exception-path train (category: exception): the obligation was\
        \ declared and the capability observed that it was not discharged \u2014 a\
        \ declared artifact is missing from the change set, or the authored documentation\
        \ violates the installed policy. The verdict is FAIL. The transition is refused\
        \ and the work returns to the implementation worktree, which is where documentation\
        \ is authored; COMPLETE verifies, it does not author."
      path: plan/_trains/documentation-obligation/remediate-undischarged-obligation.yaml
      wagons:
      - govern-documentation-obligation
      - govern-lifecycle
      - enforce-merge-authority
      category: exception
    error:
    - train_id: train:documentation-obligation:restore-obligation-observability
      description: "Error-path train (category: error): a documentation capability\
        \ is installed and ran to completion but could not answer \u2014 its toolchain\
        \ is absent, the documentation tree is unreadable, or a render failed in a\
        \ way it cannot attribute. The verdict is COULD_NOT_CHECK. This blocks, and\
        \ it is deliberately not the exception route: nothing was observed to be wrong,\
        \ so the remedy is to restore observability rather than to author documentation.\
        \ Conflating this with a pass is the defect class #1745, #1774 and #1716 record."
      path: plan/_trains/documentation-obligation/restore-obligation-observability.yaml
      wagons:
      - govern-documentation-obligation
      - govern-lifecycle
      category: error
  object-conflict-resolution:
    nominal:
    - train_id: train:object-conflict-resolution:project-state
      description: 'State projection train: make the committed deterministic projection
        the shared source of truth, the local SQLite store a private authoring workspace,
        git history plus structured ATDD trailers the audit log, and CI the merge
        authority. Core becomes git-native and provider-free; GitHub Issues becomes
        a non-authoritative human mirror implemented as an extension. Builds the projection
        spine, the reconcile spine with an explicit overlay event log, CI legal-transition
        authority, field ownership and safe conflicts, the provider seam, and the
        manifest-to-projection migration.'
      path: plan/_trains/object-conflict-resolution/project-state.yaml
      wagons:
      - project-shared-state
      - reconcile-local-store
      - enforce-merge-authority
      - govern-projection-fields
      - isolate-provider-boundary
      - migrate-projection-authority
      category: nominal
    alternate:
    - train_id: train:object-conflict-resolution:reconcile-dirty-store
      description: "Alternate-path train (category: alternate): the HEAD-change reconcile\
        \ flow when the local store is DIRTY \u2014 uncommitted overlay events exist.\
        \ Instead of a plain hydrate-overwrite, the store is backed up, the incoming\
        \ projection is hydrated into a public baseline, the explicit overlay events\
        \ are replayed on top, affected objects are re-projected, and store_base_commit\
        \ advances. An invalid replay stops with a conflict report and keeps the backup.\
        \ This is invariant I5: reconcile is not overwrite."
      path: plan/_trains/object-conflict-resolution/reconcile-dirty-store.yaml
      wagons:
      - reconcile-local-store
      category: alternate
    exception:
    - train_id: train:object-conflict-resolution:resolve-object-conflict
      description: "Exception-path train (category: exception): two branches change\
        \ the SAME projection object. Disjoint objects merge cleanly by UID sharding;\
        \ a same-object divergence is an EXPECTED failure handled gracefully \u2014\
        \ validity-gated, never resolved by blind max-phase. Auto-merge only when\
        \ the transitions are identical, one side is a strict no-op, or the further\
        \ phase carries verifiable evidence for every skipped gate. Otherwise the\
        \ merge driver conflicts by design and emits an actionable report (section\
        \ 7.2, section 11 'unsafe merges conflict by design')."
      path: plan/_trains/object-conflict-resolution/resolve-object-conflict.yaml
      wagons:
      - govern-projection-fields
      category: exception
