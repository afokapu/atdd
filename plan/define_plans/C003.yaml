urn: wmbt:define-plans:C003
step: confirm
direction: minimize
dimension: likelihood
object_of_control: confirm-lock-with-non-verb-object-wagon-name
context_clarifier: PlanSession.confirm refuses to lock when a kept wagon unit's slug
  is not verb-object (first kebab-case token absent from the convention verb lexicon,
  or a single-token slug), unless the whole slug is an explicit brand exception
lens: functional.effectiveness
statement: minimize likelihood of confirm-lock-with-non-verb-object-wagon-name by blocking
  Confirm when a kept wagon slug violates planner.wagon.name-is-verb-object
acceptances:
- identity:
    urn: acc:define-plans:C003-SMOKE-001-wagon-verb-object-blocks-at-confirm
    id: AC-SMOKE-001
    purpose: Confirm blocks a non-verb-object wagon name and locks a verb-object one
    phase: SMOKE
  harness:
    type: integration
    category: backend
  given:
    abstract:
    - a real repo checkout and the atdd CLI
    - a plan session at the Confirm step with one kept wagon unit
  when:
    abstract: the session attempts to confirm with wagon slug "mode-select"
  then:
    abstract:
    - confirm is refused (SessionGateError / non-zero) and the session stays unlocked
    - re-running with a verb-object slug "manage-users" locks the session
